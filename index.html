const regByName=name=>{const e=regFind(name);return e&&regLive(e)?e:null};
const regEntries=()=>regAll().filter(regLive);
const regStruck=()=>REG.entries.filter(e=>e&&!regLive(e));
function regWithdraw(name){
  if(penGuard())return;
  const e=regFind(name);if(!e||!regLive(e))return;
  e.withdrawnAt=e.updatedAt=new Date().toISOString();e.by=activeName();
  REG.dirty=true;saveReg();schedulePush();
}
function regRestore(id){
  if(penGuard())return;
  const e=REG.entries.find(x=>x&&x.id===id);if(!e||regLive(e))return;
  e.restoredAt=e.updatedAt=new Date().toISOString();e.by=activeName();
  REG.dirty=true;saveReg();schedulePush();
}
const regSubstance=v=>v!=null&&v!=='';
const activeName=()=>(typeof SYNC!=='undefined'&&SYNC&&syncedHere()&&SYNC.name)||((userById(USERS.activeId)||{}).name||'');
// Upsert an entry. Sparse by default — a sighting fills blanks, never erases —
// so a fast cup log can't strip a rich entry. {full:true} (the café editor)
// overwrites the fields it carries. {at} backdates provenance to the record
// that named the café, so firstBy/firstAt stay honest when seeding history.
function regUpsert(name,fields,who,opts){
  name=String(name||'').trim(); if(!name)return null;
  opts=opts||{};
  const now=new Date().toISOString(),at=opts.at||now;
  let e=regFind(name),changed=false; // a struck entry is still the entry — fill it, never mint a twin beside it

  const r=new RegExp('(?:^|[^\\d.,])'+ALT_FIG+'\\s*(?:m|masl|msnm)?\\s*[–—-]\\s*'+ALT_FIG+ALT_UNIT,'i').exec(t);
  if(r){const b=[altNum(r[1]),altNum(r[2])].sort((x,y)=>x-y);if(altValid(b))return b}
  const s=new RegExp('(?:^|[^\\d.,])'+ALT_FIG+ALT_UNIT,'i').exec(t);
  if(s){const v=altNum(s[1]);if(altValid([v,v]))return[v,v]}
  return null;
}
// Blanks-only, exactly as lotSetRarity — and a second band that DISAGREES is carried, not resolved
// (PLATFORM.md's own worked example is altitude): the standing band never moves, the other line is
// appended with its author, and the page shows the seam. Picking between them is compile()'s rung
// comparator, a later pass; until it exists, first-stated stands and the disagreement stays visible
// rather than being silently dropped — which is the whole difference between a record and a claim.
function lotSetAltitude(lot,band,who,src){
  if(!lot||lot.role||!altValid(band))return null;
  // The standing band is read off the layered green, so a height the published copy already
  // states is a divergence to carry — not a blank the keeper's figure quietly overwrites.
  const w=lotOwn(lot),now=new Date().toISOString(),stamp=()=>{w.updatedAt=now;if(who)w.by=who;CAT.lots.dirty=true;saveDoc('lots')};
  const cur=altOf(lot);
  if(!cur){w.altitudeMasl=band;w.altitudeSrc=src||'keeper';w.altitudeBy=who||'';w.altitudeAt=now;stamp();return 'set'}
  if(cur[0]===band[0]&&cur[1]===band[1])return 'same';
  w.altitudeAlt=w.altitudeAlt||[];
  if((lot.altitudeAlt||[]).some(a=>a&&a.band&&a.band[0]===band[0]&&a.band[1]===band[1]))return 'same';
  w.altitudeAlt.push({id:uid(),band,src:src||'keeper',by:who||'',at:now});stamp();
  return 'diverged';
}
/* The resolved place, onto the green it describes (GEOCODE.md §4). lotSetAltitude's construction
 * exactly, and for the same reason: the first confirmation stands, a later one that DISAGREES is
 * carried beside it rather than resolved, and both are signed and dated. What it holds is not a
 * new claim about the coffee — it is the ladder a keeper confirmed on a map for the words their
 * own record already carried, which is what lets two greens spelling one town differently read as
 * one town (placeIndex) and what gives a grower an honest pin with no second lookup.
 *
 * It is NOT identity. It is outside lotKeyOf, outside the fingerprint, outside the grain: a green
 * whose town somebody confirmed on a map has not proved a finer rung than one whose keeper simply
 * typed it — confirming a spelling is not evidence about the coffee, and the ladder is never
 * rounded up by a lookup. The columns stay the record; this stays the reading over them. */
function lotSetPlace(lot,place,who){
  if(!lot||lot.role||!place||!place.ref)return null;
  const w=lotOwn(lot),now=new Date().toISOString(),stamp=()=>{w.updatedAt=now;if(who)w.by=who;CAT.lots.dirty=true;saveDoc('lots')};
  const p=Object.assign({},place,{by:who||'',at:now});
  const cur=lot.place;                              // read off the LAYERED green — a copy's chain is a divergence to carry, not a blank to fill
  if(!cur||!cur.ref){w.place=p;stamp();return 'set'}

  w.placeAlt=w.placeAlt||[];
  if((lot.placeAlt||[]).some(a=>a&&a.ref===p.ref))return 'same';
  w.placeAlt.push(Object.assign({id:uid()},p));stamp();

// The standing: the three axes, read side by side, never merged into one number. Traceability is
// the existing grain (RESOLVER §6) — reused here, not reinvented.
// Two harvests with no new evidence is old enough to say so. The threshold governs one SENTENCE
// and nothing else: no score moves, no axis dims, nothing sorts. Stating an age is not decaying it.
const STANDING_STALE_MS=18*30*864e5;
function lotTier(lot){
  if(!lot)return null;
  return {caliber:lotCaliberStanding(lot),rarity:lotRarityStanding(lot),traceability:{grain:lot.grain,read:grainRead(lot.grain)}};
}
// The producer node — the grower behind a lot's producer field, keyed by name+country so two
// growers sharing a name in different origins never collapse (the lot's timidity, one hand up).
// The ONLY origin actor flat data can seed: the old records carry no processor (washing-station)
// or aggregator (importer/exporter) field, so those catalogs stay honestly empty until a curator
// or the resolver (a later pass) names one — never a blank coerced into a fake node.
function catStampProducer(o,who,at){
  if(!regSubstance(o.producer))return null;
  return catUpsert('producers',catNorm(o.producer)+'|'+catNorm(o.originCountry),{name:o.producer,country:o.originCountry,region:o.originRegion,locality:o.originLocality},who,{at:at||null});
}
// The grower's own node — same kind, same key shape as the head's, classified by its own
// vocabulary and tagged at mint (blanks-only thereafter). A name that merely repeats the
// head is not a second actor and stamps nothing.
function catStampGrower(o,who,at){
  if(!regSubstance(o.grower)||normPlace(o.grower)===normPlace(o.producer||''))return null;
  return catUpsert('producers',catNorm(o.grower)+'|'+catNorm(o.originCountry),
    {name:o.grower,country:o.originCountry,region:o.originRegion,locality:o.originLocality,producerKind:growerKind(o.grower)},who,{at:at||null});
}
// The lot → grower edge, APPENDED: producerRefs is already plural ("a station lot has
// hundreds" — SCHEMA), and lotFields' blanks-only [pRef] must never be overwritten. Through
// lotOwn, so the edge lands on the own node and never on a published-copy read (READER.md §8).
function lotAddProducerRef(lot,pid){
  if(!lot||!pid)return;
  const w=lotOwn(lot);
  w.producerRefs=w.producerRefs||[];
  if(w.producerRefs.includes(pid))return;
  w.producerRefs.push(pid);w.updatedAt=new Date().toISOString();CAT.lots.dirty=true;saveDoc('lots');
}
function catSeed(){
  const srcs=USERS.users.map(u=>({who:u.name,led:readJSONLS(dataKey(u.id))}));
  remoteDirUsers().forEach(u=>{const c=readJSONLS(remoteKey(u.id));if(c&&c.ledger)srcs.push({who:u.name,led:c.ledger})});
  const jobs=[];
  srcs.forEach(s=>{const d=s.led;if(!d)return;
    (d.bags||[]).forEach(b=>{if(b)jobs.push({at:b.createdAt||'',who:s.who,type:'bag',r:b})});
    (d.cups||[]).forEach(c=>{if(c&&c.kind==='cafe'&&(regSubstance(c.roaster)||lotWorthy(c)))jobs.push({at:c.createdAt||'',who:s.who,type:'cup',r:c})});
    (d.authored||[]).forEach(a=>{if(a&&(regSubstance(a.roaster)||lotWorthy(a)))jobs.push({at:a.createdAt||'',who:s.who,type:'bag',r:a})}); // a curator's authored roast — roaster+lot+roast, no bag/cup, swept exactly as a bag (it carries a roast)
  });
  jobs.sort((a,b)=>String(a.at).localeCompare(String(b.at))).forEach(j=>{
    const r=j.r,o={at:j.at||null},who=j.who;
    let roaster=null,lot=null;
    if(regSubstance(r.roaster))roaster=catUpsert('roasters',catNorm(r.roaster),{name:r.roaster,site:r.site,palette:r.palette},who,o);
    else if(r.roasterRef)roaster=catNode('roasters',r.roasterRef); // flat gone legacy → resolve via the standing ref, so the roasts key below stays identical to catRepoint's
    if(recHardIds(r).some(h=>h.scheme==='kenya-outturn')){ // a Kenya outturn routes through the batch parent (RESOLVER §5) — bare → batch, graded → sibling
      lot=resolveOutturn(r,who,j.at);
      if(lot)lotAddHardIds(lot,recHardIds(r).filter(h=>h.scheme!=='kenya-outturn'),who,j.at);
    }
    else if(lotWorthy(r)){ // structured tokens, a loose free-text origin, OR a hard-ID (a bag printed with only an outturn is still a green)
      const p=catStampProducer(r,who,j.at);
      const g=catStampGrower(r,who,j.at);                                 // the second actor, swept exactly as the save path stamps it
      const res=resolveLot(r,r.id);                                       // the ladder; a boot sweep only ever reaches the auto rung (no interactive propose)
      lot=catUpsert('lots',res.key,lotFields(r,p&&p.id),who,o);           // a shared hard-ID / fingerprint binds to the standing lot ahead of the floor fork
      lotAddHardIds(lot,recHardIds(r),who,j.at);                          // accumulate the token onto the node, append-only
      lotRederive(lot,r);                                                 // grain is a rule's output, not an attestation — a sweep re-reads it rather than inheriting the first guess
      if(g&&lot)lotAddProducerRef(lot,g.id);                              // the grower's edge, appended beside the head's ref
      if(res.action==='auto'&&lot)lotBind(lot,r,'derived','fingerprint',{score:res.score,fields:res.fields},who,j.at); // record the inferred bind compile reads (decision #1)
    }
    else if(r.lotRef)lot=catNode('lots',r.lotRef); // flat origin gone legacy → resolve the lot via its standing ref, so the roasts key below stays identical to catRepoint's (mirror of the roaster fallback above)
    if(j.type==='bag'){
      const rk=[roaster?roaster.id:'',lot?lot.id:'',catNorm(r.name),r.roastDate||''].join('|');
      catUpsert('roasts',rk,{roasterRef:roaster?roaster.id:null,lotRef:lot?lot.id:null,offeringName:r.name,level:ROAST_LEVELS[r.roastLevel]||'',roastDate:r.roastDate,site:r.site,palette:r.palette},who,o);
    }

// Re-point the ledger onto the spine — migration step 2. Every bag and café cup
// gains the id of the catalog node it seeded (roasterRef/lotRef, +roastRef for a
// bag), stamped BESIDE the flat origin text, never over it: the words stay
// authoritative and every render/edit path still reads them. Purely additive, so
// it is reversible (drop the refs and nothing is lost) and idempotent (re-derived
// each boot from the SAME collapse keys catSeed used). A ref is a local derivation,
// not a keeper's edit — it never touches updatedAt, so sync sees no spurious push
// and a merge that drops one simply re-stamps next boot. Local users only; a
// read-only remote ledger is never mutated. Flat fields go inert (legacy) only in a
// later version, once the catalog is trusted and the UI reads through the refs.
const catRefsFor=r=>({

  // exactly as before). Flat roaster blank → fall back to the ref already standing, so a
  // record whose flat roaster has gone legacy keeps reading through its node instead of
  // being struck by the sweep. A genuinely-cleared record carries no ref (the save-time
  // stamp already struck it), so it stays struck; only a dangling ref (its node gone)
  // falls to null. A pure no-op on today's data — every ref-bearing record still has flat
  // text — this only takes effect once the flat field is nulled: the precondition for it.

function catRepoint(){

      // fall back to the standing roastRef — the mirror of catRefsFor's roaster/lot fallback. A
      // date still present recomputes the key (catching a re-dated roast); a genuinely date-less
      // bag with no ref yet still finds the empty-date node catSeed authored.
      const rk=d0=>[roaster?roaster.id:'',lot?lot.id:'',catNorm(b.name),d0].join('|');

      if([setRef(b,'roasterRef',roaster),setRef(b,'lotRef',lot),setRef(b,'roastRef',roast)].some(Boolean))changed=true;
    });

      const rk=d0=>[roaster?roaster.id:'',lot?lot.id:'',catNorm(a.name),d0].join('|');

      if([setRef(a,'roasterRef',roaster),setRef(a,'lotRef',lot),setRef(a,'roastRef',roast)].some(Boolean))changed=true;
    });

// Migration step 3 — the retirement. catRepoint stamped every bag and café cup with
// the id of its catalog node; catRetire now strikes the flat roaster + structured origin
// those nodes carry, so the lot node becomes the record's sole copy — the atlas, not the
// text, is where the green lives. Gated on a LIVE node (never null a field the catalog
// can't surface): a lot node is a faithful copy of the record's own fields, keyed by the
// full six-field fingerprint, so co-keyed records logged the same positions and lotRead/
// circleLot re-surface exactly what was struck, re-spelled to the atlas canonical. A café
// cup's loose free-text `origin` retires too — but only when it has NO structured fields, so
// its lot is the cup's own singleton (lot:<id>) carrying that one line, never a shared fp node
// where a co-keyed sibling could differ. A bag's name keeps its flat field.
// On a bag it also retires the flat roast level + roast date under a standing roast node (a café
// cup has no roast, so its strike is roaster + origin only).
// Like catRepoint this is a device-local normalisation — deterministic, idempotent,
// re-derived each boot — so it never bumps updatedAt or marks the ledger dirty:
// mergeColl's local-wins-on-tie shields a retired record from an equal-timestamp flat
// remote, and a genuine remote edit (newer) legitimately re-fills the words. It rides
// the next real edit's push like the refs do; a stale device reading the server's flat
// copy still reads correctly, and an up-to-date device re-retires it at its own boot.
// Local users only; a read-only remote ledger is never mutated. This is the irreversible
// step: once the text is struck, the node is the only copy — clearing the ref reverts
// nothing (unlike catRepoint). It runs only after catSeed + catRepoint have stood a node
// under every ref.
function catRetire(){

    if(r.roasterRef&&catNode('roasters',r.roasterRef)&&regSubstance(r.roaster)){r.roaster='';hit=true} // roaster node stands → the text retires
    const lotN=r.lotRef&&catNode('lots',r.lotRef);

    if(r.roastRef&&catNode('roasts',r.roastRef)){ // roast node stands → the flat roast level (index 0 is unset) + roast date retire; a café cup carries no roastRef, so this fires on bags alone
      if(regSubstance(ROAST_LEVELS[r.roastLevel])){r.roastLevel=0;hit=true}
      if(regSubstance(r.roastDate)){r.roastDate='';hit=true}
    }
    return hit;
  };

    const d=readJSONLS(dataKey(u.id)); if(!d)return; let changed=false;
    (d.bags||[]).forEach(b=>{if(strike(b))changed=true});
    (d.cups||[]).forEach(c=>{if(c&&c.kind==='cafe'&&strike(c))changed=true}); // café cups only — a home cup's beans live on its bag
    if(changed)try{localStorage.setItem(dataKey(u.id),JSON.stringify(d))}catch(e){} // write back only a ledger that actually changed — a re-run is a clean no-op
  });

}
// The write-path half of the repoint: author a record's roaster node the moment the
// record is saved, not only at the next boot sweep. Same upsert catSeed makes, keyed
// identically, so it stays idempotent with the boot pass (blanks-only, earliest
// provenance via {at}); it just lands the node and stamps the ref now, so a freshly
// logged bag or café cup reads through its roaster this session instead of next boot.
// Additive and reversible — the flat roaster stays authoritative; this only lifts the
// derivation earlier. A blank roaster clears the ref. The precondition for the flat
// field ever going legacy: the node no longer waits on a reboot to exist.
// `city` rides only where a record carries one (a curator's authored roast — rec.roasterCity) — blanks-only,
// so a bag/café cup, which names no roaster city, never strikes it. Displayed on the roaster's node page; the
// atlas geocodes it to a city point (never finer). lat/lon are stamped by atlasGeoFill, not here.
function catStampRoaster(rec){
  if(!rec)return;
  const n=regSubstance(rec.roaster)?catUpsert('roasters',catNorm(rec.roaster),{name:rec.roaster,site:rec.site,palette:rec.palette,city:rec.roasterCity},activeName(),{at:rec.createdAt||null}):null;
  setRef(rec,'roasterRef',n);

// The lot's write-path half, the mirror of catStampRoaster: author a record's lot
// node the moment it is saved, keyed by lotKeyOf exactly as catSeed/catRefsFor, so
// it stays idempotent with the boot sweep (blanks-only, earliest provenance via
// {at}); it just lands the node and stamps lotRef now, so a freshly logged bag or
// café cup reads through its lot this session instead of next boot. Additive and
// reversible — the flat origin stays authoritative; this only lifts the derivation
// earlier. A record with neither structured origin nor a loose free-text one clears the
// ref. The precondition for the flat origin ever going legacy: the node no longer waits on
// a reboot.

// candidate (§4). Reads recOrigin (node-first fallback), so it re-runs cleanly after retirement.

  // A café cup's loose free-text origin, with no structured fields, is homed on the cup's own
  // singleton lot (lotKeyOf forks to lot:<id>) — never on a shared fp-keyed lot, so node-first
  // reads and the retirement strike can never surface one cup's origin onto a co-keyed sibling.
  const worthy=struct||regSubstance(o.origin)||!!recHardIds(rec).length; // a hard-ID alone is worth a green too (a bag printed with only an outturn)

  // batch, a graded token to its sibling — built here, never re-keying a token already entered.

// The roast's write-path half — the bag's third stamp, run beside catStampRoaster and

// it is saved, keyed EXACTLY as catSeed/catRepoint (roaster.id | lot.id | name | roastDate),
// and stamps roastRef, so a fresh bag reads its roast through the spine this session, not next
// boot — the precondition for nulling the flat roast fields on save. Stable fields fill
// blanks-only (earliest provenance via {at}), but `level` is written THROUGH: it is a mutable
// property with no place in the key, so a keeper's re-grade must land on the node itself or it
// would be lost the moment the flat field retires (last local writer holds, as the café editor
// overwrites shared café fields). Bags only — a café cup has no roast.

/* ---- Gear — the canonical grinder/brewer model, the key the brew corpus will one day
 * aggregate on. Seeded from every Setup's free-text grinder/brewer; maker/model can't be
 * split from free text, so `model` carries the whole string and `maker`/`methodClass` read
 * unread (a later pass classifies them). A Setup keeps its own grind scale — grind is only
 * comparable within one Setup, invariant — and merely gains grinderRef/brewerRef, the edges
 * to the shared model. Keyed by kind+name so a grinder and a brewer sharing a string never
 * collapse. The Setup is how one keeper's dial moves; Gear is what transfers.
 * SCHEMA wrote the grinder/brewer distinction as `kind`, but the envelope already owns `kind`
 * for the entity type ('gear'); the field is named `gearKind` here to avoid that collision. ---- */
function catStampGear(s){
  if(!s)return;
  const g=regSubstance(s.grinder)?catUpsert('gear','grinder:'+catNorm(s.grinder),{gearKind:'grinder',model:s.grinder},activeName(),{at:s.createdAt||null}):null;
  const b=regSubstance(s.brewer)?catUpsert('gear','brewer:'+catNorm(s.brewer),{gearKind:'brewer',model:s.brewer},activeName(),{at:s.createdAt||null}):null;

// Boot sweep: seed Gear from every readable ledger's Setups, chronologically so the earliest
// naming holds provenance — the regSeed/catSeed move, one collection over.
function catSeedGear(){
  const srcs=USERS.users.map(u=>({who:u.name,led:readJSONLS(dataKey(u.id))}));
  remoteDirUsers().forEach(u=>{const c=readJSONLS(remoteKey(u.id));if(c&&c.ledger)srcs.push({who:u.name,led:c.ledger})});
  const jobs=[];
  srcs.forEach(s=>{(s.led&&s.led.setups||[]).forEach(st=>{if(st)jobs.push({at:st.createdAt||'',who:s.who,s:st})})});
  jobs.sort((a,b)=>String(a.at).localeCompare(String(b.at))).forEach(j=>{const s=j.s,o={at:j.at||null},who=j.who;
    if(regSubstance(s.grinder))catUpsert('gear','grinder:'+catNorm(s.grinder),{gearKind:'grinder',model:s.grinder},who,o);
    if(regSubstance(s.brewer))catUpsert('gear','brewer:'+catNorm(s.brewer),{gearKind:'brewer',model:s.brewer},who,o);

 * caliber record is withdrawn, never erased. The keeper's own ledger gets the

 * A strike is ITSELF a record — signed, dated, and carrying the withdrawn body

 * a count, a plate, a map or an export because somebody forgot a filter. No read
 * path in the app had to learn about this.

// One quiet line on the tall map only — no red, no dialog: offline is a
// considered mode, not an error. Retry re-attempts the tiles by hand.
function smapNote(el,cfg,on){
  if(!cfg.note)return;
  let n=el.querySelector(':scope>.smap-note');
  if(!on){if(n)n.remove();return}
  if(n)return;
  n=document.createElement('div');n.className='smap-note';
  n.innerHTML=`<span class="dot"></span><span>Streets unavailable — showing saved positions.</span><button class="text-action" onclick="smapRetry(${jsq(el.dataset.smap)})">Retry</button>`;
  el.appendChild(n);
}
function smapRetry(id){
  const el=document.querySelector(`[data-smap="${CSS.escape(id)}"]`);if(!el)return;
  _mlDown=false;el._smap=false;
  const s=_smaps[id];if(s){try{s.map.remove()}catch(e){}delete _smaps[id]}
  el.querySelectorAll(':scope>.smap-live,:scope>.smap-note').forEach(n=>n.remove());
  smapMount();
}
