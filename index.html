/* ============================================================================
 * CARTA — the token layer  (sub-brand of Quiet Matter)
 * ----------------------------------------------------------------------------
 * Ported wholesale from classic (ARCHITECTURE.md §1) — the token architecture
 * is unchanged by the fourth turn. Charter: docs/SUBBRAND.md.
 * ========================================================================== */
:root{
  --s11:0.6875rem; --s13:0.8125rem; --s15:0.9375rem; --s16:1rem; --s18:1.125rem;
  --track-label:0.12em; --track-foot:0.04em;
  --w-regular:400; --w-medium:500; --w-semibold:600;
  --measure:37ch; --measure-editorial:56ch; --touch-min:44px;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'Libre Franklin',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;

  --ca-paper-0:#f8f5ee; --ca-paper-50:#f2eee6; --ca-paper-100:#e9e3d8; --ca-paper-200:#ddd5c7;
  --ca-ink-900:#241d18; --ca-ink-600:#554a41; --ca-ink-450:#776b60; --ca-ink-300:#b8b5b0;
  --ca-line-ink:rgba(36,29,24,.13); --ca-line-paper:rgba(236,233,227,.14);
  --ca-ember:#a63f2b; --ca-ember-ink:#fffaf1; --ca-danger:#8c3b34;

  --ca-night-900:#171310; --ca-night-800:#211b17; --ca-night-700:#2d241f; --ca-night-600:#342923;
  --ca-roastlight-100:#f0e9dd; --ca-roastlight-300:#c8bcae; --ca-roastlight-500:#9f9183; --ca-roastlight-700:#5b574f;
  --ca-ember-dusk:#e06b4f;

  --radius:0; --chipr:2px;

  --text-primary:var(--ca-ink-900); --text-secondary:var(--ca-ink-600); --text-subtle:var(--ca-ink-450);
  --text-disabled:var(--ca-ink-300); --text-on-fill:var(--ca-ember-ink);
  --surface-page:var(--ca-paper-50); --surface-card:var(--ca-paper-0); --surface-sunk:var(--ca-paper-100);
  --border-hairline:var(--ca-line-ink); --border-strong:var(--ca-ink-900); --border-control:var(--ca-ink-450);
  --link:var(--ca-ink-600); --link-hover:var(--ca-ink-900); --focus-ring:var(--ca-ink-900);
  --fill-strong:var(--ca-ink-900); --fill-strong-hover:var(--ca-ink-600);
  --signal:var(--ca-ember); --signal-ink:var(--ca-ember-ink); --status-danger:var(--ca-danger);

  --ink:var(--text-primary); --ink-2:var(--text-secondary); --ink-3:var(--text-subtle); --ink-d:var(--text-disabled);
  --paper:var(--surface-page); --paper-card:var(--surface-card); --paper-2:var(--surface-sunk); --paper-3:var(--ca-paper-200);
  --line:var(--border-hairline); --line-2:var(--ca-paper-200); --line-strong:var(--border-strong);
  --accent:var(--signal); --accent-ink:var(--signal-ink); --danger:var(--status-danger);

  --mo-fast:130ms; --mo-base:230ms; --mo-considered:820ms; --mo-ease:cubic-bezier(.22,.61,.36,1);
}
html[data-theme="dusk"]{
  --text-primary:var(--ca-roastlight-100); --text-secondary:var(--ca-roastlight-300); --text-subtle:var(--ca-roastlight-500);
  --text-disabled:var(--ca-roastlight-700); --text-on-fill:var(--ca-night-900);
  --surface-page:var(--ca-night-900); --surface-card:var(--ca-night-800); --surface-sunk:var(--ca-night-700);
  --border-hairline:var(--ca-line-paper); --border-strong:var(--ca-roastlight-100); --border-control:var(--ca-roastlight-500);
  --link:var(--ca-roastlight-300); --link-hover:var(--ca-roastlight-100); --focus-ring:var(--ca-roastlight-100);
  --fill-strong:var(--ca-roastlight-100); --fill-strong-hover:var(--ca-roastlight-300);
  --signal:var(--ca-ember-dusk); --signal-ink:var(--ca-night-900);
  --line-2:var(--ca-night-700); --paper-3:var(--ca-night-600);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--surface-page)}
body{
  background:var(--surface-card);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5;
  max-width:480px;margin:0 auto;height:100vh;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
/* Phase 26: the leaf was ruled twice — the sheet's own edge and the margin it
   was written inside. Both are gone. Every screen in the design board is drawn
   full bleed to the device edge, and a rule that only ever fenced the content
   in was reading as a frame around the app rather than paper under it. */
.num{font-family:var(--sans);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* the app's own header is gone (ROADMAP.md Phase 12): the wordmark now sits on
   the passport itself, and the door moved into the bar, where it's reachable
   from every room instead of only from the top of one. */
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0;position:relative;z-index:1}
/* a screen that owns its own frame — a full-bleed map with a sheet drawn over
   it — takes the scroll off main and manages it inside itself */
main.fixed{overflow:hidden}
main.fixed>*{position:absolute;inset:0}
.pad{padding:0 20px 26px}

h2{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;
  color:var(--ink-3);font-weight:500;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2:first-child{margin-top:2px}
.eyebrow{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0 0 8px}
.display{font-family:var(--serif);font-weight:600;font-size:1.625rem;line-height:1.12;letter-spacing:-.02em;
  color:var(--ink);margin:0 0 6px;text-wrap:balance}
.display em{font-style:italic;font-weight:400}
/* the reading size — body serif at 17px, the redesign's floor for anything
   meant to be read rather than scanned (ROADMAP.md Phase 12) */
.lede{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink-2);margin:0 0 14px;max-width:var(--measure)}
.note{border-top:1px solid var(--line);padding-top:12px;margin:10px 0 4px;font-family:var(--serif);font-style:italic;font-size:var(--s13);color:var(--ink-3)}
.back{display:inline-block;background:none;border:0;padding:0 0 12px;cursor:pointer;color:var(--ink-3);
  font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase}
.back:active{color:var(--ink)}
.rowlink{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:12px 0;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rowlink:active{background:var(--paper-2)}
.rowlink .t{font-family:var(--serif);font-size:var(--s16);color:var(--ink)}
/* the meta line — the sans note that sits under a title anywhere, at the size
   the row it belongs to reads at */
.m{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);letter-spacing:.01em;line-height:1.5}
.rowlink .m{font-size:var(--s11);letter-spacing:.02em}
.rowlink .go{flex:none;color:var(--ink-3);font-family:var(--sans);font-size:var(--s11)}
.rowlink .row-main{display:flex;align-items:center;gap:10px;min-width:0}
.btnrow{display:flex;gap:8px;align-items:stretch}
.btnrow .btn,.btnrow .btn+.btn{margin-top:0;flex:1}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.muted{color:var(--ink-3);font-family:var(--sans);font-size:13px}
.small{font-size:13px}
.serif{font-family:var(--serif)}
strong{font-family:var(--serif);font-weight:600;font-style:normal}
.opt{text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:400;font-size:10px;font-style:italic;font-family:var(--serif)}

.chip{display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.02em;padding:2px 8px;
  border-radius:var(--chipr);background:var(--paper);border:1px solid var(--line);color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--line-strong);color:var(--ink)}

.btn{display:block;width:100%;text-align:center;min-height:44px;padding:13px 16px;border-radius:var(--radius);
  font-family:var(--sans);font-size:var(--s13);font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  transition:background .2s ease,color .2s ease,border-color .2s ease}
.btn.mini{min-height:32px;padding:5px 10px;font-size:var(--s11);letter-spacing:.06em}
/* the box that states a permission (Phase 26, station 02): a real 20px mark in
   ink rather than the browser's own control, and the row it stands in is drawn
   on card paper so the choice reads as a thing sitting on the sheet. The
   native input keeps the checked state and the keyboard; only its drawing is
   ours, so :checked is what the mark is painted from. */
.chk{position:relative;display:flex;align-items:flex-start;gap:13px;cursor:pointer;border:1px solid var(--line);
  background:var(--surface-card);padding:14px 15px}
.chk input{position:absolute;opacity:0;width:20px;height:20px;margin:0}
.chk .bx{flex:none;width:20px;height:20px;border:1px solid var(--line-strong);background:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;margin-top:2px;
  color:transparent;font-family:var(--sans)}
.chk input:checked+.bx{background:var(--ink);border-color:var(--ink);color:var(--text-on-fill)}
.chk input:focus-visible+.bx{outline:2px solid var(--accent);outline-offset:2px}
.chk.bare{border:0;background:none;padding:0;align-items:center;gap:9px;margin-top:14px}
.chk.bare .bx{margin-top:0}
.chk .t{min-width:0}
.chk .t b{display:block;font-family:var(--serif);font-size:16px;font-weight:400;line-height:1.35;color:var(--ink)}
.chk .t span{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:4px}
.btn-primary{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
.btn-primary:active{filter:brightness(.88)}
.btn-quiet{background:none;border:1px solid var(--line-strong);color:var(--ink)}
.btn-quiet:active{background:var(--paper-2)}
.btn-danger{color:var(--danger);border:1px solid var(--danger);background:none}
.btn-danger:active{background:var(--paper-2)}
.btn+.btn{margin-top:8px}

label.f,div.f{display:block;margin-bottom:14px;min-width:0}
label.f span.l,div.f span.l{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;font-weight:500}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;font-family:var(--serif);font-size:16px;padding:9px 0;border:none;border-bottom:1px solid var(--ink-3);
  border-radius:0;background:transparent;color:var(--ink);appearance:none;-webkit-appearance:none}
input::placeholder,textarea::placeholder{color:var(--ink-d);font-style:italic}
select{background:transparent}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ink)}
textarea{min-height:60px;resize:vertical;border:1px solid var(--line);padding:9px 11px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:0 12px}
details.more{margin:4px 0 14px}
details.more summary{cursor:pointer;font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:10px}

/* ===== dial (the field-tool scale exception) ===== */
.dial{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-card);padding:9px 6px 11px;margin-bottom:10px;text-align:center;position:relative}
.dial .l{font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.dial .v{font-family:var(--sans);font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15;margin:5px 0 7px;color:var(--ink)}
.dial .v .u{font-family:var(--sans);font-size:12px;color:var(--ink-3);font-weight:400;margin-left:2px}
.dial .ctl{display:flex;justify-content:center;gap:6px}
.dial .ctl button{width:58px;height:40px;border:1px solid var(--line-strong);border-radius:var(--radius);background:transparent;font-size:20px;font-weight:400;color:var(--ink-2)}
.dial .ctl button:active{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.dial .ticks{position:absolute;top:9px;right:11px;font-family:var(--sans);font-size:9px;color:var(--ink-3);letter-spacing:.06em}
.dial .v.tapedit{display:inline-block;cursor:text;border-bottom:1px dotted var(--ink-3)}
.dedit{width:2.7em;min-width:46px;max-width:88%;font-family:var(--sans);font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;text-align:center;border:none;background:transparent;color:var(--ink);padding:0}
.dedit:focus{outline:none}
.dcorner{position:absolute;top:7px;right:7px;display:flex;gap:3px}
.dcorner .ut{font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.02em;padding:2px 6px;border:1px solid var(--line-strong);background:transparent;color:var(--ink-3);border-radius:var(--chipr);cursor:pointer}
.dcorner .ut.on{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.dialrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.hedonic{display:flex;gap:5px;justify-content:space-between;margin:6px 0 4px}
.hedonic button{flex:1;aspect-ratio:1/1.1;border:1px solid var(--line-strong);border-radius:var(--radius);background:transparent;font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:16px;color:var(--ink-2);max-width:44px}
.hedonic button.on{background:var(--ink);color:var(--text-on-fill);border-color:var(--ink);font-weight:600}
.desc{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.desc button{font-family:var(--sans);font-size:13px;padding:9px 13px;min-height:40px;border:1px solid var(--line-strong);border-radius:var(--chipr);background:transparent;color:var(--ink-2)}
.desc button.on{background:var(--ink);color:var(--text-on-fill);border-color:var(--ink)}

.timer{background:var(--paper-2);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:16px}
.timer .t{font-family:var(--sans);font-size:52px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.timer .ctl{display:flex;gap:8px;margin-top:14px}
.timer .ctl button{flex:1;min-height:46px;padding:11px 6px;border-radius:var(--radius);border:1px solid var(--line-strong);color:var(--ink);font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.timer .ctl button.go{background:var(--fill-strong);border-color:var(--fill-strong);color:var(--text-on-fill)}

/* ===== the bar — three rooms, typographic, no icons, and the door ===== */
/* the bar sits above the leaf's inner rule (body::before, z-index 35) — a
   hairline running across the door's ember block reads as a mistake, not a
   margin */
nav.tabs{flex:none;background:var(--surface-card);display:flex;align-items:stretch;z-index:36;
  padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line)}
nav.tabs button{flex:1;appearance:none;-webkit-appearance:none;background:none;padding:12px 4px 14px;
  color:var(--ink-3);font-family:var(--sans);font-size:11.5px;
  letter-spacing:var(--track-label);text-transform:uppercase;font-weight:500;min-height:56px;
  border:none;border-top:2px solid transparent;margin-top:-1px}
nav.tabs button.on{color:var(--ink);border-top-color:var(--ink)}
/* the door is the one ember in the bar — a persistent block, not a fourth room.
   Put to the founder at the v7.30.0 QC pass (the design board draws all four
   items in one rhythm) and kept: the door is the app's one standing invitation
   to log a cup, and that is live enough to hold the accent. */
nav.tabs button.door{flex:none;width:118px;background:var(--accent);color:var(--accent-ink);
  border:0;margin-top:0;display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.1em}
nav.tabs button.door:active{filter:brightness(.9)}
nav.tabs[hidden]{display:none}

/* ===== the settle — plays on a screen change, stilled under reduced motion ===== */
@keyframes ca-settle{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ca-screen{animation:ca-settle var(--mo-base) var(--mo-ease) both}
@media (prefers-reduced-motion:reduce){.ca-screen{animation:none!important;opacity:1!important;transform:none!important}.sheet{transition:none}}

/* ===== sheet ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(26,26,22,.42);z-index:40;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
  background:var(--paper);border-radius:0;border-top:1px solid var(--line-strong);z-index:50;
  max-height:92vh;max-height:92dvh;overflow-y:auto;overflow-x:hidden;display:none;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));transition:transform var(--mo-base) var(--mo-ease)}
.sheet.open{display:block}
.sheet .grab{height:26px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.sheet .grab::before{content:"";width:34px;height:3px;background:var(--ink-3);border-radius:2px;transition:background .15s,width .15s}
.sheet.dragging{transition:none}
.sheet.dragging .grab{cursor:grabbing}
.sheet.dragging .grab::before{background:var(--ink);width:44px}
.sheet h3{font-family:var(--serif);font-size:24px;line-height:1.15;font-weight:600;margin-bottom:4px;color:var(--ink);letter-spacing:-.01em}
.sheet .sub{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-size:var(--s15);margin-bottom:18px;max-width:37ch}

.empty{font-family:var(--serif);font-style:italic;color:var(--ink-3);text-align:center;padding:30px 20px;font-size:15px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:var(--s15);gap:12px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-3);font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;flex:none;white-space:nowrap;line-height:1.5}
.kv .v{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.kv .v.score,.rowlink .go.score,.score{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}

.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:var(--chipr);font-family:var(--sans);font-size:13px;
  z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.withundo{pointer-events:auto}
.toast .undo{margin-left:10px;text-decoration:underline;cursor:pointer}
.toast.show{opacity:1}

/* ===== the map surfaces — drawn by carta-maps.js, inked here (MAPPING.md's law:
   a mark is a lens, never a rank, and the ember is never spent on the ground) =====
   The three custom elements live in light DOM on purpose, so every var() below
   resolves against the page's own token layer, dusk included. */
.mapbox{position:relative;background:var(--surface-sunk);overflow:hidden}
/* the passport's own ink: tasted countries ARE the mark — filled in body ink,
   their names knocked out of the shape in paper; the rest is a hairline ground */
.passport{--ca-land-fill:var(--surface-sunk);--ca-land-line:var(--ca-ink-300);
  --ca-mk-fill:var(--ink);--ca-mk-line:var(--ink);--ca-mk-label:var(--surface-card);
  --ca-mk-halo:transparent;--ca-mk-out:var(--ink);
  /* the highlands, and the regions standing on them — both knocked out of the
     country's own ink the same way its name is, so they flip with the theme */
  --ca-topo:var(--surface-card);--ca-rmk:var(--surface-card)}
/* the drawn plot — offline, no tiles, the identity the streets hand back to */
.plot{--ca-dot:var(--ink);--ca-dim:var(--ink-3);display:block;width:100%}
.plot.frame{height:100%}
/* the type a map is read through, and the fade that lets it be read at all */
.fade{position:absolute;left:0;right:0;pointer-events:none;z-index:2}
.fade.top{top:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--surface-card) 92%,transparent) 8%,color-mix(in srgb,var(--surface-card) 0%,transparent) 100%)}
.fade.bottom{bottom:0;background:linear-gradient(to top,color-mix(in srgb,var(--surface-card) 92%,transparent) 20%,color-mix(in srgb,var(--surface-card) 0%,transparent) 100%)}
.overlay{position:absolute;z-index:4}
/* a control standing on a map keeps its own paper under it */
.omini{background:var(--surface-card);border:1px solid var(--line-strong);color:var(--ink);
  font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 13px;min-height:38px;cursor:pointer;border-radius:var(--radius)}
/* the same control with nothing under it — a word standing on a screen, not a
   box: used where the surface behind it is already the app's own paper */
.omini.bare{background:none;border-color:transparent;padding-left:4px;padding-right:4px}
.omini:active{background:var(--paper-2)}
.leaflet-container{background:var(--surface-sunk)!important;font-family:var(--sans)!important}
.leaflet-control-attribution{font-size:9px!important;letter-spacing:.02em;
  background:color-mix(in srgb,var(--paper-card) 78%,transparent)!important;color:var(--ink-3)!important}
.leaflet-control-attribution a{color:var(--ink-3)!important;text-decoration:none}
.smap-note{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;background:var(--paper-card);border:1px solid var(--line);
  padding:6px 9px;font-family:var(--sans);font-size:11px;color:var(--ink-3);display:flex;gap:8px;align-items:center;justify-content:space-between}
.text-action{text-decoration:underline;cursor:pointer;flex:none;color:var(--ink-3)}

/* ===== the rooms — one screen's own furniture (ROADMAP.md Phase 12) ===== */
/* a screen's header, held at the top of its own scroll */
.shdr{position:sticky;top:0;z-index:6;background:var(--surface-card);border-bottom:1px solid var(--line);
  padding:22px 20px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.display.big{font-size:1.875rem}
/* a ruled section head — the label, and what the section amounts to */
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--line);padding-bottom:8px;margin:24px 0 2px}
.shead .l{font-family:var(--sans);font-size:var(--s11);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.shead .r{font-family:var(--sans);font-size:var(--s11);letter-spacing:.06em;color:var(--ink-3);text-align:right}
/* the list row, at the size the redesign reads at: the title leads, the meta
   sits off the faintest ink, and the score is set big enough to be the answer */
.lrow{width:100%;display:flex;align-items:center;gap:14px;text-align:left;color:var(--ink);
  background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer;min-height:64px}
.lrow:active{background:var(--paper-2)}
.lrow .t{display:block;font-family:var(--serif);font-size:18.5px;line-height:1.25;color:var(--ink)}
.lrow .m{display:block;font-family:var(--sans);font-size:12.5px;color:var(--ink-3);letter-spacing:.01em;margin-top:3px}
.lrow .mid{flex:1;min-width:0}
.lrow .go{flex:none;font-family:var(--sans);font-size:13px;color:var(--ink-3)}
.lrow .sc{flex:none;font-family:var(--sans);font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.lrow .sc.none{color:var(--text-disabled);font-size:22px}
.lrow .kind{flex:none;width:40px;align-self:flex-start;padding-top:5px;font-family:var(--sans);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-disabled)}
.lrow .mapthumb{flex:none;width:60px;height:44px;border:1px solid var(--line);background:var(--surface-page);display:block;overflow:hidden}
.cshape{display:block;width:100%;height:100%}
.cshape path{fill:var(--ink);fill-opacity:.14;stroke:var(--ink);stroke-opacity:.5;stroke-width:1.4;vector-effect:non-scaling-stroke}
/* a country the record has tasted — a name and its weight, tappable */
.cchip{display:inline-flex;align-items:baseline;gap:7px;background:none;border:1px solid var(--line-strong);
  color:var(--ink);font-family:var(--serif);font-size:var(--s15);padding:8px 12px;min-height:38px;cursor:pointer;border-radius:var(--radius)}
.cchip:active{background:var(--paper-2)}
.cchip .n{font-family:var(--sans);font-size:var(--s11);color:var(--ink-3);font-variant-numeric:tabular-nums}
/* a boxed aside — the panel a screen argues from */
.box{border:1px solid var(--line);background:var(--surface-page);padding:18px}
.box.firm{border-color:var(--line-strong)}
/* the city's sheet, pulled up over its own streets */
.citysheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--surface-card);
  border-top:1px solid var(--line-strong);box-shadow:0 -18px 44px -18px rgba(36,29,24,.4);
  transition:height var(--mo-base) var(--mo-ease)}
.citysheet .pull{width:100%;background:none;border:0;padding:11px 0 6px;display:flex;justify-content:center;cursor:pointer}
.citysheet .pull span{width:40px;height:3px;background:var(--ink-3);display:block}
.citysheet .list{overflow-y:auto;padding:0 20px 18px}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
/* Phase 27's ground — the map that replaced the cup's photograph — with no
   surface standing on it at the moment: the Phase 26 design board draws the
   cup page with no hero of any kind, so `coffeeGroundHTML` is unmounted rather
   than deleted. Putting it back is one line in vCup; the founder's call. */
.hero{position:relative;height:300px;background:var(--surface-sunk);overflow:hidden}
.hero .slot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  text-align:center;padding:0 40px;font-family:var(--serif);font-style:italic;font-size:var(--s15);color:var(--ink-3)}
/* the cup's own reading (Phase 26, station 07): the score answers the page
   from the left, and what was said about it answers back across the same rule.
   The photograph the page used to open on is gone (Phase 27 retired it whole),
   and the board puts nothing in its place — a cup is its score, its line and
   the shot underneath. */
.reading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--line-strong);padding:18px 0 16px}
.reading .s{flex:none}
.reading .s .l{font-family:var(--sans);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.reading .a{flex:1;min-width:0;text-align:right}
.reading .ln{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.45;color:var(--ink)}
.reading .ln.faint{color:var(--ink-3)}
.reading .ds{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin-top:10px}

/* a sheet of paper that starts under the map and slides over its last inch */
.lift{position:relative;background:var(--surface-card);border-top:1px solid var(--line-strong);margin-top:-18px}
/* the score, when the score is the subject — the one ember on the screen */
.bigscore{font-family:var(--sans);font-weight:600;font-variant-numeric:tabular-nums;line-height:1;color:var(--accent)}
.ofnine{font-family:var(--sans);font-size:var(--s11);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.dchip.sm{font-size:11px;padding:2px 8px}
.dchip{font-family:var(--sans);font-size:12px;letter-spacing:.02em;padding:5px 10px;border:1px solid var(--line);
  color:var(--ink-2);background:var(--surface-page);border-radius:var(--chipr)}

/* ===== the rest of the rooms — the chapters, the brief, the ask, the record ===== */
/* the road: how far the record follows one country, station by station. A
   station stands filled where the record reaches it and hollow where it does
   not; the rail runs dashed across a gap rather than pretending to cross it.
   Coverage counts — it never grades, so nothing here is ever the ember. */
.road{display:flex;align-items:flex-start;gap:0;margin-top:16px}
.road .st{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.road .rail{display:flex;align-items:center;width:100%}
.road .rail i{flex:1;height:1px;background:var(--ink)}
.road .rail i.gap{background:none;border-top:1px dashed var(--ca-ink-300)}
.road .rail i.end{background:none;border:0}
.road .mk{flex:none;width:9px;height:9px;background:var(--ink);border:1px solid var(--ink)}
.road .mk.off{background:none;border-color:var(--ca-ink-300)}
.road .n{font-family:var(--sans);font-size:13px;font-variant-numeric:tabular-nums;margin-top:8px;color:var(--ink)}
.road .l{font-family:var(--sans);font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-top:3px;color:var(--ink-3);text-align:center}
.road .st.off .n,.road .st.off .l{color:var(--text-disabled)}
/* a figure that carries its reasons — tap it for the cups it was read from */
.fig{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);font-family:inherit;
  font-size:inherit;font-style:inherit;line-height:inherit;border-bottom:1px dotted var(--ink-3)}
.fig:active{border-bottom-color:var(--ink)}
/* the altitude band — a stated range, drawn against the span the atlas allows.
   Only ever drawn from heights the bags actually state (MODEL_QA: no invented
   precision); where nothing is stated the band doesn't draw at all. */
.band{position:relative;height:26px;margin-top:12px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.band::before{content:"";position:absolute;left:0;right:0;top:12px;height:1px;background:var(--line)}
.band>span{position:absolute;top:9px;height:5px;background:var(--ink)}
.band-ax{display:flex;justify-content:space-between;font-family:var(--sans);font-size:10px;letter-spacing:.08em;color:var(--ink-3);margin-top:5px}
/* the ledger box — stated facts, and "unread" wherever the record is silent */
.led{border:1px solid var(--line);background:var(--surface-page);padding:4px 16px}
.led .r{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.led .r:last-child{border-bottom:none}
.led .k{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-3);flex:none}
.led .v{text-align:right;font-family:var(--serif);font-size:15.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.led .v.unread{color:var(--text-disabled);font-style:italic}
/* a chip that picks — a scope, a kind of ask, a mark on what Carta found */
.picks{display:flex;flex-wrap:wrap;gap:7px}
.pick{font-family:var(--sans);font-size:12.5px;letter-spacing:.02em;padding:9px 13px;min-height:40px;cursor:pointer;
  border-radius:var(--chipr);background:none;color:var(--ink-2);border:1px solid var(--line-strong)}
.pick.on{background:var(--ink);color:var(--text-on-fill);border-color:var(--ink)}
.pick.mini{font-size:11.5px;padding:7px 12px;min-height:34px;color:var(--ink-3);border-color:var(--line)}
.pick.mini.on{color:var(--text-on-fill);border-color:var(--ink)}
/* a chip that only states — the model's verdict on a café, an honest distance,
   a program that turns over. Same furniture as the marks beside it, minus the
   affordance: nothing here is pressable, so nothing here ever fills. */
.pick.tag{cursor:default;min-height:0;padding:6px 11px}
.pick.tag.lead{color:var(--ink);border-color:var(--line-strong)}
/* what Carta found: an entry, its place in the model's own order, and the one
   sentence it argued. The rank is plain ink — the ember is a score you gave. */
.find{border-bottom:1px solid var(--line);padding:16px 0}
.find .rk{font-family:var(--sans);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-3);margin-right:8px}
.say{font-family:var(--serif);font-size:15.5px;line-height:1.5;color:var(--ink-2);margin-top:8px;max-width:var(--measure)}
.m .k{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-3)}
/* a route: what you want on the left, the order to walk it on the right */
.route{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.route:last-child{border-bottom:0;padding-bottom:0}
.route .if{font-family:var(--sans);font-size:var(--s11);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);flex:none;max-width:44%}
.route .ord{font-family:var(--serif);font-size:15px;color:var(--ink);text-align:right;flex:1}
/* the file a sheet is waiting for, and the box a photo is dropped into */
.pickzone{display:block;border:1px dashed var(--border-control);padding:18px;text-align:center;cursor:pointer;
  font-family:var(--serif);font-style:italic;font-size:var(--s15);color:var(--ink-3)}
.pickzone input{display:none}
.photoslot{flex:none;width:104px;height:104px;border:1px solid var(--line);background:var(--surface-page);position:relative;overflow:hidden;cursor:pointer;display:block}
.photoslot img{width:100%;height:100%;object-fit:cover;display:block}
.photoslot .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;
  font-family:var(--serif);font-style:italic;font-size:var(--s13);color:var(--ink-3)}
.photoslot input{display:none}
/* the ground a finding stands on — placed, or listed and not drawn */
.ground{flex:none;font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.ground.no{color:var(--text-disabled)}

/* ===== the ask, moved to the front door (the Ask Carta redesign) =====
   The ask stopped being a page you go and find and became the first thing the
   Atlas says: the passport stays the ground, and the question sits on it. Three
   pieces of furniture carry it — the field on the map, the hairline the wait is
   drawn along, and the settle that writes an answer in rather than pasting it. */
/* the hero's fade runs deeper than a caption's: the belt frames itself to
   whatever has been tasted, so one country can fill the whole plate — a field
   and a line of type have to stand on paper whatever is drawn behind them */
.fade.bottom.deep{background:linear-gradient(to top,var(--surface-card) 0%,
  color-mix(in srgb,var(--surface-card) 96%,transparent) 66%,
  color-mix(in srgb,var(--surface-card) 0%,transparent) 100%)}
/* the shot's own fade carries a taller stack than the ask's — the eyebrow, the
   name, the curve, three figures and the button — so it holds full paper
   further up rather than letting the ground read through the top of it */
.fade.bottom.deep.shot{background:linear-gradient(to top,var(--surface-card) 0%,
  color-mix(in srgb,var(--surface-card) 97%,transparent) 74%,
  color-mix(in srgb,var(--surface-card) 0%,transparent) 100%)}
/* the field standing on the passport. It sits inside that fade, which is
   pointer-events:none by design — a fade is read through, never tapped — so the
   field hands its own taps back. */
.askfield{display:flex;align-items:stretch;border:1px solid var(--line-strong);background:var(--surface-card);pointer-events:auto}
.askfield input{flex:1;min-width:0;border:0;padding:13px 14px;font-size:16px;background:transparent}
.askfield input:focus{outline:none}
.askfield button{flex:none;background:var(--accent);color:var(--accent-ink);border:0;padding:0 18px;cursor:pointer;
  font-family:var(--sans);font-size:var(--s13);letter-spacing:.02em;min-height:var(--touch-min)}
.askfield button:active{filter:brightness(.88)}
/* the one line under it: what leaves the device, said before anything does */
.asktrust{font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--ink-3);margin-top:9px;pointer-events:auto}
/* the ledger, when it is also a door to the brief it was read from */
button.led{display:block;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
button.led:active{background:var(--paper-2)}
/* ===== the wait — narrated, on one hairline =====
   A spinner says only that something is happening. This says what: each stage
   is a fact the ask actually reached, the rule fills to how far along it is,
   and the ember tip breathes so a long call still reads as alive. */
/* the breath the design board draws: down to 35%, not 25%. At 7px the deeper
   trough reads as a flicker rather than something alive — which is the whole
   job of this mark, since it is the one thing on the Atlas that expires. */
@keyframes ca-breathe{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ca-written{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
/* a screen that runs to the bottom of the room it is in, so what it ends with
   sits on the fold rather than wherever the text happens to stop */
main.tall{display:flex;flex-direction:column}
main.tall>*{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.think{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.think>.pad{flex:1 1 auto;display:flex;flex-direction:column}
.think .rule{position:relative;height:1px;background:var(--line)}

 * the same shot for this sitting only; this is what survives a reload with

const SHOTSREAD_KEY='carta7.shotsread.v1';
let _shotsReadCache=null;
function loadShotsRead(){if(_shotsReadCache)return _shotsReadCache;
  try{_shotsReadCache=JSON.parse(localStorage.getItem(SHOTSREAD_KEY)||'{}')}catch(e){_shotsReadCache={}}

 * that as a refused save rather than as a warning.

 * the record's own 400 samples came to 459 KB, which is the wrong order of
 * magnitude for something no cup depends on. Twenty brews at 150 samples is
 * about 115 KB. A plate is drawn ~350px wide and scrubbed with a fingertip,
 * so 150 samples is still finer than the screen or the hand can resolve —
 * this copy is thinned for *reading*, and the copy a written cup depends on

const placeById=id=>D.places.find(p=>p.id===id);
const coffeeById=id=>D.coffees.find(c=>c.id===id);
const setupById=id=>D.setups.find(s=>s.id===id);
const brewById=id=>D.brews.find(b=>b.id===id);
const cupById=id=>D.cups.find(c=>c.id===id);

function fmtAgo(iso){

/* ==== pure ==== *
 * ARCHITECTURE.md §9: "the taste model is the one piece of real logic whose
 * wrongness would be invisible" — a bad brief just looks like a mediocre
 * brief. Everything between this marker and its close is a pure function of
 * an explicit ledger: no DOM, no localStorage, no reference to the global D.
 * test/model.test.js slices exactly this region out of index.html and
 * evaluates it directly against fixture ledgers. Keep it that way — a new
 * helper that reaches for `D` or `document` belongs outside the markers. */

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- the gentle join (ARCHITECTURE.md §4) ----
 * Roasters and places are the graph's nodes: each carries aka[], other
 * spellings folded into it. fold() is case/diacritics/punctuation only —
 * never doubled letters, never aliases (that's the resolver's fuzzy licence,
 * and it stayed with the trade side). An exact fold match joins silently; a
 * near match (small edit distance) asks once. Origin story fields never join. */
function fold(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  const dp=[];for(let i=0;i<=m;i++)dp.push([i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);

      const d=lev(f,t);
      if(d<=2&&Math.abs(f.length-t.length)<=3&&d<bestD){bestD=d;near=n}

/* ---- put-away, the core (the DOM/localStorage wrapper lives in store) ---- */
function putAwayCore(ledger,coll,id,now){const rec=(ledger[coll]||[]).find(x=>x.id===id);if(!rec)return false;

/* ---- the taste model + the brief (ARCHITECTURE.md §5) ----
 * tasteModel(ledger) is a pure derivation, computed and memoized on write,
 * never stored (classic's reviewQueue pattern: derived state cannot
 * corrupt). Every figure carries its n and its evidence refs — a
 * recommendation never travels without its reasons, starting with the model
 * itself. brief(scope) renders three forms from one derivation: a page on
 * Carta paper, an embedded machine block (carta.brief/v1), and a plain-text
 * cut sized for pasting into a chat. Strictly offline, by construction —
 * nothing here makes a network call. */
function avg(a){return a.reduce((s,x)=>s+x,0)/a.length}
function median(a){const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:avg([s[m-1],s[m]])}
function bucket(cups,keyFn){
  const m={};
  cups.forEach(c=>{const k=keyFn(c);if(!k)return;(m[k]=m[k]||{value:k,scores:[],cupRefs:[]});m[k].scores.push(c.score);m[k].cupRefs.push(c.id)});
  return Object.values(m).map(x=>({value:x.value,weight:avg(x.scores),n:x.scores.length,cupRefs:x.cupRefs})).sort((a,b)=>b.weight-a.weight||b.n-a.n);
}
function bucketMulti(cups,keysFn){
  const m={};
  cups.forEach(c=>(keysFn(c)||[]).forEach(k=>{(m[k]=m[k]||{value:k,scores:[],cupRefs:[]});m[k].scores.push(c.score);m[k].cupRefs.push(c.id)}));
  return Object.values(m).map(x=>({value:x.value,weight:avg(x.scores),n:x.scores.length,cupRefs:x.cupRefs})).sort((a,b)=>b.weight-a.weight||b.n-a.n);
}
/* roastLevel on Coffee (ROADMAP.md Phase 9) — a short scale, optional
 * everywhere, never required: exactly what a bag or a menu line actually
 * states, not a rung and not a resolver (ARCHITECTURE.md §4's line: free
 * text everywhere except the graph's nodes — this stays free text, just
 * drawn from a small named set instead of the open field process/origin
 * already are). parseRoastLevel reads a pasted bag or a menu line the same
 * light-touch way the door already reads a roaster/name split — it only
 * fires next to the word "roast" itself, so a tasting note ("light,

const ROAST_LEVELS=['Light','Medium-light','Medium','Medium-dark','Dark'];
function parseRoastLevel(text){

  const near=w=>t.includes(' '+w+' roast ')||t.includes(' roast '+w+' ');
  if(near('medium light'))return 'Medium-light';
  if(near('medium dark'))return 'Medium-dark';

function tasteModel(ledger){
  const coffeeOf=id=>(ledger.coffees||[]).find(c=>c.id===id);
  const placeOf=id=>(ledger.places||[]).find(p=>p.id===id);
  const cups=(ledger.cups||[]).filter(c=>!c.archived&&c.score!=null);
  const barCups=cups.filter(c=>c.kind==='bar');

  // the bar — a floor to judge a café by, and the roasters that earn a return trip
  const floor=barCups.length?median(barCups.map(c=>c.score)):null;
  const byRoaster={};
  cups.forEach(c=>{
    const co=coffeeOf(c.coffeeRef);if(!co)return;
    const key=co.roasterRef||co.roaster;if(!key)return;
    (byRoaster[key]=byRoaster[key]||{roasterRef:co.roasterRef||null,name:co.roaster||'Unnamed roaster',scores:[],cupRefs:[]});
    byRoaster[key].scores.push(c.score);byRoaster[key].cupRefs.push(c.id);

    .map(r=>({roasterRef:r.roasterRef,name:r.name,avg:avg(r.scores),n:r.scores.length,cupRefs:r.cupRefs}))
    .filter(r=>r.avg>=8&&r.n>=2)

  const roast=bucket(cups,c=>{const co=coffeeOf(c.coffeeRef);return co&&co.roastLevel});

/* ---- the classic importer (ARCHITECTURE.md §8) ----
 * classic's working-copy JSON export, mapped onto Carta 7's ledger. Pure: a
 * parsed export + a read-only snapshot of what already exists in, a set of
 * NEW records out — nothing is written here, so the same export can be
 * mapped twice (a preview, then the real run) or run again next month
 * without asking the caller to remember what it already did. Idempotency
 * is a sourceId stamped on every record this function mints
 * ('classic:<kind>:<id>') — the wrapper outside the pure block checks it
 * against the live ledger before ever calling this, and a second run over
 * the same export naturally produces nothing new once those land in

 * bagRoaster/lotRead/roastRead do, because a bag or a café cup's flat text

 * holds the node, never just the retired blank. Deliberately narrow per the

  // palette (ARCHITECTURE.md §8 promises all three cross), but a cup only ever carried
  // a shop name and a city string, sometimes blank even when the café's own profile
  // wasn't — so joinPlace reads the Register entry by name, blanks-only, same as its
  // own gentle join

    const nc={id:uid(),createdAt:b.createdAt||new Date().toISOString(),sourceId:src,
      roaster:rr.name,roasterRef:rr.ref,name:b.name||'',origin:toFields(origin(b)),
      roastDate:roastDateOf(b),notes:b.notes||'',home:true,archived:!!b.archived,
      archivedAt:b.archived?(b.updatedAt||b.createdAt||new Date().toISOString()):null};
    newCoffees.push(nc);bagCoffeeId[b.id]=nc.id;

      roaster:rr.name,roasterRef:rr.ref,name:(a.roast&&a.roast.name)||a.name||'',origin:toFields(origin(a)),
      roastDate:(a.roast&&a.roast.roastDate)||'',notes:a.notes||'',home:false};

/* ---- the city's own shape (Phase 17, corrected) — not streets, not pins, not a live

 * drawn purely from the same lat/lon already on the ledger. No tile, no key,
 * nothing to be offline from — the drawn plot's own promise, carried one
 * step further than a scatter of dots.
 *
 * The shape is one café's territory folded into as many as the city holds:
 * every point is first given a small round footprint of its own — so one
 * café reads as a place, not a dot — and the silhouette is the convex hull

// the same flat, cos-latitude-scaled projection <carta-plot> already uses —

// another one from this same projection, never against a real-world unit.
function projectFlat(pts){
  if(!pts.length)return [];
  const la0=pts.reduce((a,p)=>a+p.lat,0)/pts.length;

// Andrew's monotone chain — the standard, simplest correct convex hull.
// Duplicate points collapse first; a hull of one or two survivors is handed
// back as-is rather than forced through a loop that needs at least three.
function convexHull(pts){
  const uniq=[...new Map(pts.map(p=>[p.x.toFixed(6)+','+p.y.toFixed(6),p])).values()]
    .sort((a,b)=>a.x-b.x||a.y-b.y);

  const cross=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
  const build=list=>{
    const h=[];
    for(const p of list){
      while(h.length>=2&&cross(h[h.length-2],h[h.length-1],p)<=0)h.pop();
      h.push(p);
    }

  lower.pop();upper.pop();

}

// always a real 2D shape — one point's octagon, two points' hull-of-two-
// octagons (a soft capsule), a whole city's hull-of-many, no case-by-case.
function cityShapeHull(pts,radius){
  const inflated=[];
  pts.forEach(p=>{
    for(let i=0;i<10;i++){
      const a=(i/10)*Math.PI*2;

// little off each side of every corner and bridge the cut with a quadratic
// curve through the original vertex. The cut never exceeds 42% of whichever
// adjacent edge is shorter, so this holds even on a very tight cluster.
function roundedHullPath(hull){
  const n=hull.length;
  if(n<3)return '';
  const cutAt=i=>{
    const p=hull[i],prev=hull[(i-1+n)%n],next=hull[(i+1)%n];
    const dPrev=Math.hypot(p.x-prev.x,p.y-prev.y),dNext=Math.hypot(next.x-p.x,next.y-p.y);
    const r=Math.min(dPrev,dNext)*.42;
    const a=r/Math.max(dPrev,1e-9),b=r/Math.max(dNext,1e-9);
    return {in:{x:p.x+(prev.x-p.x)*a,y:p.y+(prev.y-p.y)*a},
            out:{x:p.x+(next.x-p.x)*b,y:p.y+(next.y-p.y)*b}};
  };
  const cuts=hull.map((_,i)=>cutAt(i));
  const f=v=>v.toFixed(2);
  let d=`M ${f(cuts[0].in.x)} ${f(cuts[0].in.y)}`;
  for(let i=0;i<n;i++){
    const c=cuts[i],p=hull[i],nextIn=cuts[(i+1)%n].in;
    d+=` Q ${f(p.x)} ${f(p.y)} ${f(c.out.x)} ${f(c.out.y)} L ${f(nextIn.x)} ${f(nextIn.y)}`;

}

// fraction of the cluster's own span, with a floor for a single café or a
// tight cluster — and since everything downstream fits to a box anyway, that
// floor's absolute value never matters, only its ratio to real spread does.
function cityShapePath(pts){
  const proj=projectFlat(pts);
  if(!proj.length)return null;
  const spanX=Math.max(...proj.map(p=>p.x))-Math.min(...proj.map(p=>p.x));
  const spanY=Math.max(...proj.map(p=>p.y))-Math.min(...proj.map(p=>p.y));

  const onGrab=e=>!!(e.target.closest&&e.target.closest('.grab'));
  function down(e){if(!sheet.classList.contains('open'))return;
    if(!onGrab(e)&&sheet.scrollTop>0)return;
    active=true;dragging=false;dy=0;startY=yOf(e);startT=Date.now();}
  function move(e){if(!active)return;
    dy=yOf(e)-startY;
    if(dy<=0){if(dragging){sheet.classList.remove('dragging');sheet.style.transform='';bg.style.opacity='';}dragging=false;dy=0;return}
    dragging=true;sheet.classList.add('dragging');
    if(e.cancelable)e.preventDefault();
    sheet.style.transform=`translateX(-50%) translateY(${dy}px)`;
    bg.style.opacity=String(Math.max(0,1-dy/(sheet.offsetHeight||600)));}
  function up(){if(!active)return;active=false;
    const h=sheet.offsetHeight||600;
    const velocity=dy/Math.max(1,Date.now()-startT);
    sheet.classList.remove('dragging');
    if(dragging&&(dy>h*0.28||velocity>0.55)){
      sheet.style.transform='translateX(-50%) translateY(100%)';bg.style.opacity='';
      setTimeout(()=>{closeSheet();sheet.style.transform='';bg.style.opacity='';},300);
    }else{sheet.style.transform='';bg.style.opacity=''}
    dragging=false;dy=0;}
  sheet.addEventListener('touchstart',down,{passive:true});
  sheet.addEventListener('touchmove',move,{passive:false});
  sheet.addEventListener('touchend',up);
  sheet.addEventListener('touchcancel',up);
  sheet.addEventListener('mousedown',down);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
})();

/* ============ toast (undo, when there's something to undo) ============ */
let _toastUndo=null;
function toast(m,actionFn,actionLabel){
  const t=document.getElementById('toast');

  t.innerHTML=esc(m)+(actionFn?` <span class="undo" onclick="_toastUndo&&_toastUndo();_toastUndo=null;document.getElementById('toast').classList.remove('show')">${esc(actionLabel||'Undo')}</span>`:'');

/* ============ dial component (ported wholesale) ============
 * tap −/+ one step; press-and-hold auto-repeats and accelerates; tap the
 * number to type an exact value. opts:{kind:'time'} for m:ss, {corner} for
 * the °C/°F toggle, {hint} for a scale caption. */
const dialState={};
let editingDial=null,holdInt=null,holdTO=null;
function dial(id,label,unit,value,step,min,max,dp,opts){
  opts=opts||{};
  dialState[id]={v:value,step,min,max,dp:dp??(String(step).includes('.')?1:0),unit,kind:opts.kind||null};
  const corner=opts.corner?`<div class="dcorner">${opts.corner}</div>`:(opts.hint?`<div class="ticks">${opts.hint}</div>`:'');
  return `<div class="dial">${corner}<div class="l">${label}</div>
    <div class="v num tapedit" id="dv_${id}" onclick="editDial('${id}')">${fmtDial(id)}<span class="u">${unit}</span></div>
    <div class="ctl">
      <button type="button" onpointerdown="holdStart(event,'${id}',-1)">−</button>
      <button type="button" onpointerdown="holdStart(event,'${id}',1)">+</button>
    </div></div>`;
}
function fmtDial(id){const s=dialState[id];if(s.v==null)return '—';
  if(s.kind==='time')return fmtTime(s.v);
  return s.v.toFixed(s.dp).replace(/\.0+$/,'');}
function unitSpan(id){return `<span class="u">${dialState[id].unit}</span>`}
function redrawDial(id){const el=document.getElementById('dv_'+id);if(el)el.innerHTML=fmtDial(id)+unitSpan(id)}
function setDial(id,v){const s=dialState[id];
  if(v==null||isNaN(v)){redrawDial(id);return}
  if(s.min!=null)v=Math.max(s.min,v); if(s.max!=null)v=Math.min(s.max,v);
  s.v=Number(v.toFixed(s.dp)); redrawDial(id);}
function nudge(id,dir,mult){const s=dialState[id];
  setDial(id,(s.v==null?(s.min??0):s.v)+dir*s.step*(mult||1));
  if(navigator.vibrate)navigator.vibrate(3);}
function holdStop(){if(holdTO){clearTimeout(holdTO);holdTO=null}if(holdInt){clearInterval(holdInt);holdInt=null}
  window.removeEventListener('pointerup',holdStop);window.removeEventListener('pointercancel',holdStop);}
function holdStart(e,id,dir){
  e.preventDefault();
  if(editingDial){const de=document.getElementById('de_'+editingDial);if(de)de.blur();}
  holdStop();
  nudge(id,dir);
  let n=0;
  holdTO=setTimeout(()=>{ holdInt=setInterval(()=>{ n++;
    const mult=n<10?1:n<20?4:n<35?10:25;
    nudge(id,dir,mult); },60); },320);
  window.addEventListener('pointerup',holdStop);
  window.addEventListener('pointercancel',holdStop);
}
function editDial(id){
  if(editingDial===id)return;
  const s=dialState[id],el=document.getElementById('dv_'+id);
  editingDial=id;
  const cur=s.v==null?'':(s.kind==='time'?fmtTime(s.v):fmtDial(id));
  el.innerHTML=`<input class="dedit" id="de_${id}" inputmode="${s.kind==='time'?'text':'decimal'}" value="${cur}">`+unitSpan(id);
  const inp=document.getElementById('de_'+id); inp.focus(); inp.select();
  const commit=()=>{if(editingDial!==id)return; editingDial=null;
    const raw=inp.value;
    const v=s.kind==='time'?parseTime(raw):(raw.trim()===''?NaN:Number(raw));
    setDial(id,v);};
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ev.preventDefault();inp.blur();}
    else if(ev.key==='Escape'){editingDial=null;redrawDial(id);}});
}
function grindDialHTML(setup,value){
  const st=setup||{};
  const num=(x,d)=>x!=null&&x!==''&&!isNaN(Number(x))?Number(x):d;
  const step=num(st.grindStep,0.5)||0.5, min=num(st.grindMin,0), max=num(st.grindMax,null);
  const dp=String(step).includes('.')?1:0;
  const hint=(st.grindMin!=null&&st.grindMin!==''&&max!=null)?`${min}–${max} · ${step}`:'';
  return dial('grind','Grind',st.grindUnit||'',value,step,min,max,dp,{hint});
}
function tempDialHTML(tempC){
  const u=tempUnit(),F=u==='F';
  const v=tempC==null?null:(F?Math.round(c2f(tempC)):Number(tempC.toFixed(1)));
  return dial('temp','Temp','°'+u,v,1,F?140:60,F?212:100,F?0:1,{corner:tempCorner()});
}
function dialTempC(){const s=dialState.temp;if(!s||s.v==null)return null;
  return tempUnit()==='F'?Number(f2c(s.v).toFixed(1)):s.v;}
function tempCorner(){const u=tempUnit();
  return `<span class="ut ${u==='C'?'on':''}" onclick="setTempUnit('C')">°C</span><span class="ut ${u==='F'?'on':''}" onclick="setTempUnit('F')">°F</span>`;}
function setTempUnit(u){if(u!=='C'&&u!=='F')return;

function onSetupChange(){const setup=setupById(val('b_setup'));

let tInt=null,tStart=null,tElapsed=0;
function timerHTML(){return `<div class="timer">

/* ============ the door — paste or type, a card out, no adjudication ============

function doorNext1(){doorState.text=val('d_text');const p=doorParse(doorState.text);
  if(!p.roaster&&!p.name&&!Object.keys(p.o).length){toast('Type or paste something first');return}

  }

}
function doorJoin(yes){
  const s=doorState,m=s._roasterMatch;

  doorKind(s.kind);
}
function doorKind(kind){
  const s=doorState;
  const preset=s.preset;
  const roasterRef=mintRoasterIfNeeded(s.roaster,s.roasterRef);
  // brewing it at home means beans in hand — the shelf; a café pour is only
  // tasted until "take it home" says otherwise (ROADMAP.md Phase 4)
  const c={id:uid(),createdAt:new Date().toISOString(),
    roaster:s.roaster||(roasterRef?roasterById(roasterRef).name:''),roasterRef,name:s.name,origin:s.o,roastLevel:s.roastLevel||'',home:kind==='home'};

/* ============ the pull, at the door (ROADMAP.md Phase 25) ============
 * A synced shot already carries two of the home path's three records (the
 * coffee, the brew), so the door skips straight to openImpression rather than
 * asking either — always a home brew, since a synced shot is one by
 * definition. The roaster and the coffee each get one gentle-join question if
 * Carta isn't sure; the Setup gets none (see matchSetupByGrinder). */
async function doorPull(){
  const s=doorState;
  if(!visualizerAuthHeader()){openVisualizerKey();return}
  s.step='pull';s._pullShots=null;s._pullError=null;paintDoor();
  try{s._pullShots=await fetchVisualizerShots(8);}
  catch(e){s._pullError=(e&&e.message)||'Could not reach Visualizer.';}
  if(doorState===s)paintDoor();
}
async function doorPullPicked(id){
  const s=doorState,shot=(s._pullShots||[]).find(x=>x.id===id);if(!shot)return;
  // the curve has to be in hand before a brew is minted from this shot
  // (doorPullFinish is the only place a curve is ever persisted, via
  // setShotCurve) — the door's own picker never opens the shot screen that
  // would otherwise trigger the fetch, so it's awaited here instead
  await ensureShotCurve(shot);
  if(doorState!==s)return; // the keeper backed out while the fetch was in flight
  s._pullShot=shot;
  if(shot.roaster){
    const m=matchNode('roasters',shot.roaster);
    if(m.exact){s._pullRoasterRef=m.exact.id;doorPullResolveCoffee();return}
    if(m.near){s._pullRoasterMatch=m.near;s._joinKind='roaster';s.step='pullJoin';paintDoor();return}
  }
  s._pullRoasterRef=null;
  doorPullResolveCoffee();
}
/* the coffee a shot names, against the shelf. The scope was the resolved
 * roaster's own coffees and nothing else, which meant two common shots were
 * never matched at all and minted a second copy of a coffee already on the
 * shelf: one whose file names no roaster (Visualizer's `bean_brand` is very
 * often blank, so there was no roaster to scope by), and one whose shelf
 * coffee was typed by hand and never had its roaster resolved to a node — a
 * coffee form closed before the roaster field blurred leaves `roasterRef`
 * null, and a null ref matches nothing. So the roaster's own shelf is still
 * looked at first, and where it says nothing the whole shelf is asked the
 * same question. It is still the gentle join: an offer, with the shelf
 * coffee's own roaster named in it, and never a merge. */
function doorPullResolveCoffee(){
  const s=doorState,shot=s._pullShot;
  if(shot.coffeeName){
    const shelf=live('coffees');
    const scoped=s._pullRoasterRef?shelf.filter(c=>c.roasterRef===s._pullRoasterRef):[];
    const inScope=pickCoffeeMatch(scoped,shot.coffeeName);
    const m=inScope||pickCoffeeMatch(shelf,shot.coffeeName);
    // an exact name under the roaster the shot already named is the one case
    // that is not a question — the same coffee, said the same way, by the same
    // roaster. A name matched off the wider shelf is always asked about,
    // however exactly it reads: two roasters can both sell a Kirinyaga AB.
    if(m&&m.exact&&inScope){s._pullCoffeeId=m.exact.id;doorPullFinish();return}
    const near=m&&(m.exact||m.near);
    if(near){s._pullCoffeeMatch=near;s._joinKind='coffee';s.step='pullJoin';paintDoor();return}
  }
  s._pullCoffeeId=null;
  doorPullFinish();
}
const pickCoffeeMatch=(list,name)=>{if(!list.length)return null;const m=matchNodes(list,name);return (m.exact||m.near)?m:null};
function joinCoffeeCardHTML(c){
  const cups=live('cups').filter(x=>x.coffeeRef===c.id).sort(byWhen);
  const last=cups[0]&&(cups[0].at||cups[0].createdAt);
  const under=[c.roaster,(c.origin&&c.origin.process)||'',
    c.createdAt?'on the shelf since '+new Date(c.createdAt).toLocaleDateString(undefined,{day:'numeric',month:'short'}):''].filter(Boolean).join(' · ');
  return `<div style="border:1px solid var(--line);background:var(--surface-card);padding:14px 15px;margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
      <div style="font-family:var(--serif);font-size:17px;min-width:0">${esc(c.name||'Untitled')}</div>
      ${cups.length?`<div class="num" style="font-size:11px;color:var(--ink-3);flex:none">${cups.length} cup${cups.length===1?'':'s'}${last?' · last '+esc(fmtAgo(last)):''}</div>`:''}

function doorPullJoin(yes){
  const s=doorState;
  if(s._joinKind==='roaster'){
    if(yes){joinAlias(s._pullRoasterMatch,s._pullShot.roaster);s._pullRoasterRef=s._pullRoasterMatch.id;}else s._pullRoasterRef=null;
    doorPullResolveCoffee();

// a Setup a pulled shot never names outright: matched silently against the
// keeper's own grinder names, or left as whichever Setup is already current —
// the same fallback vBrew itself uses for a coffee with no brew of its own yet.
// A silent mint carries the brewer or machine beside the grinder too, the same
// pairing the deliberate "A Setup from Visualizer" picker offers — a shot that
// arrives unasked-for shouldn't know less about its own gear than one picked.
function resolveOrMintSetupForShot(shot){
  const setups=live('setups'),grinderModel=shot&&shot.grinderModel;
  if(!setups.length){
    const brewer=brewerOf(shot);
    if(!grinderModel&&!brewer)return null;
    const st={id:uid(),createdAt:new Date().toISOString(),
      name:[grinderModel,brewer].filter(Boolean).join(' · '),grinder:grinderModel||'',brewer};
    D.setups.push(st);return st.id;
  }
  const exact=matchSetupByGrinder(setups,grinderModel);if(exact)return exact;
  const lastBrew=D.brews.slice().sort(byNew)[0];
  return lastBrew?lastBrew.setupId:setups[setups.length-1].id;
}
function doorPullFinish(){
  const s=doorState,shot=s._pullShot;
  const setupId=resolveOrMintSetupForShot(shot);
  if(!setupId){doorState=null;toast('Refused: a brew requires a Setup');return}
  const roasterRef=mintRoasterIfNeeded(shot.roaster,s._pullRoasterRef);
  let coffeeId=s._pullCoffeeId;
  if(!coffeeId){
    const c={id:uid(),createdAt:new Date().toISOString(),
      roaster:shot.roaster||(roasterRef?roasterById(roasterRef).name:''),roasterRef,name:shot.coffeeName,
      origin:{},roastLevel:shot.roastLevel||'',roastDate:shot.roastDate||'',home:true};
    D.coffees.push(c);coffeeId=c.id;
  }
  const brew={id:uid(),createdAt:new Date().toISOString(),coffeeRef:coffeeId,setupId,technique:'',
    grind:shot.grind,doseG:shot.dose,waterG:shot.water,tempC:shot.tempC==null?null:shot.tempC,timeSec:shot.time};
  // the method and the pours ride with the brew (SPEC-phase26-pourover.md §6):
  // the curve itself keeps out of the ledger, but which drawing it gets and
  // what it was actually made of are the brew's own record
  // when the brew actually happened, kept on the brew so the cup written from
  // it — possibly days later — is dated by the pour rather than by the typing
  if(shot.at)brew.at=shot.at;
  if(shot.method==='pourover'){
    brew.method='pourover';
    if(shot.pours&&shot.pours.length)brew.pours=shot.pours;
    if(brewerOf(shot))brew.brewer=brewerOf(shot);
  }
  // the shot this brew was read from, so a re-brew can start from it and the
  // cup can draw its own curve back (Phase 26). The curve itself keeps out of
  // the ledger — see CURVES_KEY. The whole shot is kept beside it
  // (cacheShotRead) so the written cup can open the full plate again later,
  // not merely redraw its hairline — a brew pulled straight at the door has
  // never seen the shot screen, so this is its only chance to keep it.
  if(shot.id!=null){brew.vizShotId=String(shot.id);if(shot.curve){setShotCurve(shot.id,shot.curve);cacheShotRead(shot)}}
  D.brews.push(brew);save();
  const correct=doorState&&doorState._correct;
  doorState=null;closeSheet();
  // correcting drops into the forms that already edit these two records,
  // prefilled — the coffee's sheet standing over the brew's own screen
  if(correct){openBrewFlow(coffeeId,brew.id);openCoffeeForm(coffeeId);return}
  openTasteHome(brew.id);
}

 * A café's menu, typed while you read it (ROADMAP.md Phase 4) — a photo is

 * log a cup on the spot (the coffee is minted and the item points at it

 * Capturing a menu and reading one back were two sheets that never met: you
 * typed the board into one, and the lines came back in the other. It is one

const KMX=(lon,la0)=>lon*111.32*Math.cos(la0*Math.PI/180),KMY=la=>la*111.32;
const TOPO_KM=4500;   // classic's own refusal: a contour too wide to be a line is a smudge

// landKey -> the spelling you actually typed most, so the passport prints your words,
// never the folded lookup key ("united states of america" stays internal, unprinted)
// the passport prints your words: carta-belt asks for them by LANDS key, and
// anything the record hasn't tasted is never labelled at all
window.CARTA_LAND_NAMES=function(){
  const m=tastedCountryMap(),out={};
  Object.keys(m).forEach(k=>{out[k]=m[k].label});
  return out;
};
function tastedCountryMap(){
  const m={};
  live('coffees').forEach(c=>{
    const raw=(c.origin&&c.origin.country||'').trim();if(!raw)return;
    const key=landKey(raw);
    (m[key]=m[key]||{label:raw,counts:{}});
    m[key].counts[raw]=(m[key].counts[raw]||0)+1;
  });
  Object.values(m).forEach(v=>{v.label=Object.entries(v.counts).sort((a,b)=>b[1]-a[1])[0][0]});
  return m;
}
/* the passport — every country LANDS holds a shape for, tasted ones washed and
 * tappable into a chapter, untasted ones a hairline invitation and nothing more
 * (ROADMAP.md Phase 3). One frame, one scale on both axes, fit to hold the whole
 * dataset — the walk down is a tap into a chapter, never a zoom on this frame.
 * Highland contours are ported and drawn through the exact same TOPO_KM gate
 * classic uses; at true world width they are honestly withheld, the same
 * refusal that keeps a street layer off a frame too wide to read at (never a
 * scope cut — the rule simply says no at this frame, faithfully). */
let _passportCache=null;
function passportSVG(interactive){
  interactive=interactive!==false;
  const tasted=tastedCountryMap();
  const keys=Object.keys(LANDS);
  const allPts=[];
  const rings={};
  keys.forEach(k=>{const rs=landRingsRaw(k);if(!rs)return;rings[k]=rs;rs.forEach(r=>r.forEach(p=>allPts.push(p)))});
  if(!allPts.length)return '';
  const la0=allPts.reduce((a,p)=>a+p.lat,0)/allPts.length;
  const px=p=>KMX(p.lon,la0),py=p=>KMY(p.lat);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  allPts.forEach(p=>{const x=px(p),y=py(p);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
  const W=336,P=4;
  const H=Math.round((W-2*P)*(y1-y0)/(x1-x0))+2*P;
  const s=Math.min((W-2*P)/(x1-x0),(H-2*P)/(y1-y0)),cx=(x0+x1)/2,cy=(y0+y1)/2;
  const X=p=>W/2+(px(p)-cx)*s,Y=p=>H/2-(py(p)-cy)*s;
  const n=v=>v.toFixed(1);
  const path=r=>{let d='';r.forEach((p,i)=>{d+=(i?'L':'M')+n(X(p))+' '+n(Y(p))});return d?d+'Z':''};
  const drawTopo=(x1-x0)<=TOPO_KM;   // the same gate classic gates on — see the header note
  let landHTML='',markHTML='';
  keys.forEach(k=>{
    const rs=rings[k];if(!rs)return;
    const d=rs.map(path).join(' ');if(!d)return;
    const t=tasted[k];
    if(t){
      const a=landAnchor(k);
      const lx=a?n(X(a)):n(W/2),ly=a?n(Y(a)):n(H/2);
      const topo=drawTopo?landTopoRaw(k):null;
      const topoHTML=topo?topo.map((lv,i)=>lv.map(r=>{const dd=path(r);return dd?`<path class="topo t${i+1}" d="${dd}"/>`:''}).join('')).join(''):'';
      markHTML+=`<g class="mk"${interactive?` onclick="openCountryChapter(${jsq(t.label)})"`:''}>
        <path class="mk-land" d="${d}"/>${topoHTML}
        <text class="mk-lbl onland" x="${lx}" y="${ly}" text-anchor="middle">${esc(t.label)}</text>
      </g>`;
    }else landHTML+=`<path class="land" d="${d}"/>`;
  });
  return `<div class="plot-box"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${landHTML}${markHTML}</svg></div>`;
}

/* a cup, in a list. The title leads at 18.5px, the meta sits on secondary ink
 * rather than the faintest, and the score is set at 27px tabular — it is the
 * answer the row exists to give, and it used to be the smallest thing on it.
 * The ground the coffee stands on takes the kind-mark's place where the
 * record can place it (Phase 27); a cup without one says plainly whether it
 * was drunk out or at home. */
function cupRowHTML(cup){
  const coffee=coffeeById(cup.coffeeRef);
  const place=cup.kind==='bar'?placeById(cup.placeRef):null;
  const title=cup.kind==='bar'?(place?place.name:'A café'):coffeeLabel(coffee);
  const brew=cup.brewRef?brewById(cup.brewRef):null;
  const meta=[cup.kind==='bar'?coffeeLabel(coffee):brewLine(brew),fmtWhen(cup.at)].filter(Boolean).join(' · ');
  const lead=cupLeadHTML(cup,coffee);
  return `<button class="lrow" onclick="openCupDetail('${cup.id}')">
    ${lead}
    <span class="mid"><span class="t">${esc(title)}</span><span class="m">${esc(meta)}</span></span>
    <span class="sc${cup.score==null?' none':''}">${cup.score==null?'—':cup.score}</span></button>`;
}
// the recipe, said the way a recipe is read aloud — the dials in order, nothing
// spelled out that the numbers already say
function brewLine(b){
  if(!b)return '';
  return [b.grind,b.doseG!=null?b.doseG+' g':null,b.waterG!=null?b.waterG+' g':null,
    b.tempC!=null?b.tempC+' °C':null,b.timeSec!=null?fmtTime(b.timeSec):null].filter(x=>x!=null&&x!=='').join(' · ');
}

  const brew=cup.brewRef?brewById(cup.brewRef):null;
  const setup=brew?setupById(brew.setupId):null;
  // the provenance block, in the order a cup is actually read back: what it
  // was, where it came from, how it was made, whose hands roasted it, and the
  // room it was drunk in. A line the record is silent on says so.
  // how long the coffee had rested when this cup was poured — the figure the
  // cup itself can defend, not today's distance from a roast date
  const roastedLine=(()=>{
    if(!coffee||!coffee.roaster)return '';
    if(!coffee.roastDate||!cup.at)return coffee.roaster;
    const days=Math.round((new Date(cup.at)-new Date(coffee.roastDate+'T00:00'))/864e5);
    if(!isFinite(days)||days<0)return coffee.roaster;
    return `${coffee.roaster} · ${days===0?'the same day':`${days} day${days===1?'':'s'} before`}`;
  })();

    ['Origin',originLine(coffee)],

    ['Café',place?place.name:''],
  ].filter(r=>!(r[0]==='Café'&&cup.kind!=='bar'));
  // station 07, against the board: no photograph, and the score is the page's
  // own answer rather than a figure in its corner. The reading leads at 58px
  // in the ember with what it is stated beside it; the line and what it tasted

  const said=(cup.descriptors||[]).length||cup.line;
  return `<div>

        <div class="display" style="font-size:1.375rem;margin:0">${esc(cup.kind==='bar'?(place?place.name:'A café'):((coffee&&coffee.name)||coffeeLabel(coffee)||'A cup'))}</div>
      </div>

        <div class="s">

          <div class="l">${cup.score==null?'Unscored':'Your reading'}</div>
        </div>
        <div class="a">
          ${cup.line?`<div class="ln">${esc(cup.line)}</div>`:''}
          ${(cup.descriptors||[]).length?`<div class="ds">${cup.descriptors.map(d=>`<span class="dchip sm">${esc(d)}</span>`).join('')}</div>`:''}
          ${said?'':`<div class="ln faint">${cup.kind==='bar'&&place&&place.neighborhood?esc(place.neighborhood):'Nothing said about it.'}</div>`}
        </div>
      </div>
      ${cupPlateHTML(cup,brew)}
      <div style="margin-top:26px">${ledgerHTML(ledger)}</div>
      ${brew&&brew.vizShotId!=null?`<div style="text-align:center;margin-top:20px"><button class="qlink" onclick="openBrewFlow('${coffee?coffee.id:''}')">Brew it again from these ${brew.method==='pourover'?'pours':'numbers'} →</button></div>`:''}
      ${place&&placed([place]).length?`<button style="width:100%;margin-top:18px;color:var(--ink);background:none;border:1px solid var(--line);padding:0;cursor:pointer;display:block" onclick="openCafeScreen('${place.id}')">

/* the plate, kept with the cup (Phase 26) — so a score always has the shot
 * that earned it underneath, at reading size and with the three figures as a
 * foot rule. A cup whose curve isn't on this device simply doesn't draw one;
 * its score, its line and its recipe are all on the ledger and stand alone.
 *
 * Amended v7.33.0: the plate is a door, not only a picture. Reading the brew
 * in full — the scrub, the pours table, the ledger the shot screen states —
 * used to be reachable only on the way to writing the cup, so the moment the
 * cup was written the argument behind it was closed. It is the other way
 * round now: writing the cup is what makes the plate worth keeping, so
 * whatever this cup was read from opens again from here, as often as it is
 * wanted. Only where the whole shot is actually still in hand — a hairline
 * redrawn from the curve store alone is a picture and stays one, since a
 * door onto a screen that would say "isn't in hand any more" is worse than
 * no door. */
function cupPlateHTML(cup,brew){
  if(cup.kind!=='home'||!brew||brew.vizShotId==null)return '';
  const shot=shotOfBrew(brew);
  if(!shot||!shot.curve)return '';
  const openable=!!readShotRead(brew.vizShotId);
  const fg=shotFigures(shot),pour=fg.method==='pourover';
  // the foot rule restates the plate in the method's own three figures — the
  // pours and the drawdown for a filter brew, the peak for a shot
  const foot=(pour
    ?[fg.pours&&fg.pours.length?`${fg.pours.length} pour${fg.pours.length===1?'':'s'}${fg.bloom==null?'':' · '+mmss(fg.bloom)+' bloom'}`:null,
      fg.ratio==null?null:`1:${fig1(fg.ratio)} · ${fig1(fg.dose)} → ${fig1(fg.yield)} g`,
      fg.total==null?null:mmss(fg.total)+(fg.drawdown==null?'':' · '+mmss(fg.drawdown)+' down')]
    :[fg.peak==null?null:fig1(fg.peak)+' bar peak',
      fg.ratio==null?null:`1:${fig1(fg.ratio)} · ${fig1(fg.dose)} → ${fig1(fg.yield)} g`,
      fg.total==null?null:fig1(fg.total)+' s']).filter(Boolean);
  const inner=`${plateSVG(shot,PLATE_FULL,{grid:true,flow:false,weight:true,bands:pour,style:'height:auto'})}
    ${foot.length?`<div style="display:flex;justify-content:space-between;gap:10px;padding:0 20px 10px;font-family:var(--sans);font-size:10px;letter-spacing:.06em;color:var(--ink-3);font-variant-numeric:tabular-nums">
      ${foot.map(f=>`<span>${esc(f)}</span>`).join('')}</div>`:''}`;
  const box='margin:20px -20px 0;background:var(--surface-sunk);border-top:1px solid var(--line);border-bottom:1px solid var(--line)';
  if(!openable)return `<div style="${box}">${inner}</div>`;
  return `<button style="${box};width:calc(100% + 40px);display:block;padding:0;border-left:0;border-right:0;color:inherit;cursor:pointer;text-align:left" onclick="openShotScreen(${jsq(String(brew.vizShotId))},{back:'cup',cupId:${jsq(cup.id)}})">
    ${inner}
    <span style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 20px 12px">
      <span style="font-family:var(--serif);font-style:italic;font-size:12.5px;color:var(--ink-3)">${pour?'Every pour, and the wait after it':'The pressure, second by second'}</span>
      <span class="eyebrow" style="margin:0">Read the brew →</span>
    </span></button>`;
}
/* when the cup happened, corrected by hand (v7.31.6).
 *
 * Confirmed against a live account: Visualizer carries exactly one timestamp
 * per brew — the list's `clock` and the file's `start_time` are the same value
 * on every shot — and for an uploader that files after the fact that is when
 * the record was made, not when the coffee was poured. There is no second
 * field to read and no honest way to derive one, so it becomes what `agitation`
 * already is: a fact the instrument does not hold, left to the keeper to
 * state. The brew moves with the cup, so a re-brew starts from the same
 * moment and the two never disagree. */
function openCupWhen(cupId){
  const cup=cupById(cupId);if(!cup)return;
  const d=new Date(cup.at||cup.createdAt||Date.now());
  const pad=n=>String(n).padStart(2,'0');
  const local=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  openSheet(`<h3>When was this cup?</h3>
  <div class="sub">Read off the instrument where one said so, and yours to correct where none did.</div>
  <label class="f"><span class="l">Poured</span><input type="datetime-local" id="cw_at" value="${esc(local)}"></label>
  <button class="btn btn-primary" onclick="saveCupWhen('${cup.id}')">Save</button>
  <button class="btn btn-quiet" onclick="closeSheet()">Cancel</button>
  <div class="note">A scale files a brew when it syncs, not when you poured it, and most of them state no other time — so this is the one figure on the page an instrument can be wrong about. The journal reads in this order.</div>`);
}
function saveCupWhen(cupId){
  const cup=cupById(cupId);if(!cup)return;
  const v=val('cw_at');
  if(!v){toast('Name a date and a time');return}
  const t=new Date(v);
  if(isNaN(t)){toast("That date didn't read");return}
  const was=cup.at;
  cup.at=t.toISOString();cup.updatedAt=new Date().toISOString();
  // the brew it was read from moves with it — a re-brew starts from the same
  // moment, and the two records never state different afternoons
  const brew=cup.brewRef?brewById(cup.brewRef):null;
  if(brew)brew.at=cup.at;
  save();closeSheet();render();
  toast('Moved to '+fmtWhenLong(cup.at)+'.',()=>{
    cup.at=was;if(brew)brew.at=was;save();render();
  },'Undo');
}

/* ============ Visualizer — pulled, not typed (ROADMAP.md Phase 24) ============
 * BYO Basic Auth, named for what it is in openVisualizerKey(): Visualizer's

 * (only curves), so the temp dial stays exactly as manual as it always was. */
const visualizerEmail=()=>getPref('visualizerEmail','');
const visualizerPassword=()=>getPref('visualizerPassword','');
const visualizerAuthHeader=()=>{
  const e=visualizerEmail(),p=visualizerPassword();
  return e&&p?'Basic '+btoa(`${e}:${p}`):null;
};
// station 02 (Phase 26): the same two fields, plus the one permission this
// phase adds — said in full, and what it costs, before either field is typed
function openVisualizerKey(){
  openSheet(`<h3>Your Visualizer account</h3>

}

function clearVisualizerKey(){
  setPref('visualizerEmail','');setPref('visualizerPassword','');setPref('vizWatch',false);

  // device" has to be true of what was read off it, not just the password.
  // A cup already written keeps its own curve (CURVES_KEY): that one belongs

const VISUALIZER_BASE='https://visualizer.coffee/api/shots';
async function callVisualizer(path){
  const auth=visualizerAuthHeader();if(!auth)throw new Error('Set your Visualizer account first.');
  const r=await fetch(VISUALIZER_BASE+path,{headers:{'Authorization':auth}});
  if(!r.ok)throw new Error(r.status===401?"Visualizer didn't recognize that email or password.":`Visualizer call failed (${r.status}).`);
  return r.json();
}
function applyVisualizerShot(shot){['dose','water','time','grind'].forEach(k=>{if(shot[k]!=null)setDial(k,shot[k])});}
// shared by both pickers (dial-in's, door's — Phase 25): the list route only
// names {clock,id}, so each shot's essentials are fetched in parallel, capped at n.
/* the list, and what it does with a shot it could not read. That `catch` used
 * to return null and say nothing, so a shot Carta threw on simply vanished —
 * and a list where every shot vanished read as "no brews on your account",
 * which is a different and much more alarming claim than the truth. It counts
 * them now (`_shots.unread`) and the screen says which it means. */
async function fetchVisualizerShots(n){
  const list=(await callVisualizer(`?page=1&items=${n}`)).data||[];
  let unread=0;
  const rows=(await Promise.all(list.map(async s=>{
    try{return {...parseVisualizerShot(await callVisualizer(`/${s.id}/download`)),clock:s.clock,id:s.id}}
    catch(e){unread++;return null}
  }))).filter(Boolean);
  rows.unread=unread;rows.listed=list.length;
  return rows;
}

/* ============ a Setup from Visualizer (Phase 26 amendment, v7.32.0) ============
 * The primary door onto a new Setup, wherever one is added from — the record's
 * own "＋ A new Setup" and the empty Setups door both lead here first when

 * it reads what a handful of recent shots already say about the gear behind
 * them instead of asking the keeper to type it. Unreachable, or nothing found,
 * and "Type it in instead" reaches the exact blank form this always could. */
let _setupCandidates=[];
