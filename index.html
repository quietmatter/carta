function landPts(s){
  const pts=[];let i=0,x=0,y=0;
  const rd=()=>{let r=0,m=1,c;do{c=LAND_I[s[i++]];r+=(c&31)*m;m*=32}while(c&32);return (r&1)?-((r+1)/2):r/2};
  while(i<s.length){x+=rd();y+=rd();pts.push({lon:x/20,lat:y/20})}
  return pts;
}
let _landRingsCache={};
function landRingsRaw(key){
  if(key in _landRingsCache)return _landRingsCache[key];
  const enc=LANDS[key];
  return _landRingsCache[key]=enc?enc.split(';').map(landPts):null;
}
let _landTopoCache={};
function landTopoRaw(key){
  if(key in _landTopoCache)return _landTopoCache[key];
  const enc=LAND_TOPO[key];
  return _landTopoCache[key]=enc?enc.split(';').map(lv=>lv?lv.split(',').filter(Boolean).map(landPts):[]):null;
}
function landKey(name){const f=fold(name||'');return LAND_AKA[f]||f}
function landAnchor(key){
  const rs=landRingsRaw(key);if(!rs||!rs.length)return null;
  const big=rs.reduce((a,r)=>r.length>a.length?r:a,rs[0]);
  return {lat:big.reduce((a,p)=>a+p.lat,0)/big.length,lon:big.reduce((a,p)=>a+p.lon,0)/big.length};
}
const KMX=(lon,la0)=>lon*111.32*Math.cos(la0*Math.PI/180),KMY=la=>la*111.32;
const TOPO_KM=4500;   // classic's own refusal: a contour too wide to be a line is a smudge

// landKey -> the spelling you actually typed most, so the passport prints your words,
// never the folded lookup key ("united states of america" stays internal, unprinted)
// the passport prints your words: carta-belt asks for them by LANDS key, and
// anything the record hasn't tasted is never labelled at all
window.CARTA_LAND_NAMES=function(){
  const m=tastedCountryMap(),out={};
  Object.keys(m).forEach(k=>{out[k]=m[k].label});
  return out;
};
function tastedCountryMap(){
  const m={};
  live('coffees').forEach(c=>{
    const raw=(c.origin&&c.origin.country||'').trim();if(!raw)return;
    const key=landKey(raw);
    (m[key]=m[key]||{label:raw,counts:{}});
    m[key].counts[raw]=(m[key].counts[raw]||0)+1;
  });
  Object.values(m).forEach(v=>{v.label=Object.entries(v.counts).sort((a,b)=>b[1]-a[1])[0][0]});
  return m;
}
/* the passport — every country LANDS holds a shape for, tasted ones washed and
 * tappable into a chapter, untasted ones a hairline invitation and nothing more
 * (ROADMAP.md Phase 3). One frame, one scale on both axes, fit to hold the whole
 * dataset — the walk down is a tap into a chapter, never a zoom on this frame.
 * Highland contours are ported and drawn through the exact same TOPO_KM gate
 * classic uses; at true world width they are honestly withheld, the same
 * refusal that keeps a street layer off a frame too wide to read at (never a
 * scope cut — the rule simply says no at this frame, faithfully). */
let _passportCache=null;
function passportSVG(interactive){
  interactive=interactive!==false;
  const tasted=tastedCountryMap();
  const keys=Object.keys(LANDS);
  const allPts=[];
  const rings={};
  keys.forEach(k=>{const rs=landRingsRaw(k);if(!rs)return;rings[k]=rs;rs.forEach(r=>r.forEach(p=>allPts.push(p)))});
  if(!allPts.length)return '';
  const la0=allPts.reduce((a,p)=>a+p.lat,0)/allPts.length;
  const px=p=>KMX(p.lon,la0),py=p=>KMY(p.lat);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  allPts.forEach(p=>{const x=px(p),y=py(p);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
  const W=336,P=4;
  const H=Math.round((W-2*P)*(y1-y0)/(x1-x0))+2*P;
  const s=Math.min((W-2*P)/(x1-x0),(H-2*P)/(y1-y0)),cx=(x0+x1)/2,cy=(y0+y1)/2;
  const X=p=>W/2+(px(p)-cx)*s,Y=p=>H/2-(py(p)-cy)*s;
  const n=v=>v.toFixed(1);
  const path=r=>{let d='';r.forEach((p,i)=>{d+=(i?'L':'M')+n(X(p))+' '+n(Y(p))});return d?d+'Z':''};
  const drawTopo=(x1-x0)<=TOPO_KM;   // the same gate classic gates on — see the header note
  let landHTML='',markHTML='';
  keys.forEach(k=>{
    const rs=rings[k];if(!rs)return;
    const d=rs.map(path).join(' ');if(!d)return;
    const t=tasted[k];
    if(t){
      const a=landAnchor(k);
      const lx=a?n(X(a)):n(W/2),ly=a?n(Y(a)):n(H/2);
      const topo=drawTopo?landTopoRaw(k):null;
      const topoHTML=topo?topo.map((lv,i)=>lv.map(r=>{const dd=path(r);return dd?`<path class="topo t${i+1}" d="${dd}"/>`:''}).join('')).join(''):'';
      markHTML+=`<g class="mk"${interactive?` onclick="openCountryChapter(${jsq(t.label)})"`:''}>
        <path class="mk-land" d="${d}"/>${topoHTML}
        <text class="mk-lbl onland" x="${lx}" y="${ly}" text-anchor="middle">${esc(t.label)}</text>
      </g>`;
    }else landHTML+=`<path class="land" d="${d}"/>`;
  });
  return `<div class="plot-box"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${landHTML}${markHTML}</svg></div>`;
}

/* ============ views ============ */
/* a cup, in a list. The title leads at 18.5px, the meta sits on secondary ink
 * rather than the faintest, and the score is set at 27px tabular — it is the
 * answer the row exists to give, and it used to be the smallest thing on it.
 * The photo takes the kind-mark's place when there is one; a cup without one
 * says plainly whether it was drunk out or at home. */
function cupRowHTML(cup){
  const coffee=coffeeById(cup.coffeeRef);
  const place=cup.kind==='bar'?placeById(cup.placeRef):null;
  const title=cup.kind==='bar'?(place?place.name:'A café'):coffeeLabel(coffee);
  const brew=cup.brewRef?brewById(cup.brewRef):null;
  const meta=[cup.kind==='bar'?coffeeLabel(coffee):brewLine(brew),fmtWhen(cup.at)].filter(Boolean).join(' · ');
  const lead=cup.photo
    ?`<img class="ph" src="${getCupPhoto(cup.id)||''}" alt="">`
    :`<span class="kind">${cup.kind==='bar'?'out':'home'}</span>`;
  return `<button class="lrow" onclick="openCupDetail('${cup.id}')">
    ${lead}
    <span class="mid"><span class="t">${esc(title)}</span><span class="m">${esc(meta)}</span></span>
    <span class="sc${cup.score==null?' none':''}">${cup.score==null?'—':cup.score}</span></button>`;
}
// the recipe, said the way a recipe is read aloud — the dials in order, nothing
// spelled out that the numbers already say
function brewLine(b){
  if(!b)return '';
  return [b.grind,b.doseG!=null?b.doseG+' g':null,b.waterG!=null?b.waterG+' g':null,
    b.tempC!=null?b.tempC+' °C':null,b.timeSec!=null?fmtTime(b.timeSec):null].filter(x=>x!=null&&x!=='').join(' · ');
}

/* ============ the Journal — the record, and a reason to open it ============
 * The list is the room's substance, but a list of what you already did is not a
 * reason to come back. The continuation leads: the last cup you brewed, its
 * score, its recipe, what you found, and one tap to begin the next from it.
 */
function vJournal(){
  const cups=live('cups').sort(byNew);
  return `<div>
  <header class="shdr">
    <div>
      <div class="eyebrow" style="margin-bottom:6px">The record</div>
      <div class="display" style="margin:0;white-space:nowrap">Every <em>cup</em></div>

    <button class="omini bare" onclick="openTaste()">Taste →</button>
  </header>
  <div class="pad" style="padding-top:6px">
    ${continuationHTML()}
    <div class="shead" style="margin-top:0"><span class="l">Every cup, newest first</span></div>
    ${cups.length?cups.map(cupRowHTML).join(''):'<div class="empty">Tap ＋ A cup to start the record.</div>'}
    ${cups.length?'<div class="note">Nothing is deleted. Put a cup away and it leaves the list, not the record.</div>':''}
    ${archivedFold('cups',cupRowHTML,'Put away')}

// the continuation (design-system pattern, hero-loop): the last cup brewed at
// home, carried forward. Nothing invented — every figure on it is already on
// the record, and the one action begins the next brew from exactly there.
function continuationHTML(){
  const home=live('cups').filter(c=>c.kind==='home'&&c.brewRef).sort(byNew);
  const last=home[0]||live('cups').sort(byNew)[0];
  if(!last)return '';
  const coffee=coffeeById(last.coffeeRef);
  if(!coffee)return '';
  const brew=last.brewRef?brewById(last.brewRef):null;
  const origin=[coffee.roaster,(coffee.origin&&coffee.origin.process||'').toLowerCase(),coffee.origin&&coffee.origin.country].filter(Boolean).join(' · ');
  return `<div class="box firm" style="margin:12px 0 22px">
    <div class="eyebrow" style="color:var(--accent);margin-bottom:8px">${esc(fmtWhen(last.at))}</div>

      <span style="min-width:0">
        <span class="num" style="display:block;font-size:12.5px;color:var(--ink-2)">${esc(brewLine(brew)||'No recipe on that one.')}</span>
        <span style="display:block;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-3);margin-top:3px">${esc(last.line||'No line on that one.')}</span>

}

// the hero's own photo, added after the fact: the cup is already on the record,
// so this writes straight through to the photo store, never the ledger (§2:3)
function cupHeroPicked(e,cupId){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  compressPhoto(f).then(dataUri=>{
    const cup=cupById(cupId);if(!cup)return;
    setCupPhoto(cupId,dataUri);cup.photo=true;save();render();
    if(storageUsedBytes()>STORAGE_SOFT_LIMIT)toast('Storage is getting full — back up your record.');
  }).catch(()=>toast('Could not read that photo'));
}

// café cup → shelf card, one tap (ROADMAP.md Phase 4): a coffee only tasted
// at a café isn't on the shelf until this says it is — a brew always is.
function takeItHome(coffeeId){
  const c=coffeeById(coffeeId);if(!c||c.home)return;
  c.home=true;c.homeAt=new Date().toISOString();c.updatedAt=c.homeAt;
  save();render();toast('Added to the shelf — brew it whenever.');
}
// a fact the shelf already knows and used to say nothing about (ROADMAP.md
// Phase 11) — homeAt is stamped only by the café-to-shelf bridge above, so
// this never fires for a coffee that started home (door/form): those were
// never "taken home" from somewhere else, and a brew there is the ordinary
// next step, not a stall worth a line about.
const TAKEN_HOME_QUIET_DAYS=7;
function takenHomeNote(c){
  if(!c.home||!c.homeAt)return '';
  if(D.brews.some(b=>b.coffeeRef===c.id))return '';
  const days=Math.floor((Date.now()-new Date(c.homeAt))/864e5);
  if(days<TAKEN_HOME_QUIET_DAYS)return '';
  return 'not brewed yet';
}

  const setups=D.setups.filter(x=>!x.archived||(setup&&x.id===setup.id));
  const techs=[...new Set(D.brews.map(x=>x.technique).filter(Boolean))];

/* ============ your taste — the hunt, folded into the Atlas ============
 * Scout was a room whose output was geography, so it stopped being a room: it
 * reads from the Atlas ("Your taste") and from the Journal, and everything it
 * argued still argues here — the bar, the vector, the brief, the ask, the year.

 */
function vTaste(){
  const cups=live('cups').filter(c=>c.score!=null);
  const head=`<header class="shdr" style="align-items:center;gap:14px">
    <button class="omini bare" style="flex:none" onclick="closePage()" aria-label="Back">←</button>
    <div style="flex:1;min-width:0">

      <div class="display" style="font-size:1.5rem;margin:0">Your taste, <em>argued</em></div>
    </div>
  </header>`;
  if(!cups.length){
    return `<div>${head}<div class="pad" style="padding-top:20px">
      <div class="lede">The brief reads the record — log a few cups first, and there'll be something to argue from.</div>
      <button class="btn btn-quiet" onclick="go('journal')">To the journal</button>
    </div></div>`;
  }
  const tm=tasteModelMemo();
  const anchor=tm.bar.anchors[0];
  const notice=tm.vector.descriptors[0];
  const claims=[
    tm.bar.floor!=null?`A café earns the walk at <strong>${tm.bar.floor} or better</strong>.`:null,
    anchor?`You keep going back to <strong>${esc(anchor.name)}</strong>.`:null,
    notice?`What you notice, first and most, is <strong>${esc(notice.value)}</strong>.`:null,
  ].filter(Boolean).join(' ');
  const cities=knownCities();
  return `<div>${head}
  <div class="pad" style="padding-top:20px">
    <div style="font-family:var(--serif);font-size:21px;line-height:1.45;color:var(--ink);max-width:32ch">${claims||'Not enough yet to argue from.'}</div>
    <div style="font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-3);margin-top:12px">Every figure below carries its own reasons — no number without them.</div>

    <div class="shead" style="margin-top:28px"><span class="l">The bar</span><span class="r">${tm.bar.floor!=null?tm.bar.floor+'+ / 9 worth the walk':''}</span></div>
    ${tm.bar.anchors.length?tm.bar.anchors.slice(0,5).map(a=>`
      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)">
        <span style="min-width:0">
          <span style="display:block;font-family:var(--serif);font-size:17px">${esc(a.name)}</span>
          <span style="display:block;font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-top:2px">${a.n} cup${a.n===1?'':'s'}, none under ${Math.min(...a.cupRefs.map(id=>{const c=cupById(id);return c&&c.score!=null?c.score:9}))}</span>
        </span>
        <span class="num" style="flex:none;font-size:22px;font-weight:600">${a.avg.toFixed(1)}</span>
      </div>`).join('')
      :'<div class="muted" style="padding:12px 0">No anchors yet — a roaster earns one at 8+ over two cups.</div>'}

    <div class="shead" style="margin-bottom:14px"><span class="l">What earns your scores</span></div>
    ${vectorRowHTML('Roast',tm.vector.roast)}
    ${vectorRowHTML('Process',tm.vector.processes)}
    ${vectorRowHTML('Origin',tm.vector.origins)}
    ${vectorRowHTML('Notice',tm.vector.descriptors)}

    <div class="box firm" style="margin-top:26px">
      <div class="eyebrow">The brief</div>
      <div class="lede" style="margin-bottom:16px">Send this to a model with your own key, or copy it as plain text. Every café it names is checked against a real place before it lands on your map.</div>
      ${cities.length?`<label class="f"><span class="l">Scope</span><select id="brief_scope">
        <option value="">Everywhere</option>
        ${cities.map(c=>`<option value="city:${esc(c)}">${esc(c)}</option>`).join('')}
      </select></label>`:'<input type="hidden" id="brief_scope" value="">'}
      <div class="btnrow">
        <button class="btn btn-primary" style="min-height:48px" onclick="openAsk()">Ask Carta</button>
        <button class="btn btn-quiet" style="flex:none;width:auto;padding:0 16px;min-height:48px" onclick="openBrief()">Copy</button>
      </div>
    </div>
    ${askSectionHTML()}
    ${yearSectionHTML()}
  </div></div>`;
}
function askSectionHTML(){

/* ============ sharing an exported page — a friend's phone, or a download ============
 * One door for every card and the brief alike. navigator.share with a real
 * File hits the OS share sheet where it exists (texts, AirDrop, anywhere) —
 * that's PIVOT.md's actual done-when, not a file sitting in Downloads. Falls
 * back to a plain download wherever share isn't offered, or is cancelled. */
function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function shareOrDownload(html,filename,title){
  const blob=new Blob([html],{type:'text/html'});
  try{
    const file=new File([blob],filename,{type:'text/html'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:title||'Carta'});
      return;
    }
  }catch(e){if(e&&e.name==='AbortError')return}   // the keeper cancelled the share sheet — not a failure
  downloadBlob(blob,filename);
  toast('Downloaded — open it anywhere, forever.');
}
function downloadBriefPage(scopeKind,scopeId){

  const name=`carta-brief${scopeId?'-'+fold(scopeId).replace(/\s+/g,'-'):''}.html`;
  shareOrDownload(html,name,'The brief');
}
function copyPlainText(str,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(str).then(()=>toast(msg||'Copied.'));return}
  const ta=document.createElement('textarea');ta.value=str;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy')}catch(e){}
  ta.remove();toast(msg||'Copied.');
}

/* ============ durability (ROADMAP.md Phase 8) — the record's one safety net ============
 * Carta is one device, one localStorage key, zero sync, by design
 * (ARCHITECTURE.md §3) — right for a hobby, but it means the whole journal's
 * durability has rested on a habit nobody was ever asked to form. Quiet and
 * factual, never urgency theater: a stated fact on the Shelf, the same
 * register as a coffee's own rest window. */
function weeksSince(iso){return Math.floor(Math.floor((Date.now()-new Date(iso))/864e5)/7)}
function exportedLine(){
  const at=getPref('exportedAt',null);
  if(!at)return 'Never backed up yet.';
  const w=weeksSince(at);
  if(w<1)return 'Backed up this week.';
  return `Last backed up — ${w} week${w===1?'':'s'} ago.`;
}
function exportLedgerJSON(){
  const stamp=new Date().toISOString().slice(0,10);
  downloadBlob(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),`carta-${stamp}.json`);
  setPref('exportedAt',new Date().toISOString());
  render();
  toast('Backed up — saved to your downloads.');
}
const AUTO_EXPORT_DAYS=14;   // a fortnight between quiet backups, opt-in only
function maybeAutoExport(){
  if(!getPref('autoExport',false))return;
  const at=getPref('exportedAt',null);
  const days=at?Math.floor((Date.now()-new Date(at))/864e5):Infinity;
  if(days>=AUTO_EXPORT_DAYS)exportLedgerJSON();
}
// a rough, conservative measure of what this origin has already spent in
// localStorage — most browsers cap it near 5MB; warn well before a write
// actually fails, not only after (savePhotos()'s own catch stays the last
// line of defense, not the first)
const STORAGE_SOFT_LIMIT=4.5*1024*1024;
function storageUsedBytes(){
  let used=0;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);used+=(k.length+(localStorage.getItem(k)||'').length)}}catch(e){}
  return used*2;   // UTF-16 — the unit a browser's quota actually counts against
}

}

/* ============ the ask — scout, stage two (ROADMAP.md Phase 7) ============
 * The one sanctioned outbound call (ARCHITECTURE.md §7): the keeper's own
 * Anthropic key, kept in prefs on this device only, sent to nobody but
 * Anthropic and only when "Ask Carta" is tapped. No key, or the call fails —
 * the degrade is the brief, copied, exactly like stage one. Every café the
 * model names is checked against a real place lookup (Nominatim, keyless)
 * before it's ever drawn as a pin — what can't be confirmed is listed, never
 * guessed onto the frame (the grounding rule, non-negotiable). */
const ASK_MODEL_DEFAULT='claude-haiku-4-5-20251001';
const askKey=()=>getPref('askKey','');
const askModel=()=>getPref('askModel','')||ASK_MODEL_DEFAULT;
function openAskKey(){

  <div class="sub">An Anthropic API key, kept on this device only — nothing else ever reads it, and it's never sent anywhere but Anthropic, only when you tap Ask.</div>

  </div>`);
}
function saveAskKey(){

  toast('Saved — on this device only.');
  openAsk();
}
function clearAskKey(){setPref('askKey','');setPref('askModel','');openAskKey();}
function openAsk(){
  if(!askKey()){
    openSheet(`<h3>Ask Carta</h3>
    <div class="sub">Carta sends your brief and a question to a model, on your behalf — this is the one thing here that calls out, and it needs your own key first.</div>
    <div class="empty">No key set yet.</div>
    <div class="btnrow">
      <button class="btn btn-quiet" onclick="copyPlainText(briefPlainText(D,null,null,tasteModelMemo()),'Copied — paste it into your chat.')">Copy the brief instead</button>
      <button class="btn btn-primary" onclick="openAskKey()">Set your key</button>
    </div>`);

  }
  openSheet(`<h3>Ask Carta</h3>
  <div class="sub">Sent with your taste, scoped the way you're actually asking.</div>
  <label class="f"><span class="l">Kind</span><select id="ask_kind">
    <option value="city">A city</option>
    <option value="neighborhood">A neighborhood</option>
    <option value="country">A country</option>
    <option value="route">A route</option>
    <option value="friend">A friend</option>
  </select></label>
  <label class="f"><span class="l">Where</span><input type="text" id="ask_dest" placeholder="Lisbon — or &quot;she likes what I like but darker&quot;"></label>
  <label class="f"><span class="l">Anything else? <span class="opt">optional</span></span><textarea id="ask_question" placeholder="Three days, mostly on foot…"></textarea></label>
  <button class="btn btn-primary" onclick="runAsk()">Ask Carta</button>
  <div id="ask_result"></div>
  <div class="muted small" style="margin-top:10px"><span onclick="openAskKey()" style="text-decoration:underline;cursor:pointer">Change your key</span></div>`);
}
// the one door — content is either a plain prompt string (the ask) or a
// content-block array carrying an image plus a prompt (the menu's OCR)
async function callModel(content){
  const key=askKey();if(!key)throw new Error('Set your key first.');
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:askModel(),max_tokens:1024,messages:[{role:'user',content}]}),
  });
  if(!r.ok){
    let msg=`The model call failed (${r.status}).`;
    try{const j=await r.json();if(j&&j.error&&j.error.message)msg=j.error.message}catch(e){}
    throw new Error(msg);
  }
  const j=await r.json();
  return (j.content||[]).map(b=>b.text||'').join('');
}
const callAskModel=prompt=>callModel(prompt);
async function callVisionModel(prompt,imageDataUri){
  const m=String(imageDataUri||'').match(/^data:([^;]+);base64,([\s\S]*)$/);
  if(!m)throw new Error('Could not read that photo.');
  return callModel([{type:'image',source:{type:'base64',media_type:m[1],data:m[2]}},{type:'text',text:prompt}]);
}
async function geocodeCafe(name,neighborhood,city){
  const q=[name,neighborhood,city].filter(Boolean).join(', ');
  if(!q)return null;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
    if(!r.ok)return null;
    const list=await r.json();
    if(!list||!list.length)return null;
    const lat=Number(list[0].lat),lon=Number(list[0].lon);
    return (isFinite(lat)&&isFinite(lon))?{lat,lon}:null;
  }catch(e){return null}
}
let _askBusy=false;
async function runAsk(){
  if(_askBusy)return;
  const kind=val('ask_kind')||'city';
  const destination=val('ask_dest');

  if(!destination){toast('Where should Carta ask about?');return}
  const box=document.getElementById('ask_result');if(!box)return;
  _askBusy=true;

    if(kind==='city'&&knownCity){scopeKind='city';scopeId=knownCity}
    else if(kind==='country'){scopeKind='country';scopeId=destination}
    const briefText=briefPlainText(D,scopeKind,scopeId,tm);
    const prompt=askPromptText(briefText,kind,destination,question);
    const raw=await callAskModel(prompt);
    const parsed=parseAskJSON(raw);
    const findings=[];
    for(const f of parsed.findings){
      const geo=await geocodeCafe(f.name,f.neighborhood,f.city||(kind==='city'?destination:''));
      findings.push({id:uid(),name:f.name,neighborhood:f.neighborhood,city:f.city||(kind==='city'?destination:''),
        why:f.why,lat:geo?geo.lat:null,lon:geo?geo.lon:null,grounded:!!geo,status:null,placeRef:null});
    }
    const ask={id:uid(),createdAt:new Date().toISOString(),kind,destination,question,model:askModel(),findings};
    D.asks.unshift(ask);save();
    _askBusy=false;

  }catch(e){
    _askBusy=false;
    const msg=(e&&e.message)||'Could not reach the model.';
    box.innerHTML=`<div class="empty">${esc(msg)}</div>
    <button class="btn btn-quiet" onclick="copyPlainText(briefPlainText(D,null,null,tasteModelMemo()),'Copied — paste it into your chat.')">Copy the brief instead</button>`;
  }
}
function findingRowHTML(f){

function askOf(findId){for(const a of D.asks){const f=a.findings.find(x=>x.id===findId);if(f)return {a,f}}return null}
function setFindStatus(findId,status){

/* ============ the map surfaces — one vocabulary, three elements ============
 * carta-maps.js draws all three (loaded in the <head>): <carta-belt> for the
 * world frame, on Natural Earth's own outlines through d3 + topojson;
 * <carta-streets> for real streets, OpenStreetMap through Leaflet, filtered to
 * Carta's ink; and <carta-plot> for the drawn plot — a handful of points fit to
 * a box, offline, no tiles at all. They live in light DOM, so every var() in
 * this file's token layer resolves inside them, dusk included.
 *
 * MAPPING.md's law is unchanged by any of it: a mark is a lens, never a rank,
 * and the ember is never spent on the ground. Everything below is only the
 * translation — the record turned into the pin list those elements read.
 */
// a place the record can actually put on a map — a name is not a position
const placed=list=>(list||[]).filter(p=>p.lat!=null&&p.lon!=null&&isFinite(p.lat)&&isFinite(p.lon));
// score rides along only so a pin can say whether it's been lived: filled if it
// has one, a ring if it hasn't. Never a rank, never a colour.
function pinsAttr(list,scoreOf){
  return esc(JSON.stringify(placed(list).map(p=>({id:p.id||'',name:p.name||'',lat:p.lat,lon:p.lon,
    score:scoreOf?scoreOf(p):(p.score!=null?p.score:null),dim:!!p.dim}))));
}
/* the streets, and what stands in for them when they can't be reached. The
 * drawn plot is the identity, not the fallback's consolation prize
 * (ARCHITECTURE.md §7 — an enhancement, never a dependency): offline it simply
 * draws, and says so once, in one line, no red. */
function streetsHTML(list,o){
  o=o||{};
  const pts=placed(list);
  if(!pts.length)return o.emptyHTML||'';
  const pins=pinsAttr(pts,o.scoreOf);
  // the drawn plot is drawn FIRST and always (ARCHITECTURE.md §7, MAPPING.md's
  // own law one scale down): the streets are laid over it, and a surface that
  // can't reach them steps aside rather than leaving a grey rectangle. fit="frame"
  // is what keeps every point inside the box — the plot scales into the frame
  // rather than sizing the frame to itself.
  const floor=`<div class="plotwrap" style="${o.plotWrap||'position:absolute;inset:0;padding:42px 34px'}">
      <carta-plot class="plot frame" fit="frame" pins="${pins}" dot="${o.dot||7}" labels="${o.labels||'off'}"></carta-plot>
    </div>`;
  const note=`<div class="smap-note" style="${o.noteStyle||''}"><span>Streets unavailable — showing saved positions.</span><span class="text-action" onclick="render()">Retry</span></div>`;
  const streets=`<carta-streets style="position:absolute;inset:0" pins="${pins}"${o.zoom?` zoom="${o.zoom}"`:''}${o.still?' still="on"':''}${o.insetBottom?` inset-bottom="${o.insetBottom}"`:''} attrib-lift="${o.attribLift||0}"></carta-streets>`;
  return `<div class="mapbox" style="${o.boxStyle||''}"${o.noteStyle?` data-note-style="${esc(o.noteStyle)}"`:''}>
    ${floor}${navigator.onLine?streets:note}
  </div>`;
}
// the thumbnail a city or a café carries in a list — the drawn plot, always,
// never a tile: a row is read at a glance and a glance can't wait on a network.
function plotThumbHTML(list){
  const pts=placed(list);
  if(!pts.length)return '<span class="mapthumb"></span>';
  return `<span class="mapthumb"><carta-plot class="plot frame" pins="${pinsAttr(pts)}" dot="12" fit="frame"></carta-plot></span>`;
}

/* the city's sheet — pulled up over its own streets, and the map re-framing
 * itself into whatever's left rather than remounting. Its height is measured,
 * not guessed: the screen is whatever the device gives it, and 43% of a guess
 * is a sheet that covers its own pins. carta-streets re-fits in place through
 * its own marks(), so the tiles are never refetched — the pins simply move
 * clear of the paper coming up to meet them. */
let _citySheetUp=false;
function toggleCitySheet(){_citySheetUp=!_citySheetUp;mountCity()}
function mountCity(){
  const sheet=document.getElementById('citysheet');if(!sheet)return;
  const main=document.getElementById('main');
  const h=Math.round((main.clientHeight||620)*(_citySheetUp?0.74:0.43));
  sheet.style.height=h+'px';
  const list=sheet.querySelector('.list');
  if(list)list.style.height=Math.max(0,h-74)+'px';
  // offline the drawn plot holds this screen: keep it clear of the sheet the
  // same way the streets keep their pins clear of it
  const wrap=document.querySelector('#main .plotwrap');
  if(wrap)wrap.style.bottom=h+'px';
  const map=document.querySelector('#main carta-streets');
  if(!map)return;
  map.setAttribute('inset-bottom',String(h));
  map.setAttribute('attrib-lift',String(h+10));
  if(typeof map.marks==='function')map.marks();   // re-fit in place; no remount, no refetch
}

/* the ask's pins — a suggestion is a ring until it's lived. Filled once you've
 * been or booked, dimmed once skipped; what couldn't be confirmed against a
 * real place is never drawn here at all (the grounding rule, non-negotiable). */
function askPinsHTML(askId){
  const a=D.asks.find(x=>x.id===askId);if(!a)return `<div id="ask_pins_${askId}"></div>`;
  const pts=placed(a.findings.filter(f=>f.grounded)).map(f=>({id:f.id,name:f.name,lat:f.lat,lon:f.lon,
    score:(f.status==='been'||f.status==='booked')?1:null,dim:f.status==='skip'}));
  return `<div id="ask_pins_${askId}">${pts.length?streetsHTML(pts,
    {boxStyle:'height:200px;border:1px solid var(--line);margin:6px 0 14px',dot:6}):''}</div>`;
}

/* the taps a map sends back. Both events bubble out of carta-maps' elements as
 * plain CustomEvents, so one listener each is the whole wiring — a country goes
 * to its chapter, a pin goes wherever the pin means from where you're standing:
 * a café from inside its city, the city itself from anywhere else. */
document.addEventListener('carta:country-tap',e=>{
  const name=String((e.detail&&e.detail.name)||'');if(!name)return;
  const t=tastedCountryMap()[landKey(name)];
  openCountryChapter(t?t.label:name);
});
document.addEventListener('carta:pin-tap',e=>{
  const id=String((e.detail&&e.detail.id)||'');if(!id)return;
  if(askOf(id)){openAskFinding(id);return}   // an ask's own pin, inside its sheet
  const p=placeById(id);if(!p)return;
  const kind=pageView&&pageView.kind;
  if(kind==='city'||kind==='cafe'||kind==='cup'){closeSheet();openCafeScreen(id)}
  else if(p.city)openCityChapter(p.city);
});
// geocoding a café is the same lookup the ask already grounds its suggestions
// with (geocodeCafe, Phase 7) — one keyless Nominatim door, two callers. Fills
// blanks only, tries each place at most once ever (`geocoded`), and paces
// itself a second apart per Nominatim's own usage policy — a city chapter
// is a handful of cafés, never a bulk job.
let _geocoding=new Set(),_geoRenderT=null;
async function geocodeCityPlaces(city){
  const targets=live('places').filter(p=>p.city&&fold(p.city)===fold(city)&&p.lat==null&&!p.geocoded&&!_geocoding.has(p.id));
  for(const p of targets){
    _geocoding.add(p.id);
    const geo=await geocodeCafe(p.name,'',p.city);
    p.geocoded=true;
    if(geo){p.lat=geo.lat;p.lon=geo.lon}
    _geocoding.delete(p.id);
    save();
    // one repaint once the batch settles, not one per café: a repaint replaces
    // the screen's DOM, and the street layer inside it goes with it — so a
    // render per resolution turned "confirms quietly" into a map that flickers
    // and refetches its tiles every ~1.1s for any city with more than one
    // un-placed café. The debounce outlives the loop's own pacing, so a steady
    // drip of resolutions keeps pushing it out and it only fires once, after
    // the last one.
    const on=pageView&&((pageView.kind==='city'&&fold(pageView.id)===fold(city))
      ||(pageView.kind==='cafe'&&targets.some(t=>t.id===pageView.id)));
    if(on){
      clearTimeout(_geoRenderT);
      _geoRenderT=setTimeout(render,1400);
    }
    await new Promise(r=>setTimeout(r,1100));
  }
}

/* ============ the return loop, without gamification (ROADMAP.md Phase 11) ============
 * A fact stated once, not a badge: the exact moment a country or city
 * first lands on the passport, one sentence plus the offer to share it
 * while the win is fresh — never a streak, a badge, or a percent-complete
 * (the fifth tripwire, ROADMAP.md §"the tripwires"). Bootstraps silently
 * against whatever's already tasted the first time this ever runs, so an
 * existing record — or a bulk classic import, which never calls this at
 * all — doesn't flood with "new!" for ground that was never actually new.
 * A brand-new keeper's very first country stays silent too: everything is
 * "new" on day one, and announcing each one of a first sitting's cups
 * reads exactly like the onboarding-reward pattern this phase refuses. */
function newGroundToast(kind,rawValue,fallbackMsg){
  const value=(rawValue||'').trim();
  if(!value){if(fallbackMsg)toast(fallbackMsg);return}
  const prefKey=kind==='country'?'seenCountries':'seenCities';
  const key=kind==='country'?landKey(value):fold(value);
  const currentKeys=kind==='country'?Object.keys(tastedCountryMap()):knownCities().map(fold);
  let seen=getPref(prefKey,null);
  if(!seen){setPref(prefKey,currentKeys);if(fallbackMsg)toast(fallbackMsg);return}
  if(seen.includes(key)){if(fallbackMsg)toast(fallbackMsg);return}
  setPref(prefKey,[...seen,key]);
  const label=kind==='country'?((tastedCountryMap()[key]||{}).label||value):value;
  toast(`New ground: ${label}.`,()=>sharePassportCard(),'Share the passport');
}

let importPending=null;

  importPending=null;

function importCardPicked(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const text=String(reader.result);
    const m=text.match(/<script type="application\/json" id="carta-card">([\s\S]*?)<\/script>/);
    if(!m){toast('That file doesn\'t look like a Carta card');return}
    let data;try{data=JSON.parse(m[1])}catch(err){toast('Could not read that card');return}
    if(!data||data.version!=='carta.card/v1'||(data.kind!=='coffee'&&data.kind!=='place')){
      toast('That card isn\'t a coffee or a café — nothing to add');return}
    importPending=data;
    const el=document.getElementById('import_preview');if(!el)return;
    el.innerHTML=data.kind==='coffee'
      ?`<div class="card"><div class="kv"><span class="k">Roaster</span><span class="v">${esc(data.data.roaster||'—')}</span></div><div class="kv"><span class="k">Name</span><span class="v">${esc(data.data.name||'—')}</span></div></div>
        <button class="btn btn-primary" onclick="confirmImportCard()">Add to my Carta</button>`
      :`<div class="card"><div class="kv"><span class="k">Café</span><span class="v">${esc(data.data.name||'—')}</span></div>${data.data.city?`<div class="kv"><span class="k">City</span><span class="v">${esc(data.data.city)}</span></div>`:''}</div>
        <button class="btn btn-primary" onclick="confirmImportCard()">Add to my Carta</button>`;
  };
  reader.onerror=()=>toast('Could not read that file');
  reader.readAsText(f);
}
function confirmImportCard(){
  if(!importPending)return;
  const d=importPending;
  if(d.kind==='coffee'){
    const rr=resolveRoaster(d.data.roaster||'');
    D.coffees.push({id:uid(),createdAt:new Date().toISOString(),roaster:rr.name||d.data.roaster||'',roasterRef:rr.ref,
      name:d.data.name||'',origin:d.data.origin||{},notes:d.data.notes||'',home:true});
    toast('Added to your shelf.');
  }else{
    const m=matchNode('places',d.data.name||'');
    if(m.exact){if(!m.exact.city&&d.data.city)m.exact.city=d.data.city}
    else D.places.push({id:uid(),createdAt:new Date().toISOString(),name:d.data.name||'',city:d.data.city||'',aka:[]});
    toast('Added to your record.');
  }
  importPending=null;save();closeSheet();render();
}

/* ============ the Atlas — home, with the map in front ============
 * The passport is the first thing the app shows and the largest thing on the

// numbers, said the way the rest of the app talks. Past ninety-nine a figure
// is a figure again — spelling it out would be affectation, not voice.
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function words(n){
  n=Math.round(n);
  if(n<0||n>99)return String(n);
  if(n<20)return ONES[n];
  return TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:'');
}
const capFirst=s=>s.charAt(0).toUpperCase()+s.slice(1);
const trimNum=n=>Number(n.toFixed(1)).toString();
// every cup the record can trace to a country, counted by that country
function countryCupCounts(){
  const m={};
  live('cups').forEach(c=>{
    const co=coffeeById(c.coffeeRef);
    const raw=co&&co.origin&&co.origin.country;
    if(!raw)return;
    const k=landKey(raw);m[k]=(m[k]||0)+1;
  });
  return m;
}
const placeCups=placeId=>live('cups').filter(c=>c.kind==='bar'&&c.placeRef===placeId&&c.score!=null);
function placeAvg(placeId){const cs=placeCups(placeId);return cs.length?cs.reduce((s,c)=>s+c.score,0)/cs.length:null}

  const cups=live('cups').filter(c=>c.kind==='bar'&&ids.has(c.placeRef));
  let lead=null;
  places.forEach(p=>{const a=placeAvg(p.id);if(a!=null&&(!lead||a>lead.avg))lead={name:p.name,avg:a}});
  return [`${places.length} café${places.length===1?'':'s'}`,
    `${cups.length} cup${cups.length===1?'':'s'}`,
    lead?`${lead.name} leads at ${trimNum(lead.avg)}`:null].filter(Boolean).join(' · ');
}

/* ============ a country — the chapter under its own shape ============ */
function vCountryChapter(label){
  const key=landKey(label);
  const coffees=live('coffees').filter(c=>c.origin&&landKey(c.origin.country||'')===key);
  const byRegion={};
  coffees.forEach(c=>{
    const raw=((c.origin&&c.origin.region)||'').trim();
    const rk=raw?fold(raw):'';
    (byRegion[rk]=byRegion[rk]||{label:raw||'Unspecified region',coffees:[],counts:{}});
    byRegion[rk].coffees.push(c);
    if(raw)byRegion[rk].counts[raw]=(byRegion[rk].counts[raw]||0)+1;
  });
  Object.values(byRegion).forEach(v=>{const es=Object.entries(v.counts);if(es.length)v.label=es.sort((a,b)=>b[1]-a[1])[0][0]});
  const regions=Object.values(byRegion).sort((a,b)=>b.coffees.length-a.coffees.length);
  const roasters=[...new Set(coffees.map(c=>c.roaster).filter(Boolean))];
  return `<div>
    <div style="position:relative">
      <div class="mapbox passport" style="height:300px">

      <div class="display big">${esc(label)}</div>

      ${regions.length?`<div class="shead"><span class="l">By region</span></div>
        ${regions.map(r=>`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)">
          <span style="font-family:var(--serif);font-size:17px">${esc(r.label)}</span>
          <span class="num" style="font-size:13px;color:var(--ink-3)">${r.coffees.length}</span></div>`).join('')}`:''}
      <div class="shead"><span class="l">The coffees</span></div>
      ${coffees.length?coffees.slice().sort(byNew).map(c=>`<button class="lrow" style="min-height:56px" onclick="openCoffeeDetail('${c.id}')">
        <span class="mid"><span class="t" style="font-size:18px">${esc(coffeeLabel(c))}</span><span class="m">${esc(originLine(c))}</span></span>
        <span class="go">→</span></button>`).join(''):'<div class="empty">Nothing from here yet.</div>'}
    </div>
  </div>`;
}

/* ============ a city — streets, edge to edge, with the record over them ============
 * The map is the screen; the list is a sheet you pull up over it. Pull it up
 * and the map re-frames rather than remounting, so the pins step clear of the
 * paper instead of hiding under it.
 */
function vCityChapter(city){
  const places=cityPlaces(city);
  const rows=places.slice().sort((a,b)=>{
    const av=placeAvg(a.id),bv=placeAvg(b.id);
    return (bv==null?-1:bv)-(av==null?-1:av)||a.name.localeCompare(b.name);
  });
  // the sheet owns the bottom of this screen, so the drawn plot is padded clear
  // of it and the offline line sits under the title rather than behind the paper
  const map=streetsHTML(places,{boxStyle:'position:absolute;inset:0',scoreOf:p=>placeAvg(p.id),
    // a plot scaled into the band above the sheet gets small — the dot grows to
    // meet it, since a mark you can't see isn't a mark
    labels:'on',dot:16,noteStyle:'top:82px;bottom:auto',
    plotWrap:'position:absolute;left:0;right:0;top:0;bottom:43%;padding:92px 34px 14px',
    emptyHTML:'<div class="mapbox" style="position:absolute;inset:0"></div>'});
  return `<div class="cityroot">
    ${map}
    <div class="fade top" style="height:130px;z-index:3"></div>
    <div class="overlay" style="left:18px;right:18px;top:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
      <button class="omini" onclick="closePage()">← Atlas</button>
      <div style="text-align:right">
        <div class="eyebrow" style="margin:0">A city</div>
        <div style="font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.15;letter-spacing:-.01em">${esc(city)}</div>
      </div>
    </div>
    <div class="citysheet" id="citysheet">
      <button class="pull" onclick="toggleCitySheet()" aria-label="Pull the list up"><span></span></button>
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:2px 20px 10px">
        <span style="font-family:var(--sans);font-size:var(--s11);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500">Your cafés here</span>
        <span style="font-family:var(--sans);font-size:var(--s11);color:var(--ink-3);letter-spacing:.04em">${esc(cityMetaLine(city))}</span>
      </div>
      <div class="list noscroll">
        ${rows.length?rows.map(p=>{
          const a=placeAvg(p.id),n=placeCups(p.id).length;
          return `<button class="lrow" style="min-height:60px" onclick="openCafeScreen('${p.id}')">
            <span class="mid"><span class="t">${esc(p.name)}</span>
            <span class="m">${esc([p.neighborhood||'',a!=null?`${n} cup${n===1?'':'s'}`:'not scored yet'].filter(Boolean).join(' · '))}</span></span>
            <span class="sc${a==null?' none':''}">${a==null?'—':a.toFixed(1)}</span></button>`;
        }).join(''):'<div class="empty">No cafés logged here yet.</div>'}
        <div class="note">Positions confirmed once, then kept. Offline, the drawn plot stands on its own.</div>
      </div>
    </div>
  </div>`;
}

/* ============ theme — paper by day, dusk by night, following the device ============ */
const duskMQ=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  document.documentElement.setAttribute('data-theme',duskMQ.matches?'dusk':'paper');
  const mc=document.querySelector('meta[name=theme-color]');
  if(mc)mc.setAttribute('content',duskMQ.matches?'#171310':'#f2eee6');
  // a live street map repaints itself: carta-streets watches <html data-theme>
  // and re-filters its own tiles in place, no remount, no refetch
}
duskMQ.addEventListener('change',applyTheme);
