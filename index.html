      ${rmarks.length?`<div class="note" style="border:0;padding:0;margin:0 0 12px">${esc(`${capFirst(words(rmarks.length))} of them stand on the map above, on the ground their own farms were placed on. Tap one.`)}</div>`:''}
      ${unplaced.length?`<button class="rowlink" style="padding:12px 0" onclick="placeFarms(${jsq(label)},'')">
        <span style="min-width:0"><span class="t" style="display:block;font-size:16px">Place ${unplaced.length===regions.length?'these regions':'the rest'} on the map</span>
        <span class="m" style="display:block;margin-top:2px">${esc(`${words(unplaced.length)} region${unplaced.length===1?'':'s'} · looks each farm up once, and leaves the ones it can't name`)}</span></span>
        <span class="go">→</span></button>`:''}
      ${regions.map(r=>`<button class="lrow" onclick="openRegionChapter(${jsq(label)},${jsq(r.label)})">
        <span class="mid"><span class="t">${esc(r.label)}</span><span class="m">${esc(greensMeta(r))}</span></span>
        <span class="sc${r.avg==null?' none':''}">${r.avg==null?'—':trimNum(r.avg)}</span>
        <span class="go">→</span></button>`).join('')}
      ${silentRegion.length?`<button class="lrow" onclick="openRegionChapter(${jsq(label)},'')">
        <span class="mid"><span class="t">No region named</span>
        <span class="m">${esc(`${words(silentRegion.length)} coffee${silentRegion.length===1?'':'s'} · the bag stopped at the country`)}</span></span>
        <span class="go">→</span></button>`:''}

      <div class="shead"><span class="l">The hands that grew it</span>
        <span class="r">${words(growers.length)} named${noGrower?` · ${words(noGrower)} unread`:''}</span></div>
      ${growers.length?growers.map(g=>{
        const producer=g.items.map(c=>String(originOf(c).producer||'').trim()).find(Boolean);
        const meta=[producer&&fold(producer)!==fold(g.label)?producer:null,
          `${words(g.items.length)} green${g.items.length===1?'':'s'}`].filter(Boolean).join(' · ');
        return `<button class="rowlink" style="padding:13px 0" onclick="openProducerPage(${jsq(label)},${jsq(g.label)},${jsq(regionOf(g.items[0]))})">
          <span style="min-width:0"><span class="t" style="display:block;font-size:17px">${esc(g.label)}</span>
          <span class="m" style="display:block;margin-top:2px">${esc(meta)}</span></span>
          <span class="go">→</span></button>`;
      }).join(''):'<div class="muted" style="padding:12px 0">No bag here has named a hand yet.</div>'}
      ${noGrower?`<div class="note">${esc(`${capFirst(words(noGrower))} of these coffees name${noGrower===1?'s':''} no hand at all.`)} A bag that says nothing is not a lesser coffee — it is a record that has been told less.</div>`:''}

      <div class="shead"><span class="l">The hands that roast from here</span></div>
      ${roasters.map(r=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)">
        <span style="font-family:var(--serif);font-size:17px">${esc(r.label)}</span>
        <span class="num" style="font-size:12.5px;color:var(--ink-3)">${esc(`${words(r.items.length)} green${r.items.length===1?'':'s'}`)}${r.avg==null?'':' · '+trimNum(r.avg)}</span>
      </div>`).join('')}

      ${pours.length?`<div class="shead"><span class="l">Where it pours</span>
        <span class="r">${words(pourCities.length)} cit${pourCities.length===1?'y':'ies'}</span></div>
        ${pours.map(p=>{
          const n=cups.filter(c=>c.placeRef===p.id).length;
          return `<button class="rowlink" style="padding:13px 0" onclick="openCafeScreen('${p.id}')">
            <span style="font-family:var(--serif);font-size:17px">${esc(p.name)}</span>
            <span class="m">${esc([p.city,`${words(n)} cup${n===1?'':'s'}`].filter(Boolean).join(' · '))}</span></button>`;
        }).join('')}`:''}

      ${cups.length?`<div class="box" style="margin-top:30px">
        <div class="eyebrow">What you found here</div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px">
          <div class="lede" style="margin:0;max-width:24ch">${esc(`${capFirst(words(cups.length))} cup${cups.length===1?'':'s'}.`)}${best?esc(` Your ${best.score} was ${coffeeLabel(coffeeById(best.coffeeRef))}, ${best.kind==='bar'?'drunk out':'drunk at home'}.`):''}</div>
          ${a!=null?`<div style="flex:none;text-align:right">
            <div class="bigscore" style="font-size:38px">${trimNum(a)}</div>
            <div class="ofnine">your average</div></div>`:''}
        </div>
        <button class="btn btn-quiet" style="margin-top:16px" onclick="openCountryCups(${jsq(label)})">The cups from ${esc(label)} →</button>
      </div>`:''}
      <div class="note" style="margin-top:22px">Your scores stay yours. Nothing on this page is averaged into anyone else’s.</div>
    </div>
  </div>`;
}

/* ============ a region — the same question, at a finer grain ============ */
function regionFarmPins(coffees){
  return groupStated(coffees,growerOf).map(g=>{
    const at=regionPin(g.items);
    return at?{id:g.label,name:g.label,lat:at.lat,lon:at.lon,score:avgOf(cupsOfCoffees(g.items))}:null;
  }).filter(Boolean);
}
function vRegionChapter(country,view){
  const region=(view&&view.region)||'';
  const all=countryCoffees(country);
  const coffees=region?all.filter(c=>fold(regionOf(c))===fold(region)):all.filter(c=>!regionOf(c));
  const label=region||'No region named';
  const cups=cupsOfCoffees(coffees);
  const growers=groupStated(coffees,growerOf).sort((x,y)=>y.items.length-x.items.length);
  const noGrower=coffees.length-growers.reduce((s,g)=>s+g.items.length,0);
  const processes=groupStated(coffees,c=>originOf(c).process).sort((x,y)=>y.items.length-x.items.length);
  const noProcess=coffees.length-processes.reduce((s,g)=>s+g.items.length,0);
  const repeats=growers.filter(g=>g.items.length>1)[0];
  const lede=coffees.length?[
    `${capFirst(words(coffees.length))} coffee${coffees.length===1?'':'s'}`,
    repeats?`, ${words(repeats.items.length)} of them from the same hand`:'',
    '.',
    cups.length?` ${capFirst(words(cups.length))} cup${cups.length===1?'':'s'} read from ${coffees.length===1?'it':'them'}.`:'',
  ].join('')
    :(region?'Nothing from here on the record yet.':'Every coffee here named its region — nothing stopped at the country.');
  /* the ground itself, where the record can stand on it. Altitude is most of why
   * a coffee from here tastes the way it does, so the region's own relief is the
   * page's first fact — real terrain over the drawn plot, which holds the same
   * farms and simply stands when the tiles can't be reached (ARCHITECTURE.md §7).
   * A farm with no confirmed position is listed below and never pinned up here. */
  const fpins=regionFarmPins(coffees);
  const unplaced=growers.length-fpins.length;
  const head=fpins.length
    ? streetsHTML(fpins,{terrain:true,names:true,zoom:11,dot:7,labels:'on',boxStyle:'height:322px',attribLift:2,
        plotWrap:'position:absolute;inset:0;padding:54px 40px',
        noteStyle:'position:absolute;left:0;right:0;bottom:0;z-index:3'})
    : `<div class="mapbox passport" style="height:260px">
        <carta-belt style="position:absolute;inset:0" fit="cover" lift="on" labels="off" topo="on" tasted="${esc(country)}" focus="${esc(country)}"></carta-belt>
      </div>`;
  return `<div>
    <div style="position:relative">
      ${head}
      <div class="fade top" style="height:88px;z-index:3"></div>
      <button class="omini overlay" style="left:18px;top:18px" onclick="openCountryChapter(${jsq(country)})">← ${esc(country)}</button>
    </div>
    <div class="lift pad" style="padding-top:22px">
      <div class="eyebrow" style="margin:4px 0 6px">A region · ${esc(country)}</div>
      <div class="display big">${esc(label)}</div>
      <div class="lede">${esc(lede)}</div>
      ${fpins.length?`<div class="note" style="border:0;padding:0;margin:0 0 4px">${esc(`${capFirst(words(fpins.length))} farm${fpins.length===1?'':'s'} stand${fpins.length===1?'s':''} on the ground above${unplaced>0?`; ${words(unplaced)} more ${unplaced===1?'is':'are'} named but not placed`:''}. Tap a pin for its ledger.`)}</div>`:''}
      ${unplaced>0&&region?`<button class="rowlink" style="padding:12px 0" onclick="placeFarms(${jsq(country)},${jsq(region)})">
        <span style="min-width:0"><span class="t" style="display:block;font-size:16px">${esc(fpins.length?'Place the rest':'Put these farms on the ground')}</span>
        <span class="m" style="display:block;margin-top:2px">${esc(`${words(unplaced)} farm${unplaced===1?'':'s'} · one lookup each, and the ones the map can't name back stay listed`)}</span></span>
        <span class="go">→</span></button>`:''}
      ${altitudeBandHTML(coffees)}

      <div class="shead"><span class="l">The hands that grew it</span>
        <span class="r">${words(growers.length)} named${noGrower?` · ${words(noGrower)} unread`:''}</span></div>
      ${growers.map(g=>{
        const producer=g.items.map(c=>String(originOf(c).producer||'').trim()).find(Boolean);
        const meta=[producer&&fold(producer)!==fold(g.label)?producer:null,
          `${words(g.items.length)} green${g.items.length===1?'':'s'}`].filter(Boolean).join(' · ');
        return `<button class="rowlink" style="padding:14px 0;min-height:58px" onclick="openProducerPage(${jsq(country)},${jsq(g.label)},${jsq(region)})">
          <span style="min-width:0"><span class="t" style="display:block;font-size:17px">${esc(g.label)}</span>
          <span class="m" style="display:block;margin-top:2px">${esc(meta)}</span></span>
          <span class="go">→</span></button>`;
      }).join('')}
      ${noGrower?`<div class="rowlink" style="padding:14px 0;cursor:default">
        <span style="min-width:0"><span class="t" style="display:block;font-size:17px;color:var(--ink-3)">${esc(`${capFirst(words(noGrower))} green${noGrower===1?'':'s'} name${noGrower===1?'s':''} no hand`)}</span>
        <span class="m" style="display:block;margin-top:2px">unread — the bag stopped at the region</span></span></div>`:''}

      ${processes.length||noProcess?`<div class="shead" style="margin-bottom:14px"><span class="l">How it was made</span></div>
      <div class="picks">
        ${processes.map(p=>`<span class="dchip">${esc(p.label)} — ${words(p.items.length)}</span>`).join('')}
        ${noProcess?`<span class="dchip" style="color:var(--text-disabled)">Unread — ${words(noProcess)}</span>`:''}
      </div>`:''}

      <div class="shead"><span class="l">The greens</span>
        <span class="r">${words(coffees.length)} on the record</span></div>
      ${coffees.slice().sort((x,y)=>(avgOf(cupsOfCoffees([y]))||-1)-(avgOf(cupsOfCoffees([x]))||-1)).map(c=>{
        const ca=avgOf(cupsOfCoffees([c])),n=cupsOfCoffees([c]).length;
        return `<button class="lrow" onclick="openCoffeeDetail('${c.id}')">
          <span class="mid"><span class="t" style="font-size:17.5px">${esc(coffeeLabel(c))}</span>
          <span class="m">${esc([originOf(c).process,n?`${words(n)} cup${n===1?'':'s'}`:'not scored'].filter(Boolean).join(' · '))}</span></span>
          <span class="sc${ca==null?' none':''}">${ca==null?'—':trimNum(ca)}</span></button>`;
      }).join('')}
      <div class="note" style="margin-top:14px">A region is a scope, not a page of its own making: everything here is the same question the country asked, at a finer grain.</div>
    </div>
  </div>`;
}

/* ============ a producer — the last name the bag gave ============
 * Where the farm went. The record holds four lines about a farm the trade
 * knows a book about, and says so plainly: `unread` is designed here as a
 * first-class state, never a blank and never a low default.
 */
function vProducerPage(name,view){
  const country=(view&&view.country)||'';
  const region=(view&&view.region)||'';
  const coffees=countryCoffees(country).filter(c=>fold(growerOf(c))===fold(name));
  const cups=cupsOfCoffees(coffees);
  const roasters=groupStated(coffees,c=>c.roaster);
  const producer=coffees.map(c=>String(originOf(c).producer||'').trim()).find(Boolean)||'';
  const varieties=[...new Set(coffees.map(c=>String(originOf(c).variety||'').trim()).filter(Boolean))];
  const processes=[...new Set(coffees.map(c=>String(originOf(c).process||'').trim()).filter(Boolean))];
  const alts=coffees.reduce((a,c)=>a.concat(altitudesOf(c)),[]);
  const first=coffees.slice().sort((a,b)=>a.createdAt.localeCompare(b.createdAt))[0];
  const pours=[...new Set(cups.filter(c=>c.kind==='bar'&&c.placeRef).map(c=>c.placeRef))].map(placeById).filter(Boolean);
  const ledger=[
    ['Grower',producer&&fold(producer)!==fold(name)?producer:''],
    ['Altitude',alts.length?(Math.min(...alts)===Math.max(...alts)?`${Math.min(...alts).toLocaleString()} m`:`${Math.min(...alts).toLocaleString()} – ${Math.max(...alts).toLocaleString()} m`):''],
    ['Varieties',varieties.join(' · ')],
    ['Processing',processes.join(' · ')],
    ['First on record',first?fmtMonth(first.createdAt):''],
  ];
  const stated=ledger.filter(r=>r[1]).length;
  const lede=coffees.length?[
    `${capFirst(words(coffees.length))} green${coffees.length===1?'':'s'} on the record`,
    cups.length?`, ${words(cups.length)} cup${cups.length===1?'':'s'}`:'',
    roasters.length>1?`, from ${words(roasters.length)} roasters`:'',
    '. What the trade knows about this hand, your record holds ',
    stated?`${words(stated)} line${stated===1?'':'s'} of.`:'nothing of yet.',
  ].join('')
    :'Nothing from this hand on the record yet.';
  return `<div>
    <header class="shdr" style="display:block">
      <button class="back" onclick="${region?`openRegionChapter(${jsq(country)},${jsq(region)})`:`openCountryChapter(${jsq(country)})`}">← ${esc(region||country)}</button>
      <div class="eyebrow" style="margin-bottom:6px">A farm${region?` · ${esc(region)}, ${esc(country)}`:country?` · ${esc(country)}`:''}</div>
      <div class="display" style="margin:0">${esc(name)}</div>
    </header>
    <div class="pad" style="padding-top:20px">
      <div class="lede">${esc(lede)}</div>
      ${ledgerHTML(ledger)}
      <div class="note" style="border:0;padding:0;margin:12px 0 0">Unread is a state, not a low default. Nothing here is guessed to fill a line.</div>
      ${farmGroundHTML(country,name,coffees)}
      <button class="btn btn-quiet" style="margin-top:14px" onclick="openCoffeeForm(${coffees[0]?`'${coffees[0].id}'`:''})">Add what the bag says</button>

      <div class="shead"><span class="l">The greens</span></div>
      ${coffees.map(c=>{
        const ca=avgOf(cupsOfCoffees([c])),n=cupsOfCoffees([c]).length;
        return `<button class="lrow" onclick="openCoffeeDetail('${c.id}')">
          <span class="mid"><span class="t" style="font-size:17.5px">${esc(coffeeLabel(c))}</span>
          <span class="m">${esc([originOf(c).process,n?`${words(n)} cup${n===1?'':'s'}`:'not scored'].filter(Boolean).join(' · '))}</span></span>
          <span class="sc${ca==null?' none':''}">${ca==null?'—':trimNum(ca)}</span></button>`;
      }).join('')}

      ${pours.length?`<div class="shead"><span class="l">Where it pours</span></div>
      ${pours.map(p=>{
        const n=cups.filter(c=>c.placeRef===p.id).length;
        return `<button class="rowlink" style="padding:13px 0" onclick="openCafeScreen('${p.id}')">
          <span style="font-family:var(--serif);font-size:17px">${esc(p.name)}</span>
          <span class="m">${esc([p.city,`${words(n)} cup${n===1?'':'s'}`].filter(Boolean).join(' · '))}</span></button>`;
      }).join('')}`:''}
      <div class="note" style="margin-top:22px">The roaster owns the roast, never the farm. This page is compiled from what the bags said, and it says who said it.</div>
    </div>
  </div>`;
}

/* the ground a farm stands on. A position is stated here the same two ways a
 * café's is — one lookup that has to name the farm back, or a pin pasted off
 * the map the keeper already has — and it is taken back the same way too. A
 * farm the map cannot name is not a failed record; it is most farms, and the
 * page says so in those words rather than leaving a blank. */
function farmGroundHTML(country,name,coffees){
  if(!country||!name)return '';
  const at=regionPin(coffees);
  const id='fm_'+fold(name).replace(/ /g,'_');
  const paste=`<label class="f" style="margin-top:10px"><span class="l">Or paste a map link</span>
    <input type="text" id="${id}" placeholder="Copied from Google or Apple Maps…"></label>
    <button class="btn btn-quiet" style="min-height:40px" onclick="pasteFarmLink(${jsq(country)},${jsq(name)},'${id}')">Place it</button>`;
  if(at)return `<div class="box" style="margin-top:20px">
    <div class="eyebrow" style="margin-bottom:10px">Its ground</div>
    ${streetsHTML([{id:name,name:name,lat:at.lat,lon:at.lon,score:1}],{terrain:true,zoom:12,dot:7,
      boxStyle:'height:190px',attribLift:2,plotWrap:'position:absolute;inset:0;padding:48px 40px',
      noteStyle:'position:absolute;left:0;right:0;bottom:0;z-index:3'})}
    <div class="m" style="margin-top:12px">${esc(`${at.lat.toFixed(3)}, ${at.lon.toFixed(3)}`)} · <span class="text-action" onclick="unplaceFarm(${jsq(country)},${jsq(name)})">not here?</span></div>
  </div>`;
  return `<div class="box" style="margin-top:20px">
    <div class="eyebrow" style="margin-bottom:4px">Its ground</div>
    <div class="m">Not placed. Most farms are not on the map by name, which is a fact about the map.</div>
    <div class="m" style="margin-top:12px"><span class="text-action" onclick="placeFarms(${jsq(country)},${jsq(regionOf(coffees[0])||'')})">Look it up</span></div>
    ${paste}</div>`;
}
// a pin the keeper is vouching for needs no lookup to confirm it — it IS the
// confirmation, the same reading Phase 16 settled on for a café
function pasteFarmLink(country,name,inputId){
  const el=document.getElementById(inputId);
  const at=parseMapLink(el&&el.value);
  if(!at){toast('Couldn\u2019t read a position from that — paste the map\u2019s own link, not a shortened share link.');return}
  setFarmPin(country,name,at);save();render();
  toast('Placed.',()=>{clearFarmPin(country,name);save();render()},'Undo');
}
function unplaceFarm(country,name){
  const was=farmCoffees(country,name).map(c=>({c,lat:originOf(c).lat,lon:originOf(c).lon}));
  clearFarmPin(country,name);save();render();
  toast('Taken off the map.',()=>{was.forEach(w=>{if(w.lat!=null){w.c.origin.lat=w.lat;w.c.origin.lon=w.lon;w.c.origin.geocoded=true}});save();render()},'Undo');
}

/* ============ a city — streets, edge to edge, with the record over them ============
 * The map is the screen; the list is a sheet you pull up over it. Pull it up
 * and the map re-frames rather than remounting, so the pins step clear of the
 * paper instead of hiding under it.
 */
function vCityChapter(city){
  const places=cityPlaces(city);
  const rows=places.slice().sort((a,b)=>{
    const av=placeAvg(a.id),bv=placeAvg(b.id);
    return (bv==null?-1:bv)-(av==null?-1:av)||a.name.localeCompare(b.name);
  });
  // the sheet owns the bottom of this screen, so the drawn plot is padded clear
  // of it and the offline line sits under the title rather than behind the paper
  const map=streetsHTML(places,{boxStyle:'position:absolute;inset:0',scoreOf:p=>placeAvg(p.id),
    // a plot scaled into the band above the sheet gets small — the dot grows to
    // meet it, since a mark you can't see isn't a mark
    labels:'on',dot:16,noteStyle:'top:82px;bottom:auto',
    plotWrap:'position:absolute;left:0;right:0;top:0;bottom:43%;padding:92px 34px 14px',
    emptyHTML:'<div class="mapbox" style="position:absolute;inset:0"></div>'});
  return `<div class="cityroot">
    ${map}
    <div class="fade top" style="height:130px;z-index:3"></div>
    <div class="overlay" style="left:18px;right:18px;top:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
      <button class="omini" onclick="closePage()">← Atlas</button>
      <div style="text-align:right">
        <div class="eyebrow" style="margin:0">A city</div>
        <div style="font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.15;letter-spacing:-.01em">${esc(city)}</div>
      </div>
    </div>
    <div class="citysheet" id="citysheet">
      <button class="pull" onclick="toggleCitySheet()" aria-label="Pull the list up"><span></span></button>
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:2px 20px 10px">
        <span style="font-family:var(--sans);font-size:var(--s11);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500">Your cafés here</span>
        <span style="font-family:var(--sans);font-size:var(--s11);color:var(--ink-3);letter-spacing:.04em">${esc(cityMetaLine(city))}</span>
      </div>
      <div class="list noscroll">
        ${rows.length?rows.map(p=>{
          const a=placeAvg(p.id),n=placeCups(p.id).length;
          return `<button class="lrow" style="min-height:60px" onclick="openCafeScreen('${p.id}')">
            <span class="mid"><span class="t">${esc(p.name)}</span>
            <span class="m">${esc([p.branches&&p.branches.length?'several here — place it':p.neighborhood||'',a!=null?`${n} cup${n===1?'':'s'}`:'not scored yet'].filter(Boolean).join(' · '))}</span></span>
            <span class="sc${a==null?' none':''}">${a==null?'—':a.toFixed(1)}</span></button>`;
        }).join(''):'<div class="empty">No cafés logged here yet.</div>'}
        <div class="note">Positions are confirmed against a real address, and any café can be looked up again. Offline, the drawn plot stands on its own.</div>
        <button class="btn btn-quiet" style="margin-top:10px" onclick="openAskScreenFor(${jsq(city)})">Ask Carta about ${esc(city)}</button>
      </div>
    </div>
  </div>`;
}

/* ============ theme — paper by day, dusk by night, following the device ============ */
const duskMQ=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  document.documentElement.setAttribute('data-theme',duskMQ.matches?'dusk':'paper');
  const mc=document.querySelector('meta[name=theme-color]');
  if(mc)mc.setAttribute('content',duskMQ.matches?'#171310':'#f2eee6');
  // a live street map repaints itself: carta-streets watches <html data-theme>
  // and re-filters its own tiles in place, no remount, no refetch
}
duskMQ.addEventListener('change',applyTheme);

/* ============ version ============ */
const APP_VERSION='7.23.0';
const CHANGELOG=[
  {v:'7.23.0',d:"The coffee, never lost to a swipe. Adding or editing a coffee used to hold everything you typed only in the form itself — dismiss the sheet before tapping Save, on purpose or by an accidental swipe, and it was gone. It saves as you type now, the moment a roaster or a name is on the page, so starting an entry at the bar and finishing the rest once there's time to look it up actually works: swipe away, put the phone down, come back later — whatever was typed is already on the Shelf, right where you left it."},
  {v:'7.22.0',d:"The file, split in two. Nothing changes on the screen — this is the debt Phase 18 landed and Phase 20 knowingly deepened, paid down at last. The map layer (the passport's outlines, its highland contours, the street and drawn-plot surfaces, and the vendored projection math underneath them) moves out of index.html into its own file, carta-map.js, loaded the same way a font or an icon already is. Two static files, still nothing to build, still nothing to fetch — one is just no longer one."},
  {v:'7.21.0',d:"Ask Carta, at the front door. The ask was a button at the bottom of the Atlas, under everything the record had already done. It is the first thing the Atlas says now — one field standing on the passport itself, and what Carta has already found sits directly under the fold, one tap from being reopened. The composer states what goes out with the ask as a ledger before anything leaves — the bar, the scores, what's excluded by name, the scope — and opens the brief itself if you want every character of it. The wait is a screen of its own and narrates the work rather than spinning: your record read back in its own counted figures, the bar you hold, the call itself, then each name placed one at a time, landing on the plot as its address confirms. Cancel is a real cancel — the call aborts and nothing is written down. The answer settles in the order it was argued instead of arriving flat."},
  {v:'7.20.1',d:"A pin, editable after it's already right. A café placed by pasting a map link had no way back to that same box once it was placed — the only correction on offer afterward tried a name search again, which is exactly the search that never worked for this café in the first place. Paste a map link is on the page now whatever the café's current state, so a placed café can be corrected the same way it was placed, not just the ones still waiting."},
  {v:'7.20.0',d:"The ground, at the size a phone reads it. The passport was drawing itself into a fixed frame two and a half times wider than any phone, so every country's name came out at about four pixels and the whole map read as a smudge — it is drawn at the size it is looked at now, and the tasted countries take the width they have instead of throwing away a third of it. A country you tap into is no longer a flat silhouette: it shows its own highlands, the thousand-, two-thousand- and three-thousand-metre contours that were already in the file and never drawn, because altitude is most of the reason a coffee from up there tastes the way it does. The regions you've actually found coffee from stand on that ground and open with a tap. A region opens onto real terrain — contour lines, relief, the valley the road runs down — with a pin on every farm the record can place, and a farm's own page carries the same. A farm is placed the two ways a café already is: one lookup, or a map link you paste. The lookup has to name the farm back, so an unknown farm is left unplaced rather than quietly pinned on the region around it — and every pin can be taken off again. Offline the terrain steps aside and your saved positions simply stand, as the streets already do."},
  {v:'7.19.0',d:"Your cities, drawn differently. The live street map dropped into each city's thumbnail last version turned out to be exactly what a thumbnail shouldn't be — a moving map crammed into a space too small to read one in. It's a shape now instead: one soft outline of where your own cafés actually sit in that city, drawn straight from your own record, nothing fetched, nothing loading. One café reads as a small round place; a whole spread city reads as the true, particular outline of your own reach in it — never the same two cities twice, and never a street or a pin standing in for either."},
  {v:'7.18.0',d:"Your cities, drawn. The little map beside each city on the Atlas used to show nothing but bare pins in an empty box — a shape was never asked for. It draws the real streets now, the same way the city's own page already does, but only once that row is actually on your screen; scroll past it and the live map steps aside again rather than sitting there spending a request for nothing. If the streets can't be reached, the row falls back to what it always showed, without a word about it — a thumbnail has no room to say so, and the drawn pins underneath are enough."},
  {v:'7.17.0',d:"A pin, from your own hand. OpenStreetMap's search can miss a café that hasn't been mapped as its own point yet, even on a street it knows perfectly well. So where a name search comes up empty — or none of the branches on offer is the real one — Carta now takes a link instead: paste whatever Google or Apple Maps already gave you, and it reads the actual pin straight out of it, then asks the same map for the real neighborhood the way it already does for a search result. No key, no new network touch, nothing kept but the coordinate — a link you copy and paste is not a link Carta remembers."},
  {v:'7.16.1',d:"The city, corrected along with the pin. Placing a café by its real address fixed the pin, but a café first added by pasting a street address into the City field stayed filed under that address forever — the Atlas groups by whatever was typed, and nothing had ever told it otherwise. The same confirmed lookup that places the pin now corrects the city too, exactly the way it already corrects the neighborhood: silently where there was nothing to say, and named in the toast where it actually changed something. A chapter open on a since-corrected name now follows you to the real one instead of quietly emptying out under you."},
  {v:'7.16.0',d:"The pin, corrected. A café you typed by hand used to be placed by a single best guess — so a café with more than one location in a city got whichever one came back first, and it stayed wrong, because Carta only ever looked once and gave you no way to say otherwise. It asks properly now. Where there is only one of something, it is placed quietly and keeps the neighborhood it was found in, which is the line that reads under its name. Where there are several, Carta doesn't choose: the café asks once, with the real neighborhoods to pick from, because only you know which one you were actually in. One tap places it, with an undo. And any café can be looked up again — a pin that was never right is no longer permanent."},
  {v:'7.15.0',d:"Ask Carta, arguing. It used to hand back a flat list of names with a sentence each; it ranks them now, and every one says what it is best FOR — the cleanest cup, the one worth the drive, the sleeper south of you — with the figures off your own brief it was read from sitting under it — underlined where Carta can open them, so one tap gets you the actual cups behind the claim, and left plain where your record can't back them — and what to ask for once you're at the counter. It names the places that are close but aren't the pick, and says why, instead of quietly dropping them. It closes with what it would actually do: the one strongest move, and the order to walk them in depending on what you're after. Two new things to ask: near a point rather than a city, and how far you'll actually go — which is what lets it say 'worth driving for' and mean it. Carta still makes no search, so it never claims what a café is pouring today; where a fit depends on a menu that turns over, the row says so. Every café it names is still checked against a real address before it is drawn, mentions included. And the model it asks by default is a much larger one, with the room to answer properly — your own key, your own choice, still on the device and nowhere else."},
  {v:'7.14.0',d:"The rest of the app. A country stopped being a dead end: it states how far the record actually follows that ground — grown, processed, milled, roasted, poured, read, dashed across whatever it can't reach — and then opens downward into its regions, the hands that grew it, the roasters working from it and the rooms it pours in. A region and a farm are pages now, walked down to from the country and back up from any coffee. Your taste dropped its meters and argues in a sentence instead, every figure in it tappable straight through to the cups it was read from. The brief left its drawer: it's a screen that says what goes out in four parts before it ever shows you the raw text, with the exact characters folded one tap away, and the ask that follows it names the key it would use and the degrade if you don't have one. What Carta found is its own page on its own streets. A café's menu is one screen at the counter rather than two sheets that never met. Your record — everything you own, the backup, what reads in, what sends out, your Setups, classic — has a page of its own, and a Setup finally keeps the grind history that is only ever true on it. Two new fields on a coffee, altitude and mill, both optional, both stated only where a bag states them. Nothing migrated; the ledger is the same file it was."},
  {v:'7.13.0',d:"The map, in front. Carta opens on the Atlas now — the passport full-bleed, every country you've tasted inked into it and tappable, your cities listed underneath with their own plots. Four rooms became three (Atlas · Journal · Shelf) with ＋ A cup standing beside them, reachable from anywhere instead of only from the top of one screen; Scout folded into the Atlas as \"Your taste\", because what it argues is geography. A city is streets edge to edge with your cafés on a sheet you pull up over them, a café has its own corner of the map, and a cup is finally a page — the photo at the size you took it for, the score set where you can read it. The record itself is untouched: same ledger, same file, nothing migrated. And the Journal opens with the last cup you brewed — its recipe, its finding, one tap to begin the next from it."},
  {v:'7.12.0',d:"A reason to come back, stated plainly. The first time a country or a city actually lands on your passport, Carta says so in one sentence — with a tap to share it while it's fresh — and then goes quiet about it forever after. Nothing already on your record gets announced retroactively. And a coffee you took home a while back with nothing brewed from it yet says so on the shelf, one line, no pressure. No streaks, no badges, no percent-complete — if it ever starts reading like a score, that's a bug, not a feature."},
  {v:'7.11.1',d:"A shortcut to the door. Long-press Carta's icon on a home screen that supports it (Android, ChromeOS, desktop) and \"A cup\" jumps straight past the journal — the paste-or-type door, one long-press away instead of an open-then-tap. Not on iOS, which has never offered a long-press menu for a home-screen web app; nothing in Carta changes that."},
  {v:'7.11.0',d:"Roast joins the vector. A coffee can carry its roast level now — light through dark, same optional field as everything else, never required. Scout reads it back the same way it already reads process and origin: Roast leads your vector now, with its own weight and n, and the brief — and anything Scout sends on your behalf — can finally say what roast character actually earns your 9s. Paste a bag or type a menu line that states it plainly and Carta picks it up on its own, still yours to correct."},
  {v:'7.10.0',d:"Durability, without a server. The Shelf now states plainly how long it's been since your record was backed up — the same voice as a bag's own rest window, never a nag. One tap downloads the whole thing as a plain JSON file, or hand it a quiet fortnightly rhythm and it'll back itself up on its own, opt-in, off unless you turn it on. A photo you're about to add now says something first if storage is getting tight, instead of only failing silently once it's already too late."},
  {v:'7.9.0',d:"Two more places the streets can reach. A café's own sheet now draws its position, same live layer as its city — a settled view of the one place, not the whole neighborhood. And Scout's asks got the same treatment: a grounded café it names draws on real streets now, not just a plain dot. A sheet's own map dies when the sheet closes, and never disturbs a map still standing on the screen underneath it."},
  {v:'7.8.4',d:"The streets, actually there. A city's live map would open, show a pin or two, and collapse to a hairline right as the streets should have faded in — the map area had no height of its own once its stand-in dots stepped aside, and the layer meant to fill that space was quietly losing a styling tie to the map library's own stylesheet. Both fixed; the frame now holds its shape start to finish."},
  {v:'7.8.3',d:"Classic's cafés, carried whole. Importing from classic used to leave every café's position behind — even the ones classic had already confirmed on a map — so every city needed a fresh round of geocoding after crossing over, and a café's own city could come up blank if the cup that mentioned it hadn't carried one. The importer now reads classic's café register by name and carries its position, city, neighborhood and palette straight across, same as it always meant to."},
  {v:'7.8.2',d:"Streets, calmer. A city with more than one café waiting to be placed used to rebuild the live map from scratch every second or so as each one resolved — tiles refetched, the fade-in restarting, over and over. It settles once now, after the whole handful is placed, the way it was always meant to."},
  {v:'7.8.1',d:"The bar, back in ink. The four rooms at the bottom had drifted into the browser's own gray buttons — fixed, and the tab you're standing in is marked by a plain line again, the way the rest of the page speaks."},
  {v:'7.8.0',d:"Read it for me. Hold a menu's photo up and Carta can read it now — the same key the ask uses, the same one tap, never required. Check the lines it found, edit anything, save same as always. The photo itself still never leaves this reading, and still never gets kept."},
  {v:'7.7.0',d:"Streets. A city's chapter draws your cafés now — a plain dot per café at first, its position confirmed quietly the first time you open the chapter, then real streets fading in underneath where the network reaches them. Offline, or where it can't, the drawn plot simply stands and says so once. Finishes what Phase 3 started."},
  {v:'7.6.0',d:"The ask. Scout can ask on your behalf now — a city, a neighborhood, a country, a route or a friend's taste, sent with your brief to a model you bring your own key for. Every café it names is checked against a real place before it's ever drawn as a pin; what can't be confirmed is listed, never guessed. No key, or the call fails, and it's the plain brief, copied, same as before. Been, Booked or Skip on a result feeds it back into your record."},
  {v:'7.5.0',d:"The migration. Bring your record across from classic — read its export straight in (roasters, cafés, coffees, brews, cups, mapped node-first so nothing's lost to a retired flat field), safe to run twice, nothing duplicated. Classic itself stays one tap away from the Shelf, lights on, for as long as you want it."},
  {v:'7.4.0',d:"The share. A coffee, a café, the passport, or the year — each a self-contained page on Carta paper, one tap to send (the OS share sheet where it's offered, a download everywhere else). A coffee or a café card carries itself back in: open one on another Carta and “add to my Carta” is one tap, no account, no server."},
  {v:'7.3.0',d:"The bridge. Take a café coffee home in one tap — the Shelf is now what you've actually got, not everything you've tasted. Photos on cups, one each, restrained. Capture a café's menu (paste, or a photo held up as a reference while you type — never saved) and walk a line straight into a logged cup or a link to what's already on your shelf."},
  {v:'7.2.0',d:"The passport. Every country your record can trace draws on the world frame — tasted ones washed and tappable into a chapter, untasted ones a hairline invitation. Tap a country or a city for its chapter — the coffees, the regions, the cafés — read straight from the record, no map tiles, no network."},
  {v:'7.1.0',d:"The brief. Scout reads your taste back — the bar, the vector, the anchors, always with their reasons — and prepares a brief: a plain-text cut to paste into a chat, and a page to keep. A café cup can now carry a city, so a brief can scope to one."},
  {v:'7.0.0',d:"The skeleton. Carta 7 begins: the journal, the shelf, the door, the dial-in loop. Classic moved whole to classic/."},
];
