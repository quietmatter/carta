const APP_VERSION='6.18.0';
const SEEN_KEY='carta.seenVersion';
// Newest first. Each release the record itself remembers.
const CHANGELOG=[
  {v:'6.18.0',date:'July 2026',title:'The page folds, and it rests on the place it is about.',items:[
    'Every section is a card now. A green’s page answered nine questions in one scroll, and the corrections were at the bottom of all of them. Each section folds into a card that opens and closes, and the page opens as a stack of them — every question still asked, in the same order, none of them shouting. A closed card keeps its heading and its count on the face, so the stack reads as a table of contents rather than a row of blank drawers.',
    'It stays how you leave it. A card remembers by its name, not by its page: close “Where it sits” once and it is closed on the next green and the one after. Set the posture you want to read in and every page is the short page you asked for. Open all is one tap, and it persists too. The reading never folds — the head, the road and the resolution readout are always open, because a page that hides its answer behind a tap has stopped being a record.',
    'The page rests on its own map. The same drawing the map section makes is laid under the whole screen, ink withheld: streets where the scope stands on streets — a bar, a city, a roaster — the country’s outline and its highlands everywhere else. Close the cards and the ground is simply there. It is paper in the strictest sense: nothing on it, nothing to tap, in no count and in no key. Hide the ground if you would rather read on plain stock.',
    'The parcel and the hand, told apart on every page. The record has held the farm, the grower and the washing station as three separate nodes since the grower split — but the pages read them back as one row, “Grower: Finca El Paraíso · Diego Samuel Bermúdez”, which is the collapse the model was split to end, made again in ink. A green now states its Farm, its Grower and its Station apart. A farm’s page reads the hands that worked it; a grower’s page reads the land they grew on; a station’s page keeps naming its deliveries as deliveries. The road’s Grown mark names the person where the record holds one, and counts one kind of actor at a time — a farm and the person who works it are one origin told twice, never two hands. An actor the record cannot classify stays a producer and says so: an unmatched name buys no tier here for the same reason it buys no rung on the grain.',
    'The entry field stopped asking for both at once. “Producer / farm / station” is now “Farm or station”, beside “Grower” — the two facts the door has always kept apart, asked for apart.',
    'The double border, from the prototype. The leaf is ruled twice — the edge of the sheet, and the margin the page is written inside. Unlike the outer line it lands on a phone too.',
    'The columns read as a register. A green’s Farm, Region, Process and Altitude are set the way every other quiet label in the app is set — a tracked line down the left, the values ranged right — so an identity card reads as an entry rather than as a settings list.',
  ]},
  {v:'6.17.0',date:'July 2026',title:'The place fills itself in, and one place is one page.',items:[
    'Type into Country, Region or Locality and the map answers. Which box Yirgacheffe belongs in is a question about Ethiopian administrative geography, and no keeper should have to answer it — so the rail offers real places as you type, each showing the whole ladder it sits in, and one tap fills every column from that ladder. A café has been findable on a map since the beginning; a coffee’s own origin never was.',
    'A run is not a place name. “Pitalito, Huila, Colombia” is three facts a bag printed on one line, and it used to enter the record as one region called all of that — which then had its own page, next to the page for Huila. The columns are sorted out at entry now, on the device, with no lookup: a word is never dropped, a filled column is never overwritten, and a word that names a country becomes the country only because it names one.',
    'One place, however it was written. HUILA, Huila, “Huila, Colombia” and a spelling somebody confirmed on the map now gather onto one page, and the page says which spellings it gathered. Nothing was rewritten to make that happen — every green still carries the words its own record was given.',
    'The atlas learns the places it has been to. Confirm a place and the green keeps the ladder, so the next record spelling that town differently lands on the same page. No gazetteer is downloaded and none is bundled: the fold knows only what this record has confirmed.',
    'A confirmed place is not a finer grain. It does not enter a green’s identity, it does not move the traceability rung, and it never becomes a page of its own. Confirming a spelling is evidence about a word, not about the coffee.',
  ]},
  {v:'6.16.0',date:'July 2026',title:'The atlas is correctable — and one name spelled two ways is one name.',items:[
    'The fold. A collapse key folded case and nothing else, so TARRAZÚ, Tarrazú and tarrazu minted three nodes for one region, and an accent or a stray comma forked a green from itself. The resolver now folds case, accents and punctuation before it decides — and folds nothing more, because collapsing further is a guess and an identity key never guesses. The twins already standing on your atlas are joined once, undoably, the earliest naming keeping the node.',
    'Every page answers the three verbs. A green, a grower, a station, a roaster and a roast can each be amended, joined to the node it is really one with, or set down. Until now the spine was the one part of the record with no way back out: a green minted from a typo, one roast entered twice, a hand that turned out to be the mill stood forever. All three verbs are additions — dated, signed, undoable — and what you set down waits under the desk beside everything else you have.',
    'A region has no entry to amend, and the page says so. A region, a town, a country, a process, a variety are readings over the greens that name them — never stored, never a polygon. Their pages now name the greens to correct instead of offering an edit that would have to invent a record to write to.',
    'Where the pen is, stated on the page. A surface whose corrections you cannot make now says the pen is elsewhere and points at the desk, rather than quietly drawing nothing.',
  ]},
  {v:'6.15.0',date:'July 2026',title:'The farm and the hand behind it are two facts now.',items:[
    'A second actor field — Grower / co-op. A bag that reads “Finca Gascon — Felipe Contreras” used to make you choose which name to keep. The farm stays the head; the person, family or association behind it has its own field, its own page on the atlas, and its own edge onto the green — beside the farm’s, never over it.',
    'A grower buys no rung. A person is not a parcel and a co-op is not a mill, so the grain still reads only the head. The second name is a fact about hands, not about where the coffee grew — and it never enters the green’s identity, so nothing standing re-keys.',
    'A co-op is told from a person by its own words — cooperative, union, association and kin read as a producer group; any other name reads as a grower. The producer’s page says which it holds, in those words.',
    'The edges survive a sync. Two devices each adding a hand to one green now converge holding both — an appended actor was previously the newer edit’s to lose.',
  ]},
  {v:'6.14.0',date:'July 2026',title:'The town has a page, and the pins moved closer to the truth.',items:[
    'A locality is a scope like any other. Tap Pitalito on a green’s crumb and its page opens — the greens traced to it, its growers, its stations, the region and country above it. Derived from the record, like a region: no stored entry, and never a polygon. A town is a point; drawing its boundary would be a guess, and this record does not guess.',
    'The walk lost its missing step. A green’s crumb reads country › region › town now; a region’s page lists its towns; a grower’s page names the town it works by. Every step is the same tap.',
    'A grower’s pin lands at the town, not the middle of the region. Where a record names a locality, the map lookup asks for the town in its region and country — one step finer, still never the farm’s own gate. Where the mark may sit is still decided by the grain: a green that proves its town sits at the town; one that proves only its region stays at the region’s centroid, whatever pin is at hand.',
    'The pin correction speaks the town too — a town, a region or a country for an origin, never the farm.',
  ]},
  {v:'6.13.0',date:'July 2026',title:'The town has a column.',items:[
    'The locality — Pitalito under Huila, Dipilto under Nueva Segovia. The region was the finest place the record could hold, and a bag that named the town had nowhere to put it. It is its own field now, on every origin block, one step finer than the region and short of any one farm or mill.',
    'A rung of its own. The grain ladder reads six now — country, region, locality, washing station, farm, green lot. The station still outranks the town: a named mill had custody of the cherry, and naming it proves at least the town it stands in, never the reverse.',
    'Nothing standing moved. Every green keeps its key and its identity; a coffee learns its town only when you state one, and a green already yours stays yours when you do — the scorer treats a record that names no town as silent about it, never as disagreeing.',
    'The door does not guess it. Towns and regions share names everywhere coffee grows, and a name the record cannot classify buys no rung — the locality is typed, with the rail offering what the record already holds.',
  ]},
  {v:'6.12.0',date:'July 2026',title:'Authoring asks the same questions.',items:[
    'The authoring form speaks the shared origin block now. It had its own smaller grid — no harvest, no height, no printed code, no rails — so a green authored straight onto the atlas arrived knowing less than a green a bag carried in. One vocabulary, every surface: what the shelf form asks, the author’s desk asks.',
    'The two columns land. A harvest and a height typed while authoring go where a bag’s go — the year to its own column, the band onto the green — instead of being dropped at the door.',
    'The rails came with it. Country, region, producer, variety, process — what the record already holds, with counts, one tap to fill.',
  ]},
  {v:'6.11.2',date:'July 2026',title:'The column holds still.',items:[
    'The app is one bounded column — it never was meant to pan sideways. A stray wide row could nudge the page into a horizontal scroll that had nothing to read past its edge. The column is clipped to its own width now, so a stray-wide row is contained instead of dragging the whole screen with it.'
  ]},
  {v:'6.11.1',date:'July 2026',title:'What you write on a copy is written on your record.',items:[
    'A green you read from someone else’s published atlas can be written on. Adding a height, a cupping, a printed code, a confirmed bind, or the washing station behind it used to land on the copy — which no save ever keeps — so the fact stood until you closed the app and was gone by morning. It lands on your own record now, and it stays there.',
    'A height that disagrees is still carried, never resolved. Where the copy already states a band and yours differs, the published figure keeps standing and yours is kept beside it with your name on it — the law the record has always kept for two heights that disagree, now kept across a copy as well.',
    'The copy is never written on. It is a read layer and stays one: your line goes on your record, and the published atlas is left exactly as it was published.'
  ]},
  {v:'6.11.0',date:'July 2026',title:'A region is not a small country.',items:[
    'A country is drawn as a country. Where a coffee proves its country and no region, the map used to put a dashed dot in the middle of it — which is the one thing about a country the record does not have. The centre of a country is a place no coffee is, and often not even land. So the country’s own outline is the mark now: named, tappable, counted, and carrying your ring as a doubled line. The shape was already on the paper; it was being spent as decoration while a made-up point stood in for it.',
    'A region stays a point, because that is what the record holds. The two are opposite kinds of fact. A country has a drawn shape and no honest point; a region has a point — roughly where the coffee grew — and no shape at all, since coffee’s regions are sometimes a department and sometimes a catchment nobody has ever drawn. Matching a region’s name to a polygon would be a guess, and this record does not guess. So the plot now draws the grain instead of describing it: on one frame you can see which greens prove a region and which prove only a country.',
    'Walking into a region adds something. It used to subtract — a region’s map was its country’s map with the other marks removed, one dot on an empty outline, nothing learned by arriving. Now the other regions of that country are drawn with it as hairlines, so a mark reads as where in Ethiopia rather than as a point somewhere. They are there for scale only: not counted in that page’s totals, never wearing your ring, never fading for a hold — those say something about your own record, and a region drawn for scale is not in it. Tap one to walk sideways into it.',
    'The frame still does not close in as you walk down, and now for a better reason. It stays the whole country because the country is what the comparison is made on — not merely because there is nothing finer under a centroid to zoom to.',
  ]},
  {v:'6.10.0',date:'July 2026',title:'Where it grew gets its ground — and the station gets a page.',items:[
    'The countries are drawn. Where a coffee grew used to be a mark in an empty box: honest, and unreadable — a point at six degrees north tells you nothing on its own. Now the country’s own outline is drawn under it, so a region reads as somewhere in Ethiopia rather than somewhere. The frame opens to hold the whole country, which is the question a coarse mark can actually answer.',
    'And the highlands with them. Inside each outline, contours at a thousand metres, two and three — so the ground says not only where a country is but what shape it is, and a growing region sits on terrain instead of on paper. Terrain and only terrain: it is never a green’s own stated height, which is the terrace and answers a different question, and it is never a grade. A mark inside the two-thousand line is not a finer coffee than a mark outside it. Nothing sorts, cuts or ranks by it, and where a frame is too wide for a contour to be a line rather than a smudge, none is drawn and the page says so.',
    'An outline, not a street map. Streets stay behind the frame that earns them — the hands and the bars, where a mark is a door with an address. Where it grew, a mark is a centroid, and a centroid over a named road reads as an address it never was. So that frame gets the one ground as coarse as the mark itself, carried inside the app: no tiles, no network, nothing to be offline from. Sixty-five countries; one the record names and this file has no shape for is counted in words, never guessed at.',
    'A region, a grower and a station each inherit it. The same drawing, at every scope — walk down and the marks narrow while the ground stays put, because there is nothing finer under a centroid to walk closer to.',
    'The washing station has a page. It has had a place on the spine since the door learned to tell a farm from a station, and nowhere to stand: the one hand whose whole work is gathering many growers’ cherry was the one you could not walk to. Now it is a scope like any other — its greens, the hands that deliver into it, the region above it — and it is never listed as a grower again, at any scope.',
  ]},
  {v:'6.9.0',date:'July 2026',title:'One way in — the cup out enters the atlas.',items:[
    'A cup out now enters the atlas the same way a bag does. The café cup asks for the same origin fields, from the same block, with the same rails, the same printed-code row and the same threshold said out loud — two of six, and this green can meet another keeper’s record. Before, a cup logged without the door carried one loose line of text, which is one fact short of that threshold: every such coffee landed on a green only you could ever see.',
    'A cup you can come back to. Amending a café cup used to move it off its green without saying so — the form retired the origin fields the moment a green stood and never read them back, so the next save wrote blanks and the coffee forked onto a record of its own. It reads its green first now, exactly as the shelf form always has. Change the drink, the price, a line: the coffee stays where it was.',
    'Find it on the atlas. Name a green already on your record and the cup binds to it outright — signed, dated, and the strongest thing the ladder has short of a printed code, so no later edit can drift it off again. Two keepers at one bar drinking the same coffee can finally say so, instead of leaving two greens the words alone will never join.',
    'A coffee from a green’s page. The door opens on its last step with the green already named — nothing to paste, nothing to re-derive. Walking the atlas to a coffee and pasting one are the same act, from opposite sides.',
    'The door keeps a printed code. A Kenya outturn or a competition lot pasted at the door was read, shown, and then dropped at the bind. It is kept now — the one rung that binds two records outright, wherever it enters.',
    'The typed forms stopped being poorer than the paste. The harvest and the height are fields on the bag and on the cup, read the same way off a typed line as off a pasted one — so “1,930 masl” lands as 1,930, in the column that holds it, and not as a sentence nothing can read back.',
  ]},
  {v:'6.8.0',date:'July 2026',title:'The ground comes back — streets behind the chart, and nowhere else.',items:[
    'Real streets sit behind the map again. When a scope is one ground you could cross in a morning, the chart frame — the hands and the bars — lays actual roads under its marks, so a bar is at a corner you recognise rather than a dot in an empty box. Wider than that and the frame says so and stays a drawing: at a span of a thousand kilometres there is no single ground to lay, only texture.',
    'The streets are the paper; the drawing is still the record. Nothing hands over when tiles land — the same marks, the same folds, the same counts, the same taps, the same ring on what you keep. The plot draws first from saved positions and stands alone offline, and the frame the tiles are fitted to is the one the plot already computed, so a mark and the road under it can never disagree about where they are.',
    'No streets ever go behind where it grew. An origin mark is a centroid — an area standing in for a point — and a centroid drawn over a named road reads as an address. That would round the grain up in ink, which is the one thing the map exists to refuse.',
    'Still no zoom, still no camera. There is nothing to pan and nothing remembered between screens: the walk down is the zoom in, and the back button is the zoom out.',
  ]},
  {v:'6.7.0',date:'July 2026',title:'The atlas is everyone’s — the published copy, and the reader.',items:[
    'The atlas can be published. A founder sends one copy of the shared record — the greens, the hands, the bars, and the dated sightings of what poured where — and anyone with the address can read it. No account, no install, one link. No ledger travels: no cups, no brews, no bags, and nothing about how anything tasted.',
    'A copy, not a switch. The published atlas carries a revision and a date, so it states its own age instead of impersonating a live feed. It changes when the keeper publishes again, and until then it says so. Before you publish, the counts state exactly what leaves, in the same units the reader will see them in.',
    'A green can be held back. A hold keeps one green out of the published copy and only out of the copy — the record keeps it whole, every page and every count unchanged — and one tap releases it into the next. Its roasts and its pours are held with it, because a green whose roasts are public and whose identity is not is a broken road, not a redaction. Held greens draw faint on your own map: a hole in a place is a thing only a map can show.',
    'The reader. Someone who keeps nothing opens CARTA, reads the atlas as it was published, and never signs in. Everything that writes is not hidden from them so much as absent — there is nothing on their device for it to write to. Two rooms, the whole graph to walk, and one offer, once: a record of your own.',
    'A reader’s road draws five stations, not six. The sixth is Read — your own cups — and a reader has none. That is not a gap in the record: the gap is the product, and an absent reader is not a gap. An empty Read drawn as unread would be the record telling a quiet lie about itself.',
    'Your overlay on the map is a ring. A mark you keep gets a ring added on top of a mark that was already complete without it — never a fill, never a second colour. That is what lets the published atlas be this same map with one ring and one lens removed, rather than a second, poorer map: had kept-versus-not been the main distinction, a stranger’s atlas would draw entirely faint — an atlas of absences.',
    'A reader who starts keeping keeps the copy. Their own record lays over it, one layer down; nothing is merged, nothing is lost, and the day they sign in the two fold together with no duplicate green.',
  ]},
  {v:'6.6.0',date:'July 2026',title:'One page, every scope — the walk is the zoom.',items:[
    'A country, a region, a grower, a green, a roaster, a bar, a city, a Setup, a process, a variety — every one of them is now the same page, pointed at a different slice of one record. Each answers the same five questions in the same order: what is it, how far the record follows it, what it can prove, where it sits and what it holds, what you found. Only the nouns change.',
    'Drill down and up from anywhere. Every name is a door, the crumb above a page names the scopes over it, and the back button names where it returns. A country page lists every bar pouring from that country — a walk, not a feature. The city is a page of its own, so a bar and a roaster can finally be drilled up from. The grower opens as a page, not a sheet.',
    'One map, every scope, no zoom. Two frames — where it grew, where it is carried — drawn from the record itself on every page and on the Atlas. A mark is never finer than the grain it rests on; what cannot be placed lists rather than lies, with the fall stated; folds are counted; one bar is never dressed up as a scene. The walk down is the zoom in, and the back button is the zoom out.',
    'The reach is set down. The four counter tiers were a second classification of depth that applied to cafés alone and was attested rather than read from the record; the road already answers the same question for every page, from the record itself. Your sightings are not gone: every line you signed stays on the Register entry, signed and dated, carried through sync — unread and unrendered for now, never erased. A keeper who attested a fact will not find it missing from the record; only the badge stopped being computed from it.',
    'One door, every room. The café cup no longer has its own origin form — the cup out is the same paste → confirm → bind as everything else, and a bar page offers “Poured here” with the venue already bound. Everything the paste read — the station, the harvest, the height, the actor’s kind — now lands from a cup out exactly as it lands from a bag.',
    'Never type a country twice. Every origin field carries a rail of what the record already holds, with counts, one tap to fill — and it narrows to what you have already chosen on the same screen. A rail suggests, never constrains; an empty narrow widens rather than vanishing.',
  ]},
  {v:'6.5.0',date:'July 2026',title:'The road says how far it runs — out loud, with its denominator.',items:[
    'The six marks under a coffee were always honest, and always silent. They made you count pips to learn how much of the road stands, and a count nobody performs is a fact nobody has. Now the road states itself: four of six stations stand, the dry mill and the bar are silent — unread, not a gap invented shut.',
    'The coffee in your hands gets the same line. It drew the road and said nothing about it, on the screen you open most.',
    'A page will now warn you against over-reading it. Where half a set is known only from the roast on, it says so plainly — the spread you are looking at is the record’s reach, not a difference between the coffees. Under three greens it says there is no distribution to read at all. On a set that earns neither, it stays quiet.',
    'One reading, five scopes: a green, a roaster, a plate, a grower, a counter. Four hand-written lines that each said a piece of this became one that says all of it and knows which greens it is talking about.',
    'A cupping score now carries the date it was cupped, and a standing nothing has been added to in a year and a half says when it last moved. Stated, never discounted — elsewhere a reading this old is quietly faded toward the middle to keep the number looking current. A cupping is a fact, dated and signed by the hand that made it, and a fact is not less true for having been true a while.',
    'None of it grades anything. A station count is what the record holds, not a measure of the coffee, the grower or the roaster. Nothing sorts by it and it never joins the standing.',
  ]},
  {v:'6.4.0',date:'July 2026',title:'The sighting, set down — the line that taught the grammar now answers it.',items:[
    'A sighting is a line you signed on the shared record, and it was the model for how everything else in CARTA is corrected — struck, never deleted. It was also the last thing that could not be taken back. Withdrawing one fired on a tap, said nothing about what the reading would become, and had no door home: sighting again mints a new line, it does not stand the old one up.',
    'Now it answers the same verbs every record does. One sheet: what you saw, what you signed, what the bar reads — and what falls if the line goes, named fact by fact before you tap. A fact another line still attests never appears there; a fact nothing else attests says so, in words.',
    'The reading you are about to cause is shown before you cause it. The badge as it stands, the badge without your line, and the sentence between them — or, where a later line already reads past yours, the plain statement that no reading moves at all and only the ink changes hands.',
    'A withdrawn sighting waits under “what you have set down” on the desk, beside your struck records and struck cafés, and stands back up with one tap — for every keeper, not just this device. A line that went and came back says so on the record; the seam is not tidied away.',
    'A sighting is never erased, and now says why: every keeper holds a copy, the merge is a union of lines, and a line deleted here would simply return on the next sync. Struck is the strongest honest answer — so the room’s one red button does not reach this far.',
    'The strike and the undo travel like the record’s do — both are dates that only ever add, so two devices converge on the same answer from either side, in any order, however many times a line goes down and comes back.',
  ]},
  {v:'6.3.0',date:'July 2026',title:'Set down, not erased — one grammar for correcting anything.',items:[
    'Every record now answers to the same two verbs: amend it, or set it down. One sheet, the same shape for a cup, a brew, a coffee, a Setup, a café, an authored roast — what the record is, what goes with it if it goes, and the two doors.',
    'A record you set down leaves every reading, count, plot and export, and waits whole under “what you have set down” on the desk. One tap puts it back — with exactly the records that came down with it, and no more. Nothing is erased by an ordinary act.',
    'The records that had no door have one. A brew is reachable at last — a coffee’s page lists every brew on it, including the ones whose impression you skipped, which no path in the app could reach before. A coffee can be corrected, not only put away. A Setup can be retired, restored, or set down when nothing reads through it. A café entered by a typo can be struck from the Register by the hand that holds the pen.',
    'Putting a bag away stopped wearing the red button. It is the gentlest act in the app — the bag goes, the record stays — and it was reading as destruction. Red is now spent on one thing only: erasing, the single act in CARTA with no door back.',
    'The browser dialogs are gone. Removing a cup used to summon the operating system’s own box, in the operating system’s own voice, to promise that it “cannot be undone” — which was never true and is now not even close. Every one of those is a sheet in the keeper’s voice, stating plainly what is about to happen.',
    'A strike is itself a record — signed, dated, and carrying the withdrawn body whole, exactly as a sighting is struck rather than deleted. It syncs like one: set a record down on one device and it leaves every device; put it back and it comes back everywhere, from either side, in any order.',
  ]},
  {v:'6.2.0',date:'July 2026',title:'The terrace — the atlas gets its second projection.',items:[
    'A green’s page draws the height it grew at. The map is a plan and answers where a coffee came from; it cannot answer how high. So the atlas gained a section: contour rules, this green’s height placed against every other green the record holds one for, and the reading in words — how many grew lower, how many higher, how many overlap this band.',
    'A range is drawn as a band and a single figure as one line. A lot sold as 1,800–1,900 m never said 1,850, so the drawing never says it either. Height is a growing condition, never a grade — nothing anywhere sorts by it, and it is never part of a coffee’s identity.',
    'The height finally lands. The door has always read an altitude off a paste and shown it as a fact you could strike; it then spent it as a sentence in the notes, where nothing could read it back. It now goes onto the green itself, in a column of its own.',
    'Two heights that disagree are carried, not resolved. The first stands, the other is kept beside it with its author, and the page shows the seam rather than flattening it.',
    'The same section at four scopes — a green, a plate, a roaster, a grower. Where this hand buys, at what heights a facet grew. Greens that state no height are counted out loud, never quietly dropped.',
    'A thousands separator no longer breaks the read: “1,930 masl” was landing as 930 m, a number no page ever said. Heights outside the coffee belt are refused rather than stored.',
  ]},
  {v:'6.1.0',date:'July 2026',title:'The grain, told truly — five rungs, and the harvest kept.',items:[
    'The resolution ladder now reads the evidence instead of counting fields, and it had been rounding every green up by one rung. A country alone was printed as a region; a region as a washing station and a season; a bare producer name as a green lot — the finest grain the trade can prove. The record said “never rounded up” on the same screen. It does now.',
    'Five rungs, named for what they prove: country · region · washing station · farm · green lot. A green rests on the coarsest rung its record can prove and no finer. A washing station reads as a washing station — it had been reading as a green lot, while a green that knew only its region read as a station. The two were exactly inverted.',
    'A name buys no rung it cannot prove. A grower the record cannot tell from a mill stays where it stood; an unmatched name is never guessed into a tier. The name is still in the record and still on the page — it simply no longer claims a parcel.',
    'The season is its own column, not a rung on a spatial ladder — and the harvest year now reaches the record. The door had been reading a year off the paste and leaving it in a prose aside; it is a green’s own fact, it shows on the green’s page, and it is what tells one crop from the next. Two crop years of one farm no longer fold into one green on the strength of matching everything else — this year’s Mirador and next year’s stand as two greens, because they are two.',
    'A green that names no harvest is untouched by any of this. It keeps the identity it had, exactly; the year is added to the reckoning only where a record actually states one, and nothing standing was re-filed to make room for it.',
    'Every rung reaches its own page. A region green used to open the washing station’s primer, because the one it wanted could not be reached from any green at all.',
  ]},
  {v:'6.0.0',date:'July 2026',title:'The road, streamlined — three rooms, one door.',items:[
    'Three rooms, not four — Atlas · Record · Desk. Today is not a room any more; the coffee in your hands is the head of the Atlas, with its road and the two things anyone ever does with it: open the green, or brew it. More became the Desk: everything that is not a cup, nine rows and one open at a time.',
    'The door is on the masthead. ＋ A coffee sits beside the wordmark on every screen, and opens as a screen of its own rather than a sheet — paste, strike what is wrong, bind. It was the one way a coffee enters the record; now it is the one thing always within reach.',
    'The Atlas is a reading room again — the coffee in hand, the chart at its altitude, the atlas cut into plates, the greens. The lists of hands, the stream and the curator’s bench moved to the Desk, where administration belongs.',
    'The Record is your overlay and says so — your plates, the greens your own record argues for with their reasons, lately, and the bookkeeping the matching writes. The full list of readings is still there, one fold down.',
    'One grammar on every surface. The display line, the sentence under it, the section rule, the row-link, the aside — the prototype’s components, used everywhere. Buttons speak in sentence case instead of shouting; a selected chip is a firmer line, never a fill; the eyebrow gave up the ember, which is reserved for the current action and the score.',
    'The leaf — the app is one column framed like a page from a bound register, so a card reads as sunk into it rather than floating on nothing. The plot gained its ruled ground: a chart at a stated grain, before a single street tile lands.',
    'A green’s page states its resolution out loud, in the same readout the door shows before a bind, and reads in the prototype’s order: the road, the resolution, identity, the standing, the other hands, where it pours, your overlay.',
  ]},
  {v:'5.3.1',date:'July 2026',title:'The reading, at every scope — and the way back.',items:[
    'A roaster’s page, a grower’s, a bar’s now carry the same reading a green does: the road counted across every green in hand, and where those greens grew. One component, five scopes — the lot, the plate, the roaster, the grower, the bar.',
    'A plate draws its origins. Cut the atlas by country, process or variety and the greens are plotted where they grew, not only listed.',
    'Back means the page you came from. A green opened from a plate returns to that plate; a bar opened from a green returns to the green.',
    'Two origin marks that read the same fold into one — a region centroid drawn twice claimed a precision the grain never had. And an actor the plot already draws is no longer also listed for want of a coordinate.',
    'The road reads on a phone: a name runs to two lines and stops rather than breaking into three, and a station says its region rather than its whole address.',
    'The door takes the roast date — the one fact a paste can never carry. Without it the rest window stays unread, so it is asked for once, at the binding, and never invented.',
  ]},
  {v:'5.3.0',date:'July 2026',title:'Two frames, and a chart that corrects itself.',items:[
    'The map stopped pretending one projection could hold a front door and a country. The chart frame is the ground you can walk — roasters and bars, streets behind, the road drawn. Where the green came from keeps its own frame, coarse marks stated as coarse, joined in words rather than a line across the sea.',
    'Scenes and charts, derived — a scene is a cluster of roasters and bars close enough for one outing, read from the pins; a chart is one or more scenes under a name you give it. Fix a pin and the chart corrects itself; nothing is stored that could rot. A lens narrows the chart, never sorts it, and says out loud what it hid.',
    'Drawn to its grain — a region centroid renders hollow and dashed, a street point filled; marks the plot cannot separate fold into one mark carrying a count; a node with no coordinate lists by name instead of lying. The camera gains a floor, so the map never opens at world zoom.',
    'A wrong pin is no longer forever — correct it from the roaster’s or the grower’s page, the candidates offered rather than guessed between. The automatic fill now refuses an ambiguous name outright.',
    'Two edges close on the spine — a pour reaches its roast when the atlas knows exactly one, and a brew carries its green directly, so a lot’s corpus stands even after its bag is gone.',
  ]},
  {v:'5.2.0',date:'July 2026',title:'The door, the road, the plate — one way in, one reading out.',items:[
    'The door — every way of adding a coffee is now one paste field. Paste the roaster’s page, the back of the bag, an auction line; CARTA reads it on the device — no key, no account, no network — and shows what it found as facts you can strike. The reading says out loud how finely the green resolves and whether it holds enough to meet another keeper’s record: two facts of six, and it can. One last tap binds it — on my shelf, poured at a bar, brewed just now, or just noting it. The old forms stay one tap away, for typing it by hand.',
    'The road, drawn honestly — a green’s page now shows all six stations, grown to read, hollow where the record is silent, the connector dashed across a gap. The gap is the product: the record stating what it has not been told, never a blank to fill. The coffee in your hand carries its road on Today.',
    'The plate — cut the atlas by country, process or variety and read the whole facet as a page: the aggregate road counts how many of its greens reach each station, so you can see exactly where the road goes dark. Greens that leave the facet unread are counted, never quietly dropped.',
    'The farm and the station, kept apart — the door tells a finca from a washing station by vocabulary, tags the grower’s kind, and gives the processor its own node on the spine. An unmatched name stays unclassified rather than being guessed into a tier.',
    'Three prefilled fields in the curator sheets — a city and a country typed in before you said anything — are gone. A blank field is honest; a prefilled wrong one becomes a permanent wrong pin.',
  ]},
  {v:'5.1.0',date:'July 2026',title:'The founder’s pen — the shared record, kept by one hand for now.',items:[
    'While the atlas settles, the shared record — the atlas and the Register — is written by one pen: the founder’s. Everyone reads everything; everyone writes their own ledger, always. On a sync server the first account registered holds the pen and the server itself refuses any other; on a single device the pen is taken up once, under More → Administration.',
    'The founder’s desk — one door for entering the shared record cleanly: add a roaster, author a roast, enter a café’s canonical entry, propose a sighting, settle the review queue, walk Chart No. 1. Each row opens the form that already knows its law.',
    'Every page stays yours to read — the chart, the pages, the Register, the reach. What waits is only the writing of the shared page, and it returns with the moderation ceremony; nothing here is taken away for good.',
    'The surfaces the redesign did not carry — the matching’s cold-start and discover map, the circle stream, taste affinity, beans worth chasing — step behind a shutter rather than being torn out. The Record’s own bookkeeping stays visible, as it always must.',
  ]},
  {v:'5.0.0',date:'July 2026',title:'The redesign — the lot moved to the centre.',items:[
    'Four rooms, always on the bar — Today · Atlas · Record · More. Home and Café became channels, not rooms: the instrument rides off Today, the cup out rides off a place’s page. Find retired into the Atlas — search, the chart, the drawn plot.',
    'Every green and every roaster is a page now, not a sheet — the road from grower to bar, the identity columns, the standing, where it pours, every hand’s roast, your own brew corpus, and your overlay at the end of it. The spine stands without you; the wash is yours.',
    'The interlude — ask the atlas to read the season for you and it composes once, in front of you: the pins settle, a line draws through them, ranked only by your own taste and shown with its reasons. Never on its own; still under reduced motion.',
    'Act III, the signed page — a roaster or a bar can hold the pen on its own link: a three-step claim, a monochrome mark, first-party corrections that stay scoped and strikeable. The page was true before it was signed, and stays the reader’s after.',
    'Propose a sighting — a bag on a shelf, a roast on a bar. The chart looks for it before it binds: a shared printed code binds outright, a fingerprint asks, a same-name-different-process refuses to merge on the string.',
    'The home cup, end to end — the shelf, the dials, the reading: Coffee → Preparation → Cup, the same shape a cup out keeps, so a cup in and a cup out read as one preference.',
    'The record leaves with you — the ledger exports as one self-contained page on CARTA paper stock, with the machine-readable record inside it; a persistent save panel guarantees the file reaches you; and a ledger reads back in, whole, never merged.',
    'Every mark explains itself one tap away — the primers. A motion charter: three durations, one ease; used more, moves less; reduced motion first-class.',
  ]},
  {v:'4.27.0',date:'Jul 24, 2026',title:'The standing — a green’s rarity and caliber, sourced',items:[
    'A green’s page can now carry its standing — how rare it is, how it has cupped — read beside how far its identity traces. Three independent facts, never merged into one verdict: nothing here is your taste, which stays yours on your own cup.',
    'A cup score counts only once it names where it came from — a competition, an auction, a named cupper or lab, or your own signed cupping. Leave the source unnamed and a score still saves, but honestly, as a claim: “roaster-stated 92 — unverified,” never printed as the read. A roaster’s own number was never going to be the truth of the coffee, and now the record says so instead of pretending otherwise.',
    'Rarity reads as sourced facts too — a disclosed lot size, an auction price, a scarce varietal, how few hands carry it. Nothing is scored; nothing is guessed. An unrated, ordinary lot still reads as a complete record — the standing is there to find, never a rank forced onto every green.',
  ]},
  {v:'4.26.0',date:'Jul 24, 2026',title:'The atlas, drawn on the map',items:[
    'Chart No. 1 now draws as a map, folded into the same atlas surface you already walk: the season’s origins at a coarse-but-honest position, the roasters in their city, the bars on their streets, and a thin line tracing a green from origin to roaster to bar. A stranger opens it read-only and reads the whole scene at a glance; every mark taps into its page — a grower, a roaster, a venue — so the map and the pages are one walk. Map or List, whichever you like.',
    'Coordinates stay honest. A venue sits at its real point, a roaster at its city, a green at its region — coarse where the record is coarse, and never a farm-precise pin invented. A node with no coordinate lists rather than lies. The street layer is an enhancement: the drawn plot renders first from saved positions and stands alone offline, and the whole scene keeps working — pins, taps, lines — with no streets at all.',
    'Author a roast online and its city and origin place themselves on the map, from the same keyless lookup the café address uses — filling only what’s blank, never a coordinate the record doesn’t have.',
  ]},
  {v:'4.25.0',date:'Jul 24, 2026',title:'The encyclopedia — every node a page',items:[
    'A green’s page is no longer a dead end past its roasts. Its grower, each of its roasters, and every venue that pours it are now taps — walk from a green to the washing station behind it, to a roaster and every other green that hand has touched, to a café and what else it pours. Nothing is a dead end; the pleasure is the drilling-in.',
    'A grower opens onto the greens traced to it — a washing station gathers cherry from many hands, so its greens stand apart, each its own lot, never one blurred farm. A roaster opens onto every green it has touched, with the offering and level it gave each. A venue opens onto the greens poured at its counter.',
    'Chart No. 1 is walkable read-only now — a stranger reads it without the pen: its roasters, the season’s greens, and the page nothing else shows, one washing station in more than one hand. Each page still says how far its green resolves and how sure its identity is — a lens, never a rank, its marks monochrome.',
  ]},
  {v:'4.24.0',date:'Jul 23, 2026',title:'Charting a city, green by green',items:[
    'You can now author the atlas directly — a roaster, a green and a roast onto the record without logging a cup you had. Find it under your record: Chart No. 1, Los Angeles, its Ethiopian 2025 greens. Every green you author runs the same resolver a bag does, so the sure ones fold onto a green already charted and the look-alikes wait to be settled.',
    'When two greens read too close to call on their own, they land in a quiet review queue — never a nag, and empty when there’s nothing to settle. Work each with one deliberate tap: confirm the one that’s truly the same green, and the rest stay honestly apart, or keep them all apart, the safe call.',
    'The chart shows its own progress — the roasters and greens charted so far, and the page nothing else can render: one washing station, more than one roaster’s reading of it.',
  ]},
  {v:'4.23.0',date:'Jul 23, 2026',title:'A green, joined or set apart by hand',items:[
    'A green’s page can now be corrected. Two greens you’ve learned are one — join them, and every roast, pour and record on both follows onto the kept green, with nothing lost. A conflation you’ve learned is two — split it back apart, and both greens stand. A string that merely reads alike never joins on its own; a join needs a shared printed code or a matching origin, and every correction can be undone.',
    'Kenya’s outturn now reads as it works: one cherry, graded into sibling export lots. AA and AB of one outturn stand as siblings under a single processing batch; a bag that names only the outturn rests on the batch until its grade surfaces, then splits to its sibling — without re-entering the code.',
  ]},
  {v:'4.22.0',date:'Jul 23, 2026',title:'A green, recognised by its fingerprint',items:[
    'Two records with no shared code can now land on one green when their origins line up — the station, the variety, the process, the year. Spelling that drifts across hands (Yirgacheffe, Yirgachefe) is folded before the comparison, so the same place reads as the same place. A different country is never crossed; what a label leaves blank never counts against a match.',
    'When the read is sure, the records join on their own and the green says how it knew. When it’s close but not certain, the record asks you one plain question — the same green, or a different one? — with its reasons on the table. Not sure keeps them apart, the safe call, and every join can be undone from the green’s page later.',
  ]},
  {v:'4.21.0',date:'Jul 23, 2026',title:'A green, bound by its printed code',items:[
    'A bag or a café cup can now carry a printed lot code — a Kenya outturn, a competition-auction lot, an ICO mark — under the origin. When two records carry the same code, they land on one green outright, even where the words alone read a little differently: the surest way to say “the same green, in another hand.”',
    'A code that isn’t an identity — a bare grade, a warehouse reference, a per-sale lot number — is turned away with a word on why. What’s entered only ever adds to the green and is never erased; a green bound this way says so on its page.',
  ]},
  {v:'4.20.0',date:'Jul 23, 2026',title:'The same green, in more than one hand',items:[
    'A bag now opens onto its green — the lot behind it — and every roast of that same lot, each named by its roaster. The first time the record shows one coffee in more than one hand. Reach it from a bag on your shelf, or the by-lot fold under your record.',
  ]},
  {v:'4.19.0',date:'Jul 22, 2026',title:'The loose line, on the green too',items:[
    'A café cup\'s loose origin — the quick "Ethiopia / blend" you jot when there\'s no lot to spell out — now rests on the green behind the cup like its every other origin field, so the whole cup reads from one place. As everywhere else it re-spells nothing you wrote and falls back to exactly what you typed; a cup shared into your circle still shows precisely its keeper\'s own words.',
  ]},
  {v:'4.18.0',date:'Jul 22, 2026',title:'A copy that carries its atlas',items:[
    'Save a copy now writes the atlas into the file beside your ledger, so a copy opened on a device that never synced reads every roaster, origin and roast in full — not the blanks it would have shown once those had folded onto the green behind them. Bringing a copy in folds its atlas into the device\'s own, matching each record to the green it already knows.',
  ]},
  {v:'4.17.0',date:'Jul 22, 2026',title:'A café cup, keyed on the green',items:[
    'A café cup now reads its traceability — country, region, variety, producer, process, lot — through the green behind it too, so a cup and a bag of the same lot read as that one lot on the cup\'s page, however loosely either was typed. As on your shelf, it only re-spells an origin you already wrote and never adds a field the cup didn\'t log; a cup shared into your circle still shows exactly what its keeper wrote.',
  ]},
  {v:'4.16.0',date:'Jul 22, 2026',title:'One green, spelled once',items:[
    'A bag now reads its origin — country, region, producer, variety, process — through the green behind it, so bags of the one lot spelled a little differently read as that one lot across your shelf, its page, and the brew screen. It only ever re-spells an origin you already wrote; the atlas never adds a field the bag didn\'t log, and everything falls back to exactly what you typed.',
  ]},
  {v:'4.15.0',date:'Jul 22, 2026',title:'Café beans, one name too',items:[
    'A café cup now reads its beans-roaster the same way your shelf does — variants of a roaster you\'ve typed differently across cups read as the one roaster they are, on the cup\'s row and its page. As on the shelf, nothing you wrote is changed and it falls back to exactly what you typed. A cup shared into your circle still shows precisely what its keeper wrote.',
  ]},
  {v:'4.14.0',date:'Jul 22, 2026',title:'One roaster, one name',items:[
    'A bag now shows its roaster under one canonical name across your shelf — when you\'ve written a roaster a little differently on different bags, they read as the one roaster they are. Nothing you typed is changed; the bag just reads through to the roaster behind it, and falls back to exactly what you wrote wherever there\'s nothing to read through.',
  ]},
  {v:'4.13.0',date:'Jul 22, 2026',title:'Your journal, by lot',items:[
    'Your record now also folds by lot: when the same green shows up in more than one record — a bag you brewed and a cup you had out that trace back to one lot — it gathers into a single row, tied where the loose origin words alone could never connect them. Tap a lot to see every record on it.',
    'Only lots that appear in two or more records show — a green logged once just echoes its own record, so it stays out of the way. Like the rest, it reads from what you\'ve already written and adds nothing to fill in.',
  ]},
  {v:'4.12.0',date:'Jul 22, 2026',title:'Your journal, by roaster',items:[
    'Your record now folds by roaster: one row per roaster behind your bags and café cups, with variants of a name gathered together and a bag at home counted beside a cup you had out. Tap a roaster to see every record under it.',
    'It reads from what you\'ve already logged — no roaster, no row — and appears only once there\'s more than one record to gather, so it stays a reading over your journal, never another thing to fill in.',
  ]},
  {v:'4.11.0',date:'Jul 22, 2026',title:'More from this roaster',items:[
    'A bag or a café cup now also shows more from the same roaster elsewhere in your journal — a bag you brewed at home and a cup you had out under one roaster, tied even when the name was written a little differently each time.',
    'It sits under the same-lot line and never repeats a record already shown there; like that line, it reads from what you\'ve logged and appears only when there\'s truly something to connect.',
  ]},
  {v:'4.10.0',date:'Jul 22, 2026',title:'The same lot, wherever it landed',items:[
    'A bag or a café cup now shows the same green lot elsewhere in your journal — the coffee you brewed at home and the one you had out can be a single lot, a tie the origin words alone could state but never connect. Tap it to cross to the other record.',
    'It reads from what you already logged and appears only when a lot truly recurs; nothing new to fill in, nothing shown when there\'s no match yet.',
  ]},
  {v:'4.9.0',date:'Jul 19, 2026',title:'Streets under the pins',items:[
    'The map surfaces — Find\'s results, the discover map, a café\'s page — now draw real streets behind the pins: OpenStreetMap, repainted in CARTA\'s own paper and ink. No key, no account, nothing tracked.',
    'Offline nothing changes. The drawn plot stands, exact as ever, and streets slot in quietly only when the tiles can be fetched. The map is an enhancement, never a dependency.',
    'A café\'s page gains a small locator — its pin wearing the café\'s own accent, the streets around it staying neutral.',
    'The discover map pans now. Ranks are labels, not positions — #2 stays #2 wherever you wander — and the drawer follows the pin you tap.',
  ]},
  {v:'4.8.0',date:'Jul 19, 2026',title:'Appearance, auto',items:[
    'A third choice under Preferences → Appearance: Auto. It hands the call to your device\'s own light/dark setting and follows it live — dusk falls in when the system does, no separate switch to remember.',
  ]},
  {v:'4.7.0',date:'Jul 19, 2026',title:'Today, and the matching',items:[
    'A new first tab: Today. The day\'s greeting, the thread you left on the map — a session holds for a week, then steps back to a plain suggestion — three matched teasers, and the record\'s recent line.',
    'The matching. Every place on the register you haven\'t kept is read against your record: the traits of the places you keep, the distance when you say where you stand (held in memory, never stored), the circle\'s cups through affinity. Every number carries its reasons — no score without its signals — and until three café cups are kept it speaks in bands, not numbers.',
    'New to the record? Name three cafés you already love, on Today, and their traits become your signal. A place the register doesn\'t know yet enters on its name alone.',
    'The map, read for you — from Today or Find. Pins ranked by match, a card per pin, a list view that hides nothing. Save waits under Want to go; Skip steps a place back for two weeks and fades on its own — never a veto — and "fewer like it" tips its kind down on the same curve.',
    'The Record keeps the bookkeeping: Want to go ordered by match with a gentle ask when a save sits unvisited, standing skips, standing trait leans — every one visible, every one fading on its own.',
  ]},
  {v:'4.6.0',date:'Jul 18, 2026',title:'A banner, and the map',items:[
    'A café\'s own page now opens on a banner drawn from its own colours — the signature hue read from its website, or a neutral roast tone while that\'s still unread. The name rides on it; nothing else about the record changed.',
    'Find\'s search grew a map — real pins, scaled to fit, never a tile or a street. A filled dot is a place you keep; a dashed one is still waiting for a first cup. Tap either to open the page.',
  ]},
  {v:'4.5.0',date:'Jul 18, 2026',title:'Neighborhood and tags',items:[
    'A café can now name a neighborhood, not just a city. Looking it up on the map fills it in automatically when it knows one — blanks only, typed always wins — and it rides next to the city everywhere a café is shown.',
    'Tag a place your own way — patio, quiet, laptop-friendly, whatever you\'d tell a friend. Tags live on the café\'s page and join the pooled search in Find, so a tag turns up every place you\'ve marked with it.',
    'Both are Register facts like the pin and the palette: shared by every keeper of the device, and synced to the group the same way.',
  ]},
  {v:'4.4.0',date:'Jul 18, 2026',title:'The reach',items:[
    'Every café can now be read for depth — four marks, no ladder: ○ Counter, ◎ House, ◉ Roastery, ● Origin. How much of a coffee\'s road makes it across the counter — a description of the café, never a score. The 1–9 stays yours.',
    'You never pick a badge. Say what you saw — the bag named, the methods on the menu — and the reading follows from the record. A sighting rides the café cup form (optional, three taps at most) or the café\'s page; each is signed, dated, and shared through the Register.',
    'Per fact, the newest sighting carries; older lines keep their ink. Amend your own line or withdraw it — struck, signed, never erased. Where no one has read a café, it says unread — never a default to the shallow end.',
    'Depth is a lens in Find — filter Worth the walk to a mood, never a sort. Every badge is one tap from the primer, and the record of the reach opens from the café\'s page.',
  ]},
  {v:'4.3.0',date:'Jul 18, 2026',title:'The bag, read from its website',items:[
    'A coffee now reads itself off the web, the way a café already does. Give the bag its website and CARTA takes the roaster’s colours and the line it states — and the bag wears that palette on its page and its place on the shelf. Less to type; a shelf that finally has a face.',
    'Café cups can pull the beans’ brand the same way — the roaster’s site fills the beans and a line, and the cup carries the colours it read.',
    'Photographs are retired — bags, cups, all of it. A brand is its colours and its words, kept small, offline and portable; no picture is captured or stored. Old photos stay in the record, simply no longer shown.',
  ]},
  {v:'4.2.0',date:'Jul 18, 2026',title:'The café, read from its website',items:[
    'A café’s brand now comes from its website alone — give it the site and CARTA reads the colours straight from the source. The branding photograph is retired; the website read was always the stronger hand.',
    'One read fills more than colour. The site’s own description becomes the café’s line, the name it states is surfaced, and the map opens on its address — so you retype nothing the site already knows. It fills only what’s still blank.',
    'What CARTA keeps is the palette and the words, never the page — held on the device, the record yours and offline.',
  ]},
  {v:'4.1.0',date:'Jul 18, 2026',title:'A café’s colours, from its website',items:[
    'Give a café its website and CARTA reads its colours straight from the brand — the logo and the palette around it — then dresses the café’s page and every cup you log in it. The same surface as before, sourced from the site instead of a photograph.',
    'The photo still works, and still overrides. Offline, or a site that won’t answer, falls back to it without a fuss.',
    'What CARTA keeps is the palette, not the page — a handful of colours, held on the device, the record still yours and still offline.',
  ]},
  {v:'4.0.0',date:'Jul 18, 2026',title:'A room at a time',items:[
    'CARTA now opens a room at a time — Reading, Remembering, Making, Keeping. Start by reading other people\'s cups; step deeper whenever you\'re ready. Nothing is ever taken away.',
    'Friends is now Find. Same record, sharper question: where is the next good cup? Recommendations, taste affinity, the stream, the beans worth chasing — and a door to the next room at the bottom.',
    'Every café is a page now, not a sheet. Your cups, the circle\'s cups, the pin, the provenance — one place per place, reached from anywhere its name appears.',
    'The first brew asks only for your grinder and brewer, in plain words — the Setup writes itself. The full Setup editor still exists for the day you change a burr.',
    'The bag\'s end is part of the record: put it away from Home, and it waits under Put away with your best cup. Buy it again and the first brew starts from what you learned.',
    'The Ledger tab is now More — your record, the ladder of rooms, preferences, your circle, the manual. The welcome asks one honest question: how do you take your coffee?',
  ]},
  {v:'3.1.0',date:'Jul 17, 2026',title:'Log light, fill in later',items:[
    'Every cup is editable. Open one from the record and revise it — add the beans, the price, a photo, the order-again verdict, whenever you have the time. It keeps its place and hour.',
    'Café cups start minimal: a shop, a style, a tap on the scale. Everything else waits behind one line — add the rest now, or come back to it.',
    'Brews open the same way — the dials up front, instrumentation and notes folded away until you want them.',

/* ============ the tuck — a section folds away (one pass, every screen) ============ */
/* CARTA's pages answer the same questions in the same order, and as the record filled
 * in, answering all of them at once became one very long scroll: a green's page states
 * its identity, its plan, its heights, its standing, its hands, its bars, its brews and
 * your overlay, and the corrections are at the bottom of all of it. Nothing there is
 * wrong — a page that dropped a question to stay short would be lying — so the answer
 * is not to say less. It is to let the keeper choose what is unrolled.
 *
 * ONE PASS, NOT A COMPONENT. Every screen already builds its sections the same way: an
 * <h2>, or a .section-head carrying that h2 and one action, followed by the section's
 * blocks. So no view learns anything new — the painted DOM is walked once and each of
 * those runs becomes a card. Add a section anywhere in the app and it folds for free;
 * that is the same test the one page applies to a new node kind.
 *
 * ON THE DOM, NEVER ON THE STRING, and only over the DIRECT children of the screen. An
 * <h2> inside a <details> or inside a card belongs to that block, not to the page, and
 * a regex over the HTML cannot tell the difference. This one can, because it asks the
 * document rather than the text.
 *
 * KEYED BY THE SECTION'S NAME, NOT THE SCREEN. Close "Where it sits" once and it stays
 * closed as you walk from green to green — which is the whole point: the keeper sets a
 * reading posture, not a per-page state, and then every page is the short page they
 * asked for. It is a convenience about the app and never a fact about coffee, so it
 * lives in its own device-local key, outside the ledger and outside the sync. */
const TUCK_KEY='carta.tucks.v1';
let TUCKS=(()=>{try{return JSON.parse(localStorage.getItem(TUCK_KEY)||'{}')||{}}catch(e){return {}}})();
const tuckSave=()=>{try{localStorage.setItem(TUCK_KEY,JSON.stringify(TUCKS))}catch(e){}};
/* what stands open on a device that has never been told otherwise. Identity is what the
 * page IS — a green's columns, a Setup's assembly — and the standing is the reading the
 * identity earns, so those two are the page at a glance. Every other section states its
 * count on its own face and waits to be asked for: a closed card is never a blank
 * drawer, it is a line in a table of contents. */
const TUCK_OPEN={'identity':1,'the standing':1,'your facts':1,'the greens':1,'lately':1};
const tuckId=t=>String(t).toLowerCase().replace(/\s+/g,' ').trim();
const tuckIsOpen=k=>TUCKS[k]==null?!!TUCK_OPEN[k]:!!TUCKS[k];
function tuckAll(root){
  if(!root)return;
  let host=root;
  // the settle wrapper is the screen, not a section of it — walk through it
  while(host.children.length===1&&host.firstElementChild.classList&&host.firstElementChild.classList.contains('ca-screen'))
    host=host.firstElementChild;
  if(host.hasAttribute('data-notuck'))return;
  // the screen's own big line is an h2 too (.display) and is not a section of anything
  const isHead=el=>(el.tagName==='H2'&&!el.classList.contains('display'))||el.classList.contains('section-head');
  // what ends a section without starting one: the page's own furniture (the act row,
  // the closing note, the seal) and a <details>, which is a fold already and would
  // otherwise be swallowed by whatever section happened to precede it
  const stops=el=>el.hasAttribute('data-notuck')||el.tagName==='DETAILS';
  const secs=[];let cur=null;
  [...host.children].forEach(el=>{
    if(isHead(el)){cur={head:el,body:[]};secs.push(cur);return}
    if(stops(el)){cur=null;return}
    if(cur)cur.body.push(el);
  });
  // one section is not a stack. A screen with nothing to fold is left exactly as it was.
  if(secs.filter(s=>s.body.length).length<2)return;
  let n=0;
  secs.forEach(s=>{
    if(!s.body.length)return;                       // a heading with nothing under it stays a heading
    const h2=s.head.tagName==='H2'?s.head:s.head.querySelector('h2');
    const title=((h2||s.head).textContent||'').trim();
    if(!title)return;
    const k=tuckId(title),open=tuckIsOpen(k);
    const sec=document.createElement('section');
    sec.className='tuck';sec.dataset.k=k;if(open)sec.setAttribute('open','');
    const hd=document.createElement('div');hd.className='tuckhead';
    const tap=document.createElement('button');tap.type='button';tap.className='tucktap';
    tap.setAttribute('aria-expanded',open?'true':'false');
    tap.innerHTML='<span class="mk" aria-hidden="true"></span><span class="t"></span>';
    tap.querySelector('.t').textContent=title;
    tap.onclick=()=>tuckTap(sec);
    hd.appendChild(tap);
    /* whatever rode on the right of the section head — the count, a primer tap — keeps
       its place and its own tap, OUTSIDE the fold's button. A button inside a button is
       not a control, it is a bug: the browser drops the inner one. */
    const meta=document.createElement('span');meta.className='meta';
    if(h2&&s.head!==h2)[...s.head.children].forEach(c=>{if(c!==h2)meta.appendChild(c)});
    hd.appendChild(meta);
    const wrap=document.createElement('div');wrap.className='tuckwrap';
    const body=document.createElement('div');body.className='tuckbody';
    const inner=document.createElement('div');inner.className='tuckin';
    s.body.forEach(el=>inner.appendChild(el));
    body.appendChild(inner);wrap.appendChild(body);
    sec.appendChild(hd);sec.appendChild(wrap);
    host.insertBefore(sec,s.head);s.head.remove();n++;
  });
  if(n>=3)tuckBarAdd(host);
}
// open all / close all — one quiet line above the stack. The stack IS the page now, so
// the way back to the old long scroll has to be one tap, and it has to persist.
function tuckBarAdd(host){
  const first=host.querySelector(':scope > .tuck');if(!first)return;
  const bar=document.createElement('div');bar.className='tuckbar';
  // the ground's own switch sits here and nowhere else: it is the same act as closing
  // the cards — how much of the place under the page you want to see at once
  if(_groundAvail){
    const g=document.createElement('button');g.type='button';g.className='gnd';
    g.textContent=groundOn()?'Hide the ground':'Show the ground';
    g.onclick=groundToggle;bar.appendChild(g);
  }
  const b=document.createElement('button');b.type='button';b.className='all';
  b.onclick=()=>tuckSetAll(host,tuckAnyShut(host));
  bar.appendChild(b);host.insertBefore(bar,first);
  tuckBar(host);
}
const tuckSecs=host=>host?[...host.querySelectorAll(':scope > .tuck')]:[];
const tuckAnyShut=host=>tuckSecs(host).some(t=>!t.hasAttribute('open'));
function tuckBar(host){
  const b=host&&host.querySelector(':scope > .tuckbar > button.all');if(!b)return;
  b.textContent=tuckAnyShut(host)?'Open all':'Close all';
}
// a tap never re-renders: a repaint would throw the scroll back to the top, which is
// exactly the walk the fold exists to spare. The card opens in place.
function tuckOne(sec,open){
  if(open)sec.setAttribute('open','');else sec.removeAttribute('open');
  const t=sec.querySelector('.tucktap');if(t)t.setAttribute('aria-expanded',open?'true':'false');
  TUCKS[sec.dataset.k]=open?1:0;
}
function tuckTap(sec){
  const open=!sec.hasAttribute('open');
  tuckOne(sec,open);tuckSave();tuckBar(sec.parentElement);
  // a live map cannot boot into a closed card — it has no width to fit a camera to
  if(open)smapMount();
}
function tuckSetAll(host,open){
  tuckSecs(host).forEach(sec=>tuckOne(sec,open));
  tuckSave();tuckBar(host);if(open)smapMount();
}

/* ============ router ============ */
/* The rooms open a ladder at a time — Reading (Find), Remembering (Café),
 * Making (Home), Keeping (Record). depth() is how far this user has stepped in;
 * the tab bar shows only the open rooms, and each room's foot holds a door to
 * the next. Nothing is ever taken away — only added. */
const DEPTH_NAMES=['Reading','Remembering','Making','Keeping'];
function depth(){
  if(readOnly())return 4;                        // a record being read shows all its rooms
  if(reader())return 1;                          // a published copy is a reading, and only that
  const d=getPref('depth',null);
  if(d)return Math.min(4,Math.max(1,d));
  // ledgers from before the ladder — anyone with a record, or already welcomed — start fully open
  return (getPref('onboarded',false)||D.cups.length||D.bags.length||D.setups.length)?4:1;
}
/* STREAMLINED.html: three rooms, always on the bar — Atlas · Record · Desk.
 * The atlas is the shared road, the record is your wash over it, and the desk
 * holds everything that is not a cup. Today folded into the head of the Atlas
 * (the coffee in your hands, its road, and the two things you do with it);
 * Home and Café are channels, not rooms; Find retired into the Atlas. The
 * ladder survives as the record of how deep you've stepped — read on the Desk,
 * never a gate on the bar. Nothing is ever taken away. */
function tabsFor(d){
  // A reader gets two rooms. The Record is their overlay over the atlas — their
  // cups, their plates, their leans — and for a reader it is empty by
  // definition. A room whose whole content is "you have nothing" is a nag with a
  // tab of its own; the offer to start keeping belongs on the Desk, once.
  if(reader())return [{id:'atlas',label:'Atlas'},{id:'ledger',label:'Desk'}];
  return [{id:'atlas',label:'Atlas'},{id:'trace',label:'Record'},{id:'ledger',label:'Desk'}];
}
const defaultTab=d=>'atlas';
function unlockDepth(n,t,msg){setPref('depth',Math.max(depth(),n));placeView=null;go(t);toast(msg)}
const UNLOCK={2:['atlas','Remembering is open — a bar and one tap is a whole record.'],3:['atlas','Making is open — the instrument rides off the coffee in your hands.'],4:['trace','Keeping is open — the whole through-line.']};
function doorHTML(title,body,cta,call){
  return `<div style="border-top:1px solid var(--ink);margin-top:28px;padding:16px 2px 6px">
    <div class="eyebrow">When you're ready</div>
    <div style="font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-0.01em;color:var(--ink)">${title}</div>
    <div class="muted small" style="margin:6px 0 12px;line-height:1.5">${body}</div>
    <button class="btn btn-quiet" onclick="${call}">${cta}</button>
  </div>`;
}
const seal=(name,em)=>`<div class="qm-seal">${esc(name)}<span class="em">${em}</span></div>`;
/* The shutter — temporary, deliberate. Rooms from before the redesign that the
 * prototype (the reference file) does not carry wait behind this flag rather
 * than being torn out: the matching's cold-start and discover map on the Atlas,
 * the circle stream, taste affinity, beans worth chasing, the cross-context
 * read, the journal's by-roaster/by-lot folds, the quick-start guide. Flip to
 * true and every one of them answers again; nothing was deleted. The Record's
 * bookkeeping (wants, skips, leans) stays visible — nothing the matching
 * writes is hidden from the Record. */
const LEGACY_ON=false;
let tab='today';
let placeView=null;   // a café name — the page currently open over the tab, or null
let pageView=null;    // {kind:'lot'|'roaster',id} — an atlas page open over the tab, or null
let pageStack=[];     // the pages walked through to reach it — back returns to the last one, not the room
let doorOn=false;     // the door — a screen of its own, over any room (SURFACES.md §1)
function openPlace(shop){pagePush();placeView=shop;pageView=null;curateOn=false;doorOn=false;render()}
function closePlace(){if(pageStack.length)return pageBack();placeView=null;render();if(discOn)discScrollTo(discSel,true)}
// Rooms that became channels keep their old names answering — a saved flow
// that says go('cafes') or go('today') lands where that work now lives.
const TAB_ALIAS={field:'atlas',cafes:'atlas',circle:'atlas',today:'atlas'};
// A reader has no Record room, so a saved link or an old flow that says go('trace')
// lands on the Atlas rather than on a tab that is not on the bar.
function go(t){t=TAB_ALIAS[t]||t;if(reader()&&t==='trace')t='atlas';tab=t;placeView=null;pageView=null;pageStack=[];discOn=false;curateOn=false;doorOn=false;deskOpen=null;discMatch=null;clearTimeout(_mt);render()}
// which room a sub-view lights on the bar
const TAB_FAMILY={bags:'atlas',shelf:'atlas',setups:'ledger'};
/* The header's second line names the screen, not the app — the prototype's SUBS.
 * It is the only place the app says where you are, so it says it plainly. */
const SUBS={atlas:'The atlas',trace:'The record',ledger:'The desk',bags:'The shelf',setups:'The tools',
  lot:'A green',roaster:'The roaster',place:'The bar',door:'A coffee',curate:'The chart',disc:'The map',
  producer:'The grower',processor:'The station',region:'A region',locality:'A locality',country:'A country',city:'A city',setup:'A Setup',process:'A process',variety:'A variety'};
let _lastScreenKey=null; // the settle plays on a screen change, never on a repaint
function screenSub(){
  if(readOnly())return `Viewing ${viewingUser().name}`;
  if(doorOn)return SUBS.door;
  if(curateOn)return SUBS.curate;
  // a producer is a farm, a hand or an unclassified actor — the masthead says which,
  // because "The grower" over a parcel of land is the collapse this pass just undid
  if(pageView&&pageView.kind==='producer'){const p=catNode('producers',pageView.id)||{};
    return isFarmNode(p)?'The farm':isHandNode(p)?'The grower':'The producer'}
  if(pageView)return SUBS[pageView.kind]||SUBS.atlas;
  if(placeView)return SUBS.place;
  if(discOn)return SUBS.disc;
  return SUBS[tab]||SUBS.atlas;
}
function render(){
  _affCache=null; // affinity is recomputed once per paint, from the current record
  _mCache=null;   // so is the matching — signal, circle, candidates
  catBust();      // and the layered catalog read, in case a copy landed mid-paint
  keptBustMap();  // and the map's overlay set — the greens a ring is drawn around
  smapDestroy();  // live maps die with the DOM they sit in — give the contexts back first
  document.getElementById('who').textContent=screenSub();
  const db=document.getElementById('doorbtn');
  // the door never offers itself inside itself, over someone else's record, or
  // on a published copy — a reader has nothing on this device for it to write to
  if(db)db.style.display=(readOnly()||reader()||doorOn)?'none':'';
  const lit=TAB_FAMILY[tab]||((placeView||pageView||doorOn)?'atlas':tab);
  document.getElementById('tabs').innerHTML=tabsFor(depth()).map(t=>
    `<button class="${lit===t.id?'on':''}" onclick="go('${t.id}')">${t.label}</button>`).join('');
  const m=document.getElementById('main');
  const screenKey=[tab,placeView||'',pageView?pageView.kind+':'+pageView.id:'',discOn?1:0,curateOn?1:0,doorOn?'door'+doorStep:0].join('|');
  const settle=screenKey!==_lastScreenKey&&!reducedMotion();_lastScreenKey=screenKey;
  _pageGround='';_groundAvail=false;  // built by the page — and only a node page has one
  const body=(readOnly()?viewBanner():'')+(doorOn?vDoor():curateOn?vCurate():pageView?nodePage(pageView.kind,pageView.id):placeView?nodePage('place',placeView):discOn?vDiscover():(({atlas:vAtlas,bags:vBags,setups:vSetups,trace:vTrace,ledger:vDesk})[tab]||vAtlas)());
  m.innerHTML=settle?`<div class="ca-screen">${body}</div>`:body;
  // the ground goes up in the same pass, so its street surface is registered against the
  // same smapReg generation the frames are — smapDestroy cleared them both a moment ago
  const gl=document.getElementById('ground');if(gl)gl.innerHTML=_pageGround;
  tuckAll(m);      // every section becomes a card, before anything measures the page
  m.scrollTop=0;window.scrollTo(0,0);
  smapMount();
  if(doorOn&&doorStep===0){const ta=document.getElementById('d_text');if(ta)ta.focus()}
  if(doorOn&&doorStep===2)repaintSug(); // the rails need the inputs to exist first
}
function viewBanner(){return `<div class="viewbar"><span>Viewing <strong>${esc(viewingUser().name)}</strong>'s ledger — read only${remoteStale?` · cached ${fmtAgo(remoteStale===true?null:remoteStale)}`:''}</span><button onclick="exitView()">Back to mine</button></div>`}

function cupRow(c,showKind){
  const b=bagById(c.bagId);
  const cafe=c.kind==='cafe';
  const what=cafe?`${esc(c.shop||'café')}${c.drink?` · ${esc(c.drink)}`:''}`:esc(bagName(b));
  const brew=c.brewId?D.brews.find(x=>x.id===c.brewId):null;
  const beans=[cupRoaster(c),lotRead(c).origin].filter(Boolean).map(esc).join(' · ');
  const meta=brew
    ?`<span class="num">${brew.grind??'—'} grind · ${brew.doseG??'—'}g → ${brew.waterG??'—'}g · ${fmtTime(brew.timeSec)}</span>`
    :cafe

function saveNodeAmend(doc,id){

    if(![o.originCountry,o.originRegion,o.producer,o.variety,o.process,o.lot].some(regSubstance)){toast('A green needs at least one origin column to stand on');return}
    const key=lotKeyOf(o,w.id),clash=catByKey('lots',key);
