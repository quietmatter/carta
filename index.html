function traceCard(b){
  const brews=brewsOf(b.id).slice().reverse(); // chronological
  const n=brews.length;
  const hed=brews.map(x=>{const c=D.cups.find(c=>c.brewId===x.id);return c?c.hedonic:null});
  const grinds=brews.map(x=>x.grind).filter(v=>v!=null);
  const gmin=Math.min(...grinds),gmax=Math.max(...grinds);
  const W=480,H=150,P=28;
  const X=i=>n===1?W/2:P+i*(W-2*P)/(n-1);
  const GY=v=>gmax===gmin?H/2:H-P-((v-gmin)/(gmax-gmin))*(H-2*P);
  const HY=v=>H-P-((v-1)/8)*(H-2*P);
  let path='',pts='',hpts='';
  brews.forEach((x,i)=>{ if(x.grind!=null){ path+=(path?'L':'M')+X(i).toFixed(1)+' '+GY(x.grind).toFixed(1)+' ';
    pts+=`<circle cx="${X(i).toFixed(1)}" cy="${GY(x.grind).toFixed(1)}" r="3.5" fill="var(--accent)"/>`;}
    if(hed[i]!=null) hpts+=`<circle cx="${X(i).toFixed(1)}" cy="${HY(hed[i]).toFixed(1)}" r="3" fill="none" stroke="var(--ink-2)" stroke-width="1.5"/>`;
  });
  return `<div class="card">
    <div class="row"><strong>${esc(bagName(b))}</strong><span class="n-note">n=${n}</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%">
      <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line)"/>
      ${grinds.length?`<text x="${P}" y="14" font-size="10" fill="var(--ink-3)">grind ${gmin}–${gmax}</text>`:''}
      <text x="${W-P}" y="14" font-size="10" fill="var(--ink-3)" text-anchor="end">○ hedonic 1–9</text>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>${pts}${hpts}
    </svg>
    <div class="n-note">solid — grind setting · hollow — hedonic. Comparable only within one Setup; every point carries its instrumentation.</div>
  </div>`;
}

/* ---- the published atlas, the founder's side (docs/READER.md §7).

 * half of that sentence was true for someone who never signed in. This is the
 * hand that makes the first half true, and it is deliberately ONE act: no
 * preview screen, no diff. The atlas is the founder's own record and they know
 * what is in it; the counts are there to catch the surprise, not to review the

const publishable=()=>!!(typeof SYNC!=='undefined'&&SYNC&&syncedHere()&&SYNC.token);
const atlasLink=()=>publishable()?location.origin+location.pathname+'#atlas='+encodeURIComponent(SYNC.url):'';

// What leaves, counted from the shared documents this device holds canonically —
// the founder holds the pen, so this copy IS the record. Pours are the one count
// the device cannot know: they are gathered from every keeper's ledger on the
// server, so the sheet says so rather than printing a number it guessed.
function publishCounts(){
  const held=new Set(heldRefs());
  return {
    greens:CAT.lots.entries.filter(e=>e&&!held.has(e.id)).length,          // the OWN documents — what this
    roasters:CAT.roasters.entries.filter(e=>e&&regSubstance(e.name)).length, // pen actually sends to the server
    roasts:CAT.roasts.entries.filter(e=>e&&!held.has(e.lotRef)).length,
    bars:regEntries().length,
    held:held.size,
  };
}

async function publishAtlas(){
  if(penGuard())return;
  if(!publishable()){toast('Connect to a sync server first');return}
  toast('Publishing…');
  try{
    const r=await api('/api/publish','POST',{held:heldRefs()});
    if(r.status===403){penRefused(r);toast('The pen is held elsewhere — nothing published');return}
    if(r.status!==200){toast((r.body&&r.body.message)||'The server refused the copy');return}
    publishResult={rev:r.body.rev,publishedAt:r.body.publishedAt,counts:r.body.counts};
    openPublish();
    const p=r.body.counts||{};
    toast(`Published. Revision ${r.body.rev} — ${nPl(p.pours||0,'pour')} carried.`);
  }catch(e){toast(e&&e.auth?'Sign in again to publish':'Server unreachable — nothing published')}
}

  {k:'signin', t:'Sign in',                d:'you have an account on this server — the pen stays where it is'},
  {k:'shelf',  t:'The shelf',              d:'every bag — on it, and put away'},
  {k:'setups', t:'Setups',                 d:'your grinder and brewer; grind is only comparable within one'},
  {k:'atlas',  t:'Add to the atlas',       d:'the door, a proposed sighting, the chart'},
  {k:'record', t:'The record leaves with you', d:'export the ledger, bring one back, the working copy'},
  {k:'struck', t:'What you set down',         d:'struck from the record, not erased — and one tap from coming back'},

const READER_ROWS=['copy','keeping','signin','prefs','manual'];
function vDesk(){
  const ro=readOnly(),rd=reader();
  if(deskOpen)return `<button class="back" onclick="deskBack()">← The desk</button>${deskSection(deskOpen,ro)}`;
  const sn=ro?0:strikeCount()+(isAdmin()?catSetDownList().length:0); // the drawer counts everything in it — the ledger's strikes and the atlas's
  // the room appears only once there is something in it — an empty drawer is not a row.
  // A reader gets five rows and no others: sync setup, the users room, the pen, what
  // you set down, export, the shelf and the tools all describe a record they do not
  // keep. DESK_ROWS was already filtered per state, so this is a filter, not a fork.
  const rows=rd?DESK_ROWS.filter(r=>READER_ROWS.includes(r.k))
    :DESK_ROWS.filter(r=>!['copy','keeping','signin'].includes(r.k))
      .filter(r=>!(ro&&['atlas','record','pen','sync','keepers','prefs'].includes(r.k))).filter(r=>r.k!=='struck'||sn);

    :`${rows.length} rows, not ${rows.length} screens. The desk is where administration lives so no other surface has to carry it.`}</p>
  ${rows.map(r=>`<button class="rowlink" onclick="deskGo(${jsq(r.k)})"><span><span class="t">${esc(r.t)}</span><br><span class="m">${esc(r.d)}</span></span><span class="go">${r.k==='atlas'&&qn?qn:r.k==='struck'?sn:'→'}</span></button>`).join('')}
  <p class="note">${rd?'The atlas is everyone’s; the record is yours. Nothing here is written down until you decide to write it.'
    :'Your ledger is yours to write, always. The shared record is kept by one hand for now — every page of it is still yours to read.'}</p>

/* Find retired into the Atlas: search, the chart, the drawn plot, the season's
 * lots, the hands, the matching's worth-the-walk, the stream. One tab reads
 * the whole shared record; every mark on it explains itself one tap away. */
let atlasQ='';
function atlasType(v){atlasQ=v;const el=document.getElementById('atlasres');if(el)el.innerHTML=atlasResHTML()}
function atlasSearchIndex(){
  const ix=[];
  atlasLotIds().forEach(id=>{const l=catNode('lots',id);if(!l)return;const fp=l.fingerprint||{};
    const sub=[fp.region,fp.country,fp.process&&fp.process.family,l.variety].filter(regSubstance).join(' · ');
    ix.push({name:lotLabel(l),kind:'lot',sub:sub||'a green on the atlas',
      k:[lotLabel(l),fp.country,fp.region,fp.locality,fp.producer,l.variety,fp.process&&fp.process.family,(l.hardIds||[]).map(h=>h.value).join(' ')].filter(Boolean).join(' ').toLowerCase(),
      go:`openLotPage(${jsq(id)})`})});
  catAll('roasters').forEach(r=>{if(!r||!regSubstance(r.name))return;
    ix.push({name:r.name,kind:'roaster',sub:[r.city,r.country].filter(regSubstance).join(', ')||'a roaster on the atlas',
      k:[r.name,r.city].filter(Boolean).join(' ').toLowerCase(),go:`openRoasterPage(${jsq(r.id)})`})});
  catAll('producers').forEach(p=>{if(!p||!regSubstance(p.name))return;
    ix.push({name:p.name,kind:'grower',sub:[p.region,p.country].filter(regSubstance).join(', ')||'a grower on the atlas',
      k:[p.name,p.region,p.country].filter(Boolean).join(' ').toLowerCase(),go:`openProducerPage(${jsq(p.id)})`})});
  catAll('processors').forEach(p=>{if(!p||!regSubstance(p.name))return;
    ix.push({name:p.name,kind:'station',sub:[p.region,p.country].filter(regSubstance).join(', ')||'a station on the atlas',
      k:[p.name,p.region,p.country].filter(Boolean).join(' ').toLowerCase(),go:`nav('processor',${jsq(p.id)})`})});
  regEntries().forEach(e=>{if(!e||!regSubstance(e.name))return;
    ix.push({name:e.name,kind:'bar',sub:[e.city,e.neighborhood].filter(regSubstance).join(' · ')||'on the register',
      k:[e.name,e.city,e.neighborhood,(e.tags||[]).join(' ')].filter(Boolean).join(' ').toLowerCase(),go:`openPlace(${jsq(e.name)})`})});
  return ix;
}
function atlasResHTML(){

  return hits.length?hits.map(h=>`<button class="card tap" style="width:100%;text-align:left;cursor:pointer;display:block" onclick="${h.go}">
      <div class="row"><strong>${esc(h.name)}</strong><span class="n-note">${h.kind}</span></div>
      <div class="muted small" style="margin-top:3px">${esc(h.sub)}</div>
    </button>`).join('')
    :`<div class="muted small serif" style="font-style:italic;padding:6px 2px">Nothing by that name on this chart yet. The atlas grows by sightings — log one and the page begins.</div>`;
}
/* ---- the interlude — ask, and the atlas composes the season. One considered
 * moment, only ever on a tap, replayable, still under reduced motion. ---- */
let seasonState=null; // null → idle · 'reading' → composing · 'read' → composed
let _seasonT=null;
function readSeason(){
  if(reducedMotion()){seasonState='read';render();return}
  seasonState='reading';render();
  clearTimeout(_seasonT);
  _seasonT=setTimeout(()=>{if(seasonState==='reading'){seasonState='read';render()}},980);
}
// The reading's reasons — always the keeper's own taste, named. Bands, not
// numbers, until the record can argue them (lowConf); never an invented lead.
function seasonReasons(){
  const cups=D.cups.filter(c=>c&&c.hedonic!=null);
  if(lowConf())return 'an early read — the chart ranks by the places you keep and the three you named; numbers arrive at your third cup out.';
  const agg={};
  cups.forEach(c=>{const o=lotRead(c)||{};
    [['country',o.country],['process',(o.process||'').toLowerCase()]].forEach(([kind,vRaw])=>{
      const v=(vRaw||'').trim();if(!v)return;const k=kind+':'+v.toLowerCase();
      agg[k]=agg[k]||{kind,v,n:0,s:0};agg[k].n++;agg[k].s+=c.hedonic});});
  const leads=Object.values(agg).filter(a=>a.n>=2).map(a=>({...a,avg:a.s/a.n})).sort((a,b)=>b.avg-a.avg).slice(0,2);
  const kept=(D.cups.filter(c=>c&&c.kind==='cafe'&&c.shop).length)?' and the pins fall where you already keep':'';
  if(!leads.length)return 'too few readings to name a lead — the chart ranks by what you keep, once you keep it'+kept+'.';
  return leads.map(l=>l.kind==='country'?`the ${l.v} cups you keep reaching for`:`the ${l.v} lots`).join(' and ')+' lead'+kept+'.';
}
/* ---- the season's lots — every anchored green, its standing worn as chips ---- */

    .filter(x=>x.lot)

}

/* ============ the pages — lot and roaster, full screens on the Atlas ============ */
/* Every café is a page (vPlace); the redesign gives the lot and the roaster the
 * same standing — a screen, not a sheet, reached from anywhere their name
 * appears. openLotPage/openRoasterPage keep their names so every existing door
 * still opens; they now set the page and render. */
/* The pages walk into each other — a plate opens a green, a green opens its roaster — so back
 * means the page you came from, not the top of the room. One shallow stack, cleared whenever a
 * room is chosen from the bar; a page never pushes itself twice. */
function pagePush(){
  const cur=curateOn?{kind:'curate',id:''}:placeView?{kind:'place',id:placeView}:pageView;
  if(!cur)return;
  const top=pageStack[pageStack.length-1];
  if(top&&top.kind===cur.kind&&top.id===cur.id)return;
  pageStack.push(cur);if(pageStack.length>8)pageStack.shift();
}
const PAGE_BACK={lot:'The green',roaster:'The roaster',curate:'The chart',place:'The bar',
  producer:'The grower',processor:'The station',region:'The region',locality:'The locality',country:'The country',city:'The city',
  setup:'The Setup',process:'The process',variety:'The variety'};
/* the back button names where it goes — and PAGE_BACK's one word for a producer is the
   collapse this pass undid, so the label is read off the node rather than the kind */
function pageBackLabel(p){
  if(!p)return 'The atlas';
  if(p.kind==='producer'){const n=catNode('producers',p.id)||{};
    return isFarmNode(n)?'The farm':isHandNode(n)?'The grower':'The producer'}
  return PAGE_BACK[p.kind]||'Back';
}
function pageBack(){
  const prev=pageStack.pop();
  if(!prev)return go('atlas');
  placeView=null;pageView=null;curateOn=false;
  if(prev.kind==='curate')curateOn=true;
  else if(prev.kind==='place')placeView=prev.id;
  else pageView={kind:prev.kind,id:prev.id};
  render();
}
function openLotPage(lotId){
  let lot=catNode('lots',lotId); if(!lot){toast('That green isn’t on the atlas yet');return}
  if(lotTomb(lot)){lotId=lotFwd(lotId);lot=catNode('lots',lotId)} // a link onto an absorbed green reads through
  if(lot&&lot.role==='batch')return openBatchPage(lotId); // the processing-batch parent keeps its own sheet
  pagePush();closeSheet();pageView={kind:'lot',id:lotId};placeView=null;curateOn=false;discOn=false;doorOn=false;render();
}
function openRoasterPage(roasterRef){
  const r=catNode('roasters',roasterRef); if(!r){toast('That roaster isn’t on the atlas yet');return}
  pagePush();closeSheet();pageView={kind:'roaster',id:roasterRef};placeView=null;curateOn=false;discOn=false;doorOn=false;render();
}
function closePage(){pageView=null;pageStack=[];render()}
/* the one navigation primitive (UNIFIED.html): every name anywhere is a rowlink,
   and every rowlink walks through nav — one shallow stack, whatever the kind.
   The lot, roaster and place doors keep their own openers (forwarding, tombs,
   Register resolution); every other kind is just a page keyed {kind,id}. */
function nav(kind,id){
  if(kind==='lot')return openLotPage(id);
  if(kind==='roaster')return openRoasterPage(id);
  if(kind==='place')return openPlace(id);
  pagePush();closeSheet();pageView={kind,id};placeView=null;curateOn=false;discOn=false;doorOn=false;render();
}
// t and m arrive pre-escaped by the caller (they may carry markup); right is small print
const rowlink=(kind,id,t,m,right)=>`<button class="rowlink" onclick="nav(${jsq(kind)},${jsq(id)})"><span><span class="t">${t}</span>${m?`<br><span class="m">${m}</span>`:''}</span><span class="m num" style="flex:none;display:flex;gap:9px;align-items:baseline">${right?`<span>${right}</span>`:''}<span class="go">→</span></span></button>`;
/* every page opens the same way (STREAMLINED.html): a back that names where it
   goes, the eyebrow, the display line, then the sentence under it */
const pageHero=(eyebrow,title,origin)=>`
  <button class="back" onclick="pageBack()">← ${esc(pageStack.length?pageBackLabel(pageStack[pageStack.length-1]):'The atlas')}</button>
  <p class="eyebrow">${eyebrow}</p>
  <h2 class="display">${title}</h2>
  ${origin?`<p class="lede">${origin}</p>`:''}`;
// own readings for one lot — home cups ride in through their bag, café cups carry the ref themselves
function lotOwnCups(lotId,roasterRef){
  const bagIds=new Set(D.bags.filter(b=>b&&b.lotRef&&lotFwd(b.lotRef)===lotId&&(!roasterRef||b.roasterRef===roasterRef)).map(b=>b.id));
  return D.cups.filter(c=>c&&((c.kind==='home'&&bagIds.has(c.bagId))
    ||(c.kind==='cafe'&&c.lotRef&&lotFwd(c.lotRef)===lotId&&(!roasterRef||c.roasterRef===roasterRef))));
}
/* ---- the road, as one component (SURFACES.md §2): six stations — grown → processed →
 * milled → roasted → poured → read — derived from the graph, never stored. A filled mark
 * is a station the record holds; a hollow one is the record stating what it has not been
 * told. The gap is the product. One component, every scope: the lot page, the plate's
 * aggregate, Today's coffee-in-hand. ---- */
function lotRoadStations(lotId){
  const lot=catNode('lots',lotId);if(!lot)return null;
  const fp=lot.fingerprint||{};
  const growers=(lot.producerRefs||[]).map(id=>catNode('producers',id)).filter(Boolean);
  const procs=(lot.processorRefs||[]).map(id=>catNode('processors',id)).filter(Boolean);
  const hands=[...new Set(catAll('roasts').filter(r=>r&&r.lotRef===lotId&&r.roasterRef).map(r=>r.roasterRef))];
  const shops=[...new Set(poursIn([lot]).map(p=>p.shop))];   // every pour the device can read — own, the circle's, and the published copy's
  const bat=lot.processingBatchRef&&catNode('lots',lot.processingBatchRef);
  const ko=(lot.hardIds||[]).find(h=>h.scheme==='kenya-outturn'&&!h.withdrawnAt)||(bat&&(bat.hardIds||[]).find(h=>h.scheme==='kenya-outturn'&&!h.withdrawnAt));
  const cups=lotOwnCups(lotId).length;
  // the road is a glance, six cells wide on a phone — it says the finest thing it holds and no
  // more. The page states the rest in full a line below; a name broken over three lines says less.
  const originWhere=[fp.region,fp.country].filter(regSubstance)[0]||'';
  // a station is a processor, never a grower — a producer entry the door tagged as one (or that
  // matches a standing processor node) reads at Processed, and Grown falls back to the region
  const stnKeys=new Set(procs.map(p=>normPlace(p.name)));
  const trueGrowers=growers.filter(g=>g.producerKind!=='station'&&!stnKeys.has(normPlace(g.name)));
  const flatGrower=regSubstance(fp.producer)&&!stnKeys.has(normPlace(fp.producer))?fp.producer:'';
  /* every station on this road names a HAND — grown by, processed by, roasted by, poured by.
     So where the record holds both the parcel and the person, Grown says the person: a farm
     is a place, and places are what the plan and the crumb are for. With no hand on file it
     falls to the farm, then to the flat field, then to the region — each step coarser, each
     step stated. The page names all of them a line below, apart, in the identity card.
     And the plural counts ONE kind of actor at a time: a farm and the person who works it
     are one green's origin told twice, not two hands, and "2 hands" there would be the very
     double-count the split exists to end. */
  const rHands=trueGrowers.filter(isHandNode),rFarms=trueGrowers.filter(g=>!isHandNode(g));
  const grownWho=rHands.length?(rHands.length>1?rHands.length+' growers':rHands[0].name)
    :rFarms.length?(rFarms.length>1?rFarms.length+' farms':rFarms[0].name):(flatGrower||originWhere);
  return [
    {lb:'Grown',who:grownWho},
    {lb:'Processed',who:procs.length?procs[0].name:(fp.process&&fp.process.family&&fp.process.family!=='unspecified'?sentence(fp.process.family):'')},
    {lb:'Milled',who:bat?('dry mill'+(ko?' · '+ko.value:'')):''},
    {lb:'Roasted',who:hands.length?(hands.length>1?hands.length+' hands':roasterName(hands[0])):''},
    {lb:'Poured',who:shops.length?(shops.length>1?shops.length+' bars':shops[0]):''},
    // L7 · a reader's road is FIVE stations, not six. The sixth is Read — the
    // keeper's OWN cups — and a reader has none. That is not a gap in the
    // record: the gap is the product, and this is not a gap, it is an absent
    // reader. An empty Read drawn as unread would be the record telling a quiet
    // lie about itself. Dropped here, at the source, so the drawing, the
    // reading, the aggregate and the export all say the same thing.
    reader()?null:{lb:'Read',who:cups?(cups+(cups===1?' cup':' cups')):'',you:true}
  ].filter(Boolean);
}
function road6HTML(stations,draw){
  if(!stations)return'';
  let prev=true;
  const cells=stations.map(s=>{const held=regSubstance(s.who);
    const cls='stn'+(held?' held':'')+(s.you&&held?' you':'')+((!held||!prev)?' gap':'');
    prev=held;
    return `<div class="${cls}"><span class="bar"></span><span class="mk"></span><span class="lb">${esc(s.lb)}</span><span class="who"${held?` title="${esc(s.who)}"`:''}>${held?esc(s.who):'unread'}</span></div>`}).join('');
  return `<div class="road6${draw&&!reducedMotion()?' draw':''}" style="--n:${stations.length}">${cells}</div>`;
}
/* The road's stated reading — what altReading() is to the terrace. The drawing was always
 * honest, but it made the reader count pips to learn how much of the road stands, and a
 * count nobody performs is a fact nobody has. So the road says it, with its denominator,
 * and names the stations that are silent rather than leaving them to be inferred.
 *
 * One law, and it is the whole reason this function is allowed to exist: COVERAGE COUNTS,
 * IT NEVER GRADES. A station count is what the record holds — not a measure of the coffee,
 * the grower or the roaster. Four of six is not a worse green than six of six; it is a
 * green the record has been told less about. Nothing sorts by this number, nothing merges
 * it into the standing, and no copy here may imply a coffee is lesser for it. */
function roadReading(stations){
  if(!stations||!stations.length)return '';
  const n=stations.length,dark=stations.filter(s=>!regSubstance(s.who)),held=n-dark.length;
  if(!held)return 'No station stands yet. Unread is a state, not a verdict.';
  if(!dark.length)return `All ${numWord(n)} stations stand — grown to read, unbroken.`;
  const names=dark.map(s=>STN_THE[s.lb]||s.lb.toLowerCase());
  const list=names.length>1?names.slice(0,-1).join(', ')+' and '+names[names.length-1]:names[0];
  return `${sentence(numWord(held))} of ${numWord(n)} stations ${held===1?'stands':'stand'}. ${sentence(list)} ${names.length>1?'are':'is'} silent — unread, not a gap invented shut.`;
}
// a silent station named the way the page would say it aloud, not by its column label
const STN_THE={Grown:'the farm',Processed:'the wet mill',Milled:'the dry mill',Roasted:'the roaster',Poured:'the bar',Read:'your own reading'};
// the aggregate road — count(lots where the station edge exists) / count(lots), per station.
// The reading a single green can't give: where a whole facet's road goes dark.
function aggRoadHTML(lotIds){
  const alls=lotIds.map(lotRoadStations).filter(Boolean);
  const n=alls.length;if(!n)return'';
  return `<div class="agg">${alls[0].map((s0,i)=>{const c=alls.filter(s=>regSubstance(s[i].who)).length;
    return `<div class="aggrow${c/n<.5?' thin':''}"><span class="lb">${esc(s0.lb)}</span><span class="track"><span class="fill" style="width:${Math.round(c/n*100)}%"></span></span><span class="ct">${c}/${n}</span></div>`}).join('')}</div>`;
}
/* The set-scope reading, shaped like aggTerraceHTML's tail so the two aggregate readings
 * are one grammar. The bars above already count honestly; what they cannot say is what
 * their SHAPE means for the reader — and a page that draws a spread without saying whose
 * spread it is invites the one misreading that matters: taking the record's reach for a
 * difference between the coffees. So the page warns against over-reading itself, in the
 * two cases where it can be misread, and stays quiet in every other. A warning on a set
 * that does not earn one is noise, and noise teaches the keeper to stop reading these. */
// half a set placed no finer than a country is a lopsided record, not a lopsided shelf; and
// under three greens there is no spread to read at all — the same line the corpus takes.
const ROAD_LOPSIDED=.5,ROAD_THIN=3;
function aggRoadReading(lotIds,tail){
  const alls=lotIds.map(lotRoadStations).filter(Boolean),n=alls.length;
  if(!n)return '';
  // one green is not an aggregate — the plate can hold a facet only one green answers, and
  // its own page reads it better than a bar chart of one ever will
  if(n===1)return `<div class="muted small serif" style="font-style:italic;margin:8px 2px 16px">One green${tail?' '+tail:''} — a single road, not a spread. Its own page reads it in full.</div>`;
  const out=[`Across ${numWord(n)} greens${tail?' '+tail:''}.`];
  // An exact count, never an average of thresholds — and it asks the GRAIN, not the road. The
  // road's first mark stands on a country alone, which almost every record can name, so counting
  // hollow marks would have found a lopsided set roughly never. The grain is the ladder the app
  // already keeps for exactly this question (RESOLVER §6): a green resting on the coarsest rung
  // is one the record can place in a country and nowhere finer.
  const coarse=lotIds.map(id=>catNode('lots',id)).filter(l=>l&&(!l.grain||l.grain==='country')).length;
  if(n>=ROAD_THIN&&coarse>=n*ROAD_LOPSIDED)

 * A node page is a reading about somewhere: a green grown in Huila, a bar on a street

 * section among several. This lays it UNDER the page as well — the same drawing, ink
 * withheld, pinned behind the whole scroll while the cards ride over it. Close the
 * cards and the ground is simply there; open one and you are reading about a place
 * while standing on it.

 * IT IS PAPER, AND THE LAW SAYS SO ALREADY. "Never let anything on the land be tapped,
 * counted, sorted or totalled — it is paper, and the moment it enters a count it has
 * become a record it never was." The ground draws with plotSVG's `bare` flag: no marks,
 * no labels, no edges, no ring, no key, pointer-events:none, aria-hidden. There is
 * nothing on it to enter a count. The record's marks stay exactly where they were —
 * inside the frame, inside the card, tappable, with their key and their words.

 * AND IT NEVER READS FINER THAN THE MARK ABOVE IT. The two refusals hold unchanged,
 * because the ground is built by the same two calls the section makes: streets only
 * behind the carried frame and only under STREET_KM, and the origin ground is the
 * country outline and its contours, never a street. A page whose scope is a green in
 * Huila gets Colombia's outline; a page whose scope is a bar gets that bar's streets.

 * bar, a city, a hand are about where a coffee is CARRIED, so they rest on streets; a
 * green, a grower, a station, a region, a country are about where it GREW, so they rest
 * on the country's outline and its highlands. That is not a preference — it is the same
 * rule the two frames are already ordered by, applied one layer down, and it is what

function spec(kind,id){
  switch(kind){
  case 'lot':return specLot(id);
  case 'roaster':return specRoaster(id);
  case 'process':case 'variety':return specFacet(kind,id);
  case 'producer':return specProducer(id);
  case 'processor':return specProcessor(id);
  case 'region':return specRegion(id);
  case 'locality':return specLocality(id);
  case 'country':return specCountry(id);
  case 'city':return specCity(id);
  case 'place':return specPlace(id);
  case 'setup':return specSetup(id);
  }
  return null;
}
function specSetup(sid){
  const s=setupById(sid);if(!s)return null;
  const n=setupBrews(sid);
  const scale=(s.grindMin!=null&&s.grindMin!==''&&s.grindMax!=null&&s.grindMax!=='')?`${s.grindMin}–${s.grindMax}${s.grindStep?` · step ${s.grindStep}`:''}`:'';
  return {
    eyebrow:'Setup'+(s.archived?' · retired':''),title:esc(s.name),qual:'',
    lede:'The assembly, and every brew read against it. A grind setting outside this page is a rumour.',
    rows:[['Grinder',regSubstance(s.grinder)?esc(s.grinder):'<span class="unread">unread</span>'],
      ['Brewer',regSubstance(s.brewer)?esc(s.brewer):'<span class="unread">unread</span>'],
      s.basket?['Basket',esc(s.basket)]:null,
      s.papers?['Papers',esc(s.papers)]:null,
      ['Water',regSubstance(s.water)?esc(s.water):'<span class="unread">unread</span>'],
      ['Grind scale',scale||'<span class="unread">unread</span>'],
      ['Brews',String(n)]].filter(Boolean),
    up:[],down:[],
    roadTail:'brewed on this Setup',
    extras:{tail:readOnly()?'':(s.archived
      ?`<button class="btn btn-quiet" onclick="retireSetup(${jsq(sid)})">Back in the rotation</button>
      <div class="muted small serif" style="font-style:italic;margin:6px 2px 0">A retired Setup leaves the picker; every brew read against it stays exactly as readable as it was.</div>`
      :'')},
    actPrimary:readOnly()?'':`<button class="btn btn-primary" onclick="openSetupForm(${jsq(sid)})">Amend the Setup</button>`,
    sealName:s.name,seal:'Grind is only comparable within one Setup.'
  };
}
function specPlace(shop){
  const e=regByName(shop);
  const mine=cafeCups().filter(c=>normName(c.shop)===normName(shop)).sort(byNew);
  const others=circleCups().filter(c=>normName(c.shop)===normName(shop)).sort(byNew);
  if(!e&&!mine.length&&!others.length)return null;
  const circleOn=circleSources().length>0;
  const p=circleProfile(shop)||e;
  const pal=palOf(p);
  const gs=scopeGreens('place',shop);
  const city=(e&&e.city)||modeOf([...mine,...others].map(c=>c.city).filter(Boolean))||'';
  const nbhood=(p&&p.neighborhood)||'';
  const theirAvg=avgHedonic(others);
  const fav=isCafeFav(shop);
  const d=depth();
  // ── identity rows — the facts of the place, never the grab-bag ──
  const rows=[
    ['City',regSubstance(city)?esc(city):'<span class="unread">unread</span>'],
    ['Neighbourhood',regSubstance(nbhood)?esc(nbhood):'<span class="unread">unread</span>'],
    ['Greens poured',String(gs.length)],
    ['Your cups here',mine.length?String(mine.length):'none yet'],
    ['Hands poured',handsIn(gs).map(r=>esc(roasterName(r))).join(' · ')||'<span class="unread">unread</span>'],
    theirAvg?[circleOn?'The circle says':'The register says',`${theirAvg} avg · ${esc(nPl(others.length,'cup'))}`]:null,
    (p&&p.address)?['Address',`${esc(p.address)}${p.lat!=null?` <a class="link" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}" target="_blank" rel="noopener">Open in Maps ↗</a>`:''}`]:null,
    (e&&e.firstBy)?['Register',`first entered by ${esc(e.firstBy)}${e.firstAt?` · ${fmtMY(e.firstAt)}`:''}`]:null
  ].filter(Boolean);
  const signedLine=e?`<div style="display:flex;align-items:center;gap:9px;margin:-6px 0 14px;flex-wrap:wrap">
    ${entSigned('cafe',shop)?`${exBtn('signed','signed','badge')}<span class="muted" style="font-size:12px">first-party · ${esc(shop)} holds the pen</span>`
      :`${exBtn('unclaimed','unclaimed','badge ghost')}<span class="muted" style="font-size:12px">compiled from sightings</span>`}</div>`:'';
  // the matching, on the page — a score never travels without its signals. Not for
  // a place that IS the signal: you keep it, or you named it.
  const named=signalPicks().some(pk=>normName(pk.name)===normName(shop));
  const mm=(!mine.length&&!named&&!coldNow())?matchOf(shop):null;
  const sk=skipInfo(shop),lc=lowConf();
  const skState=sk&&sk.active?`<div class="cafeback">Skipped — it steps back for two weeks, then fades on its own. Never a veto.${skipAsk&&normName(skipAsk.shop)===normName(shop)?`<div style="display:flex;gap:16px;margin:8px 0 2px;align-items:baseline;flex-wrap:wrap"><button class="text-action" onclick="resolveSkipAsk(false)">Just this place</button><button class="text-action" onclick="resolveSkipAsk(true)">Fewer ${esc(skipAsk.kind)} places</button></div>`:''} ${readOnly()?'':`<a class="link" onclick="discUnskip(${jsq(shop)})">undo</a>`}</div>`:'';
  const whyHTML=mm&&!mm.thin?`
  <div class="section-head"><h2>Why this</h2><span class="n-note num">${lc?`an early read — ${cafeCups().length} of 3 cups kept`:`${mm.score} / 100`}</span></div>
  <div class="finding" style="margin:0 0 10px">${esc(mm.why)}</div>
  ${mm.signals.length?`<div class="card">${mm.signals.map(sg=>`<div class="kv"><span class="k">${esc(sg.label)}</span><span class="v" style="font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-2)">${esc(sg.from||'')}</span></div>`).join('')}</div>`:''}
  <div class="muted small serif" style="font-style:italic;margin:0 2px 10px">${lc
    ?'Built from the three you named. Only kept cups end the early read — numbers arrive at your third.'
    :`Built from the places you keep and ${cafeCups().length} cups out. Skips are remembered too, and fade.`}</div>`:'';
  const roaster=modeOf(mine.map(cupRoaster).filter(Boolean));
  const origin=modeOf(mine.map(c=>{const o=lotRead(c);return o.origin||o.country}).filter(Boolean));
  const x=LEGACY_ON&&(roaster||origin)?crossContext({roaster,origin}):null;
  const postHeight=`${skState}${whyHTML}
  ${x&&x.home.n&&x.cafe.n?`<div class="cafeback">Same beans, two rooms: you average <strong>${x.home.avg}</strong> at home vs <strong>${x.cafe.avg}</strong> here${roaster?` on ${esc(roaster)}`:''}. The shape of a preference, not a verdict.</div>`:''}
  ${p&&p.notes?`<div class="muted small serif" style="font-style:italic;margin:0 2px 10px">"${esc(p.notes)}"</div>`:''}
  ${p&&p.tags&&p.tags.length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 10px">${p.tags.map(t=>`<span class="badge ghost">${esc(t)}</span>`).join('')}</div>`:''}`;
  const tail=`${readOnly()?'':`
  ${!mine.length?`<button class="btn btn-quiet" onclick="toggleWant(${jsq(shop)});render()">${isWant(shop)?'Saved — it waits under Want to go':'Save for later'}</button>`:''}
  ${!mine.length&&!(sk&&sk.active)?`<button class="btn btn-quiet" onclick="discSkip(${jsq(shop)})">Skip — it steps back for two weeks</button>`:''}
  ${isAdmin()?`<button class="btn btn-quiet" onclick="openCafeProfile(${jsq(shop)})">${p&&(p.site||p.palette||p.accent||p.address||p.notes)?'Amend the entry':'Add café branding'}</button>
  ${e?`<button class="btn btn-quiet" onclick="openCorrectPlace(${jsq(shop)})">Correct the Register entry</button>`:''}`:''}
  ${mine.length?`<button class="btn btn-quiet" onclick="toggleCafeFav(${jsq(shop)})">${fav?'Remove from favorites':'Add to favorites'}</button>`:''}`}
  ${mine.length?`<div class="section-head"><h2>Your cups here</h2></div>
  ${mine.map(c=>cupRow(c)).join('')}`:''}
  <div class="section-head"><h2>${circleOn?'The circle here':'The register here'}</h2></div>
  ${others.length?others.map(feedRow).join('')
    :`<div class="empty">${circleOn?'No one you read has kept a cup here yet. Yours would be the first.':'Nothing on the register here yet. Yours would be the first.'}</div>`}
  ${claimBlock('cafe',shop,shop)}`;
  return {
    eyebrow:'Bar'+([nbhood,city].filter(regSubstance).length?' · '+esc([nbhood,city].filter(regSubstance).join(', ')):''),
    title:esc(shop),qual:'',
    lede:'The greens this counter has poured into the record, and how far the record follows each one.',
    rows,cups:mine,
    up:[{h:'Part of',items:[regSubstance(city)?rowlink('city',city,esc(city),'every bar and hand in it',esc(nPl(scopeGreens('city',city).length,'green'))):''].filter(Boolean)}],
    down:[],
    roadTail:'poured at this counter',
    extras:{postRes:signedLine+(p&&p.lat!=null?placeMapHTML(shop,p,pal):''),postHeight,tail},
    actPrimary:d>=2?`<button class="btn btn-primary" onclick="cafeHere(${jsq(shop)},${jsq(city||'')})">Remember a cup here</button>`:'',
    sealName:shop,seal:'A page that writes itself, cup by cup.'
  };
}
/* ═══ THE PARCEL AND THE HAND ═══════════════════════════════════════════════════
 * Finca El Paraíso is a place. Diego Samuel Bermúdez is a person. Konga washing
 * station is neither — it is a mill that gathers cherry from many of both. The record
 * has held all three apart on the spine since the grower split (6.15.0): the farm and
 * the hand are two `producers` nodes with different `producerKind`, the station is a
 * `processors` node, and every one of them carries its own edge onto the green. What
 * the SURFACES read back was one row — "Grower: Finca El Paraíso · Diego Samuel
 * Bermúdez" — which is the collapse the model was split to end, made again in ink.
 *
 * So the pages now say which is which, everywhere a producer appears: a FARM is a
 * parcel of land, a GROWER is the hand behind it (a person, a family, an association),
 * a STATION is a processor and never either. An actor the record cannot classify is a
 * PRODUCER and stays one — that is the same refusal the grain makes at every rung, and
 * for the same reason: an unmatched name buys no tier, so it must not be rounded into
 * the warmer word either.
 *
 * This is the structure the encyclopedic pass rests on. A farm has an altitude, a soil,
 * a set of parcels; a grower has a family, a history, other farms; a station has a
 * throughput and a season. None of those facts can be written down until the record
 * knows which of the three it is being told about. */
const prodKindLabel=k=>k==='station'?'washing station':k==='group'?'producer group'
  :k==='farm'?'farm':k==='smallholder'?'grower':'producer';
// a hand: a person, a family, an association. A farm is a place and a station is a mill,
// and neither is a hand — the whole point of keeping the three apart.
const PROD_HAND={smallholder:1,group:1};
const isFarmNode=p=>!!p&&p.producerKind==='farm';
const isHandNode=p=>!!p&&!!PROD_HAND[p.producerKind];
// what the row's second line says, so a producer is never nameless about its own kind
const prodKindLede=k=>k==='station'?'the station it passed through'
  :k==='group'?'the association behind it':k==='farm'?'the farm it grew on'
  :k==='smallholder'?'the hand behind it':'named on the record, its kind unread';
// the producer row — shared by the green, the region, the locality and the country pages
function prodRowlink(p){
  if(!p)return'';
  const n=scopeGreens('producer',p.id).length;
  return rowlink('producer',p.id,esc(p.name),esc([prodKindLabel(p.producerKind),p.region].filter(regSubstance).join(' · ')),esc(nPl(n,'green')));
}
// the same walk, pointed at the second origin actor — the station a green passed through
const stationsOf=gs=>[...new Set(gs.flatMap(l=>l.processorRefs||[]))].map(i=>catNode('processors',i)).filter(nodeLive);
/* a station is a processor, never a grower — specLot's law, applied at every scope now
   that the station has a page of its own. A producers node the door tagged a station (or
   one standing as a processor on the same greens) belongs in Its stations and nowhere
   else; listing it twice would read as two actors where the record holds one. */
function growersOf(gs){
  const stk=new Set(stationsOf(gs).map(p=>normPlace(p.name)));
  return [...new Set(gs.flatMap(l=>l.producerRefs||[]))].map(i=>catNode('producers',i))
    .filter(p=>nodeLive(p)&&p.producerKind!=='station'&&!stk.has(normPlace(p.name)));
}
// the same set, cut the way the record already holds it. growersOf stays the whole of
// the origin actors that are not the mill — these three name what each of them IS.
const farmsIn=gs=>growersOf(gs).filter(isFarmNode);
const handsOfLand=gs=>growersOf(gs).filter(isHandNode);
const unkindIn=gs=>growersOf(gs).filter(p=>!isFarmNode(p)&&!isHandNode(p));
/* the three sections a scope draws for its origin actors, in the order the coffee moves
   through them: the land, then the hands on it, then the ones the record has not been
   told enough about to place. A section with nothing in it is dropped by nodePage, so a
   record that only ever names farms reads exactly as it did before this split. */
const prodSections=gs=>[
  {h:farmsIn(gs).length===1?'Its farm':'Its farms',items:farmsIn(gs).map(prodRowlink)},
  {h:handsOfLand(gs).length===1?'Its grower':'Its growers',items:handsOfLand(gs).map(prodRowlink)},
  {h:'Named, unplaced',items:unkindIn(gs).map(prodRowlink)}
];
function procRowlink(p){
  if(!p)return'';
  const n=scopeGreens('processor',p.id).length;
  return rowlink('processor',p.id,esc(p.name),esc(['washing station',p.region].filter(regSubstance).join(' · ')),esc(nPl(n,'green')));
}
function specProducer(pid){
  const p=catNode('producers',pid);if(!p)return null;
  const gs=scopeGreens('producer',pid);
  const stn=p.producerKind==='station';
  const region=p.region||canonPlace(gs.map(l=>(l.fingerprint||{}).region))||'';
  const country=p.country||canonPlace(gs.map(l=>(l.fingerprint||{}).country))||'';
  const farm=isFarmNode(p),hand=isHandNode(p);
  /* THE OTHER SIDE OF THE SPLIT, derived and never stored. A green carries an edge to its
     farm AND an edge to its hand, so the hands on a farm are the hand-nodes on that farm's
     greens, and the farms a grower works are the farm-nodes on theirs. Neither is a new
     column: it is the same walk scopeGreens makes, read one step sideways — which is the
     whole reason the two were split into separate nodes rather than one field with a tag. */
  const across=growersOf(gs).filter(o=>o.id!==pid);
  const kin=farm?across.filter(isHandNode):hand?across.filter(isFarmNode):[];
  const kinH=farm?(kin.length===1?'The hand behind it':'The hands behind it')
    :(kin.length===1?'The land it grows on':'The land it grows on');
  return {
    eyebrow:(stn?'Washing station':p.producerKind==='group'?'Producer group':farm?'Farm':hand?'Grower':'Producer')
      +(regSubstance(country)?' · '+esc(country):''),
    title:esc(p.name),qual:'',
    lede:stn?'A station gathers cherry from many hands. Its greens stand apart here — never one blurred farm.'
      :p.producerKind==='group'?'A group pools many members’ cherry. Its greens stand apart here — the record never blurs them into one hand.'
      :farm?`A place. The greens the record traces to ${esc(p.name)}, each its own lot${kin.length?' — and the hands that worked it':''}.`
      :hand?`A hand. The greens the record traces to ${esc(p.name)}${kin.length?', and the land they were grown on':''} — a person is not a parcel, and this page is not the farm’s.`
      :`The greens the record traces to ${esc(p.name)}, each its own lot. What kind of actor this is has not been written down — the record will not guess it.`,
    rows:[['Kind',prodKindLabel(p.producerKind)],['Region',regSubstance(region)?esc(region):'<span class="unread">unread</span>'],
      ['Country',regSubstance(country)?esc(country):'<span class="unread">unread</span>'],['Greens',String(gs.length)]],
    rowsEx:['hands','Farm, grower, station'],
    up:[{h:'Part of',items:[
      regSubstance(region)?rowlink('region',region,esc(region),'the region around it',esc(nPl(scopeGreens('region',region).length,'green'))):'',
      regSubstance(country)?rowlink('country',country,esc(country),'the country above it',esc(nPl(scopeGreens('country',country).length,'green'))):''
    ].filter(Boolean)}],
    down:[{h:kinH,items:kin.map(prodRowlink)}],
    roadTail:farm?'grown on this farm':hand?'traced to this hand':'traced to this producer',
    terrHeading:'The heights it grows at',terrTail:'as each green was stated',
    extras:{tail:(farm||hand?`<div class="muted small serif" style="font-style:italic;margin:12px 2px 0">${
      farm?'A farm is a place — the parcel the cherry came off. Who worked it is a second fact, and it has its own page.'
        :'A grower is a hand — a person, a family, an association. Where they grew it is a second fact, and it has its own page.'
      }</div>`:'')
      +(isAdmin()?`<button class="text-action" style="margin-top:8px" onclick="openGeoFix('producers',${jsq(pid)})">Correct the pin${p.lat!=null?'':' — unplaced'}</button>`:'')},
    sealName:p.name,seal:farm?'A farm is a place. A grower is a hand.':'The grower owns the farm, never the roast.'
  };
}
/* the station's page. The processor has had a node on the spine since the door learned to
 * tell a finca from a washing station, and no page — so the one actor whose whole job is to
 * pool many growers' cherry was the one actor you could not walk to. It is a scope like any
 * other, and the page it inherits is the page every other kind gets. What it must never do
 * is read as a farm: the greens are listed apart, and the growers who deliver into it are
 * named as deliveries, never as one blurred producer. */
function specProcessor(pid){
  const p=catNode('processors',pid);if(!p)return null;
  const gs=scopeGreens('processor',pid);
  const region=p.region||canonPlace(gs.map(l=>(l.fingerprint||{}).region))||'';
  const country=p.country||canonPlace(gs.map(l=>(l.fingerprint||{}).country))||'';
  const fams=foldNames(gs.map(l=>{const f=(l.fingerprint||{}).process;return f&&f.family&&f.family!=='unspecified'?sentence(f.family):''}));
  return {
    eyebrow:'Washing station'+(regSubstance(country)?' · '+esc(country):''),
    title:esc(p.name),qual:'',
    lede:`Where these greens were processed. A station gathers cherry from many hands — what leaves it stays ${gs.length===1?'a lot of its own':'as many lots as arrived'}, never one blurred farm.`,
    rows:[['Kind','washing station'],['Region',regSubstance(region)?esc(region):'<span class="unread">unread</span>'],
      ['Country',regSubstance(country)?esc(country):'<span class="unread">unread</span>'],
      ['Process',fams.map(esc).join(' · ')||'<span class="unread">unread</span>'],
      ['Greens',String(gs.length)]],
    up:[{h:'Part of',items:[
      regSubstance(region)?rowlink('region',region,esc(region),'the region around it',esc(nPl(scopeGreens('region',region).length,'green'))):'',
      regSubstance(country)?rowlink('country',country,esc(country),'the country above it',esc(nPl(scopeGreens('country',country).length,'green'))):''
    ].filter(Boolean)}],
    // what delivers here, told apart: parcels of land, and the hands that work them
    down:[{h:farmsIn(gs).length===1?'The farm that delivers here':'The farms that deliver here',items:farmsIn(gs).map(prodRowlink)},
      {h:handsOfLand(gs).length===1?'The hand that delivers here':'The hands that deliver here',items:handsOfLand(gs).map(prodRowlink)},
      {h:'Named, unplaced',items:unkindIn(gs).map(prodRowlink)}],
    rowsEx:['hands','Farm, grower, station'],
    roadTail:'processed here',terrHeading:'The heights it processes',terrTail:'as each green was stated',
    extras:{tail:isAdmin()?`<button class="text-action" style="margin-top:8px" onclick="openGeoFix('processors',${jsq(pid)})">Correct the pin${p.lat!=null?'':' — unplaced'}</button>`:''},
    sealName:p.name,seal:'The station owns the processing, never the farm.'
  };
}
function specRegion(id){
  const gs=scopeGreens('region',id);
  if(!gs.length)return null;
  const country=canonPlace(gs.map(l=>(l.fingerprint||{}).country))||'';
  const procs=foldNames(gs.map(l=>{const f=(l.fingerprint||{}).process;return f&&f.family&&f.family!=='unspecified'?sentence(f.family):''}));
  return {
    eyebrow:'Region'+(regSubstance(country)?' · '+esc(country):''),title:esc(id),qual:'',
    lede:`The greens the record traces to ${esc(id)}, and how far it follows each one.`,
    rows:[['Country',regSubstance(country)?esc(country):'<span class="unread">unread</span>'],['Greens',String(gs.length)],
      ['Farms',String(farmsIn(gs).length)],['Growers',String(handsOfLand(gs).length)],
      ['Stations',String(stationsOf(gs).length)],
      ['Processes',procs.map(esc).join(' · ')||'<span class="unread">unread</span>']],
    rowsEx:['hands','Farm, grower, station'],
    up:[{h:'Part of',items:[regSubstance(country)?rowlink('country',country,esc(country),'the country above it',esc(nPl(scopeGreens('country',country).length,'green'))):''].filter(Boolean)}],
    down:[{h:'Its localities',items:foldPlaces(gs.map(l=>(l.fingerprint||{}).locality))
        .map(v=>rowlink('locality',v,esc(v),esc(id),esc(nPl(scopeGreens('locality',v).length,'green'))))},
      ...prodSections(gs),
      {h:'Its stations',items:stationsOf(gs).map(procRowlink)}],
    roadTail:'traced to '+id,
    sealName:id,seal:'A region is a scope, not a stamp.'
  };
}
/* the town's page — a region one rung down, inheriting the same five questions.
 * A derived scope like region and country: no stored node, no id, no polygon —
 * the greens naming it ARE the page, and its point on the plan is a centroid. */
function specLocality(id){
  const gs=scopeGreens('locality',id);
  if(!gs.length)return null;
  const region=canonPlace(gs.map(l=>(l.fingerprint||{}).region))||'';
  const country=canonPlace(gs.map(l=>(l.fingerprint||{}).country))||'';
  return {
    eyebrow:'Locality'+(regSubstance(country)?' · '+esc(country):''),title:esc(id),qual:'',
    lede:`The greens the record traces to ${esc(id)} — a town named, finer than its region, short of any one farm or mill.`,
    rows:[['Region',regSubstance(region)?esc(region):'<span class="unread">unread</span>'],
      ['Country',regSubstance(country)?esc(country):'<span class="unread">unread</span>'],
      ['Greens',String(gs.length)],['Farms',String(farmsIn(gs).length)],
      ['Growers',String(handsOfLand(gs).length)],['Stations',String(stationsOf(gs).length)]],
    rowsEx:['hands','Farm, grower, station'],
    up:[{h:'Part of',items:[
      regSubstance(region)?rowlink('region',region,esc(region),'the region around it',esc(nPl(scopeGreens('region',region).length,'green'))):'',
      regSubstance(country)?rowlink('country',country,esc(country),'the country above it',esc(nPl(scopeGreens('country',country).length,'green'))):''
    ].filter(Boolean)}],
    down:[...prodSections(gs),
      {h:'Its stations',items:stationsOf(gs).map(procRowlink)}],
    roadTail:'traced to '+id,
    sealName:id,seal:'A locality is a point, never a polygon.'
  };
}
function specCountry(id){
  const gs=scopeGreens('country',id);
  if(!gs.length)return null;
  const regs=foldPlaces(gs.map(l=>(l.fingerprint||{}).region));
  const vars=foldNames(gs.map(l=>l.variety));
  return {
    eyebrow:'Country',title:esc(id),qual:'',
    lede:`Every green the record traces to ${esc(id)} — and everyone who has carried one.`,
    rows:[['Regions',regs.map(esc).join(' · ')||'<span class="unread">unread</span>'],['Greens',String(gs.length)],
      ['Farms',String(farmsIn(gs).length)],['Growers',String(handsOfLand(gs).length)],
      ['Stations',String(stationsOf(gs).length)],
      ['Varieties',vars.map(esc).join(' · ')||'<span class="unread">unread</span>']],

const psNormTok=v=>(v||'').toString().toLowerCase().replace(/[^0-9a-z\/]/g,'');
function proposeLook(){
  if(guard())return;
  const name=val('ps_name'),originText=val('ps_origin'),process=val('ps_process'),idText=val('ps_id');
  if(!name&&!originText&&!idText){toast('Give it a name or an origin — something the chart can look for');return}
  const parts=originText.split(',').map(s=>s.trim()).filter(Boolean);
  const s={name,originText,originRegion:parts.length>1?parts[0]:'',originCountry:parts.length>1?parts[parts.length-1]:(parts[0]||''),process,id:idText};
  // rung one — a shared printed code binds outright

  if(tok){
    for(const L of catAll('lots')){
      if(!lotLive(L))continue;
      const hit=(L.hardIds||[]).some(h=>h&&!h.withdrawnAt&&tok.includes(psNormTok(h.value)));
      if(hit){m={kind:'hardid',lot:L,shared:[{k:'Shared id',v:idText}]};break}

    if(best&&bs>=TAU_PROP)m=best;

  // its process compatible and its geography agreeing. Still a question, never
  // a bind: propose-and-confirm asks. A name alone never qualifies.
  if(!m&&name&&name.trim().length>=3){
    const nn=name.trim().toLowerCase();
    const reg=(s.originRegion||'').toLowerCase(),ctry=(s.originCountry||'').toLowerCase();

      if(!lotLive(L))continue;
      const fp=L.fingerprint||{};const fam=fp.process&&fp.process.family;
      if(process&&fam&&fam!=='unspecified'&&fam.toLowerCase()!==process.toLowerCase())continue;
      if(!lotLabel(L).toLowerCase().includes(nn))continue;
      const shared=[{k:'Name',v:''}];let geo=false;
      if(reg&&(fp.region||'').toLowerCase().includes(reg)){shared.push({k:'Region',v:fp.region});geo=true}
      if(ctry&&(fp.country||'').toLowerCase()===ctry){shared.push({k:'Country',v:fp.country});geo=true}
      if(process&&fam&&fam.toLowerCase()===(process||'').toLowerCase())shared.push({k:'Process',v:fam});
      if(!geo)continue;

    }

  if(!m&&name&&process){
    const nn=name.toLowerCase();
    for(const L of catAll('lots')){
      if(!lotLive(L))continue;
      const fp=L.fingerprint||{};const fam=fp.process&&fp.process.family;
      const prod=(fp.producer||'').toLowerCase();

    }

    over='Not the same lot';claim='Same name is not the same lot.';
    body='This shares a name on the chart, but the process differs. A rebranded split, a rotating house name, a neighbouring parcel — same string, different coffee. CARTA won’t merge on a name alone.';
    diverge=`<div class="cafeback" style="margin:0 0 16px"><strong>The tell —</strong> process: ${esc(m.diverge.was)} on the chart, ${esc(m.diverge.now)} on this bag.</div>`;
    primary='File as a new lot';primaryCall=`proposeFork(${sArg})`;
    secondary='Actually the same — bind anyway';secondaryCall=`proposeBind(${sArg},${jsq(L.id)},true)`;
  }else{
    over='New to the chart';claim='Nothing like it on the chart yet.';
    body='No shared id, no fingerprint overlap. This files as a new lot and its road begins — a proposal that stands once a keeper approves it. Unread until it is read.';
    primary='File as a new lot';primaryCall=`proposeFork(${sArg})`;
    secondary='';secondaryCall='';
  }
  openSheet(`
  <div style="font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:${m.kind==='guard'?'var(--danger)':'var(--ink-3)'};font-weight:500;margin-bottom:7px">${esc(over)}</div>
  <h3>${esc(claim)}</h3>
  ${saw}${onChart}
  <p class="primer-b" style="max-width:39ch;margin-bottom:14px">${esc(body)}</p>
  ${diverge}
  <button class="btn btn-primary" onclick="${primaryCall}">${esc(primary)}</button>
  ${secondary?`<button class="btn btn-quiet" style="margin-top:8px" onclick="${secondaryCall}">${esc(secondary)}</button>`:''}
  <button class="text-action" style="display:block;margin:14px auto 2px" onclick="openProposeSighting()">Correct a fact</button>`);
}
// The authored line a sighting becomes — no bag, no cup; swept like any record.
function proposeRec(s){
  const rec={id:uid(),createdAt:new Date().toISOString(),sighting:true,curator:activeName(),
    roaster:'',name:s.name||'',originCountry:s.originCountry||'',originRegion:s.originRegion||'',
    producer:'',variety:'',process:s.process||'',lot:'',hardIds:[],origin:s.originText||''};
  const tok=(s.id||'').replace(/^\s*outturn\s*/i,'').trim();
  if(/^\d{2}\/\d{3,5}$/.test(tok))rec.hardIds=[{scheme:'kenya-outturn',value:tok}];
  D.authored=D.authored||[];D.authored.push(rec);
  return rec;
}
function proposeBind(sJson,lotId,onWord){
  if(guard())return;
  let s;try{s=JSON.parse(sJson)}catch(e){return}
  const cand=catNode('lots',lotId);if(!cand){closeSheet();toast('Gone.');return}
  const rec=proposeRec(s);
  bindRecordTo(rec,cand);
  save();closeSheet();
  toast(onWord?'Bound on your word. The correction is a signed line — a later one can supersede it.':'Bound to '+lotLabel(cand)+'. The sighting joins its road.');
  openLotPage(cand.id);
}
function proposeFork(sJson){
  if(guard())return;
  let s;try{s=JSON.parse(sJson)}catch(e){return}
  const rec=proposeRec(s);
  const o=recOrigin(rec),p=catStampProducer(o,activeName(),rec.createdAt);
  const n=catUpsert('lots','lot:'+rec.id,lotFields(o,p&&p.id),activeName(),{at:rec.createdAt});
  if(rec.hardIds.length&&typeof lotAddHardIds==='function')lotAddHardIds(n,rec.hardIds,activeName());
  setRef(rec,'lotRef',n);
  save();closeSheet();
  toast('Filed as a new lot. The road begins — unread until read.');
  openLotPage(n.id);
}

/* ============ sheet plumbing ============ */
function openSheet(html){const s=document.getElementById('sheet');
  s.innerHTML='<div class="grab" aria-hidden="true"></div>'+html;
  s.classList.remove('dragging');s.style.transform='';document.getElementById('sheetbg').style.opacity='';
  s.classList.add('open');document.getElementById('sheetbg').classList.add('open');
  s.scrollTop=0;}
function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('sheetbg').classList.remove('open');stopTimer(false)}

/* ============ the primers — how to read the record ============ */
/* Every mark explains itself one tap away. One map, term → {t,b}; the primer
 * sheet is its own layer so it stacks above any open sheet and closes back to
 * it. Add a term here and every ex(...) tap of it is wired for free. */
const PR={
  resolution:{t:'The grain',b:'How finely a coffee’s origin is proven — one spatial ladder, six rungs: country, region, locality, washing station, farm, green lot. A record rests on the coarsest rung it can prove and no finer. The grain is stated, never rounded up. Season is not a rung; the harvest is its own column.'},
  locality:{t:'Locality',b:'A town or municipality named — Pitalito under Huila, Gedeb town under Gedeb. One step finer than the region, short of any one farm or mill. It is geography, not an actor: a named mill still outranks it, because naming the mill proves at least the town it stands in. Typed, never parsed off a paste — a name the record cannot classify buys no rung.'},
  greenlot:{t:'Green lot',b:'Proven to the exact green lot — one parcel, one identity the trade bought and sold it under, printed as a lot name or a code the trade minted. The finest grain the ladder reaches.'},
  farm:{t:'Farm',b:'The trail proves to one grower’s parcel — a finca, an estate, a named farm. Finer than the mill it delivered to, short of a lot identity: the farm is named, the parcel it was sold under is not.'},
  station:{t:'Washing station',b:'The trail proves to a named mill and stops there. Many growers’ cherry, pooled and honestly indistinguishable past the wet mill — one station can stand for thousands of households. A legitimate terminal record, not a half-filled lot.'},
  region:{t:'Region',b:'The trail proves to a region and its country. Not a gap in the record; the record refusing to invent what the bag never carried.'},
  country:{t:'Country',b:'A country, and nothing under it yet — the coarsest honest grain. A named grower the record cannot classify buys no rung above this: an unmatched name is never guessed into a tier.'},
  caliber:{t:'Caliber',b:'A cup score never travels bare. A score enters the standing only through its source — a competition, an estate auction, a named cupper or lab. An unnamed number is on file as a claim, unverified, and it never prints as the score.'},
  standing:{t:'The standing',b:'What the coffee is in the world — caliber, rarity, traceability — compiled from sourced facts, never picked. It is not whether you’ll love it. That stays yours, on the overlay.'},
  altitude:{t:'The height it grew at',b:'Metres above sea level, as the record was told them. Height is a growing condition — slower cherry, denser bean — never a grade: the trade’s shorthand that higher is better is a shorthand, and this record does not repeat it. Nothing here sorts by it. A stated range draws as a band and a single figure as one line, because a lot sold as 1,800–1,900 m never said 1,850. It is the one origin fact continuous enough to read two greens on the same scale, which is why it earns a drawing — a section, beside the map’s plan. It is never part of a coffee’s identity, and never a pin: a height is not a place.'},
  placed:{t:'Placed',b:'The administrative ladder this green sits in, as somebody confirmed it on a map — the town, the region above it, the province above that, the country. It is a reading over the origin columns, never one of them: it does not make the green’s identity, it does not move the grain, and a green whose town was confirmed on a map has proved nothing more about the coffee than one whose keeper simply typed it. What it does is let two records spelling one place differently read as one place, and give a grower an honest pin without a second lookup. Two confirmations that disagree are both kept — the first stands and the other is carried beside it, the way two heights are.'},
  placefold:{t:'One place, however it was written',b:'A place word rarely arrives alone. A bag prints “Huila, Colombia”; one keeper types the town where another types the region; a third copies the line in capitals off the header. Those are one place, and the atlas folds them onto one page — by case and accents, by the run a bag printed them in, and by any spelling somebody has confirmed on the map. It folds nothing further: collapsing two words on a resemblance is a guess, and a page merged on a guess has no appeal. Nothing is rewritten to make the fold work — every green keeps the words its own record was given, and the page says which spellings it gathered.'},
  rarity:{t:'Rarity',b:'How much of it exists — bags landed, an auction price, a scarce variety, how narrowly it is carried. Scarcity stated as a fact, never as a countdown.'},
  outturn:{t:'The outturn',b:'Kenya sews an identifier into the bag: one cherry delivery, milled and graded into sibling lots — AA, AB, PB — under one outturn. Two records naming this code are the same green, outright.'},
  hands:{t:'One green, many hands',b:'The same green lot, bought by more than one roaster — each a different reading of one coffee. The page nothing else can render.'},
  published:{t:'The published atlas',b:'A copy of a shared record, taken on a date and stamped with a revision — not a live feed. It changes when the keeper publishes again, and until they do it says so rather than pretending to be current. What travels is the atlas: the greens, the hands, the bars, and the dated sightings of what poured where. No ledger travels — no cups, no brews, no bags. A pour publishes because it is a fact about the world; how it tasted never does.'},
  hold:{t:'A hold',b:'A green kept out of the published copy, and only out of the copy. The record keeps it whole — every page, every count, every reading unchanged — and one tap releases it into the next copy. Its roasts and its pours are held with it, because a green whose roasts are public and whose identity is not is a broken road, not a redaction. It draws faint on the founder’s own map: consent should be visible in the units it will be read in.'},
  ring:{t:'The ring',b:'Your overlay on the map — a ring around a mark you keep, added on top of a mark that was already complete without it. Never a fill and never a second colour: if kept-versus-not were the map’s main distinction, a stranger’s atlas would draw entirely faint, an atlas of absences. The ring comes off cleanly and what is left is the whole chart.'},
  shape:{t:'The shape of a preference',b:'Averages of your own 1–9 readings, split by where the cup was made — home against out, origin against origin. Enough readings and a through-line appears. It describes what you keep reaching for; it never tells you what to order.'},
  overlay:{t:'Your overlay',b:'The atlas is everyone’s: one shared page per coffee, compiled from sourced facts. Your scores, brews, and one honest line sit on top as a private wash — visible only to you, never averaged into the page. The spine stands without you.'},
  unread:{t:'Unread',b:'No admissible score exists yet, so no number prints. Unread is a state, never a verdict — and never a default to the low end. The row is the door to reading it.'},
  hedonic:{t:'The 1–9 reading',b:'A hedonic scale — how much you liked the cup, in front of you, at this moment. Nine is not perfection and one is not failure; it is preference, not grading. It never travels as a coffee’s caliber, and it is never averaged into the shared page. It is the truest thing you can keep, because it is only yours.'},
  fingerprint:{t:'Fingerprint',b:'Most bags carry no shared id, so identity is matched on a cluster of facts — producer or station, country and region, harvest, variety, process — never one field alone. CARTA finds the overlap and asks; it never merges on a name by itself. The cluster is the identity; you confirm it.'},
  propose:{t:'Propose and confirm',b:'The spine is curated, so a new sighting enters as a proposal. CARTA compiles a candidate from sourced facts and asks before it binds — confirm joins the existing road, reject forks a new one. The machine proposes; the keeper decides, and every binding is a signed line a later one can supersede.'},
  unclaimed:{t:'Unclaimed',b:'No one has signed this page yet. It stands anyway — compiled from sightings, true without permission. Unclaimed is a door, not a doubt: the record describes you before you arrive, and waits with the pen.'},
  signed:{t:'The signed page',b:'A page claimed by the hand it describes — a roaster on its own roast, a bar on its own pour. Signing buys three things and no more: the first-party rung, a monochrome mark, and the right to correct your own facts. It never touches the reader’s overlay, and the page was true before it was signed.'},
  firstparty:{t:'First-party',b:'The rung a signed page writes inside its own link — the strongest word on the facts that are truly yours. Scoped, never sovereign: outside your link your word is only stated, exactly like anyone’s. It is what keeps a signature from becoming a megaphone.'},
  scoped:{t:'Scoped authority',b:'Authority ends where your link does. The roaster owns the roast, never the farm; the bar owns the pour, never the road. The road is compiled from many hands and owned by none — which is the only way it stays true.'},
  documented:{t:'Documented',b:'A line carrying a public instrument — an outturn certificate, a co-op registry, an export licence, checkable by any reader. It outranks every rung, including the page’s own signer: a first party can supply a document, never outvote one.'},
  openschema:{t:'Open schema',b:'The export is one self-contained file — it opens and reads in full on a device that never synced, and carries its record in a documented layout any reader can open or move. No lock-in: the record is yours to keep and to leave with. It writes out your overlay — your readings, your brews, your cups — never the shared page’s compiled numbers, and never a figure without the protocol that earned it.'},
  divergence:{t:'Carried, not resolved',b:'Two standing lines can disagree — a roaster’s altitude against the station’s documented record. CARTA prints the stronger rung and keeps the other one tap deep, attributed. Flattening the trade’s disagreements would be a quiet lie; the record would rather show its seams.'},
  readback:{t:'The record, returned',b:'A record leaves as one file and returns whole — read back on any device, offline, no account required. What returns is the reader’s own overlay: readings, shelf, cups. It is read to you, never merged — never averaged into the shared page, which stood without it and stands after. What can be written out can be read back: the proof the schema is open, and the record truly yours.'},
  interlude:{t:'Reading the season',b:'Ask, and the atlas composes the season in front of you — the pins settle and a line is drawn through them, once, over about a second. It is a reading being composed, not a screen loading, and never a score revealed; the ember stays reserved. What it ranks is only ever your own taste — the coffees you keep reaching for, the places you keep — and it shows its reasons. Ask again and it composes again; it never plays on its own.'},
  setup:{t:'The Setup',b:'Grinder, brewer, and the scale your grind is read on. A grind number means one thing on your grinder and nothing on another — so grind lives inside a Setup and never travels between them. Name the Setup once and the dial is read against it, and only against it. The bag names the coffee; your own zero names the grind.'},
  door:{t:'The door',b:'One paste field, where six forms stood. Paste the roaster’s page or the back of the bag and CARTA reads it here, on the device — no key, no account, no network — against the same vocabularies the resolver already uses. You strike anything wrong, then bind it with one tap. Nothing is written before the bind, and a struck fact keeps its ink.'},
  road:{t:'The road',b:'Six stations — grown, processed, milled, roasted, poured, read. A filled mark is a station the record holds; a hollow one is a station it has not been told about, and the connector across a gap is dashed. The gap is the product: it is the record stating what it does not know, never a blank to fill. The count beneath says the same thing in words, with its denominator, so it need not be read off the marks. Read it as the record’s reach and nothing else — four of six is not a lesser coffee than six of six, it is a coffee the record has been told less about. Nothing here sorts by that count, and it never joins the standing.'},
  plate:{t:'A plate',b:'One facet of the atlas — a country, a process, a variety — read as a page. Its road is the aggregate: how many of the facet’s greens reach each station, so you can see exactly where the record goes dark. A facet is a query, never a collection, and a green that leaves the field unread is counted out loud, never quietly dropped.'},
  grain:{t:'Drawn to its grain',b:'A mark is drawn as coarsely as the record knows it. A filled mark sits at a street or a city — somewhere you could stand. A dashed, hollow mark is a region or a country centroid: honestly an area, never a farm pin invented. A node with no coordinate at all lists by name instead of lying. Correct a pin and every chart redraws — nothing sorts or ranks by grain.'},
  ground:{t:'The ground under a mark',b:'Two frames, two grounds. Where a coffee is carried, the marks are doors — a bar has an address — so streets can settle in behind them when the network answers. Where it grew, the marks are centroids: a region standing in for a point. A centroid drawn over a named road would read as an address, so no street is ever laid behind that frame. What it gets instead is the one ground as coarse as the mark itself — the country’s own outline, simplified and carried inside this file, so it draws with no network at all. Ground is there to orient the eye and nothing more: nothing on it taps, counts, sorts or ranks. A country the record has actually placed a green in is a different thing — it is a mark, drawn as its own shape, and it counts and taps like any other mark. Which of the two a country is gets decided by the record, never by the drawing. A country whose shape the file does not hold is named in words rather than guessed at. It is a drawing, not an adjudication — CARTA keeps coffee’s record, not the world’s borders.'},
  regions:{t:'A region is not a small country',b:'The two sit on one ladder and are opposite kinds of fact, so the map draws each by the thing the record actually holds. A country has a shape: drawn, closed, public domain, carried in this file. What it has no honest version of is a point — the centre of a country is a place no coffee is, and often not even land. So a green that proves only its country is drawn as that country’s outline. A region is the exact inverse. The record holds a point for it, roughly where the coffee grew, and no shape at all: coffee’s regions are sometimes an administrative department and sometimes a catchment nobody has ever drawn, so matching a region’s name to a polygon would be a guess, and this record does not guess. So a region draws as a point. That is why the plot looks the way it does — the shapes are the coarser claim and the points the finer one, which reads backwards until you know that the coarser claim is the one with the better drawing behind it. A region page also draws the other regions of its country as hairlines. They are there for scale, so a mark reads as somewhere in particular rather than a dot on an empty country. They are not counted in that page’s totals, never wear your ring and never fade for a hold — those say something about your own record, and a region drawn for scale is not in it.'},
  highlands:{t:'The highlands',b:'The dotted lines inside a country are contours — a thousand metres, two thousand, three. They are the shape of the land, cut from a public-domain elevation model at about five kilometres and carried in this file like the outlines, so they draw with no network at all. Weight rises with height because that is how a contour is read, and for no other reason. What they are not: a coffee’s stated height, which is the terrace lower down this page — that is a section, this is a plan, and the two answer different questions. Nor a grade. A mark inside the two-thousand line is not a finer coffee than a mark outside it; it is a coffee grown on higher ground, and the record does not sort, facet or rank by that. Where a frame is too wide for a contour to be a line rather than a smudge, none is drawn and the page says so.'},
  scene:{t:'Scenes and charts',b:'A scene is a cluster of roasters and bars close enough to move through in one outing — derived from the pins, never authored. A chart is one or more scenes under one name you give it. Membership follows the coordinates at read time: fix a pin and the chart corrects itself; a stored tag would only rot. The chart frame holds the ground you can walk; where the green came from keeps its own frame, at its own grain, joined in words — a sea route is not a line on a map.'},
  hands:{t:'Farm, grower, station',b:'Three actors stand between the seed and the sack, and the record keeps them apart because they are not the same kind of thing. A farm is a place — a parcel of land, with a height, a soil and a name that is often the one printed on the bag. A grower is a hand: the person, the family or the association who worked it. A washing station is a mill, and it is neither — it gathers cherry from many hands and many parcels, so what leaves it is as many lots as arrived, never one blurred producer. One coffee can name all three, and each of them gets its own page: the farm page reads the hands that worked it, the grower page reads the land they grew on, the station page reads everyone who delivers there. Where the record has been given a name but nothing that says which of the three it is, it stays a producer and says so. An unmatched name buys no tier here for the same reason it buys no rung on the grain: rounding a guess up is how a record starts inventing.'},
  founderpen:{t:'The founder’s pen',b:'While the atlas settles, the shared record — the atlas and the Register — is kept by one pen: the founder’s. Everyone reads everything; everyone writes their own ledger, always. What waits is only the shared page. When the moderation ceremony ships, proposals stand for every keeper again — nothing here is taken away for good.'}
};
function openPrimer(key){
  const p=PR[key];if(!p)return;
  const el=document.getElementById('primer');
  el.innerHTML=`<div class="grab" aria-hidden="true"></div>
  <div class="primer-over">How to read the record</div>
  <h3>${esc(p.t)}</h3>
  <p class="primer-b">${esc(p.b)}</p>
  <button class="btn btn-quiet" onclick="closePrimer()">Read on</button>`;
  el.classList.add('open');document.getElementById('primerbg').classList.add('open');
  el.scrollTop=0;
}
function closePrimer(){document.getElementById('primer').classList.remove('open');document.getElementById('primerbg').classList.remove('open')}
// a dotted primer tap — chip/badge/text — that never triggers the row beneath it
const exBtn=(key,label,cls)=>`<button class="${cls||'chip'} ex" onclick="event.stopPropagation();openPrimer(${jsq(key)})">${esc(label)}</button>`;

/* ============ sheet drag-to-dismiss ============ *
 * The grab handle (and the sheet body when scrolled to the top) can be pulled
 * down to dismiss. Follow the finger; on release, snap closed if dragged far
 * enough or flicked quickly, otherwise snap back. Tapping the backdrop still
 * works too — this just makes the handle behave like a real handle.          */
(function initSheetDrag(){
  const sheet=document.getElementById('sheet');
  const bg=document.getElementById('sheetbg');
  let startY=0,dy=0,active=false,dragging=false,startT=0;
  const yOf=e=>e.touches?e.touches[0].clientY:e.clientY;
  const onGrab=e=>!!(e.target.closest&&e.target.closest('.grab'));

  function down(e){
    if(!sheet.classList.contains('open'))return;
    // Only begin a dismiss-drag from the handle, or from the body when the
    // sheet is already scrolled to the top — otherwise let content scroll.
    if(!onGrab(e)&&sheet.scrollTop>0)return;
    active=true;dragging=false;dy=0;startY=yOf(e);startT=Date.now();
  }
  function move(e){
    if(!active)return;
    dy=yOf(e)-startY;
    if(dy<=0){ // pulling up: hand control back to native scroll
      if(dragging){sheet.classList.remove('dragging');sheet.style.transform='';bg.style.opacity='';}
      dragging=false;dy=0;return;
    }
    dragging=true;
    sheet.classList.add('dragging');
    if(e.cancelable)e.preventDefault(); // suppress native scroll while pulling down
    sheet.style.transform=`translateX(-50%) translateY(${dy}px)`;
    bg.style.opacity=String(Math.max(0,1-dy/(sheet.offsetHeight||600)));
  }
  function up(){
    if(!active)return;
    active=false;
    const h=sheet.offsetHeight||600;
    const velocity=dy/Math.max(1,Date.now()-startT); // px per ms
    sheet.classList.remove('dragging'); // restore the snap transition
    if(dragging&&(dy>h*0.28||velocity>0.55)){
      sheet.style.transform='translateX(-50%) translateY(100%)';
      bg.style.opacity='';
      setTimeout(()=>{closeSheet();sheet.style.transform='';bg.style.opacity='';},300);
    }else{
      sheet.style.transform='';
      bg.style.opacity='';
    }
    dragging=false;dy=0;
  }

  sheet.addEventListener('touchstart',down,{passive:true});
  sheet.addEventListener('touchmove',move,{passive:false});
  sheet.addEventListener('touchend',up);
  sheet.addEventListener('touchcancel',up);
  sheet.addEventListener('mousedown',down);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
})();

const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const numv=id=>{const v=val(id);return v===''?null:Number(v)};

/* ============ dial component ============
 * A stepper you can drive three ways, so a wide range is never a wall of taps:
 *   · tap − / +           one step (fine)
 *   · press-and-hold      auto-repeats and accelerates — fly across 0–2000
 *   · tap the number      type an exact value (numeric keypad; m:ss for time)
 * opts: {kind:'time'} m:ss entry · {hint} scale caption top-right ·
 *       {corner} a control pinned top-right (the °C/°F toggle). */
const dialState={};
let editingDial=null,holdInt=null,holdTO=null;
function dial(id,label,unit,value,step,min,max,dp,opts){
  opts=opts||{};
  dialState[id]={v:value,step,min,max,dp:dp??(String(step).includes('.')?1:0),unit,kind:opts.kind||null};
  const corner=opts.corner?`<div class="dcorner">${opts.corner}</div>`:(opts.hint?`<div class="ticks">${opts.hint}</div>`:'');
  return `<div class="dial">${corner}<div class="l">${label}</div>
    <div class="v num tapedit" id="dv_${id}" onclick="editDial('${id}')">${fmtDial(id)}<span class="u">${unit}</span></div>
    <div class="ctl">
      <button type="button" onpointerdown="holdStart(event,'${id}',-1)">−</button>
      <button type="button" onpointerdown="holdStart(event,'${id}',1)">+</button>
    </div></div>`;
}
function fmtDial(id){const s=dialState[id];if(s.v==null)return '—';
  if(s.kind==='time')return fmtTime(s.v);
  return s.v.toFixed(s.dp).replace(/\.0+$/,'');}   // trim trailing zeros — whole numbers read clean
function unitSpan(id){return `<span class="u">${dialState[id].unit}</span>`}
function redrawDial(id){const el=document.getElementById('dv_'+id);if(el)el.innerHTML=fmtDial(id)+unitSpan(id)}
function setDial(id,v){const s=dialState[id];
  if(v==null||isNaN(v)){redrawDial(id);return}
  if(s.min!=null)v=Math.max(s.min,v); if(s.max!=null)v=Math.min(s.max,v);
  s.v=Number(v.toFixed(s.dp)); redrawDial(id);}
function nudge(id,dir,mult){const s=dialState[id];
  setDial(id,(s.v==null?(s.min??0):s.v)+dir*s.step*(mult||1));
  if(navigator.vibrate)navigator.vibrate(3);}
function holdStop(){if(holdTO){clearTimeout(holdTO);holdTO=null}if(holdInt){clearInterval(holdInt);holdInt=null}
  window.removeEventListener('pointerup',holdStop);window.removeEventListener('pointercancel',holdStop);}
function holdStart(e,id,dir){
  e.preventDefault();
  if(editingDial){const de=document.getElementById('de_'+editingDial);if(de)de.blur();}
  holdStop();
  nudge(id,dir);                                   // the tap itself is one step
  let n=0;
  holdTO=setTimeout(()=>{ holdInt=setInterval(()=>{ n++;
    const mult=n<10?1:n<20?4:n<35?10:25;           // ramp up the longer it's held
    nudge(id,dir,mult); },60); },320);             // brief pause first, so a tap stays a tap
  window.addEventListener('pointerup',holdStop);
