/* ============================================================================
 * CARTA — the token layer  (sub-brand of Quiet Matter)
 * ----------------------------------------------------------------------------
 * Carta was cut from Quiet Matter and has since grown a deliberate personality
 * the parent forbids — warm stock, an ember signal, editorial display type, a
 * colour per café. We keep that personality, but adopt Quiet Matter's TOKEN
 * ARCHITECTURE so the two systems stay mechanically compatible and QM's
 * structural fixes can still be pulled in. Charter: SUBBRAND.md.
 *
 * The structure, exactly as QM's static/qm.css:
 *   1. Inherited primitives   — values TRACKED against Quiet Matter, unchanged.
 *   2. Carta brand primitives — the sanctioned overrides (see SUBBRAND.md).
 *   3. Semantic roles         — QM-compatible names; every rule consumes ONLY
 *                               roles, never primitives (as QM does).
 *   4. Legacy aliases         — old flat names (--ink/--paper/--accent…) mapped
 *                               onto the roles, so existing rules keep working
 *                               unchanged. Migrate rules onto the role names
 *                               opportunistically, then delete these.
 *   5. Dusk                   — remaps ONLY the roles to the night primitives;
 *                               primitives never change (QM D1).
 * ========================================================================== */

:root{
  /* ── 1. Inherited primitives — tracked to Quiet Matter, values identical ──
     These already match QM byte-for-byte. Declaring them here makes the shared
     inheritance a RULE, not a coincidence. When QM moves one, move it here. */

  /* Type scale — the sanctioned steps 11/13/15/16/18. 1rem = 16px. */
  --s11:0.6875rem; --s13:0.8125rem; --s15:0.9375rem; --s16:1rem; --s18:1.125rem;
  /* Tracking + weights */
  --track-label:0.12em; --track-foot:0.04em;
  --w-regular:400; --w-medium:500; --w-semibold:600;
  /* Measures + touch minimum */
  --measure:37ch;
  --measure-editorial:56ch;
  --touch-min:44px;                 /* WCAG 2.5.5 */
  /* Faces — Spectral (interpretive) + Libre Franklin (operational), as QM. */
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'Libre Franklin',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;   /* Carta addition: code */

  /* ── 2. Carta brand primitives — the sanctioned sub-brand overrides ───────
     Documented departures from QM. See SUBBRAND.md §"Sanctioned overrides".
     Both the day (paper) and night (roast) ramps exist as fixed primitives;
     the theme block below only ever repoints ROLES between them. */

  /* Paper ramp — warm stock, warmer + darker than QM's #fafaf8 */
  --ca-paper-0:#f8f5ee;    /* lifted paper (card) */
  --ca-paper-50:#f2eee6;   /* the page — warm stock */
  --ca-paper-100:#e9e3d8;  /* sunk surface */
  --ca-paper-200:#ddd5c7;  /* opaque hairline */
  /* Ink ramp — roasted, warm brown-black (QM is neutral #1a1a1a) */
  --ca-ink-900:#241d18;    /* roasted ink — body */
  --ca-ink-600:#554a41;    /* operational */
  --ca-ink-450:#776b60;    /* subtle / footer — ≥4.5:1 on paper (≈ QM #6e6c6a) */
  --ca-ink-300:#b8b5b0;    /* disabled/placeholder only */
  /* Hairlines */
  --ca-line-ink:rgba(36,29,24,.13);
  --ca-line-paper:rgba(236,233,227,.14);
  /* The ember — Carta's one warm signal: current action and the cup's score.
     THE core break from QM, which admits no colour on customer surfaces. */
  --ca-ember:#a63f2b;
  --ca-ember-ink:#fffaf1;
  /* Functional destructive — always paired with a text label */
  --ca-danger:#8c3b34;

  /* Night ramp — "paper at night", warm off-black (QM night is #161513) */
  --ca-night-900:#171310;    /* page at night */
  --ca-night-800:#211b17;    /* card at night */
  --ca-night-700:#2d241f;    /* sunk surface at night */
  --ca-night-600:#342923;    /* opaque hairline at night */
  --ca-roastlight-100:#f0e9dd;   /* primary text on night */
  --ca-roastlight-300:#c8bcae;   /* secondary text on night */
  --ca-roastlight-500:#9f9183;   /* subtle text on night */
  --ca-roastlight-700:#5b574f;   /* disabled on night */
  --ca-ember-dusk:#e06b4f;   /* the ember, lifted for the dark surface */

  /* Shape — square by default; the one sanctioned rounding is 2px (chips/code) */
  --radius:0;
  --chipr:2px;

  /* ── 3. Semantic roles — QM-compatible. Rules consume ONLY these. ─────────── */
  --text-primary:var(--ca-ink-900);
  --text-secondary:var(--ca-ink-600);
  --text-subtle:var(--ca-ink-450);
  --text-disabled:var(--ca-ink-300);
  --text-on-fill:var(--ca-ember-ink);
  --surface-page:var(--ca-paper-50);
  --surface-card:var(--ca-paper-0);
  --surface-sunk:var(--ca-paper-100);
  --border-hairline:var(--ca-line-ink);
  --border-strong:var(--ca-ink-900);
  --border-control:var(--ca-ink-450);
  --link:var(--ca-ink-600);
  --link-hover:var(--ca-ink-900);
  --focus-ring:var(--ca-ink-900);
  --fill-strong:var(--ca-ink-900);
  --fill-strong-hover:var(--ca-ink-600);
  /* Carta-only roles — the sanctioned extensions QM has no equivalent for */
  --signal:var(--ca-ember);       /* action + score */
  --signal-ink:var(--ca-ember-ink);
  --status-danger:var(--ca-danger);

  /* ── 4. Legacy aliases — keep existing index.html rules working ───────────
     Old flat names now point at roles. Migrate rules onto the role names over
     time, then delete this block. Nothing else in the file needs to change. */
  --ink:var(--text-primary);
  --ink-2:var(--text-secondary);
  --ink-3:var(--text-subtle);
  --ink-d:var(--text-disabled);
  --paper:var(--surface-page);
  --paper-card:var(--surface-card);
  --paper-2:var(--surface-sunk);
  --paper-3:var(--ca-paper-200);     /* opaque hairline primitive */
  --line:var(--border-hairline);
  --line-2:var(--ca-paper-200);
  --line-strong:var(--border-strong);
  --accent:var(--signal);
  --accent-ink:var(--signal-ink);
  --danger:var(--status-danger);
}

/* ── 5. Dusk — "paper at night". Remaps ONLY roles to the night primitives;
   primitives never change (QM D1). Legacy aliases follow for free, because
   they point at the roles, not at the primitives. ─────────────────────────── */
html[data-theme="dusk"]{
  --text-primary:var(--ca-roastlight-100);
  --text-secondary:var(--ca-roastlight-300);
  --text-subtle:var(--ca-roastlight-500);
  --text-disabled:var(--ca-roastlight-700);
  --text-on-fill:var(--ca-night-900);
  --surface-page:var(--ca-night-900);
  --surface-card:var(--ca-night-800);
  --surface-sunk:var(--ca-night-700);
  --border-hairline:var(--ca-line-paper);
  --border-strong:var(--ca-roastlight-100);
  --border-control:var(--ca-roastlight-500);
  --link:var(--ca-roastlight-300);
  --link-hover:var(--ca-roastlight-100);
  --focus-ring:var(--ca-roastlight-100);
  --fill-strong:var(--ca-roastlight-100);
  --fill-strong-hover:var(--ca-roastlight-300);
  --signal:var(--ca-ember-dusk);
  --signal-ink:var(--ca-night-900);
  --line-2:var(--ca-night-700);      /* legacy alias override (opaque) */
  --paper-3:var(--ca-night-600);     /* legacy alias override (opaque) */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
/* The leaf (STREAMLINED.html) — the app is one 480px column framed like a page
   from a bound register: the column is the CARD, the ground behind it the PAGE.
   That figure/ground is what makes a .card read as sunk rather than as a box
   floating on nothing. On a phone the frame lands off-screen; on a desk it is
   the whole point. */
html{background:var(--surface-page)}
body{
  background:var(--surface-card);color:var(--ink);
  font-family:var(--serif);
  font-size:16px;line-height:1.5;
  max-width:480px;margin:0 auto;
  border-left:1px solid var(--line-2);border-right:1px solid var(--line-2);
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;
}
.num{font-family:var(--sans);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.sans{font-family:var(--sans)}

/* ===== header — the masthead of the leaf: the wordmark, the room, the door ===== */
header.app{
  background:var(--surface-card);color:var(--ink);
  padding:calc(16px + env(safe-area-inset-top)) 20px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  flex:none;z-index:20;border-bottom:1px solid var(--line);
}
header.app h1{font-family:var(--serif);font-size:var(--s16);letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--ink);line-height:1}
header.app .sub{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-3);margin-top:3px;display:block}
/* the door, always on the masthead — one way in, from anywhere */
.doorbtn{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:6px 11px;
  border:1px solid var(--line-strong);border-radius:var(--radius);background:none;color:var(--ink);
  font-family:var(--sans);font-size:var(--s11);letter-spacing:.06em}
.doorbtn:active{background:var(--paper-2)}
main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 20px 26px}

/* ===== section label ===== */
/* the section rule — a label under a hairline, the prototype's h3.sect. Every
   section on every screen wears the same one, so the page reads as a register. */
h2{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;
  color:var(--ink-3);font-weight:500;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2:first-child{margin-top:2px}

/* ═══ the display voice — the prototype's three type roles ═══
   .display  the screen's one big line, serif, its em set in italic
   .lede     the sentence under it, serif, at reading size
   .note     the aside after a block: a hairline, then the keeper's own voice */
.display{font-family:var(--serif);font-weight:600;font-size:1.625rem;line-height:1.12;letter-spacing:-.02em;
  color:var(--ink);margin:0 0 6px;text-wrap:balance;text-transform:none;border:0;padding:0}
.display em{font-style:italic;font-weight:400}
.lede{font-family:var(--serif);font-size:var(--s16);line-height:1.55;color:var(--ink-2);margin:0 0 14px}
.note{border-top:1px solid var(--line);padding-top:12px;margin:10px 0 4px;
  font-family:var(--serif);font-style:italic;font-size:var(--s13);color:var(--ink-3)}
.rowlink+.note,.agg+.note{border-top:0;padding-top:8px}
.back{display:inline-block;background:none;border:0;padding:0 0 12px;cursor:pointer;color:var(--ink-3);
  font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase}
.back:active{color:var(--ink)}
/* the row-link — the one navigation primitive: a title, its meta, and a rule */
.rowlink{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:12px 0;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rowlink:active{background:var(--paper-2)}
.rowlink .t{font-family:var(--serif);font-size:var(--s16);color:var(--ink)}
.rowlink .m{font-family:var(--sans);font-size:var(--s11);color:var(--ink-3);letter-spacing:.02em;line-height:1.5}
.rowlink .go{flex:none;color:var(--ink-3);font-family:var(--sans);font-size:var(--s11)}
.unread{font-style:italic;color:var(--ink-3)}
/* two actions side by side — the stacked-button margin has no business in a row */
.btnrow{display:flex;gap:8px;align-items:stretch}
.btnrow .btn,.btnrow .btn+.btn{margin-top:0;flex:1}

/* ===== card — sunk on the leaf, never lifted off it ===== */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer;transition:background .15s ease}
.card.tap:active{background:var(--paper-2)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.muted{color:var(--ink-3);font-family:var(--sans);font-size:13px}
.small{font-size:13px}
.serif{font-family:var(--serif)}
strong{font-family:var(--serif);font-weight:600;font-style:normal}

/* ===== chips (square, monochrome — weight/label carry meaning) ===== */
.chip{
  display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.02em;
  padding:2px 8px;border-radius:var(--chipr);background:var(--paper);
  border:1px solid var(--line);color:var(--ink-3);font-variant-numeric:tabular-nums;
}
.chip b{font-weight:500;color:var(--ink)}
.chip.window{border-color:var(--line-strong);color:var(--ink);font-weight:500}
.chip.resting{color:var(--ink-3)}
.chip.past{color:var(--ink-3);border-style:dashed}
/* selected is a firmer line and darker ink — never a fill. A filled chip reads
   as a badge of rank; a lens narrows, it does not rank (CHARTS.md). */
.chip.on{border-color:var(--line-strong);color:var(--ink)}
.chip.struck{color:var(--ink-3);text-decoration:line-through;opacity:.5}
.lens{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.lens .chip{cursor:pointer;padding:5px 11px}

/* ===== the road — six stations, honesty drawn (SURFACES.md) =====
   A filled mark is a station the record holds; a hollow one is a station it
   does not. The connector is solid between two held stations and dashed
   across a gap. The gap is the product — never a blank to fill. */
.road6{display:grid;grid-template-columns:repeat(6,1fr);align-items:start;margin:6px 0 4px;padding-top:6px}
.road6 .stn{display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;min-width:0}
.road6 .stn .bar{position:absolute;top:5px;left:calc(-50% + 7px);width:calc(100% - 14px);height:1px;background:var(--line-strong);opacity:.5}
.road6 .stn:first-child .bar{display:none}
.road6 .stn.gap .bar{background:none;height:0;border-top:1px dashed var(--ink-d);opacity:1}
.road6 .stn .mk{width:11px;height:11px;border:1px solid var(--line-strong);background:var(--paper-card);position:relative;z-index:1;flex:none}
.road6 .stn.held .mk{background:var(--line-strong)}
.road6 .stn.you .mk{background:var(--line-strong);box-shadow:0 0 0 2px var(--paper-card),0 0 0 3px var(--line-strong)}
.road6 .stn .lb{font-family:var(--sans);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:center;line-height:1.25}
.road6 .stn.held .lb{color:var(--ink-2)}
/* six cells across a phone: a long name reads to two lines and stops, its whole
   text on the mark; the page states it in full a line below. A third ragged line
   costs more legibility than the ellipsis does. */
.road6 .stn .who{font-family:var(--serif);font-size:11px;text-align:center;line-height:1.3;color:var(--ink);
  overflow-wrap:break-word;hyphens:auto;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.road6 .stn:not(.held) .who{color:var(--ink-d);font-style:italic}
@media (prefers-reduced-motion:no-preference){
  .road6.draw .stn{animation:stnIn .5s var(--mo-ease) both}
  .road6.draw .stn:nth-child(2){animation-delay:.07s}
  .road6.draw .stn:nth-child(3){animation-delay:.14s}
  .road6.draw .stn:nth-child(4){animation-delay:.21s}
  .road6.draw .stn:nth-child(5){animation-delay:.28s}
  .road6.draw .stn:nth-child(6){animation-delay:.35s}
  @keyframes stnIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
/* the aggregate road — the same six stations, counted across a plate's greens */
.aggrow{display:grid;grid-template-columns:84px 1fr 48px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.aggrow:last-child{border-bottom:0}
.aggrow .lb{font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.aggrow .track{height:9px;background:var(--paper-2);position:relative;overflow:hidden}
.aggrow .fill{position:absolute;inset:0 auto 0 0;background:var(--line-strong);opacity:.72}
.aggrow.thin .fill{opacity:.3}
.aggrow .ct{font-family:var(--sans);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.aggrow .fill{transition:width .82s var(--mo-ease)}}

/* ===== the terrace — the atlas's second projection =====
   The map is a plan: it answers WHERE a coffee came from. The terrace is a
   SECTION: it answers how high it sat. Drawn like a surveyor's level book —
   contour rules at a stated interval, and every mark placed against them.
   The geometry carries the honesty, not the caption: a stated RANGE draws as a
   band with two edges, a single stated figure as one rule. Nothing here widens
   a point or narrows a range, because a lot sold as 1,800–1,900 m never said
   1,850. Monochrome and unsorted — height is a growing condition, never a
   grade, so it never wears the ember and never ranks a thing. */
/* the label cuts its own rule, so it must be painted in whatever the terrace is standing on:
   the leaf on a page, the sheet's paper inside one (the grower's page is a sheet) */
.terr{margin:10px 0 2px;--terr-paper:var(--surface-card)}
.sheet .terr{--terr-paper:var(--surface-page)}
.terr .plot{position:relative;height:148px;margin-left:46px;border-left:1px solid var(--line-2)}
.terr i{position:absolute;left:0;right:0;display:block}
/* the contours — the ruled ground, dotted and light. Three weights carry the whole
   drawing: dotted is the ground, a hairline is another green, the sunk zone is this
   one. Dashed is not used here at all — in this app a dashed line means COARSE (the
   road's gap, a centroid pin), and a height another green actually stated is held. */
.terr .ct{border-top:1px dotted var(--line-2);opacity:.7}
.terr .ct span{position:absolute;right:calc(100% + 8px);top:-.68em;font-family:var(--sans);font-size:10px;
  letter-spacing:.04em;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
/* another green that states a height — placed, never ordered. The comparison set */
.terr .m0{right:34%;border-top:1px solid var(--ink-3);border-bottom:1px solid var(--ink-3);opacity:.55}
/* the subject — its band sunk into the section, exactly as a .card sinks into the leaf */
.terr .m1{background:var(--surface-sunk);border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong)}
.terr .m1::before{content:'';position:absolute;left:-5px;top:calc(50% - 4.5px);width:9px;height:9px;background:var(--line-strong)}
/* one figure, not a range: one rule and no zone — the drawing says which was stated */
.terr .m0.pt,.terr .m1.pt{border-bottom:0}
.terr .m1.pt{background:none;border-top-width:2px}
/* a green inside an aggregate span — solid, thin, unlabelled; the sentence carries the numbers */
.terr .m2{right:14%;border-top:1px solid var(--ink-3);border-bottom:1px solid var(--ink-3);opacity:.65}
.terr .m2.pt{border-bottom:0}
/* the value, cut into its own rule the way a dimension is labelled on a drawing */
.terr .val{position:absolute;right:0;top:calc(50% - .72em);padding-left:7px;background:var(--terr-paper);
  font-family:var(--serif);font-weight:600;font-size:11px;line-height:1.3;color:var(--ink);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
  .terr.draw i{animation:terrIn .55s var(--mo-ease) both}
  .terr.draw .m1{animation-delay:.1s}
  @keyframes terrIn{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:none}}
}
/* the door — the display voice, the fact chips, the binding rows, the readout */
.door-display,.sheet h3.door-display{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.12;letter-spacing:-.02em;color:var(--ink);margin:0 0 6px;text-wrap:balance}
.door-display em{font-style:italic;font-weight:400}
.door-back{display:inline-block;background:none;border:none;padding:2px 0 10px;cursor:pointer;color:var(--ink-3);font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.door-back:active{color:var(--ink)}
.doorchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--chipr);padding:5px 9px;background:var(--paper);color:var(--ink-2);font-family:var(--sans);font-size:11px;letter-spacing:.02em;cursor:pointer}
.doorchip .k{letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.doorchip b{font-weight:500;color:var(--ink)}
.doorchip .x{color:var(--ink-3);font-size:14px;line-height:1;padding-left:2px}
.doorchip.on{border-color:var(--line-strong)}
.doorchip.struck{opacity:.42}
.doorchip.struck b{text-decoration:line-through}
/* the resolution readout — the one line that teaches the whole model. The door
   states it before a bind; a green's page states the same thing about itself,
   so both wear the same component (.res is the name the prototype gives it). */
.doorres,.res{border:1px solid var(--line-strong);border-radius:var(--radius);padding:12px 14px;background:var(--paper);margin:4px 0 2px}
.doorres.thin,.res.thin{border-color:var(--line)}
.doorres .grain,.res .grain{font-family:var(--serif);font-size:var(--s18);font-weight:400;margin:0 0 3px}
.doorres.thin .grain,.res.thin .grain{color:var(--ink-3);font-style:italic}
.doorres .why,.res .why{font-family:var(--sans);font-size:var(--s13);color:var(--ink-2);margin:0;line-height:1.5}
.doormeter,.meter{display:flex;gap:3px;margin-top:10px}
.doormeter i,.meter i{height:3px;flex:1;background:var(--paper-2);display:block}
.doormeter i.on,.meter i.on{background:var(--line-strong)}
.stepdots{display:flex;gap:5px;align-items:center;margin:0 0 12px}
.stepdots i{width:5px;height:5px;border:1px solid var(--ink-d);display:block}
.stepdots i.on{background:var(--line-strong);border-color:var(--line-strong)}
.stepdots span{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-left:5px}

/* ===== buttons ===== */
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
/* Sentence case, not shouted. The prototype's buttons speak in the keeper's
   voice — "Open the green", not "OPEN THE GREEN" (VOICE.md). */
.btn{
  display:block;width:100%;text-align:center;min-height:44px;padding:11px 16px;border-radius:var(--radius);
  font-family:var(--sans);font-size:var(--s13);font-weight:400;letter-spacing:.02em;text-transform:none;
  transition:background .2s ease,color .2s ease,border-color .2s ease;
}
.btn.mini{min-height:32px;padding:5px 10px;font-size:var(--s11)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
.btn-primary:active{filter:brightness(.88)}
.btn-quiet{background:none;border:1px solid var(--line-strong);color:var(--ink)}
.btn-quiet:active{background:var(--paper-2)}
.btn-graphite{background:var(--ink);color:var(--accent-ink);border:1px solid var(--ink)}
.btn-graphite:active{background:var(--ink-2)}
.btn-danger{color:var(--danger);border:1px solid var(--danger);background:none}
.btn-danger:active{background:var(--paper-2)}
.btn+.btn{margin-top:8px}

/* ===== forms ===== */
label.f,div.f{display:block;margin-bottom:14px}
label.f span.l,div.f span.l{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;font-family:var(--serif);font-size:16px;padding:9px 0;
  border:none;border-bottom:1px solid var(--ink-3);border-radius:0;
  background:transparent;color:var(--ink);appearance:none;-webkit-appearance:none;
}
input::placeholder,textarea::placeholder{color:var(--ink-d);font-style:italic}
select{background:transparent}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ink)}
textarea{min-height:60px;resize:vertical;border:1px solid var(--line);padding:9px 11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}

/* ===== dial (the field-tool scale exception) ===== */
.dial{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-card);padding:9px 6px 11px;margin-bottom:10px;text-align:center;position:relative}
.dial .l{font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.dial .v{font-family:var(--sans);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15;margin:3px 0;color:var(--ink)}
.dial .v .u{font-family:var(--sans);font-size:12px;color:var(--ink-3);font-weight:400;margin-left:2px}
.dial .ctl{display:flex;justify-content:center;gap:6px}
.dial .ctl button{
  width:52px;height:34px;border:1px solid var(--line-strong);border-radius:var(--radius);background:transparent;
  font-size:20px;font-weight:400;color:var(--ink-2);
}
.dial .ctl button:active{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.dial .ticks{position:absolute;top:9px;right:11px;font-family:var(--sans);font-size:9px;color:var(--ink-3);letter-spacing:.06em}
.dial .v.tapedit{display:inline-block;cursor:text;border-bottom:1px dotted var(--ink-3)}
.dedit{width:2.7em;min-width:46px;max-width:88%;font-family:var(--sans);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;text-align:center;border:none;background:transparent;color:var(--ink);padding:0}
.dedit:focus{outline:none}
.dcorner{position:absolute;top:7px;right:7px;display:flex;gap:3px}
.dcorner .ut{font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.02em;padding:2px 6px;border:1px solid var(--line-strong);background:transparent;color:var(--ink-3);border-radius:var(--chipr);cursor:pointer}
.dcorner .ut.on{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.dialrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ===== hedonic ===== */
.hedonic{display:flex;gap:5px;justify-content:space-between;margin:6px 0 4px}
.hedonic button{
  flex:1;aspect-ratio:1/1.15;border:1px solid var(--line-strong);border-radius:var(--radius);background:transparent;
  font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink-2);max-width:46px;
}
.hedonic button.on{background:var(--ink);color:var(--accent-ink);border-color:var(--ink);font-weight:500}
.desc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.desc button{font-family:var(--sans);font-size:13px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:var(--chipr);background:transparent;color:var(--ink-2)}
.desc button.on{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}

/* ===== segmented ===== */
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.seg button{flex:1;padding:9px 4px;font-family:var(--sans);font-size:13px;background:transparent;color:var(--ink-2);border-right:1px solid var(--line-strong)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:var(--accent-ink)}

/* ===== timer (field-tool scale exception; flattened chrome) ===== */
.timer{background:var(--paper-2);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center;margin-bottom:12px}
.timer .t{font-family:var(--sans);font-size:40px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.timer .ctl{display:flex;gap:8px;margin-top:10px}
.timer .ctl button{flex:1;padding:11px;border-radius:var(--radius);border:1px solid var(--line-strong);color:var(--ink);font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.timer .ctl button.go{background:var(--ink);border-color:var(--ink);color:var(--accent-ink)}

/* ===== tab bar — typographic, no icons ===== */
/* three rooms, ruled apart like columns in a register */
nav.tabs{
  flex:none;background:var(--surface-card);display:grid;grid-template-columns:repeat(3,1fr);z-index:30;
  padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);
}
nav.tabs button{padding:13px 4px 15px;color:var(--ink-3);font-family:var(--sans);font-size:var(--s11);
  letter-spacing:var(--track-label);text-transform:uppercase;font-weight:400;min-height:44px;
  border-right:1px solid var(--line)}
nav.tabs button:last-child{border-right:0}
nav.tabs button .ic{display:none}
nav.tabs button.on{color:var(--ink);box-shadow:inset 0 2px 0 var(--ink)}

/* ===== the daily loop ===== */
.hero{padding:2px 0 16px}
/* the eyebrow is quiet — the ember stays reserved for the current action and
   the score (SUBBRAND.md); a label is neither. */
.eyebrow{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0 0 8px}
.hero h2{font-family:var(--serif);font-size:1.625rem;line-height:1.12;letter-spacing:-.02em;text-transform:none;color:var(--ink);font-weight:600;margin:0;max-width:none;text-wrap:balance;border:0;padding:0}
.hero h2 em{font-style:italic;font-weight:400}
.hero .origin{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-size:15px;margin-top:8px}
/* the café's own page — a gradient drawn from its derived hue (or a neutral roast
   tone, unread), never the app's ember: that signal stays reserved for the score. */
.cafe-banner{position:relative;overflow:hidden;border:1px solid var(--line);margin:2px 0 4px}
.cafe-banner .grad{width:100%;height:172px}
.cafe-banner .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,14,10,0) 32%,rgba(18,14,10,.74) 100%)}
.cafe-banner .bar{position:absolute;left:0;right:0;bottom:0;height:4px}
.cafe-banner .txt{position:absolute;left:16px;right:16px;bottom:15px;color:#fff}
.cafe-banner .txt h2{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.02;letter-spacing:-.02em;margin:0;color:#fff;text-transform:none;text-shadow:0 1px 14px rgba(0,0,0,.55)}
.cafe-banner .txt .city{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-top:6px;opacity:.92;text-shadow:0 1px 10px rgba(0,0,0,.6)}
/* the map — real lat/lon scaled to fit the box; a filled dot is a place you
   keep, a dashed one is not. The drawn plot is the floor: real streets (the
   street map section) fade in behind the pins when tiles can be fetched, and
   this plot simply stands when they can't. */
/* the plot's ruled ground — a chart's grid, not a picture of a map. It says
   "this is a drawing at a stated grain" before a single tile ever lands. */
.cafe-map{position:relative;height:110px;background:var(--paper);border:1px solid var(--line);margin-bottom:8px;overflow:hidden;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:34px 34px}
/* the plot's key — what a filled mark means, and what a dashed one admits */
.plotkey{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 2px 10px;font-family:var(--sans);font-size:var(--s11);color:var(--ink-3);align-items:center}
.cafe-map .pin{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--ink);cursor:pointer;transform:translate(-50%,-50%)}
.cafe-map .pin.unread{width:7px;height:7px;border:1px dashed var(--ink-3);background:none}
.cafe-map .pin .lbl{position:absolute;left:100%;top:50%;transform:translate(6px,-50%);font-family:var(--sans);font-size:11px;color:var(--ink);font-weight:500;white-space:nowrap}
.cafe-map .pin.unread .lbl{color:var(--ink-3);font-weight:400}
/* the map, read for you — ranked pins on the same decorative plot, drawn taller */
.cafe-map.tall{height:320px;border-radius:var(--radius)}
.cafe-map .pin.nn{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:10px;font-weight:600;color:var(--paper);border-radius:50%;transition:width .2s,height .2s}
.cafe-map .pin.nn.sel{width:28px;height:28px;font-size:11px}
.cafe-map .pin.nn.dashed{background:var(--paper);border:1px dashed var(--ink-3);color:var(--ink-3)}
.cafe-map .pin.nn.saved{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.cafe-map .pin.you{width:14px;height:14px;background:var(--paper);border:1.5px solid var(--accent);border-radius:50%}
.cafe-map .pin.you::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%)}
.cafe-map .pin .lbl.top{left:50%;top:auto;bottom:100%;transform:translate(-50%,-6px);font-weight:600}
/* the street layer — MapLibre over the plot; fades in only once tiles actually land */
.cafe-map .smap-live{position:absolute;inset:0;opacity:0;transition:opacity .45s ease}
.cafe-map .smap-live.in{opacity:1}
.cafe-map .smap-live .maplibregl-map{width:100%;height:100%}
.cafe-map .smap-live .lbl{text-shadow:0 0 2px var(--paper),0 1px 2px var(--paper),0 0 5px var(--paper)}
.cafe-map .maplibregl-ctrl-attrib{font-family:var(--sans)!important;font-size:9px!important;letter-spacing:.02em;background:color-mix(in srgb,var(--paper-card) 82%,transparent)!important;color:var(--ink-3)!important;padding:1px 6px}
.cafe-map .maplibregl-ctrl-attrib a{color:var(--ink-3)!important;text-decoration:none}
.cafe-map .maplibregl-ctrl-attrib-button{display:none!important}
.cafe-map .maplibregl-canvas{outline:none!important}
.cafe-map .maplibregl-cooperative-gesture-screen{font-family:var(--sans)!important;font-size:13px}
.cafe-map .pin.spot{width:13px;height:13px;background:var(--accent);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--accent)}
/* the atlas map — three monochrome marks, a lens never a fill: a coarse origin (hollow), a roaster's
   hand (filled dot), a bar (filled square). Ember stays reserved for the current action. */
.cafe-map .pin.origin{width:10px;height:10px;background:var(--paper);border:1.5px solid var(--ink-2);border-radius:50%}
.cafe-map .pin.roaster{width:9px;height:9px;background:var(--ink);border-radius:50%}
.cafe-map .pin.venue{width:9px;height:9px;background:var(--ink);border-radius:2px}
/* grain, rendered (CHARTS.md): a mark drawn as coarsely as the record knows it — a region or
   country centroid goes hollow and dashed, a street or city point stays filled. Monochrome, a
   lens never a rank. */
.cafe-map .pin.coarse{background:var(--paper);border-style:dashed}
.cafe-map .pin.roaster.coarse,.cafe-map .pin.venue.coarse{border:1.5px dashed var(--ink-2)}
/* a scene mark — an area, drawn as one mark that says so: hollow and dashed like every coarse
   fact, never a filled cluster badge pretending to be a location. Its counts ride the label and
   the chips. A merged mark is different — real pins the plot cannot separate, folded into one
   mark carrying a count rather than stacking labels. */
.cafe-map .pin.scene{width:14px;height:14px;background:var(--paper);border:1.5px dashed var(--ink-2);border-radius:3px}
.cafe-map .pin.merged{width:19px;height:19px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:10px;font-weight:600;border-radius:50%}
.cafe-map .atlas-edges{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.cafe-map .atlas-edges line{stroke:var(--ink-3);stroke-width:1;opacity:.5;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
.atlas-key{display:inline-block;width:9px;height:9px;vertical-align:middle;margin-right:3px}
.atlas-key.origin{background:var(--paper);border:1.5px solid var(--ink-2);border-radius:50%}
.atlas-key.roaster{background:var(--ink);border-radius:50%}
.atlas-key.venue{background:var(--ink);border-radius:2px}
.atlas-key.scene{background:var(--paper);border:1.5px dashed var(--ink-2);border-radius:2px}
.cafe-map .smap-note{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:9px;padding:8px 11px;background:color-mix(in srgb,var(--paper-card) 92%,transparent);border-top:1px solid var(--line);font-family:var(--sans);font-size:12px;color:var(--ink-2)}
.cafe-map .smap-note .dot{flex:none;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.cafe-map .smap-note .text-action{margin-left:auto;flex:none}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none;scroll-snap-align:start}
@media (prefers-reduced-motion: reduce){.cafe-map .pin.nn{transition:none}.cafe-map .smap-live{transition:none}}
.continuation{border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:15px 0;margin:2px 0 16px}
.continuation .score{font-family:var(--sans);font-size:46px;line-height:.9;color:var(--accent);font-weight:550;letter-spacing:-.05em}
.continuation .score small{font-size:12px;letter-spacing:.04em;color:var(--ink-3);font-weight:400}
.continuation .row>div:last-child{max-width:62%}

/* ===== motion charter =====
 * used more, moves less. Three durations, one shared ease-out; nothing
 * bounces, nothing pulses. Reduced motion is first-class: the media block
 * below stills everything to its end frame. */
:root{
  --mo-fast:130ms;        /* controls touched most — a chip, a dial: barely moves */
  --mo-base:230ms;        /* a screen settles, a sheet rises — the standard move */
  --mo-considered:820ms;  /* the one sanctioned moment — arrival, the interlude */
  --mo-ease:cubic-bezier(.22,.61,.36,1);
}
@keyframes ca-settle{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes ca-pins-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ca-draw{from{stroke-dashoffset:220}to{stroke-dashoffset:0}}
.ca-screen{animation:ca-settle var(--mo-base) var(--mo-ease) both}
/* the interlude — the one place the map pauses to compose itself */
.ca-season-line{fill:none;stroke:var(--ink-3);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.7;stroke-dasharray:220;stroke-dashoffset:0}
.ca-map.is-reading .ca-season-line{animation:ca-draw var(--mo-considered) var(--mo-ease) both}
.ca-map.is-reading .ca-pin-layer{animation:ca-pins-in var(--mo-considered) var(--mo-ease) both}
@media (prefers-reduced-motion:reduce){
  .ca-screen,.ca-map .ca-pin-layer{animation:none!important;opacity:1!important;transform:none!important}
  .ca-map .ca-season-line{animation:none!important;stroke-dashoffset:0!important}
  .sheet{transition:none}
}

/* the road — but five stations, never six. The sixth is Read, and Read is the
 * reader's own cups. An absent reader is not a gap in the record. (READER.md L7) */
function road(lot,forReader){
  const st=[
    {lb:'Grown',who:lot.growerKind==='station'?lot.region:lot.grower},
    {lb:'Processed',who:lot.growerKind==='station'?lot.grower:lot.process},
    {lb:'Milled',who:lot.mill},
    {lb:'Roasted',who:lot.hands.length>1?lot.hands.length+' hands':lot.hands[0]||''},
    {lb:'Poured',who:lot.bars.length>1?lot.bars.length+' bars':lot.bars[0]||''}
  ];
  if(!forReader)st.push({lb:'Read',who:'2 cups',you:true});
  let prev=true;
  const cells=st.map(s=>{const h=!!s.who;
    const cls='stn'+(h?' held':'')+(s.you&&h?' you':'')+((!h||!prev)?' gap':'');prev=h;
    return `<div class="${cls}"><span class="bar"></span><span class="mk"></span><span class="lb">${s.lb}</span><span class="who">${h?esc(s.who):'unread'}</span></div>`}).join('');
  return `<div class="road6" style="grid-template-columns:repeat(${st.length},1fr)">${cells}</div>`;
}
// the terrace — a section, not a plan. Unchanged for a reader: it is a reading.
function terrace(band,others){
  const all=[band,...others];
  let lo=Math.min(...all.map(b=>b[0])),hi=Math.max(...all.map(b=>b[1]));
  const step=(hi-lo)>1400?400:200;
  lo=Math.max(0,Math.floor(lo/step)*step-step);hi=Math.ceil(hi/step)*step+step;
  if(hi-lo<600){const m=(hi+lo)/2;lo=Math.floor((m-300)/step)*step;hi=Math.ceil((m+300)/step)*step}
  const pc=v=>(v-lo)/(hi-lo)*100, at=b=>`bottom:${pc(b[0]).toFixed(2)}%;height:${(pc(b[1])-pc(b[0])).toFixed(2)}%`;
  let rules='';
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step)rules+=`<i class="ct" style="bottom:${pc(v).toFixed(2)}%"><span>${comma(v)}</span></i>`;
  return `<div class="terr"><div class="plot">${rules}
    <i class="m1${band[0]===band[1]?' pt':''}" style="${at(band)}"><b class="val">${altLabel(band)}</b></i>
    ${others.map(b=>`<i class="m0${b[0]===b[1]?' pt':''}" style="${at(b)}"></i>`).join('')}</div></div>`;
}
const rowlink=(t,m,go)=>`<button class="rowlink" onclick="${go||''}"><span><span class="t">${t}</span><br><span class="m">${m}</span></span><span class="go">→</span></button>`;
const kv=(k,v)=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;
const back=t=>`<button class="back" onclick="S(${jsq(t[1])})">← ${t[0]}</button>`;
const hero=(eb,d,l)=>`<p class="eyebrow">${eb}</p><h2 class="display">${d}</h2>${l?`<p class="lede">${l}</p>`:''}`;
const seal=(n,em)=>`<div class="qm-seal">${n}<span class="em">${em}</span></div>`;
// the drawn plot, at the fidelity this prototype needs: the reader gets the same
// one a keeper does — real coordinates, coarse marks dashed, tiles an enhancement
function plot(marks,heading){
  return `<div style="border:1px solid var(--line);background:var(--surface-sunk);height:150px;position:relative;margin:8px 0 6px">
    ${marks.map(m=>`<span style="position:absolute;left:${m.x}%;top:${m.y}%;width:9px;height:9px;
      border:1px solid var(--line-strong);${m.coarse?'border-style:dashed;background:none':'background:var(--line-strong)'};
      transform:translate(-50%,-50%)"></span>
      <span style="position:absolute;left:${m.x}%;top:calc(${m.y}% + 9px);transform:translateX(-50%);
      font-family:var(--sans);font-size:9px;letter-spacing:.06em;color:var(--ink-3);white-space:nowrap">${esc(m.lb)}</span>`).join('')}
  </div><p class="note" style="border-top:0;padding-top:4px">${heading}</p>`;
}

    ${kv('Bars',`<span class="num">${F.bars.length}</span>`)}
    ${kv('Sightings',`<span class="num">61</span>`)}
    ${kv('Pours',`<span class="num">${p.reduce((n,l)=>n+l.bars.length,0)}</span> <span class="muted small">readings cut</span>`)}
    ${kv('Held back',`<span class="num">${held().length}</span>`)}
  </div>
  <button class="btn btn-primary" onclick="toast('Published. Revision ${F.rev+1}.')">Publish</button>
  <button class="btn btn-quiet" onclick="S('f2')">What you're holding back</button>
  <p class="note">A copy, not a switch. What you publish stands until you publish again.</p>
  <h2>The address</h2>
  <div class="card"><div style="font-family:var(--mono);font-size:12px;color:var(--ink-2);word-break:break-all">https://carta.quietmatter.co/#atlas=https://${esc(F.server)}</div></div>
  <p class="note">One link. No account, no install — it opens the atlas read-only and skips the welcome.</p>
  ${seal('Carta','Nothing leaves without a hand.')}`;
}

/* F2 — the held list. Additive, dated, reversible — the strike's grammar. */
function f2(){
  return `${back(['Publish','f1'])}
  ${hero('The pen','What you\'re holding back.','Held greens leave the published copy at the next publish. The record keeps them whole.')}
  ${held().map(l=>`<button class="rowlink" onclick="toast('Released — it rides the next publish.')"><span><span class="t">${esc(l.name)}</span><br><span class="m">held 4 July 2026 · and its ${l.hands.length} roast${l.hands.length===1?'':'s'}, and its ${l.bars.length} pour${l.bars.length===1?'':'s'}</span></span><span class="go">Release</span></button>`).join('')}
  <p class="note">A hold is a dated, signed entry, exactly like a strike — it only ever adds, so two of your devices land on the same answer without an order. Holding a green holds its roasts and its pours with it: a green whose roasts are public and whose identity is not is a broken road, not a redaction.</p>
  ${seal('Carta','Set down, never erased.')}`;
}

/* F3 — the hold, taken from the green's own corrections fold. In ink, never red. */
function f3(){
  const l=F.lots[0];
  return `${back(['A green','r2'])}
  ${hero('Corrections & identity',esc(l.name),'The fold a reader never sees.')}
  ${rowlink('Amend this green','Reopen its form.','')}
  ${rowlink('Merge or split','Two records of one green, or one record of two.','')}
  ${rowlink('Enter a standing','A score, with the protocol and the cupper that earned it.','')}
  ${rowlink('Hold this green back','It leaves the published copy at the next publish.',"toast('Held. It leaves at the next publish.')")}
  ${rowlink('Withdraw','Struck from the record. Reversible.','')}
  <p class="note">Holding is not withdrawing and not erasing. The record keeps it whole; readers simply never see it. Its roasts and its pours are held with it. In ink, never in red — red is spent once, on erase.</p>
  ${seal('Carta','One grammar for correcting anything.')}`;
}
