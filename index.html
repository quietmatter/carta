/* ============================================================================
 * CARTA — the token layer  (sub-brand of Quiet Matter)
 * ----------------------------------------------------------------------------
 * Carta was cut from Quiet Matter and has since grown a deliberate personality
 * the parent forbids — warm stock, an ember signal, editorial display type, a
 * colour per café. We keep that personality, but adopt Quiet Matter's TOKEN
 * ARCHITECTURE so the two systems stay mechanically compatible and QM's
 * structural fixes can still be pulled in. Charter: SUBBRAND.md.
 *
 * The structure, exactly as QM's static/qm.css:
 *   1. Inherited primitives   — values TRACKED against Quiet Matter, unchanged.
 *   2. Carta brand primitives — the sanctioned overrides (see SUBBRAND.md).
 *   3. Semantic roles         — QM-compatible names; every rule consumes ONLY
 *                               roles, never primitives (as QM does).
 *   4. Legacy aliases         — old flat names (--ink/--paper/--accent…) mapped
 *                               onto the roles, so existing rules keep working
 *                               unchanged. Migrate rules onto the role names
 *                               opportunistically, then delete these.
 *   5. Dusk                   — remaps ONLY the roles to the night primitives;
 *                               primitives never change (QM D1).
 * ========================================================================== */

:root{
  /* ── 1. Inherited primitives — tracked to Quiet Matter, values identical ──
     These already match QM byte-for-byte. Declaring them here makes the shared
     inheritance a RULE, not a coincidence. When QM moves one, move it here. */

  /* Type scale — the sanctioned steps 11/13/15/16/18. 1rem = 16px. */
  --s11:0.6875rem; --s13:0.8125rem; --s15:0.9375rem; --s16:1rem; --s18:1.125rem;
  /* Tracking + weights */
  --track-label:0.12em; --track-foot:0.04em;
  --w-regular:400; --w-medium:500; --w-semibold:600;
  /* Measures + touch minimum */
  --measure:37ch;
  --measure-editorial:56ch;
  --touch-min:44px;                 /* WCAG 2.5.5 */
  /* Faces — Spectral (interpretive) + Libre Franklin (operational), as QM. */
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'Libre Franklin',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;   /* Carta addition: code */

  /* ── 2. Carta brand primitives — the sanctioned sub-brand overrides ───────
     Documented departures from QM. See SUBBRAND.md §"Sanctioned overrides".
     Both the day (paper) and night (roast) ramps exist as fixed primitives;
     the theme block below only ever repoints ROLES between them. */

  /* Paper ramp — warm stock, warmer + darker than QM's #fafaf8 */
  --ca-paper-0:#f8f5ee;    /* lifted paper (card) */
  --ca-paper-50:#f2eee6;   /* the page — warm stock */
  --ca-paper-100:#e9e3d8;  /* sunk surface */
  --ca-paper-200:#ddd5c7;  /* opaque hairline */
  /* Ink ramp — roasted, warm brown-black (QM is neutral #1a1a1a) */
  --ca-ink-900:#241d18;    /* roasted ink — body */
  --ca-ink-600:#554a41;    /* operational */
  --ca-ink-450:#776b60;    /* subtle / footer — ≥4.5:1 on paper (≈ QM #6e6c6a) */
  --ca-ink-300:#b8b5b0;    /* disabled/placeholder only */
  /* Hairlines */
  --ca-line-ink:rgba(36,29,24,.13);
  --ca-line-paper:rgba(236,233,227,.14);
  /* The ember — Carta's one warm signal: current action and the cup's score.
     THE core break from QM, which admits no colour on customer surfaces. */
  --ca-ember:#a63f2b;
  --ca-ember-ink:#fffaf1;
  /* Functional destructive — always paired with a text label */
  --ca-danger:#8c3b34;

  /* Night ramp — "paper at night", warm off-black (QM night is #161513) */
  --ca-night-900:#171310;    /* page at night */
  --ca-night-800:#211b17;    /* card at night */
  --ca-night-700:#2d241f;    /* sunk surface at night */
  --ca-night-600:#342923;    /* opaque hairline at night */
  --ca-roastlight-100:#f0e9dd;   /* primary text on night */
  --ca-roastlight-300:#c8bcae;   /* secondary text on night */
  --ca-roastlight-500:#9f9183;   /* subtle text on night */
  --ca-roastlight-700:#5b574f;   /* disabled on night */
  --ca-ember-dusk:#e06b4f;   /* the ember, lifted for the dark surface */

  /* Shape — square by default; the one sanctioned rounding is 2px (chips/code) */
  --radius:0;
  --chipr:2px;

  /* ── 3. Semantic roles — QM-compatible. Rules consume ONLY these. ─────────── */
  --text-primary:var(--ca-ink-900);
  --text-secondary:var(--ca-ink-600);
  --text-subtle:var(--ca-ink-450);
  --text-disabled:var(--ca-ink-300);
  --text-on-fill:var(--ca-ember-ink);
  --surface-page:var(--ca-paper-50);
  --surface-card:var(--ca-paper-0);
  --surface-sunk:var(--ca-paper-100);
  --border-hairline:var(--ca-line-ink);
  --border-strong:var(--ca-ink-900);
  --border-control:var(--ca-ink-450);
  --link:var(--ca-ink-600);
  --link-hover:var(--ca-ink-900);
  --focus-ring:var(--ca-ink-900);
  --fill-strong:var(--ca-ink-900);
  --fill-strong-hover:var(--ca-ink-600);
  /* Carta-only roles — the sanctioned extensions QM has no equivalent for */
  --signal:var(--ca-ember);       /* action + score */
  --signal-ink:var(--ca-ember-ink);
  --status-danger:var(--ca-danger);

  /* ── 4. Legacy aliases — keep existing index.html rules working ───────────
     Old flat names now point at roles. Migrate rules onto the role names over
     time, then delete this block. Nothing else in the file needs to change. */
  --ink:var(--text-primary);
  --ink-2:var(--text-secondary);
  --ink-3:var(--text-subtle);
  --ink-d:var(--text-disabled);
  --paper:var(--surface-page);
  --paper-card:var(--surface-card);
  --paper-2:var(--surface-sunk);
  --paper-3:var(--ca-paper-200);     /* opaque hairline primitive */
  --line:var(--border-hairline);
  --line-2:var(--ca-paper-200);
  --line-strong:var(--border-strong);
  --accent:var(--signal);
  --accent-ink:var(--signal-ink);
  --danger:var(--status-danger);
}

/* ── 5. Dusk — "paper at night". Remaps ONLY roles to the night primitives;
   primitives never change (QM D1). Legacy aliases follow for free, because
   they point at the roles, not at the primitives. ─────────────────────────── */
html[data-theme="dusk"]{
  --text-primary:var(--ca-roastlight-100);
  --text-secondary:var(--ca-roastlight-300);
  --text-subtle:var(--ca-roastlight-500);
  --text-disabled:var(--ca-roastlight-700);
  --text-on-fill:var(--ca-night-900);
  --surface-page:var(--ca-night-900);
  --surface-card:var(--ca-night-800);
  --surface-sunk:var(--ca-night-700);
  --border-hairline:var(--ca-line-paper);
  --border-strong:var(--ca-roastlight-100);
  --border-control:var(--ca-roastlight-500);
  --link:var(--ca-roastlight-300);
  --link-hover:var(--ca-roastlight-100);
  --focus-ring:var(--ca-roastlight-100);
  --fill-strong:var(--ca-roastlight-100);
  --fill-strong-hover:var(--ca-roastlight-300);
  --signal:var(--ca-ember-dusk);
  --signal-ink:var(--ca-night-900);
  --line-2:var(--ca-night-700);      /* legacy alias override (opaque) */
  --paper-3:var(--ca-night-600);     /* legacy alias override (opaque) */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
/* The leaf (STREAMLINED.html) — the app is one 480px column framed like a page
   from a bound register: the column is the CARD, the ground behind it the PAGE.
   That figure/ground is what makes a .card read as sunk rather than as a box
   floating on nothing. On a phone the frame lands off-screen; on a desk it is
   the whole point.

   THE DOUBLE BORDER (STREAMLINED.html's .leaf, finally built). A bound register
   is not ruled once. The outer line is the edge of the sheet; the inner one, set
   five pixels in, is the ruled margin the page is written inside — the same
   figure the road, the terrace and the chart frame all draw at their own scale.
   Unlike the outer line it lands ON a phone, so the frame reads on every device
   rather than only on a desk. It is paper: pointer-events:none, above the screen
   so it is never scrolled off, and under the header, the bar and every sheet, so
   nothing that can be tapped is ever behind it. */
html{background:var(--surface-page)}
body{
  background:var(--surface-card);color:var(--ink);
  font-family:var(--serif);
  font-size:16px;line-height:1.5;
  max-width:480px;margin:0 auto;
  border:1px solid var(--line-2);
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
body::before{
  content:"";position:absolute;inset:5px;z-index:35;
  border:1px solid var(--border-hairline);pointer-events:none;
}
.num{font-family:var(--sans);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.sans{font-family:var(--sans)}

/* ===== header — the masthead of the leaf: the wordmark, the room, the door ===== */
header.app{
  background:var(--surface-card);color:var(--ink);
  padding:calc(16px + env(safe-area-inset-top)) 20px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  flex:none;z-index:20;border-bottom:1px solid var(--line);
}
header.app h1{font-family:var(--serif);font-size:var(--s16);letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--ink);line-height:1}
header.app .sub{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-3);margin-top:3px;display:block}
/* the door, always on the masthead — one way in, from anywhere */
.doorbtn{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:6px 11px;
  border:1px solid var(--line-strong);border-radius:var(--radius);background:none;color:var(--ink);
  font-family:var(--sans);font-size:var(--s11);letter-spacing:.06em}
.doorbtn:active{background:var(--paper-2)}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:20px 20px 26px;
  position:relative;z-index:1}

/* ═══ THE GROUND — the page rests on the place it is about ═══════════════════
   The same drawing the map section makes, ink withheld, pinned behind the whole
   scroll: streets where the scope stands on streets, the country's outline and
   its highlands where it does not. The cards ride over it; close them and the
   ground is simply there. It is paper in the strictest sense the file already
   means it — aria-hidden, pointer-events:none, not one mark on it — so nothing
   here can be tapped, counted or read as a record. See pageGroundHTML. */
#ground{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  contain:paint;opacity:.26}
html[data-theme="dusk"] #ground{opacity:.34}
#ground .ground-plot{position:absolute;inset:-1px}
#ground .plot-box{border:0;background:none;margin:0;width:100%;height:100%;overflow:hidden}
#ground .plot-box svg{width:100%;height:100%;display:block}
#ground .plot-box .smap-live{opacity:1}
/* the wash — the display, the lede and the road sit on open paper above the first
   card, so the ground is faded out from under them rather than read through them */
#ground::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,var(--surface-card) 0,var(--surface-card) 12%,color-mix(in srgb,var(--surface-card) 62%,transparent) 34%,transparent 64%)}
@media (prefers-reduced-motion:no-preference){
  #ground{animation:groundIn var(--mo-considered) var(--mo-ease) both}
  @keyframes groundIn{from{opacity:0}}
}

/* ===== section label ===== */
/* the section rule — a label under a hairline, the prototype's h3.sect. Every
   section on every screen wears the same one, so the page reads as a register. */
h2{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;
  color:var(--ink-3);font-weight:500;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2:first-child{margin-top:2px}

/* ═══ the display voice — the prototype's three type roles ═══
   .display  the screen's one big line, serif, its em set in italic
   .lede     the sentence under it, serif, at reading size
   .note     the aside after a block: a hairline, then the keeper's own voice */
.display{font-family:var(--serif);font-weight:600;font-size:1.625rem;line-height:1.12;letter-spacing:-.02em;
  color:var(--ink);margin:0 0 6px;text-wrap:balance;text-transform:none;border:0;padding:0}
.display em{font-style:italic;font-weight:400}
.lede{font-family:var(--serif);font-size:var(--s16);line-height:1.55;color:var(--ink-2);margin:0 0 14px}
.note{border-top:1px solid var(--line);padding-top:12px;margin:10px 0 4px;
  font-family:var(--serif);font-style:italic;font-size:var(--s13);color:var(--ink-3)}
.rowlink+.note,.agg+.note{border-top:0;padding-top:8px}
.back{display:inline-block;background:none;border:0;padding:0 0 12px;cursor:pointer;color:var(--ink-3);
  font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase}
.back:active{color:var(--ink)}
/* the row-link — the one navigation primitive: a title, its meta, and a rule */
.rowlink{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:12px 0;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rowlink:active{background:var(--paper-2)}
.rowlink .t{font-family:var(--serif);font-size:var(--s16);color:var(--ink)}
.rowlink .m{font-family:var(--sans);font-size:var(--s11);color:var(--ink-3);letter-spacing:.02em;line-height:1.5}
.rowlink .go{flex:none;color:var(--ink-3);font-family:var(--sans);font-size:var(--s11)}
.unread{font-style:italic;color:var(--ink-3)}
/* two actions side by side — the stacked-button margin has no business in a row */
.btnrow{display:flex;gap:8px;align-items:stretch}
.btnrow .btn,.btnrow .btn+.btn{margin-top:0;flex:1}

/* ===== card — sunk on the leaf, never lifted off it ===== */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer;transition:background .15s ease}
.card.tap:active{background:var(--paper-2)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.muted{color:var(--ink-3);font-family:var(--sans);font-size:13px}
.small{font-size:13px}
.serif{font-family:var(--serif)}
strong{font-family:var(--serif);font-weight:600;font-style:normal}

/* ===== chips (square, monochrome — weight/label carry meaning) ===== */
.chip{
  display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.02em;
  padding:2px 8px;border-radius:var(--chipr);background:var(--paper);
  border:1px solid var(--line);color:var(--ink-3);font-variant-numeric:tabular-nums;
}
.chip b{font-weight:500;color:var(--ink)}
.chip.window{border-color:var(--line-strong);color:var(--ink);font-weight:500}
.chip.resting{color:var(--ink-3)}
.chip.past{color:var(--ink-3);border-style:dashed}
/* selected is a firmer line and darker ink — never a fill. A filled chip reads
   as a badge of rank; a lens narrows, it does not rank (CHARTS.md). */
.chip.on{border-color:var(--line-strong);color:var(--ink)}
.chip.struck{color:var(--ink-3);text-decoration:line-through;opacity:.5}
.lens{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.lens .chip{cursor:pointer;padding:5px 11px}

/* ===== the road — six stations, honesty drawn (SURFACES.md) =====
   A filled mark is a station the record holds; a hollow one is a station it
   does not. The connector is solid between two held stations and dashed
   across a gap. The gap is the product — never a blank to fill. */
.road6{display:grid;grid-template-columns:repeat(var(--n,6),1fr);align-items:start;margin:6px 0 4px;padding-top:6px}
.road6 .stn{display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;min-width:0}
.road6 .stn .bar{position:absolute;top:5px;left:calc(-50% + 7px);width:calc(100% - 14px);height:1px;background:var(--line-strong);opacity:.5}
.road6 .stn:first-child .bar{display:none}
.road6 .stn.gap .bar{background:none;height:0;border-top:1px dashed var(--ink-d);opacity:1}
.road6 .stn .mk{width:11px;height:11px;border:1px solid var(--line-strong);background:var(--paper-card);position:relative;z-index:1;flex:none}
.road6 .stn.held .mk{background:var(--line-strong)}
.road6 .stn.you .mk{background:var(--line-strong);box-shadow:0 0 0 2px var(--paper-card),0 0 0 3px var(--line-strong)}
.road6 .stn .lb{font-family:var(--sans);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:center;line-height:1.25}
.road6 .stn.held .lb{color:var(--ink-2)}
/* six cells across a phone: a long name reads to two lines and stops, its whole
   text on the mark; the page states it in full a line below. A third ragged line
   costs more legibility than the ellipsis does. */
.road6 .stn .who{font-family:var(--serif);font-size:11px;text-align:center;line-height:1.3;color:var(--ink);
  overflow-wrap:break-word;hyphens:auto;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.road6 .stn:not(.held) .who{color:var(--ink-d);font-style:italic}
@media (prefers-reduced-motion:no-preference){
  .road6.draw .stn{animation:stnIn .5s var(--mo-ease) both}
  .road6.draw .stn:nth-child(2){animation-delay:.07s}
  .road6.draw .stn:nth-child(3){animation-delay:.14s}
  .road6.draw .stn:nth-child(4){animation-delay:.21s}
  .road6.draw .stn:nth-child(5){animation-delay:.28s}
  .road6.draw .stn:nth-child(6){animation-delay:.35s}
  @keyframes stnIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
/* the aggregate road — the same six stations, counted across a plate's greens */
.aggrow{display:grid;grid-template-columns:84px 1fr 48px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.aggrow:last-child{border-bottom:0}
.aggrow .lb{font-family:var(--sans);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.aggrow .track{height:9px;background:var(--paper-2);position:relative;overflow:hidden}
.aggrow .fill{position:absolute;inset:0 auto 0 0;background:var(--line-strong);opacity:.72}
.aggrow.thin .fill{opacity:.3}
.aggrow .ct{font-family:var(--sans);font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.aggrow .fill{transition:width .82s var(--mo-ease)}}

/* ===== the terrace — the atlas's second projection =====
   The map is a plan: it answers WHERE a coffee came from. The terrace is a
   SECTION: it answers how high it sat. Drawn like a surveyor's level book —
   contour rules at a stated interval, and every mark placed against them.
   The geometry carries the honesty, not the caption: a stated RANGE draws as a
   band with two edges, a single stated figure as one rule. Nothing here widens
   a point or narrows a range, because a lot sold as 1,800–1,900 m never said
   1,850. Monochrome and unsorted — height is a growing condition, never a
   grade, so it never wears the ember and never ranks a thing. */
/* the label cuts its own rule, so it must be painted in whatever the terrace is standing on:
   the leaf on a page, the sheet's paper inside one (the grower's page is a sheet) */
.terr{margin:10px 0 2px;--terr-paper:var(--surface-card)}
.sheet .terr{--terr-paper:var(--surface-page)}
.terr .plot{position:relative;height:148px;margin-left:46px;border-left:1px solid var(--line-2)}
.terr i{position:absolute;left:0;right:0;display:block}
/* the contours — the ruled ground, dotted and light. Three weights carry the whole
   drawing: dotted is the ground, a hairline is another green, the sunk zone is this
   one. Dashed is not used here at all — in this app a dashed line means COARSE (the
   road's gap, a centroid pin), and a height another green actually stated is held. */
.terr .ct{border-top:1px dotted var(--line-2);opacity:.7}
.terr .ct span{position:absolute;right:calc(100% + 8px);top:-.68em;font-family:var(--sans);font-size:10px;
  letter-spacing:.04em;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
/* another green that states a height — placed, never ordered. The comparison set */
.terr .m0{right:34%;border-top:1px solid var(--ink-3);border-bottom:1px solid var(--ink-3);opacity:.55}
/* the subject — its band sunk into the section, exactly as a .card sinks into the leaf */
.terr .m1{background:var(--surface-sunk);border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong)}
.terr .m1::before{content:'';position:absolute;left:-5px;top:calc(50% - 4.5px);width:9px;height:9px;background:var(--line-strong)}
/* one figure, not a range: one rule and no zone — the drawing says which was stated */
.terr .m0.pt,.terr .m1.pt{border-bottom:0}
.terr .m1.pt{background:none;border-top-width:2px}
/* a green inside an aggregate span — solid, thin, unlabelled; the sentence carries the numbers */
.terr .m2{right:14%;border-top:1px solid var(--ink-3);border-bottom:1px solid var(--ink-3);opacity:.65}
.terr .m2.pt{border-bottom:0}
/* the value, cut into its own rule the way a dimension is labelled on a drawing */
.terr .val{position:absolute;right:0;top:calc(50% - .72em);padding-left:7px;background:var(--terr-paper);
  font-family:var(--serif);font-weight:600;font-size:11px;line-height:1.3;color:var(--ink);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
  .terr.draw i{animation:terrIn .55s var(--mo-ease) both}
  .terr.draw .m1{animation-delay:.1s}
  @keyframes terrIn{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:none}}
}
/* ===== the plan — one map, every scope (MAPPING.md) =====
   Two frames, because one projection cannot hold a front door and a country.
   Monochrome throughout: a mark is a lens, never a rank, and the ember is
   never spent here. The ink says the grain, and only the grain:
     filled        the coordinate is as fine as the mark claims
     hollow        a centroid — a region, an area standing in for a point
     dashed        coarser still, and admitting it
     a square      a street address; a circle, a centroid; a dashed square, a scene
     a shape       a country — its outline IS the mark, because a shape is what the
                   record holds about a country and a point is what it does not
     a hairline    another region of the same country, drawn for scale, never counted
     a ring        your overlay — added, never subtracted */
.plot-box{border:1px solid var(--line);background:var(--paper);margin:4px 0 8px;position:relative;overflow:hidden}
.plot-box svg{display:block;width:100%;position:relative;z-index:1}
/* streets, as GROUND: the tiles sit UNDER the drawing, fitted to the frame the
   plot already computed, held back a little so the ink stays the record and the
   streets stay the paper. The drawing above them is unchanged — take the tiles
   away and nothing about the plot moves. */
.plot-box .smap-live{position:absolute;inset:0;z-index:0;opacity:0;transition:opacity .5s ease}
.plot-box .smap-live.in{opacity:.86}
/* a lens tap repaints the screen, but the ground under it did not move — so it
   arrives already there rather than announcing itself again. Used more, moves less. */
.plot-box .smap-live.now{transition:none}
/* once there is ground under them, the frame's own labels take a paper halo so
   they never have to compete with a street name for legibility */
.plot-box.streets .mk-lbl{fill:var(--ink-2);paint-order:stroke;stroke:var(--paper);
  stroke-width:2.6px;stroke-linejoin:round}
.plot-box.streets .mk-n{paint-order:normal;stroke:none}
/* the ground under the ORIGIN frame — the country's own outline, in the file. The
   chart frame gets streets because a bar has a door; a centroid has no door, so this
   frame gets the one ground as coarse as the mark above it. Paper, a hairline, and
   no pointer: it orients the eye and is never part of the record. */
.plot-box .land{fill:var(--surface-page);fill-opacity:.6;stroke:var(--line-2);stroke-width:1;
  stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
/* the highlands — 1,000 · 2,000 · 3,000 m. The terrace's grammar, turned on its side:
   DOTTED IS THE GROUND, so the belt is dotted and the roof, the smallest and rarest
   line on the page, closes to a hairline. Weight rises with height because that is how
   a contour map is read — never because higher is better. Monochrome, never the ember,
   and quieter than every mark drawn over it. */
.plot-box .topo{fill:none;stroke:var(--ink-3);stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.plot-box .topo.t1{stroke-width:.7;stroke-dasharray:1.4 2.4;opacity:.5}
.plot-box .topo.t2{stroke-width:.8;stroke-dasharray:2.6 2;opacity:.62}
.plot-box .topo.t3{stroke-width:.9;opacity:.72}
.plot-box .ed{stroke:var(--ink-3);stroke-width:1;opacity:.55;stroke-dasharray:2 2}
.plot-box g.mk{cursor:pointer}
.plot-box g.mk:active .mk-lbl,.plot-box g.mk.sel .mk-lbl{fill:var(--ink)}
.plot-box g.mk.sel .mk-lbl{font-weight:600}
.mk-venue{fill:var(--ink)}
.mk-roaster{fill:var(--ink)}
.mk-origin{fill:none;stroke:var(--ink-2);stroke-width:1.3}
.mk-origin.coarse{stroke:var(--ink-3);stroke-dasharray:2 2}
/* A COUNTRY THAT IS A MARK, not ground under one. The record holds a country's SHAPE
   and does not hold a meaningful point inside it — a country's centroid is a place no
   coffee is — so the shape carries the mark and the dot is retired. A region is the
   exact inverse: a point the record holds, an outline it must never guess. Promotion
   is decided by the record (originMarks), never by the drawing: an outline drawn only
   for context stays .land — paper, untappable, uncounted. */
.plot-box .mk-land{fill:var(--surface-page);fill-opacity:.9;stroke:var(--ink-2);stroke-width:1.3;
  stroke-linejoin:round;stroke-linecap:round}
/* the ring, on a shape. A ring is ADDED over a mark already complete without it, so on
   an outline it is the line doubled rather than a circle floated over the middle — the
   dot we just refused, come back wearing your overlay. Comes off as cleanly as the ring. */
.plot-box .mk-land-ring{fill:none;stroke:var(--ink);stroke-width:3.4;opacity:.15;stroke-linejoin:round}
/* A SIBLING — another region of the country already on this paper, drawn for scale.
   The terrace's middle weight, pointed at the plan: DOTTED IS THE GROUND, a HAIRLINE is
   another, the firm mark is this one. It is never counted in this scope and never wears
   the ring, but it is still a rowlink with a position — you can walk sideways to it. */
/* a country's name is written across its own outline, so it takes the paper halo the
   frame's labels take over streets — for the same reason, and it is the same rule: ink
   the reader has to pick out of another line is ink that did not say anything. */
.plot-box .mk-lbl.onland{paint-order:stroke;stroke:var(--paper);stroke-width:2.8px;stroke-linejoin:round}
.plot-box .mk-sib{fill:none;stroke:var(--ink-3);stroke-width:.9;opacity:.6}
.plot-box .mk-lbl.sib{fill:var(--ink-3);opacity:.72;font-size:8.5px}
.mk-scene{fill:none;stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:3 2}
.mk-merged{fill:var(--ink)}
.mk-n{fill:var(--paper);font-family:var(--sans);font-size:8px;font-weight:600}
.mk-lbl{font-family:var(--sans);font-size:9px;fill:var(--ink-3)}
.mk-lbl.near{fill:var(--ink-2)}
.mk-ring{fill:none;stroke:var(--ink);stroke-width:1}
.mk-held{opacity:.4}
.mapkey{display:flex;flex-wrap:wrap;gap:3px 14px;margin:0 2px 10px;font-family:var(--sans);
  font-size:var(--s11);color:var(--ink-3);align-items:center}
.mapkey span{display:inline-flex;align-items:center;gap:5px}
.mapkey svg{flex:none;overflow:visible}
/* the hand-off — the two frames are joined in words, never by a line across the sea */
.handoff{border-left:2px dashed var(--line-2);padding:9px 13px;margin:2px 0 16px;
  font-family:var(--serif);font-style:italic;font-size:var(--s13);color:var(--ink-3);max-width:44ch}
/* what has no coordinate lists rather than lies */
.listedbox{border:1px dashed var(--line-2);padding:10px 12px 4px;margin:0 0 12px}
.listedbox .lh{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);
  text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.listedbox .rowlink:last-of-type{border-bottom:none}
.foldout{border-left:2px solid var(--line-2);padding-left:10px;margin:-2px 0 12px}
.foldout .rowlink:last-of-type{border-bottom:none}
/* the walk up — derived from the node, never the stack, so a page reached by
   search is as navigable as one reached by drilling */
.crumb{display:flex;flex-wrap:wrap;gap:0 4px;align-items:baseline;margin:0 0 14px}
.crumb button{background:none;border:none;font-family:var(--sans);font-size:var(--s11);
  letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;padding:0;
  text-decoration:underline;text-underline-offset:3px;text-decoration-style:dotted}
.crumb button:active{color:var(--ink)}
.crumb i{color:var(--ink-3);font-style:normal;font-size:10px}
/* the prefill rail — what the record already holds, one tap to fill */
.sug{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sug .s{font-family:var(--sans);font-size:var(--s11);border:1px solid var(--line-2);
  border-radius:var(--chipr);background:none;color:var(--ink-2);padding:4px 8px;cursor:pointer}
.sug .s:active{border-color:var(--line-strong);color:var(--ink)}
.sug .s b{font-weight:400;color:var(--ink-3);margin-left:5px}
.sug .lb{font-family:var(--sans);font-size:var(--s11);color:var(--ink-3);align-self:center;margin-right:2px}
/* the map rail — the second rung of the same rail. What the record holds is offered firm; what
   the world holds sits below it in a dashed line, because it is a place the record has not been
   to yet and the drawing should say so before the keeper taps it. */
.sug.place{margin-top:4px;flex-direction:column;align-items:stretch;gap:4px}
.sug.place .lb{align-self:flex-start;margin:0 0 1px}
.sug.place .s{border-style:dashed;text-align:left;display:block;width:100%}
.sug.place .s .ch{display:block;font-size:var(--s11);color:var(--ink-3);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug.place .pl{font-family:var(--sans);font-size:var(--s11);color:var(--ink-2)}

/* the door — the display voice, the fact chips, the binding rows, the readout */
.door-display,.sheet h3.door-display{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.12;letter-spacing:-.02em;color:var(--ink);margin:0 0 6px;text-wrap:balance}
.door-display em{font-style:italic;font-weight:400}
.door-back{display:inline-block;background:none;border:none;padding:2px 0 10px;cursor:pointer;color:var(--ink-3);font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.door-back:active{color:var(--ink)}
.doorchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--chipr);padding:5px 9px;background:var(--paper);color:var(--ink-2);font-family:var(--sans);font-size:11px;letter-spacing:.02em;cursor:pointer}
.doorchip .k{letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.doorchip b{font-weight:500;color:var(--ink)}
.doorchip .x{color:var(--ink-3);font-size:14px;line-height:1;padding-left:2px}
.doorchip.on{border-color:var(--line-strong)}
.doorchip.struck{opacity:.42}
.doorchip.struck b{text-decoration:line-through}
/* the resolution readout — the one line that teaches the whole model. The door
   states it before a bind; a green's page states the same thing about itself,
   so both wear the same component (.res is the name the prototype gives it). */
.doorres,.res{border:1px solid var(--line-strong);border-radius:var(--radius);padding:12px 14px;background:var(--paper);margin:4px 0 2px}
.doorres.thin,.res.thin{border-color:var(--line)}
.doorres .grain,.res .grain{font-family:var(--serif);font-size:var(--s18);font-weight:400;margin:0 0 3px}
.doorres.thin .grain,.res.thin .grain{color:var(--ink-3);font-style:italic}
.doorres .why,.res .why{font-family:var(--sans);font-size:var(--s13);color:var(--ink-2);margin:0;line-height:1.5}
.doormeter,.meter{display:flex;gap:3px;margin-top:10px}
.doormeter i,.meter i{height:3px;flex:1;background:var(--paper-2);display:block}
.doormeter i.on,.meter i.on{background:var(--line-strong)}
.stepdots{display:flex;gap:5px;align-items:center;margin:0 0 12px}
.stepdots i{width:5px;height:5px;border:1px solid var(--ink-d);display:block}
.stepdots i.on{background:var(--line-strong);border-color:var(--line-strong)}
.stepdots span{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-left:5px}

/* ===== buttons ===== */
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
/* Sentence case, not shouted. The prototype's buttons speak in the keeper's
   voice — "Open the green", not "OPEN THE GREEN" (VOICE.md). */
.btn{
  display:block;width:100%;text-align:center;min-height:44px;padding:11px 16px;border-radius:var(--radius);
  font-family:var(--sans);font-size:var(--s13);font-weight:400;letter-spacing:.02em;text-transform:none;
  transition:background .2s ease,color .2s ease,border-color .2s ease;
}
.btn.mini{min-height:32px;padding:5px 10px;font-size:var(--s11)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
.btn-primary:active{filter:brightness(.88)}
.btn-quiet{background:none;border:1px solid var(--line-strong);color:var(--ink)}
.btn-quiet:active{background:var(--paper-2)}
.btn-graphite{background:var(--ink);color:var(--accent-ink);border:1px solid var(--ink)}
.btn-graphite:active{background:var(--ink-2)}
.btn-danger{color:var(--danger);border:1px solid var(--danger);background:none}
.btn-danger:active{background:var(--paper-2)}
.btn+.btn{margin-top:8px}

/* ===== forms ===== */
label.f,div.f{display:block;margin-bottom:14px}
label.f span.l,div.f span.l{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;font-family:var(--serif);font-size:16px;padding:9px 0;
  border:none;border-bottom:1px solid var(--ink-3);border-radius:0;
  background:transparent;color:var(--ink);appearance:none;-webkit-appearance:none;
}
input::placeholder,textarea::placeholder{color:var(--ink-d);font-style:italic}
select{background:transparent}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ink)}
textarea{min-height:60px;resize:vertical;border:1px solid var(--line);padding:9px 11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}

/* ===== dial (the field-tool scale exception) ===== */
.dial{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-card);padding:9px 6px 11px;margin-bottom:10px;text-align:center;position:relative}
.dial .l{font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.dial .v{font-family:var(--sans);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15;margin:3px 0;color:var(--ink)}
.dial .v .u{font-family:var(--sans);font-size:12px;color:var(--ink-3);font-weight:400;margin-left:2px}
.dial .ctl{display:flex;justify-content:center;gap:6px}
.dial .ctl button{
  width:52px;height:34px;border:1px solid var(--line-strong);border-radius:var(--radius);background:transparent;
  font-size:20px;font-weight:400;color:var(--ink-2);
}
.dial .ctl button:active{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.dial .ticks{position:absolute;top:9px;right:11px;font-family:var(--sans);font-size:9px;color:var(--ink-3);letter-spacing:.06em}
.dial .v.tapedit{display:inline-block;cursor:text;border-bottom:1px dotted var(--ink-3)}
.dedit{width:2.7em;min-width:46px;max-width:88%;font-family:var(--sans);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;text-align:center;border:none;background:transparent;color:var(--ink);padding:0}
.dedit:focus{outline:none}
.dcorner{position:absolute;top:7px;right:7px;display:flex;gap:3px}
.dcorner .ut{font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.02em;padding:2px 6px;border:1px solid var(--line-strong);background:transparent;color:var(--ink-3);border-radius:var(--chipr);cursor:pointer}
.dcorner .ut.on{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.dialrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ===== hedonic ===== */
.hedonic{display:flex;gap:5px;justify-content:space-between;margin:6px 0 4px}
.hedonic button{
  flex:1;aspect-ratio:1/1.15;border:1px solid var(--line-strong);border-radius:var(--radius);background:transparent;
  font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink-2);max-width:46px;
}
.hedonic button.on{background:var(--ink);color:var(--accent-ink);border-color:var(--ink);font-weight:500}
.desc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.desc button{font-family:var(--sans);font-size:13px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:var(--chipr);background:transparent;color:var(--ink-2)}
.desc button.on{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}

/* ===== segmented ===== */
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.seg button{flex:1;padding:9px 4px;font-family:var(--sans);font-size:13px;background:transparent;color:var(--ink-2);border-right:1px solid var(--line-strong)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:var(--accent-ink)}

/* ===== timer (field-tool scale exception; flattened chrome) ===== */
.timer{background:var(--paper-2);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center;margin-bottom:12px}
.timer .t{font-family:var(--sans);font-size:40px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.timer .ctl{display:flex;gap:8px;margin-top:10px}
.timer .ctl button{flex:1;padding:11px;border-radius:var(--radius);border:1px solid var(--line-strong);color:var(--ink);font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.timer .ctl button.go{background:var(--ink);border-color:var(--ink);color:var(--accent-ink)}

/* ===== tab bar — typographic, no icons ===== */
/* three rooms, ruled apart like columns in a register */
nav.tabs{
  flex:none;background:var(--surface-card);display:grid;grid-template-columns:repeat(3,1fr);z-index:30;
  padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);
}
nav.tabs button{padding:13px 4px 15px;color:var(--ink-3);font-family:var(--sans);font-size:var(--s11);
  letter-spacing:var(--track-label);text-transform:uppercase;font-weight:400;min-height:44px;
  border-right:1px solid var(--line)}
nav.tabs button:last-child{border-right:0}
nav.tabs button .ic{display:none}
nav.tabs button.on{color:var(--ink);box-shadow:inset 0 2px 0 var(--ink)}

/* ===== the daily loop ===== */
.hero{padding:2px 0 16px}
/* the eyebrow is quiet — the ember stays reserved for the current action and
   the score (SUBBRAND.md); a label is neither. */
.eyebrow{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0 0 8px}
.hero h2{font-family:var(--serif);font-size:1.625rem;line-height:1.12;letter-spacing:-.02em;text-transform:none;color:var(--ink);font-weight:600;margin:0;max-width:none;text-wrap:balance;border:0;padding:0}
.hero h2 em{font-style:italic;font-weight:400}
.hero .origin{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-size:15px;margin-top:8px}
/* the café's own page — a gradient drawn from its derived hue (or a neutral roast
   tone, unread), never the app's ember: that signal stays reserved for the score. */
/* the map — real lat/lon scaled to fit the box; a filled dot is a place you
   keep, a dashed one is not. The drawn plot is the floor: real streets (the
   street map section) fade in behind the pins when tiles can be fetched, and
   this plot simply stands when they can't. */
/* the plot's ruled ground — a chart's grid, not a picture of a map. It says
   "this is a drawing at a stated grain" before a single tile ever lands. */
.cafe-map{position:relative;height:110px;background:var(--paper);border:1px solid var(--line);margin-bottom:8px;overflow:hidden;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:34px 34px}
/* the plot's key — what a filled mark means, and what a dashed one admits */
.plotkey{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 2px 10px;font-family:var(--sans);font-size:var(--s11);color:var(--ink-3);align-items:center}
.cafe-map .pin{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--ink);cursor:pointer;transform:translate(-50%,-50%)}
.cafe-map .pin.unread{width:7px;height:7px;border:1px dashed var(--ink-3);background:none}
.cafe-map .pin .lbl{position:absolute;left:100%;top:50%;transform:translate(6px,-50%);font-family:var(--sans);font-size:11px;color:var(--ink);font-weight:500;white-space:nowrap}
.cafe-map .pin.unread .lbl{color:var(--ink-3);font-weight:400}
/* the map, read for you — ranked pins on the same decorative plot, drawn taller */
.cafe-map.tall{height:320px;border-radius:var(--radius)}
.cafe-map .pin.nn{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:10px;font-weight:600;color:var(--paper);border-radius:50%;transition:width .2s,height .2s}
.cafe-map .pin.nn.sel{width:28px;height:28px;font-size:11px}
.cafe-map .pin.nn.dashed{background:var(--paper);border:1px dashed var(--ink-3);color:var(--ink-3)}
.cafe-map .pin.nn.saved{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.cafe-map .pin.you{width:14px;height:14px;background:var(--paper);border:1.5px solid var(--accent);border-radius:50%}
.cafe-map .pin.you::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%)}
.cafe-map .pin .lbl.top{left:50%;top:auto;bottom:100%;transform:translate(-50%,-6px);font-weight:600}
/* the street layer — MapLibre over the plot; fades in only once tiles actually land */
.cafe-map .smap-live{position:absolute;inset:0;opacity:0;transition:opacity .45s ease}
.cafe-map .smap-live.in{opacity:1}
.cafe-map .smap-live .lbl{text-shadow:0 0 2px var(--paper),0 1px 2px var(--paper),0 0 5px var(--paper)}
/* the library's own chrome, scoped to the live layer rather than to one container,
   so a café map and a plot's ground wear the same paper without saying it twice */
.smap-live .maplibregl-map{width:100%;height:100%}
.smap-live .maplibregl-ctrl-attrib{font-family:var(--sans)!important;font-size:9px!important;letter-spacing:.02em;background:color-mix(in srgb,var(--paper-card) 82%,transparent)!important;color:var(--ink-3)!important;padding:1px 6px}
.smap-live .maplibregl-ctrl-attrib a{color:var(--ink-3)!important;text-decoration:none}
.smap-live .maplibregl-ctrl-attrib-button{display:none!important}
.smap-live .maplibregl-canvas{outline:none!important}
.smap-live .maplibregl-cooperative-gesture-screen{font-family:var(--sans)!important;font-size:13px}
.cafe-map .pin.spot{width:13px;height:13px;background:var(--accent);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--accent)}
/* the atlas map — three monochrome marks, a lens never a fill: a coarse origin (hollow), a roaster's
   hand (filled dot), a bar (filled square). Ember stays reserved for the current action. */
.cafe-map .pin.origin{width:10px;height:10px;background:var(--paper);border:1.5px solid var(--ink-2);border-radius:50%}
.cafe-map .pin.roaster{width:9px;height:9px;background:var(--ink);border-radius:50%}
.cafe-map .pin.venue{width:9px;height:9px;background:var(--ink);border-radius:2px}
/* grain, rendered (CHARTS.md): a mark drawn as coarsely as the record knows it — a region or
   country centroid goes hollow and dashed, a street or city point stays filled. Monochrome, a
   lens never a rank. */
.cafe-map .pin.coarse{background:var(--paper);border-style:dashed}
.cafe-map .pin.roaster.coarse,.cafe-map .pin.venue.coarse{border:1.5px dashed var(--ink-2)}
/* a scene mark — an area, drawn as one mark that says so: hollow and dashed like every coarse
   fact, never a filled cluster badge pretending to be a location. Its counts ride the label and
   the chips. A merged mark is different — real pins the plot cannot separate, folded into one
   mark carrying a count rather than stacking labels. */
.cafe-map .pin.scene{width:14px;height:14px;background:var(--paper);border:1.5px dashed var(--ink-2);border-radius:3px}
.cafe-map .pin.merged{width:19px;height:19px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:10px;font-weight:600;border-radius:50%}
.cafe-map .atlas-edges{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.cafe-map .atlas-edges line{stroke:var(--ink-3);stroke-width:1;opacity:.5;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
.atlas-key{display:inline-block;width:9px;height:9px;vertical-align:middle;margin-right:3px}
.atlas-key.origin{background:var(--paper);border:1.5px solid var(--ink-2);border-radius:50%}
.atlas-key.roaster{background:var(--ink);border-radius:50%}
.atlas-key.venue{background:var(--ink);border-radius:2px}
.atlas-key.scene{background:var(--paper);border:1.5px dashed var(--ink-2);border-radius:2px}
.cafe-map .smap-note{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;gap:9px;padding:8px 11px;background:color-mix(in srgb,var(--paper-card) 92%,transparent);border-top:1px solid var(--line);font-family:var(--sans);font-size:12px;color:var(--ink-2)}
.cafe-map .smap-note .dot{flex:none;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.cafe-map .smap-note .text-action{margin-left:auto;flex:none}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:none;scroll-snap-align:start}
@media (prefers-reduced-motion: reduce){.cafe-map .pin.nn{transition:none}.smap-live{transition:none!important}}
.continuation{border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:15px 0;margin:2px 0 16px}
.continuation .score{font-family:var(--sans);font-size:46px;line-height:.9;color:var(--accent);font-weight:550;letter-spacing:-.05em}
.continuation .score small{font-size:12px;letter-spacing:.04em;color:var(--ink-3);font-weight:400}
.continuation .row>div:last-child{max-width:62%}
.recipe{font-family:var(--sans);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);margin-top:5px;overflow-wrap:anywhere}
.finding{font-family:var(--serif);font-style:italic;font-size:15px;margin-top:9px;color:var(--ink)}
.bestline{display:flex;justify-content:space-between;gap:12px;margin:12px 1px 0;font-size:12px;color:var(--ink-3)}
.bestline strong{color:var(--ink);font-family:var(--sans);font-weight:550}
/* a section head with an action on its right — the rule runs under both, so it
   reads as the same rule every other section wears */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.section-head h2{margin:0;padding:0;border:0}
.section-head:first-child{margin-top:2px}
.text-action{font-family:var(--sans);font-size:11px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
/* the two frames inside "Where it sits" name themselves without claiming a section of
   their own — one question, one card, two frames, joined in words and never by a line */
.framehead{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);
  text-transform:uppercase;color:var(--ink-3);margin:16px 0 8px}

/* ═══ THE TUCK — a section that folds away ═══════════════════════════════════
   A CARTA page answers the same questions in the same order, and as the record
   filled in, answering all of them at once became one very long scroll. So each
   section is now a card that opens and closes, and the page opens as a stack of
   them: every question still asked, in the same order, none of them shouting.

   The laws it keeps:
   · A CLOSED CARD STILL SAYS SOMETHING. The heading and its count stay on the
     face — a closed section reads "The greens · n=12", not a blank drawer. A
     fold that hides the fact it has anything in it is a wall.
   · THE READING NEVER FOLDS. The head, the road and the resolution readout sit
     above the first card and are always open: that is the page's answer, and a
     page that hides its answer behind a tap has stopped being a record.
   · THE MARK IS THE ONE ALREADY IN THE FILE. + and – , the same grammar the
     trace folds have always worn. No chevron, no icon, no rotation.
   · A CARD IS A FRAME, NOT A FILL. It wears the leaf's own surface and a
     hairline, so the sunk .card inside it still reads as sunk (QM figure/ground).
     When a card holds nothing but one .card, that inner box dissolves — one
     frame, never two. */
.tuck{border:1px solid var(--line);background:var(--surface-card);margin:0 0 8px}
.tuckhead{display:flex;align-items:baseline;gap:10px;padding:0 12px 0 0}
.tucktap{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:9px;
  background:none;border:0;padding:12px 4px 12px 12px;cursor:pointer;text-align:left;color:inherit}
.tucktap:active{background:var(--paper-2)}
.tucktap .mk{flex:none;width:11px;font-family:var(--sans);font-size:13px;color:var(--ink-3);line-height:1.4}
.tucktap .mk::before{content:"+"}
.tuck[open] .tucktap .mk::before{content:"–"}
.tucktap .t{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);
  text-transform:uppercase;color:var(--ink-3);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tuck[open] .tucktap .t{color:var(--ink-2)}
.tuck[open] .tucktap .mk{color:var(--ink-2)}
.tuckhead .meta{flex:none;display:flex;align-items:baseline;gap:8px}
/* the body: a grid row animating 0fr → 1fr, which is the one way to transition
   to a height nobody has measured. Stilled to its end frame under reduced motion. */
.tuckwrap{display:grid;grid-template-rows:0fr}
.tuck[open] .tuckwrap{grid-template-rows:1fr}
.tuckbody{overflow:hidden;min-height:0}
.tuckin{padding:2px 12px 13px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){
  .tuckwrap{transition:grid-template-rows var(--mo-base) var(--mo-ease)}
}
/* the first thing in an open card should not re-state the rule it sits under */
.tuckin>h2:first-child,.tuckin>.section-head:first-child{margin-top:12px}
/* one frame, never two — a card that IS the section drops its own box. A section
   holding SEVERAL cards keeps them: there the boxes are telling the blocks apart. */
.tuckin>.card:first-child:not(:has(~.card)){border:0;background:none;padding:0;margin:0;border-radius:0}
.tuckin>.card:first-child{margin-top:8px}
.tuckin>.rowlink:first-child{padding-top:6px}
.tuckin>*:last-child{margin-bottom:0}
.tuckin>.empty{padding:18px 8px}
/* open all / close all — one quiet line above the stack, never a button row */
.tuckbar{display:flex;justify-content:flex-end;gap:16px;margin:18px 2px 8px}
.tuckbar button{background:none;border:0;padding:2px 0;cursor:pointer;
  font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);
  text-transform:uppercase;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.tuckbar button:active{color:var(--ink)}

.coffee-card{position:relative;padding-right:70px}
.coffee-card .count{position:absolute;right:16px;top:16px;font-family:var(--sans);font-size:11px;color:var(--ink-3)}
.empty-hero{padding:34px 4px 24px}
.empty-hero h2{font-family:var(--serif);font-size:1.625rem;line-height:1.12;letter-spacing:-.02em;text-transform:none;color:var(--ink);margin:0 0 10px;padding:0;border:0}
.empty-hero p{color:var(--ink-3);font-style:italic;margin-bottom:22px;max-width:30ch}

/* ===== welcome (first-run home flow — the way in) ===== */
.welcome{position:fixed;inset:0;z-index:120;background:var(--paper);display:none;flex-direction:column}
.welcome.open{display:flex}
.wc{flex:1;display:flex;flex-direction:column;width:100%;max-width:480px;margin:0 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(24px + env(safe-area-inset-top)) 28px calc(24px + env(safe-area-inset-bottom))}
.wc-top{display:flex;justify-content:space-between;align-items:center}
.wc-mark{font-family:var(--sans);font-size:12px;letter-spacing:.42em;font-weight:600;color:var(--ink)}
.wc-prog{display:flex;gap:6px;align-items:center}
.wc-prog i{width:18px;height:1px;background:var(--ink);opacity:.18;transition:opacity .35s}
.wc-prog i.on{opacity:1}
.wc-body{padding:34px 0 8px}
.wc-eyebrow{font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:650;margin-bottom:14px}
.wc-head{font-family:var(--serif);font-size:42px;line-height:1.0;letter-spacing:-.04em;font-weight:600;color:var(--ink);margin:0 0 18px;max-width:13ch}
.wc-head.sm{font-size:36px}
.wc-lede{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink-2);max-width:34ch;margin-bottom:14px}
.wc-lede em{font-style:italic;color:var(--ink)}
.wc-note{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-top:16px;line-height:1.5;max-width:36ch}
.wc-foot{margin-top:auto;padding-top:22px}
.wc-seal{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-3);text-align:center;margin-top:18px}
.wc-list{margin-top:28px}
/* the welcome's doors are row-links at the same metrics as every other one —
   one navigation primitive across the whole app */
.wc-item{width:100%;text-align:left;display:flex;align-items:baseline;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--line);transition:background .15s}
.wc-item:active{background:var(--paper-2)}
.wc-item .tx{flex:1;min-width:0}
.wc-item .tt{font-family:var(--serif);font-size:var(--s16);font-weight:400;letter-spacing:0;color:var(--ink);display:block}
.wc-item .dd{font-family:var(--sans);font-size:var(--s11);color:var(--ink-3);margin-top:4px;line-height:1.5;display:block;letter-spacing:.02em}
.wc-item .go{align-self:center;color:var(--ink-3);font-family:var(--sans);font-size:var(--s11);flex:none}
/* inside the welcome the same row is a door, and a door gets its full height */
.wc .wc-item{padding:19px 2px;border-top:1px solid var(--line);border-bottom:0}
.wc .wc-item:last-of-type{border-bottom:1px solid var(--line)}
.wc .wc-item .tt{font-size:21px;font-weight:600;letter-spacing:-.01em}
.wc .wc-item .dd{font-size:var(--s13);text-transform:none;letter-spacing:0;margin-top:5px}
.wc .wc-item .go{font-size:15px}
.wc-skip{font-family:var(--sans);font-size:12px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;text-align:center;width:100%;margin-top:14px;min-height:26px}
@keyframes wc-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wc-rise{opacity:0;animation:wc-rise var(--mo-considered,.55s) var(--mo-ease,cubic-bezier(.22,.61,.36,1)) forwards}
@media (prefers-reduced-motion:reduce){.wc-rise{animation:none;opacity:1}}

/* ===== motion charter =====
 * used more, moves less. Three durations, one shared ease-out; nothing
 * bounces, nothing pulses. Reduced motion is first-class: the media block
 * below stills everything to its end frame. */
:root{
  --mo-fast:130ms;        /* controls touched most — a chip, a dial: barely moves */
  --mo-base:230ms;        /* a screen settles, a sheet rises — the standard move */
  --mo-considered:820ms;  /* the one sanctioned moment — arrival, the interlude */
  --mo-ease:cubic-bezier(.22,.61,.36,1);
}
@keyframes ca-settle{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes ca-pins-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ca-draw{from{stroke-dashoffset:220}to{stroke-dashoffset:0}}
.ca-screen{animation:ca-settle var(--mo-base) var(--mo-ease) both}
/* the interlude — the one place the map pauses to compose itself */
.ca-season-line{fill:none;stroke:var(--ink-3);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.7;stroke-dasharray:220;stroke-dashoffset:0}
.ca-map.is-reading .ca-season-line{animation:ca-draw var(--mo-considered) var(--mo-ease) both}
.ca-map.is-reading .ca-pin-layer{animation:ca-pins-in var(--mo-considered) var(--mo-ease) both}
@media (prefers-reduced-motion:reduce){
  .ca-screen,.ca-map .ca-pin-layer{animation:none!important;opacity:1!important;transform:none!important}
  .ca-map .ca-season-line{animation:none!important;stroke-dashoffset:0!important}
  .sheet{transition:none}
}

/* ===== sheet ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(26,26,22,.42);z-index:40;display:none}
.sheet-bg.open{display:block}
.sheet{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
  background:var(--paper);border-radius:0;border-top:1px solid var(--line-strong);z-index:50;
  max-height:92vh;max-height:92dvh;overflow-y:auto;overflow-x:hidden;display:none;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  transition:transform var(--mo-base) var(--mo-ease);
}
.sheet.open{display:block}
/* the primer layer — "how to read the record", stacked above any open sheet */
.sheet-bg.primerbg{z-index:58}
.sheet.primerlayer{z-index:59}
.primer-over{font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-bottom:7px}
.primer-b{font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--ink-2);max-width:37ch;margin:0 0 16px}
.ex{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.sheet .grab{height:26px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.sheet .grab::before{content:"";width:34px;height:3px;background:var(--ink-3);border-radius:2px;transition:background .15s,width .15s}
.sheet.dragging{transition:none}
.sheet.dragging .grab{cursor:grabbing}
.sheet.dragging .grab::before{background:var(--ink);width:44px}
.sheet h3{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:3px;color:var(--ink)}
.sheet .sub{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-size:14px;margin-bottom:16px;max-width:37ch}

/* ===== misc ===== */
.empty{font-family:var(--serif);font-style:italic;color:var(--ink-3);text-align:center;padding:30px 20px;font-size:15px}
/* the ledger row (STREAMLINED.html's .row, ported faithfully). A column is named
   the way every other quiet label in the app is named — the tracked, uppercase
   eyebrow — and its value is set in the reading face, ranged right. That one
   change is what makes an identity card read as a register entry rather than as
   a settings list: the labels line up as a rule down the left, the values as a
   rule down the right, and the eye reads the values as a column. */
.kv{display:flex;justify-content:space-between;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:var(--s15);gap:12px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-3);font-family:var(--sans);font-size:var(--s11);
  letter-spacing:var(--track-label);text-transform:uppercase;flex:none;white-space:nowrap;line-height:1.5}
.kv .v{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.kv .v .unread,.kv .v.unread{font-style:italic;color:var(--ink-3)}
.n-note{font-family:var(--sans);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
svg text{font-family:'Libre Franklin',sans-serif}
.toast{
  position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:var(--chipr);font-family:var(--sans);font-size:13px;
  z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1}
.link{font-family:var(--sans);color:var(--ink-2);font-weight:400;font-size:13px;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.link:hover{color:var(--ink)}

/* ===== quick start ===== */
ol.steps{list-style:none;counter-reset:s;margin:2px 0 4px}
ol.steps>li{counter-increment:s;position:relative;padding-left:38px;margin-bottom:16px}
ol.steps>li::before{
  content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:var(--radius);
  background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;
}
ol.steps .t{font-family:var(--serif);font-size:15px;font-weight:600;line-height:24px}
ol.steps .b{font-size:14px;color:var(--ink-2);margin-top:2px;line-height:1.5}
ol.steps .go{font-family:var(--sans);font-size:12px;color:var(--ink-2);font-weight:500;margin-top:6px;display:inline-block;text-decoration:underline;text-underline-offset:2px}
.rule{border-left:2px solid var(--ink);padding:2px 0 2px 13px;margin:14px 0;background:var(--paper-2)}
.rule.hard{border-left-color:var(--danger)}
.rule .t{font-family:var(--serif);font-size:14px;font-weight:600}
.rule .b{font-size:14px;color:var(--ink-2)}
.warn{border:1px solid var(--danger);border-radius:var(--radius);padding:12px 14px;margin:12px 0;background:var(--paper-2)}
.warn .t{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--danger);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.warn .b{font-size:14px;color:var(--ink-2)}
.loop{display:flex;align-items:stretch;gap:4px;margin:10px 0 6px}
.loop .s{flex:1;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px 3px;text-align:center}
.loop .s .k{font-family:var(--sans);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.loop .s .v{font-family:var(--serif);font-size:12px;font-weight:600;margin-top:3px;line-height:1.25}
.loop .a{display:flex;align-items:center;color:var(--ink-3);font-size:12px}
.gtab{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
.gtab:last-child{border-bottom:none}
.gtab .ic{display:none}
.gtab .nm{width:52px;font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;flex:none;color:var(--ink)}
.gtab .ds{font-size:13px;color:var(--ink-2);flex:1}
.gt{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.gt td{padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.gt td:last-child{text-align:right;color:var(--ink-2);font-family:var(--sans)}
.gt tr:last-child td{border-bottom:none}
code{font-family:var(--mono);font-size:12px;background:var(--paper-2);padding:1px 5px;border-radius:var(--chipr)}
.helpbtn{font-family:var(--sans);color:var(--ink-3);font-size:12px;padding:0 0 0 14px;line-height:1;text-decoration:underline;text-underline-offset:2px}
.helpbtn:active{color:var(--ink)}

/* ===== café ===== */
.opt{text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:400;font-size:10px;font-style:italic;font-family:var(--serif)}
.cafeback{background:var(--paper-2);border:1px solid var(--line);border-left:2px solid var(--ink);border-radius:var(--radius);padding:9px 12px;font-size:13px;color:var(--ink-2);margin:2px 0 12px;font-family:var(--serif);font-style:italic}
.cafeback strong{font-style:normal;color:var(--ink)}
.verdict{display:flex;gap:6px}
.verdict button{flex:1;padding:10px;border:1px solid var(--line-strong);border-radius:var(--radius);background:transparent;color:var(--ink-2);font-family:var(--sans);font-size:13px;font-weight:500}
.verdict button.yes.on{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.verdict button.no.on{background:transparent;color:var(--ink);border-color:var(--ink);text-decoration:line-through}
.badge{display:inline-block;font-family:var(--sans);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:var(--chipr);background:transparent;border:1px solid var(--line-strong);color:var(--ink);font-weight:500;vertical-align:middle}
.badge.ghost{border-color:var(--line);color:var(--ink-3)}
/* the reach: solid says fact, dashed says state — no mark mode may collapse the two */
.badge.dashed{border-style:dashed;border-color:var(--ink-3);color:var(--ink-3)}
.desc button.held{border-style:dashed;border-color:var(--ink-3);color:var(--ink-3)}
.shopcard .big{font-family:var(--sans);font-size:22px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.swatch{width:11px;height:11px;border-radius:var(--chipr);vertical-align:-1px;margin-left:6px;display:none;border:1px solid var(--line)}
/* café theme — a whole surface derived from the café's website colours. The vars are set inline. */
.cafe-theme{background:var(--paper);color:var(--ink);margin:0 -18px;padding:6px 18px 8px}
/* the derived palette, shown while setting a café's branding */
.palette{display:flex;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);margin:2px 0 0}
.palette span{flex:1;height:36px}
.brandmark{width:14px;height:14px;border-radius:var(--chipr);display:inline-block;vertical-align:-2px;border:1px solid var(--line)}
.georow{padding:8px 11px;margin:6px 0 0}
.pinned{font-family:var(--sans);font-size:12px;color:var(--ink-2);padding:6px 2px}
.pinned .link{margin-left:8px;cursor:pointer}
.trace-more{margin-bottom:14px}
.trace-more>summary{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;padding:6px 0;list-style:none}
.trace-more>summary::-webkit-details-marker{display:none}
.trace-more>summary::before{content:"+ ";color:var(--ink-3)}
.trace-more[open]>summary::before{content:"– "}

/* ===== read-only banner ===== */
.viewbar{
  background:var(--paper-2);color:var(--ink);border:1px solid var(--line);border-left:2px solid var(--ink);border-radius:var(--radius);
  padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;
  font-family:var(--serif);font-style:italic;font-size:13px;gap:10px;
}
.viewbar button{background:var(--ink);color:var(--accent-ink);border-radius:var(--radius);padding:6px 13px;font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;flex:none;font-style:normal}

/* ===== changelog ===== */
.rel{border-left:2px solid var(--line-2);padding:2px 0 2px 14px;margin:0 0 18px}
.rel.latest{border-left-color:var(--ink)}
.rel-h{display:flex;align-items:baseline;gap:8px}
.rel-v{font-family:var(--sans);font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.rel-d{font-family:var(--sans);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rel-new{font-family:var(--sans);font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line-strong);color:var(--ink);padding:1px 6px;border-radius:var(--chipr);font-weight:500}
.rel-t{font-family:var(--serif);font-size:15px;font-weight:600;margin:3px 0 5px}
.rel-l{list-style:none;margin:0}
.rel-l li{font-size:14px;color:var(--ink-2);padding:2px 0 2px 15px;position:relative;line-height:1.5}
.rel-l li::before{content:"—";position:absolute;left:0;color:var(--ink-3)}

/* ===== Quiet Matter seal ===== */
.qm-seal{font-family:var(--sans);font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-3);text-align:center;font-weight:500;margin:20px 0 2px}
.qm-seal .em{display:block;font-family:var(--serif);font-style:italic;font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink-3);margin-top:6px}

</style>
</head>
<body>
<header class="app">
<div><h1>Carta</h1><div class="sub" id="who">The atlas</div></div>
<button class="doorbtn" id="doorbtn" onclick="openDoor()" aria-label="Add a coffee">＋ A coffee</button></header>
<div id="ground" aria-hidden="true"></div>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div class="sheet-bg" id="sheetbg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="sheet-bg primerbg" id="primerbg" onclick="closePrimer()"></div>
<div class="sheet primerlayer" id="primer"></div>
<div class="welcome" id="welcome"></div>
<div class="toast" id="toast"></div>
<input type="file" accept=".json,application/json" id="importInput" style="display:none">

<script>
'use strict';
/* ============ store ============ */
const KEY='carta.v1';           // legacy single-user key — migrated to per-user keys on first boot
const USERS_KEY='carta.users';
const blank={version:1,setups:[],bags:[],brews:[],cups:[],pours:[],cafes:[],authored:[],cafeFavs:[],cafeWants:[],deleted:[],struck:[],holds:[],prefs:{},createdAt:new Date().toISOString()};
const clone=o=>JSON.parse(JSON.stringify(o));
const dataKey=id=>KEY+'.'+id;
function loadUsers(){
  try{
    const r=localStorage.getItem(USERS_KEY);
    if(r){const u=JSON.parse(r); if(u&&u.users&&u.users.length&&u.users.some(x=>x.id===u.activeId))return u;}
  }catch(e){}
  // First multi-user boot: adopt any existing single-user ledger as user "Me".
  // Fixed id so a partial migration (quota mid-write) retries onto the same key.
  const u={version:1,users:[{id:'u1',name:'Me',createdAt:new Date().toISOString()}],activeId:'u1'};
  try{
    const legacy=localStorage.getItem(KEY);
    if(legacy!=null)localStorage.setItem(dataKey('u1'),legacy);
    localStorage.setItem(USERS_KEY,JSON.stringify(u));
    if(legacy!=null)localStorage.removeItem(KEY);
  }catch(e){}
  return u;
}
let USERS=loadUsers();
let viewingUserId=USERS.activeId;   // whose ledger is on screen; ≠ activeId means read-only
let D=load();
function load(){try{const r=localStorage.getItem(dataKey(viewingUserId));const d=r?JSON.parse(r):clone(blank);d.prefs=d.prefs||{};return d}catch(e){return clone(blank)}}
// A reader's save writes PREFERENCES and nothing else — a theme and a °C/°F
// choice are how the page is drawn, not what it says. There is no affordance
// that would call it with a record, and this is the belt in case one ever slips.
function save(){if(readOnly())return;
  if(reader()){try{localStorage.setItem(dataKey(viewingUserId),JSON.stringify({...clone(blank),createdAt:D.createdAt||new Date().toISOString(),prefs:D.prefs||{}}))}catch(e){}return}
  keptBust();localStorage.setItem(dataKey(viewingUserId),JSON.stringify(D));markDirty()}
// per-user presentation/input preferences (temp unit, timer visibility) — part of the ledger, so they export and sync
const getPref=(k,dflt)=>{const p=D.prefs||{};return p[k]==null?dflt:p[k]};
function setPref(k,v){if(readOnly())return;D.prefs=D.prefs||{};D.prefs[k]=v;save()}
function saveUsers(){localStorage.setItem(USERS_KEY,JSON.stringify(USERS))}
const userById=id=>USERS.users.find(u=>u.id===id);
const viewingUser=()=>userById(viewingUserId)||remoteUserById(viewingUserId);
const readOnly=()=>viewingUserId!==USERS.activeId;
function guard(){if(readOnly()){toast(`Read only — this is ${viewingUser().name}'s ledger`);return true}return false}
/* ---- the pen: who may write the SHARED record (the Register + the catalog).
 * Everyone keeps their own ledger, always. The shared documents are — for
 * now, while the atlas settles — kept by the founder alone: on a synced
 * device the server's founder flag is the authority (the first account
 * registered; the server refuses any other pen with 403), and on an unsynced
 * device the pen is claimed once from the Desk → The pen. Temporary: the
 * group-writable curation returns with the proposed→stood moderation ceremony. */
const PEN_KEY='carta.pen.v1';
let PEN=readJSONLS(PEN_KEY);            // {userId,at} | null — the device-local claim
function savePen(){if(PEN)localStorage.setItem(PEN_KEY,JSON.stringify(PEN));else localStorage.removeItem(PEN_KEY)}
function isAdmin(){
  if(readOnly()||reader())return false;   // explicit, even though no path could reach true from a published copy
  if(typeof SYNC!=='undefined'&&SYNC&&syncedHere()&&SYNC.founder!==undefined)return !!SYNC.founder;
  return !!(PEN&&PEN.userId===USERS.activeId);
}
function penGuard(){if(guard())return true;if(!isAdmin()){toast('The shared record is read-only here — take up the pen under the desk to write it');return true}return false}
function takePen(){if(guard())return;PEN={userId:USERS.activeId,at:new Date().toISOString()};savePen();closeSheet();render();toast('The pen is yours on this device')}
function setDownPen(){PEN=null;savePen();closeSheet();render();toast('The pen is set down')}
/* ---- the reader (docs/READER.md). The person who keeps nothing: they open
 * CARTA, read the atlas as the founder published it, and never sign in.
 * Everything that writes is not hidden from them so much as ABSENT — there is
 * nothing on their device for it to write to.
 *
 * The welcome already named them and we never noticed: the first door is
 * "I read, mostly — the atlas opens. Keep nothing, ever." A keeper keeps a
 * record; a reader reads one. The only difference is whether anything is
 * written down. The app never labels the person on screen at all — it names
 * THE COPY (the published atlas, this copy) and lets them infer the rest.
 *
 * "Keeps nothing" means no RECORD — no cups, brews, bags, Setups. It does not
 * mean no state: a theme and a °C/°F choice are how the page is drawn, not
 * what it says, and the model already draws that line (D.prefs is
 * presentation, the collections are the record). ---- */
const PUB_KEY='carta.public.v1';
// Empty in the repo, set for a deployed build — with it, "I read, mostly" on
// the welcome just works, with no link to paste and no account to make.
const PUBLIC_ATLAS='';
let PUB=readJSONLS(PUB_KEY);  // {url,rev,publishedAt,publishedBy,fetchedAt,counts,atlas:{catalog,register,pours}}
let pubBusy=false,pubState='idle',pubArrived=false;   // idle|checking|offline|missing
function savePub(){try{if(PUB)localStorage.setItem(PUB_KEY,JSON.stringify(PUB));else localStorage.removeItem(PUB_KEY)}catch(e){}}
// Has this device written anything down about coffee? Read across every keeper
// on it, because a second keeper's record is still a record on this device.
// Cached: reader() is asked on every paint, and this walks localStorage.
let _kept=null;
const keptBust=()=>{_kept=null};
function keptSomething(){
  if(_kept!==null)return _kept;
  return _kept=USERS.users.some(u=>{const d=(u.id===viewingUserId?D:readJSONLS(dataKey(u.id)));
    return !!d&&['cups','brews','bags','setups','authored'].some(k=>(d[k]||[]).length)});
}
/* True when the device holds a published atlas, holds no record of its own, and
 * is not signed in. Signing in ends it. Keeping a first cup ends it — and so
 * does the deliberate act of taking the door out (prefs.keeping), which is what
 * makes that first cup writable at all. Nothing else does, and nothing about it
 * is a mode the reader has to manage. */
const reader=()=>!!(PUB&&PUB.atlas&&!getPref('keeping',false)&&!keptSomething()&&!(typeof SYNC!=='undefined'&&SYNC&&SYNC.token));
/* The belt beside the braces. It should never fire — no affordance that calls a
 * write is rendered for a reader — and it exists for exactly that reason. */
function readerGuard(){
  if(!reader())return false;
  toast('You’re reading a published copy — start keeping to make a record of your own');
  return true;
}
// The door out (R9). Ends reader mode and leaves the published copy exactly
// where it is: their own record lays OVER it, one layer down.
function startKeeping(d){
  setPref('keeping',true);
  setPref('depth',Math.max(2,d||2));
  setPref('onboarded',true);
  keptBust();closeSheet();go('atlas');
  toast('Your record is open. The atlas stays as it is; your cups lay over it.');
}
/* ---- the published layer (READER.md §8). PUB is stored under its own key and
 * is NEVER merged into CAT/REG: if it merged, the day the reader started
 * keeping, their own record and the founder's would be indistinguishable, and
 * their device would try to push a record it does not hold the pen on. So it
 * layers at READ time — own first, published second — and the ordinary keeper,
 * who holds no published copy, gets the own array back verbatim, so nothing
 * about an existing record changes shape by one byte. ---- */
const pubCat=kind=>{const c=PUB&&PUB.atlas&&PUB.atlas.catalog;const d=c&&c[kind];
  return (d&&Array.isArray(d.entries))?d.entries:[]};
const pubReg=()=>{const r=PUB&&PUB.atlas&&PUB.atlas.register;return (r&&Array.isArray(r.entries))?r.entries:[]};
const pubPours=()=>{const p=PUB&&PUB.atlas&&PUB.atlas.pours;return Array.isArray(p)?p:[]};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byNew=(a,b)=>b.createdAt.localeCompare(a.createdAt);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}

/* ============ the Register ============ */
/* One entry per café, kept once — Jane's Fighting Ships, for cafés. The single
 * source of truth for a café's identity: name, city, address and pin, and the
 * palette read from its website. Cups stay personal, per ledger; the place is common
 * knowledge, so it lives OUTSIDE the per-user keys, shared by every user of
 * this device — and, through sync (/api/cafes), by every keeper on the server.
 * Any keeper may amend an entry; the entry remembers who entered it first. */
const REG_KEY='carta.register.v1';
let REG=loadReg();
function loadReg(){
  try{const r=localStorage.getItem(REG_KEY);const g=r?JSON.parse(r):null;
    if(g&&Array.isArray(g.entries))return{version:1,rev:g.rev||0,dirty:!!g.dirty,entries:g.entries,deleted:g.deleted||[]};
  }catch(e){}
  return{version:1,rev:0,dirty:false,entries:[],deleted:[]};
}
function saveReg(){try{localStorage.setItem(REG_KEY,JSON.stringify(REG))}catch(e){}}
/* An entry set down is struck, never removed — the shared record's own law, the
 * one the sightings already keep. Both dates only ever add, so two devices
 * converge on max(withdrawnAt) vs max(restoredAt) whatever order they merge in.
 * regByName is the READ door and answers only for entries that stand; regFind is
 * the identity door — regUpsert and the restore need to reach a struck entry so a
 * later sighting reuses its id instead of minting a twin. */
const regLive=e=>!!e&&!(String(e.withdrawnAt||'')>String(e.restoredAt||''));
// The Register layers exactly as the catalog does — own first, the published
// copy second, never merged into REG (READER.md L6). No published copy on the
// device and this is REG.entries itself, unchanged.
function regAll(){
  const own=REG.entries,ps=pubReg();
  if(!ps.length)return own;
  if(!own.length)return ps;
  const pm=new Map();ps.forEach(e=>{if(e&&e.id)pm.set(e.id,e)});
  const seen=new Set();
  const out=own.map(e=>{if(!e||!e.id)return e;seen.add(e.id);const p=pm.get(e.id);return p?catLayer(e,p):e});
  ps.forEach(e=>{if(e&&e.id&&!seen.has(e.id))out.push(e)});
  return out;
}
const regFind=name=>regAll().find(e=>e&&normName(e.name)===normName(name))||null;
