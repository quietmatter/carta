/* ============================================================================
 * CARTA — the token layer  (sub-brand of Quiet Matter)
 * ----------------------------------------------------------------------------
 * Ported wholesale from classic (ARCHITECTURE.md §1) — the token architecture
 * is unchanged by the fourth turn. Charter: docs/SUBBRAND.md.
 * ========================================================================== */
:root{
  --s11:0.6875rem; --s13:0.8125rem; --s15:0.9375rem; --s16:1rem; --s18:1.125rem;
  --track-label:0.12em; --track-foot:0.04em;
  --w-regular:400; --w-medium:500; --w-semibold:600;
  --measure:37ch; --measure-editorial:56ch; --touch-min:44px;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'Libre Franklin',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;

  --ca-paper-0:#f8f5ee; --ca-paper-50:#f2eee6; --ca-paper-100:#e9e3d8; --ca-paper-200:#ddd5c7;
  --ca-ink-900:#241d18; --ca-ink-600:#554a41; --ca-ink-450:#776b60; --ca-ink-300:#b8b5b0;
  --ca-line-ink:rgba(36,29,24,.13); --ca-line-paper:rgba(236,233,227,.14);
  --ca-ember:#a63f2b; --ca-ember-ink:#fffaf1; --ca-danger:#8c3b34;

  --ca-night-900:#171310; --ca-night-800:#211b17; --ca-night-700:#2d241f; --ca-night-600:#342923;
  --ca-roastlight-100:#f0e9dd; --ca-roastlight-300:#c8bcae; --ca-roastlight-500:#9f9183; --ca-roastlight-700:#5b574f;
  --ca-ember-dusk:#e06b4f;

  --radius:0; --chipr:2px;

  --text-primary:var(--ca-ink-900); --text-secondary:var(--ca-ink-600); --text-subtle:var(--ca-ink-450);
  --text-disabled:var(--ca-ink-300); --text-on-fill:var(--ca-ember-ink);
  --surface-page:var(--ca-paper-50); --surface-card:var(--ca-paper-0); --surface-sunk:var(--ca-paper-100);
  --border-hairline:var(--ca-line-ink); --border-strong:var(--ca-ink-900); --border-control:var(--ca-ink-450);
  --link:var(--ca-ink-600); --link-hover:var(--ca-ink-900); --focus-ring:var(--ca-ink-900);
  --fill-strong:var(--ca-ink-900); --fill-strong-hover:var(--ca-ink-600);
  --signal:var(--ca-ember); --signal-ink:var(--ca-ember-ink); --status-danger:var(--ca-danger);

  --ink:var(--text-primary); --ink-2:var(--text-secondary); --ink-3:var(--text-subtle); --ink-d:var(--text-disabled);
  --paper:var(--surface-page); --paper-card:var(--surface-card); --paper-2:var(--surface-sunk); --paper-3:var(--ca-paper-200);
  --line:var(--border-hairline); --line-2:var(--ca-paper-200); --line-strong:var(--border-strong);
  --accent:var(--signal); --accent-ink:var(--signal-ink); --danger:var(--status-danger);

  --mo-fast:130ms; --mo-base:230ms; --mo-considered:820ms; --mo-ease:cubic-bezier(.22,.61,.36,1);
}
html[data-theme="dusk"]{
  --text-primary:var(--ca-roastlight-100); --text-secondary:var(--ca-roastlight-300); --text-subtle:var(--ca-roastlight-500);
  --text-disabled:var(--ca-roastlight-700); --text-on-fill:var(--ca-night-900);
  --surface-page:var(--ca-night-900); --surface-card:var(--ca-night-800); --surface-sunk:var(--ca-night-700);
  --border-hairline:var(--ca-line-paper); --border-strong:var(--ca-roastlight-100); --border-control:var(--ca-roastlight-500);
  --link:var(--ca-roastlight-300); --link-hover:var(--ca-roastlight-100); --focus-ring:var(--ca-roastlight-100);
  --fill-strong:var(--ca-roastlight-100); --fill-strong-hover:var(--ca-roastlight-300);
  --signal:var(--ca-ember-dusk); --signal-ink:var(--ca-night-900);
  --line-2:var(--ca-night-700); --paper-3:var(--ca-night-600);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--surface-page)}
body{
  background:var(--surface-card);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5;
  max-width:480px;margin:0 auto;border:1px solid var(--line-2);height:100vh;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
/* the leaf, ruled twice — the sheet's own edge, and the margin it's written inside */
body::before{content:"";position:absolute;inset:5px;z-index:35;border:1px solid var(--border-hairline);pointer-events:none}
.num{font-family:var(--sans);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

header.app{
  background:var(--surface-card);color:var(--ink);padding:calc(16px + env(safe-area-inset-top)) 20px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none;z-index:20;border-bottom:1px solid var(--line);
}
header.app h1{font-family:var(--serif);font-size:var(--s16);letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--ink);line-height:1}
header.app .sub{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-3);margin-top:3px;display:block}
.doorbtn{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:6px 11px;
  border:1px solid var(--line-strong);border-radius:var(--radius);background:none;color:var(--ink);font-family:var(--sans);font-size:var(--s11);letter-spacing:.06em}
.doorbtn:active{background:var(--paper-2)}
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:20px 20px 26px;position:relative;z-index:1}

h2{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;
  color:var(--ink-3);font-weight:500;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2:first-child{margin-top:2px}
.eyebrow{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0 0 8px}
.display{font-family:var(--serif);font-weight:600;font-size:1.625rem;line-height:1.12;letter-spacing:-.02em;
  color:var(--ink);margin:0 0 6px;text-wrap:balance}
.display em{font-style:italic;font-weight:400}
.lede{font-family:var(--serif);font-size:var(--s16);line-height:1.55;color:var(--ink-2);margin:0 0 14px}
.note{border-top:1px solid var(--line);padding-top:12px;margin:10px 0 4px;font-family:var(--serif);font-style:italic;font-size:var(--s13);color:var(--ink-3)}
.back{display:inline-block;background:none;border:0;padding:0 0 12px;cursor:pointer;color:var(--ink-3);
  font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase}
.back:active{color:var(--ink)}
.rowlink{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:12px 0;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rowlink:active{background:var(--paper-2)}
.rowlink .t{font-family:var(--serif);font-size:var(--s16);color:var(--ink)}
.rowlink .m{font-family:var(--sans);font-size:var(--s11);color:var(--ink-3);letter-spacing:.02em;line-height:1.5}
.rowlink .go{flex:none;color:var(--ink-3);font-family:var(--sans);font-size:var(--s11)}
.btnrow{display:flex;gap:8px;align-items:stretch}
.btnrow .btn,.btnrow .btn+.btn{margin-top:0;flex:1}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.muted{color:var(--ink-3);font-family:var(--sans);font-size:13px}
.small{font-size:13px}
.serif{font-family:var(--serif)}
strong{font-family:var(--serif);font-weight:600;font-style:normal}
.opt{text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:400;font-size:10px;font-style:italic;font-family:var(--serif)}

.chip{display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.02em;padding:2px 8px;
  border-radius:var(--chipr);background:var(--paper);border:1px solid var(--line);color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--line-strong);color:var(--ink)}

.btn{display:block;width:100%;text-align:center;min-height:44px;padding:11px 16px;border-radius:var(--radius);
  font-family:var(--sans);font-size:var(--s13);font-weight:400;letter-spacing:.02em;transition:background .2s ease,color .2s ease,border-color .2s ease}
.btn.mini{min-height:32px;padding:5px 10px;font-size:var(--s11)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
.btn-primary:active{filter:brightness(.88)}
.btn-quiet{background:none;border:1px solid var(--line-strong);color:var(--ink)}
.btn-quiet:active{background:var(--paper-2)}
.btn-danger{color:var(--danger);border:1px solid var(--danger);background:none}
.btn-danger:active{background:var(--paper-2)}
.btn+.btn{margin-top:8px}

label.f,div.f{display:block;margin-bottom:14px;min-width:0}
label.f span.l,div.f span.l{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;font-weight:500}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;font-family:var(--serif);font-size:16px;padding:9px 0;border:none;border-bottom:1px solid var(--ink-3);
  border-radius:0;background:transparent;color:var(--ink);appearance:none;-webkit-appearance:none}
input::placeholder,textarea::placeholder{color:var(--ink-d);font-style:italic}
select{background:transparent}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ink)}
textarea{min-height:60px;resize:vertical;border:1px solid var(--line);padding:9px 11px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:0 12px}
details.more{margin:4px 0 14px}
details.more summary{cursor:pointer;font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:10px}

/* ===== dial (the field-tool scale exception) ===== */
.dial{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-card);padding:9px 6px 11px;margin-bottom:10px;text-align:center;position:relative}
.dial .l{font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.dial .v{font-family:var(--sans);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15;margin:3px 0;color:var(--ink)}
.dial .v .u{font-family:var(--sans);font-size:12px;color:var(--ink-3);font-weight:400;margin-left:2px}
.dial .ctl{display:flex;justify-content:center;gap:6px}
.dial .ctl button{width:52px;height:34px;border:1px solid var(--line-strong);border-radius:var(--radius);background:transparent;font-size:20px;font-weight:400;color:var(--ink-2)}
.dial .ctl button:active{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.dial .ticks{position:absolute;top:9px;right:11px;font-family:var(--sans);font-size:9px;color:var(--ink-3);letter-spacing:.06em}
.dial .v.tapedit{display:inline-block;cursor:text;border-bottom:1px dotted var(--ink-3)}
.dedit{width:2.7em;min-width:46px;max-width:88%;font-family:var(--sans);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;text-align:center;border:none;background:transparent;color:var(--ink);padding:0}
.dedit:focus{outline:none}
.dcorner{position:absolute;top:7px;right:7px;display:flex;gap:3px}
.dcorner .ut{font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.02em;padding:2px 6px;border:1px solid var(--line-strong);background:transparent;color:var(--ink-3);border-radius:var(--chipr);cursor:pointer}
.dcorner .ut.on{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.dialrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.hedonic{display:flex;gap:5px;justify-content:space-between;margin:6px 0 4px}
.hedonic button{flex:1;aspect-ratio:1/1.15;border:1px solid var(--line-strong);border-radius:var(--radius);background:transparent;font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink-2);max-width:46px}
.hedonic button.on{background:var(--ink);color:var(--accent-ink);border-color:var(--ink);font-weight:500}
.desc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.desc button{font-family:var(--sans);font-size:13px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:var(--chipr);background:transparent;color:var(--ink-2)}
.desc button.on{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}

.timer{background:var(--paper-2);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:center;margin-bottom:12px}
.timer .t{font-family:var(--sans);font-size:40px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.timer .ctl{display:flex;gap:8px;margin-top:10px}
.timer .ctl button{flex:1;padding:11px;border-radius:var(--radius);border:1px solid var(--line-strong);color:var(--ink);font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.timer .ctl button.go{background:var(--ink);border-color:var(--ink);color:var(--accent-ink)}

/* ===== tab bar — four rooms, typographic, no icons ===== */
nav.tabs{flex:none;background:var(--surface-card);display:grid;grid-template-columns:repeat(4,1fr);z-index:30;
  padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line)}
nav.tabs button{padding:13px 4px 15px;color:var(--ink-3);font-family:var(--sans);font-size:var(--s11);
  letter-spacing:var(--track-label);text-transform:uppercase;font-weight:400;min-height:44px;border-right:1px solid var(--line)}
nav.tabs button:last-child{border-right:0}
nav.tabs button.on{color:var(--ink);box-shadow:inset 0 2px 0 var(--ink)}

/* ===== the settle — plays on a screen change, stilled under reduced motion ===== */
@keyframes ca-settle{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ca-screen{animation:ca-settle var(--mo-base) var(--mo-ease) both}
@media (prefers-reduced-motion:reduce){.ca-screen{animation:none!important;opacity:1!important;transform:none!important}.sheet{transition:none}}

/* ===== sheet ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(26,26,22,.42);z-index:40;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
  background:var(--paper);border-radius:0;border-top:1px solid var(--line-strong);z-index:50;
  max-height:92vh;max-height:92dvh;overflow-y:auto;overflow-x:hidden;display:none;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));transition:transform var(--mo-base) var(--mo-ease)}
.sheet.open{display:block}
.sheet .grab{height:26px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.sheet .grab::before{content:"";width:34px;height:3px;background:var(--ink-3);border-radius:2px;transition:background .15s,width .15s}
.sheet.dragging{transition:none}
.sheet.dragging .grab{cursor:grabbing}
.sheet.dragging .grab::before{background:var(--ink);width:44px}
.sheet h3{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:3px;color:var(--ink)}
.sheet .sub{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-size:14px;margin-bottom:16px;max-width:37ch}

.empty{font-family:var(--serif);font-style:italic;color:var(--ink-3);text-align:center;padding:30px 20px;font-size:15px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:var(--s15);gap:12px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-3);font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;flex:none;white-space:nowrap;line-height:1.5}
.kv .v{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.kv .v.score,.rowlink .go.score,.score{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}

.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:var(--chipr);font-family:var(--sans);font-size:13px;
  z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.withundo{pointer-events:auto}
.toast .undo{margin-left:10px;text-decoration:underline;cursor:pointer}
.toast.show{opacity:1}

/* ===== the passport — the world frame, monochrome (MAPPING.md's law: a mark is a
   lens, never a rank, and the ember is never spent here) ===== */
.plot-box{border:1px solid var(--line);background:var(--paper);margin:4px 0 8px;position:relative;overflow:hidden}
.plot-box svg{display:block;width:100%;position:relative;z-index:1}
/* untasted — the ground, a hairline invitation and nothing more */
.plot-box .land{fill:var(--surface-page);fill-opacity:.6;stroke:var(--line-2);stroke-width:1;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
/* the highlands — dotted is the ground, weight rising with height, never the ember */
.plot-box .topo{fill:none;stroke:var(--ink-3);stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.plot-box .topo.t1{stroke-width:.7;stroke-dasharray:1.4 2.4;opacity:.5}
.plot-box .topo.t2{stroke-width:.8;stroke-dasharray:2.6 2;opacity:.62}
.plot-box .topo.t3{stroke-width:.9;opacity:.72}
/* tasted — a country whose shape IS the mark, firm and tappable into its chapter */
.plot-box .mk-land{fill:var(--surface-page);fill-opacity:.9;stroke:var(--ink-2);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.plot-box g.mk{cursor:pointer}
.plot-box g.mk:active .mk-land{fill:var(--paper-2)}
.mk-lbl{font-family:var(--sans);font-size:9px;fill:var(--ink-3);pointer-events:none}
.mk-lbl.onland{paint-order:stroke;stroke:var(--paper);stroke-width:2.8px;stroke-linejoin:round;fill:var(--ink-2)}

</style>
</head>
<body>
<header class="app">
<div><h1>Carta</h1><div class="sub" id="who">The journal</div></div>
<button class="doorbtn" id="doorbtn" onclick="openDoor()" aria-label="Add a cup">＋ A cup</button></header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div class="sheet-bg" id="sheetbg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* Carta 7 — the fourth turn's skeleton. docs/ARCHITECTURE.md is the spec this
 * file builds; docs/ROADMAP.md orders what ships in which phase. Phase 1: the
 * journal, the shelf, the door, the dial-in loop, put-away + undo. No maps, no
 * scout, no menus, no photos, no cards, no migration — those are later phases.
 * Classic (Carta 6.18.x) moved whole to classic/index.html and is untouched. */

/* ============ store ============ */
const KEY='carta7.v1';
const blank={version:1,cups:[],coffees:[],places:[],roasters:[],setups:[],brews:[],prefs:{}};
const clone=o=>JSON.parse(JSON.stringify(o));
let D=load();
function load(){try{const r=localStorage.getItem(KEY);const d=r?JSON.parse(r):clone(blank);d.prefs=d.prefs||{};return d}catch(e){return clone(blank)}}
function save(){_tasteDirty=true;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Could not save — is storage full?')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const byNew=(a,b)=>b.createdAt.localeCompare(a.createdAt);
const live=coll=>(D[coll]||[]).filter(x=>!x.archived);
function putAway(coll,id){if(!putAwayCore(D,coll,id,new Date().toISOString()))return;save();render();toast('Put away.',()=>restore(coll,id));}
function restore(coll,id){if(!restoreCore(D,coll,id))return;save();render();toast('Restored.');}
function archivedFold(coll,rowFn,label){const items=D[coll].filter(x=>x.archived);
  if(!items.length)return '';
  return `<details class="more"><summary>${label||'Put away'} (${items.length})</summary>${items.map(rowFn).join('')}</details>`;}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const numv=id=>{const v=val(id);return v===''?null:Number(v)};
const getPref=(k,dflt)=>{const p=D.prefs||{};return p[k]==null?dflt:p[k]};
const setPref=(k,v)=>{D.prefs=D.prefs||{};D.prefs[k]=v;save()};

/* ============ domain ============ */
const roasterById=id=>D.roasters.find(r=>r.id===id);
const placeById=id=>D.places.find(p=>p.id===id);
const coffeeById=id=>D.coffees.find(c=>c.id===id);
const setupById=id=>D.setups.find(s=>s.id===id);
const brewById=id=>D.brews.find(b=>b.id===id);
const cupById=id=>D.cups.find(c=>c.id===id);
function originLine(c){if(!c||!c.origin)return '';const o=c.origin;return [o.region||o.country,o.process,o.variety].filter(Boolean).join(' · ')}
function brewRecipe(b){return `${b.grind??'—'} grind · ${b.doseG??'—'}g → ${b.waterG??'—'}g · ${fmtTime(b.timeSec)}`}
function fmtWhen(iso){if(!iso)return '';const d=new Date(iso);const days=Math.floor((Date.now()-d)/864e5);
  if(days<1)return 'today';if(days===1)return 'yesterday';if(days<7)return days+'d ago';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function restState(c){if(!c.roastDate)return '';
  const days=Math.floor((Date.now()-new Date(c.roastDate+'T00:00'))/864e5);
  if(days<5)return `resting — ${5-days}d to go`;
  if(days<=21)return 'in the window';
  return `${days-21}d past its window`;}
const c2f=c=>c*9/5+32, f2c=f=>(f-32)*5/9;
const tempUnit=()=>getPref('tempUnit','C')==='F'?'F':'C';
const fmtTime=s=>s==null?'—':`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const parseTime=str=>{const s=String(str).trim();if(!s)return null;
  if(s.includes(':')){const[m,sec]=s.split(':');return Math.round((Number(m)||0)*60+(Number(sec)||0))}
  return Math.round(Number(s))};
const DESCRIPTORS=['floral','citrus','berry','stone fruit','tropical','chocolate','nutty','caramel','honey','spice','tea-like','fermented','roasted','vegetal'];
const reducedMotion=()=>!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ==== pure ==== *
 * ARCHITECTURE.md §9: "the taste model is the one piece of real logic whose
 * wrongness would be invisible" — a bad brief just looks like a mediocre
 * brief. Everything between this marker and its close is a pure function of
 * an explicit ledger: no DOM, no localStorage, no reference to the global D.
 * test/model.test.js slices exactly this region out of index.html and
 * evaluates it directly against fixture ledgers. Keep it that way — a new
 * helper that reaches for `D` or `document` belongs outside the markers. */

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// a free-text value passed as a JS string argument inside an onclick="..." attribute —
// esc() alone protects the HTML attribute but not the quotes JS itself needs escaped
const jsq=s=>`'${String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;')}'`;
function coffeeLabel(c){if(!c)return '—';return [c.roaster,c.name].filter(Boolean).join(' — ')||'Unnamed coffee'}

/* ---- the gentle join (ARCHITECTURE.md §4) ----
 * Roasters and places are the graph's nodes: each carries aka[], other
 * spellings folded into it. fold() is case/diacritics/punctuation only —
 * never doubled letters, never aliases (that's the resolver's fuzzy licence,
 * and it stayed with the trade side). An exact fold match joins silently; a
 * near match (small edit distance) asks once. Origin story fields never join. */
function fold(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  const dp=[];for(let i=0;i<=m;i++)dp.push([i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];}
function nodeNames(n){return [n.name,...(n.aka||[])]}
function matchNodes(nodes,typed){
  const t=fold(typed);if(!t)return {exact:null,near:null};
  let exact=null,near=null,bestD=99;
  for(const n of nodes){
    for(const nm of nodeNames(n)){
      const f=fold(nm);
      if(f===t){exact=n;break}
      const d=lev(f,t);
      if(d<=2&&Math.abs(f.length-t.length)<=3&&d<bestD){bestD=d;near=n}
    }
    if(exact)break;
  }
  return {exact,near:exact?null:near};
}
function joinAlias(node,typed){if(fold(typed)!==fold(node.name)){node.aka=node.aka||[];
  if(!node.aka.some(a=>fold(a)===fold(typed)))node.aka.push(typed);}}

/* ---- put-away, the core (the DOM/localStorage wrapper lives in store) ---- */
function putAwayCore(ledger,coll,id,now){const rec=(ledger[coll]||[]).find(x=>x.id===id);if(!rec)return false;
  rec.archived=true;rec.archivedAt=now;return true;}
function restoreCore(ledger,coll,id){const rec=(ledger[coll]||[]).find(x=>x.id===id);if(!rec)return false;
  rec.archived=false;rec.archivedAt=null;return true;}

/* ---- the taste model + the brief (ARCHITECTURE.md §5) ----
 * tasteModel(ledger) is a pure derivation, computed and memoized on write,
 * never stored (classic's reviewQueue pattern: derived state cannot
 * corrupt). Every figure carries its n and its evidence refs — a
 * recommendation never travels without its reasons, starting with the model
 * itself. brief(scope) renders three forms from one derivation: a page on
 * Carta paper, an embedded machine block (carta.brief/v1), and a plain-text
 * cut sized for pasting into a chat. Strictly offline, by construction —
 * nothing here makes a network call. */
function avg(a){return a.reduce((s,x)=>s+x,0)/a.length}
function median(a){const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:avg([s[m-1],s[m]])}
function bucket(cups,keyFn){
  const m={};
  cups.forEach(c=>{const k=keyFn(c);if(!k)return;(m[k]=m[k]||{value:k,scores:[],cupRefs:[]});m[k].scores.push(c.score);m[k].cupRefs.push(c.id)});
  return Object.values(m).map(x=>({value:x.value,weight:avg(x.scores),n:x.scores.length,cupRefs:x.cupRefs})).sort((a,b)=>b.weight-a.weight||b.n-a.n);
}
function bucketMulti(cups,keysFn){
  const m={};
  cups.forEach(c=>(keysFn(c)||[]).forEach(k=>{(m[k]=m[k]||{value:k,scores:[],cupRefs:[]});m[k].scores.push(c.score);m[k].cupRefs.push(c.id)}));
  return Object.values(m).map(x=>({value:x.value,weight:avg(x.scores),n:x.scores.length,cupRefs:x.cupRefs})).sort((a,b)=>b.weight-a.weight||b.n-a.n);
}
function tasteModel(ledger){
  const coffeeOf=id=>(ledger.coffees||[]).find(c=>c.id===id);
  const placeOf=id=>(ledger.places||[]).find(p=>p.id===id);
  const cups=(ledger.cups||[]).filter(c=>!c.archived&&c.score!=null);
  const barCups=cups.filter(c=>c.kind==='bar');

  // the bar — a floor to judge a café by, and the roasters that earn a return trip
  const floor=barCups.length?median(barCups.map(c=>c.score)):null;
  const byRoaster={};
  cups.forEach(c=>{
    const co=coffeeOf(c.coffeeRef);if(!co)return;
    const key=co.roasterRef||co.roaster;if(!key)return;
    (byRoaster[key]=byRoaster[key]||{roasterRef:co.roasterRef||null,name:co.roaster||'Unnamed roaster',scores:[],cupRefs:[]});
    byRoaster[key].scores.push(c.score);byRoaster[key].cupRefs.push(c.id);
  });
  const anchors=Object.values(byRoaster)
    .map(r=>({roasterRef:r.roasterRef,name:r.name,avg:avg(r.scores),n:r.scores.length,cupRefs:r.cupRefs}))
    .filter(r=>r.avg>=8&&r.n>=2)
    .sort((a,b)=>b.avg-a.avg||b.n-a.n);
  const nines=cups.filter(c=>c.score===9).map(c=>c.id);

  // the vector — what earns your taste, each value carrying its own weight and n
  const processes=bucket(cups,c=>{const co=coffeeOf(c.coffeeRef);return co&&co.origin&&co.origin.process});
  const origins=bucket(cups,c=>{const co=coffeeOf(c.coffeeRef);return co&&co.origin&&(co.origin.country||co.origin.region)});
  const descriptors=bucketMulti(cups,c=>c.descriptors);

  function scope(kind,id){
    let scoped=cups;
    if(kind==='place')scoped=cups.filter(c=>c.kind==='bar'&&c.placeRef===id);
    else if(kind==='city')scoped=cups.filter(c=>{if(c.kind!=='bar')return false;const p=placeOf(c.placeRef);return !!(p&&p.city&&fold(p.city)===fold(id))});
    else if(kind==='country')scoped=cups.filter(c=>{const co=coffeeOf(c.coffeeRef);return !!(co&&co.origin&&fold(co.origin.country||'')===fold(id))});
    else if(kind==='route')scoped=cups.filter(c=>{if(c.kind!=='bar')return false;const p=placeOf(c.placeRef);return !!(p&&p.city&&(id||[]).some(x=>fold(x)===fold(p.city)))});
    const had=[...new Set(scoped.map(c=>coffeeLabel(coffeeOf(c.coffeeRef))))];
    const knownRoasters=[...new Set(scoped.map(c=>{const co=coffeeOf(c.coffeeRef);return co&&co.roaster}).filter(Boolean))];
    return {had,knownRoasters};
  }
  return {bar:{floor,anchors,nines},vector:{processes,origins,descriptors},scope};
}
function briefPlainText(ledger,scopeKind,scopeId,tm){
  tm=tm||tasteModel(ledger);
  const lines=['MY COFFEE TASTE (from Carta)'];
  if(tm.bar.floor!=null)lines.push(`Baseline: I rate café coffee ${tm.bar.floor}+/9 as worth returning to.`);
  if(tm.bar.anchors.length)lines.push(`Roasters I keep reaching for: ${tm.bar.anchors.slice(0,5).map(a=>`${a.name} (avg ${a.avg.toFixed(1)}, ${a.n} cups)`).join('; ')}.`);
  if(tm.vector.processes.length)lines.push(`Processes I rate highest: ${tm.vector.processes.slice(0,4).map(p=>`${p.value} (${p.weight.toFixed(1)}/9, n=${p.n})`).join(', ')}.`);
  if(tm.vector.origins.length)lines.push(`Origins I rate highest: ${tm.vector.origins.slice(0,4).map(p=>`${p.value} (${p.weight.toFixed(1)}/9, n=${p.n})`).join(', ')}.`);
  if(tm.vector.descriptors.length)lines.push(`What I notice most in a 9: ${tm.vector.descriptors.slice(0,5).map(d=>d.value).join(', ')}.`);
  if(scopeKind){
    const s=tm.scope(scopeKind,scopeId);
    if(s.had.length)lines.push(`Already had ${scopeKind==='city'?'in '+scopeId:'here'} — don't recommend these again: ${s.had.join('; ')}.`);
    if(s.knownRoasters.length)lines.push(`Roasters I already know are here: ${s.knownRoasters.join(', ')}.`);
    lines.push(`Recommend specialty coffee ${scopeKind==='city'?'in '+scopeId:scopeKind==='country'?'from '+scopeId:'here'} that matches this taste and that I haven't already had.`);
  }else lines.push('Recommend specialty coffee that matches this taste.');
  let text=lines.join('\n');
  if(text.length>1500)text=text.slice(0,1497)+'…';
  return text;
}
function briefPageHTML(ledger,scopeKind,scopeId){
  const tm=tasteModel(ledger);
  const scoped=scopeKind?tm.scope(scopeKind,scopeId):{had:[],knownRoasters:[]};
  const heading=scopeKind==='city'?`Brief — ${scopeId}`:scopeKind==='country'?`Brief — ${scopeId}`:scopeKind==='place'?'Brief — this café':'Brief — your taste';
  const machine={version:'carta.brief/v1',generatedAt:new Date().toISOString(),
    scope:scopeKind?{kind:scopeKind,id:scopeId}:null,bar:tm.bar,vector:tm.vector,had:scoped.had,knownRoasters:scoped.knownRoasters};
  const machineJson=JSON.stringify(machine).replace(/<\/script/gi,'<\\/script');
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(heading)}</title>
<style>
body{background:#f2eee6;color:#241d18;font-family:Georgia,'Times New Roman',serif;max-width:640px;margin:40px auto;padding:0 24px;line-height:1.55}
h1{font-size:1.8rem;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.eyebrow{font-family:-apple-system,'Segoe UI',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#776b60;margin-bottom:10px}
.lede{color:#554a41;margin:0 0 24px}
h2{font-family:-apple-system,'Segoe UI',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#776b60;border-bottom:1px solid rgba(36,29,24,.13);padding-bottom:6px;margin:26px 0 10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(36,29,24,.13);font-size:15px}
.kv .k{color:#776b60;font-family:-apple-system,sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.foot{margin-top:30px;font-style:italic;color:#776b60;font-size:13px;border-top:1px solid rgba(36,29,24,.13);padding-top:12px}
</style></head>
<body>
<div class="eyebrow">Carta — the brief</div>
<h1>${esc(heading)}</h1>
<div class="lede">Generated ${esc(new Date().toLocaleDateString())}, argued from the record — with its reasons below, never a score without them.</div>
<h2>The bar</h2>
${tm.bar.floor!=null?`<div class="kv"><span class="k">Worth the walk</span><span>${tm.bar.floor}+ / 9</span></div>`:'<div class="lede" style="margin:0">Not enough café cups yet.</div>'}
${tm.bar.anchors.map(a=>`<div class="kv"><span class="k">${esc(a.name)}</span><span>${a.avg.toFixed(1)} avg · ${a.n} cups</span></div>`).join('')}
<h2>The vector</h2>
${tm.vector.processes.slice(0,5).map(p=>`<div class="kv"><span class="k">${esc(p.value)}</span><span>${p.weight.toFixed(1)} avg · ${p.n}</span></div>`).join('')}
${tm.vector.origins.slice(0,5).map(p=>`<div class="kv"><span class="k">${esc(p.value)}</span><span>${p.weight.toFixed(1)} avg · ${p.n}</span></div>`).join('')}
${scoped.had.length?`<h2>Already had ${scopeKind==='city'?'in '+esc(scopeId):'here'}</h2><div class="lede" style="margin:0">${scoped.had.map(esc).join(', ')}</div>`:''}
<div class="foot">Carried from Carta, offline. Nothing here called out on its own.</div>
<script type="application/json" id="carta-brief">${machineJson}<\/script>
</body></html>`;
}
/* ==== /pure ==== */

/* ============ the gentle join — the thin wrappers, coupled to the live ledger ============ */
function matchNode(coll,typed){return matchNodes(live(coll),typed)}
function mintRoasterIfNeeded(name,ref){if(ref)return ref;name=(name||'').trim();if(!name)return null;
  const r={id:uid(),createdAt:new Date().toISOString(),name,aka:[]};D.roasters.push(r);return r.id;}
function resolveRoaster(name){name=(name||'').trim();if(!name)return {name:'',ref:null};
  const m=matchNode('roasters',name);
  if(m.exact)return {name:m.exact.name,ref:m.exact.id};
  return {name,ref:mintRoasterIfNeeded(name,null)};}

/* ============ taste model, memoized on write ============ */
let _tasteDirty=true,_tasteCache=null;
function tasteModelMemo(){if(_tasteDirty||!_tasteCache){_tasteCache=tasteModel(D);_tasteDirty=false;}return _tasteCache;}

/* ============ router ============ */
const TABS=[{id:'journal',label:'Journal'},{id:'scout',label:'Scout'},{id:'atlas',label:'Atlas'},{id:'shelf',label:'Shelf'}];
const SUBS={journal:'The journal',scout:'Scout',atlas:'Atlas',shelf:'The shelf',country:'A country',city:'A city'};
let tab='journal';
// a chapter (country/city) is a screen, not a sheet — reached from the Atlas, one level
// deep, closed back to it. No stack: chapters don't nest into further chapters yet.
let pageView=null;
function go(t){tab=t;pageView=null;render()}
function openCountryChapter(name){pageView={kind:'country',id:name};render();window.scrollTo(0,0)}
function openCityChapter(city){pageView={kind:'city',id:city};render();window.scrollTo(0,0)}
function closePage(){pageView=null;render()}
let _lastScreenKey=null;
function render(){
  const lit=pageView?'atlas':tab;
  document.getElementById('who').textContent=pageView?SUBS[pageView.kind]:(SUBS[tab]||'');
  document.getElementById('tabs').innerHTML=TABS.map(t=>

/* ============ sheet plumbing (ported wholesale) ============ */
function openSheet(html){const s=document.getElementById('sheet');
  s.innerHTML='<div class="grab" aria-hidden="true"></div>'+html;
  s.classList.remove('dragging');s.style.transform='';document.getElementById('sheetbg').style.opacity='';
  s.classList.add('open');document.getElementById('sheetbg').classList.add('open');
  s.scrollTop=0;}
function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('sheetbg').classList.remove('open');stopTimer(false)}
(function initSheetDrag(){
  const sheet=document.getElementById('sheet');
  const bg=document.getElementById('sheetbg');
  let startY=0,dy=0,active=false,dragging=false,startT=0;
  const yOf=e=>e.touches?e.touches[0].clientY:e.clientY;
  const onGrab=e=>!!(e.target.closest&&e.target.closest('.grab'));
  function down(e){if(!sheet.classList.contains('open'))return;
    if(!onGrab(e)&&sheet.scrollTop>0)return;
    active=true;dragging=false;dy=0;startY=yOf(e);startT=Date.now();}
  function move(e){if(!active)return;
    dy=yOf(e)-startY;
    if(dy<=0){if(dragging){sheet.classList.remove('dragging');sheet.style.transform='';bg.style.opacity='';}dragging=false;dy=0;return}
    dragging=true;sheet.classList.add('dragging');
    if(e.cancelable)e.preventDefault();
    sheet.style.transform=`translateX(-50%) translateY(${dy}px)`;
    bg.style.opacity=String(Math.max(0,1-dy/(sheet.offsetHeight||600)));}
  function up(){if(!active)return;active=false;
    const h=sheet.offsetHeight||600;
    const velocity=dy/Math.max(1,Date.now()-startT);
    sheet.classList.remove('dragging');
    if(dragging&&(dy>h*0.28||velocity>0.55)){
      sheet.style.transform='translateX(-50%) translateY(100%)';bg.style.opacity='';
      setTimeout(()=>{closeSheet();sheet.style.transform='';bg.style.opacity='';},300);
    }else{sheet.style.transform='';bg.style.opacity=''}
    dragging=false;dy=0;}
  sheet.addEventListener('touchstart',down,{passive:true});
  sheet.addEventListener('touchmove',move,{passive:false});
  sheet.addEventListener('touchend',up);
  sheet.addEventListener('touchcancel',up);
  sheet.addEventListener('mousedown',down);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
})();

/* ============ toast (undo, when there's something to undo) ============ */
let _toastUndo=null;
function toast(m,undoFn){
  const t=document.getElementById('toast');
  _toastUndo=undoFn||null;
  t.innerHTML=esc(m)+(undoFn?' <span class="undo" onclick="_toastUndo&&_toastUndo();_toastUndo=null;document.getElementById(\'toast\').classList.remove(\'show\')">Undo</span>':'');
  t.classList.toggle('withundo',!!undoFn);
  t.classList.add('show');

/* ============ dial component (ported wholesale) ============
 * tap −/+ one step; press-and-hold auto-repeats and accelerates; tap the
 * number to type an exact value. opts:{kind:'time'} for m:ss, {corner} for
 * the °C/°F toggle, {hint} for a scale caption. */
const dialState={};
let editingDial=null,holdInt=null,holdTO=null;
function dial(id,label,unit,value,step,min,max,dp,opts){
  opts=opts||{};
  dialState[id]={v:value,step,min,max,dp:dp??(String(step).includes('.')?1:0),unit,kind:opts.kind||null};
  const corner=opts.corner?`<div class="dcorner">${opts.corner}</div>`:(opts.hint?`<div class="ticks">${opts.hint}</div>`:'');
  return `<div class="dial">${corner}<div class="l">${label}</div>
    <div class="v num tapedit" id="dv_${id}" onclick="editDial('${id}')">${fmtDial(id)}<span class="u">${unit}</span></div>
    <div class="ctl">
      <button type="button" onpointerdown="holdStart(event,'${id}',-1)">−</button>
      <button type="button" onpointerdown="holdStart(event,'${id}',1)">+</button>
    </div></div>`;
}
function fmtDial(id){const s=dialState[id];if(s.v==null)return '—';
  if(s.kind==='time')return fmtTime(s.v);
  return s.v.toFixed(s.dp).replace(/\.0+$/,'');}
function unitSpan(id){return `<span class="u">${dialState[id].unit}</span>`}
function redrawDial(id){const el=document.getElementById('dv_'+id);if(el)el.innerHTML=fmtDial(id)+unitSpan(id)}
function setDial(id,v){const s=dialState[id];
  if(v==null||isNaN(v)){redrawDial(id);return}
  if(s.min!=null)v=Math.max(s.min,v); if(s.max!=null)v=Math.min(s.max,v);
  s.v=Number(v.toFixed(s.dp)); redrawDial(id);}
function nudge(id,dir,mult){const s=dialState[id];
  setDial(id,(s.v==null?(s.min??0):s.v)+dir*s.step*(mult||1));
  if(navigator.vibrate)navigator.vibrate(3);}
function holdStop(){if(holdTO){clearTimeout(holdTO);holdTO=null}if(holdInt){clearInterval(holdInt);holdInt=null}
  window.removeEventListener('pointerup',holdStop);window.removeEventListener('pointercancel',holdStop);}
function holdStart(e,id,dir){
  e.preventDefault();
  if(editingDial){const de=document.getElementById('de_'+editingDial);if(de)de.blur();}
  holdStop();
  nudge(id,dir);
  let n=0;
  holdTO=setTimeout(()=>{ holdInt=setInterval(()=>{ n++;
    const mult=n<10?1:n<20?4:n<35?10:25;
    nudge(id,dir,mult); },60); },320);
  window.addEventListener('pointerup',holdStop);
  window.addEventListener('pointercancel',holdStop);
}
function editDial(id){
  if(editingDial===id)return;
  const s=dialState[id],el=document.getElementById('dv_'+id);
  editingDial=id;
  const cur=s.v==null?'':(s.kind==='time'?fmtTime(s.v):fmtDial(id));
  el.innerHTML=`<input class="dedit" id="de_${id}" inputmode="${s.kind==='time'?'text':'decimal'}" value="${cur}">`+unitSpan(id);
  const inp=document.getElementById('de_'+id); inp.focus(); inp.select();
  const commit=()=>{if(editingDial!==id)return; editingDial=null;
    const raw=inp.value;
    const v=s.kind==='time'?parseTime(raw):(raw.trim()===''?NaN:Number(raw));
    setDial(id,v);};
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ev.preventDefault();inp.blur();}
    else if(ev.key==='Escape'){editingDial=null;redrawDial(id);}});
}
function grindDialHTML(setup,value){
  const st=setup||{};
  const num=(x,d)=>x!=null&&x!==''&&!isNaN(Number(x))?Number(x):d;
  const step=num(st.grindStep,0.5)||0.5, min=num(st.grindMin,0), max=num(st.grindMax,null);
  const dp=String(step).includes('.')?1:0;
  const hint=(st.grindMin!=null&&st.grindMin!==''&&max!=null)?`${min}–${max} · ${step}`:'';
  return dial('grind','Grind',st.grindUnit||'',value,step,min,max,dp,{hint});
}
function tempDialHTML(tempC){
  const u=tempUnit(),F=u==='F';
  const v=tempC==null?null:(F?Math.round(c2f(tempC)):Number(tempC.toFixed(1)));
  return dial('temp','Temp','°'+u,v,1,F?140:60,F?212:100,F?0:1,{corner:tempCorner()});
}
function dialTempC(){const s=dialState.temp;if(!s||s.v==null)return null;
  return tempUnit()==='F'?Number(f2c(s.v).toFixed(1)):s.v;}
function tempCorner(){const u=tempUnit();
  return `<span class="ut ${u==='C'?'on':''}" onclick="setTempUnit('C')">°C</span><span class="ut ${u==='F'?'on':''}" onclick="setTempUnit('F')">°F</span>`;}
function setTempUnit(u){if(u!=='C'&&u!=='F')return;
  const c=dialTempC();setPref('tempUnit',u);
  const box=document.getElementById('dialbox_temp');if(box)box.innerHTML=tempDialHTML(c);}
function onSetupChange(){const setup=setupById(val('b_setup'));

function timerHTML(){return `<div class="timer">

/* ============ the door — paste or type, a card out, no adjudication ============
 * One field resolves into a coffee (roaster + name, gentle join on the
 * roaster), then asks where the cup is — café or home — and hands off to
 * whichever quick form that is. No resolver, no propose sheet: an exact
 * spelling joins silently, a near one asks once, everything else is new. */
let doorState=null;
function openDoor(){doorState={step:'text',text:'',roaster:'',name:'',o:{}};paintDoor();}
function doorParse(text){
  const parts=text.split(/\s+[—–-]\s+|,\s*/).map(s=>s.trim()).filter(Boolean);
  if(parts.length>=2)return {roaster:parts[0],name:parts.slice(1).join(', ')};
  return {roaster:'',name:text.trim()};
}
function paintDoor(){
  const s=doorState;

    return;

    openSheet(`<h3>Is this right?</h3>

      <label class="f"><span class="l">Farm</span><input type="text" id="d_farm" value="${esc(s.o.farm||'')}"></label>
      <label class="f"><span class="l">Producer</span><input type="text" id="d_producer" value="${esc(s.o.producer||'')}"></label>
      <label class="f"><span class="l">Variety</span><input type="text" id="d_variety" value="${esc(s.o.variety||'')}"></label>
      <label class="f"><span class="l">Process</span><input type="text" id="d_process" value="${esc(s.o.process||'')}"></label>
    </div></details>
    <button class="btn btn-primary" onclick="doorNext2()">Continue</button>`);
    return;
  }
  if(s.step==='join'){
    const m=s._roasterMatch;

    </div>`);
  }
}
function doorNext1(){doorState.text=val('d_text');const p=doorParse(doorState.text);

  doorState.roaster=p.roaster;doorState.name=p.name;doorState.step='confirm';paintDoor();}

  const last=editing||D.brews.filter(b=>b.coffeeRef===coffeeId).sort(byNew)[0]||D.brews.slice().sort(byNew)[0];
  const setup=noSetup?null:(editing?setupById(editing.setupId):(last?setupById(last.setupId):D.setups[D.setups.length-1]));
  const setups=D.setups.filter(x=>!x.archived||(setup&&x.id===setup.id));
  const techs=[...new Set(D.brews.map(x=>x.technique).filter(Boolean))];
  const setupSel=noSetup
    ?`<label class="f"><span class="l">Your grinder <span class="opt">named once, remembered always</span></span><input type="text" id="n_grinder" placeholder="Encore, Ode, a hand mill"></label>
      <label class="f"><span class="l">Your brewer</span><input type="text" id="n_brewer" placeholder="V60 · 02"></label>`
    :setups.length>1
      ?`<label class="f"><span class="l">Setup</span><select id="b_setup" onchange="onSetupChange()">
        ${setups.map(x=>`<option value="${x.id}" ${setup&&x.id===setup.id?'selected':''}>${esc(x.name)}${x.archived?' · retired':''}</option>`).join('')}
        </select></label>`
      :`<input type="hidden" id="b_setup" value="${setup?setup.id:''}">
      <div class="row" style="margin:14px 0 6px"><h2 style="margin:0;border:0;padding:0">The Setup</h2>
        <button class="btn mini btn-quiet" style="width:auto" onclick="closeSheet();openSetupForm('${setup?setup.id:''}')">Adjust</button></div>
      <div class="card">
        <div class="kv"><span class="k">Grinder</span><span class="v">${esc((setup&&setup.grinder)||'—')}</span></div>
        <div class="kv"><span class="k">Brewer</span><span class="v">${esc((setup&&setup.brewer)||'—')}</span></div>
      </div>`;
  openSheet(`
  <div class="eyebrow">${esc(coffeeLabel(coffee))}</div>
  <h3>${editing?'Correct the brew':(last?'Begin from the last cup':'The first brew')}</h3>
  <div class="sub">${last?'Every dial carried from your last brew.':'Fair defaults — turn one dial, taste, and the next brew remembers.'}</div>
  ${setupSel}
  <label class="f"><span class="l">Technique <span class="opt">optional</span></span>
    <input type="text" id="b_technique" list="techlist" value="${esc((last&&last.technique)||'')}" placeholder="V60 · Aeropress · espresso">
    <datalist id="techlist">${techs.map(t=>`<option value="${esc(t)}">`).join('')}</datalist></label>
  ${editing?'':timerHTML()}
  <div class="dialrow">
    <div id="dialbox_grind">${grindDialHTML(setup,last?last.grind:20)}</div>
    ${dial('dose','Dose','g',last?last.doseG:18,0.1,0,null,1)}
    ${dial('water','Water','g',last?last.waterG:36,1,0,null,0)}
    <div id="dialbox_temp">${tempDialHTML(last?last.tempC:94)}</div>
  </div>
  ${dial('time','Time','',last?last.timeSec:28,1,0,null,0,{kind:'time'})}
  <button class="btn btn-primary" onclick="saveBrewFlow('${coffeeId}','${editId||''}')">${editing?'Save changes':'To the cup →'}</button>
  ${editing?'':'<button class="btn btn-quiet" onclick="closeSheet()">Not now</button>'}`);
}
function saveBrewFlow(coffeeId,editId){
  let setupId=val('b_setup');
  if(!setupId&&!D.setups.length){
    const g=val('n_grinder'),br=val('n_brewer');
    if(!g&&!br){toast('Name your grinder or brewer — once is enough');return}
    const st={id:uid(),createdAt:new Date().toISOString(),name:[g,br].filter(Boolean).join(' · '),grinder:g,brewer:br};
    D.setups.push(st);setupId=st.id;
  }
  if(!setupId){toast('Refused: a brew requires a Setup');return}
  const fields={coffeeRef:coffeeId,setupId,technique:val('b_technique'),grind:dialState.grind.v,
    doseG:dialState.dose.v,waterG:dialState.water.v,tempC:dialTempC(),timeSec:dialState.time.v};
  const ex=editId?brewById(editId):null;
  if(ex){Object.assign(ex,fields,{updatedAt:new Date().toISOString()});save();stopTimer(true);closeSheet();go('journal');toast('Brew updated');return}
  const brew={id:uid(),createdAt:new Date().toISOString(),...fields};
  D.brews.push(brew);save();stopTimer(true);
  openImpression(brew);
}
function openImpression(brew){
  const coffee=coffeeById(brew.coffeeRef),setup=setupById(brew.setupId);
  openSheet(`<h3>What was in the cup?</h3>
  <div class="card">
    <div class="kv"><span class="k">Coffee</span><span class="v">${esc(coffeeLabel(coffee))}</span></div>
    <div class="kv"><span class="k">Brew</span><span class="v num">${brewRecipe(brew)}</span></div>
    ${setup?`<div class="kv"><span class="k">Setup</span><span class="v">${esc(setup.name||[setup.grinder,setup.brewer].filter(Boolean).join(' · '))}</span></div>`:''}
  </div>
  <label class="f"><span class="l">The cup</span>${hedonicRow()}</label>
  <label class="f"><span class="l">What you found <span class="opt">optional</span></span>${descRow()}</label>
  <label class="f"><span class="l">One honest line <span class="opt">optional</span></span><input type="text" id="ic_notes" placeholder="what you found"></label>
  <button class="btn btn-primary" onclick="saveHomeCup('${brew.id}')">Keep the cup</button>
  <button class="btn btn-quiet" onclick="saveHomeCup('${brew.id}',true)">Skip — the brew still counts</button>`);
}
function saveHomeCup(brewId,skip){
  if(!skip&&hedState==null){toast("A cup needs its reading — the 1–9 first. Or skip; that's honest too.");return}
  const brew=brewById(brewId);
  const cup={id:uid(),createdAt:new Date().toISOString(),at:new Date().toISOString(),kind:'home',
    coffeeRef:brew.coffeeRef,brewRef:brew.id,score:skip?null:hedState,line:skip?'':val('ic_notes'),descriptors:skip?[]:[...descState]};
  D.cups.push(cup);
  hedState=null;descState=new Set();
  save();closeSheet();go('journal');toast(skip?'The brew is on the record.':'Kept.');
}

function saveCoffeeForm(id){
  const fields={roaster:val('cf_roaster'),name:val('cf_name'),
    origin:{country:val('cf_country'),region:val('cf_region'),farm:val('cf_farm'),producer:val('cf_producer'),variety:val('cf_variety'),process:val('cf_process')},
    roastDate:val('cf_roastdate'),notes:val('cf_notes')};
  if(!fields.roaster&&!fields.name){toast('Name the roaster or the coffee');return}
  const rr=resolveRoaster(fields.roaster);fields.roasterRef=rr.ref;if(rr.name)fields.roaster=rr.name;
  if(id){Object.assign(coffeeById(id),fields,{updatedAt:new Date().toISOString()})}
  else{D.coffees.push({id:uid(),createdAt:new Date().toISOString(),...fields})}
  save();closeSheet();render();toast('Saved to the shelf');
}

 * ground read for its shape: contours at 1,000/2,000/3,000 m, cut from the
 * public-domain Terrarium elevation model, masked to each country's own
 * outline. Both are IN THE FILE — no tile, no fetch, nothing to be offline
 * from. Ported from classic verbatim; the lookup is not — classic keys the

function landPts(s){
  const pts=[];let i=0,x=0,y=0;
  const rd=()=>{let r=0,m=1,c;do{c=LAND_I[s[i++]];r+=(c&31)*m;m*=32}while(c&32);return (r&1)?-((r+1)/2):r/2};
  while(i<s.length){x+=rd();y+=rd();pts.push({lon:x/20,lat:y/20})}
  return pts;
}
let _landRingsCache={};
function landRingsRaw(key){
  if(key in _landRingsCache)return _landRingsCache[key];
  const enc=LANDS[key];
  return _landRingsCache[key]=enc?enc.split(';').map(landPts):null;
}
let _landTopoCache={};
function landTopoRaw(key){
  if(key in _landTopoCache)return _landTopoCache[key];
  const enc=LAND_TOPO[key];
  return _landTopoCache[key]=enc?enc.split(';').map(lv=>lv?lv.split(',').filter(Boolean).map(landPts):[]):null;
}
function landKey(name){const f=fold(name||'');return LAND_AKA[f]||f}
function landAnchor(key){
  const rs=landRingsRaw(key);if(!rs||!rs.length)return null;
  const big=rs.reduce((a,r)=>r.length>a.length?r:a,rs[0]);
  return {lat:big.reduce((a,p)=>a+p.lat,0)/big.length,lon:big.reduce((a,p)=>a+p.lon,0)/big.length};
}
const KMX=(lon,la0)=>lon*111.32*Math.cos(la0*Math.PI/180),KMY=la=>la*111.32;
const TOPO_KM=4500;   // classic's own refusal: a contour too wide to be a line is a smudge

// landKey -> the spelling you actually typed most, so the passport prints your words,
// never the folded lookup key ("united states of america" stays internal, unprinted)
function tastedCountryMap(){
  const m={};
  live('coffees').forEach(c=>{
    const raw=(c.origin&&c.origin.country||'').trim();if(!raw)return;
    const key=landKey(raw);
    (m[key]=m[key]||{label:raw,counts:{}});
    m[key].counts[raw]=(m[key].counts[raw]||0)+1;
  });
  Object.values(m).forEach(v=>{v.label=Object.entries(v.counts).sort((a,b)=>b[1]-a[1])[0][0]});
  return m;
}
/* the passport — every country LANDS holds a shape for, tasted ones washed and
 * tappable into a chapter, untasted ones a hairline invitation and nothing more
 * (ROADMAP.md Phase 3). One frame, one scale on both axes, fit to hold the whole
 * dataset — the walk down is a tap into a chapter, never a zoom on this frame.
 * Highland contours are ported and drawn through the exact same TOPO_KM gate
 * classic uses; at true world width they are honestly withheld, the same
 * refusal that keeps a street layer off a frame too wide to read at (never a
 * scope cut — the rule simply says no at this frame, faithfully). */
let _passportCache=null;
function passportSVG(){
  const tasted=tastedCountryMap();
  const keys=Object.keys(LANDS);
  const allPts=[];
  const rings={};
  keys.forEach(k=>{const rs=landRingsRaw(k);if(!rs)return;rings[k]=rs;rs.forEach(r=>r.forEach(p=>allPts.push(p)))});
  if(!allPts.length)return '';
  const la0=allPts.reduce((a,p)=>a+p.lat,0)/allPts.length;
  const px=p=>KMX(p.lon,la0),py=p=>KMY(p.lat);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  allPts.forEach(p=>{const x=px(p),y=py(p);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
  const W=336,P=4;
  const H=Math.round((W-2*P)*(y1-y0)/(x1-x0))+2*P;
  const s=Math.min((W-2*P)/(x1-x0),(H-2*P)/(y1-y0)),cx=(x0+x1)/2,cy=(y0+y1)/2;
  const X=p=>W/2+(px(p)-cx)*s,Y=p=>H/2-(py(p)-cy)*s;
  const n=v=>v.toFixed(1);
  const path=r=>{let d='';r.forEach((p,i)=>{d+=(i?'L':'M')+n(X(p))+' '+n(Y(p))});return d?d+'Z':''};
  const drawTopo=(x1-x0)<=TOPO_KM;   // the same gate classic gates on — see the header note
  let landHTML='',markHTML='';
  keys.forEach(k=>{
    const rs=rings[k];if(!rs)return;
    const d=rs.map(path).join(' ');if(!d)return;
    const t=tasted[k];
    if(t){
      const a=landAnchor(k);
      const lx=a?n(X(a)):n(W/2),ly=a?n(Y(a)):n(H/2);
      const topo=drawTopo?landTopoRaw(k):null;
      const topoHTML=topo?topo.map((lv,i)=>lv.map(r=>{const dd=path(r);return dd?`<path class="topo t${i+1}" d="${dd}"/>`:''}).join('')).join(''):'';
      markHTML+=`<g class="mk" onclick="openCountryChapter(${jsq(t.label)})">
        <path class="mk-land" d="${d}"/>${topoHTML}
        <text class="mk-lbl onland" x="${lx}" y="${ly}" text-anchor="middle">${esc(t.label)}</text>
      </g>`;
    }else landHTML+=`<path class="land" d="${d}"/>`;
  });
  return `<div class="plot-box"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${landHTML}${markHTML}</svg></div>`;
}

function cupRowHTML(cup){
  const coffee=coffeeById(cup.coffeeRef);
  const place=cup.kind==='bar'?placeById(cup.placeRef):null;
  const title=cup.kind==='bar'?(place?place.name:'A café'):coffeeLabel(coffee);
  const meta=[cup.kind==='bar'?coffeeLabel(coffee):'',fmtWhen(cup.at)].filter(Boolean).join(' · ');
  return `<button class="rowlink" onclick="openCupDetail('${cup.id}')">
    <span><span class="t">${esc(title)}</span><br><span class="m">${esc(meta)}</span></span>
    <span class="go score">${cup.score??'—'}</span></button>`;
}
function openCupDetail(id){
  const cup=cupById(id);if(!cup)return;
  const coffee=coffeeById(cup.coffeeRef);
  const place=cup.kind==='bar'?placeById(cup.placeRef):null;

  const setup=brew?setupById(brew.setupId):null;
  openSheet(`<h3>${cup.kind==='bar'?'A cup, out':'A cup, at home'}</h3>
  <div class="sub">${esc(fmtWhen(cup.at))}</div>
  <div class="card">
    <div class="kv"><span class="k">Coffee</span><span class="v">${esc(coffeeLabel(coffee))}</span></div>
    ${place?`<div class="kv"><span class="k">Café</span><span class="v">${esc(place.name)}</span></div>`:''}
    ${brew?`<div class="kv"><span class="k">Brew</span><span class="v num">${esc(brewRecipe(brew))}</span></div>`:''}
    ${setup?`<div class="kv"><span class="k">Setup</span><span class="v">${esc(setup.name||[setup.grinder,setup.brewer].filter(Boolean).join(' · '))}</span></div>`:''}
    <div class="kv"><span class="k">Score</span><span class="v score">${cup.score??'—'}</span></div>
    ${cup.descriptors&&cup.descriptors.length?`<div class="kv"><span class="k">Found</span><span class="v">${esc(cup.descriptors.join(', '))}</span></div>`:''}
  </div>
  ${cup.line?`<div class="note">${esc(cup.line)}</div>`:''}
  ${cup.archived
    ?`<button class="btn btn-quiet" onclick="restore('cups','${cup.id}');closeSheet()">Restore this cup</button>`
    :`<button class="btn btn-quiet" onclick="putAway('cups','${cup.id}');closeSheet()">Put away this cup</button>`}`);
}
function vJournal(){
  const cups=live('cups').sort(byNew);
  return `<div class="eyebrow">Journal</div>
  <div class="display">Every <em>cup</em></div>
  <div class="lede">${cups.length?'The record, newest first.':'Nothing logged yet.'}</div>
  ${cups.length?cups.map(cupRowHTML).join(''):'<div class="empty">Tap ＋ A cup to start the record.</div>'}
  ${archivedFold('cups',cupRowHTML,'Put away')}`;
}
function coffeeRowHTML(c){
  return `<button class="rowlink" onclick="openCoffeeDetail('${c.id}')">
    <span><span class="t">${esc(coffeeLabel(c))}</span><br><span class="m">${esc(originLine(c))}</span></span>
    <span class="go">→</span></button>`;
}
function openCoffeeDetail(id){
  const c=coffeeById(id);if(!c)return;
  const cups=D.cups.filter(x=>x.coffeeRef===id).sort(byNew);
  const rest=restState(c);
  openSheet(`<h3>${esc(coffeeLabel(c))}</h3>
  ${originLine(c)?`<div class="sub">${esc(originLine(c))}</div>`:''}
  <div class="card">
    ${c.roastDate?`<div class="kv"><span class="k">Roasted</span><span class="v">${esc(c.roastDate)}${rest?' · '+esc(rest):''}</span></div>`:''}
    ${c.notes?`<div class="kv"><span class="k">Notes</span><span class="v">${esc(c.notes)}</span></div>`:''}
    <div class="kv"><span class="k">Cups so far</span><span class="v num">${cups.length}</span></div>
  </div>
  <button class="btn btn-primary" onclick="closeSheet();openBrewFlow('${id}')">Brew it</button>
  <button class="btn btn-quiet" onclick="closeSheet();openCafeCup('${id}')">Had it at a café</button>
  <button class="btn btn-quiet" onclick="closeSheet();openCoffeeForm('${id}')">Edit</button>
  ${c.archived
    ?`<button class="btn btn-quiet" onclick="restore('coffees','${id}');closeSheet()">Restore</button>`
    :`<button class="btn btn-quiet" onclick="putAway('coffees','${id}');closeSheet()">Put away</button>`}`);
}
function vShelf(){
  const items=live('coffees').sort(byNew);
  return `<div class="eyebrow">Shelf</div>
  <div class="display">What you've <em>got</em></div>
  <div class="lede">Every coffee on hand — tap one to dial it in, or add what's not logged yet.</div>
  <button class="btn btn-quiet" style="margin-bottom:16px" onclick="openCoffeeForm()">＋ Add a coffee</button>
  ${items.length?items.map(coffeeRowHTML).join(''):'<div class="empty">Nothing on the shelf yet.</div>'}
  ${archivedFold('coffees',coffeeRowHTML,'Put away')}`;
}
/* ============ the hunt — the taste model, read; the brief, prepared ============ */
function vScout(){
  const cups=live('cups').filter(c=>c.score!=null);
  if(!cups.length){
    return `<div class="eyebrow">Scout</div>
    <div class="display">Not <em>yet</em></div>
    <div class="lede">The brief reads the record — log a few cups first, and there'll be something to argue from.</div>`;
  }
  const tm=tasteModelMemo();
  const cities=knownCities();
  return `<div class="eyebrow">Scout</div>
  <div class="display">Your taste, <em>argued</em></div>
  <div class="lede">${cups.length} cup${cups.length===1?'':'s'} on the record — here's what it argues, with its reasons.</div>
  <h2>The bar</h2>
  ${tm.bar.floor!=null?`<div class="kv"><span class="k">Worth the walk</span><span class="v num">${tm.bar.floor}+ / 9</span></div>`:'<div class="muted">Not enough café cups yet.</div>'}
  ${tm.bar.anchors.length?tm.bar.anchors.slice(0,5).map(a=>`<div class="kv"><span class="k">${esc(a.name)}</span><span class="v num">${a.avg.toFixed(1)} avg · ${a.n} cups</span></div>`).join(''):'<div class="muted">No anchors yet — a roaster earns one at 8+ over two cups.</div>'}
  <h2>Your vector</h2>
  ${vectorRowHTML('Process',tm.vector.processes)}
  ${vectorRowHTML('Origin',tm.vector.origins)}
  ${vectorRowHTML('Notice',tm.vector.descriptors)}
  <h2>The brief</h2>
  <div class="lede" style="margin-top:0">A plain-text cut sized for pasting into a chat, and a page to keep — scoped to a city if you've logged one.</div>
  <label class="f"><span class="l">Scope</span><select id="brief_scope">
    <option value="">Everywhere</option>
    ${cities.map(c=>`<option value="city:${esc(c)}">${esc(c)}</option>`).join('')}
  </select></label>
  <button class="btn btn-primary" onclick="openBrief()">Prepare the brief</button>`;
}
function vectorRowHTML(label,items){
  if(!items.length)return '';
  return `<div class="kv"><span class="k">${esc(label)}</span><span class="v">${items.slice(0,4).map(i=>`${esc(i.value)} (${i.weight.toFixed(1)})`).join(', ')}</span></div>`;
}
function openBrief(){
  const sel=val('brief_scope');
  let scopeKind=null,scopeId=null;
  if(sel.startsWith('city:')){scopeKind='city';scopeId=sel.slice(5);}
  const tm=tasteModelMemo();
  const text=briefPlainText(D,scopeKind,scopeId,tm);
  openSheet(`<h3>The brief</h3>
  <div class="sub">${scopeKind==='city'?esc(scopeId):'Everywhere'} — paste this into your AI chat.</div>
  <label class="f"><textarea id="brief_text" readonly style="min-height:220px">${esc(text)}</textarea></label>
  <div class="btnrow">
    <button class="btn btn-quiet" onclick="downloadBriefPage('${scopeKind||''}','${esc(scopeId||'')}')">Download the page</button>
    <button class="btn btn-primary" onclick="copyBrief()">Copy</button>
  </div>
  <div class="muted small" style="margin-top:10px">${text.length} characters. Strictly offline — nothing here calls out on its own.</div>`);
}
function copyBrief(){
  const t=document.getElementById('brief_text');
  t.focus();t.select();
  const done=()=>toast('Copied — paste it into your chat.');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(done,()=>{document.execCommand('copy');done();});
  else{document.execCommand('copy');done();}
}
function downloadBriefPage(scopeKind,scopeId){
  const html=briefPageHTML(D,scopeKind||null,scopeId||null);
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`carta-brief${scopeId?'-'+fold(scopeId).replace(/\s+/g,'-'):''}.html`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast('Downloaded — open it anywhere, forever.');
}
function vAtlas(){
  const tasted=tastedCountryMap();
  const countries=Object.values(tasted).sort((a,b)=>a.label.localeCompare(b.label));
  const cities=knownCities();
  if(!countries.length&&!cities.length){
    return `<div class="eyebrow">Atlas</div>
    <div class="display">The map <em>fills in</em></div>
    <div class="lede">Log a coffee with its country, or a café cup with its city, and the passport starts filling in.</div>`;
  }
  return `<div class="eyebrow">Atlas</div>
  <div class="display">The <em>passport</em></div>
  <div class="lede">${countries.length?`Tasted ${countries.length} countr${countries.length===1?'y':'ies'} so far.`:'Nothing tasted yet — the ground is drawn, waiting.'} The map remembers what the bags said.</div>
  ${passportSVG()}
  ${countries.length?`<h2>Tasted so far</h2>${countries.map(c=>`<button class="rowlink" onclick="openCountryChapter(${jsq(c.label)})"><span><span class="t">${esc(c.label)}</span></span><span class="go">→</span></button>`).join('')}`:''}
  ${cities.length?`<h2>Your cities</h2>${cities.map(c=>`<button class="rowlink" onclick="openCityChapter(${jsq(c)})"><span><span class="t">${esc(c)}</span></span><span class="go">→</span></button>`).join('')}`:''}`;
}
function vCountryChapter(label){
  const key=landKey(label);
  const coffees=live('coffees').filter(c=>c.origin&&landKey(c.origin.country||'')===key);
  const byRegion={};
  coffees.forEach(c=>{
    const raw=((c.origin&&c.origin.region)||'').trim();
    const rk=raw?fold(raw):'';
    (byRegion[rk]=byRegion[rk]||{label:raw||'Unspecified region',coffees:[],counts:{}});
    byRegion[rk].coffees.push(c);
    if(raw)byRegion[rk].counts[raw]=(byRegion[rk].counts[raw]||0)+1;
  });
  Object.values(byRegion).forEach(v=>{const es=Object.entries(v.counts);if(es.length)v.label=es.sort((a,b)=>b[1]-a[1])[0][0]});
  const regions=Object.values(byRegion).sort((a,b)=>b.coffees.length-a.coffees.length);
  const roasters=[...new Set(coffees.map(c=>c.roaster).filter(Boolean))];
  return `<button class="back" onclick="closePage()">← The passport</button>
  <div class="eyebrow">Country</div>
  <div class="display">${esc(label)}</div>
  <div class="lede">${coffees.length} coffee${coffees.length===1?'':'s'} on the record${roasters.length?', from '+roasters.length+' roaster'+(roasters.length===1?'':'s'):''}.</div>
  ${regions.length?`<h2>By region</h2>${regions.map(r=>`<div class="kv"><span class="k">${esc(r.label)}</span><span class="v num">${r.coffees.length}</span></div>`).join('')}`:''}
  <h2>The coffees</h2>
  ${coffees.length?coffees.slice().sort(byNew).map(c=>`<button class="rowlink" onclick="openCoffeeDetail('${c.id}')">
    <span><span class="t">${esc(coffeeLabel(c))}</span><br><span class="m">${esc(originLine(c))}</span></span>
    <span class="go">→</span></button>`).join(''):'<div class="empty">Nothing from here yet.</div>'}`;
}
function vCityChapter(city){
  const places=live('places').filter(p=>p.city&&fold(p.city)===fold(city));
  const placeIds=new Set(places.map(p=>p.id));
  const cups=live('cups').filter(c=>c.kind==='bar'&&c.score!=null&&placeIds.has(c.placeRef));
  const byPlace={};
  cups.forEach(c=>{(byPlace[c.placeRef]=byPlace[c.placeRef]||[]).push(c)});
  return `<button class="back" onclick="closePage()">← The passport</button>
  <div class="eyebrow">City</div>
  <div class="display">${esc(city)}</div>
  <div class="lede">${places.length} café${places.length===1?'':'s'} on the record.</div>
  <h2>Your bars</h2>
  ${places.length?places.map(p=>{
    const pc=byPlace[p.id]||[];
    const avg=pc.length?(pc.reduce((s,c)=>s+c.score,0)/pc.length).toFixed(1):null;
    return `<div class="kv"><span class="k">${esc(p.name)}</span><span class="v num">${avg?avg+' avg · '+pc.length+' cup'+(pc.length===1?'':'s'):'not scored yet'}</span></div>`;
  }).join(''):'<div class="empty">No cafés logged here yet.</div>'}`;
}

/* ============ theme — paper by day, dusk by night, following the device ============ */
const duskMQ=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  document.documentElement.setAttribute('data-theme',duskMQ.matches?'dusk':'paper');
  const mc=document.querySelector('meta[name=theme-color]');
  if(mc)mc.setAttribute('content',duskMQ.matches?'#171310':'#f2eee6');
}
duskMQ.addEventListener('change',applyTheme);

  {v:'7.0.0',d:"The skeleton. Carta 7 begins: the journal, the shelf, the door, the dial-in loop. Classic moved whole to classic/."},
];

applyTheme();
render();
</script>
