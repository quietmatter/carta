    if(full.status===200&&full.body.register){
      const merged=mergeRegister({entries:REG.entries,deleted:REG.deleted},full.body.register);
      REG.rev=full.body.rev;REG.entries=merged.entries;REG.deleted=merged.deleted;
      REG.dirty=JSON.stringify(merged)!==JSON.stringify({entries:full.body.register.entries||[],deleted:full.body.register.deleted||[]});
      saveReg();
    }
  }
  if(SYNC&&SYNC.founder===false){if(REG.dirty){REG.dirty=false;saveReg()}return} // read-only side of the pen
  let tries=0;
  while(REG.dirty&&tries<3){
    tries++;
    const r=await api('/api/cafes','PUT',{baseRev:REG.rev,register:{version:1,entries:REG.entries,deleted:REG.deleted}});
    if(r.status===200){REG.rev=r.body.rev;REG.dirty=false;saveReg()}
    else if(r.status===409){
      const merged=mergeRegister({entries:REG.entries,deleted:REG.deleted},r.body.register||{});
      REG.rev=r.body.rev;REG.entries=merged.entries;REG.deleted=merged.deleted;saveReg();
    }
    else if(penRefused(r)){REG.dirty=false;saveReg();break}
    else break;
  }
}
// The catalog rides the same heartbeat as the Register, one document per kind:
// poll each kind's meta, pull + merge when the server moved, push while dirty
// (409 → merge, retry). Writes go through the founder's pen exactly as the
// Register's do — a non-founder pulls only. An older server 404s /api/catalog
// and the whole spine stays device-local, exactly as the Register degrades —
// the atlas is still useful offline.
async function syncCatalog(){
  for(const kind of CAT_KINDS){
    const doc=CAT[kind];
    const meta=await api('/api/catalog/'+kind+'?meta=1');
    if(meta.status!==200)return;   // old server (404) — the endpoint is absent, skip the spine
    if(meta.body.rev>doc.rev){
      const full=await api('/api/catalog/'+kind);
      if(full.status===200&&full.body.catalog){
        const merged=mergeCatalog({entries:doc.entries,deleted:doc.deleted},full.body.catalog);
        doc.rev=full.body.rev;doc.entries=merged.entries;doc.deleted=merged.deleted;
        doc.dirty=JSON.stringify(merged)!==JSON.stringify({entries:full.body.catalog.entries||[],deleted:full.body.catalog.deleted||[]});
        saveDoc(kind);
      }
    }
    if(SYNC&&SYNC.founder===false){if(doc.dirty){doc.dirty=false;saveDoc(kind)}continue} // read-only side of the pen
    let tries=0;
    while(doc.dirty&&tries<3){
      tries++;
      const r=await api('/api/catalog/'+kind,'PUT',{baseRev:doc.rev,catalog:{version:1,entries:doc.entries,deleted:doc.deleted}});
      if(r.status===200){doc.rev=r.body.rev;doc.dirty=false;saveDoc(kind)}
      else if(r.status===409){
        const merged=mergeCatalog({entries:doc.entries,deleted:doc.deleted},r.body.catalog||{});
        doc.rev=r.body.rev;doc.entries=merged.entries;doc.deleted=merged.deleted;saveDoc(kind);
      }
      else if(penRefused(r)){doc.dirty=false;saveDoc(kind);break}
      else break;
    }
  }
}

async function api(path,method,body){
  let r;
  try{
    r=await fetch(SYNC.url.replace(/\/+$/,'')+path,{method:method||'GET',
      headers:{'Content-Type':'application/json',...(SYNC.token?{Authorization:'Bearer '+SYNC.token}:{})},
      body:body===undefined?undefined:JSON.stringify(body)});
  }catch(e){throw{offline:true}}
  const data=await r.json().catch(()=>null);
  if(r.status===401){authLost();throw{auth:true}}
  return {status:r.status,body:data};
}
function authLost(){if(!SYNC)return;SYNC.token=null;saveSync();syncState='auth';paintSync();toast('Sync signed out — sign in again from More')}

// Operate on the synced user's stored ledger directly, so sync stays correct
// even while the screen is showing someone else's ledger read-only.
function readOwnStored(){return readJSONLS(dataKey(SYNC.localId))||clone(blank)}
function writeOwnStored(led){
  localStorage.setItem(dataKey(SYNC.localId),JSON.stringify(led));
  if(viewingUserId===SYNC.localId){D=led;render()}
}
async function syncNow(manual){
  if(!SYNC||!SYNC.url)return;
  if(!SYNC.token){if(manual)openSyncSheet(true);return}
  if(!syncedHere()||syncBusy)return;
  syncBusy=true;syncState='syncing';paintSync();
  try{
    let local=readOwnStored();
    const meta=await api(`/api/ledgers/${SYNC.userId}?meta=1`);
    if(meta.status===200&&meta.body.rev>SYNC.rev){
      const full=await api(`/api/ledgers/${SYNC.userId}`);
      if(full.status===200&&full.body.ledger){
        const merged=mergeLedgers(local,full.body.ledger);
        SYNC.rev=full.body.rev;
        if(JSON.stringify(merged)!==JSON.stringify(full.body.ledger))SYNC.dirty=true;
        local=merged;writeOwnStored(local);
        toast('Ledger updated from server');
      }
    }
    let tries=0;
    while(SYNC.dirty&&tries<3){
      tries++;
      const r=await api(`/api/ledgers/${SYNC.userId}`,'PUT',{baseRev:SYNC.rev,ledger:local});
      if(r.status===200){SYNC.rev=r.body.rev;SYNC.dirty=false}
      else if(r.status===409){local=mergeLedgers(local,r.body.ledger);SYNC.rev=r.body.rev;writeOwnStored(local)}
      else break;
    }
    if(SYNC.dirty&&manual)toast('Sync conflict — will retry');
    await syncRegister();                              // the café Register, same heartbeat
    regSeed();                                         // pulled ledgers may have named new cafés
    catSeed();                                         // and new spine nodes — producers, lots, roasters
    catSeedGear();                                      // and new Gear — grinder/brewer models
    await syncCatalog();                               // the spine of the atlas, same heartbeat
    catRepoint();                                      // re-point local ledgers onto the merged ids
    gearRepoint();                                      // and Setups onto their Gear
    brewRepoint();                                      // and brews onto their Roast
    cupPrepRepoint();                                   // and cups onto their Preparation
    if(tab==='cafes'&&!document.getElementById('sheet').classList.contains('open'))render();
    try{
      const dir=await api('/api/users');
      if(dir.status===200){
        localStorage.setItem(DIR_KEY,JSON.stringify({fetchedAt:new Date().toISOString(),users:dir.body.users}));
        const me=dir.body.users.find(x=>x.id===SYNC.userId); // the directory now says who holds the pen — keep the session honest
        if(me&&me.founder!==undefined&&SYNC.founder!==!!me.founder){SYNC.founder=!!me.founder;saveSync()}
      }
    }catch(e){}
    SYNC.lastSyncAt=new Date().toISOString();syncState='idle';
  }catch(e){
    if(!(e&&e.auth)){syncState='offline';if(manual)toast('Server unreachable — working locally')}
  }finally{syncBusy=false;saveSync();paintSync()}
}

/* ============ friends — other people's cups ============ */
/* The observer's half of the app. Every ledger the active user can read —
 * other users on this device, everyone on the sync server — pools into one
 * stream of café cups and one ranked list of places. Strictly read-only:
 * built for the friend who wants direction, not a diary. */
function circleSources(){
  const out=USERS.users.filter(u=>u.id!==USERS.activeId).map(u=>({id:u.id,name:u.name,remote:false}));
  if(SYNC)remoteDirUsers().forEach(u=>out.push({id:u.id,name:u.name,remote:true}));
  return out;
}
const circleLedger=s=>s.remote?((readJSONLS(remoteKey(s.id))||{}).ledger||null):readJSONLS(dataKey(s.id));
function circleCups(){
  const cups=[];
  circleSources().forEach(s=>{const d=circleLedger(s);if(!d)return;
    (d.cups||[]).filter(c=>c.kind==='cafe').forEach(c=>cups.push({...c,_who:s.name,_src:s.id}))});
  return cups.sort(byNew);
}
// a café's page data may live on anyone's ledger — the Register first (the
// canonical entry), then the first per-user profile that carries substance
function circleProfile(shop){
  const own=cafeProfile(shop); if(own&&(own.address||own.palette||own.accent||own.site||own.notes))return own;
  for(const s of circleSources()){const d=circleLedger(s);if(!d)continue;
    const p=(d.cafes||[]).find(c=>normName(c.name)===normName(shop));
    if(p&&(p.address||p.palette||p.accent||p.site||p.notes))return p;}
  return own;
}
function circlePlaces(cups){
  const map={};
  cups.filter(c=>c.shop).forEach(c=>{const k=normName(c.shop);(map[k]=map[k]||{shop:c.shop.trim(),cups:[]}).cups.push(c)});
  return Object.values(map).map(p=>{
    p.n=p.cups.length; p.avg=avgHedonic(p.cups);
    p.people=[...new Set(p.cups.map(c=>c._who))];
    p.city=modeOf(p.cups.map(c=>c.city).filter(Boolean));
    p.usual=modeOf(p.cups.map(c=>c.drink).filter(Boolean));
    p.profile=circleProfile(p.shop);
    return p;
  }).sort((a,b)=>(Number(b.avg)||0)-(Number(a.avg)||0)||b.n-a.n);
}

/* --- the discovery engine: search, a lens on the map, whose taste to trust,
 * and what's worth the walk. All read-side over the pooled record; the only
 * thing it writes is the want-to-go list. Works solo too — the Register stands
 * in for a circle of one. --- */

// where you are, if you say so — in memory only, never stored or synced.
let myGeo=null,nearOn=false,cityLens=null,circleQuery='';
// the depth lens and its unfolded tails — held for the visit, folded again on
// leaving Find, so the unread never quietly become furniture.
let reachLens=0,reachTail={};
function setReachLens(d){reachLens=(reachLens===d?0:d);render()}
function haversine(la1,lo1,la2,lo2){const R=6371,r=Math.PI/180;
  const dla=(la2-la1)*r,dlo=(lo2-lo1)*r;
  const a=Math.sin(dla/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));}
const fmtDist=km=>km==null?'':km<1?`${Math.round(km*1000)} m`:km<10?`${km.toFixed(1)} km`:`${Math.round(km)} km`;
const distTo=p=>(!nearOn||!myGeo||!p||p.lat==null||p.lon==null)?null:haversine(myGeo.lat,myGeo.lon,p.lat,p.lon);
function requestGeo(){
  if(!navigator.geolocation){toast('No location on this device — the city filter still works');return}
  toast('Finding you…');
  navigator.geolocation.getCurrentPosition(
    pos=>{myGeo={lat:pos.coords.latitude,lon:pos.coords.longitude};nearOn=true;cityLens=null;render()},
    ()=>{nearOn=false;toast('Location unavailable — the city filter still works')},
    {enableHighAccuracy:false,timeout:8000,maximumAge:3e5});
}
function toggleNear(){if(nearOn){nearOn=false;render()}else requestGeo()}
// the cities your circle keeps — a lens to scope the whole tab to one town.
function circleCities(){
  const m={};const add=(c,w)=>{if(c&&c.trim())m[c.trim()]=(m[c.trim()]||0)+w};
  circleCups().forEach(c=>add(c.city,1));cafeCups().forEach(c=>add(c.city,1));
  REG.entries.forEach(e=>add(e.city,.5)); // a pin with no cups still counts, lighter
  return Object.keys(m).sort((a,b)=>m[b]-m[a]);
}
function setCityLens(c){cityLens=(normName(cityLens)===normName(c)?null:c);nearOn=false;render()}
const inLens=city=>!cityLens||normName(city)===normName(cityLens);

// whose 8 is your 8 — for each person you can read, how close your scores land
// on the cafés you have both kept. Mean absolute difference on the 1–9 scale;
// quiet until you share at least two places. Shape, not verdict.
let _affCache=null;
function tasteAffinity(){
  const myAvg={};
  cafeCups().forEach(c=>{if(c.shop&&c.hedonic!=null){const k=normName(c.shop);(myAvg[k]=myAvg[k]||[]).push(c.hedonic)}});
  Object.keys(myAvg).forEach(k=>myAvg[k]=myAvg[k].reduce((a,b)=>a+b,0)/myAvg[k].length);
  const out=[];
  circleSources().forEach(s=>{const d=circleLedger(s);if(!d)return;
    const theirs={};(d.cups||[]).forEach(c=>{if(c.kind==='cafe'&&c.shop&&c.hedonic!=null){const k=normName(c.shop);(theirs[k]=theirs[k]||[]).push(c.hedonic)}});
    const shared=Object.keys(theirs).filter(k=>myAvg[k]!=null);
    if(shared.length<2)return;
    let sum=0;shared.forEach(k=>{const t=theirs[k].reduce((a,b)=>a+b,0)/theirs[k].length;sum+=Math.abs(t-myAvg[k])});
    const delta=sum/shared.length;
    out.push({src:s.id,name:s.name,shared:shared.length,delta,
      close:delta<=1?'close':delta<=2?'near':'differs',w:Math.max(0,1-delta/4)});
  });
  return out.sort((a,b)=>a.delta-b.delta);
}
function affinityOf(srcId){
  if(!_affCache)_affCache=Object.fromEntries(tasteAffinity().map(a=>[a.src,a.w]));
  return _affCache[srcId]!=null?_affCache[srcId]:0;
}
// beans worth chasing — roasters and origins the circle scored, best average first.
function circleBeans(){
  const m={};
  circleCups().forEach(c=>{const o=circleLot(c);const label=(circleRoaster(c)||o.origin||o.country||'').trim();
    if(!label||c.hedonic==null)return;const k=normName(label);
    (m[k]=m[k]||{label,cups:[],who:new Set()});m[k].cups.push(c);m[k].who.add(c._who)});
  return Object.values(m).map(b=>({label:b.label,n:b.cups.length,avg:avgHedonic(b.cups),people:[...b.who]}))
    .sort((a,b)=>(Number(b.avg)||0)-(Number(a.avg)||0)||b.n-a.n);
}
// worth the walk, for you — cafés you haven't kept, ranked by the circle's scores
// weighted toward the people whose taste is close to yours; near mode sorts by
// distance and register-only pins join the tail as pure discovery.
function recommendations(){
  const mine=new Set(cafeCups().map(c=>normName(c.shop)).filter(Boolean));
  const byShop={};
  circleCups().filter(c=>c.shop).forEach(c=>{const k=normName(c.shop);(byShop[k]=byShop[k]||{shop:c.shop.trim(),cups:[]}).cups.push(c)});
  const recs=[];
  Object.values(byShop).forEach(p=>{
    if(mine.has(normName(p.shop)))return;
    const prof=circleProfile(p.shop);
    const city=modeOf(p.cups.map(c=>c.city).filter(Boolean))||(prof&&prof.city)||'';
    if(!inLens(city))return;
    let ws=0,wsum=0;const raters={};
    p.cups.forEach(c=>{if(c.hedonic==null)return;const a=affinityOf(c._src),w=.5+.5*a;ws+=c.hedonic*w;wsum+=w;
      if(!raters[c._who]||c.hedonic>raters[c._who].h)raters[c._who]={h:c.hedonic,a}});
    if(!wsum)return;
    const best=Object.entries(raters).map(([who,v])=>({who,...v})).sort((x,y)=>y.h-x.h)[0];
    recs.push({shop:p.shop,city,profile:prof,n:p.cups.length,avg:avgHedonic(p.cups),score:ws/wsum,
      dist:distTo(prof),best,again:p.cups.filter(c=>c.again===true).length});
  });
  REG.entries.forEach(e=>{const k=normName(e.name);if(mine.has(k)||byShop[k])return;if(!inLens(e.city||''))return;
    if(nearOn&&e.lat==null)return;

// Keep the stream current: re-pull the directory and any ledger whose rev moved.

let circleBusy=false,circleFreshAt=0;
async function circleRefresh(){
  if(!SYNC||!SYNC.token||circleBusy||Date.now()-circleFreshAt<60e3)return;
  circleBusy=true;circleFreshAt=Date.now();
  let changed=false;
  try{
    const dir=await api('/api/users');
    if(dir.status===200){
      if(JSON.stringify(dir.body.users)!==JSON.stringify(remoteDir().users))changed=true;
      localStorage.setItem(DIR_KEY,JSON.stringify({fetchedAt:new Date().toISOString(),users:dir.body.users}));
    }
    for(const u of remoteDirUsers()){
      const c=readJSONLS(remoteKey(u.id));
      const meta=await api(`/api/ledgers/${u.id}?meta=1`);
      if(meta.status!==200||(c&&c.rev===meta.body.rev))continue;
      const full=await api(`/api/ledgers/${u.id}`);
      if(full.status===200&&full.body.ledger){
        cacheRemote(u.id,{rev:full.body.rev,updatedAt:full.body.updatedAt,fetchedAt:new Date().toISOString(),ledger:full.body.ledger});changed=true;
      }
    }
  }catch(e){/* offline or signed out — the cached stream stands */}
  finally{circleBusy=false}
  if(changed)regSeed(); // fresh ledgers may carry cafés the Register hasn't met
  if(changed&&tab==='circle'&&!document.getElementById('sheet').classList.contains('open')&&document.activeElement!==document.getElementById('circleSearch'))render();
}

/* ============ today + the matching ============ */
/* The Today surface and the matching behind it. Spec v1 — three weight
 * classes: trait 60 · proximity 20 · circle 20. The traits are argued by the
 * places you keep (and the three you name to start — the signal); proximity
 * only counts once you've said where you stand (in memory, never stored);
 * the circle's cups weigh in through affinity. Every number carries its
 * reasons — no score without its signals — and until three café cups are
 * kept the reading speaks in bands, not numbers. A save waits under Want to
 * go; a skip steps a place back for two weeks and fades on its own — never a
 * veto; "fewer like it" tips the place's kind down on the same curve. The
 * bookkeeping lives in per-user prefs, so it exports and syncs. */
const SKIP_DAYS=14,LEAN_DAYS=14,FADE_DAYS=21;
const daysSince=iso=>iso?(Date.now()-new Date(iso))/864e5:null;
const agoWord=iso=>{const d=Math.floor(daysSince(iso)??0);return d<=0?'today':d===1?'yesterday':d<7?d+' days ago':d<14?'a week ago':Math.round(d/7)+' weeks ago'};
const reducedMotion=()=>!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let _mCache=null;
const mCache=()=>_mCache||(_mCache={});
function signalPicks(){const s=getPref('signal',null);return(s&&s.picks)||[]}
const coldNow=()=>!readOnly()&&!signalPicks().length&&!shopAgg().length; // no cups out, nothing named — the matching has nothing to read
const lowConf=()=>cafeCups().length<3;                                   // the early read — bands, not numbers
// what a place argues for itself: its tags, plus the reach facts standing on it
function candTraits(e){
  if(!e)return[];
  const out=[...(e.tags||[])],r=reachCompile(e);
  Object.keys(SEEN_FACTS).forEach(k=>{if(r.carry[k])out.push(SEEN_FACTS[k].label)});
  return out;
}
// the signal — {tagNorm:{label,w,from}}; every trait remembers the place that argued it
function signalTraits(){
  const c=mCache();if(c.sig)return c.sig;
  const m={};
  const add=(t,w,from)=>{const k=normName(t);if(!k)return;const x=m[k]||(m[k]={label:t,w:0,from});x.w+=w};
  signalPicks().forEach(p=>candTraits(regByName(p.name)).forEach(t=>add(t,2,`like ${p.name} — a place you named`)));
  shopAgg().forEach(s=>{const good=(Number(s.avg)||0)>=6;
    candTraits(regByName(s.shop)).forEach(t=>add(t,good?2:1,`like ${s.shop} — ${good?`your ${s.avg}/9 room`:'a place you keep'}`))});
  return c.sig=m;
}
function circByShop(){
  const c=mCache();if(c.circ)return c.circ;
  const m={};
  circleCups().forEach(x=>{if(x.shop&&x.hedonic!=null){const k=normName(x.shop);(m[k]=m[k]||[]).push(x)}});
  return c.circ=m;
}
function activeLeans(){
  const L=getPref('traitLeans',{})||{};
  return Object.keys(L).map(k=>({tag:k,...L[k],age:daysSince(L[k].at)})).filter(l=>l.age<FADE_DAYS).sort((a,b)=>a.age-b.age);
}
function skipInfo(shop){
  const rec=(getPref('placeSkips',{})||{})[normName(shop)];if(!rec)return null;
  const age=daysSince(rec.at);if(age>=FADE_DAYS)return null; // fully faded — no trace on the surfaces (the Record showed it going)
  return{...rec,age,active:age<SKIP_DAYS,back:age>=SKIP_DAYS};
}
const matchBand=s=>s>=84?'a strong read':s>=70?'promising':'worth a look';
function matchOf(shop){
  const c=mCache();c.m=c.m||{};const key=normName(shop);
  if(c.m[key])return c.m[key];
  const e=regByName(shop),sig=signalTraits(),traits=candTraits(e);
  const hits=[],seen=new Set();
  traits.forEach(t=>{const k=normName(t),s=sig[k];
    if(s&&!seen.has(k)){seen.add(k);hits.push({label:t,w:Math.min(3,s.w),from:s.from})}});
  hits.sort((a,b)=>b.w-a.w);
  const t=Math.round(60*Math.min(1,hits.reduce((a,h)=>a+h.w,0)/6));
  const km=distTo(e);
  const p=km==null?0:Math.round(20*Math.max(0,1-km/3.2));
  const oc=circByShop()[key]||[];
  const circ=Math.min(20,8+oc.reduce((a,x)=>a+2+4*affinityOf(x._src),0));
  let adj=0;const leans=[];
  activeLeans().forEach(l=>{if(l.age<LEAN_DAYS&&traits.some(x=>normName(x)===l.tag)){adj-=Math.round(8*(1-l.age/LEAN_DAYS));leans.push(l.label)}});
  adj=Math.max(adj,-18); // three leans of a kind is the cap — further skips deepen nothing
  const score=Math.round(Math.max(20,Math.min(97,t+p+circ+adj)));
  const signals=hits.slice(0,4).map(h=>({label:h.label,from:h.from}));
  if(km!=null)signals.push({label:`${fmtDist(km)} away`,from:'from where you stand'});
  if(oc.length){const who=[...new Set(oc.map(x=>x._who))];
    signals.push({label:`${oc.length} cup${oc.length>1?'s':''} in the circle`,from:`${who.slice(0,2).join(', ')}${who.length>2?' and others':''} — ${avgHedonic(oc)} avg`})}
  const whyParts=hits.slice(0,2).map(h=>h.label);
  if(km!=null)whyParts.push(fmtDist(km));
  const why=whyParts.length?whyParts.join(' · ')
    :(e&&e.notes)?`"${e.notes}"`
    :(e&&e.firstBy)?`in the Register · first entered by ${e.firstBy}`:'on the register — nothing said of it yet';
  const thin=!hits.length&&km==null&&!oc.length;
  return c.m[key]={score,band:matchBand(score),hits,signals,why,km,leans,thin};
}
/* --- the session: where you stood on the map, held for a week. Stored in
 * prefs so a device remembers across boots; after a week it steps back to a
 * plain suggestion — the reading keeps, the ceremony lets go. --- */
function discSess(){return getPref('findSess',null)||{view:'map',priority:'balanced',radius:5,sel:null,at:null}}
function saveSess(p){if(readOnly())return;setPref('findSess',{...discSess(),...p,at:new Date().toISOString()})}
const sessFresh=s=>!!(s&&s.at&&daysSince(s.at)<7&&s.sel);
// the candidates: every place on the record you haven't kept, scoped to the
// active lens; a said location narrows to a radius that widens itself when thin
function discCands(){
  const c=mCache();if(c.cands)return c.cands;
  // not candidates: places you keep, and the three you named — you love them already
  const mine=new Set([...shopAgg().map(s=>normName(s.shop)),...signalPicks().map(p=>normName(p.name))]);
  const byShop=circByShop();
  const names=new Map();
  REG.entries.forEach(e=>{const k=normName(e.name);if(!mine.has(k))names.set(k,e.name)});
  Object.keys(byShop).forEach(k=>{if(!mine.has(k)&&!names.has(k))names.set(k,byShop[k][0].shop)});
  let rows=[...names.values()].map(n=>{const e=regByName(n);return{shop:n,e,city:(e&&e.city)||'',km:distTo(e)}})
    .filter(r=>inLens(r.city));
  c.widened=false;
  if(nearOn&&myGeo){
    const within=r=>rows.filter(x=>x.km==null||x.km<=r);
    let rad=discSess().radius||5;
    while(within(rad).filter(x=>x.km!=null).length<3&&rad<5){rad=rad===1?2:5;c.widened=true}
    rows=within(rad);c.radiusEff=rad;
  }
  rows.forEach(r=>{r.m=matchOf(r.shop);r.skip=skipInfo(r.shop)});
  const near=discSess().priority==='near';
  rows.sort((a,b)=>near
    ?((a.km==null)-(b.km==null))||((a.km||0)-(b.km||0))||b.m.score-a.m.score
    :b.m.score-a.m.score);
  return c.cands=rows;
}
/* --- skips and leans: append a date, fade on a curve, nothing erased early --- */
let skipAsk=null; // {shop,kind} — the one open question after a skip
function discSkip(shop){

  const why=x=>{const fp=x.lot.fingerprint||{};const reasons=[];let num=null;
    const co=avgOn('country',fp.country||''),pr=avgOn('process',(fp.process&&fp.process.family)||'');
    if(co){reasons.push(`you average ${co.avg} on ${fp.country} cups · n=${co.n}`);num=co.avg}

    const at=(D.pours||[]).find(p=>p&&p.lotRef===x.id&&p.shop&&keptShops.has(normName(p.shop)));
    if(at)reasons.push(`poured at ${at.shop}, a place you keep`);
    if(x.hands>=2)reasons.push(`${x.hands} roasters carry it`);
    return {reasons,num:lc?null:num}};
  const mine=new Set(D.bags.map(b=>b&&b.lotRef?lotFwd(b.lotRef):null).filter(Boolean));
  return atlasLots().map(x=>({...x,w:why(x)})).filter(x=>x.w.reasons.length)
    .sort((a,b)=>(b.w.num||0)-(a.w.num||0)||b.hands-a.hands||(mine.has(a.id)?1:0)-(mine.has(b.id)?1:0))
    .slice(0,n||2);

        ${w.aging?`<div class="muted small serif" style="font-style:italic;margin-top:6px">${w.ask.n===0?`Saved ${agoWord(w.at)}, still unvisited — let it go?`:'Still waiting — the last ask. After this it stays quiet.'}</div>
        <div style="display:flex;gap:16px;margin-top:7px;align-items:baseline">
          <button class="text-action" onclick="event.stopPropagation();letGoWant(${jsq(w.n)})">Let it go</button>
          <button class="text-action" onclick="event.stopPropagation();keepWaiting(${jsq(w.n)})">${w.ask.n===0?'It stays — one last ask in four weeks':'It stays — no more asks'}</button>
        </div>`
        :readOnly()?'':`<div style="display:flex;gap:16px;margin-top:7px;align-items:baseline">
          <button class="text-action" onclick="event.stopPropagation();openPlace(${jsq(w.n)})">Why this →</button>
          <button class="text-action" style="margin-left:auto" onclick="event.stopPropagation();letGoWant(${jsq(w.n)})">Let it go</button>
        </div>`}
      </div>`}).join('')}
    <div class="muted small serif" style="font-style:italic;margin:0 2px 4px">Letting go is not a skip — no mark against the place; it simply stops waiting.</div>`
    :`<div class="empty">Nothing waiting. A save — from the map, the list, a café's page — lands here.</div>`;
  const S=getPref('placeSkips',{})||{};
  const skipRows=Object.values(S).map(rec=>{const info=skipInfo(rec.name);if(!info)return null;
    const dLeft=Math.max(1,Math.ceil(SKIP_DAYS-info.age));
    return info.active
      ?`<div class="gtab"><span class="nm num" style="width:58px">${dLeft}d left</span><span class="ds">${esc(rec.name)} — skipped ${agoWord(rec.at)}; fades in ${dLeft} day${dLeft===1?'':'s'}</span>${readOnly()?'':`<button class="text-action" style="flex:none" onclick="discUnskip(${jsq(rec.name)})">clear now</button>`}</div>`
      :`<div class="gtab"><span class="nm num" style="width:58px">faded</span><span class="ds">${esc(rec.name)} — the skip faded; it is back in the results, read again</span></div>`;
  }).filter(Boolean).join('');
  const skips=`<div class="section-head"><h2>Standing skips</h2></div>
    ${skipRows||`<div class="empty">No standing skips. A skip quiets a place for two weeks, waits here, and fades on its own.</div>`}
    <div class="muted small serif" style="font-style:italic;margin:6px 2px 0">A skip steps a place back — never its kind. When you want fewer of a kind, say so at the moment you skip.</div>`;
  const leansList=activeLeans();
  const leanRows=leansList.map(l=>{const active=l.age<LEAN_DAYS,dLeft=Math.max(1,Math.ceil(LEAN_DAYS-l.age));
    return active
      ?`<div class="gtab"><span class="nm num" style="width:58px">${dLeft}d left</span><span class="ds">${esc(l.label)} places weigh less — from skipping ${esc(l.from)}; fades in ${dLeft} day${dLeft===1?'':'s'}</span>${readOnly()?'':`<button class="text-action" style="flex:none" onclick="clearLean(${jsq(l.tag)})">clear now</button>`}</div>`
      :`<div class="gtab"><span class="nm num" style="width:58px">faded</span><span class="ds">${esc(l.label)} — the lean faded; full weight again</span></div>`}).join('');
  const cap=leansList.filter(l=>l.age<LEAN_DAYS).length>=3?`<div class="muted small serif" style="font-style:italic;margin:4px 2px 0">Three leans of a kind is the cap — further skips deepen nothing.</div>`:'';
  const leans=`<div class="section-head"><h2>Standing trait leans</h2></div>
    ${leanRows||`<div class="empty">No standing leans. "Fewer like it" tips a kind down for two weeks — it fades on the same curve as a skip.</div>`}${cap}`;
  return`<div class="section-head"><h2>Want to go</h2><span class="n-note num">${wants.length?'n='+wants.length:''}</span></div>`+wantsHTML+skips+leans;
}
const recordKeepingAny=()=>!!((D.cafeWants||[]).length||Object.keys(getPref('placeSkips',{})||{}).length||activeLeans().length);

/* ============ quick start ============ */
const firstRun=()=>!D.setups.length&&!D.bags.length&&!D.cups.length;
function openGuide(){
  const n=D.brews.length;
  openSheet(`
  <h3>Quick start</h3>
  <div class="sub">Two screens to set up. Ten seconds a brew after that. Read it once.</div>

  <h2 style="margin-top:8px">The first five minutes</h2>
  <ol class="steps">
    <li>
      <div class="t">Put a coffee on the shelf</div>
      <div class="b">Name it, or give its website and CARTA reads the roaster, a line, and the bag’s own colours. Free text is fine everywhere — resolution comes later, never at 7am. Only one field does real work: <strong>roast date</strong> drives the rest window. The rest can wait or stay blank.</div>
      <button class="go" onclick="closeSheet();openDoor()">Put one on now →</button>
    </li>
    <li>
      <div class="t">Brew — and name your tools, once</div>
      <div class="b">The first brew asks for your grinder and brewer in plain words; the Setup writes itself. The assembly matters because <em>grind is only comparable within one Setup</em> — change a burr, a basket, the water, and that's a new Setup, kept under More.</div>
    </li>

    </li>

    <div class="t">The anti-rule</div>

  </div>

  <h2>The daily loop</h2>
  <div class="loop">
    <div class="s"><div class="k">tap</div><div class="v">Log a brew</div></div>
    <div class="a">→</div>
    <div class="s"><div class="k">opens as</div><div class="v">last time</div></div>
    <div class="a">→</div>
    <div class="s"><div class="k">turn</div><div class="v">one dial</div></div>
    <div class="a">→</div>
    <div class="s"><div class="k">3 taps</div><div class="v">the cup</div></div>
  </div>
  <div class="muted small">The brew screen pre-fills from your last brew on that bag — grind, dose, water, temp, time, technique. Change the one thing you actually changed. Save.</div>

  <div class="card" style="margin-top:12px">
    <strong class="small">The timer</strong>
    <div class="muted small">Start it when you pull. Hit <strong>Use time ↓</strong> and it drops into the time dial. Don't transcribe numbers by hand.</div>
    <strong class="small" style="display:block;margin-top:10px">Technique is free text</strong>
    <div class="muted small">Type <em>soup</em>, <em>turbo</em>, <em>9-bar</em>, <em>allongé</em> — whatever it actually was. Past entries autocomplete. It's a node, not an enum: don't force today's brew into last year's vocabulary.</div>
    <strong class="small" style="display:block;margin-top:10px">Instrumentation — be honest</strong>
    <div class="muted small" style="margin-top:3px">

      <span class="chip">estimated</span> eyeballed ·
      <span class="chip">recalled</span> from memory
    </div>
    <div class="muted small" style="margin-top:5px">A recalled brew is a valid record. A recalled brew labelled <em>measured</em> is poison. Every claim this app ever makes carries this flag — lie here and you're lying to yourself in six months.</div>
  </div>

  <div class="card">
    <strong class="small">The cup — hedonic 1–9</strong>
    <div class="muted small">One tap, optional descriptors, optional line. No opinion? Hit <strong>Skip impression</strong> — the brew still records. Don't invent a score to satisfy a form.</div>
    <strong class="small" style="display:block;margin-top:10px">Café cup — as fast or as full as you like</strong>
    <div class="muted small">A shop and one tap is a valid record — always auto-flagged <span class="chip">recalled</span> and down-weighted honestly. But there's room now: style and a drink chip, the beans they poured — give the roaster's site and CARTA reads its brand — city, price, and an <em>order-again</em> verdict. Every café you log builds up in the <strong>Cafés</strong> tab — your passport, with your average, your usual, and what you've spent, per shop.</div>
    <strong class="small" style="display:block;margin-top:10px">The Register — one entry per café</strong>
    <div class="muted small">Name a shop and it enters the Register: one shared entry per café — name, city, pin, branding — read by every keeper on this device and on your sync server. Jane's Fighting Ships, for cafés. Anyone can amend an entry; a sighting fills blanks, never erases, and the entry remembers who entered it first. Cups stay yours — only the place is common knowledge.</div>
    <strong class="small" style="display:block;margin-top:10px">The reach — four depths, no ladder</strong>
    <div class="muted small">○ Counter · ◎ House · ◉ Roastery · ● Origin — how far back a cup reads, from the customer's side of the counter. A description of the café, never a score. You attest facts (the bag named, the methods on the menu), the depth follows from the record, and the newest sighting carries each fact. Tap any badge for the primer.</div>
  </div>

  <h2>The rooms</h2>
  <div class="muted small" style="margin:0 2px 8px">CARTA opens a room at a time — the ladder in <strong>More</strong> opens the rest whenever you ask. Nothing is ever taken away.</div>
  <div class="card">
    ${[['Today','The day\'s surface — pick up the brew, or start from the shelf. The instrument rides here.'],
       ['Atlas','The reading room. Search the chart, walk a lot from grower to bar, read the season for your taste, propose a sighting. The stream and the places worth the walk live here too.'],
       ['Record','The through-line. Every reading newest first, home and out side by side, the dial-in trace, what waits.'],
       ['More','The rooms, your counts, the export that leaves with you, your circle, sync, the changelog.']]
      .map(([nm,ds])=>`<div class="gtab"><span class="nm">${nm}</span><span class="ds">${ds}</span></div>`).join('')}
  </div>

  <h2>The rest chip</h2>
  <div class="muted small">On every bag with a roast date. An opinion, shown as one — a heuristic by roast level, not a measurement.</div>

    <tr><td>Light · Light-medium</td><td class="num">7–28 days</td></tr>
    <tr><td>Medium</td><td class="num">5–21 days</td></tr>
    <tr><td>Medium-dark · Dark</td><td class="num">3–14 days</td></tr>
  </table>
  <div class="small" style="line-height:2.1">
    <span class="chip resting num">resting · day 3</span> early — brew it anyway, that's data<br>
    <span class="chip window num">in window · day 11</span> the app thinks now<br>
    <span class="chip past num">day 34 · past window</span> past the heuristic, not past drinking
  </div>

  <h2>Reading the Trace</h2>
  <div class="card">
    <div class="small">Solid line — your grind, brew by brew, chronological. Hollow circles — that brew's hedonic on a 1–9 axis.</div>
    <div class="muted small" style="margin-top:6px">Read it for the shape of your hunting, not for truth. You're looking for one thing: <em>do you overshoot grind and undershoot temp?</em> Most people do.</div>
  </div>
  <div class="rule">
    <div class="t">Grind is only comparable within one Setup</div>
    <div class="b">The Trace will happily draw a line across two Setups if you brewed a bag on both. That line is meaningless. A grind setting without a Setup is a rumour — and one compared <em>across</em> Setups is a rumour with a chart.</div>
  </div>

  <h2>Export. Actually do it.</h2>

  </div>

    <div class="muted small" style="margin-top:6px">Offline-first, always: no server or no signal changes nothing. Edits queue and sync when the app comes back to the foreground. If two devices log at once, the record merges — both brews survive.</div>
  </div>
  <button class="btn btn-graphite" style="margin-top:10px" onclick="exportJSON()">Export ledger now</button>

  <h2>Phase 0 · the only gate that matters</h2>
  <div class="card">
    <div class="kv"><span class="k">Deadline</span><span class="v">day 60</span></div>

  </div>
  <div class="muted small">The tell for failure is two weeks of silence around week six — not a bad week, a quiet one. If that happens the answer isn't more schema. No schema saves an unused project.</div>
  <div class="muted small" style="margin-top:6px">And the honest test underneath the count: <em>has this changed a brewing decision you'd otherwise have made wrong?</em> If not by day 120, it's a diary. Fine — but not a business.</div>

  <div class="empty" style="margin-top:6px">We do not sell coffee. We keep the record.</div>
  <button class="btn btn-quiet" onclick="closeSheet()">Close</button>`);
}

/* ============ what's new ============ */
function relBlock(r,latest){
  return `<div class="rel${latest?' latest':''}">
    <div class="rel-h"><span class="rel-v">v${r.v}</span><span class="rel-d">${esc(r.date)}</span>${latest?'<span class="rel-new">new</span>':''}</div>
    <div class="rel-t">${esc(r.title)}</div>
    <ul class="rel-l">${r.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
  </div>`;
}
function openWhatsNew(auto){
  markVersionSeen();
  openSheet(`
  <h3>What's new</h3>
  <div class="sub">CARTA v${APP_VERSION} · the record, better kept${auto?' — here is what changed since you were last in.':''}</div>
  ${CHANGELOG.map((r,i)=>relBlock(r,i===0)).join('')}
  <div class="empty" style="margin-top:2px">We do not sell coffee. We keep the record.</div>
  <button class="btn btn-primary" onclick="closeSheet()">Got it</button>`);
}

/* ============ welcome — the way in (first-run home flow) ============
 * Before it asks anything, it says what CARTA is (the why), then asks the one
 * honest question — how do you take your coffee? — and opens the matching room.
 * The answer sets depth: Reading, Remembering, or Making. Nothing is locked;
 * the ladder on the Desk opens the rest. Gated on firstRun() so returning users
 * never see it; replayable from More (a replay never closes an open room). */
function needsWelcome(){return !readOnly()&&!getPref('onboarded',false)&&firstRun()}
function openWelcome(){renderWelcome();
  const w=document.getElementById('welcome');w.classList.add('open');w.scrollTop=0}
function closeWelcome(){document.getElementById('welcome').classList.remove('open')}
function renderWelcome(){const w=document.getElementById('welcome');if(!w)return;
  const door=(call,tt,dd,delay)=>`<button class="wc-item wc-rise" style="animation-delay:${delay}s" onclick="${call}">
      <span class="tx"><span class="tt">${tt}</span><span class="dd">${dd}</span></span>
      <span class="go">&rarr;</span></button>`;
  w.innerHTML=`<div class="wc">
  <div class="wc-top"><span class="wc-mark">CARTA</span></div>
  <div class="wc-body">
    <div class="wc-eyebrow wc-rise" style="animation-delay:.04s">The record of specialty coffee</div>
    <h1 class="wc-head wc-rise" style="animation-delay:.12s">One coffee, from the ground to the cup in your hand.</h1>
    <p class="wc-lede wc-rise" style="animation-delay:.24s">Every lot traced — farm, process, roast, pour. Your taste is a wash laid over the trace. <em>The record is yours; the atlas is everyone's.</em></p>
    <div class="wc-list">
      ${door(`finishWelcome(1,'atlas','Welcome. Read the record — that\\'s the whole ask.')`,'I read, mostly','The atlas opens. Keep nothing, ever.','.34')}
      ${door(`finishWelcome(2,'atlas','Welcome. A bar and one tap is a whole record.')`,'Someone else makes it','A bar and one tap is a whole record.','.41')}
      ${door(`finishWelcome(3,'today','Welcome. The instrument opens — begin from the last cup.')`,'I make my own','The instrument opens — begin from the last cup.','.48')}
    </div>
    <div class="wc-note wc-rise" style="animation-delay:.56s">Rooms open when you ask; nothing is ever taken away. This only sets where you land first.</div>
  </div>
  <div class="wc-foot wc-rise" style="animation-delay:.6s">
    <div class="qm-seal" style="margin:0"><span class="em" style="margin-top:0">We do not sell coffee. We keep the record.</span></div>
  </div>
  </div>`;}
// Commit the answer: open the room, never close one already open.
function finishWelcome(d,t,msg){
  setPref('depth',Math.max(depth(),d));
  setPref('onboarded',true);
  markVersionSeen();                       // welcomed users skip the "what's new" bump too
  closeWelcome();
  go(t);
  if(msg)toast(msg);
}

/* ============ boot ============ */
applyTheme();
regSeed(); // the Register meets every ledger already on this device
catSeed(); // and the catalog spine is normalised from the same ledgers (device-local, unrendered — step 1)
catSeedGear(); // Gear too — grinder/brewer models swept from every Setup
catRepoint(); // then the ledger leans on it: each bag/cup carries the id of its node (additive, reversible — step 2)
gearRepoint(); // and each Setup carries grinderRef/brewerRef
brewRepoint(); // and each brew reads its Roast through its bag
cupPrepRepoint(); // and each cup is a Reading over its Preparation — a Brew or a Pour
catRetire(); // then the flat roaster + structured origin (and a bag's roast level + date) retire under those refs — the node is the only copy now (step 3)
const lastBag=D.bags.slice().sort(byNew)[0];
if(lastBag)setAccent(lastBag.roastLevel);
// The deepest open room is where the day starts — Home, else Café, else Find.
tab=defaultTab(depth());
render();
// First run: the welcome flow (the why → the funnel → the one action). Returning
// users skip it and get the changelog on a version bump instead.
if(needsWelcome()){
  setTimeout(openWelcome,140);
}else if(lastSeenVersion()!==APP_VERSION){
  if(firstRun())markVersionSeen();
  else setTimeout(()=>openWhatsNew(true),350);
}
// Sync: on boot, when the network returns, and when the app comes back to the
// foreground (iOS PWAs get no background time — this is the sync heartbeat).
if(SYNC)setTimeout(()=>syncNow(false),400);
// Demo hook for the lot page — window.devSeed() from the console, or open with #seed-lot.
window.devSeed=devSeed;
window.devSeedOutturn=devSeedOutturn;
window.devSeedFingerprint=devSeedFingerprint;
window.devSeedMerge=devSeedMerge;
window.devSeedBatch=devSeedBatch;
window.devSeedChart=devSeedChart;
if(location.hash==='#seed-lot')setTimeout(devSeed,200);
if(location.hash==='#seed-outturn')setTimeout(devSeedOutturn,200);
if(location.hash==='#seed-fingerprint')setTimeout(devSeedFingerprint,200);
if(location.hash==='#seed-merge')setTimeout(devSeedMerge,200);
if(location.hash==='#seed-batch')setTimeout(devSeedBatch,200);
if(location.hash==='#seed-chart')setTimeout(devSeedChart,200);
if(location.hash==='#chart')setTimeout(openCurate,200);
window.addEventListener('online',()=>{syncNow(false);_mlDown=false;smapMount()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){applyTheme();syncNow(false)}});
</script>
