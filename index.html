function clearAskKey(){setPref('askKey','');setPref('askModel','');openAskKey();}
function openAsk(){
  if(!askKey()){
    openSheet(`<h3>Ask Carta</h3>
    <div class="sub">Carta sends your brief and a question to a model, on your behalf — this is the one thing here that calls out, and it needs your own key first.</div>
    <div class="empty">No key set yet.</div>
    <div class="btnrow">
      <button class="btn btn-quiet" onclick="copyPlainText(briefPlainText(D,null,null,tasteModelMemo()),'Copied — paste it into your chat.')">Copy the brief instead</button>
      <button class="btn btn-primary" onclick="openAskKey()">Set your key</button>
    </div>`);
    return;
  }
  openSheet(`<h3>Ask Carta</h3>
  <div class="sub">Sent with your taste, scoped the way you're actually asking.</div>
  <label class="f"><span class="l">Kind</span><select id="ask_kind">
    <option value="city">A city</option>
    <option value="neighborhood">A neighborhood</option>
    <option value="country">A country</option>
    <option value="route">A route</option>
    <option value="friend">A friend</option>
  </select></label>
  <label class="f"><span class="l">Where</span><input type="text" id="ask_dest" placeholder="Lisbon — or &quot;she likes what I like but darker&quot;"></label>
  <label class="f"><span class="l">Anything else? <span class="opt">optional</span></span><textarea id="ask_question" placeholder="Three days, mostly on foot…"></textarea></label>
  <button class="btn btn-primary" onclick="runAsk()">Ask Carta</button>
  <div id="ask_result"></div>
  <div class="muted small" style="margin-top:10px"><span onclick="openAskKey()" style="text-decoration:underline;cursor:pointer">Change your key</span></div>`);
}
async function callAskModel(prompt){
  const key=askKey();if(!key)throw new Error('Set your key first.');
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:askModel(),max_tokens:1024,messages:[{role:'user',content:prompt}]}),
  });
  if(!r.ok){
    let msg=`The model call failed (${r.status}).`;
    try{const j=await r.json();if(j&&j.error&&j.error.message)msg=j.error.message}catch(e){}
    throw new Error(msg);
  }
  const j=await r.json();
  return (j.content||[]).map(b=>b.text||'').join('');
}
async function geocodeCafe(name,neighborhood,city){
  const q=[name,neighborhood,city].filter(Boolean).join(', ');
  if(!q)return null;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
    if(!r.ok)return null;
    const list=await r.json();
    if(!list||!list.length)return null;
    const lat=Number(list[0].lat),lon=Number(list[0].lon);
    return (isFinite(lat)&&isFinite(lon))?{lat,lon}:null;
  }catch(e){return null}
}
let _askBusy=false;
async function runAsk(){
  if(_askBusy)return;
  const kind=val('ask_kind')||'city';
  const destination=val('ask_dest');
  const question=val('ask_question');
  if(!destination){toast('Where should Carta ask about?');return}
  const box=document.getElementById('ask_result');if(!box)return;
  _askBusy=true;
  box.innerHTML='<div class="muted" style="margin-top:12px">Asking…</div>';
  try{
    const tm=tasteModelMemo();
    let scopeKind=null,scopeId=null;
    const knownCity=knownCities().find(c=>fold(c)===fold(destination));
    if(kind==='city'&&knownCity){scopeKind='city';scopeId=knownCity}
    else if(kind==='country'){scopeKind='country';scopeId=destination}
    const briefText=briefPlainText(D,scopeKind,scopeId,tm);
    const prompt=askPromptText(briefText,kind,destination,question);
    const raw=await callAskModel(prompt);
    const parsed=parseAskJSON(raw);
    const findings=[];
    for(const f of parsed.findings){
      const geo=await geocodeCafe(f.name,f.neighborhood,f.city||(kind==='city'?destination:''));
      findings.push({id:uid(),name:f.name,neighborhood:f.neighborhood,city:f.city||(kind==='city'?destination:''),
        why:f.why,lat:geo?geo.lat:null,lon:geo?geo.lon:null,grounded:!!geo,status:null,placeRef:null});
    }
    const ask={id:uid(),createdAt:new Date().toISOString(),kind,destination,question,model:askModel(),findings};
    D.asks.unshift(ask);save();
    _askBusy=false;
    openAskResult(ask.id);
  }catch(e){
    _askBusy=false;
    const msg=(e&&e.message)||'Could not reach the model.';
    box.innerHTML=`<div class="empty">${esc(msg)}</div>
    <button class="btn btn-quiet" onclick="copyPlainText(briefPlainText(D,null,null,tasteModelMemo()),'Copied — paste it into your chat.')">Copy the brief instead</button>`;
  }
}

  }

/* the drawn plot — a box fit to hold a handful of points and nothing else, no
 * lands, no topo (§7's own name for this shape: "the drawn plot"). Shared by
 * the ask's pins and the city frame below — both are "a few points, fit to a
 * box," and the projection math is one thing, not two. */
function plotBox(points){
  const la0=points.reduce((a,p)=>a+p.lat,0)/points.length;
  const px=p=>KMX(p.lon,la0),py=p=>KMY(p.lat);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  points.forEach(p=>{const x=px(p),y=py(p);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
  const pad=Math.max(0.6,(x1-x0)*0.18,(y1-y0)*0.18);
  x0-=pad;x1+=pad;y0-=pad;y1+=pad;
  const W=336,P=4;
  const H=Math.max(160,Math.round((W-2*P)*(y1-y0)/Math.max(0.001,(x1-x0)))+2*P);
  const s=Math.min((W-2*P)/Math.max(0.001,x1-x0),(H-2*P)/Math.max(0.001,y1-y0)),cx=(x0+x1)/2,cy=(y0+y1)/2;
  return {W,H,X:p=>W/2+(px(p)-cx)*s,Y:p=>H/2-(py(p)-cy)*s};
}
/* the ask's pins — a suggestion is a ring until it's lived. A ring until a
 * status is set, filled once you've been, doubled once it's booked, faded
 * once skipped — never the ember, the passport's own law held here too. */
function cityPinsSVG(points,askId){
  const pts=(points||[]).filter(p=>p.lat!=null&&p.lon!=null&&isFinite(p.lat)&&isFinite(p.lon));
  if(!pts.length)return '';
  const box=plotBox(pts),n=v=>v.toFixed(1);
  const marks=pts.map(p=>`<g class="ask-pin${p.status?' st-'+p.status:''}" onclick="openAskFinding('${p.id}')"><circle cx="${n(box.X(p))}" cy="${n(box.Y(p))}" r="6"></circle></g>`).join('');
  return `<div class="plot-box"${askId?` id="ask_pins_${askId}"`:''}><svg viewBox="0 0 ${box.W} ${box.H}">${marks}</svg></div>`;
}

/* ============ the city frame's street layer (ROADMAP.md Phase 3, finished) ============
 * Real streets under a city chapter's café pins — an enhancement, never a
 * dependency (ARCHITECTURE.md §7): MapLibre GL renders OpenFreeMap's vector
 * tiles (OpenStreetMap data), repainted in Carta's own tokens, lazy-loaded
 * only once a map surface is on screen and the network answers. The drawn
 * plot always renders first from stored lat/lon and stands alone offline;
 * tiles fade in and TAKE OVER — the drawn pins step aside for real, pannable
 * markers, never the other way around. Ported craft from classic (the style,
 * the loader, the mount/destroy lifecycle) minus its ground mode, its atlas
 * edges layer and its lens — Carta 7 has one map surface, not classic's whole
 * unified system. */
const ML_JS='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js';
const ML_CSS='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css';
const ML_TILES='https://tiles.openfreemap.org/planet';
const ML_GLYPHS='https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf';
let _mlP=null,_mlDown=false,_smaps={},_smapCfg={},_smapCam={},_smapN=0,_smapMT=null;
function mlLoad(){
  if(window.maplibregl)return Promise.resolve();
  if(_mlP)return _mlP;
  return _mlP=new Promise((res,rej)=>{
    const css=document.createElement('link');css.rel='stylesheet';css.href=ML_CSS;document.head.appendChild(css);
    const s=document.createElement('script');s.src=ML_JS;
    const to=setTimeout(()=>{_mlP=null;rej(new Error('slow'))},8000);
    s.onload=()=>{clearTimeout(to);res()};
    s.onerror=()=>{clearTimeout(to);_mlP=null;rej(new Error('unreachable'))};
    document.head.appendChild(s);
  });
}
// the exact token hexes, by theme — a MapLibre style can't read CSS variables
function smapInk(){
  return document.documentElement.getAttribute('data-theme')==='dusk'
    ?{page:'#171310',sunk:'#2d241f',ink2:'#c8bcae',faint:'#5b574f',ember:'#e06b4f'}
    :{page:'#f2eee6',sunk:'#e9e3d8',ink2:'#554a41',faint:'#b8b5b0',ember:'#a63f2b'};
}
function smapStyle(){
  const c=smapInk();
  const road=cls=>['match',['get','class'],cls,true,false];
  return {version:8,glyphs:ML_GLYPHS,sources:{osm:{type:'vector',url:ML_TILES}},layers:[
    {id:'bg',type:'background',paint:{'background-color':c.page}},
    {id:'park',type:'fill',source:'osm','source-layer':'park',paint:{'fill-color':c.sunk,'fill-opacity':.5}},
    {id:'water',type:'fill',source:'osm','source-layer':'water',paint:{'fill-color':c.sunk}},
    {id:'road-minor',type:'line',source:'osm','source-layer':'transportation',filter:road(['minor','service','residential','living_street','unclassified']),layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':c.faint,'line-width':['interpolate',['linear'],['zoom'],11,.25,13,.5,15,.95,17,1.9],'line-opacity':.9}},
    {id:'road-major',type:'line',source:'osm','source-layer':'transportation',filter:road(['motorway','trunk','primary','secondary','tertiary']),layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':c.ink2,'line-width':['interpolate',['linear'],['zoom'],9,.4,12,.85,14,1.5,16,2.8,18,4.8]}},
    {id:'boundary',type:'line',source:'osm','source-layer':'boundary',filter:['all',['>=',['to-number',['get','admin_level']],4],['<=',['to-number',['get','admin_level']],10],['!=',['get','maritime'],1]],paint:{'line-color':c.ember,'line-opacity':.9,'line-dasharray':[3,2.2],'line-width':['interpolate',['linear'],['zoom'],8,.6,12,1.1,15,1.9]}},
    {id:'lbl-neigh',type:'symbol',source:'osm','source-layer':'place',filter:['match',['get','class'],['neighbourhood','suburb','quarter'],true,false],layout:{'text-field':['get','name'],'text-font':['Noto Sans Regular'],'text-transform':'uppercase','text-letter-spacing':.14,'text-size':['interpolate',['linear'],['zoom'],11,9.5,14,12.5],'text-max-width':7,'text-padding':6},paint:{'text-color':c.ink2,'text-halo-color':c.page,'text-halo-width':1.6,'text-halo-blur':.4}},
    {id:'lbl-city',type:'symbol',source:'osm','source-layer':'place',filter:['match',['get','class'],['city','town'],true,false],layout:{'text-field':['get','name'],'text-font':['Noto Sans Regular'],'text-letter-spacing':.04,'text-size':['interpolate',['linear'],['zoom'],9,12,13,17],'text-max-width':8},paint:{'text-color':c.ink2,'text-halo-color':c.page,'text-halo-width':1.4}},
  ]};
}
function smapPinEl(o){
  o=o||{};
  const el=document.createElement('div');el.className='pin';
  if(o.aria){el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label',o.aria);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}})}
  return el;
}
function smapView(cfg,pts){
  if(pts.length===1){cfg.center=[pts[0].lon,pts[0].lat];cfg.zoom=13.2;if(cfg.minZoom==null)cfg.minZoom=9}
  else{
    const lats=pts.map(p=>p.lat),lons=pts.map(p=>p.lon);
    cfg.bounds=[[Math.min(...lons),Math.min(...lats)],[Math.max(...lons),Math.max(...lats)]];
    // the camera floor: the map never opens, or zooms out, to world scale — derived
    // from the extent, roughly two stops above the fit (classic's own CHARTS.md rule)
    if(cfg.minZoom==null){
      const cos=Math.cos(((Math.min(...lats)+Math.max(...lats))/2)*Math.PI/180)||1;
      const span=Math.max(Math.max(...lats)-Math.min(...lats),(Math.max(...lons)-Math.min(...lons))*cos,.002);
      cfg.minZoom=Math.max(1,Math.min(11,Math.log2(360/span)-2.2));
    }
  }
  return cfg;
}
function smapReg(cfg){const id='smap'+(++_smapN);_smapCfg[id]=cfg;return id}
// mount whatever map surfaces the current paint carries; a surface inside a
// closed fold has no width, and a camera fitted to nothing is a camera
// pointed at the wrong ground — it boots once the card is actually open
function smapMount(){
  clearTimeout(_smapMT);
  _smapMT=setTimeout(()=>{
    Object.keys(_smaps).forEach(k=>{const s=_smaps[k];if(!s.el.isConnected){try{s.map.remove()}catch(e){}delete _smaps[k]}});
    document.querySelectorAll('[data-smap]').forEach(el=>{
      const cfg=_smapCfg[el.dataset.smap];
      if(cfg&&!el._smap&&el.clientWidth>0)smapBoot(el,cfg);
    });
  },250);
}
function smapDestroy(){
  Object.keys(_smaps).forEach(k=>{const s=_smaps[k];
    if(s.camKey)try{_smapCam[s.camKey]={center:s.map.getCenter(),zoom:s.map.getZoom()}}catch(e){}
    try{s.map.remove()}catch(e){}});
  _smaps={};_smapCfg={};
}
function smapRestyle(){Object.keys(_smaps).forEach(k=>{try{_smaps[k].map.setStyle(smapStyle())}catch(e){}})}
function smapBoot(el,cfg){
  el._smap=true;
  const id=el.dataset.smap;
  if(!navigator.onLine||_mlDown){smapNote(el,true);return}   // the plot stands; quiet about it
  mlLoad().then(()=>{
    if(!el.isConnected)return;
    const live=document.createElement('div');live.className='smap-live';
    el.appendChild(live);
    const camKey=cfg.camKey,cam=camKey?_smapCam[camKey]:null;
    const opts={container:live,style:smapStyle(),interactive:true,dragRotate:false,pitchWithRotate:false,cooperativeGestures:true,
      attributionControl:{compact:false,customAttribution:'© OpenMapTiles · © OpenStreetMap contributors'}};
    if(cam){opts.center=cam.center;opts.zoom=cam.zoom}
    else if(cfg.center){opts.center=cfg.center;opts.zoom=cfg.zoom}
    else{opts.bounds=cfg.bounds;opts.fitBoundsOptions={padding:40,maxZoom:15}}
    if(cfg.minZoom!=null)opts.minZoom=cfg.minZoom;
    let map;
    try{map=new maplibregl.Map(opts)}catch(e){smapFail(el);return}
    if(map.touchZoomRotate)map.touchZoomRotate.disableRotation();
    _smaps[id]={map,el,camKey};
    const to=setTimeout(()=>smapNote(el,true),3000);   // ~2.5s and the plot takes over — it never left
    map.on('load',()=>{
      clearTimeout(to);_mlDown=false;smapNote(el,false);
      try{map.getCanvas().setAttribute('tabindex','-1')}catch(e){}
      el.querySelectorAll(':scope>svg').forEach(p=>p.remove());   // the drawn pins hand over to live markers
      (cfg.marks?cfg.marks():[]).forEach(mk=>new maplibregl.Marker({element:mk.el,anchor:'center'}).setLngLat([mk.lon,mk.lat]).addTo(map));
      live.classList.add('in');
    });
    if(camKey)map.on('moveend',()=>{try{_smapCam[camKey]={center:map.getCenter(),zoom:map.getZoom()}}catch(e){}});
  }).catch(()=>{if(el.isConnected)smapFail(el)});
}
function smapFail(el){_mlDown=true;smapNote(el,true)}
// one quiet line, no red, no dialog: offline is a considered mode, not an
// error (VOICE.md). Retry re-attempts the tiles by hand.
function smapNote(el,on){
  let n=el.querySelector(':scope>.smap-note');
  if(!on){if(n)n.remove();return}
  if(n)return;
  n=document.createElement('div');n.className='smap-note';
  n.innerHTML=`<span>Streets unavailable — showing saved positions.</span><span class="text-action" onclick="smapRetry('${el.dataset.smap}')">Retry</span>`;
  el.appendChild(n);
}
function smapRetry(id){
  const el=document.querySelector(`[data-smap="${CSS.escape(id)}"]`);if(!el)return;
  _mlDown=false;el._smap=false;
  const s=_smaps[id];if(s){try{s.map.remove()}catch(e){}delete _smaps[id]}
  el.querySelectorAll(':scope>.smap-live,:scope>.smap-note').forEach(n=>n.remove());
  smapMount();
}
// the city chapter's own drawn plot — a café is a filled dot, tap opens its
// sheet; the live layer (above) takes over once tiles land, same markers,
// same tap. Places without a confirmed position yet just aren't drawn — see
// geocodeCityPlaces, which fills them in and repaints as each one resolves.
function cafePlotSVG(places,city){
  const pts=(places||[]).filter(p=>p.lat!=null&&p.lon!=null&&isFinite(p.lat)&&isFinite(p.lon));
  if(!pts.length)return '';
  const box=plotBox(pts),n=v=>v.toFixed(1);
  const marks=pts.map(p=>`<g class="cafe-mark" onclick="openPlaceSheet('${p.id}')"><circle cx="${n(box.X(p))}" cy="${n(box.Y(p))}" r="6"></circle></g>`).join('');
  const smapId=smapReg(smapView({camKey:'city|'+fold(city),marks:()=>pts.map(p=>{
    const el=smapPinEl({aria:p.name});el.onclick=()=>openPlaceSheet(p.id);
    return {lat:p.lat,lon:p.lon,el};
  })},pts));
  return `<div class="plot-box" data-smap="${smapId}"><svg viewBox="0 0 ${box.W} ${box.H}">${marks}</svg></div>`;
}
// geocoding a café is the same lookup the ask already grounds its suggestions
// with (geocodeCafe, Phase 7) — one keyless Nominatim door, two callers. Fills
// blanks only, tries each place at most once ever (`geocoded`), and paces
// itself a second apart per Nominatim's own usage policy — a city chapter
// is a handful of cafés, never a bulk job.
let _geocoding=new Set();
async function geocodeCityPlaces(city){
  const targets=live('places').filter(p=>p.city&&fold(p.city)===fold(city)&&p.lat==null&&!p.geocoded&&!_geocoding.has(p.id));
  for(const p of targets){
    _geocoding.add(p.id);
    const geo=await geocodeCafe(p.name,'',p.city);
    p.geocoded=true;
    if(geo){p.lat=geo.lat;p.lon=geo.lon}
    _geocoding.delete(p.id);
    save();
    if(pageView&&pageView.kind==='city'&&fold(pageView.id)===fold(city))render();
    await new Promise(r=>setTimeout(r,1100));
  }
}

/* ---- the import door — a coffee or a café card, read back in ---- */
let importPending=null;
function openImportCard(){
  importPending=null;
  openSheet(`<h3>Import a card</h3>
  <div class="sub">A coffee or a café someone sent you from their Carta.</div>

  <div id="import_preview"></div>`);
}
function importCardPicked(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const text=String(reader.result);
    const m=text.match(/<script type="application\/json" id="carta-card">([\s\S]*?)<\/script>/);
    if(!m){toast('That file doesn\'t look like a Carta card');return}
    let data;try{data=JSON.parse(m[1])}catch(err){toast('Could not read that card');return}
    if(!data||data.version!=='carta.card/v1'||(data.kind!=='coffee'&&data.kind!=='place')){
      toast('That card isn\'t a coffee or a café — nothing to add');return}
    importPending=data;
    const el=document.getElementById('import_preview');if(!el)return;
    el.innerHTML=data.kind==='coffee'
      ?`<div class="card"><div class="kv"><span class="k">Roaster</span><span class="v">${esc(data.data.roaster||'—')}</span></div><div class="kv"><span class="k">Name</span><span class="v">${esc(data.data.name||'—')}</span></div></div>
        <button class="btn btn-primary" onclick="confirmImportCard()">Add to my Carta</button>`
      :`<div class="card"><div class="kv"><span class="k">Café</span><span class="v">${esc(data.data.name||'—')}</span></div>${data.data.city?`<div class="kv"><span class="k">City</span><span class="v">${esc(data.data.city)}</span></div>`:''}</div>
        <button class="btn btn-primary" onclick="confirmImportCard()">Add to my Carta</button>`;
  };
  reader.onerror=()=>toast('Could not read that file');
  reader.readAsText(f);
}
function confirmImportCard(){
  if(!importPending)return;
  const d=importPending;
  if(d.kind==='coffee'){
    const rr=resolveRoaster(d.data.roaster||'');
    D.coffees.push({id:uid(),createdAt:new Date().toISOString(),roaster:rr.name||d.data.roaster||'',roasterRef:rr.ref,
      name:d.data.name||'',origin:d.data.origin||{},notes:d.data.notes||'',home:true});
    toast('Added to your shelf.');
  }else{
    const m=matchNode('places',d.data.name||'');
    if(m.exact){if(!m.exact.city&&d.data.city)m.exact.city=d.data.city}
    else D.places.push({id:uid(),createdAt:new Date().toISOString(),name:d.data.name||'',city:d.data.city||'',aka:[]});
    toast('Added to your record.');
  }
  importPending=null;save();closeSheet();render();
}

  const el=document.getElementById('classic_preview');if(!el)return;
  const rows=[['Roasters',m.newRoasters.length],['Places',m.newPlaces.length],['Setups',m.newSetups.length],
    ['Coffees',m.newCoffees.length],['Brews',m.newBrews.length],['Cups',m.newCups.length]];
  const total=rows.reduce((s,r)=>s+r[1],0);
  el.innerHTML=`<div class="card"><div class="kv"><span class="k">New records</span><span class="v num">${total}</span></div>
    ${rows.filter(r=>r[1]).map(r=>`<div class="kv"><span class="k">${r[0]}</span><span class="v num">${r[1]}</span></div>`).join('')}</div>
    ${total?`<button class="btn btn-primary" onclick="applyClassicImport()">Add ${total} record${total===1?'':'s'} to my Carta</button>`
      :'<div class="empty">Nothing new — already imported, or the file is empty.</div>'}`;
}
function applyClassicImport(){
  if(!classicPending)return;
  const m=classicPending;
  D.roasters.push(...m.newRoasters);D.places.push(...m.newPlaces);D.setups.push(...m.newSetups);
  D.coffees.push(...m.newCoffees);D.brews.push(...m.newBrews);D.cups.push(...m.newCups);
  classicPending=null;save();closeSheet();render();
  toast('Imported from classic.');
}
function vAtlas(){
  const tasted=tastedCountryMap();
  const countries=Object.values(tasted).sort((a,b)=>a.label.localeCompare(b.label));
  const cities=knownCities();
  if(!countries.length&&!cities.length){
    return `<div class="eyebrow">Atlas</div>
    <div class="display">The map <em>fills in</em></div>
    <div class="lede">Log a coffee with its country, or a café cup with its city, and the passport starts filling in.</div>`;
  }
  return `<div class="eyebrow">Atlas</div>
  <div class="display">The <em>passport</em></div>
  <div class="lede">${countries.length?`Tasted ${countries.length} countr${countries.length===1?'y':'ies'} so far.`:'Nothing tasted yet — the ground is drawn, waiting.'} The map remembers what the bags said.</div>
  ${passportSVG()}
  ${countries.length?`<button class="btn btn-quiet" style="margin-bottom:16px" onclick="sharePassportCard()">Share the passport</button>`:''}
  ${countries.length?`<h2>Tasted so far</h2>${countries.map(c=>`<button class="rowlink" onclick="openCountryChapter(${jsq(c.label)})"><span><span class="t">${esc(c.label)}</span></span><span class="go">→</span></button>`).join('')}`:''}
  ${cities.length?`<h2>Your cities</h2>${cities.map(c=>`<button class="rowlink" onclick="openCityChapter(${jsq(c)})"><span><span class="t">${esc(c)}</span></span><span class="go">→</span></button>`).join('')}`:''}`;
}
function vCountryChapter(label){
  const key=landKey(label);
  const coffees=live('coffees').filter(c=>c.origin&&landKey(c.origin.country||'')===key);
  const byRegion={};
  coffees.forEach(c=>{
    const raw=((c.origin&&c.origin.region)||'').trim();
    const rk=raw?fold(raw):'';
    (byRegion[rk]=byRegion[rk]||{label:raw||'Unspecified region',coffees:[],counts:{}});
    byRegion[rk].coffees.push(c);
    if(raw)byRegion[rk].counts[raw]=(byRegion[rk].counts[raw]||0)+1;
  });
  Object.values(byRegion).forEach(v=>{const es=Object.entries(v.counts);if(es.length)v.label=es.sort((a,b)=>b[1]-a[1])[0][0]});
  const regions=Object.values(byRegion).sort((a,b)=>b.coffees.length-a.coffees.length);
  const roasters=[...new Set(coffees.map(c=>c.roaster).filter(Boolean))];
  return `<button class="back" onclick="closePage()">← The passport</button>
  <div class="eyebrow">Country</div>
  <div class="display">${esc(label)}</div>
  <div class="lede">${coffees.length} coffee${coffees.length===1?'':'s'} on the record${roasters.length?', from '+roasters.length+' roaster'+(roasters.length===1?'':'s'):''}.</div>
  ${regions.length?`<h2>By region</h2>${regions.map(r=>`<div class="kv"><span class="k">${esc(r.label)}</span><span class="v num">${r.coffees.length}</span></div>`).join('')}`:''}
  <h2>The coffees</h2>
  ${coffees.length?coffees.slice().sort(byNew).map(c=>`<button class="rowlink" onclick="openCoffeeDetail('${c.id}')">
    <span><span class="t">${esc(coffeeLabel(c))}</span><br><span class="m">${esc(originLine(c))}</span></span>
    <span class="go">→</span></button>`).join(''):'<div class="empty">Nothing from here yet.</div>'}`;
}
function vCityChapter(city){
  const places=live('places').filter(p=>p.city&&fold(p.city)===fold(city));
  const placeIds=new Set(places.map(p=>p.id));
  const cups=live('cups').filter(c=>c.kind==='bar'&&c.score!=null&&placeIds.has(c.placeRef));
  const byPlace={};
  cups.forEach(c=>{(byPlace[c.placeRef]=byPlace[c.placeRef]||[]).push(c)});
  return `<button class="back" onclick="closePage()">← The passport</button>
  <div class="eyebrow">City</div>
  <div class="display">${esc(city)}</div>
  <div class="lede">${places.length} café${places.length===1?'':'s'} on the record.</div>
  ${cafePlotSVG(places,city)}
  <h2>Your bars</h2>
  ${places.length?places.map(p=>{
    const pc=byPlace[p.id]||[];
    const avg=pc.length?(pc.reduce((s,c)=>s+c.score,0)/pc.length).toFixed(1):null;
    return `<button class="rowlink" onclick="openPlaceSheet('${p.id}')">
      <span><span class="t">${esc(p.name)}</span><br><span class="m">${avg?avg+' avg · '+pc.length+' cup'+(pc.length===1?'':'s'):'not scored yet'}</span></span>
      <span class="go">→</span></button>`;
  }).join(''):'<div class="empty">No cafés logged here yet.</div>'}`;
}

/* ============ theme — paper by day, dusk by night, following the device ============ */
const duskMQ=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  document.documentElement.setAttribute('data-theme',duskMQ.matches?'dusk':'paper');
  const mc=document.querySelector('meta[name=theme-color]');
  if(mc)mc.setAttribute('content',duskMQ.matches?'#171310':'#f2eee6');
  smapRestyle();   // a live street map repaints to the theme in place
}
duskMQ.addEventListener('change',applyTheme);
