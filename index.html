/* ============ the shot comes to you (ROADMAP.md Phase 26) ============
 * Phases 24–25 made a shot pullable — a quiet second button three taps down
 * the door. This makes it the road: the Atlas offers the cup before it is
 * asked for, the shot is read as a plate rather than a row of dials, and
 * typing a brew steps off the main path to the Journal without losing a
 * field. Everything downstream still works with the watch off — station 08
 * is one tap from the Journal, and the shot screen is reachable from it. */
// a shot is not a record: it is read, written into a cup, and let go of. The
// cache is this session's, keyed by the shot's own Visualizer id.
let _vizCache={},_vizWaiting=null,_vizChecked=false,_vizCheckedAt=0;
function cacheShot(s){if(s&&s.id!=null)_vizCache[String(s.id)]=s;return s}
// the curve is what ensureShotCurve is guarding on, so a shot that arrived
// with one never asks for it twice — nothing more is needed to hold that.
// Missing this sitting's cache is not missing the shot: a shot once opened

}

/* ============ your taste — the hunt, folded into the Atlas ============

function vTaste(){
  const cups=live('cups').filter(c=>c.score!=null);

    tm.bar.floor!=null?`A café earns the walk at ${fig(`${tm.bar.floor} or better`,'openBarEvidence()')}.`:null,
    anchor?`You keep going back to ${fig(anchor.name,`openAnchorEvidence(${jsq(anchor.name)})`)}.`:null,
    notice?`What you notice first, and most, is ${fig(soft(notice.value),`openVectorEvidence('descriptors',${jsq(notice.value)})`)}${

/* ---- the reasons, one gesture away (the law: a score never travels without
 * them). Each sheet names the rule it read, then lists the cups themselves —
 * the evidence, not a restatement of the figure. ---- */
function evidenceSheet(title,sub,rows,note){
  openSheet(`<h3>${esc(title)}</h3>
  <div class="sub">${esc(sub)}</div>
  ${rows.length?rows.map(r=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)">

    </span>
    <span class="num" style="flex:none;font-size:20px;font-weight:600">${esc(r.v)}</span>
  </div>`).join(''):'<div class="empty">Nothing read yet.</div>'}
  <div class="note">${esc(note)}</div>`);
}
// a cup, said the way the evidence needs it: what it was, where and when
function cupEvidenceRow(c){
  const place=c.kind==='bar'?placeById(c.placeRef):null;
  return {t:coffeeLabel(coffeeById(c.coffeeRef)),
    m:[place?place.name:'at home',fmtWhen(c.at)].filter(Boolean).join(' · '),

function openBarEvidence(){
  const tm=tasteModelMemo();

    const cups=placeCups(p.id);
    return {p,cups,avg:placeAvg(p.id)};

function openAnchorEvidence(name){

const VECTOR_RULES={
  descriptors:'A descriptor earns its weight from the scores of the cups that carry it, never from how often you typed it.',
  processes:'A process is weighed by the cups made from it — the record states what it read on the bag, and nothing more.',
  origins:'An origin is weighed by its own cups. A country you have drunk twice is not ranked against one you have drunk twenty times.',
  roast:'Roast is read only where a bag or a menu stated it plainly. Unread cups are left out, never counted as medium.',

function openVectorEvidence(kind,value){
  const tm=tasteModelMemo();

    item?`${capFirst(words(item.n))} cup${item.n===1?'':'s'} carry it. This is their weight, and the cups themselves.`:'',
    cups.map(cupEvidenceRow),VECTOR_RULES[kind]||'');

/* ============ the brief — a screen, and what actually goes out ============

// the raw text opens in place: a disclosure that re-rendered the screen would

/* ============ sharing an exported page — a friend's phone, or a download ============
 * One door for every card and the brief alike. navigator.share with a real
 * File hits the OS share sheet where it exists (texts, AirDrop, anywhere) —
 * that's PIVOT.md's actual done-when, not a file sitting in Downloads. Falls
 * back to a plain download wherever share isn't offered, or is cancelled. */
function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

// the one door — content is either a plain prompt string (the ask) or a
// content-block array carrying an image plus a prompt (the menu's OCR). The
// ceiling is the caller's: an OCR is a list of lines, an ask is an argument,
// and 1024 tokens is what made the ask's answers read like a stub. A thinking
// block, on a model that reasons by default, has no .text — so the join below
// silently drops it and the parse only ever sees what was actually said.
async function callModel(content,maxTokens,signal,tools){
  const key=askKey();if(!key)throw new Error('Set your key first.');
  const body={model:askModel(),max_tokens:maxTokens||1024,messages:[{role:'user',content}]};
  if(tools)body.tools=tools;   // server-side tools (e.g. web search) — results land back in this same response
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(body),
    signal:signal||undefined,
  });

    let msg=`The model call failed (${r.status}).`;
    try{const j=await r.json();if(j&&j.error&&j.error.message)msg=j.error.message}catch(e){}
    throw new Error(msg);
  }

/* One lookup, every branch it knows about. Carta asked for limit=1 from Phase
 * 7 until Phase 15, which meant a café with several branches in one city got

 * because geocodeCityPlaces stamps `geocoded` whether or not it worked. A
 * wrong pin was permanent and there was no way in the app to say so.
 * Asking for five and reading their areas costs the same one call. */
async function lookupPlace(name,neighborhood,city){
  const q=[name,neighborhood,city].filter(Boolean).join(', ');
  if(!q)return [];
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
    if(!r.ok)return [];
    const list=await r.json();
    if(!Array.isArray(list))return [];
    return dedupeHits(list.map(x=>{
      const lat=Number(x.lat),lon=Number(x.lon);
      if(!isFinite(lat)||!isFinite(lon))return null;
      return {lat,lon,name:String(x.name||'').trim(),hood:hoodOf(x.address),city:cityOf(x.address)};
    }).filter(Boolean));
  }catch(e){return []}

// asked precisely — it supplies the model's neighborhood, so its lookup is
// rarely the ambiguous kind. It takes the first and now keeps the area too.
async function geocodeCafe(name,neighborhood,city){

// around it are mapped whether or not the shop itself is. A coordinate the
// keeper is vouching for (copied from a map that already has the place) never
// needs a name to confirm — it IS the confirmation.
async function reverseGeocode(lat,lon){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&lat=${lat}&lon=${lon}`,{headers:{'Accept':'application/json'}});
    if(!r.ok)return {hood:'',city:''};

  try{
    const tm=tasteModelMemo();

    for(const [line,pct] of askOpeningLines(tm,scope)){
      askSay(line,pct);
      await beat(reducedMotion()?200:620);
      if(_askCancel)return;
    }
    const briefText=briefPlainText(D,scope.kind,scope.id,tm);
    const prompt=askPromptText(briefText,kind,destination,question,reach);
    askSay('Asking, with your key, this once.',ASK_PCT_ASKING);
    const raw=await callAskModel(prompt);
    if(_askCancel)return;
    const parsed=parseAskJSON(raw);
    const named=(parsed.findings||[]).length+(parsed.mentions||[]).length
      +((parsed.plan&&parsed.plan.wildcard)?1:0);
    askSay(`Reading the answer back — ${words(named)} name${named===1?'':'s'}, ranked and argued.`,ASK_PCT_READBACK);
    await beat(reducedMotion()?200:700);

    // grounding pass was always the slow half, and now it is the readable half
    let placed_=0;

    const mentions=await groundNamed(parsed.mentions,near,say,step);

    // drip of resolutions keeps pushing it out and it only fires once, after
    // the last one.
    // a correction can rename the very chapter the keeper is standing on out
    // from under them — the garbage city they opened settles to a real one and
    // the list below the title quietly empties. Follow them there rather than
    // leaving the stale name on screen over a chapter with nothing left in it.
    const on=pageView&&((pageView.kind==='city'&&fold(pageView.id)===fold(city))
      ||(pageView.kind==='cafe'&&targets.some(t=>t.id===pageView.id)));
    if(on){
      clearTimeout(_geoRenderT);
      _geoRenderT=setTimeout(()=>{
        if(pageView&&pageView.kind==='city'&&fold(pageView.id)===fold(city)&&!cityPlaces(city).length){
          const moved=[...new Set(targets.map(t=>t.city).filter(c=>c&&fold(c)!==fold(city)))];
          if(moved.length===1){pageView=Object.assign({},pageView,{id:moved[0]});_citySheetUp=CITY_DETENT_DEFAULT}
          else{closePage();go('atlas');return}
        }
        render();
      },1400);
    }
    await new Promise(r=>setTimeout(r,1100));
  }
}
// one branch, settled: the position and the area the lookup actually stated.
// The area only ever comes from a confirmed position — an unplaced café is
// never given a neighborhood, because there would be nothing behind it.
// where it actually is, confirmed. A café's own name and city are what the
// keeper typed and can be anything — the neighborhood was always blank until
// a lookup filled it, and the city gets the same treatment now: a confirmed
// address outranks free text, the same way Phase 15 already trusted it for
// the neighborhood. A rural hit with no city-level component in its address
// leaves the field exactly as it was rather than blanking it.
function settlePlace(p,hit){
  p.lat=hit.lat;p.lon=hit.lon;
  if(hit.hood)p.neighborhood=hit.hood;
  if(hit.city)p.city=hit.city;
  delete p.branches;
}
// the keeper answering the only question they can answer
function pickBranch(placeId,i){
  const p=placeById(placeId);if(!p||!p.branches)return;
  const hit=p.branches[i];if(!hit)return;
  const was={lat:p.lat,lon:p.lon,neighborhood:p.neighborhood,city:p.city,branches:p.branches};
  const cityChanged=hit.city&&fold(hit.city)!==fold(was.city||'');
  settlePlace(p,hit);save();render();
  toast(`Placed in ${[hit.hood,cityChanged?hit.city:''].filter(Boolean).join(', ')||p.city||'the city'}.`,()=>{
    const q=placeById(placeId);if(!q)return;
    q.lat=was.lat;q.lon=was.lon;q.neighborhood=was.neighborhood;q.city=was.city;q.branches=was.branches;
    save();render();
  },'Undo');
}
/* what the café says about its own ground. Three states, and only the middle
 * one is a question: several of it in this city and the keeper has to say
 * which; placed, stating where and offering the way back; or unplaced, which
 * is a fact rather than a failure and is written as one. */
// the fallback OSM's own search can't reach: paste whatever the keeper's
// phone already gave them from Google or Apple Maps, and Carta reads the pin
// straight out of it (Phase 16). Offered wherever a name search has nothing
// to show for itself — unplaced, or ambiguous with no branch that's the real
// one — never as a replacement for the search that already works.
const mapLinkHTML=p=>`<label class="f" style="margin-top:10px"><span class="l">Or paste a map link</span>
  <input type="text" id="ml_${p.id}" placeholder="Copied from Google or Apple Maps…"></label>
  <button class="btn btn-quiet" style="min-height:40px" onclick="pastePlaceLink('${p.id}')">Place it</button>`;
function placeBranchHTML(p){
  if(p.branches&&p.branches.length)return `<div class="box" style="margin-top:20px">
    <div class="eyebrow" style="margin-bottom:4px">Which one</div>
    <div class="m">${esc(capFirst(words(p.branches.length)))} of these in ${esc(p.city||'this city')}. Only you know which you were in.</div>
    <div class="picks" style="margin-top:12px">
      ${p.branches.map((b,i)=>`<button class="pick" onclick="pickBranch('${p.id}',${i})">${esc(b.hood||'Unnamed area')}</button>`).join('')}
    </div>
    <div class="m" style="margin-top:12px">None of these? ${mapLinkHTML(p)}</div></div>`;
  // where it is, is already the eyebrow over its name — this line only has to
  // carry the way back, which is the thing that never existed before. "Placed"
  // was the one state that dropped the map-link box once settled — so a café
  // fixed by hand, precisely because a name search could never find it, had
  // no way back to that same fix once "not right?" tried that same search
  // again and failed the same way. The box stays available in every state.
  if(p.lat!=null)return `<div class="m" style="margin-top:16px">Placed · <span class="text-action" onclick="replaceCafe('${p.id}')">not right?</span></div>
    ${mapLinkHTML(p)}`;
  return `<div class="m" style="margin-top:16px">Not placed yet · <span class="text-action" onclick="replaceCafe('${p.id}')">look it up</span></div>
    ${mapLinkHTML(p)}`;
}
// paste, parse, confirm — the same settle as a branch pick, same undo. A link
// Carta can't read gets a plain refusal, never a guess dressed up as a pin.
async function pastePlaceLink(placeId){
  const p=placeById(placeId);if(!p)return;
  const input=document.getElementById('ml_'+placeId);
  const coord=parseMapLink(input&&input.value);
  if(!coord){toast('Couldn\'t read a position from that — paste the map\'s own link, not a shortened share link.');return}
  const was={lat:p.lat,lon:p.lon,neighborhood:p.neighborhood,city:p.city,branches:p.branches};
  const geo=await reverseGeocode(coord.lat,coord.lon);
  const q=placeById(placeId);if(!q)return;
  const cityChanged=geo.city&&fold(geo.city)!==fold(was.city||'');
  settlePlace(q,{lat:coord.lat,lon:coord.lon,hood:geo.hood,city:geo.city});
  save();render();
  toast(`Placed in ${[geo.hood,cityChanged?geo.city:''].filter(Boolean).join(', ')||q.city||'the city'}.`,()=>{
    const r=placeById(placeId);if(!r)return;
    r.lat=was.lat;r.lon=was.lon;r.neighborhood=was.neighborhood;r.city=was.city;r.branches=was.branches;
    save();render();
  },'Undo');
}
// a pin can be wrong without being ambiguous — a café that moved, or a lookup
// that matched the wrong thing outright. This is the way back: forget what was
// settled and ask again, which is the correction path Phase 7 never built.
async function replaceCafe(placeId){
  const p=placeById(placeId);if(!p)return;
  toast('Looking again…');
  const hits=await lookupPlace(p.name,'',p.city);
  const q=placeById(placeId);if(!q)return;
  if(!hits.length){toast('No address could be confirmed for that name.');return}
  q.lat=null;q.lon=null;q.geocoded=true;
  if(hits.length===1){
    const was=q.city,hit=hits[0];
    const cityChanged=hit.city&&fold(hit.city)!==fold(was||'');
    settlePlace(q,hit);save();render();
    toast(`Placed in ${[hit.hood,cityChanged?hit.city:''].filter(Boolean).join(', ')||q.city||'the city'}.`);
    return;
  }
  q.branches=hits;save();render();
}

/* ============ the return loop, without gamification (ROADMAP.md Phase 11) ============
 * A fact stated once, not a badge: the exact moment a country or city
 * first lands on the passport, one sentence plus the offer to share it
 * while the win is fresh — never a streak, a badge, or a percent-complete
 * (the fifth tripwire, ROADMAP.md §"the tripwires"). Bootstraps silently
 * against whatever's already tasted the first time this ever runs, so an
 * existing record — or a bulk classic import, which never calls this at
 * all — doesn't flood with "new!" for ground that was never actually new.
 * A brand-new keeper's very first country stays silent too: everything is
 * "new" on day one, and announcing each one of a first sitting's cups
 * reads exactly like the onboarding-reward pattern this phase refuses. */
function newGroundToast(kind,rawValue,fallbackMsg){
  const value=(rawValue||'').trim();
  if(!value){if(fallbackMsg)toast(fallbackMsg);return}
  const prefKey=kind==='country'?'seenCountries':'seenCities';
  const key=kind==='country'?landKey(value):fold(value);
  const currentKeys=kind==='country'?Object.keys(tastedCountryMap()):knownCities().map(fold);
  let seen=getPref(prefKey,null);
  if(!seen){setPref(prefKey,currentKeys);if(fallbackMsg)toast(fallbackMsg);return}
  if(seen.includes(key)){if(fallbackMsg)toast(fallbackMsg);return}
  setPref(prefKey,[...seen,key]);
  const label=kind==='country'?((tastedCountryMap()[key]||{}).label||value):value;
  toast(`New ground: ${label}.`,()=>sharePassportCard(),'Share the passport');
}

function importCardPicked(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const text=String(reader.result);
    const m=text.match(/<script type="application\/json" id="carta-card">([\s\S]*?)<\/script>/);
    if(!m){toast('That file doesn\'t look like a Carta card');return}
    let data;try{data=JSON.parse(m[1])}catch(err){toast('Could not read that card');return}
    if(!data||data.version!=='carta.card/v1'||(data.kind!=='coffee'&&data.kind!=='place')){
      toast('That card isn\'t a coffee or a café — nothing to add');return}
    importPending=data;
    const el=document.getElementById('import_preview');if(!el)return;
    const o=data.data.origin||{};
    el.innerHTML=`<div style="margin-top:14px">${ledgerHTML(data.kind==='coffee'
      ?[['Kind','A coffee'],['Roaster',data.data.roaster||''],['Coffee',data.data.name||''],
        ['Origin',[o.region||o.country,o.process].filter(Boolean).join(' · ')]]
      :[['Kind','A café'],['Café',data.data.name||''],['City',data.data.city||'']])}</div>
      <button class="btn btn-primary" style="margin-top:14px" onclick="confirmImportCard()">Add to my Carta</button>`;
  };
  reader.onerror=()=>toast('Could not read that file');
  reader.readAsText(f);
}
function confirmImportCard(){
  if(!importPending)return;
  const d=importPending;
  if(d.kind==='coffee'){
    const rr=resolveRoaster(d.data.roaster||'');
    D.coffees.push({id:uid(),createdAt:new Date().toISOString(),roaster:rr.name||d.data.roaster||'',roasterRef:rr.ref,
      name:d.data.name||'',origin:d.data.origin||{},notes:d.data.notes||'',home:true});
    toast('Added to your shelf.');
  }else{
    const m=matchNode('places',d.data.name||'');
    if(m.exact){if(!m.exact.city&&d.data.city)m.exact.city=d.data.city}
    else D.places.push({id:uid(),createdAt:new Date().toISOString(),name:d.data.name||'',city:d.data.city||'',aka:[]});
    toast('Added to your record.');
  }
  importPending=null;save();closeSheet();render();
}

/* ============ the Atlas — home, with the map in front ============
 * The passport is the first thing the app shows and the largest thing on the
 * screen: tasted countries inked into the ground, their names knocked out of
 * their own shapes, each one tappable straight into its chapter. Everything
 * under it is the record read against geography — your cities, what you've
 * tasted, and where the record argues you should go next.
 */
// numbers, said the way the rest of the app talks. Past ninety-nine a figure
// is a figure again — spelling it out would be affectation, not voice.
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function words(n){
  n=Math.round(n);
  if(n<0||n>99)return String(n);
  if(n<20)return ONES[n];
  return TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:'');
}
const capFirst=s=>s.charAt(0).toUpperCase()+s.slice(1);
const trimNum=n=>Number(n.toFixed(1)).toString();
// every cup the record can trace to a country, counted by that country
function countryCupCounts(){
  const m={};
  live('cups').forEach(c=>{
    const co=coffeeById(c.coffeeRef);
    const raw=co&&co.origin&&co.origin.country;
    if(!raw)return;
    const k=landKey(raw);m[k]=(m[k]||0)+1;
  });
  return m;
}
const placeCups=placeId=>live('cups').filter(c=>c.kind==='bar'&&c.placeRef===placeId&&c.score!=null);
function placeAvg(placeId){const cs=placeCups(placeId);return cs.length?cs.reduce((s,c)=>s+c.score,0)/cs.length:null}
const cityPlaces=city=>live('places').filter(p=>p.city&&fold(p.city)===fold(city));
// what a city amounts to, in one line: how many cafés, how many cups, and who
// leads — the same three facts the city's own sheet opens with
function cityMetaLine(city){
  const places=cityPlaces(city);
  const ids=new Set(places.map(p=>p.id));
  const cups=live('cups').filter(c=>c.kind==='bar'&&ids.has(c.placeRef));
  let lead=null;
  places.forEach(p=>{const a=placeAvg(p.id);if(a!=null&&(!lead||a>lead.avg))lead={name:p.name,avg:a}});
  return [`${places.length} café${places.length===1?'':'s'}`,
    `${cups.length} cup${cups.length===1?'':'s'}`,
    lead?`${lead.name} leads at ${trimNum(lead.avg)}`:null].filter(Boolean).join(' · ');
}
function cityRowHTML(city){
  return `<button class="lrow" onclick="openCityChapter(${jsq(city)})">
    ${plotThumbHTML(cityPlaces(city))}
    <span class="mid"><span class="t">${esc(city)}</span><span class="m">${esc(cityMetaLine(city))}</span></span>
    <span class="go">→</span></button>`;
}
/* ============ the Atlas — the passport, and the question on it ============
 * The ask was a button at the bottom of this screen, under everything the
 * record had already done. It is the first thing the screen says now (the Ask
 * Carta redesign): the passport is still the ground — it is the argument
 * every ask is made from — and the question stands on it, one field and one

/* the cup waiting on the passport (Phase 26). A stated fact with the cup

/* the invitation, one slab of paper below the fold — shown only while the

// the field on the passport hands off to the composer rather than firing the
// call: what kind of ask it is, and how far you'd go, are the difference
// between an answer and a list — so they are asked before the key is spent.
function askFromHome(){
  const el=document.getElementById('home_ask');
  if(el)askDraft.dest=el.value;
  openAskScreen();
}

/* ============ the walk down from a country ============
 * A country was a dead end: a shape, a count, a flat list of coffees. It is a
 * chapter now, and the chapter opens downward — the road states how far the
 * record actually follows this ground, then its regions, the hands that grew
 * it, the hands that roast from it and the rooms it pours in each open one
 * level further. Everything here is read off the greens the record already
 * holds; nothing is fetched, nothing is inferred to fill a line.
 */
const originOf=c=>(c&&c.origin)||{};
const growerOf=c=>String(originOf(c).farm||originOf(c).producer||'').trim();
const regionOf=c=>String(originOf(c).region||'').trim();
/* ---- the ground under a green (the thin ledger-coupled wrappers over originPin).
 * A farm is placed the same two ways a café is, and by the same doors: one
 * keyless Nominatim lookup, or a pin the keeper pastes off the map they already
 * have. Neither invents one — a farm the lookup does not actually name back is
 * left unplaced and simply listed, which is most smallholder farms and is not a
 * failure. Placing writes to the coffees that name that farm in that country,
 * which is the same fold the grower list on this page already groups by. */
const farmPin=c=>originPin(originOf(c));
const regionPin=list=>meanPin((list||[]).map(farmPin));
/* ---- the ground a coffee stands on, wherever a photo used to (Phase 27 —
 * photos retired, PIVOT.md decision #1 reopened: a full local ledger was one
 * lost phone from zero, and a photo per cup was the fastest way there).
 * Its own placed farm first, then the mean of its region's (or country's)
 * other placed farms, then nothing — the same fallback the walk down a
 * country already reads through, held to one coffee. */
function coffeeGroundPin(coffee){
  if(!coffee)return null;
  const own=farmPin(coffee);
  if(own)return own;
  const country=originOf(coffee).country;
  if(!country)return null;
  const region=regionOf(coffee);
  const siblings=countryCoffees(country).filter(c=>region?fold(regionOf(c))===fold(region):true);
  return regionPin(siblings);
}
// a list row's lead: the same soft silhouette a city row already carries
// (plotThumbHTML — too much map for a 44×60px row was Phase 17's own lesson;
// a shape is not), or the kind mark where the record can't place a coffee at all
function cupLeadHTML(cup,coffee){
  const at=coffee&&coffeeGroundPin(coffee);
  return at?plotThumbHTML([at]):`<span class="kind">${cup.kind==='bar'?'out':'home'}</span>`;
}
// the cup screen's hero, drawn as detailed as the record can defend: real
// terrain over a placed farm or region, the country's own washed shape where
// only that much is named, an honest empty state where the bag says nothing
function coffeeGroundHTML(coffee){
  const at=coffee&&coffeeGroundPin(coffee);
  if(at){
    const label=growerOf(coffee)||regionOf(coffee)||originOf(coffee).country||coffeeLabel(coffee);
    return streetsHTML([{id:coffee.id,name:label,lat:at.lat,lon:at.lon,score:1}],
      {terrain:true,names:true,zoom:farmPin(coffee)?12:8,dot:7,boxStyle:'height:300px',attribLift:2,
       plotWrap:'position:absolute;inset:0;padding:54px 40px',
       noteStyle:'position:absolute;left:0;right:0;bottom:0;z-index:3'});
  }
  const country=coffee&&originOf(coffee).country;
  if(country)return `<div class="mapbox passport" style="height:300px">
    <carta-belt style="position:absolute;inset:0" fit="cover" lift="on" labels="off" topo="on" tasted="${esc(country)}" focus="${esc(country)}"></carta-belt>
  </div>`;
  return `<div class="slot"><span>No origin named yet — the ground fills in once the bag says where.</span></div>`;
}
// the same ground, drawn static for a card that can't carry a custom element
// once it's standalone (the reason passportSVG() exists at all) — the soft
// shape, not the live streets, framed the way the passport's own box is
function coffeeCardMapHTML(coffee){
  const at=coffee&&coffeeGroundPin(coffee);
  if(!at)return '';
  const shape=cityShapePath([at]);
  if(!shape)return '';
  return `<div class="plot-box" style="padding:20px 20px 16px">
    <svg viewBox="${shape.viewBox}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:140px;display:block">
      <path d="${shape.path}" style="fill:#241d18;fill-opacity:.14;stroke:#241d18;stroke-opacity:.5;stroke-width:1.4;vector-effect:non-scaling-stroke"></path>
    </svg>
  </div>`;
}
function farmCoffees(country,farm){return countryCoffees(country).filter(c=>fold(growerOf(c))===fold(farm))}
// a region stands where its placed farms stand — and is drawn only where some do
function regionMarks(country){
  return groupStated(countryCoffees(country),regionOf).map(r=>{
    const at=regionPin(r.items);
    return at?{id:r.label,label:r.label,lat:at.lat,lon:at.lon}:null;
  }).filter(Boolean);
}
function setFarmPin(country,farm,at){
  farmCoffees(country,farm).forEach(c=>{c.origin=c.origin||{};c.origin.lat=at.lat;c.origin.lon=at.lon;c.origin.geocoded=true;c.updatedAt=new Date().toISOString()});
}
function clearFarmPin(country,farm){
  farmCoffees(country,farm).forEach(c=>{if(!c.origin)return;delete c.origin.lat;delete c.origin.lon;delete c.origin.geocoded;c.updatedAt=new Date().toISOString()});
}
let _farmBusy=false;
async function placeFarms(country,region){
  if(_farmBusy)return;_farmBusy=true;
  const inScope=c=>region?fold(regionOf(c))===fold(region):true;
  const farms=groupStated(countryCoffees(country).filter(inScope),growerOf)
    .filter(g=>!g.items.some(farmPin)&&!g.items.every(c=>originOf(c).geocoded));
  if(!farms.length){_farmBusy=false;toast('Every farm here is already placed, or none is named.');return}
  let put=0;
  for(const g of farms){
    toast(`Placing ${g.label}…`);
    const hits=await lookupPlace(g.label,region||regionOf(g.items[0]),country);
    const hit=hits.find(h=>namesBack(h,g.label));
    if(hit){setFarmPin(country,g.label,hit);put++}
    else farmCoffees(country,g.label).forEach(c=>{c.origin=c.origin||{};c.origin.geocoded=true});
    save();
    if(g!==farms[farms.length-1])await sleep(1100);
  }
  _farmBusy=false;render();
  toast(put?`${capFirst(words(put))} of ${words(farms.length)} placed.`:'None of these farms is on the map by name.');
}
const countryCoffees=name=>live('coffees').filter(c=>landKey(originOf(c).country||'')===landKey(name));
function cupsOfCoffees(list){const ids=new Set(list.map(c=>c.id));return live('cups').filter(c=>ids.has(c.coffeeRef))}
function avgOf(cups){const s=cups.filter(c=>c.score!=null);return s.length?s.reduce((a,c)=>a+c.score,0)/s.length:null}
// a stated value, grouped under the keeper's own commonest spelling of it —
// never a resolver, never a lookup key printed back at them (VOICE.md)
function groupStated(list,keyFn){
  const m={};
  list.forEach(x=>{
    const raw=String(keyFn(x)||'').trim();if(!raw)return;
    const k=fold(raw);
    (m[k]=m[k]||{key:k,label:raw,items:[],spellings:{}});
    m[k].items.push(x);m[k].spellings[raw]=(m[k].spellings[raw]||0)+1;
  });
  return Object.values(m).map(g=>{
    g.label=Object.entries(g.spellings).sort((a,b)=>b[1]-a[1])[0][0];
    g.cups=cupsOfCoffees(g.items);g.avg=avgOf(g.cups);
    return g;
  });
}
const byAvgDesc=(a,b)=>(b.avg==null?-1:b.avg)-(a.avg==null?-1:a.avg)||b.items.length-a.items.length;
function andList(words){
  if(words.length<2)return words[0]||'';
  return words.slice(0,-1).join(', ')+' and '+words[words.length-1];
}
// what a green's own list amounts to, in the line a chapter row carries
function greensMeta(g){
  const n=g.items.length,cups=g.cups.length;
  const lead=g.items.map(c=>({c,a:avgOf(cupsOfCoffees([c]))})).filter(x=>x.a!=null).sort((a,b)=>b.a-a.a)[0];
  return [`${words(n)} coffee${n===1?'':'s'}`,cups?`${words(cups)} cup${cups===1?'':'s'}`:null,
    lead?`${lead.c.name||coffeeLabel(lead.c)} leads`:null].filter(Boolean).join(' · ');
}
/* the road — six stations, and the plain fact of which ones this record
 * reaches. A hollow station is not a failure and never reads as one: a bag
 * that says nothing is a record that has been told less, not a lesser coffee. */
const ROAD_STATIONS=[
  {name:'Grown',has:c=>!!growerOf(c)},
  {name:'Processed',has:c=>!!String(originOf(c).process||'').trim()},
  {name:'Milled',has:c=>!!String(originOf(c).mill||'').trim()},
  {name:'Roasted',has:c=>!!String(c.roaster||'').trim()},
];
function roadStations(coffees,cups){
  const poured=new Set(cups.filter(c=>c.kind==='bar'&&c.placeRef).map(c=>c.placeRef));
  return ROAD_STATIONS.map(s=>({name:s.name,n:coffees.filter(s.has).length}))
    .concat([{name:'Poured',n:poured.size},{name:'Read',n:cups.length}]);
}
function roadHTML(st){
  const rail=(edge,joined)=>edge?'<i class="end"></i>':`<i class="${joined?'':'gap'}"></i>`;
  return `<div class="road">${st.map((s,i)=>{
    const on=s.n>0,prev=i>0?st[i-1].n>0:true,next=i<st.length-1?st[i+1].n>0:true;
    return `<div class="st${on?'':' off'}">
      <div class="rail">${rail(i===0,on&&prev)}<span class="mk${on?'':' off'}"></span>${rail(i===st.length-1,on&&next)}</div>
      <div class="n">${on?s.n:'—'}</div>
      <div class="l">${s.name}</div>
    </div>`;
  }).join('')}</div>`;
}
function roadNote(st,coffees){
  const silent=st.filter(s=>!s.n).map(s=>s.name.toLowerCase());
  const filled=st.length-silent.length;
  const noFarm=coffees.filter(c=>!growerOf(c)).length;
  const bits=[`${capFirst(words(filled))} station${filled===1?'':'s'} stand${filled===1?'s':''} out of ${words(st.length)}.`];
  if(silent.length)bits.push(`${capFirst(andList(silent))} ${silent.length===1?'is':'are'} silent on every green here.`);
  if(noFarm)bits.push(`${capFirst(words(noFarm))} of ${words(coffees.length)} name${noFarm===1?'s':''} no farm at all.`);
  bits.push('Coverage counts — it never grades.');
  return bits.join(' ');
}
// heights, read only where a bag actually states one: every figure a stated
// altitude carries, so "1,900 – 2,100 m" reads as a span and "1900 masl" as a
// point. Nothing is read across from a neighbouring lot.
function altitudesOf(coffee){
  const out=[];
  (String(originOf(coffee).altitude||'').match(/\d[\d,.]*/g)||[]).forEach(t=>{
    const n=Number(t.replace(/[,.]/g,''));
    if(isFinite(n)&&n>=300&&n<=3000)out.push(n);
  });
  return out;
}
function altitudeBandHTML(coffees){
  const stated=coffees.filter(c=>altitudesOf(c).length);
  const all=stated.reduce((a,c)=>a.concat(altitudesOf(c)),[]);
  const silent=coffees.length-stated.length;
  const note=stated.length
    ? `Stated by ${words(stated.length)} bag${stated.length===1?'':'s'}${silent?`. Unread on ${words(silent)}`:''} — height places a coffee, it never ranks it.`
    : `No bag here states a height. Unread is a state, not a low one — height places a coffee, it never ranks it.`;
  if(!all.length){
    return `<div class="box" style="margin-top:22px">
      <div class="row"><span class="eyebrow" style="margin:0">Grown between</span>
        <span class="num" style="font-size:16px;color:var(--text-disabled);font-style:italic">unread</span></div>
      <div class="note" style="border:0;padding:0;margin:12px 0 0">${esc(note)}</div></div>`;
  }
  const lo=Math.min(...all),hi=Math.max(...all);
  // the drawn span holds the whole atlas the record could state, so a band is
  // read against the same ground every time — never fitted to flatter itself
  const axLo=Math.min(1200,Math.floor(lo/100)*100),axHi=Math.max(2400,Math.ceil(hi/100)*100);
  const pct=v=>Math.max(0,Math.min(100,(v-axLo)/(axHi-axLo)*100));
  const left=pct(lo),right=100-pct(hi);
  return `<div class="box" style="margin-top:22px">
    <div class="row"><span class="eyebrow" style="margin:0">Grown between</span>
      <span class="num" style="font-size:16px">${lo===hi?`${lo.toLocaleString()} m`:`${lo.toLocaleString()} – ${hi.toLocaleString()} m`}</span></div>
    <div class="band"><span style="left:${left.toFixed(1)}%;right:${right.toFixed(1)}%;${lo===hi?'width:5px;right:auto':''}"></span></div>
    <div class="band-ax"><span>${axLo.toLocaleString()} m</span><span>the atlas</span><span>${axHi.toLocaleString()} m</span></div>
    <div class="note" style="border:0;padding:0;margin:12px 0 0">${esc(note)}</div>
  </div>`;
}
// the cups one scope was read from, listed where they were drunk — a country's
// own reading, opened from the box that states it
function cupsSheet(title,sub,cups){
  openSheet(`<h3>${esc(title)}</h3>
  <div class="sub">${esc(sub)}</div>
  ${cups.length?cups.slice().sort(byWhen).map(c=>{

      <span class="mid"><span class="t" style="font-size:17px">${esc(coffeeLabel(coffee))}</span>
      <span class="m">${esc([place?place.name:'At home',fmtWhen(c.at)].filter(Boolean).join(' · '))}</span></span>
      <span class="sc${c.score==null?' none':''}" style="font-size:24px">${c.score==null?'—':c.score}</span></button>`;
  }).join(''):'<div class="empty">Nothing read here yet.</div>'}`);
}
function openCountryCups(label){
  const coffees=countryCoffees(label);
  cupsSheet(`The cups from ${label}`,'Your own readings — never averaged into anyone else’s page.',cupsOfCoffees(coffees));
