/* ============ dial component (ported wholesale) ============
 * tap −/+ one step; press-and-hold auto-repeats and accelerates; tap the
 * number to type an exact value. opts:{kind:'time'} for m:ss, {corner} for
 * the °C/°F toggle, {hint} for a scale caption. */
const dialState={};
let editingDial=null,holdInt=null,holdTO=null;
function dial(id,label,unit,value,step,min,max,dp,opts){
  opts=opts||{};
  dialState[id]={v:value,step,min,max,dp:dp??(String(step).includes('.')?1:0),unit,kind:opts.kind||null};
  const corner=opts.corner?`<div class="dcorner">${opts.corner}</div>`:(opts.hint?`<div class="ticks">${opts.hint}</div>`:'');
  return `<div class="dial">${corner}<div class="l">${label}</div>
    <div class="v num tapedit" id="dv_${id}" onclick="editDial('${id}')">${fmtDial(id)}<span class="u">${unit}</span></div>
    <div class="ctl">
      <button type="button" onpointerdown="holdStart(event,'${id}',-1)">−</button>
      <button type="button" onpointerdown="holdStart(event,'${id}',1)">+</button>
    </div></div>`;
}
function fmtDial(id){const s=dialState[id];if(s.v==null)return '—';
  if(s.kind==='time')return fmtTime(s.v);
  return s.v.toFixed(s.dp).replace(/\.0+$/,'');}
function unitSpan(id){return `<span class="u">${dialState[id].unit}</span>`}
function redrawDial(id){const el=document.getElementById('dv_'+id);if(el)el.innerHTML=fmtDial(id)+unitSpan(id)}
function setDial(id,v){const s=dialState[id];
  if(v==null||isNaN(v)){redrawDial(id);return}
  if(s.min!=null)v=Math.max(s.min,v); if(s.max!=null)v=Math.min(s.max,v);
  s.v=Number(v.toFixed(s.dp)); redrawDial(id);}
function nudge(id,dir,mult){const s=dialState[id];
  setDial(id,(s.v==null?(s.min??0):s.v)+dir*s.step*(mult||1));
  if(navigator.vibrate)navigator.vibrate(3);}
function holdStop(){if(holdTO){clearTimeout(holdTO);holdTO=null}if(holdInt){clearInterval(holdInt);holdInt=null}
  window.removeEventListener('pointerup',holdStop);window.removeEventListener('pointercancel',holdStop);}
function holdStart(e,id,dir){
  e.preventDefault();
  if(editingDial){const de=document.getElementById('de_'+editingDial);if(de)de.blur();}
  holdStop();
  nudge(id,dir);
  let n=0;
  holdTO=setTimeout(()=>{ holdInt=setInterval(()=>{ n++;
    const mult=n<10?1:n<20?4:n<35?10:25;
    nudge(id,dir,mult); },60); },320);
  window.addEventListener('pointerup',holdStop);
  window.addEventListener('pointercancel',holdStop);
}
function editDial(id){
  if(editingDial===id)return;
  const s=dialState[id],el=document.getElementById('dv_'+id);
  editingDial=id;
  const cur=s.v==null?'':(s.kind==='time'?fmtTime(s.v):fmtDial(id));
  el.innerHTML=`<input class="dedit" id="de_${id}" inputmode="${s.kind==='time'?'text':'decimal'}" value="${cur}">`+unitSpan(id);
  const inp=document.getElementById('de_'+id); inp.focus(); inp.select();
  const commit=()=>{if(editingDial!==id)return; editingDial=null;
    const raw=inp.value;
    const v=s.kind==='time'?parseTime(raw):(raw.trim()===''?NaN:Number(raw));
    setDial(id,v);};
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ev.preventDefault();inp.blur();}
    else if(ev.key==='Escape'){editingDial=null;redrawDial(id);}});
}

    <div class="sub">Paste the bag, or just type it.</div>
    <label class="f"><textarea id="d_text" placeholder="Sey's — Ethiopia Gedeb, washed">${esc(s.text)}</textarea></label>
    <button class="btn btn-primary" onclick="doorNext1()">Continue</button>
    <button class="btn btn-quiet" onclick="closeSheet()">Not now</button>
    <div class="note">Carta reads a roaster and a coffee out of it. Nothing is guessed, and nothing is merged without asking.</div>`);
    return;
  }
  if(s.step==='confirm'){
    // confirm and "where's this cup?" are one step now: the paste is already
    // read, and asking twice was a tap spent on nothing (the redesign's own
    // complaint — logging a cup took too many steps)
    const where=s.preset
      ?`<button class="btn btn-primary" onclick="doorNext2('bar')">At ${esc(s.preset.place)} — continue</button>`
      :`<div class="eyebrow" style="margin:18px 0 10px">Where's this cup?</div>
        <div class="btnrow">
          <button class="btn btn-quiet" style="min-height:52px" onclick="doorNext2('bar')">At a café</button>
          <button class="btn" style="min-height:52px;background:var(--fill-strong);color:var(--text-on-fill);border:1px solid var(--fill-strong)" onclick="doorNext2('home')">At home</button>
        </div>`;
    openSheet(`<h3>Is this right?</h3>
    <div class="sub">Correct anything the paste read wrong.</div>
    <label class="f"><span class="l">Roaster <span class="opt">optional</span></span><input type="text" id="d_roaster" value="${esc(s.roaster)}"></label>
    <label class="f"><span class="l">Coffee</span><input type="text" id="d_name" value="${esc(s.name)}" placeholder="Ethiopia Gedeb"></label>
    <details class="more"><summary>Origin & roast — optional</summary>
    <label class="f"><span class="l">Roast level</span><select id="d_roastlevel">
      <option value="">—</option>
      ${ROAST_LEVELS.map(r=>`<option value="${r}"${s.roastLevel===r?' selected':''}>${r}</option>`).join('')}
    </select></label>
    <div class="grid2">
      <label class="f"><span class="l">Country</span><input type="text" id="d_country" value="${esc(s.o.country||'')}"></label>
      <label class="f"><span class="l">Region</span><input type="text" id="d_region" value="${esc(s.o.region||'')}"></label>
      <label class="f"><span class="l">Farm</span><input type="text" id="d_farm" value="${esc(s.o.farm||'')}"></label>
      <label class="f"><span class="l">Producer</span><input type="text" id="d_producer" value="${esc(s.o.producer||'')}"></label>
      <label class="f"><span class="l">Variety</span><input type="text" id="d_variety" value="${esc(s.o.variety||'')}"></label>
      <label class="f"><span class="l">Process</span><input type="text" id="d_process" value="${esc(s.o.process||'')}"></label>
    </div></details>
    ${where}`);
    return;
  }
  if(s.step==='join'){
    const m=s._roasterMatch;
    openSheet(`<h3>Same roaster?</h3>
    <div class="sub">You've logged <strong>${esc(m.name)}</strong> before. Is this them?</div>
    <div class="btnrow">
      <button class="btn btn-quiet" onclick="doorJoin(false)">No, different</button>
      <button class="btn btn-primary" onclick="doorJoin(true)">Yes, same</button>
    </div>

  }
}
function doorNext1(){doorState.text=val('d_text');const p=doorParse(doorState.text);
  if(!p.roaster&&!p.name){toast('Type or paste something first');return}
  doorState.roaster=p.roaster;doorState.name=p.name;doorState.roastLevel=parseRoastLevel(doorState.text);doorState.step='confirm';paintDoor();}
// the confirm step carries the answer to "where" with it, so this is the last
// question the door asks — the gentle join still gets its one interruption
function doorNext2(kind){
  const s=doorState;
  s.roaster=val('d_roaster');s.name=val('d_name');s.roastLevel=val('d_roastlevel');
  s.o={country:val('d_country'),region:val('d_region'),farm:val('d_farm'),producer:val('d_producer'),variety:val('d_variety'),process:val('d_process')};
  if(!s.roaster&&!s.name){toast('Name the roaster or the coffee');return}
  s.kind=kind||s.kind||'home';
  if(s.roaster){
    const m=matchNode('roasters',s.roaster);
    if(m.exact){s.roasterRef=m.exact.id;doorKind(s.kind);return}
    if(m.near){s._roasterMatch=m.near;s.step='join';paintDoor();return}
  }
  doorKind(s.kind);
}
function doorJoin(yes){
  const s=doorState,m=s._roasterMatch;
  if(yes){joinAlias(m,s.roaster);s.roasterRef=m.id;}
  doorKind(s.kind);
}
function doorKind(kind){
  const s=doorState;
  const preset=s.preset;
  const roasterRef=mintRoasterIfNeeded(s.roaster,s.roasterRef);
  // brewing it at home means beans in hand — the shelf; a café pour is only
  // tasted until "take it home" says otherwise (ROADMAP.md Phase 4)
  const c={id:uid(),createdAt:new Date().toISOString(),
    roaster:s.roaster||(roasterRef?roasterById(roasterRef).name:''),roasterRef,name:s.name,origin:s.o,roastLevel:s.roastLevel||'',home:kind==='home'};
  D.coffees.push(c);save();
  doorState=null;
  newGroundToast('country',c.origin&&c.origin.country);
  if(kind==='bar')openCafeCup(c.id,preset);else openBrewFlow(c.id);
}

/* ============ café cup (the bar path) ============ */
let cafeCupState=null;
// preset carries {placeRef,place,city} when the café is already known — a
// menu item's "log a cup" hands this off, skipping the place step entirely
function openCafeCup(coffeeId,preset){
  cupPhotoPending=null;
  cafeCupState={coffeeId,place:(preset&&preset.place)||'',placeRef:(preset&&preset.placeRef)||null,
    city:(preset&&preset.city)||'',step:(preset&&preset.placeRef)?'score':'place'};
  paintCafeCup();
}
function paintCafeCup(){
  const s=cafeCupState,coffee=coffeeById(s.coffeeId);
  if(s.step==='place'){
    openSheet(`<h3>At a café</h3>
    <div class="sub">${esc(coffeeLabel(coffee))}</div>
    <label class="f"><span class="l">Café</span><input type="text" id="p_name" value="${esc(s.place)}" placeholder="Halfpence" list="placelist"></label>
    <datalist id="placelist">${live('places').map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
    <label class="f"><span class="l">City <span class="opt">optional — scopes the brief later</span></span><input type="text" id="p_city" value="${esc(s.city)}" placeholder="Portland" list="citylist"></label>
    <datalist id="citylist">${knownCities().map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <button class="btn btn-primary" onclick="cafeCupNext()">Continue</button>`);
    return;
  }
  if(s.step==='join'){
    const m=s._match;
    openSheet(`<h3>Same café?</h3>
    <div class="sub">You've been to <strong>${esc(m.name)}</strong> before. Is this it?</div>
    <div class="btnrow">
      <button class="btn btn-quiet" onclick="cafeCupJoin(false)">No, different</button>
      <button class="btn btn-primary" onclick="cafeCupJoin(true)">Yes, same</button>
    </div>`);
    return;
  }
  if(s.step==='score'){
    openSheet(`<h3>What was in the cup?</h3>
    <div class="sub">${esc(coffeeLabel(coffee))} · ${esc(s.place)}</div>
    <label class="f"><span class="l">The cup</span>${hedonicRow()}</label>
    <label class="f"><span class="l">What you found <span class="opt">optional</span></span>${descRow()}</label>
    <label class="f"><span class="l">One honest line <span class="opt">optional</span></span><input type="text" id="cc_notes" placeholder="what you found"></label>
    ${photoFieldHTML()}
    <button class="btn btn-primary" onclick="saveCafeCup()">Keep the cup</button>`);
  }
}
function cafeCupNext(){
  const s=cafeCupState;s.place=val('p_name');s.city=val('p_city');
  if(!s.place){toast('Name the café');return}
  const m=matchNode('places',s.place);
  if(m.exact){s.placeRef=m.exact.id;s.step='score';paintCafeCup();return}
  if(m.near){s._match=m.near;s.step='join';paintCafeCup();return}
  s.step='score';paintCafeCup();
}
function cafeCupJoin(yes){
  const s=cafeCupState,m=s._match;
  if(yes){joinAlias(m,s.place);s.placeRef=m.id;if(!m.city&&s.city)m.city=s.city;}
  s.step='score';paintCafeCup();
}
function saveCafeCup(){
  if(hedState==null){toast('A cup needs its reading — the 1–9 first.');return}
  const s=cafeCupState;
  let placeRef=s.placeRef;
  if(!placeRef){const p={id:uid(),createdAt:new Date().toISOString(),name:s.place,city:s.city||'',aka:[]};D.places.push(p);placeRef=p.id;}
  const cup={id:uid(),createdAt:new Date().toISOString(),at:new Date().toISOString(),kind:'bar',
    placeRef,coffeeRef:s.coffeeId,score:hedState,line:val('cc_notes'),descriptors:[...descState]};
  if(cupPhotoPending){cup.photo=true;setCupPhoto(cup.id,cupPhotoPending);cupPhotoPending=null}
  D.cups.push(cup);
  cafeCupState=null;hedState=null;descState=new Set();
  const city=(placeById(placeRef)||{}).city;
  save();closeSheet();go('journal');
  newGroundToast('city',city,'Kept.');
}
function knownCities(){
  const seen={};
  live('places').forEach(p=>{if(p.city){const f=fold(p.city);if(!seen[f])seen[f]=p.city}});
  return Object.values(seen).sort();
}

function saveBrewFlow(coffeeId,editId){

let _cfId=null,_cfTimer=null;
function openCoffeeForm(id){

    ?`<button class="btn btn-quiet" onclick="restore('coffees','${id}');closeSheet()">Restore</button>`
    :`<button class="btn btn-quiet" onclick="putAway('coffees','${id}');closeSheet()">Put away</button>`):''}
  <div class="note">A field left blank is unread, not wrong. Two facts are enough for this green to meet another keeper’s record; one, and it stays a green only you can see. Everything above saves as you type.</div>`);

function cfAutosave(){
  const f={roaster:val('cf_roaster'),name:val('cf_name'),
    origin:{country:val('cf_country'),region:val('cf_region'),farm:val('cf_farm'),producer:val('cf_producer'),
      variety:val('cf_variety'),process:val('cf_process'),altitude:val('cf_altitude'),mill:val('cf_mill')},
    roastLevel:val('cf_roastlevel'),roastDate:val('cf_roastdate'),notes:val('cf_notes')};
  if(!_cfId){
    if(!f.roaster&&!f.name)return;   // an empty sheet swiped shut still leaves nothing behind
    D.coffees.push({id:_cfId=uid(),createdAt:new Date().toISOString(),home:true,...f});
  }else{
    Object.assign(coffeeById(_cfId),f,{updatedAt:new Date().toISOString()});
  }
  clearTimeout(_cfTimer);_cfTimer=setTimeout(save,400);   // debounced: the write into D above is what a swipe can't lose
}

/* ============ the menu — capture, read, and the walk from a line to a cup ============
 * A café's menu, typed while you read it (ROADMAP.md Phase 4) — a photo is
 * a reference to type against by default, never sent anywhere, never
 * stored; only the words you type persist. "Read it for me" (the horizon
 * list's OCR item) is the opt-in exception: the same BYO-key door the ask
 * already calls through, one posture, two uses — the keeper's own key, the
 * keeper's own tap, and the photo travels only that once, only to
 * Anthropic, only when asked. Either way the photo itself is never kept:
 * it lives in memory for this sheet's lifetime and is gone the moment the
 * menu saves or the sheet closes. Each line becomes an item; tap one to
 * log a cup on the spot (the coffee is minted and the item points at it
 * before the café-cup form even opens, so the link survives whether or
 * not the cup itself gets finished) or to point at a coffee already on
 * the shelf. */
const menuById=id=>D.menus.find(m=>m.id===id);

 * counter those are the same moment.

Onyx — Colombia Pink Bourbon"></textarea>

function menuPhotoPicked(e){

}
// the slot repaints itself rather than the screen: a re-render would throw

function paintMenuPhoto(){

async function readMenuPhoto(){
  if(_menuOCRBusy||!menuPhotoFile)return;
  if(!askKey()){openAskKey();return}
  const status=document.getElementById('mc_ocr_status');
  _menuOCRBusy=true;
  if(status)status.innerHTML='<div class="muted small" style="margin-top:6px">Reading…</div>';
  try{
    const dataUri=await compressPhoto(menuPhotoFile,1400,1.5*1024*1024);
    const raw=await callVisionModel(menuOCRPrompt(),dataUri);
    const parsed=parseMenuOCR(raw);
    if(!parsed.lines.length){
      if(status)status.innerHTML=`<div class="muted small" style="margin-top:6px">Couldn't make out any coffees — type it in by hand.</div>`;
    }else{
      const ta=document.getElementById('mc_text');
      if(ta)ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+parsed.lines.join('\n');
      if(status)status.innerHTML=`<div class="muted small" style="margin-top:6px">${parsed.lines.length} line${parsed.lines.length===1?'':'s'} read — check it over before saving.</div>`;
    }
  }catch(e){
    if(status)status.innerHTML=`<div class="muted small" style="margin-top:6px">${esc((e&&e.message)||'Could not read that photo.')}</div>`;
  }
  _menuOCRBusy=false;
}
function saveMenuCapture(placeId,menuId){
  const lines=val('mc_text').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length){toast('Type at least one line');return}
  const items=lines.map(line=>{const p=doorParse(line);return {text:line,roaster:p.roaster,name:p.name,roastLevel:parseRoastLevel(line)}});
  const existing=menuId?menuById(menuId):null;
  let menu;
  if(existing){existing.items=existing.items.concat(items);menu=existing}
  else{menu={id:uid(),createdAt:new Date().toISOString(),placeRef:placeId,at:new Date().toISOString(),items};D.menus.push(menu)}
  if(menuPhotoPreview){URL.revokeObjectURL(menuPhotoPreview);menuPhotoPreview=null}
  menuPhotoFile=null;
  save();
  toast(existing?'Added to the menu.':'Menu captured.');
  openMenuScreen(menu.id,menu.placeRef);
}

const KMX=(lon,la0)=>lon*111.32*Math.cos(la0*Math.PI/180),KMY=la=>la*111.32;
const TOPO_KM=4500;   // classic's own refusal: a contour too wide to be a line is a smudge

// landKey -> the spelling you actually typed most, so the passport prints your words,
// never the folded lookup key ("united states of america" stays internal, unprinted)
// the passport prints your words: carta-belt asks for them by LANDS key, and
// anything the record hasn't tasted is never labelled at all
window.CARTA_LAND_NAMES=function(){
  const m=tastedCountryMap(),out={};
  Object.keys(m).forEach(k=>{out[k]=m[k].label});
  return out;
};
function tastedCountryMap(){
  const m={};
  live('coffees').forEach(c=>{
    const raw=(c.origin&&c.origin.country||'').trim();if(!raw)return;
    const key=landKey(raw);
    (m[key]=m[key]||{label:raw,counts:{}});
    m[key].counts[raw]=(m[key].counts[raw]||0)+1;
  });
  Object.values(m).forEach(v=>{v.label=Object.entries(v.counts).sort((a,b)=>b[1]-a[1])[0][0]});
  return m;
}
/* the passport — every country LANDS holds a shape for, tasted ones washed and
 * tappable into a chapter, untasted ones a hairline invitation and nothing more
 * (ROADMAP.md Phase 3). One frame, one scale on both axes, fit to hold the whole
 * dataset — the walk down is a tap into a chapter, never a zoom on this frame.
 * Highland contours are ported and drawn through the exact same TOPO_KM gate
 * classic uses; at true world width they are honestly withheld, the same
 * refusal that keeps a street layer off a frame too wide to read at (never a
 * scope cut — the rule simply says no at this frame, faithfully). */
let _passportCache=null;
function passportSVG(interactive){
  interactive=interactive!==false;
  const tasted=tastedCountryMap();
  const keys=Object.keys(LANDS);
  const allPts=[];
  const rings={};
  keys.forEach(k=>{const rs=landRingsRaw(k);if(!rs)return;rings[k]=rs;rs.forEach(r=>r.forEach(p=>allPts.push(p)))});
  if(!allPts.length)return '';
  const la0=allPts.reduce((a,p)=>a+p.lat,0)/allPts.length;
  const px=p=>KMX(p.lon,la0),py=p=>KMY(p.lat);
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  allPts.forEach(p=>{const x=px(p),y=py(p);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
  const W=336,P=4;
  const H=Math.round((W-2*P)*(y1-y0)/(x1-x0))+2*P;
  const s=Math.min((W-2*P)/(x1-x0),(H-2*P)/(y1-y0)),cx=(x0+x1)/2,cy=(y0+y1)/2;
  const X=p=>W/2+(px(p)-cx)*s,Y=p=>H/2-(py(p)-cy)*s;
  const n=v=>v.toFixed(1);
  const path=r=>{let d='';r.forEach((p,i)=>{d+=(i?'L':'M')+n(X(p))+' '+n(Y(p))});return d?d+'Z':''};
  const drawTopo=(x1-x0)<=TOPO_KM;   // the same gate classic gates on — see the header note
  let landHTML='',markHTML='';
  keys.forEach(k=>{
    const rs=rings[k];if(!rs)return;
    const d=rs.map(path).join(' ');if(!d)return;
    const t=tasted[k];
    if(t){
      const a=landAnchor(k);
      const lx=a?n(X(a)):n(W/2),ly=a?n(Y(a)):n(H/2);
      const topo=drawTopo?landTopoRaw(k):null;
      const topoHTML=topo?topo.map((lv,i)=>lv.map(r=>{const dd=path(r);return dd?`<path class="topo t${i+1}" d="${dd}"/>`:''}).join('')).join(''):'';
      markHTML+=`<g class="mk"${interactive?` onclick="openCountryChapter(${jsq(t.label)})"`:''}>
        <path class="mk-land" d="${d}"/>${topoHTML}
        <text class="mk-lbl onland" x="${lx}" y="${ly}" text-anchor="middle">${esc(t.label)}</text>
      </g>`;
    }else landHTML+=`<path class="land" d="${d}"/>`;
  });
  return `<div class="plot-box"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${landHTML}${markHTML}</svg></div>`;
}

/* ============ views ============ */
/* a cup, in a list. The title leads at 18.5px, the meta sits on secondary ink
 * rather than the faintest, and the score is set at 27px tabular — it is the
 * answer the row exists to give, and it used to be the smallest thing on it.
 * The photo takes the kind-mark's place when there is one; a cup without one
 * says plainly whether it was drunk out or at home. */
function cupRowHTML(cup){
  const coffee=coffeeById(cup.coffeeRef);
  const place=cup.kind==='bar'?placeById(cup.placeRef):null;
  const title=cup.kind==='bar'?(place?place.name:'A café'):coffeeLabel(coffee);
  const brew=cup.brewRef?brewById(cup.brewRef):null;
  const meta=[cup.kind==='bar'?coffeeLabel(coffee):brewLine(brew),fmtWhen(cup.at)].filter(Boolean).join(' · ');
  const lead=cup.photo
    ?`<img class="ph" src="${getCupPhoto(cup.id)||''}" alt="">`
    :`<span class="kind">${cup.kind==='bar'?'out':'home'}</span>`;
  return `<button class="lrow" onclick="openCupDetail('${cup.id}')">
    ${lead}
    <span class="mid"><span class="t">${esc(title)}</span><span class="m">${esc(meta)}</span></span>
    <span class="sc${cup.score==null?' none':''}">${cup.score==null?'—':cup.score}</span></button>`;
}
// the recipe, said the way a recipe is read aloud — the dials in order, nothing
// spelled out that the numbers already say
function brewLine(b){
  if(!b)return '';
  return [b.grind,b.doseG!=null?b.doseG+' g':null,b.waterG!=null?b.waterG+' g':null,
    b.tempC!=null?b.tempC+' °C':null,b.timeSec!=null?fmtTime(b.timeSec):null].filter(x=>x!=null&&x!=='').join(' · ');
}

// the continuation (design-system pattern, hero-loop): the last cup brewed at
// home, carried forward. Nothing invented — every figure on it is already on
// the record, and the one action begins the next brew from exactly there.
function continuationHTML(){
  const home=live('cups').filter(c=>c.kind==='home'&&c.brewRef).sort(byNew);
  const last=home[0]||live('cups').sort(byNew)[0];

/* ============ a cup — a screen now, not a sheet ============
 * The photo was always allowed to be here; it was never allowed to be seen.
 * It leads, at 300px, and the score reads at 44px in the ember — this is the
 * one screen where the score IS the subject, so it gets the ember and the door
 * steps back to plain ink.
 */
function vCup(id,view){
  const cup=cupById(id);
  if(!cup)return `<div class="pad" style="padding-top:26px"><div class="empty">That cup isn't on the record.</div>
    <button class="btn btn-quiet" onclick="go('journal')">Back to the journal</button></div>`;
  const coffee=coffeeById(cup.coffeeRef);
  const place=cup.kind==='bar'?placeById(cup.placeRef):null;
  const brew=cup.brewRef?brewById(cup.brewRef):null;
  const setup=brew?setupById(brew.setupId):null;
  const photo=cup.photo?getCupPhoto(cup.id):null;
  const backLabel=view&&view.back?'← '+esc((placeById(view.back.id)||{name:'The café'}).name):'← Back';
  // the provenance block, in the order a cup is actually read back: what it
  // was, where it came from, how it was made, whose hands roasted it, and the
  // room it was drunk in. A line the record is silent on says so.
  // how long the coffee had rested when this cup was poured — the figure the
  // cup itself can defend, not today's distance from a roast date
  const roastedLine=(()=>{
    if(!coffee||!coffee.roaster)return '';
    if(!coffee.roastDate||!cup.at)return coffee.roaster;
    const days=Math.round((new Date(cup.at)-new Date(coffee.roastDate+'T00:00'))/864e5);
    if(!isFinite(days)||days<0)return coffee.roaster;
    return `${coffee.roaster} · ${days===0?'the same day':`${days} day${days===1?'':'s'} before`}`;
  })();
  const ledger=[
    ['Coffee',coffeeLabel(coffee)],
    ['Origin',originLine(coffee)],
    cup.kind==='bar'?['Poured',place?'At the bar':'']:['Brew',brewLine(brew)],
    cup.kind==='bar'
      ?['Roasted',roastedLine]
      :['Setup',setup?(setup.name||[setup.grinder,setup.brewer].filter(Boolean).join(' · ')):''],
    ['Café',place?place.name:''],
  ].filter(r=>!(r[0]==='Café'&&cup.kind!=='bar'));
  return `<div>
    <div class="hero">
      ${photo?`<img src="${photo}" alt="">`
        :`<label class="slot">
            <span style="font-family:var(--sans);font-size:var(--s11);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)">The cup</span>
            <span>Add the photo you took</span>
            <input type="file" accept="image/*" onchange="cupHeroPicked(event,'${cup.id}')">
          </label>`}
      ${photo?'<div class="fade top" style="height:92px;background:linear-gradient(to bottom,rgba(23,19,16,.5),rgba(23,19,16,0))"></div>':''}
      <button class="omini overlay" style="left:18px;top:18px" onclick="cupBack()">${backLabel}</button>
      ${photo?`<label class="omini overlay" style="right:18px;top:18px;cursor:pointer">Replace<input type="file" accept="image/*" style="display:none" onchange="cupHeroPicked(event,'${cup.id}')"></label>`:''}
    </div>
    <div class="lift pad" style="margin-top:-16px;padding-top:20px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
        <div style="min-width:0">
          <div class="eyebrow" style="margin-bottom:6px">${cup.kind==='bar'?'A cup, out':'A cup, at home'}</div>
          <div class="display" style="margin:0">${esc(cup.kind==='bar'?(place?place.name:'A café'):coffeeLabel(coffee))}</div>
          <div class="m" style="margin-top:6px">${esc([fmtDateLong(cup.at),place&&place.neighborhood?place.neighborhood:''].filter(Boolean).join(' · '))}</div>
        </div>
        <div style="flex:none;text-align:right">
          <div class="bigscore" style="font-size:44px">${cup.score==null?'—':cup.score}</div>
          <div class="ofnine">of nine</div>
        </div>

// the hero's own photo, added after the fact: the cup is already on the record,

function cupHeroPicked(e,cupId){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  compressPhoto(f).then(dataUri=>{
    const cup=cupById(cupId);if(!cup)return;
    setCupPhoto(cupId,dataUri);cup.photo=true;save();render();

}

// café cup → shelf card, one tap (ROADMAP.md Phase 4): a coffee only tasted
// at a café isn't on the shelf until this says it is — a brew always is.
function takeItHome(coffeeId){
  const c=coffeeById(coffeeId);if(!c||c.home)return;
  c.home=true;c.homeAt=new Date().toISOString();c.updatedAt=c.homeAt;
  save();render();toast('Added to the shelf — brew it whenever.');
}
// a fact the shelf already knows and used to say nothing about (ROADMAP.md
// Phase 11) — homeAt is stamped only by the café-to-shelf bridge above, so
// this never fires for a coffee that started home (door/form): those were
// never "taken home" from somewhere else, and a brew there is the ordinary
// next step, not a stall worth a line about.
const TAKEN_HOME_QUIET_DAYS=7;
function takenHomeNote(c){
  if(!c.home||!c.homeAt)return '';
  if(D.brews.some(b=>b.coffeeRef===c.id))return '';
  const days=Math.floor((Date.now()-new Date(c.homeAt))/864e5);
  if(days<TAKEN_HOME_QUIET_DAYS)return '';
  return 'not brewed yet';
}

/* ============ your record — the whole of it, and every door out of it ============

 * someone made them, what can be read in, what can be sent out, the instrument
 * it was all written on, and classic with the lights still on.
 */
function recordMetaLine(){
  const cups=live('cups').length,coffees=live('coffees').length;
  return `${words(cups)} cup${cups===1?'':'s'} · ${words(coffees)} coffee${coffees===1?'':'s'} · on this device only`;
}
const setupBrews=id=>D.brews.filter(b=>b.setupId===id).sort(byNew);
function setupAvg(id){
  const ids=new Set(setupBrews(id).map(b=>b.id));
  return avgOf(live('cups').filter(c=>c.brewRef&&ids.has(c.brewRef)));
}
function fmtBytes(n){
  if(n<1024)return `${n} B`;
  if(n<1024*1024)return `${Math.round(n/1024)} KB`;
  return `${(n/1024/1024).toFixed(1)} MB`;
}
function vRecord(){
  const cups=live('cups'),coffees=live('coffees'),places=live('places'),setups=live('setups');

  const photos=cups.filter(c=>c.photo).length;

        ['Cups',cups.length?`${cups.length}${first&&first.at?` · since ${fmtMonth(first.at)}`:''}`:'none yet'],
        ['Coffees',coffees.length?`${coffees.length}${shelf?` · ${shelf} on the shelf`:''}`:'none yet'],
        ['Cafés',places.length?`${places.length}${cities?` · in ${words(cities)} cit${cities===1?'y':'ies'}`:''}`:'none yet'],

      <button class="btn" style="min-height:48px;background:var(--fill-strong);color:var(--text-on-fill);border:1px solid var(--fill-strong)" onclick="exportLedgerJSON()">Back up my record</button>

function yearMetaLine(){

// a card needs a subject, and the subject is picked from the record itself —

/* ---- the reasons, one gesture away (the law: a score never travels without

const VECTOR_RULES={
  descriptors:'A descriptor earns its weight from the scores of the cups that carry it, never from how often you typed it.',
  processes:'A process is weighed by the cups made from it — the record states what it read on the bag, and nothing more.',
  origins:'An origin is weighed by its own cups. A country you have drunk twice is not ranked against one you have drunk twenty times.',
  roast:'Roast is read only where a bag or a menu stated it plainly. Unread cups are left out, never counted as medium.',

function openVectorEvidence(kind,value){

/* ============ sharing an exported page — a friend's phone, or a download ============
 * One door for every card and the brief alike. navigator.share with a real
 * File hits the OS share sheet where it exists (texts, AirDrop, anywhere) —
 * that's PIVOT.md's actual done-when, not a file sitting in Downloads. Falls
 * back to a plain download wherever share isn't offered, or is cancelled. */
function downloadBlob(blob,filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function shareOrDownload(html,filename,title){
  const blob=new Blob([html],{type:'text/html'});
  try{
    const file=new File([blob],filename,{type:'text/html'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:title||'Carta'});
      return;
    }
  }catch(e){if(e&&e.name==='AbortError')return}   // the keeper cancelled the share sheet — not a failure
  downloadBlob(blob,filename);
  toast('Downloaded — open it anywhere, forever.');
}

function copyPlainText(str,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(str).then(()=>toast(msg||'Copied.'));return}
  const ta=document.createElement('textarea');ta.value=str;ta.style.position='fixed';ta.style.opacity='0';

// a rough, conservative measure of what this origin has already spent in

const STORAGE_SOFT_LIMIT=4.5*1024*1024;

// the one door — content is either a plain prompt string (the ask) or a
// content-block array carrying an image plus a prompt (the menu's OCR). The
// ceiling is the caller's: an OCR is a list of lines, an ask is an argument,
// and 1024 tokens is what made the ask's answers read like a stub. A thinking
// block, on a model that reasons by default, has no .text — so the join below
// silently drops it and the parse only ever sees what was actually said.
async function callModel(content,maxTokens,signal){
  const key=askKey();if(!key)throw new Error('Set your key first.');
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:askModel(),max_tokens:maxTokens||1024,messages:[{role:'user',content}]}),
    signal:signal||undefined,
  });
  if(!r.ok){
    let msg=`The model call failed (${r.status}).`;
    try{const j=await r.json();if(j&&j.error&&j.error.message)msg=j.error.message}catch(e){}
    throw new Error(msg);
  }
  const j=await r.json();
  return (j.content||[]).map(b=>b.text||'').join('');
}
// the ask's own call is the one the keeper can walk away from — Cancel on the
// wait aborts it where the browser allows, rather than letting it land unseen
const callAskModel=prompt=>callModel(prompt,ASK_MAX_TOKENS,_askAbort&&_askAbort.signal);
async function callVisionModel(prompt,imageDataUri){
  const m=String(imageDataUri||'').match(/^data:([^;]+);base64,([\s\S]*)$/);
  if(!m)throw new Error('Could not read that photo.');
  return callModel([{type:'image',source:{type:'base64',media_type:m[1],data:m[2]}},{type:'text',text:prompt}]);
}
/* One lookup, every branch it knows about. Carta asked for limit=1 from Phase
 * 7 until Phase 15, which meant a café with several branches in one city got
 * whichever one the lookup ranked first — arbitrarily, silently, and once,
 * because geocodeCityPlaces stamps `geocoded` whether or not it worked. A
 * wrong pin was permanent and there was no way in the app to say so.
 * Asking for five and reading their areas costs the same one call. */
async function lookupPlace(name,neighborhood,city){
  const q=[name,neighborhood,city].filter(Boolean).join(', ');
  if(!q)return [];
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
    if(!r.ok)return [];
    const list=await r.json();
    if(!Array.isArray(list))return [];
    return dedupeHits(list.map(x=>{
      const lat=Number(x.lat),lon=Number(x.lon);
      if(!isFinite(lat)||!isFinite(lon))return null;
      return {lat,lon,name:String(x.name||'').trim(),hood:hoodOf(x.address),city:cityOf(x.address)};
    }).filter(Boolean));
  }catch(e){return []}
}
// the ask's own grounding still wants one answer to a question it already
// asked precisely — it supplies the model's neighborhood, so its lookup is
// rarely the ambiguous kind. It takes the first and now keeps the area too.
async function geocodeCafe(name,neighborhood,city){
  const hits=await lookupPlace(name,neighborhood,city);
  return hits.length?hits[0]:null;

// the other direction through the same keyless door (Phase 16): not "where is
// this name" but "what's at this coordinate" — the question OSM can answer
// for a café its own search index has never heard of, because the streets
// around it are mapped whether or not the shop itself is. A coordinate the
// keeper is vouching for (copied from a map that already has the place) never
// needs a name to confirm — it IS the confirmation.
async function reverseGeocode(lat,lon){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&addressdetails=1&lat=${lat}&lon=${lon}`,{headers:{'Accept':'application/json'}});
    if(!r.ok)return {hood:'',city:''};
    const x=await r.json();
    return {hood:hoodOf(x&&x.address),city:cityOf(x&&x.address)};
  }catch(e){return {hood:'',city:''}}
}
let _askBusy=false;
// grounding is one keyless Nominatim lookup per name, and there are more names
// to place now — the findings, the ones named only to be talked out of, and the
// wildcard. So it paces itself a second apart, the way geocodeCityPlaces does,
// and the progress line says which name it's on rather than sitting on "Asking…"
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function groundNamed(list,fallbackCity,say,onPlaced){
  const out=[];
  for(let i=0;i<list.length;i++){
    if(_askCancel)break;
    const f=list[i];
    const city=f.city||fallbackCity||'';
    if(i)await sleep(1000);
    if(say)say(`Placing ${f.name}…`);
    const geo=await geocodeCafe(f.name,f.neighborhood||'',city);
    // the confirmed area outranks the model's own — one was looked up, the
    // other was written from memory, and only one of them placed the pin
    const rec=Object.assign({},f,{id:uid(),city,lat:geo?geo.lat:null,lon:geo?geo.lon:null,
      neighborhood:(geo&&geo.hood)||f.neighborhood||'',
      grounded:!!geo,status:null,placeRef:null});
    out.push(rec);
    // the pin lands on the wait's own plot as the address confirms it, so the
    // answer is already half-drawn by the time it is read
    if(onPlaced)onPlaced(rec);
  }
  return out;
}
/* ============ the wait — narrated, on one hairline ============
 * The ask ran under the button that started it, saying "Asking…" into a grey
 * line: the one call Carta makes read like a form submitting. It is a screen of
 * its own now, and it narrates the work rather than performing patience — every
 * line is a stage the ask actually reached, read off the record it is reading
 * (VOICE.md: never fabricate precision — the counts here are counted, the floor
 * is the floor, and no line is written until the thing it says is true).
 *
 * The rule is the progress bar, and it is a hairline on purpose. The three
 * quick reads are the first fifth of it; the model's own thinking is the long
 * middle, where only the ember tip moves, breathing; the placings fill the rest
 * one name at a time, and each confirmed name lands on the plot as it does. So
 * the bar never runs backwards when the answer turns out to name eight places
 * instead of five — the ground it covers was allotted before the names arrived.

let askRun=null;          // {dest,kind,done[],now,pct,pins[],error}
let _askCancel=false,_askAbort=null;
const ASK_PCT_ASKING=22,ASK_PCT_READBACK=48,ASK_PCT_PLACED=96;
function askBegin(destination,kind){

  openAskingScreen();
}
// a stage reached: what was current drops to a footnote, the new line is
// written in, and the rule fills to where the work has actually got to
function askSay(line,pct){
  if(!askRun||_askCancel)return;
  if(askRun.now)askRun.done.push(askRun.now);
  askRun.now=line;
  if(pct!=null)askRun.pct=Math.max(askRun.pct,Math.round(pct));
  paintAsking();
}
// a name that came back with real ground under it — drawn the moment it does
function askPlace(f){
  if(!askRun||_askCancel||!f||f.lat==null||f.lon==null)return;
  askRun.pins.push({id:f.id||'',name:f.name||'',lat:f.lat,lon:f.lon,score:null,dim:false});
  paintAsking();

// what the ask is about to read, said in the record's own figures — three

function askOpeningLines(tm,scope){

  const cafes=live('places').length;
  const countries=Object.keys(tastedCountryMap()).length;
  const parts=[`${words(cups)} cup${cups===1?'':'s'}`,
    cafes?`${words(cafes)} café${cafes===1?'':'s'}`:null,
    countries?`${words(countries)} countr${countries===1?'y':'ies'}`:null].filter(Boolean);
  const anchors=tm.bar.anchors.length;
  const scoped=scope.kind?tm.scope(scope.kind,scope.id):null;
  const had=scoped?scoped.had.length:0;

    [cups?`Reading your record — ${parts.join(', ')}.`:'Reading your record — nothing scored on it yet.',6],
    [tm.bar.floor!=null
      ?`Weighing the bar you hold: ${tm.bar.floor} or better earns the walk${anchors?`, and ${words(Math.min(5,anchors))} roaster${anchors===1?' earns':'s earn'} a return`:''}.`
      :'No floor on the record yet — the ask goes out on what you notice alone.',12],
    [had
      ?`Excluding the ${words(had)} coffee${had===1?'':'s'} you have already had in ${scope.id} — no rehash.`
      :'Nothing excluded by name — everywhere goes out.',18],

async function runAsk(){
  if(_askBusy)return;
  captureAskDraft();
  if(!askKey()){openAskKey();return}
  const kind=askDraft.kind||'city';
  const destination=(askDraft.dest||'').trim();
  const question=(askDraft.question||'').trim();
  const reach=askReach();
  if(!destination){toast('Where should Carta ask about?');return}
  _askBusy=true;
  askBegin(destination,kind);
  const beat=ms=>sleep(_askCancel?0:ms);
  try{
    const tm=tasteModelMemo();
    const scope=askScopeOf(kind,destination);
    for(const [line,pct] of askOpeningLines(tm,scope)){
      askSay(line,pct);
      await beat(reducedMotion()?200:620);
      if(_askCancel)return;
    }
    const briefText=briefPlainText(D,scope.kind,scope.id,tm);
    const prompt=askPromptText(briefText,kind,destination,question,reach);
    askSay('Asking, with your key, this once.',ASK_PCT_ASKING);
    const raw=await callAskModel(prompt);
    if(_askCancel)return;
    const parsed=parseAskJSON(raw);
    const named=(parsed.findings||[]).length+(parsed.mentions||[]).length
      +((parsed.plan&&parsed.plan.wildcard)?1:0);
    askSay(`Reading the answer back — ${words(named)} name${named===1?'':'s'}, ranked and argued.`,ASK_PCT_READBACK);
    await beat(reducedMotion()?200:700);
    if(_askCancel)return;
    // one line per name, and the pin the moment the address confirms it: the
    // grounding pass was always the slow half, and now it is the readable half
    let placed_=0;
    const say=m=>askSay(m,ASK_PCT_READBACK+(ASK_PCT_PLACED-ASK_PCT_READBACK)*(placed_/Math.max(1,named)));
    const step=f=>{placed_++;askPlace(f)};
    const near=(kind==='city'||kind==='near')?destination:'';
    const findings=await groundNamed(parsed.findings,near,say,step);
    if(_askCancel)return;
    const mentions=await groundNamed(parsed.mentions,near,say,step);
    if(_askCancel)return;
    const plan=parsed.plan?Object.assign({},parsed.plan,
      {wildcard:parsed.plan.wildcard?(await groundNamed([parsed.plan.wildcard],near,say,step))[0]:null}):null;
    if(_askCancel)return;
    const all=findings.concat(mentions,(plan&&plan.wildcard)?[plan.wildcard]:[]);
    const lost=all.filter(f=>!f.grounded);
    askSay(lost.length
      ?(lost.length===1?`${lost[0].name} could not be confirmed — listed, never drawn.`
        :`${capFirst(words(lost.length))} names could not be confirmed — listed, never drawn.`)
      :`Every name confirmed against a real address.`,100);
    const ask={id:uid(),createdAt:new Date().toISOString(),kind,destination,question,reach,
      model:askModel(),read:parsed.read,findings,mentions,plan};
    await beat(reducedMotion()?200:900);
    _askBusy=false;
    if(_askCancel)return;
    // the write waits for the last beat's own cancel check — a cancel this
    // late still meets a fully-grounded answer, but it must still meet nothing
    // written, the same promise every earlier stage of this call already kept
    D.asks.unshift(ask);save();
    askDraft.dest='';   // the ask is on the record now; the field starts clean
    askRun=null;
    openAskResultScreen(ask.id);
  }catch(e){
    _askBusy=false;
    if(_askCancel||(e&&e.name==='AbortError'))return;
    // the degrade is stated where the wait was, with both doors on it
    const msg=(e&&e.message)||'Could not reach the model.';
    // the stage it failed on stays on the page: what was being attempted is
    // half the answer to why it didn't work
    if(askRun){if(askRun.now)askRun.done.push(askRun.now);askRun.error=msg;askRun.now='';}
    if(pageView&&pageView.kind==='asking')render();else toast(msg);
  }
}

 * not guessed: the screen is whatever the device gives it, and 43% of a guess
 * is a sheet that covers its own pins. carta-streets re-fits in place through
 * its own marks(), so the tiles are never refetched — the pins simply move
 * clear of the paper coming up to meet them. */
// three detents, not two: the list settled over half the map is the working
// height, but a city is a place before it is a list — the short detent hands
// the streets back, and the tall one gives the list the room to be read.
const CITY_DETENTS=[0.21,0.43,0.72],CITY_DETENT_DEFAULT=1;
let _citySheetUp=CITY_DETENT_DEFAULT;
function toggleCitySheet(){_citySheetUp=(_citySheetUp+1)%CITY_DETENTS.length;mountCity()}
function mountCity(){
  const sheet=document.getElementById('citysheet');if(!sheet)return;
  const main=document.getElementById('main');
  const h=Math.round((main.clientHeight||620)*CITY_DETENTS[_citySheetUp]);
  sheet.style.height=h+'px';
  const list=sheet.querySelector('.list');
  if(list)list.style.height=Math.max(0,h-74)+'px';
  // offline the drawn plot holds this screen: keep it clear of the sheet the
  // same way the streets keep their pins clear of it
  const wrap=document.querySelector('#main .plotwrap');
  if(wrap)wrap.style.bottom=h+'px';
  const map=document.querySelector('#main carta-streets');
  if(!map)return;
  map.setAttribute('inset-bottom',String(h));
  map.setAttribute('attrib-lift',String(h+10));
  if(typeof map.marks==='function')map.marks();   // re-fit in place; no remount, no refetch
}

/* the taps a map sends back. Both events bubble out of carta-maps' elements as
 * plain CustomEvents, so one listener each is the whole wiring — a country goes
 * to its chapter, a pin goes wherever the pin means from where you're standing:
 * a café from inside its city, the city itself from anywhere else. */
document.addEventListener('carta:country-tap',e=>{
  const name=String((e.detail&&e.detail.name)||'');if(!name)return;
  const t=tastedCountryMap()[landKey(name)];
  openCountryChapter(t?t.label:name);
});
document.addEventListener('carta:pin-tap',e=>{
  const id=String((e.detail&&e.detail.id)||'');if(!id)return;
  const kind0=pageView&&pageView.kind;
  // standing on a country, a pin on the ground is one of its regions
  if(kind0==='country'&&pageView.id){openRegionChapter(pageView.id,id);return}
  if(kind0==='region'){openProducerPage(pageView.id,id,pageView.region||'');return}
  if(askOf(id)){openAskFinding(id);return}   // an ask's own pin, inside its sheet
  const p=placeById(id);if(!p)return;
  const kind=pageView&&pageView.kind;
  if(kind==='city'||kind==='cafe'||kind==='cup'){closeSheet();openCafeScreen(id)}
  else if(p.city)openCityChapter(p.city);
});
// geocoding a café is the same lookup the ask already grounds its suggestions
// with (geocodeCafe, Phase 7) — one keyless Nominatim door, two callers. Fills
// blanks only, tries each place at most once ever (`geocoded`), and paces
// itself a second apart per Nominatim's own usage policy — a city chapter
// is a handful of cafés, never a bulk job.
let _geocoding=new Set(),_geoRenderT=null;
/* A café is placed silently when the lookup knows exactly one of it — which is
 * most cafés, and the keeper should never hear about those. Where it knows
 * several, Carta does not pick: only the keeper knows which Maru they were
 * actually in, and a pin chosen for them is a pin that is quietly wrong
 * forever. The branches are kept on the record and the café says so, once,
 * with its own real neighborhoods to choose from. That is the gentle join's
 * posture — offer, never merge — applied to an address instead of a name. */
async function geocodeCityPlaces(city){
  const targets=live('places').filter(p=>p.city&&fold(p.city)===fold(city)&&p.lat==null&&!p.geocoded&&!_geocoding.has(p.id));
  for(const p of targets){
    _geocoding.add(p.id);
    const hits=await lookupPlace(p.name,'',p.city);
    p.geocoded=true;
    if(hits.length===1)settlePlace(p,hits[0]);
    else if(hits.length>1)p.branches=hits;
    _geocoding.delete(p.id);
    save();
    // one repaint once the batch settles, not one per café: a repaint replaces
    // the screen's DOM, and the street layer inside it goes with it — so a
    // render per resolution turned "confirms quietly" into a map that flickers
    // and refetches its tiles every ~1.1s for any city with more than one
    // un-placed café. The debounce outlives the loop's own pacing, so a steady
    // drip of resolutions keeps pushing it out and it only fires once, after
    // the last one.
    // a correction can rename the very chapter the keeper is standing on out
    // from under them — the garbage city they opened settles to a real one and
    // the list below the title quietly empties. Follow them there rather than
    // leaving the stale name on screen over a chapter with nothing left in it.
    const on=pageView&&((pageView.kind==='city'&&fold(pageView.id)===fold(city))
      ||(pageView.kind==='cafe'&&targets.some(t=>t.id===pageView.id)));
    if(on){
      clearTimeout(_geoRenderT);
      _geoRenderT=setTimeout(()=>{
        if(pageView&&pageView.kind==='city'&&fold(pageView.id)===fold(city)&&!cityPlaces(city).length){
          const moved=[...new Set(targets.map(t=>t.city).filter(c=>c&&fold(c)!==fold(city)))];
          if(moved.length===1){pageView=Object.assign({},pageView,{id:moved[0]});_citySheetUp=CITY_DETENT_DEFAULT}
          else{closePage();go('atlas');return}
        }
        render();
      },1400);
    }
    await new Promise(r=>setTimeout(r,1100));
  }
}
// one branch, settled: the position and the area the lookup actually stated.
// The area only ever comes from a confirmed position — an unplaced café is
// never given a neighborhood, because there would be nothing behind it.
// where it actually is, confirmed. A café's own name and city are what the
// keeper typed and can be anything — the neighborhood was always blank until
// a lookup filled it, and the city gets the same treatment now: a confirmed
// address outranks free text, the same way Phase 15 already trusted it for
// the neighborhood. A rural hit with no city-level component in its address
// leaves the field exactly as it was rather than blanking it.
function settlePlace(p,hit){
  p.lat=hit.lat;p.lon=hit.lon;
  if(hit.hood)p.neighborhood=hit.hood;
  if(hit.city)p.city=hit.city;
  delete p.branches;
}
// the keeper answering the only question they can answer
function pickBranch(placeId,i){
  const p=placeById(placeId);if(!p||!p.branches)return;
  const hit=p.branches[i];if(!hit)return;
  const was={lat:p.lat,lon:p.lon,neighborhood:p.neighborhood,city:p.city,branches:p.branches};
  const cityChanged=hit.city&&fold(hit.city)!==fold(was.city||'');
  settlePlace(p,hit);save();render();
  toast(`Placed in ${[hit.hood,cityChanged?hit.city:''].filter(Boolean).join(', ')||p.city||'the city'}.`,()=>{
    const q=placeById(placeId);if(!q)return;
    q.lat=was.lat;q.lon=was.lon;q.neighborhood=was.neighborhood;q.city=was.city;q.branches=was.branches;
    save();render();
  },'Undo');
}
/* what the café says about its own ground. Three states, and only the middle
 * one is a question: several of it in this city and the keeper has to say
 * which; placed, stating where and offering the way back; or unplaced, which
 * is a fact rather than a failure and is written as one. */
// the fallback OSM's own search can't reach: paste whatever the keeper's
// phone already gave them from Google or Apple Maps, and Carta reads the pin
// straight out of it (Phase 16). Offered wherever a name search has nothing
// to show for itself — unplaced, or ambiguous with no branch that's the real
// one — never as a replacement for the search that already works.
const mapLinkHTML=p=>`<label class="f" style="margin-top:10px"><span class="l">Or paste a map link</span>
  <input type="text" id="ml_${p.id}" placeholder="Copied from Google or Apple Maps…"></label>
  <button class="btn btn-quiet" style="min-height:40px" onclick="pastePlaceLink('${p.id}')">Place it</button>`;
function placeBranchHTML(p){
  if(p.branches&&p.branches.length)return `<div class="box" style="margin-top:20px">
    <div class="eyebrow" style="margin-bottom:4px">Which one</div>
    <div class="m">${esc(capFirst(words(p.branches.length)))} of these in ${esc(p.city||'this city')}. Only you know which you were in.</div>
    <div class="picks" style="margin-top:12px">
      ${p.branches.map((b,i)=>`<button class="pick" onclick="pickBranch('${p.id}',${i})">${esc(b.hood||'Unnamed area')}</button>`).join('')}
    </div>
    <div class="m" style="margin-top:12px">None of these? ${mapLinkHTML(p)}</div></div>`;
  // where it is, is already the eyebrow over its name — this line only has to
  // carry the way back, which is the thing that never existed before. "Placed"
  // was the one state that dropped the map-link box once settled — so a café
  // fixed by hand, precisely because a name search could never find it, had
  // no way back to that same fix once "not right?" tried that same search
  // again and failed the same way. The box stays available in every state.
  if(p.lat!=null)return `<div class="m" style="margin-top:16px">Placed · <span class="text-action" onclick="replaceCafe('${p.id}')">not right?</span></div>
    ${mapLinkHTML(p)}`;
  return `<div class="m" style="margin-top:16px">Not placed yet · <span class="text-action" onclick="replaceCafe('${p.id}')">look it up</span></div>
    ${mapLinkHTML(p)}`;
}
// paste, parse, confirm — the same settle as a branch pick, same undo. A link
// Carta can't read gets a plain refusal, never a guess dressed up as a pin.
async function pastePlaceLink(placeId){
  const p=placeById(placeId);if(!p)return;
  const input=document.getElementById('ml_'+placeId);
  const coord=parseMapLink(input&&input.value);
  if(!coord){toast('Couldn\'t read a position from that — paste the map\'s own link, not a shortened share link.');return}
  const was={lat:p.lat,lon:p.lon,neighborhood:p.neighborhood,city:p.city,branches:p.branches};
  const geo=await reverseGeocode(coord.lat,coord.lon);
  const q=placeById(placeId);if(!q)return;
  const cityChanged=geo.city&&fold(geo.city)!==fold(was.city||'');
  settlePlace(q,{lat:coord.lat,lon:coord.lon,hood:geo.hood,city:geo.city});
  save();render();
  toast(`Placed in ${[geo.hood,cityChanged?geo.city:''].filter(Boolean).join(', ')||q.city||'the city'}.`,()=>{
    const r=placeById(placeId);if(!r)return;
    r.lat=was.lat;r.lon=was.lon;r.neighborhood=was.neighborhood;r.city=was.city;r.branches=was.branches;
    save();render();
  },'Undo');
}
// a pin can be wrong without being ambiguous — a café that moved, or a lookup
// that matched the wrong thing outright. This is the way back: forget what was
// settled and ask again, which is the correction path Phase 7 never built.
async function replaceCafe(placeId){
  const p=placeById(placeId);if(!p)return;
  toast('Looking again…');
  const hits=await lookupPlace(p.name,'',p.city);
  const q=placeById(placeId);if(!q)return;
  if(!hits.length){toast('No address could be confirmed for that name.');return}
  q.lat=null;q.lon=null;q.geocoded=true;
  if(hits.length===1){
    const was=q.city,hit=hits[0];
    const cityChanged=hit.city&&fold(hit.city)!==fold(was||'');
    settlePlace(q,hit);save();render();
    toast(`Placed in ${[hit.hood,cityChanged?hit.city:''].filter(Boolean).join(', ')||q.city||'the city'}.`);
    return;
  }
  q.branches=hits;save();render();
}

/* ============ the cards — the share (ROADMAP.md Phase 5) ============
 * Each kind renders through the same exportPageHTML shell the brief uses,
 * embedding carta.card/v1 so "add this to my Carta" is one tap on the other
 * end (see the import door below) — never a rank, never a network call, a
 * page on Carta paper either way. Coffee and place cards carry a real
 * record to add; the passport and the year are readings over your own
 * record and have nothing a stranger could import. */
function coffeeCardHTML(coffeeId){
  const c=coffeeById(coffeeId);if(!c)return null;
  const cups=D.cups.filter(x=>!x.archived&&x.coffeeRef===coffeeId&&x.score!=null);
  const avg=cups.length?cups.reduce((s,x)=>s+x.score,0)/cups.length:null;
  const best=cups.slice().sort((a,b)=>(b.score-a.score)||byNew(a,b))[0];
  const photo=best&&best.photo?getCupPhoto(best.id):null;
  const body=`${photo?`<img class="card-photo" src="${photo}" alt="">`:''}
${c.roaster?`<div class="kv"><span class="k">Roaster</span><span>${esc(c.roaster)}</span></div>`:''}
${originLine(c)?`<div class="kv"><span class="k">Origin</span><span>${esc(originLine(c))}</span></div>`:''}
${avg!=null?`<div class="kv"><span class="k">Score</span><span class="v score">${avg.toFixed(1)} / 9 · ${cups.length} cup${cups.length===1?'':'s'}</span></div>`:''}
${c.notes?`<h2>Notes</h2><div class="lede" style="margin:0">${esc(c.notes)}</div>`:''}`;
  return exportPageHTML({title:coffeeLabel(c),eyebrow:'a coffee',lede:'A coffee from my Carta.',bodyHTML:body,

    embedData:{version:'carta.card/v1',kind:'coffee',generatedAt:new Date().toISOString(),
      data:{roaster:c.roaster||'',name:c.name||'',origin:c.origin||{},notes:c.notes||''}}});
}
function placeCardHTML(placeId){
  const p=placeById(placeId);if(!p)return null;
  const cups=D.cups.filter(x=>!x.archived&&x.kind==='bar'&&x.placeRef===placeId&&x.score!=null);
  const avg=cups.length?cups.reduce((s,x)=>s+x.score,0)/cups.length:null;
  const body=`${p.city?`<div class="kv"><span class="k">City</span><span>${esc(p.city)}</span></div>`:''}
${avg!=null?`<div class="kv"><span class="k">Score</span><span class="v score">${avg.toFixed(1)} / 9 · ${cups.length} cup${cups.length===1?'':'s'}</span></div>`:''}`;
  return exportPageHTML({title:p.name,eyebrow:'a café',lede:'A café from my Carta.',bodyHTML:body,

function passportCardHTML(){
  const tasted=tastedCountryMap();
  const countries=Object.values(tasted).sort((a,b)=>a.label.localeCompare(b.label));
  const body=`${passportSVG(false)}
<h2>Tasted</h2>
<div class="lede" style="margin:0">${countries.length?countries.map(c=>esc(c.label)).join(', '):'Nothing yet.'}</div>`;
  return exportPageHTML({title:'My passport',eyebrow:'the passport',
    lede:`${countries.length} countr${countries.length===1?'y':'ies'} tasted. The map remembers what the bags said.`,
    bodyHTML:body,footNote:'Carried from Carta, offline.',embedId:'carta-card',

      data:{countries:countries.map(c=>c.label)}}});
}
function knownYears(){
  const years=new Set();
  live('cups').forEach(c=>{if(c.at)years.add(new Date(c.at).getFullYear())});
  return [...years].sort((a,b)=>b-a);
}
function yearCardHTML(year){
  const yearCups=D.cups.filter(c=>!c.archived&&c.score!=null&&c.at&&new Date(c.at).getFullYear()===year);
  const tm=tasteModel({coffees:D.coffees,places:D.places,cups:yearCups});

<div class="kv"><span class="k">Nines</span><span class="v score">${tm.bar.nines.length}</span></div>
${tm.bar.anchors.length?`<h2>Roasters you kept reaching for</h2>${tm.bar.anchors.slice(0,5).map(a=>`<div class="kv"><span class="k">${esc(a.name)}</span><span>${a.avg.toFixed(1)} avg · ${a.n} cups</span></div>`).join('')}`:''}
${tm.vector.origins.length?`<h2>Where it came from</h2><div class="lede" style="margin:0">${tm.vector.origins.slice(0,6).map(o=>esc(o.value)).join(', ')}</div>`:''}`;

      data:{year,cups:yearCups.length,nines:tm.bar.nines.length,anchors:tm.bar.anchors.map(a=>a.name)}}});

let cardPending=null;
function openCardPreview(html,filename,title){
  cardPending={html,filename,title};
  openSheet(`<h3>${esc(title)}</h3>
  <div class="sub">A self-contained page — the exact file that goes out.</div>
  <iframe srcdoc="${esc(html)}" style="width:100%;height:360px;border:1px solid var(--line-strong);margin-bottom:14px;background:var(--paper)"></iframe>
  <button class="btn btn-primary" onclick="shareCardPending()">Share this card</button>
  <div class="note">One file, self-contained, on Carta paper. It goes to the share sheet where the browser offers one, and downloads where it doesn’t — the point is a friend on the other end.</div>`);
}
function shareCardPending(){if(cardPending)shareOrDownload(cardPending.html,cardPending.filename,cardPending.title)}
function shareCoffeeCard(coffeeId){

  openCardPreview(html,`carta-coffee-${fold(coffeeLabel(c)).replace(/\s+/g,'-').slice(0,40)}.html`,coffeeLabel(c));
}
function sharePlaceCard(placeId){

}
function sharePassportCard(){openCardPreview(passportCardHTML(),'carta-passport.html','My passport')}
function shareYearCard(year){openCardPreview(yearCardHTML(year),`carta-${year}.html`,`${year} in cups`)}
/* ============ the return loop, without gamification (ROADMAP.md Phase 11) ============
 * A fact stated once, not a badge: the exact moment a country or city
 * first lands on the passport, one sentence plus the offer to share it
 * while the win is fresh — never a streak, a badge, or a percent-complete
 * (the fifth tripwire, ROADMAP.md §"the tripwires"). Bootstraps silently
 * against whatever's already tasted the first time this ever runs, so an
 * existing record — or a bulk classic import, which never calls this at
 * all — doesn't flood with "new!" for ground that was never actually new.
 * A brand-new keeper's very first country stays silent too: everything is
 * "new" on day one, and announcing each one of a first sitting's cups
 * reads exactly like the onboarding-reward pattern this phase refuses. */
function newGroundToast(kind,rawValue,fallbackMsg){
  const value=(rawValue||'').trim();
  if(!value){if(fallbackMsg)toast(fallbackMsg);return}
  const prefKey=kind==='country'?'seenCountries':'seenCities';
  const key=kind==='country'?landKey(value):fold(value);
  const currentKeys=kind==='country'?Object.keys(tastedCountryMap()):knownCities().map(fold);
  let seen=getPref(prefKey,null);
  if(!seen){setPref(prefKey,currentKeys);if(fallbackMsg)toast(fallbackMsg);return}
  if(seen.includes(key)){if(fallbackMsg)toast(fallbackMsg);return}
  setPref(prefKey,[...seen,key]);
  const label=kind==='country'?((tastedCountryMap()[key]||{}).label||value):value;
  toast(`New ground: ${label}.`,()=>sharePassportCard(),'Share the passport');
}

/* ---- the import door — a coffee or a café card, read back in ---- */
let importPending=null;
function openImportCard(){
  importPending=null;
  openSheet(`<h3>Import a card</h3>
  <div class="sub">A coffee or a café someone sent you from their Carta.</div>
  <label class="pickzone">Choose the file someone sent you
    <input type="file" accept=".html,text/html" id="import_file" onchange="importCardPicked(event)"></label>
  <div id="import_preview"></div>
  <div class="note">No account, no server, nothing touching the sender’s record — the card carries its own data, and you decide whether to keep it.</div>`);
}
function importCardPicked(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    const text=String(reader.result);
    const m=text.match(/<script type="application\/json" id="carta-card">([\s\S]*?)<\/script>/);
    if(!m){toast('That file doesn\'t look like a Carta card');return}
    let data;try{data=JSON.parse(m[1])}catch(err){toast('Could not read that card');return}
    if(!data||data.version!=='carta.card/v1'||(data.kind!=='coffee'&&data.kind!=='place')){
      toast('That card isn\'t a coffee or a café — nothing to add');return}
    importPending=data;
    const el=document.getElementById('import_preview');if(!el)return;
    const o=data.data.origin||{};
    el.innerHTML=`<div style="margin-top:14px">${ledgerHTML(data.kind==='coffee'
      ?[['Kind','A coffee'],['Roaster',data.data.roaster||''],['Coffee',data.data.name||''],
        ['Origin',[o.region||o.country,o.process].filter(Boolean).join(' · ')]]
      :[['Kind','A café'],['Café',data.data.name||''],['City',data.data.city||'']])}</div>
      <button class="btn btn-primary" style="margin-top:14px" onclick="confirmImportCard()">Add to my Carta</button>`;
  };
  reader.onerror=()=>toast('Could not read that file');
  reader.readAsText(f);
}
function confirmImportCard(){
  if(!importPending)return;
  const d=importPending;
  if(d.kind==='coffee'){
    const rr=resolveRoaster(d.data.roaster||'');
    D.coffees.push({id:uid(),createdAt:new Date().toISOString(),roaster:rr.name||d.data.roaster||'',roasterRef:rr.ref,
      name:d.data.name||'',origin:d.data.origin||{},notes:d.data.notes||'',home:true});
    toast('Added to your shelf.');
  }else{
    const m=matchNode('places',d.data.name||'');
    if(m.exact){if(!m.exact.city&&d.data.city)m.exact.city=d.data.city}
    else D.places.push({id:uid(),createdAt:new Date().toISOString(),name:d.data.name||'',city:d.data.city||'',aka:[]});
    toast('Added to your record.');
  }
  importPending=null;save();closeSheet();render();
}

/* ---- the classic importer (ROADMAP.md Phase 6) — classic's JSON export,
 * mapped through the pure importClassicMap (ARCHITECTURE.md §8), additive
 * and re-runnable: import the same file twice and the second run adds
 * nothing, because every minted record carries a sourceId back to classic's
 * own id and the mapper checks for it first. ---- */
let classicPending=null;
function openClassicImport(){
  classicPending=null;
  openSheet(`<h3>Import from classic</h3>
  <div class="sub">Classic's own export — read once, and safe to read again.</div>
  <label class="pickzone">Choose classic's export — Desk → Export → the working copy, a .json file
    <input type="file" accept=".json,application/json" id="classic_file" onchange="classicFilePicked(event)"></label>
  <div id="classic_preview"></div>
  <div class="note">Nothing is deleted or altered on the classic side; it is a one-way read. Read the same export twice and the second run adds nothing.</div>`);
}
function classicFilePicked(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    let json;try{json=JSON.parse(String(reader.result))}catch(err){toast('Could not read that file — is it classic\'s JSON export?');return}
    let mapped;try{mapped=importClassicMap(json,D)}catch(err){toast('Could not map that export');return}
    classicPending=mapped;
    renderClassicPreview(mapped);
  };
  reader.onerror=()=>toast('Could not read that file');

/* ============ the Atlas — home, with the map in front ============
 * The passport is the first thing the app shows and the largest thing on the
 * screen: tasted countries inked into the ground, their names knocked out of
 * their own shapes, each one tappable straight into its chapter. Everything
 * under it is the record read against geography — your cities, what you've
 * tasted, and where the record argues you should go next.

// numbers, said the way the rest of the app talks. Past ninety-nine a figure
// is a figure again — spelling it out would be affectation, not voice.
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function words(n){
  n=Math.round(n);
  if(n<0||n>99)return String(n);
  if(n<20)return ONES[n];
  return TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:'');
}
const capFirst=s=>s.charAt(0).toUpperCase()+s.slice(1);
const trimNum=n=>Number(n.toFixed(1)).toString();
// every cup the record can trace to a country, counted by that country
function countryCupCounts(){
  const m={};
  live('cups').forEach(c=>{
    const co=coffeeById(c.coffeeRef);
    const raw=co&&co.origin&&co.origin.country;
    if(!raw)return;
    const k=landKey(raw);m[k]=(m[k]||0)+1;
  });
  return m;
}
const placeCups=placeId=>live('cups').filter(c=>c.kind==='bar'&&c.placeRef===placeId&&c.score!=null);
function placeAvg(placeId){const cs=placeCups(placeId);return cs.length?cs.reduce((s,c)=>s+c.score,0)/cs.length:null}
const cityPlaces=city=>live('places').filter(p=>p.city&&fold(p.city)===fold(city));
// what a city amounts to, in one line: how many cafés, how many cups, and who
// leads — the same three facts the city's own sheet opens with
function cityMetaLine(city){
  const places=cityPlaces(city);
  const ids=new Set(places.map(p=>p.id));
  const cups=live('cups').filter(c=>c.kind==='bar'&&ids.has(c.placeRef));
  let lead=null;
  places.forEach(p=>{const a=placeAvg(p.id);if(a!=null&&(!lead||a>lead.avg))lead={name:p.name,avg:a}});
  return [`${places.length} café${places.length===1?'':'s'}`,
    `${cups.length} cup${cups.length===1?'':'s'}`,
    lead?`${lead.name} leads at ${trimNum(lead.avg)}`:null].filter(Boolean).join(' · ');
}

// the field on the passport hands off to the composer rather than firing the
// call: what kind of ask it is, and how far you'd go, are the difference

/* ============ the walk down from a country ============
 * A country was a dead end: a shape, a count, a flat list of coffees. It is a
 * chapter now, and the chapter opens downward — the road states how far the
 * record actually follows this ground, then its regions, the hands that grew
 * it, the hands that roast from it and the rooms it pours in each open one
 * level further. Everything here is read off the greens the record already
 * holds; nothing is fetched, nothing is inferred to fill a line.
 */
const originOf=c=>(c&&c.origin)||{};
const growerOf=c=>String(originOf(c).farm||originOf(c).producer||'').trim();
const regionOf=c=>String(originOf(c).region||'').trim();
/* ---- the ground under a green (the thin ledger-coupled wrappers over originPin).
 * A farm is placed the same two ways a café is, and by the same doors: one
 * keyless Nominatim lookup, or a pin the keeper pastes off the map they already
 * have. Neither invents one — a farm the lookup does not actually name back is
 * left unplaced and simply listed, which is most smallholder farms and is not a
 * failure. Placing writes to the coffees that name that farm in that country,
 * which is the same fold the grower list on this page already groups by. */
const farmPin=c=>originPin(originOf(c));
const regionPin=list=>meanPin((list||[]).map(farmPin));
function farmCoffees(country,farm){return countryCoffees(country).filter(c=>fold(growerOf(c))===fold(farm))}
// a region stands where its placed farms stand — and is drawn only where some do
function regionMarks(country){
  return groupStated(countryCoffees(country),regionOf).map(r=>{
    const at=regionPin(r.items);
    return at?{id:r.label,label:r.label,lat:at.lat,lon:at.lon}:null;
  }).filter(Boolean);
}
function setFarmPin(country,farm,at){
  farmCoffees(country,farm).forEach(c=>{c.origin=c.origin||{};c.origin.lat=at.lat;c.origin.lon=at.lon;c.origin.geocoded=true;c.updatedAt=new Date().toISOString()});
}
function clearFarmPin(country,farm){
  farmCoffees(country,farm).forEach(c=>{if(!c.origin)return;delete c.origin.lat;delete c.origin.lon;delete c.origin.geocoded;c.updatedAt=new Date().toISOString()});
}
let _farmBusy=false;
async function placeFarms(country,region){
  if(_farmBusy)return;_farmBusy=true;
  const inScope=c=>region?fold(regionOf(c))===fold(region):true;
  const farms=groupStated(countryCoffees(country).filter(inScope),growerOf)
    .filter(g=>!g.items.some(farmPin)&&!g.items.every(c=>originOf(c).geocoded));
  if(!farms.length){_farmBusy=false;toast('Every farm here is already placed, or none is named.');return}
  let put=0;
  for(const g of farms){
    toast(`Placing ${g.label}…`);
    const hits=await lookupPlace(g.label,region||regionOf(g.items[0]),country);
    const hit=hits.find(h=>namesBack(h,g.label));
    if(hit){setFarmPin(country,g.label,hit);put++}
    else farmCoffees(country,g.label).forEach(c=>{c.origin=c.origin||{};c.origin.geocoded=true});
    save();
    if(g!==farms[farms.length-1])await sleep(1100);
  }
  _farmBusy=false;render();
  toast(put?`${capFirst(words(put))} of ${words(farms.length)} placed.`:'None of these farms is on the map by name.');
}
const countryCoffees=name=>live('coffees').filter(c=>landKey(originOf(c).country||'')===landKey(name));
function cupsOfCoffees(list){const ids=new Set(list.map(c=>c.id));return live('cups').filter(c=>ids.has(c.coffeeRef))}
function avgOf(cups){const s=cups.filter(c=>c.score!=null);return s.length?s.reduce((a,c)=>a+c.score,0)/s.length:null}
// a stated value, grouped under the keeper's own commonest spelling of it —
// never a resolver, never a lookup key printed back at them (VOICE.md)
function groupStated(list,keyFn){
  const m={};
  list.forEach(x=>{
    const raw=String(keyFn(x)||'').trim();if(!raw)return;
    const k=fold(raw);
    (m[k]=m[k]||{key:k,label:raw,items:[],spellings:{}});
    m[k].items.push(x);m[k].spellings[raw]=(m[k].spellings[raw]||0)+1;
  });
  return Object.values(m).map(g=>{
    g.label=Object.entries(g.spellings).sort((a,b)=>b[1]-a[1])[0][0];
    g.cups=cupsOfCoffees(g.items);g.avg=avgOf(g.cups);
    return g;
  });
}
const byAvgDesc=(a,b)=>(b.avg==null?-1:b.avg)-(a.avg==null?-1:a.avg)||b.items.length-a.items.length;
function andList(words){
  if(words.length<2)return words[0]||'';
  return words.slice(0,-1).join(', ')+' and '+words[words.length-1];
}
// what a green's own list amounts to, in the line a chapter row carries
function greensMeta(g){
  const n=g.items.length,cups=g.cups.length;
  const lead=g.items.map(c=>({c,a:avgOf(cupsOfCoffees([c]))})).filter(x=>x.a!=null).sort((a,b)=>b.a-a.a)[0];
  return [`${words(n)} coffee${n===1?'':'s'}`,cups?`${words(cups)} cup${cups===1?'':'s'}`:null,
    lead?`${lead.c.name||coffeeLabel(lead.c)} leads`:null].filter(Boolean).join(' · ');
}
/* the road — six stations, and the plain fact of which ones this record
 * reaches. A hollow station is not a failure and never reads as one: a bag
 * that says nothing is a record that has been told less, not a lesser coffee. */
const ROAD_STATIONS=[
  {name:'Grown',has:c=>!!growerOf(c)},
  {name:'Processed',has:c=>!!String(originOf(c).process||'').trim()},
  {name:'Milled',has:c=>!!String(originOf(c).mill||'').trim()},
  {name:'Roasted',has:c=>!!String(c.roaster||'').trim()},
];
function roadStations(coffees,cups){
  const poured=new Set(cups.filter(c=>c.kind==='bar'&&c.placeRef).map(c=>c.placeRef));
  return ROAD_STATIONS.map(s=>({name:s.name,n:coffees.filter(s.has).length}))
    .concat([{name:'Poured',n:poured.size},{name:'Read',n:cups.length}]);
}
function roadHTML(st){
  const rail=(edge,joined)=>edge?'<i class="end"></i>':`<i class="${joined?'':'gap'}"></i>`;
  return `<div class="road">${st.map((s,i)=>{
    const on=s.n>0,prev=i>0?st[i-1].n>0:true,next=i<st.length-1?st[i+1].n>0:true;
    return `<div class="st${on?'':' off'}">
      <div class="rail">${rail(i===0,on&&prev)}<span class="mk${on?'':' off'}"></span>${rail(i===st.length-1,on&&next)}</div>
      <div class="n">${on?s.n:'—'}</div>
      <div class="l">${s.name}</div>
    </div>`;
  }).join('')}</div>`;
}
function roadNote(st,coffees){
  const silent=st.filter(s=>!s.n).map(s=>s.name.toLowerCase());
  const filled=st.length-silent.length;
  const noFarm=coffees.filter(c=>!growerOf(c)).length;
  const bits=[`${capFirst(words(filled))} station${filled===1?'':'s'} stand${filled===1?'s':''} out of ${words(st.length)}.`];
  if(silent.length)bits.push(`${capFirst(andList(silent))} ${silent.length===1?'is':'are'} silent on every green here.`);
  if(noFarm)bits.push(`${capFirst(words(noFarm))} of ${words(coffees.length)} name${noFarm===1?'s':''} no farm at all.`);
  bits.push('Coverage counts — it never grades.');

// heights, read only where a bag actually states one: every figure a stated
// altitude carries, so "1,900 – 2,100 m" reads as a span and "1900 masl" as a
// point. Nothing is read across from a neighbouring lot.
function altitudesOf(coffee){
  const out=[];
  (String(originOf(coffee).altitude||'').match(/\d[\d,.]*/g)||[]).forEach(t=>{
    const n=Number(t.replace(/[,.]/g,''));
    if(isFinite(n)&&n>=300&&n<=3000)out.push(n);
  });
  return out;
}
function altitudeBandHTML(coffees){
  const stated=coffees.filter(c=>altitudesOf(c).length);
  const all=stated.reduce((a,c)=>a.concat(altitudesOf(c)),[]);
  const silent=coffees.length-stated.length;
  const note=stated.length
    ? `Stated by ${words(stated.length)} bag${stated.length===1?'':'s'}${silent?`. Unread on ${words(silent)}`:''} — height places a coffee, it never ranks it.`
    : `No bag here states a height. Unread is a state, not a low one — height places a coffee, it never ranks it.`;
  if(!all.length){
    return `<div class="box" style="margin-top:22px">

        <span class="num" style="font-size:16px;color:var(--text-disabled);font-style:italic">unread</span></div>
      <div class="note" style="border:0;padding:0;margin:12px 0 0">${esc(note)}</div></div>`;
  }

  // read against the same ground every time — never fitted to flatter itself
  const axLo=Math.min(1200,Math.floor(lo/100)*100),axHi=Math.max(2400,Math.ceil(hi/100)*100);

    <div class="row"><span class="eyebrow" style="margin:0">Grown between</span>
      <span class="num" style="font-size:16px">${lo===hi?`${lo.toLocaleString()} m`:`${lo.toLocaleString()} – ${hi.toLocaleString()} m`}</span></div>
    <div class="band"><span style="left:${left.toFixed(1)}%;right:${right.toFixed(1)}%;${lo===hi?'width:5px;right:auto':''}"></span></div>
    <div class="band-ax"><span>${axLo.toLocaleString()} m</span><span>the atlas</span><span>${axHi.toLocaleString()} m</span></div>
    <div class="note" style="border:0;padding:0;margin:12px 0 0">${esc(note)}</div>

/* ============ a country — the chapter under its own shape ============ */

    return `<div>

      </div></div>`;
  }
  return `<div>
    <div style="position:relative">

      </div>

      <button class="omini overlay" style="left:18px;top:18px" onclick="closePage()">← The passport</button>
    </div>
    <div class="lift pad" style="padding-top:22px">
      <div class="eyebrow" style="margin:4px 0 6px">A country</div>
      <div class="display big">${esc(label)}</div>
      <div class="lede">${esc(lede)}</div>

      <div class="shead" style="margin-top:28px"><span class="l">How far the record follows it</span>
        <span class="r">${words(filled)} of ${words(st.length)}</span></div>
      ${roadHTML(st)}

      <div class="shead"><span class="l">Its regions</span>
