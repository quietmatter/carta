/* ============================================================================
 * CARTA — the token layer  (sub-brand of Quiet Matter)
 * ----------------------------------------------------------------------------
 * Ported wholesale from classic (ARCHITECTURE.md §1) — the token architecture
 * is unchanged by the fourth turn. Charter: docs/SUBBRAND.md.
 * ========================================================================== */
:root{
  --s11:0.6875rem; --s13:0.8125rem; --s15:0.9375rem; --s16:1rem; --s18:1.125rem;
  --track-label:0.12em; --track-foot:0.04em;
  --w-regular:400; --w-medium:500; --w-semibold:600;
  --measure:37ch; --measure-editorial:56ch; --touch-min:44px;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'Libre Franklin',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;

  --ca-paper-0:#f8f5ee; --ca-paper-50:#f2eee6; --ca-paper-100:#e9e3d8; --ca-paper-200:#ddd5c7;
  --ca-ink-900:#241d18; --ca-ink-600:#554a41; --ca-ink-450:#776b60; --ca-ink-300:#b8b5b0;
  --ca-line-ink:rgba(36,29,24,.13); --ca-line-paper:rgba(236,233,227,.14);
  --ca-ember:#a63f2b; --ca-ember-ink:#fffaf1; --ca-danger:#8c3b34;

  --ca-night-900:#171310; --ca-night-800:#211b17; --ca-night-700:#2d241f; --ca-night-600:#342923;
  --ca-roastlight-100:#f0e9dd; --ca-roastlight-300:#c8bcae; --ca-roastlight-500:#9f9183; --ca-roastlight-700:#5b574f;
  --ca-ember-dusk:#e06b4f;

  --radius:0; --chipr:2px;

  --text-primary:var(--ca-ink-900); --text-secondary:var(--ca-ink-600); --text-subtle:var(--ca-ink-450);
  --text-disabled:var(--ca-ink-300); --text-on-fill:var(--ca-ember-ink);
  --surface-page:var(--ca-paper-50); --surface-card:var(--ca-paper-0); --surface-sunk:var(--ca-paper-100);
  --border-hairline:var(--ca-line-ink); --border-strong:var(--ca-ink-900); --border-control:var(--ca-ink-450);
  --link:var(--ca-ink-600); --link-hover:var(--ca-ink-900); --focus-ring:var(--ca-ink-900);
  --fill-strong:var(--ca-ink-900); --fill-strong-hover:var(--ca-ink-600);
  --signal:var(--ca-ember); --signal-ink:var(--ca-ember-ink); --status-danger:var(--ca-danger);

  --ink:var(--text-primary); --ink-2:var(--text-secondary); --ink-3:var(--text-subtle); --ink-d:var(--text-disabled);
  --paper:var(--surface-page); --paper-card:var(--surface-card); --paper-2:var(--surface-sunk); --paper-3:var(--ca-paper-200);
  --line:var(--border-hairline); --line-2:var(--ca-paper-200); --line-strong:var(--border-strong);
  --accent:var(--signal); --accent-ink:var(--signal-ink); --danger:var(--status-danger);

  --mo-fast:130ms; --mo-base:230ms; --mo-considered:820ms; --mo-ease:cubic-bezier(.22,.61,.36,1);
}
html[data-theme="dusk"]{
  --text-primary:var(--ca-roastlight-100); --text-secondary:var(--ca-roastlight-300); --text-subtle:var(--ca-roastlight-500);
  --text-disabled:var(--ca-roastlight-700); --text-on-fill:var(--ca-night-900);
  --surface-page:var(--ca-night-900); --surface-card:var(--ca-night-800); --surface-sunk:var(--ca-night-700);
  --border-hairline:var(--ca-line-paper); --border-strong:var(--ca-roastlight-100); --border-control:var(--ca-roastlight-500);
  --link:var(--ca-roastlight-300); --link-hover:var(--ca-roastlight-100); --focus-ring:var(--ca-roastlight-100);
  --fill-strong:var(--ca-roastlight-100); --fill-strong-hover:var(--ca-roastlight-300);
  --signal:var(--ca-ember-dusk); --signal-ink:var(--ca-night-900);
  --line-2:var(--ca-night-700); --paper-3:var(--ca-night-600);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--surface-page)}
body{
  background:var(--surface-card);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5;
  max-width:480px;margin:0 auto;border:1px solid var(--line-2);height:100vh;height:100dvh;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
/* the leaf, ruled twice — the sheet's own edge, and the margin it's written inside */
body::before{content:"";position:absolute;inset:5px;z-index:35;border:1px solid var(--border-hairline);pointer-events:none}
.num{font-family:var(--sans);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* the app's own header is gone (ROADMAP.md Phase 12): the wordmark now sits on
   the passport itself, and the door moved into the bar, where it's reachable
   from every room instead of only from the top of one. */
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0;position:relative;z-index:1}
/* a screen that owns its own frame — a full-bleed map with a sheet drawn over
   it — takes the scroll off main and manages it inside itself */
main.fixed{overflow:hidden}
main.fixed>*{position:absolute;inset:0}
.pad{padding:0 20px 26px}

h2{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;
  color:var(--ink-3);font-weight:500;margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h2:first-child{margin-top:2px}
.eyebrow{font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0 0 8px}
.display{font-family:var(--serif);font-weight:600;font-size:1.625rem;line-height:1.12;letter-spacing:-.02em;
  color:var(--ink);margin:0 0 6px;text-wrap:balance}
.display em{font-style:italic;font-weight:400}
/* the reading size — body serif at 17px, the redesign's floor for anything
   meant to be read rather than scanned (ROADMAP.md Phase 12) */
.lede{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink-2);margin:0 0 14px;max-width:var(--measure)}
.note{border-top:1px solid var(--line);padding-top:12px;margin:10px 0 4px;font-family:var(--serif);font-style:italic;font-size:var(--s13);color:var(--ink-3)}
.back{display:inline-block;background:none;border:0;padding:0 0 12px;cursor:pointer;color:var(--ink-3);
  font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase}
.back:active{color:var(--ink)}
.rowlink{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:12px 0;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rowlink:active{background:var(--paper-2)}
.rowlink .t{font-family:var(--serif);font-size:var(--s16);color:var(--ink)}
.rowlink .m{font-family:var(--sans);font-size:var(--s11);color:var(--ink-3);letter-spacing:.02em;line-height:1.5}
.rowlink .go{flex:none;color:var(--ink-3);font-family:var(--sans);font-size:var(--s11)}
.rowlink .row-main{display:flex;align-items:center;gap:10px;min-width:0}
/* one photo, optional forever, presentation governed by restraint (PIVOT.md
   decision #1) — a small square, never a hero, never blown up */
.thumb{width:36px;height:36px;object-fit:cover;border:1px solid var(--line);flex:none;border-radius:var(--radius)}
.thumb.big{width:100%;height:auto;max-height:260px;margin:0 0 12px}
.btnrow{display:flex;gap:8px;align-items:stretch}
.btnrow .btn,.btnrow .btn+.btn{margin-top:0;flex:1}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.muted{color:var(--ink-3);font-family:var(--sans);font-size:13px}
.small{font-size:13px}
.serif{font-family:var(--serif)}
strong{font-family:var(--serif);font-weight:600;font-style:normal}
.opt{text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:400;font-size:10px;font-style:italic;font-family:var(--serif)}

.chip{display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.02em;padding:2px 8px;
  border-radius:var(--chipr);background:var(--paper);border:1px solid var(--line);color:var(--ink-3);font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--line-strong);color:var(--ink)}

.btn{display:block;width:100%;text-align:center;min-height:44px;padding:11px 16px;border-radius:var(--radius);
  font-family:var(--sans);font-size:var(--s13);font-weight:400;letter-spacing:.02em;transition:background .2s ease,color .2s ease,border-color .2s ease}
.btn.mini{min-height:32px;padding:5px 10px;font-size:var(--s11)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent)}
.btn-primary:active{filter:brightness(.88)}
.btn-quiet{background:none;border:1px solid var(--line-strong);color:var(--ink)}
.btn-quiet:active{background:var(--paper-2)}
.btn-danger{color:var(--danger);border:1px solid var(--danger);background:none}
.btn-danger:active{background:var(--paper-2)}
.btn+.btn{margin-top:8px}

label.f,div.f{display:block;margin-bottom:14px;min-width:0}
label.f span.l,div.f span.l{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;font-weight:500}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;font-family:var(--serif);font-size:16px;padding:9px 0;border:none;border-bottom:1px solid var(--ink-3);
  border-radius:0;background:transparent;color:var(--ink);appearance:none;-webkit-appearance:none}
input::placeholder,textarea::placeholder{color:var(--ink-d);font-style:italic}
select{background:transparent}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--ink)}
textarea{min-height:60px;resize:vertical;border:1px solid var(--line);padding:9px 11px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:0 12px}
details.more{margin:4px 0 14px}
details.more summary{cursor:pointer;font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:10px}

/* ===== dial (the field-tool scale exception) ===== */
.dial{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-card);padding:9px 6px 11px;margin-bottom:10px;text-align:center;position:relative}
.dial .l{font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.dial .v{font-family:var(--sans);font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15;margin:5px 0 7px;color:var(--ink)}
.dial .v .u{font-family:var(--sans);font-size:12px;color:var(--ink-3);font-weight:400;margin-left:2px}
.dial .ctl{display:flex;justify-content:center;gap:6px}
.dial .ctl button{width:58px;height:40px;border:1px solid var(--line-strong);border-radius:var(--radius);background:transparent;font-size:20px;font-weight:400;color:var(--ink-2)}
.dial .ctl button:active{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.dial .ticks{position:absolute;top:9px;right:11px;font-family:var(--sans);font-size:9px;color:var(--ink-3);letter-spacing:.06em}
.dial .v.tapedit{display:inline-block;cursor:text;border-bottom:1px dotted var(--ink-3)}
.dedit{width:2.7em;min-width:46px;max-width:88%;font-family:var(--sans);font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;text-align:center;border:none;background:transparent;color:var(--ink);padding:0}
.dedit:focus{outline:none}
.dcorner{position:absolute;top:7px;right:7px;display:flex;gap:3px}
.dcorner .ut{font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.02em;padding:2px 6px;border:1px solid var(--line-strong);background:transparent;color:var(--ink-3);border-radius:var(--chipr);cursor:pointer}
.dcorner .ut.on{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.dialrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.hedonic{display:flex;gap:5px;justify-content:space-between;margin:6px 0 4px}
.hedonic button{flex:1;aspect-ratio:1/1.1;border:1px solid var(--line-strong);border-radius:var(--radius);background:transparent;font-family:var(--sans);font-variant-numeric:tabular-nums;font-size:16px;color:var(--ink-2);max-width:44px}
.hedonic button.on{background:var(--ink);color:var(--text-on-fill);border-color:var(--ink);font-weight:600}
.desc{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.desc button{font-family:var(--sans);font-size:13px;padding:9px 13px;min-height:40px;border:1px solid var(--line-strong);border-radius:var(--chipr);background:transparent;color:var(--ink-2)}
.desc button.on{background:var(--ink);color:var(--text-on-fill);border-color:var(--ink)}

.timer{background:var(--paper-2);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:16px}
.timer .t{font-family:var(--sans);font-size:52px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.timer .ctl{display:flex;gap:8px;margin-top:14px}
.timer .ctl button{flex:1;min-height:46px;padding:11px 6px;border-radius:var(--radius);border:1px solid var(--line-strong);color:var(--ink);font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.timer .ctl button.go{background:var(--fill-strong);border-color:var(--fill-strong);color:var(--text-on-fill)}

/* ===== the bar — three rooms, typographic, no icons, and the door ===== */
/* the bar sits above the leaf's inner rule (body::before, z-index 35) — a
   hairline running across the door's ember block reads as a mistake, not a
   margin */
nav.tabs{flex:none;background:var(--surface-card);display:flex;align-items:stretch;z-index:36;
  padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line)}
nav.tabs button{flex:1;appearance:none;-webkit-appearance:none;background:none;padding:12px 4px 14px;
  color:var(--ink-3);font-family:var(--sans);font-size:11.5px;
  letter-spacing:var(--track-label);text-transform:uppercase;font-weight:500;min-height:56px;
  border:none;border-top:2px solid transparent;margin-top:-1px}
nav.tabs button.on{color:var(--ink);border-top-color:var(--ink)}
/* the door is the one ember in the bar — a persistent block, not a fourth room */
nav.tabs button.door{flex:none;width:118px;background:var(--accent);color:var(--accent-ink);
  border:0;margin-top:0;display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.1em}
nav.tabs button.door:active{filter:brightness(.9)}
nav.tabs[hidden]{display:none}

/* ===== the settle — plays on a screen change, stilled under reduced motion ===== */
@keyframes ca-settle{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ca-screen{animation:ca-settle var(--mo-base) var(--mo-ease) both}
@media (prefers-reduced-motion:reduce){.ca-screen{animation:none!important;opacity:1!important;transform:none!important}.sheet{transition:none}}

/* ===== sheet ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(26,26,22,.42);z-index:40;display:none}
.sheet-bg.open{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
  background:var(--paper);border-radius:0;border-top:1px solid var(--line-strong);z-index:50;
  max-height:92vh;max-height:92dvh;overflow-y:auto;overflow-x:hidden;display:none;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));transition:transform var(--mo-base) var(--mo-ease)}
.sheet.open{display:block}
.sheet .grab{height:26px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.sheet .grab::before{content:"";width:34px;height:3px;background:var(--ink-3);border-radius:2px;transition:background .15s,width .15s}
.sheet.dragging{transition:none}
.sheet.dragging .grab{cursor:grabbing}
.sheet.dragging .grab::before{background:var(--ink);width:44px}
.sheet h3{font-family:var(--serif);font-size:24px;line-height:1.15;font-weight:600;margin-bottom:4px;color:var(--ink);letter-spacing:-.01em}
.sheet .sub{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-size:var(--s15);margin-bottom:18px;max-width:37ch}

.empty{font-family:var(--serif);font-style:italic;color:var(--ink-3);text-align:center;padding:30px 20px;font-size:15px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:var(--s15);gap:12px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-3);font-family:var(--sans);font-size:var(--s11);letter-spacing:var(--track-label);text-transform:uppercase;flex:none;white-space:nowrap;line-height:1.5}
.kv .v{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.kv .v.score,.rowlink .go.score,.score{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}

.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:var(--chipr);font-family:var(--sans);font-size:13px;
  z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.withundo{pointer-events:auto}
.toast .undo{margin-left:10px;text-decoration:underline;cursor:pointer}
.toast.show{opacity:1}

/* ===== the map surfaces — drawn by carta-maps.js, inked here (MAPPING.md's law:
   a mark is a lens, never a rank, and the ember is never spent on the ground) =====
   The three custom elements live in light DOM on purpose, so every var() below
   resolves against the page's own token layer, dusk included. */
.mapbox{position:relative;background:var(--surface-sunk);overflow:hidden}
/* the passport's own ink: tasted countries ARE the mark — filled in body ink,
   their names knocked out of the shape in paper; the rest is a hairline ground */
.passport{--ca-land-fill:var(--surface-sunk);--ca-land-line:var(--ca-ink-300);
  --ca-mk-fill:var(--ink);--ca-mk-line:var(--ink);--ca-mk-label:var(--surface-card);
  --ca-mk-halo:transparent;--ca-mk-out:var(--ink)}
/* the drawn plot — offline, no tiles, the identity the streets hand back to */
.plot{--ca-dot:var(--ink);--ca-dim:var(--ink-3);display:block;width:100%}
.plot.frame{height:100%}
/* the type a map is read through, and the fade that lets it be read at all */
.fade{position:absolute;left:0;right:0;pointer-events:none;z-index:2}
.fade.top{top:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--surface-card) 92%,transparent) 8%,color-mix(in srgb,var(--surface-card) 0%,transparent) 100%)}
.fade.bottom{bottom:0;background:linear-gradient(to top,color-mix(in srgb,var(--surface-card) 92%,transparent) 20%,color-mix(in srgb,var(--surface-card) 0%,transparent) 100%)}
.overlay{position:absolute;z-index:4}
/* a control standing on a map keeps its own paper under it */
.omini{background:var(--surface-card);border:1px solid var(--line-strong);color:var(--ink);
  font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 13px;min-height:38px;cursor:pointer;border-radius:var(--radius)}
.omini.bare{background:none}
.omini:active{background:var(--paper-2)}
.leaflet-container{background:var(--surface-sunk)!important;font-family:var(--sans)!important}
.leaflet-control-attribution{font-size:9px!important;letter-spacing:.02em;
  background:color-mix(in srgb,var(--paper-card) 78%,transparent)!important;color:var(--ink-3)!important}
.leaflet-control-attribution a{color:var(--ink-3)!important;text-decoration:none}
.smap-note{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;background:var(--paper-card);border:1px solid var(--line);
  padding:6px 9px;font-family:var(--sans);font-size:11px;color:var(--ink-3);display:flex;gap:8px;align-items:center;justify-content:space-between}
.text-action{text-decoration:underline;cursor:pointer;flex:none;color:var(--ink-3)}

/* ===== the rooms — one screen's own furniture (ROADMAP.md Phase 12) ===== */
/* a screen's header, held at the top of its own scroll */
.shdr{position:sticky;top:0;z-index:6;background:var(--surface-card);border-bottom:1px solid var(--line);
  padding:22px 20px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.display.big{font-size:1.875rem}
/* a ruled section head — the label, and what the section amounts to */
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--line);padding-bottom:8px;margin:24px 0 2px}
.shead .l{font-family:var(--sans);font-size:var(--s11);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.shead .r{font-family:var(--sans);font-size:var(--s11);letter-spacing:.06em;color:var(--ink-3);text-align:right}
/* the list row, at the size the redesign reads at: the title leads, the meta
   sits off the faintest ink, and the score is set big enough to be the answer */
.lrow{width:100%;display:flex;align-items:center;gap:14px;text-align:left;color:var(--ink);
  background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer;min-height:64px}
.lrow:active{background:var(--paper-2)}
.lrow .t{display:block;font-family:var(--serif);font-size:18.5px;line-height:1.25;color:var(--ink)}
.lrow .m{display:block;font-family:var(--sans);font-size:12.5px;color:var(--ink-3);letter-spacing:.01em;margin-top:3px}
.lrow .mid{flex:1;min-width:0}
.lrow .go{flex:none;font-family:var(--sans);font-size:13px;color:var(--ink-3)}
.lrow .sc{flex:none;font-family:var(--sans);font-size:27px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
.lrow .sc.none{color:var(--text-disabled);font-size:22px}
.lrow .kind{flex:none;width:40px;align-self:flex-start;padding-top:5px;font-family:var(--sans);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-disabled)}
.lrow .mapthumb{flex:none;width:60px;height:44px;border:1px solid var(--line);background:var(--surface-page);display:block;overflow:hidden}
.lrow .ph{flex:none;width:44px;height:44px;object-fit:cover;border:1px solid var(--line)}
/* a country the record has tasted — a name and its weight, tappable */
.cchip{display:inline-flex;align-items:baseline;gap:7px;background:none;border:1px solid var(--line-strong);
  color:var(--ink);font-family:var(--serif);font-size:var(--s15);padding:8px 12px;min-height:38px;cursor:pointer;border-radius:var(--radius)}
.cchip:active{background:var(--paper-2)}
.cchip .n{font-family:var(--sans);font-size:var(--s11);color:var(--ink-3);font-variant-numeric:tabular-nums}
/* a boxed aside — the panel a screen argues from */
.box{border:1px solid var(--line);background:var(--surface-page);padding:18px}
.box.firm{border-color:var(--line-strong)}
/* the city's sheet, pulled up over its own streets */
.citysheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--surface-card);
  border-top:1px solid var(--line-strong);box-shadow:0 -18px 44px -18px rgba(36,29,24,.4);
  transition:height var(--mo-base) var(--mo-ease)}
.citysheet .pull{width:100%;background:none;border:0;padding:11px 0 6px;display:flex;justify-content:center;cursor:pointer}
.citysheet .pull span{width:40px;height:3px;background:var(--ink-3);display:block}
.citysheet .list{overflow-y:auto;padding:0 20px 18px}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
/* the cup's hero — the one photo, at last given the room it was always worth */
.hero{position:relative;height:300px;background:var(--surface-sunk);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .slot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  font-family:var(--serif);font-style:italic;font-size:var(--s15);color:var(--ink-3);cursor:pointer}
.hero .slot input{display:none}
/* a sheet of paper that starts under the map and slides over its last inch */
.lift{position:relative;background:var(--surface-card);border-top:1px solid var(--line-strong);margin-top:-18px}
/* the score, when the score is the subject — the one ember on the screen */
.bigscore{font-family:var(--sans);font-weight:600;font-variant-numeric:tabular-nums;line-height:1;color:var(--accent)}
.ofnine{font-family:var(--sans);font-size:var(--s11);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.dchip{font-family:var(--sans);font-size:12px;letter-spacing:.02em;padding:5px 10px;border:1px solid var(--line);
  color:var(--ink-2);background:var(--surface-page);border-radius:var(--chipr)}
/* what the taste model reads back — a figure, and the reasons under it */
.vbar{height:6px;background:var(--surface-sunk);position:relative;margin-top:2px}
.vbar span{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}

</style>
</head>
<body>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div class="sheet-bg" id="sheetbg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* Carta map surfaces — real geometry, no freehand.
 *  <carta-belt>    the growing world (the passport frame): the LANDS outlines the
 *                  file already carries, fitted to the box. No fetch, no tile.
 *  <carta-streets> a city or a single café: Leaflet + OpenStreetMap, inked to Carta.
 *  <carta-plot>    the drawn plot — a handful of points fit to a box, offline, no tiles.
 * All three live in light DOM so the page's own tokens (var(--ink) …) resolve.
 * Taps leave as bubbling events: carta:country-tap {name} · carta:pin-tap {id}.
 */
(() => {
  const BELT = ["hawaii","angola","argentina","australia","bangladesh","belize","bolivia","brazil","burundi","cambodia","cameroon","chile","china","colombia","republic of the congo","costa rica","côte d'ivoire","ivory coast","cuba","democratic republic of the congo","dominican republic","ecuador","el salvador","eritrea","ethiopia","ghana","guatemala","guyana","haiti","honduras","india","indonesia","jamaica","kenya","laos","madagascar","malawi","malaysia","mexico","mozambique","myanmar","nepal","nicaragua","nigeria","panama","papua new guinea","paraguay","peru","philippines","puerto rico","rwanda","south sudan","sri lanka","suriname","united republic of tanzania","tanzania","thailand","east timor","timor-leste","togo","trinidad and tobago","uganda","united states of america","venezuela","vietnam","yemen","zambia","zimbabwe"];
  const BELT_SET = new Set(BELT);
  const fold = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
  const AKA = { 'united states': 'united states of america', 'usa': 'united states of america', 'us': 'united states of america', 'drc': 'democratic republic of the congo', 'dem rep congo': 'democratic republic of the congo', 'dr congo': 'democratic republic of the congo', 'congo': 'republic of the congo', 'tanzania': 'united republic of tanzania', 'timor leste': 'east timor', 'east timor': 'east timor', 'ivory coast': "côte d'ivoire", 'cote d ivoire': "côte d'ivoire", 'burma': 'myanmar', 'cameron': 'cameroon', 'hawai': 'hawaii', 'dominican rep': 'dominican republic', 'philipines': 'philippines' };
  const key = n => { const f = fold(n); return AKA[f] || f; };

  /* the ground — the atlas the app already carries, not a fetch.
     LANDS is Natural Earth 1:110m for the same coffee-growing countries this
     component knows, decoded out of the file itself (docs/MAPPING.md), so the
     passport needs no tile, no CDN and nothing to be offline from. The keeper's
     own spelling rides along for the countries the record has tasted — the
     passport prints your words, never a lookup key. */
  const world = () => Promise.resolve(buildWorld());
  function buildWorld() {
    const names = (window.CARTA_LAND_NAMES && window.CARTA_LAND_NAMES()) || {};
    const out = [];
    Object.keys(LANDS).forEach(k => {
      const rings = landRingsRaw(k);
      if (!rings || !rings.length) return;
      const polys = rings.map(r => [r.map(p => [p.lon, p.lat])]).filter(p => p[0].length > 2);
      if (!polys.length) return;
      out.push({
        type: 'Feature',
        properties: { name: names[k] || k },
        geometry: polys.length === 1
          ? { type: 'Polygon', coordinates: polys[0] }
          : { type: 'MultiPolygon', coordinates: polys },
      });
    });
    return out;
  }

  /* the streets stay an enhancement, never a dependency (CLAUDE.md): Leaflet is
     injected at runtime the way MapLibre always was, and a surface that can't
     reach it hides itself so the drawn plot underneath simply stands. */
  const LF_JS = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  const LF_CSS = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  let _lfP = null, _lfDown = false;
  const lfLoad = () => {
    if (window.L) return Promise.resolve();
    if (_lfP) return _lfP;
    return _lfP = new Promise((res, rej) => {
      const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = LF_CSS;
      document.head.appendChild(css);
      const s = document.createElement('script'); s.src = LF_JS;
      const to = setTimeout(() => { _lfP = null; rej(new Error('slow')); }, 8000);
      s.onload = () => { clearTimeout(to); res(); };
      s.onerror = () => { clearTimeout(to); _lfP = null; rej(new Error('unreachable')); };
      document.head.appendChild(s);
    });
  };

  const keepPos = el => { if (getComputedStyle(el).position === 'static') el.style.position = 'relative'; };

  /* React owns the elements themselves, so never touch our own child list —
     each component paints into one private host div it appends once. */
  const hostOf = el => {
    if (!el._host) { const d = document.createElement('div'); d.style.display = 'block'; d.style.height = '100%'; el.appendChild(d); el._host = d; }
    return el._host;
  };

  class Belt extends HTMLElement {
    static get observedAttributes() { return ['tasted', 'labels', 'fit', 'focus', 'lift']; }
    connectedCallback() {
      this.style.display = 'block'; keepPos(this); this.paint();
      if (window.ResizeObserver && !this._ro) {
        this._ro = new ResizeObserver(() => { clearTimeout(this._rt); this._rt = setTimeout(() => this.paint(), 160); });
        this._ro.observe(this);
      }
    }
    disconnectedCallback() { if (this._ro) { this._ro.disconnect(); this._ro = null; } }
    attributeChangedCallback() { if (this.isConnected) this.paint(); }
    async paint() {
      let feats;
      try { feats = await world(); } catch (e) { return; }
      if (!this.isConnected) return;
      const host = hostOf(this);
      const d3 = window.d3;
      const tasted = new Set((this.getAttribute('tasted') || '').split(',').map(key).filter(Boolean));
      const labels = this.getAttribute('labels') !== 'off';
      const cover = this.getAttribute('fit') === 'cover';
      const focus = key(this.getAttribute('focus') || '');
      const frameTasted = this.getAttribute('frame') === 'tasted';
      const lift = this.getAttribute('lift') === 'on';
      const belt = feats.filter(f => BELT_SET.has(key(f.properties.name)));
      const cw = this.clientWidth || 480, ch = this.clientHeight || 0;
      const W = 1000, H = cover ? Math.max(360, Math.round(W * (ch || 432) / cw)) : 470;
      const proj = d3.geoEquirectangular();
      const target = focus ? belt.filter(f => key(f.properties.name) === focus)
        : frameTasted ? belt.filter(f => tasted.has(key(f.properties.name))) : belt;
      const coll = { type: 'FeatureCollection', features: target.length ? target : belt };
      if (cover) proj.fitExtent(frameTasted && target.length
        ? [[W * .2, H * .22], [W * .8, H * .78]]
        : [[26, 30], [W - 26, H - 30]], coll); else proj.fitSize([W, H], coll);
      const path = d3.geoPath(proj);
      const ground = [], marks = [];
      const size = lift ? 15 : 11;
      const hit = (a, b) => !(a.x1 + 2 < b.x0 || b.x1 + 2 < a.x0 || a.y1 + 2 < b.y0 || b.y1 + 2 < a.y0);
      const placed = [];
      const items = [];
      belt.forEach(f => {
        const d = path(f); if (!d) return;
        if (tasted.has(key(f.properties.name))) {
          const bb = path.bounds(f), c = path.centroid(f);
          items.push({ d, bb, cx: c[0], cy: c[1], label: f.properties.name, area: (bb[1][0] - bb[0][0]) * (bb[1][1] - bb[0][1]) });
        } else ground.push(`<path d="${d}" style="fill:var(--ca-land-fill, var(--surface-page));fill-opacity:.6;stroke:var(--ca-land-line, var(--line-2));stroke-width:${lift ? .8 : 1};stroke-linejoin:round;pointer-events:none"></path>`);
      });
      items.sort((a, b) => b.area - a.area).forEach(it => {
        const d = it.d, bb = it.bb, cx = it.cx, cy = it.cy, label = it.label;
        const tw = label.length * size * .52 + label.length * size * .06;   // Libre Franklin at .06em — close enough to place by
        const cands = [];
        if (tw < (bb[1][0] - bb[0][0]) - 6) cands.push({ x: cx, y: cy + 4, anchor: 'middle', inside: true, x0: cx - tw / 2, x1: cx + tw / 2 });
        [0, -1.3, 1.3].forEach(k => {
          const y = cy + 4 + k * size;
          cands.push({ x: bb[1][0] + 7, y, anchor: 'start', inside: false, x0: bb[1][0] + 7, x1: bb[1][0] + 7 + tw });
          cands.push({ x: bb[0][0] - 7, y, anchor: 'end', inside: false, x0: bb[0][0] - 7 - tw, x1: bb[0][0] - 7 });
        });
        let put = null;
        for (const c of cands) {
          const box = { x0: c.x0, x1: c.x1, y0: c.y - size * .8, y1: c.y + size * .3 };
          if (!isFinite(box.x0) || box.x0 < 4 || box.x1 > W - 4 || box.y0 < 4 || box.y1 > H - 4) continue;
          if (placed.some(p => hit(box, p))) continue;
          put = { c: c, box: box }; break;
        }
        if (put) placed.push(put.box);
        const lstyle = put && put.c.inside
          ? 'fill:var(--ca-mk-label, var(--ink-2));paint-order:stroke;stroke:var(--ca-mk-halo, var(--surface-card));stroke-width:4px;stroke-linejoin:round'
          : 'fill:var(--ca-mk-out, var(--ink-2));paint-order:stroke;stroke:var(--surface-card);stroke-width:3.5px;stroke-linejoin:round';
        marks.push(`<g class="mk" data-name="${label.replace(/"/g, '&quot;')}" style="cursor:pointer">
            <path d="${d}" style="fill:var(--ca-mk-fill, var(--surface-page));fill-opacity:${lift ? 1 : .9};stroke:var(--ca-mk-line, var(--ink-2));stroke-width:${lift ? 1.1 : 1.3};stroke-linejoin:round"></path>
            ${labels && put ? `<text x="${put.c.x.toFixed(1)}" y="${put.c.y.toFixed(1)}" text-anchor="${put.c.anchor}" style="font-family:var(--sans);font-size:${size}px;letter-spacing:.06em;${lstyle};pointer-events:none">${label}</text>` : ''}
          </g>`);
      });
      host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="${cover ? 'xMidYMid slice' : 'xMidYMid meet'}" style="display:block;width:100%;height:${cover ? '100%' : 'auto'}">${ground.join('')}${marks.join('')}</svg>`;
      host.querySelectorAll('g.mk').forEach(g => g.addEventListener('click', () => {
        this.dispatchEvent(new CustomEvent('carta:country-tap', { detail: { name: g.dataset.name }, bubbles: true, composed: true }));
      }));
    }
  }

  /* the drawn plot — offline, tokens only, the identity: a dot per place fit to a box */
  const pinsOf = el => {
    const from = el.getAttribute('pins-from');
    if (from) return (window.CARTA_FIX && window.CARTA_FIX[from]) || [];
    try { return JSON.parse(el.getAttribute('pins') || '[]'); } catch (e) { return []; }
  };

  class Plot extends HTMLElement {
    static get observedAttributes() { return ['pins', 'pins-from', 'dot', 'labels', 'fit']; }
    connectedCallback() { this.style.display = 'block'; if (this.getAttribute('fit') === 'frame') this.style.height = '100%'; this.paint(); }
    attributeChangedCallback() { if (this.isConnected) this.paint(); }
    paint() {
      const host = hostOf(this);
      let pins = pinsOf(this);
      pins = pins.filter(p => isFinite(p.lat) && isFinite(p.lon));
      if (!pins.length) { host.innerHTML = ''; return; }
      const r = Number(this.getAttribute('dot') || 6), labels = this.getAttribute('labels') === 'on';
      const frameFit = this.getAttribute('fit') === 'frame';
      if (frameFit) this.style.height = '100%';
      const la0 = pins.reduce((a, p) => a + p.lat, 0) / pins.length;
      const px = p => p.lon * 111.32 * Math.cos(la0 * Math.PI / 180), py = p => p.lat * 111.32;
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      pins.forEach(p => { const x = px(p), y = py(p); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); });
      const pad = Math.max(.6, (x1 - x0) * .18, (y1 - y0) * .18);
      x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
      const W = 336, P = 4;
      const H = Math.max(160, Math.round((W - 2 * P) * (y1 - y0) / Math.max(.001, x1 - x0)) + 2 * P);
      const s = Math.min((W - 2 * P) / Math.max(.001, x1 - x0), (H - 2 * P) / Math.max(.001, y1 - y0));
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
      const X = p => W / 2 + (px(p) - cx) * s, Y = p => H / 2 - (py(p) - cy) * s;
      host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;height:${frameFit ? '100%' : 'auto'}">${pins.map(p => `
        <g data-id="${p.id || ''}" style="cursor:pointer">
          <circle cx="${X(p).toFixed(1)}" cy="${Y(p).toFixed(1)}" r="${p.dim ? (r * .72).toFixed(1) : r}" style="${p.dim
        ? 'fill:none;stroke:var(--ca-dim, var(--ink-3));stroke-width:1.2'
        : 'fill:var(--ca-dot, var(--ink));stroke:var(--surface-card);stroke-width:1.5'}"></circle>
          ${labels ? `<text x="${X(p).toFixed(1)}" y="${(Y(p) - r - 6).toFixed(1)}" text-anchor="middle" style="font-family:var(--sans);font-size:10px;letter-spacing:.04em;fill:var(--ink-3);pointer-events:none">${(p.name || '').replace(/[<&]/g, '')}</text>` : ''}
        </g>`).join('')}</svg>`;
      host.querySelectorAll('g[data-id]').forEach(g => g.addEventListener('click', () => {
        this.dispatchEvent(new CustomEvent('carta:pin-tap', { detail: { id: g.dataset.id }, bubbles: true, composed: true }));
      }));
    }
  }

  /* real streets — OpenStreetMap through Leaflet, filtered to Carta's ink */
  class Streets extends HTMLElement {
    static get observedAttributes() { return ['pins', 'pins-from', 'zoom', 'theme', 'still']; }
    connectedCallback() {
      this.style.display = 'block'; keepPos(this); this.style.background = 'var(--surface-sunk)';
      if (!this.style.zIndex) this.style.zIndex = '0';   // contain Leaflet's own pane z-indexes
      this._mapHost = document.createElement('div');
      Object.assign(this._mapHost.style, { position: 'absolute', inset: '0' });
      this.appendChild(this._mapHost);
      if (!navigator.onLine || _lfDown) { this.fell(); return; }
      lfLoad().then(() => { if (this.isConnected) this.boot(); })
              .catch(() => { _lfDown = true; if (this.isConnected) this.fell(); });
    }
    // the drawn plot is already underneath — step aside and say so once
    fell() {
      this.style.display = 'none';
      const box = this.parentElement;
      if (!box || box.querySelector(':scope>.smap-note')) return;
      const n = document.createElement('div');
      n.className = 'smap-note';
      if (box.dataset.noteStyle) n.setAttribute('style', box.dataset.noteStyle);
      n.innerHTML = '<span>Streets unavailable — showing saved positions.</span>'
        + '<span class="text-action" onclick="render()">Retry</span>';
      box.appendChild(n);
    }
    disconnectedCallback() { if (this._mo) { this._mo.disconnect(); this._mo = null; } if (this._ro) this._ro.disconnect(); if (this._map) { try { this._map.remove(); } catch (e) { } this._map = null; } }
    attributeChangedCallback(n) { if (!this._map) return; if (n === 'theme') this.filter(); else this.marks(); }
    filter() {
      const dusk = (this.getAttribute('theme') || document.documentElement.getAttribute('data-theme')) === 'dusk';
      const pane = this._map && this._map.getPane('tilePane');
      if (pane) pane.style.filter = dusk
        ? 'grayscale(1) invert(1) brightness(.72) contrast(1.05) sepia(.35) hue-rotate(-12deg)'
        : 'grayscale(1) sepia(.28) brightness(1.04) contrast(.92)';
    }
    boot() {
      if (!window.L) { this.fell(); return; }
      const still = this.getAttribute('still') === 'on';
      const map = this._map = window.L.map(this._mapHost, {
        zoomControl: false, attributionControl: true, dragging: !still, scrollWheelZoom: false,
        doubleClickZoom: !still, touchZoom: !still, keyboard: !still, tap: false, fadeAnimation: false,
        zoomSnap: 0, zoomDelta: .5, center: [55.6867, 12.5546], zoom: 12,
      });
      window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors', maxZoom: 19,
      }).addTo(map);
      this.filter();
      const at = this.querySelector('.leaflet-control-attribution');
      if (at) Object.assign(at.style, { font: '9px var(--sans)', background: 'transparent', color: 'var(--ink-3)', letterSpacing: '.02em', marginBottom: (this.getAttribute('attrib-lift') || '0') + 'px' });
      this.marks(true);
      const refit = () => { try { map.invalidateSize(); this.marks(); } catch (e) { } };
      requestAnimationFrame(refit);
      setTimeout(refit, 260);
      // the theme lives on <html data-theme>, not on this element — watch it there
      this._mo = new MutationObserver(() => this.filter());
      this._mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
      if (window.ResizeObserver) {
        this._ro = new ResizeObserver(() => { clearTimeout(this._rt); this._rt = setTimeout(refit, 120); });
        this._ro.observe(this);
      }
    }
    marks(first) {
      const map = this._map; if (!map) return;
      let pins = pinsOf(this).filter(p => isFinite(p.lat) && isFinite(p.lon));
      (this._layers || []).forEach(l => map.removeLayer(l));
      this._layers = pins.map(p => {
        const been = p.score != null;
        const html = `<div style="position:relative;width:${been ? 13 : 12}px;height:${been ? 13 : 12}px;border-radius:50%;
          background:${been ? 'var(--ink)' : 'transparent'};border:${been ? '1.5px solid var(--surface-card)' : '1.5px solid var(--ink)'};
          box-shadow:0 1px 3px rgba(0,0,0,.3)"></div>`;
        const m = window.L.marker([p.lat, p.lon], {
          icon: window.L.divIcon({ html, className: '', iconSize: [been ? 14 : 12, been ? 14 : 12], iconAnchor: [been ? 7 : 6, been ? 7 : 6] }),
          keyboard: true, title: p.name || '',
        }).addTo(map);
        m.on('click', () => this.dispatchEvent(new CustomEvent('carta:pin-tap', { detail: { id: p.id }, bubbles: true, composed: true })));
        return m;
      });
      if (!pins.length) { map.setView([55.6867, 12.5546], 12); return; }
      const cap = Number(this.getAttribute('zoom') || 14.6);
      const inset = Number(this.getAttribute('inset-bottom') || 0);
      const lat = pins.reduce((a, p) => a + p.lat, 0) / pins.length, lon = pins.reduce((a, p) => a + p.lon, 0) / pins.length;
      if (pins.length === 1) { map.setView([lat, lon], cap + (this.getAttribute('zoom') ? 0 : .8), { animate: false }); if (inset) map.panBy([0, inset / 2], { animate: false }); return; }
      const size = map.getSize();
      const availW = Math.max(60, (size.x || 320) - 92), availH = Math.max(60, (size.y || 240) - 92 - inset);
      const merc = l => Math.log(Math.tan(Math.PI / 4 + (Math.max(-85, Math.min(85, l)) * Math.PI) / 360));
      const dLon = Math.max(.0008, Math.max(...pins.map(p => p.lon)) - Math.min(...pins.map(p => p.lon)));
      const dY = Math.max(.00002, merc(Math.max(...pins.map(p => p.lat))) - merc(Math.min(...pins.map(p => p.lat))));
      const zLon = Math.log2((360 / dLon) * (availW / 256));
      const zLat = Math.log2(((2 * Math.PI) / dY) * (availH / 256));
      map.setView([lat, lon], Math.max(2, Math.min(cap, Math.min(zLon, zLat))), { animate: false });
      if (inset) map.panBy([0, inset / 2], { animate: false });
    }
  }

  if (!window.customElements.get('carta-belt')) customElements.define('carta-belt', Belt);
  if (!window.customElements.get('carta-plot')) customElements.define('carta-plot', Plot);
  if (!window.customElements.get('carta-streets')) customElements.define('carta-streets', Streets);
})();
</script>

<script>
'use strict';
/* Carta 7 — the fourth turn's skeleton. docs/ARCHITECTURE.md is the spec this
 * file builds; docs/ROADMAP.md orders what ships in which phase. Phase 1: the
 * journal, the shelf, the door, the dial-in loop, put-away + undo. No maps, no
 * scout, no menus, no photos, no cards, no migration — those are later phases.
 * Classic (Carta 6.18.x) moved whole to classic/index.html and is untouched. */

/* ============ store ============ */
const KEY='carta7.v1';
const blank={version:1,cups:[],coffees:[],places:[],roasters:[],setups:[],brews:[],menus:[],asks:[],prefs:{}};
const clone=o=>JSON.parse(JSON.stringify(o));
let D=load();
function load(){try{const r=localStorage.getItem(KEY);const d=r?JSON.parse(r):clone(blank);d.prefs=d.prefs||{};d.menus=d.menus||[];d.asks=d.asks||[];return d}catch(e){return clone(blank)}}
function save(){_tasteDirty=true;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Could not save — is storage full?')}}

/* photos — one per cup, optional, kept OUT of the ledger (ARCHITECTURE.md §2:3)
 * so the ledger itself stays light enough to export and diff as text. Cached
 * in memory after first read; every write flushes straight back to disk. */
const PHOTOS_KEY='carta7.photos.v1';
let _photosCache=null;
function loadPhotos(){if(_photosCache)return _photosCache;
  try{_photosCache=JSON.parse(localStorage.getItem(PHOTOS_KEY)||'{}')}catch(e){_photosCache={}}
  return _photosCache;}
function savePhotos(){try{localStorage.setItem(PHOTOS_KEY,JSON.stringify(_photosCache||{}))}catch(e){toast('Could not save the photo — storage full?')}}
function setCupPhoto(cupId,dataUri){loadPhotos();_photosCache[cupId]=dataUri;savePhotos()}
function getCupPhoto(cupId){return loadPhotos()[cupId]}
function deleteCupPhoto(cupId){loadPhotos();delete _photosCache[cupId];savePhotos()}
// resize+recompress in the browser — canvas only, no library. Steps down the
// quality a few times if a big photo still won't fit under the target.
function compressPhoto(file,maxEdge,targetBytes){
  maxEdge=maxEdge||1000;targetBytes=targetBytes||150*1024;
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.width,h=img.height;
      const scale=Math.min(1,maxEdge/Math.max(w,h));
      w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      let q=0.75,out=cv.toDataURL('image/jpeg',q);
      for(let i=0;i<4&&out.length*0.75>targetBytes&&q>0.25;i++){q-=0.15;out=cv.toDataURL('image/jpeg',q)}
      resolve(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('could not read that photo'))};
    img.src=url;
  });
}
const byNew=(a,b)=>b.createdAt.localeCompare(a.createdAt);
const live=coll=>(D[coll]||[]).filter(x=>!x.archived);
function putAway(coll,id){if(!putAwayCore(D,coll,id,new Date().toISOString()))return;save();render();toast('Put away.',()=>restore(coll,id));}
function restore(coll,id){if(!restoreCore(D,coll,id))return;save();render();toast('Restored.');}
function archivedFold(coll,rowFn,label){const items=D[coll].filter(x=>x.archived);
  if(!items.length)return '';
  return `<details class="more"><summary>${label||'Put away'} (${items.length})</summary>${items.map(rowFn).join('')}</details>`;}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const numv=id=>{const v=val(id);return v===''?null:Number(v)};
const getPref=(k,dflt)=>{const p=D.prefs||{};return p[k]==null?dflt:p[k]};
const setPref=(k,v)=>{D.prefs=D.prefs||{};D.prefs[k]=v;save()};

/* ============ domain ============ */
const roasterById=id=>D.roasters.find(r=>r.id===id);
const placeById=id=>D.places.find(p=>p.id===id);
const coffeeById=id=>D.coffees.find(c=>c.id===id);
const setupById=id=>D.setups.find(s=>s.id===id);
const brewById=id=>D.brews.find(b=>b.id===id);
const cupById=id=>D.cups.find(c=>c.id===id);
function originLine(c){if(!c||!c.origin)return '';const o=c.origin;return [o.region||o.country,o.process,o.variety].filter(Boolean).join(' · ')}
function brewRecipe(b){return `${b.grind??'—'} grind · ${b.doseG??'—'}g → ${b.waterG??'—'}g · ${fmtTime(b.timeSec)}`}
function fmtWhen(iso){if(!iso)return '';const d=new Date(iso);const days=Math.floor((Date.now()-d)/864e5);
  if(days<1)return 'today';if(days===1)return 'yesterday';if(days<7)return days+'d ago';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function restState(c){if(!c.roastDate)return '';
  const days=Math.floor((Date.now()-new Date(c.roastDate+'T00:00'))/864e5);
  if(days<5)return `resting — ${5-days}d to go`;
  if(days<=21)return 'in the window';
  return `${days-21}d past its window`;}
const c2f=c=>c*9/5+32, f2c=f=>(f-32)*5/9;
const tempUnit=()=>getPref('tempUnit','C')==='F'?'F':'C';
const fmtTime=s=>s==null?'—':`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const parseTime=str=>{const s=String(str).trim();if(!s)return null;
  if(s.includes(':')){const[m,sec]=s.split(':');return Math.round((Number(m)||0)*60+(Number(sec)||0))}
  return Math.round(Number(s))};
const DESCRIPTORS=['floral','citrus','berry','stone fruit','tropical','chocolate','nutty','caramel','honey','spice','tea-like','fermented','roasted','vegetal'];
const reducedMotion=()=>!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ==== pure ==== *
 * ARCHITECTURE.md §9: "the taste model is the one piece of real logic whose
 * wrongness would be invisible" — a bad brief just looks like a mediocre
 * brief. Everything between this marker and its close is a pure function of
 * an explicit ledger: no DOM, no localStorage, no reference to the global D.
 * test/model.test.js slices exactly this region out of index.html and
 * evaluates it directly against fixture ledgers. Keep it that way — a new
 * helper that reaches for `D` or `document` belongs outside the markers. */

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// a free-text value passed as a JS string argument inside an onclick="..." attribute —
// esc() alone protects the HTML attribute but not the quotes JS itself needs escaped
const jsq=s=>`'${String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/</g,'&lt;')}'`;
function coffeeLabel(c){if(!c)return '—';return [c.roaster,c.name].filter(Boolean).join(' — ')||'Unnamed coffee'}

/* ---- the gentle join (ARCHITECTURE.md §4) ----
 * Roasters and places are the graph's nodes: each carries aka[], other
 * spellings folded into it. fold() is case/diacritics/punctuation only —
 * never doubled letters, never aliases (that's the resolver's fuzzy licence,
 * and it stayed with the trade side). An exact fold match joins silently; a
 * near match (small edit distance) asks once. Origin story fields never join. */
function fold(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  const dp=[];for(let i=0;i<=m;i++)dp.push([i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];}
function nodeNames(n){return [n.name,...(n.aka||[])]}
function matchNodes(nodes,typed){
  const t=fold(typed);if(!t)return {exact:null,near:null};
  let exact=null,near=null,bestD=99;
  for(const n of nodes){
    for(const nm of nodeNames(n)){
      const f=fold(nm);
      if(f===t){exact=n;break}
      const d=lev(f,t);
      if(d<=2&&Math.abs(f.length-t.length)<=3&&d<bestD){bestD=d;near=n}
    }
    if(exact)break;
  }
  return {exact,near:exact?null:near};
}
function joinAlias(node,typed){if(fold(typed)!==fold(node.name)){node.aka=node.aka||[];
  if(!node.aka.some(a=>fold(a)===fold(typed)))node.aka.push(typed);}}

/* ---- put-away, the core (the DOM/localStorage wrapper lives in store) ---- */
function putAwayCore(ledger,coll,id,now){const rec=(ledger[coll]||[]).find(x=>x.id===id);if(!rec)return false;
  rec.archived=true;rec.archivedAt=now;return true;}
function restoreCore(ledger,coll,id){const rec=(ledger[coll]||[]).find(x=>x.id===id);if(!rec)return false;
  rec.archived=false;rec.archivedAt=null;return true;}

/* ---- the taste model + the brief (ARCHITECTURE.md §5) ----
 * tasteModel(ledger) is a pure derivation, computed and memoized on write,
 * never stored (classic's reviewQueue pattern: derived state cannot
 * corrupt). Every figure carries its n and its evidence refs — a
 * recommendation never travels without its reasons, starting with the model
 * itself. brief(scope) renders three forms from one derivation: a page on
 * Carta paper, an embedded machine block (carta.brief/v1), and a plain-text
 * cut sized for pasting into a chat. Strictly offline, by construction —
 * nothing here makes a network call. */
function avg(a){return a.reduce((s,x)=>s+x,0)/a.length}
function median(a){const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:avg([s[m-1],s[m]])}
function bucket(cups,keyFn){
  const m={};
  cups.forEach(c=>{const k=keyFn(c);if(!k)return;(m[k]=m[k]||{value:k,scores:[],cupRefs:[]});m[k].scores.push(c.score);m[k].cupRefs.push(c.id)});
  return Object.values(m).map(x=>({value:x.value,weight:avg(x.scores),n:x.scores.length,cupRefs:x.cupRefs})).sort((a,b)=>b.weight-a.weight||b.n-a.n);
}
function bucketMulti(cups,keysFn){
  const m={};
  cups.forEach(c=>(keysFn(c)||[]).forEach(k=>{(m[k]=m[k]||{value:k,scores:[],cupRefs:[]});m[k].scores.push(c.score);m[k].cupRefs.push(c.id)}));
  return Object.values(m).map(x=>({value:x.value,weight:avg(x.scores),n:x.scores.length,cupRefs:x.cupRefs})).sort((a,b)=>b.weight-a.weight||b.n-a.n);
}
/* roastLevel on Coffee (ROADMAP.md Phase 9) — a short scale, optional
 * everywhere, never required: exactly what a bag or a menu line actually
 * states, not a rung and not a resolver (ARCHITECTURE.md §4's line: free
 * text everywhere except the graph's nodes — this stays free text, just
 * drawn from a small named set instead of the open field process/origin
 * already are). parseRoastLevel reads a pasted bag or a menu line the same
 * light-touch way the door already reads a roaster/name split — it only
 * fires next to the word "roast" itself, so a tasting note ("light,
 * floral") never gets mistaken for a roast level. */
const ROAST_LEVELS=['Light','Medium-light','Medium','Medium-dark','Dark'];
function parseRoastLevel(text){
  const t=' '+fold(text||'')+' ';
  const near=w=>t.includes(' '+w+' roast ')||t.includes(' roast '+w+' ');
  if(near('medium light'))return 'Medium-light';
  if(near('medium dark'))return 'Medium-dark';
  if(near('light'))return 'Light';
  if(near('dark'))return 'Dark';
  if(near('medium'))return 'Medium';
  return '';
}
function tasteModel(ledger){
  const coffeeOf=id=>(ledger.coffees||[]).find(c=>c.id===id);
  const placeOf=id=>(ledger.places||[]).find(p=>p.id===id);
  const cups=(ledger.cups||[]).filter(c=>!c.archived&&c.score!=null);
  const barCups=cups.filter(c=>c.kind==='bar');

  // the bar — a floor to judge a café by, and the roasters that earn a return trip
  const floor=barCups.length?median(barCups.map(c=>c.score)):null;
  const byRoaster={};
  cups.forEach(c=>{
    const co=coffeeOf(c.coffeeRef);if(!co)return;
    const key=co.roasterRef||co.roaster;if(!key)return;
    (byRoaster[key]=byRoaster[key]||{roasterRef:co.roasterRef||null,name:co.roaster||'Unnamed roaster',scores:[],cupRefs:[]});
    byRoaster[key].scores.push(c.score);byRoaster[key].cupRefs.push(c.id);
  });
  const anchors=Object.values(byRoaster)
    .map(r=>({roasterRef:r.roasterRef,name:r.name,avg:avg(r.scores),n:r.scores.length,cupRefs:r.cupRefs}))
    .filter(r=>r.avg>=8&&r.n>=2)
    .sort((a,b)=>b.avg-a.avg||b.n-a.n);
  const nines=cups.filter(c=>c.score===9).map(c=>c.id);

  // the vector — what earns your taste, each value carrying its own weight and n
  const roast=bucket(cups,c=>{const co=coffeeOf(c.coffeeRef);return co&&co.roastLevel});
  const processes=bucket(cups,c=>{const co=coffeeOf(c.coffeeRef);return co&&co.origin&&co.origin.process});
  const origins=bucket(cups,c=>{const co=coffeeOf(c.coffeeRef);return co&&co.origin&&(co.origin.country||co.origin.region)});
  const descriptors=bucketMulti(cups,c=>c.descriptors);

  function scope(kind,id){
    let scoped=cups;
    if(kind==='place')scoped=cups.filter(c=>c.kind==='bar'&&c.placeRef===id);
    else if(kind==='city')scoped=cups.filter(c=>{if(c.kind!=='bar')return false;const p=placeOf(c.placeRef);return !!(p&&p.city&&fold(p.city)===fold(id))});
    else if(kind==='country')scoped=cups.filter(c=>{const co=coffeeOf(c.coffeeRef);return !!(co&&co.origin&&fold(co.origin.country||'')===fold(id))});

/* ---- the ask (ROADMAP.md Phase 7) — the brief, plus a scope and a question,
 * sent to a model the keeper brought their own key for. Both halves that can
 * go wrong live here, pure and tested: the prompt text (so the model is asked

/* ---- the menu's OCR (horizon list, ROADMAP.md — "a BYO-key vision call

  const m=document.getElementById('main');
  m.classList.toggle('fixed',view.kind==='city');
  m.innerHTML=settle?`<div class="ca-screen">${body}</div>`:body;

}

/* ============ sheet plumbing (ported wholesale) ============ */
/* a map surface inside a sheet cleans itself up: carta-maps' elements tear
   their own Leaflet context down in disconnectedCallback, so replacing the
   sheet's innerHTML is all the disposal there is to do. */
function openSheet(html){const s=document.getElementById('sheet');
  s.innerHTML='<div class="grab" aria-hidden="true"></div>'+html;
  s.classList.remove('dragging');s.style.transform='';document.getElementById('sheetbg').style.opacity='';
  s.classList.add('open');document.getElementById('sheetbg').classList.add('open');
  s.scrollTop=0;}
function closeSheet(){const s=document.getElementById('sheet');
  s.classList.remove('open');document.getElementById('sheetbg').classList.remove('open');stopTimer(false);
  s.innerHTML='';
}
(function initSheetDrag(){
  const sheet=document.getElementById('sheet');
  const bg=document.getElementById('sheetbg');
  let startY=0,dy=0,active=false,dragging=false,startT=0;
  const yOf=e=>e.touches?e.touches[0].clientY:e.clientY;
  const onGrab=e=>!!(e.target.closest&&e.target.closest('.grab'));
  function down(e){if(!sheet.classList.contains('open'))return;
    if(!onGrab(e)&&sheet.scrollTop>0)return;
    active=true;dragging=false;dy=0;startY=yOf(e);startT=Date.now();}
  function move(e){if(!active)return;
    dy=yOf(e)-startY;
    if(dy<=0){if(dragging){sheet.classList.remove('dragging');sheet.style.transform='';bg.style.opacity='';}dragging=false;dy=0;return}
    dragging=true;sheet.classList.add('dragging');
    if(e.cancelable)e.preventDefault();
    sheet.style.transform=`translateX(-50%) translateY(${dy}px)`;
    bg.style.opacity=String(Math.max(0,1-dy/(sheet.offsetHeight||600)));}
  function up(){if(!active)return;active=false;
    const h=sheet.offsetHeight||600;
    const velocity=dy/Math.max(1,Date.now()-startT);
    sheet.classList.remove('dragging');
    if(dragging&&(dy>h*0.28||velocity>0.55)){
      sheet.style.transform='translateX(-50%) translateY(100%)';bg.style.opacity='';
      setTimeout(()=>{closeSheet();sheet.style.transform='';bg.style.opacity='';},300);
    }else{sheet.style.transform='';bg.style.opacity=''}
    dragging=false;dy=0;}
  sheet.addEventListener('touchstart',down,{passive:true});
  sheet.addEventListener('touchmove',move,{passive:false});
  sheet.addEventListener('touchend',up);
  sheet.addEventListener('touchcancel',up);
  sheet.addEventListener('mousedown',down);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
})();

/* ============ toast (undo, when there's something to undo) ============ */
let _toastUndo=null;
function toast(m,actionFn,actionLabel){
  const t=document.getElementById('toast');
  _toastUndo=actionFn||null;
  t.innerHTML=esc(m)+(actionFn?` <span class="undo" onclick="_toastUndo&&_toastUndo();_toastUndo=null;document.getElementById('toast').classList.remove('show')">${esc(actionLabel||'Undo')}</span>`:'');
  t.classList.toggle('withundo',!!actionFn);
  t.classList.add('show');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),actionFn?4000:1800);
}

/* ============ dial component (ported wholesale) ============
 * tap −/+ one step; press-and-hold auto-repeats and accelerates; tap the
 * number to type an exact value. opts:{kind:'time'} for m:ss, {corner} for
 * the °C/°F toggle, {hint} for a scale caption. */
const dialState={};
let editingDial=null,holdInt=null,holdTO=null;
function dial(id,label,unit,value,step,min,max,dp,opts){
  opts=opts||{};
  dialState[id]={v:value,step,min,max,dp:dp??(String(step).includes('.')?1:0),unit,kind:opts.kind||null};
  const corner=opts.corner?`<div class="dcorner">${opts.corner}</div>`:(opts.hint?`<div class="ticks">${opts.hint}</div>`:'');
  return `<div class="dial">${corner}<div class="l">${label}</div>
    <div class="v num tapedit" id="dv_${id}" onclick="editDial('${id}')">${fmtDial(id)}<span class="u">${unit}</span></div>
    <div class="ctl">
      <button type="button" onpointerdown="holdStart(event,'${id}',-1)">−</button>
      <button type="button" onpointerdown="holdStart(event,'${id}',1)">+</button>
    </div></div>`;
}
function fmtDial(id){const s=dialState[id];if(s.v==null)return '—';
  if(s.kind==='time')return fmtTime(s.v);
  return s.v.toFixed(s.dp).replace(/\.0+$/,'');}
function unitSpan(id){return `<span class="u">${dialState[id].unit}</span>`}
function redrawDial(id){const el=document.getElementById('dv_'+id);if(el)el.innerHTML=fmtDial(id)+unitSpan(id)}
function setDial(id,v){const s=dialState[id];
  if(v==null||isNaN(v)){redrawDial(id);return}
  if(s.min!=null)v=Math.max(s.min,v); if(s.max!=null)v=Math.min(s.max,v);
  s.v=Number(v.toFixed(s.dp)); redrawDial(id);}
function nudge(id,dir,mult){const s=dialState[id];
  setDial(id,(s.v==null?(s.min??0):s.v)+dir*s.step*(mult||1));
  if(navigator.vibrate)navigator.vibrate(3);}
function holdStop(){if(holdTO){clearTimeout(holdTO);holdTO=null}if(holdInt){clearInterval(holdInt);holdInt=null}
  window.removeEventListener('pointerup',holdStop);window.removeEventListener('pointercancel',holdStop);}
function holdStart(e,id,dir){
  e.preventDefault();
  if(editingDial){const de=document.getElementById('de_'+editingDial);if(de)de.blur();}
  holdStop();
  nudge(id,dir);
  let n=0;
  holdTO=setTimeout(()=>{ holdInt=setInterval(()=>{ n++;
    const mult=n<10?1:n<20?4:n<35?10:25;
    nudge(id,dir,mult); },60); },320);
  window.addEventListener('pointerup',holdStop);
  window.addEventListener('pointercancel',holdStop);
}
function editDial(id){
  if(editingDial===id)return;
  const s=dialState[id],el=document.getElementById('dv_'+id);
  editingDial=id;
  const cur=s.v==null?'':(s.kind==='time'?fmtTime(s.v):fmtDial(id));
  el.innerHTML=`<input class="dedit" id="de_${id}" inputmode="${s.kind==='time'?'text':'decimal'}" value="${cur}">`+unitSpan(id);
  const inp=document.getElementById('de_'+id); inp.focus(); inp.select();
  const commit=()=>{if(editingDial!==id)return; editingDial=null;
    const raw=inp.value;
    const v=s.kind==='time'?parseTime(raw):(raw.trim()===''?NaN:Number(raw));
    setDial(id,v);};
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ev.preventDefault();inp.blur();}
    else if(ev.key==='Escape'){editingDial=null;redrawDial(id);}});
}
function grindDialHTML(setup,value){
  const st=setup||{};
  const num=(x,d)=>x!=null&&x!==''&&!isNaN(Number(x))?Number(x):d;
  const step=num(st.grindStep,0.5)||0.5, min=num(st.grindMin,0), max=num(st.grindMax,null);
  const dp=String(step).includes('.')?1:0;
  const hint=(st.grindMin!=null&&st.grindMin!==''&&max!=null)?`${min}–${max} · ${step}`:'';
  return dial('grind','Grind',st.grindUnit||'',value,step,min,max,dp,{hint});
}
function tempDialHTML(tempC){
  const u=tempUnit(),F=u==='F';
  const v=tempC==null?null:(F?Math.round(c2f(tempC)):Number(tempC.toFixed(1)));
  return dial('temp','Temp','°'+u,v,1,F?140:60,F?212:100,F?0:1,{corner:tempCorner()});
}
function dialTempC(){const s=dialState.temp;if(!s||s.v==null)return null;
  return tempUnit()==='F'?Number(f2c(s.v).toFixed(1)):s.v;}
function tempCorner(){const u=tempUnit();
  return `<span class="ut ${u==='C'?'on':''}" onclick="setTempUnit('C')">°C</span><span class="ut ${u==='F'?'on':''}" onclick="setTempUnit('F')">°F</span>`;}
function setTempUnit(u){if(u!=='C'&&u!=='F')return;
  const c=dialTempC();setPref('tempUnit',u);
  const box=document.getElementById('dialbox_temp');if(box)box.innerHTML=tempDialHTML(c);}
function onSetupChange(){const setup=setupById(val('b_setup'));
  const box=document.getElementById('dialbox_grind');
  if(box)box.innerHTML=grindDialHTML(setup,lastGrindForSetup(setup&&setup.id));}
function lastGrindForSetup(setupId){const b=D.brews.filter(x=>x.setupId===setupId).sort(byNew)[0];
  return b&&b.grind!=null?b.grind:null;}

/* ============ timer ============ */
let tInt=null,tStart=null,tElapsed=0;
function timerHTML(){return `<div class="timer">
  <div class="t num" id="tclock">0:00.0</div>
  <div class="ctl">
    <button class="go" id="tbtn" onclick="toggleTimer()">Start</button>

function tickTimer(){const s=tElapsed+(tStart?(Date.now()-tStart)/1000:0);

}

function stopTimer(zero){if(tInt){clearInterval(tInt);tInt=null}if(zero){tElapsed=0;tStart=null}else if(tStart){tElapsed+=(Date.now()-tStart)/1000;tStart=null}}
function useTimer(){const s=tElapsed+(tStart?(Date.now()-tStart)/1000:0);

/* ============ the door — paste or type, a card out, no adjudication ============
 * One field resolves into a coffee (roaster + name, gentle join on the
 * roaster), then asks where the cup is — café or home — and hands off to
 * whichever quick form that is. No resolver, no propose sheet: an exact
 * spelling joins silently, a near one asks once, everything else is new. */
let doorState=null;
function openDoor(preset){doorState={step:'text',text:'',roaster:'',name:'',roastLevel:'',o:{},kind:null,preset:preset||null};paintDoor();}
// the door, opened from a café you're already standing in: where the cup is
// isn't a question worth asking twice, so that step simply isn't there
function openDoorAt(placeId){
  const p=placeById(placeId);if(!p){openDoor();return}
  openDoor({placeRef:p.id,place:p.name,city:p.city||''});
}
function doorParse(text){
  const parts=text.split(/\s+[—–-]\s+|,\s*/).map(s=>s.trim()).filter(Boolean);
  if(parts.length>=2)return {roaster:parts[0],name:parts.slice(1).join(', ')};
  return {roaster:'',name:text.trim()};
}
function paintDoor(){
  const s=doorState;
  if(s.step==='text'){
    openSheet(`<h3>＋ A cup</h3>
    <div class="sub">Paste the bag, or just type it.</div>
    <label class="f"><textarea id="d_text" placeholder="Sey's — Ethiopia Gedeb, washed">${esc(s.text)}</textarea></label>
    <button class="btn btn-primary" onclick="doorNext1()">Continue</button>
    <button class="btn btn-quiet" onclick="closeSheet()">Not now</button>`);
    return;
  }
  if(s.step==='confirm'){
    // confirm and "where's this cup?" are one step now: the paste is already
    // read, and asking twice was a tap spent on nothing (the redesign's own
    // complaint — logging a cup took too many steps)
    const where=s.preset
      ?`<button class="btn btn-primary" onclick="doorNext2('bar')">At ${esc(s.preset.place)} — continue</button>`
      :`<div class="eyebrow" style="margin:18px 0 10px">Where's this cup?</div>
        <div class="btnrow">
          <button class="btn btn-quiet" style="min-height:52px" onclick="doorNext2('bar')">At a café</button>
          <button class="btn" style="min-height:52px;background:var(--fill-strong);color:var(--text-on-fill);border:1px solid var(--fill-strong)" onclick="doorNext2('home')">At home</button>
        </div>`;
    openSheet(`<h3>Is this right?</h3>
    <div class="sub">Correct anything the paste read wrong.</div>
    <label class="f"><span class="l">Roaster <span class="opt">optional</span></span><input type="text" id="d_roaster" value="${esc(s.roaster)}"></label>
    <label class="f"><span class="l">Coffee</span><input type="text" id="d_name" value="${esc(s.name)}" placeholder="Ethiopia Gedeb"></label>
    <details class="more"><summary>Origin & roast — optional</summary>
    <label class="f"><span class="l">Roast level</span><select id="d_roastlevel">
      <option value="">—</option>
      ${ROAST_LEVELS.map(r=>`<option value="${r}"${s.roastLevel===r?' selected':''}>${r}</option>`).join('')}
    </select></label>
    <div class="grid2">
      <label class="f"><span class="l">Country</span><input type="text" id="d_country" value="${esc(s.o.country||'')}"></label>
      <label class="f"><span class="l">Region</span><input type="text" id="d_region" value="${esc(s.o.region||'')}"></label>
      <label class="f"><span class="l">Farm</span><input type="text" id="d_farm" value="${esc(s.o.farm||'')}"></label>
      <label class="f"><span class="l">Producer</span><input type="text" id="d_producer" value="${esc(s.o.producer||'')}"></label>
      <label class="f"><span class="l">Variety</span><input type="text" id="d_variety" value="${esc(s.o.variety||'')}"></label>
      <label class="f"><span class="l">Process</span><input type="text" id="d_process" value="${esc(s.o.process||'')}"></label>
    </div></details>
    ${where}`);
    return;
  }
  if(s.step==='join'){
    const m=s._roasterMatch;
    openSheet(`<h3>Same roaster?</h3>
    <div class="sub">You've logged <strong>${esc(m.name)}</strong> before. Is this them?</div>
    <div class="btnrow">
      <button class="btn btn-quiet" onclick="doorJoin(false)">No, different</button>
      <button class="btn btn-primary" onclick="doorJoin(true)">Yes, same</button>

}
function doorNext1(){doorState.text=val('d_text');const p=doorParse(doorState.text);
  if(!p.roaster&&!p.name){toast('Type or paste something first');return}
  doorState.roaster=p.roaster;doorState.name=p.name;doorState.roastLevel=parseRoastLevel(doorState.text);doorState.step='confirm';paintDoor();}
// the confirm step carries the answer to "where" with it, so this is the last
// question the door asks — the gentle join still gets its one interruption
function doorNext2(kind){
  const s=doorState;

  s.o={country:val('d_country'),region:val('d_region'),farm:val('d_farm'),producer:val('d_producer'),variety:val('d_variety'),process:val('d_process')};

}
function doorJoin(yes){
  const s=doorState,m=s._roasterMatch;

  doorKind(s.kind);
}
function doorKind(kind){
  const s=doorState;

  // tasted until "take it home" says otherwise (ROADMAP.md Phase 4)
  const c={id:uid(),createdAt:new Date().toISOString(),
    roaster:s.roaster||(roasterRef?roasterById(roasterRef).name:''),roasterRef,name:s.name,origin:s.o,roastLevel:s.roastLevel||'',home:kind==='home'};

/* ============ café cup (the bar path) ============ */
let cafeCupState=null;

function openCafeCup(coffeeId,preset){

function cafeCupNext(){
  const s=cafeCupState;s.place=val('p_name');s.city=val('p_city');
  if(!s.place){toast('Name the café');return}
  const m=matchNode('places',s.place);

  if(m.near){s._match=m.near;s.step='join';paintCafeCup();return}
  s.step='score';paintCafeCup();
}
function cafeCupJoin(yes){
  const s=cafeCupState,m=s._match;
  if(yes){joinAlias(m,s.place);s.placeRef=m.id;if(!m.city&&s.city)m.city=s.city;}

}
function saveCafeCup(){
  if(hedState==null){toast('A cup needs its reading — the 1–9 first.');return}
  const s=cafeCupState;
  let placeRef=s.placeRef;
  if(!placeRef){const p={id:uid(),createdAt:new Date().toISOString(),name:s.place,city:s.city||'',aka:[]};D.places.push(p);placeRef=p.id;}

  if(cupPhotoPending){cup.photo=true;setCupPhoto(cup.id,cupPhotoPending);cupPhotoPending=null}
  D.cups.push(cup);
  cafeCupState=null;hedState=null;descState=new Set();
  const city=(placeById(placeRef)||{}).city;

  newGroundToast('city',city,'Kept.');
}
function knownCities(){
  const seen={};
  live('places').forEach(p=>{if(p.city){const f=fold(p.city);if(!seen[f])seen[f]=p.city}});
  return Object.values(seen).sort();
}

/* ============ setups + the dial-in loop (home path) ============ */
function openSetupForm(id){

function saveBrewFlow(coffeeId,editId){

/* ============ the menu — capture, read, and the walk from a line to a cup ============
 * A café's menu, typed while you read it (ROADMAP.md Phase 4) — a photo is
 * a reference to type against by default, never sent anywhere, never
 * stored; only the words you type persist. "Read it for me" (the horizon
 * list's OCR item) is the opt-in exception: the same BYO-key door the ask
 * already calls through, one posture, two uses — the keeper's own key, the
 * keeper's own tap, and the photo travels only that once, only to
 * Anthropic, only when asked. Either way the photo itself is never kept:
 * it lives in memory for this sheet's lifetime and is gone the moment the
 * menu saves or the sheet closes. Each line becomes an item; tap one to
 * log a cup on the spot (the coffee is minted and the item points at it
 * before the café-cup form even opens, so the link survives whether or
 * not the cup itself gets finished) or to point at a coffee already on
 * the shelf. */
const menuById=id=>D.menus.find(m=>m.id===id);
// a café stopped being a sheet the moment it got its own streets to stand on
// (see vCafe) — this name survives as the one door every older caller already
// knows, and simply opens the screen instead
function openPlaceSheet(placeId){closeSheet();openCafeScreen(placeId)}
let menuPhotoPreview=null,menuPhotoFile=null,_menuOCRBusy=false;
function openMenuCapture(placeId){menuPhotoPreview=null;menuPhotoFile=null;paintMenuCapture(placeId);}
function paintMenuCapture(placeId){
  const p=placeById(placeId);
  openSheet(`<h3>Capture the menu</h3>
  <div class="sub">${esc(p?p.name:'')}</div>
  <label class="f"><span class="l">Photo <span class="opt">optional — a reference while you type, never saved</span></span>
    <input type="file" accept="image/*" capture="environment" id="mc_photo" onchange="menuPhotoPicked(event)"></label>
  <div id="mc_preview"></div>
  <label class="f"><span class="l">The menu, one coffee per line</span>
    <textarea id="mc_text" style="min-height:140px" placeholder="Sey's — Ethiopia Gedeb, washed
Onyx — Colombia Pink Bourbon"></textarea></label>
  <button class="btn btn-primary" onclick="saveMenuCapture('${placeId}')">Save the menu</button>`);
}
function menuPhotoPicked(e){
  const f=e.target.files&&e.target.files[0];if(!f)return;
  if(menuPhotoPreview)URL.revokeObjectURL(menuPhotoPreview);
  menuPhotoFile=f;
  menuPhotoPreview=URL.createObjectURL(f);
  paintMenuPhoto();
}
function paintMenuPhoto(){
  const el=document.getElementById('mc_preview');if(!el)return;
  if(!menuPhotoPreview){el.innerHTML='';return}
  el.innerHTML=`<img class="thumb big" src="${menuPhotoPreview}" alt="">
    <button class="btn btn-quiet" style="margin-top:8px" onclick="readMenuPhoto()">${askKey()?'Read it for me':'Set a key to read it for me'}</button>
    <div id="mc_ocr_status"></div>`;
}
async function readMenuPhoto(){
  if(_menuOCRBusy||!menuPhotoFile)return;
  if(!askKey()){openAskKey();return}
  const status=document.getElementById('mc_ocr_status');
  _menuOCRBusy=true;
  if(status)status.innerHTML='<div class="muted small" style="margin-top:6px">Reading…</div>';
  try{
    const dataUri=await compressPhoto(menuPhotoFile,1400,1.5*1024*1024);
    const raw=await callVisionModel(menuOCRPrompt(),dataUri);
    const parsed=parseMenuOCR(raw);
    if(!parsed.lines.length){
      if(status)status.innerHTML=`<div class="muted small" style="margin-top:6px">Couldn't make out any coffees — type it in by hand.</div>`;
    }else{
      const ta=document.getElementById('mc_text');
      if(ta)ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+parsed.lines.join('\n');
      if(status)status.innerHTML=`<div class="muted small" style="margin-top:6px">${parsed.lines.length} line${parsed.lines.length===1?'':'s'} read — check it over before saving.</div>`;
    }
  }catch(e){
    if(status)status.innerHTML=`<div class="muted small" style="margin-top:6px">${esc((e&&e.message)||'Could not read that photo.')}</div>`;
  }
  _menuOCRBusy=false;
}
function saveMenuCapture(placeId){
  const lines=val('mc_text').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length){toast('Type at least one line');return}
  const items=lines.map(line=>{const p=doorParse(line);return {text:line,roaster:p.roaster,name:p.name,roastLevel:parseRoastLevel(line)}});
  const menu={id:uid(),createdAt:new Date().toISOString(),placeRef:placeId,at:new Date().toISOString(),items};
  D.menus.push(menu);
  if(menuPhotoPreview){URL.revokeObjectURL(menuPhotoPreview);menuPhotoPreview=null}
  menuPhotoFile=null;
  save();closeSheet();toast('Menu captured.');
  openMenuPage(menu.id);
}
function openMenuPage(menuId){
  const m=menuById(menuId);if(!m)return;
  const p=placeById(m.placeRef);
  openSheet(`<h3>The menu</h3>

function menuItemGotIt(menuId,i){

function linkMenuItem(menuId,i,coffeeId){
