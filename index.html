<body>
<header class="app">
<div><h1>Carta</h1><div class="sub" id="who">The atlas</div></div>
<button class="doorbtn" id="doorbtn" onclick="openDoor()" aria-label="Add a coffee">＋ A coffee</button></header>
<main id="main"></main>
<nav class="tabs" id="tabs"></nav>
<div class="sheet-bg" id="sheetbg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="sheet-bg primerbg" id="primerbg" onclick="closePrimer()"></div>
<div class="sheet primerlayer" id="primer"></div>
<div class="welcome" id="welcome"></div>
<div class="toast" id="toast"></div>
<input type="file" accept=".json,application/json" id="importInput" style="display:none">

<script>
'use strict';
/* ============ store ============ */
const KEY='carta.v1';           // legacy single-user key — migrated to per-user keys on first boot
const USERS_KEY='carta.users';
const blank={version:1,setups:[],bags:[],brews:[],cups:[],pours:[],cafes:[],authored:[],cafeFavs:[],cafeWants:[],deleted:[],prefs:{},createdAt:new Date().toISOString()};
const clone=o=>JSON.parse(JSON.stringify(o));
const dataKey=id=>KEY+'.'+id;
function loadUsers(){
  try{
    const r=localStorage.getItem(USERS_KEY);
    if(r){const u=JSON.parse(r); if(u&&u.users&&u.users.length&&u.users.some(x=>x.id===u.activeId))return u;}
  }catch(e){}
  // First multi-user boot: adopt any existing single-user ledger as user "Me".
  // Fixed id so a partial migration (quota mid-write) retries onto the same key.
  const u={version:1,users:[{id:'u1',name:'Me',createdAt:new Date().toISOString()}],activeId:'u1'};
  try{
    const legacy=localStorage.getItem(KEY);
    if(legacy!=null)localStorage.setItem(dataKey('u1'),legacy);
    localStorage.setItem(USERS_KEY,JSON.stringify(u));
    if(legacy!=null)localStorage.removeItem(KEY);
  }catch(e){}
  return u;
}
let USERS=loadUsers();
let viewingUserId=USERS.activeId;   // whose ledger is on screen; ≠ activeId means read-only
let D=load();
function load(){try{const r=localStorage.getItem(dataKey(viewingUserId));const d=r?JSON.parse(r):clone(blank);d.prefs=d.prefs||{};return d}catch(e){return clone(blank)}}
function save(){if(readOnly())return;localStorage.setItem(dataKey(viewingUserId),JSON.stringify(D));markDirty()}
// per-user presentation/input preferences (temp unit, timer visibility) — part of the ledger, so they export and sync
const getPref=(k,dflt)=>{const p=D.prefs||{};return p[k]==null?dflt:p[k]};
function setPref(k,v){if(readOnly())return;D.prefs=D.prefs||{};D.prefs[k]=v;save()}
function saveUsers(){localStorage.setItem(USERS_KEY,JSON.stringify(USERS))}
const userById=id=>USERS.users.find(u=>u.id===id);
const viewingUser=()=>userById(viewingUserId)||remoteUserById(viewingUserId);
const readOnly=()=>viewingUserId!==USERS.activeId;
function guard(){if(readOnly()){toast(`Read only — this is ${viewingUser().name}'s ledger`);return true}return false}
/* ---- the pen: who may write the SHARED record (the Register + the catalog).
 * Everyone keeps their own ledger, always. The shared documents are — for
 * now, while the atlas settles — kept by the founder alone: on a synced
 * device the server's founder flag is the authority (the first account
 * registered; the server refuses any other pen with 403), and on an unsynced
 * device the pen is claimed once from the Desk → The pen. Temporary: the
 * group-writable curation returns with the proposed→stood moderation ceremony. */
const PEN_KEY='carta.pen.v1';
let PEN=readJSONLS(PEN_KEY);            // {userId,at} | null — the device-local claim
function savePen(){if(PEN)localStorage.setItem(PEN_KEY,JSON.stringify(PEN));else localStorage.removeItem(PEN_KEY)}
function isAdmin(){
  if(readOnly())return false;
  if(typeof SYNC!=='undefined'&&SYNC&&syncedHere()&&SYNC.founder!==undefined)return !!SYNC.founder;
  return !!(PEN&&PEN.userId===USERS.activeId);
}
function penGuard(){if(guard())return true;if(!isAdmin()){toast('The shared record is read-only for now — the founder holds the pen');return true}return false}
function takePen(){if(guard())return;PEN={userId:USERS.activeId,at:new Date().toISOString()};savePen();closeSheet();render();toast('The pen is yours on this device')}
function setDownPen(){PEN=null;savePen();closeSheet();render();toast('The pen is set down')}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byNew=(a,b)=>b.createdAt.localeCompare(a.createdAt);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}

/* ============ the Register ============ */
/* One entry per café, kept once — Jane's Fighting Ships, for cafés. The single
 * source of truth for a café's identity: name, city, address and pin, and the
 * palette read from its website. Cups stay personal, per ledger; the place is common
 * knowledge, so it lives OUTSIDE the per-user keys, shared by every user of
 * this device — and, through sync (/api/cafes), by every keeper on the server.
 * Any keeper may amend an entry; the entry remembers who entered it first. */
const REG_KEY='carta.register.v1';
let REG=loadReg();
function loadReg(){
  try{const r=localStorage.getItem(REG_KEY);const g=r?JSON.parse(r):null;
    if(g&&Array.isArray(g.entries))return{version:1,rev:g.rev||0,dirty:!!g.dirty,entries:g.entries,deleted:g.deleted||[]};
  }catch(e){}
  return{version:1,rev:0,dirty:false,entries:[],deleted:[]};
}
function saveReg(){try{localStorage.setItem(REG_KEY,JSON.stringify(REG))}catch(e){}}
const regByName=name=>REG.entries.find(e=>normName(e.name)===normName(name))||null;
const regSubstance=v=>v!=null&&v!=='';
const activeName=()=>(typeof SYNC!=='undefined'&&SYNC&&syncedHere()&&SYNC.name)||((userById(USERS.activeId)||{}).name||'');
// Upsert an entry. Sparse by default — a sighting fills blanks, never erases —
// so a fast cup log can't strip a rich entry. {full:true} (the café editor)
// overwrites the fields it carries. {at} backdates provenance to the record
// that named the café, so firstBy/firstAt stay honest when seeding history.
function regUpsert(name,fields,who,opts){
  name=String(name||'').trim(); if(!name)return null;
  opts=opts||{};
  const now=new Date().toISOString(),at=opts.at||now;
  let e=regByName(name),changed=false;
  if(!e){e={id:uid(),name,createdAt:at,firstBy:who||'',firstAt:at};REG.entries.push(e);changed=true}
  else if(at<(e.firstAt||e.createdAt||'')){e.firstAt=at;if(who)e.firstBy=who;changed=true}
  Object.keys(fields||{}).forEach(k=>{const v=fields[k];
    if(opts.full ? ((regSubstance(v)||regSubstance(e[k]))&&e[k]!==v) : (regSubstance(v)&&!regSubstance(e[k]))){e[k]=v==null?null:v;changed=true}});
  if(changed){e.updatedAt=now;if(who)e.by=who;REG.dirty=true;saveReg();schedulePush()}
  return e;
}
// Seed the Register from every ledger this device can read — each user's café
// profiles and every shop their café cups name. Chronological, so the first
// record to name a café holds the provenance. Idempotent: fills blanks only.
function regSeed(){
  const srcs=USERS.users.map(u=>({who:u.name,led:readJSONLS(dataKey(u.id))}));
  remoteDirUsers().forEach(u=>{const c=readJSONLS(remoteKey(u.id));if(c&&c.ledger)srcs.push({who:u.name,led:c.ledger})});
  const sights=[];
  srcs.forEach(s=>{const d=s.led;if(!d)return;
    (d.cafes||[]).forEach(p=>{if(p&&p.name)sights.push({at:p.createdAt||'',who:s.who,name:p.name,fields:{city:p.city,neighborhood:p.neighborhood,address:p.address,lat:p.lat,lon:p.lon,palette:p.palette,accent:p.accent,notes:p.notes,tags:p.tags}})});
    (d.cups||[]).forEach(c=>{if(c&&c.kind==='cafe'&&c.shop)sights.push({at:c.createdAt||'',who:s.who,name:c.shop,fields:{city:c.city}})});
  });
  sights.sort((a,b)=>a.at.localeCompare(b.at)).forEach(s=>regUpsert(s.name,s.fields,s.who,{at:s.at||null}));
}

/* ============ the catalog ============ */
/* The spine, upstream of the café. The Register keeps ONE shared document — the
 * Venue (a café). The catalog keeps the rest of the road as the SAME shape: a
 * set of Register-enveloped documents, one per entity kind, each
 * {version,rev,dirty,entries,deleted}. loadDoc/saveDoc/catUpsert/compile are
 * loadReg/saveReg/regUpsert/reachCompile, generalised — no new sync machinery,
 * the pattern is already proven in the café (see SCHEMA.md). Device-local until a
 * catalog-aware server exists: an old server 404s the endpoint and this stays
 * local, exactly as the Register degrades. Nothing renders it yet — this is the
 * substrate the restructure is built on; step 1, normalise the spine. */
const CAT_KINDS=['producers','processors','aggregators','lots','blends','roasters','roasts','gear'];
const catKey=kind=>'carta.catalog.'+kind+'.v1';
const catSingular={producers:'producer',processors:'processor',aggregators:'aggregator',lots:'lot',blends:'blend',roasters:'roaster',roasts:'roast',gear:'gear'};
const CAT={};
function loadDoc(kind){
  try{const r=localStorage.getItem(catKey(kind));const g=r?JSON.parse(r):null;
    if(g&&Array.isArray(g.entries))return{version:1,rev:g.rev||0,dirty:!!g.dirty,entries:g.entries,deleted:g.deleted||[]};
  }catch(e){}
  return{version:1,rev:0,dirty:false,entries:[],deleted:[]};
}
function saveDoc(kind){try{localStorage.setItem(catKey(kind),JSON.stringify(CAT[kind]))}catch(e){}}
CAT_KINDS.forEach(k=>{CAT[k]=loadDoc(k)});
// Find-or-create by a caller-supplied collapse key. The key is NOT identity — it
// is how THIS caller chose to dedup (the seed's timid fingerprint below; a lot's
// real identity is the resolver, a later pass). Sparse by default, the café's law
// one kind up: a write fills blanks, never erases; {full:true} overwrites; {at}
// backdates provenance so the earliest record to name a node holds it.
const catByKey=(kind,key)=>CAT[kind].entries.find(e=>e._key===String(key))||null;
const catNode=(kind,id)=>id&&CAT[kind]?CAT[kind].entries.find(e=>e.id===id)||null:null;
// A lot merged into another is a TOMBSTONE: it carries lineage.mergedInto (the keep it became) and is
// struck-not-deleted — kept for provenance and reversal, never browsed, never matched. A role:'batch' node
// is the synthetic processing-batch parent (RESOLVER §5): it groups grade-split siblings, never shows as a
// browsable green, and matches only its own bare-outturn token. lotLive is a real standing green — the only
// thing the atlas browses, the scorer proposes over, or a fresh bind lands on.
const lotTomb=l=>(l&&l.lineage&&l.lineage.mergedInto)||null;
const lotLive=l=>!!l&&!l.role&&!lotTomb(l);
// Follow a merge chain to the standing keep (cycle-guarded): a stale ref onto an absorbed lot reads through
// to the green it became, so a merge survives boot re-derivation and a device that hasn't re-pointed yet.
function lotFwd(id){let n=catNode('lots',id),seen={},steps=0;
  while(n&&lotTomb(n)&&!seen[n.id]&&steps++<20){seen[n.id]=1;n=catNode('lots',lotTomb(n))}
  return n?n.id:id}
const lotFwdNode=id=>catNode('lots',lotFwd(id));
function catUpsert(kind,key,fields,who,opts){
  key=String(key||'').trim(); if(!key||!CAT[kind])return null;
  opts=opts||{};
  const now=new Date().toISOString(),at=opts.at||now;
  let e=catByKey(kind,key),changed=false;
  if(!e){e={id:uid(),kind:catSingular[kind],_key:key,createdAt:at,firstBy:who||'',firstAt:at,sightings:[],status:'proposed'};CAT[kind].entries.push(e);changed=true}
  else if(at<(e.firstAt||e.createdAt||'')){e.firstAt=at;if(who)e.firstBy=who;changed=true}
  Object.keys(fields||{}).forEach(k=>{const v=fields[k];
    if(opts.full ? ((regSubstance(v)||regSubstance(e[k]))&&e[k]!==v) : (regSubstance(v)&&!regSubstance(e[k]))){e[k]=v==null?null:v;changed=true}});
  if(changed){e.updatedAt=now;if(who)e.by=who;CAT[kind].dirty=true;saveDoc(kind)}
  return e;
}
// Compile an entry's visible fields from its standing sightings — reachCompile,
// generalised from bag/seen to arbitrary fields. Newest standing line per field
// carries; a struck line keeps its ink; silence is not denial. The mechanism that
// lets a value be a READING over attestations — correctable by a later line, never
// a cell someone overwrote. It also folds the lot's IDENTITY: the strongest standing
// bind wins — documented (a hard-ID column) outranks a keeper's confirm, which outranks
// the fingerprint's derived read; the lotKeyOf floor (a fingerprint fork or a ≥2-token
// collapse) is the fallback beneath them. Reads the column-carried binds as the floor
// and folds the judged sightings on top; a struck line keeps its ink but stops carrying
// (RESOLVER §6, PLATFORM's rung ladder).
function compile(e,asOf){
  const stand=s=>asOf?(s.at<=asOf&&(!s.withdrawnAt||s.withdrawnAt>asOf)&&(!s.supersededAt||s.supersededAt>asOf)):sightStanding(s);
  const st=((e&&e.sightings)||[]).filter(stand).sort(bySight);
  const carry={};
  st.forEach(s=>{Object.keys(s.fields||{}).forEach(k=>{if(regSubstance(s.fields[k]))carry[k]=s})});
  const fields={};Object.keys(carry).forEach(k=>{fields[k]=carry[k].fields[k]});
  const hid=((e&&e.hardIds)||[]).filter(h=>!h.withdrawnAt&&(!asOf||h.at<=asOf));
  const binds=st.filter(s=>s&&s.bind);
  let identity;
  if(hid.length)identity={rung:'documented',hardIds:hid};
  else{const pick=r=>binds.filter(b=>b.rung===r).slice(-1)[0]; // st is sorted, last = newest standing
    const conf=pick('confirmed'),der=pick('derived');
    if(conf)identity={rung:'confirmed',bind:conf};
    else if(der)identity={rung:'derived',bind:der};
    else identity={rung:/^fp:/.test((e&&e._key)||'')?'fingerprint':'floor'};}
  return {fields,carry,standing:st,binds,identity};
}
// Seed the catalog from every readable ledger — the move regSeed makes for cafés,
// widened to the spine. Each bag becomes a roaster + a lot (a timid fingerprint) +
// a roast; each café cup contributes its roaster and, when structured, its lot.
// Timid on purpose: a lot collapses only when two-plus origin tokens match —
// thinner origins fork rather than risk unioning two different greens (over-merge
// is the worse failure; the atlas starts granular and is merged UP by curation,
// never auto-merged down). Chronological, so the earliest record holds provenance;
// idempotent, blanks-only, exactly as regSeed.
const catNorm=s=>normName(s||'');
const lotKeyOf=(o,fallbackId)=>{
  const parts=[o.originCountry,o.originRegion,o.producer,o.variety,o.process,o.lot].map(catNorm);
  return parts.filter(Boolean).length>=2 ? 'fp:'+parts.join('|') : 'lot:'+fallbackId;   // too thin to trust → fork
};
// The lot's process family, mapped conservatively from the roaster's free-text process.
// A recognised word carries; anything unclear reads 'unspecified' — the honest default,
// never a guessed 'experimental' (SCHEMA/LOT_IDENTITY: process admits the unspecified).
const PROC_FAM=['washed','natural','honey','anaerobic','experimental'];
const procFamily=p=>{const s=catNorm(p);if(!s)return'unspecified';const hit=PROC_FAM.find(f=>s.indexOf(f)>=0);if(hit)return hit;
  if(s.indexOf('wash')>=0)return'washed';if(s.indexOf('nat')>=0)return'natural';if(s.indexOf('hon')>=0)return'honey';if(s.indexOf('anaerob')>=0||s.indexOf('carbonic')>=0)return'anaerobic';return'unspecified'};
// The lot's identity columns (SCHEMA's ladder, as fields), added ALONGSIDE the flat origin the
// read/retirement paths still use — never replacing it (see the branch decision). Migration is
// honest, never precise: grain follows the finest token actually present; scope, hardIds, harvest
// and intermediary stay unread because flat text carries no channel to read them from; the
// fingerprint mirrors the flat fields so the resolver (a later pass) has a cluster to score, not a
// verdict. Blanks-only through catUpsert, so re-derivation each boot is idempotent.
function lotIdentity(o){
  const head=regSubstance(o.producer)?{headName:o.producer,headTier:'producer'}
    :regSubstance(o.lot)?{headName:o.lot,headTier:'farm'}
    :regSubstance(o.originRegion)?{headName:o.originRegion,headTier:'region'}
    :regSubstance(o.originCountry)?{headName:o.originCountry,headTier:null}
    :regSubstance(o.origin)?{headName:o.origin,headTier:null}:{headName:null,headTier:null};
  const grain=(regSubstance(o.producer)||regSubstance(o.lot))?'green-lot'
    :regSubstance(o.originRegion)?'station-season'
    :regSubstance(o.originCountry)?'region-grade':null;
  return {grain,hardIds:[],
    fingerprint:{headName:head.headName,headTier:head.headTier,country:o.originCountry||null,region:o.originRegion||null,
      varieties:regSubstance(o.variety)?[o.variety]:[],
      process:{family:procFamily(o.process),stages:[]},
      harvest:{crop:null,year:null,hemisphere:null},intermediary:null},
    lineage:{mergedFrom:[],splitFrom:null},processingBatchRef:null};
}
// The whole field object a lot upsert carries — the flat origin (the read surface) plus the
// identity columns above — so catSeed, catStampLot and any later writer stamp one shape. A loose
// free-text origin (no structured fields) keeps only `origin`; structured records keep the six.
const lotFields=(o,pRef)=>{const struct=[o.originCountry,o.originRegion,o.producer,o.variety,o.process,o.lot].some(regSubstance);
  const f=Object.assign({country:o.originCountry,region:o.originRegion,producer:o.producer,variety:o.variety,process:o.process,lotName:o.lot,origin:struct?undefined:o.origin},lotIdentity(o));
  if(pRef)f.producerRefs=[pRef];   // the spine edge lot → producer, set once (blanks-only)
  return f};
/* ---- rung 1: the namespaced hard-ID (RESOLVER §1, LOT_IDENTITY). A few channels mint an
 * identifier public + stable enough that a shared token binds two records to ONE green
 * OUTRIGHT — ahead of lotKeyOf's timid fingerprint fork. Zero-or-many per record, {scheme,value},
 * the value normalised per scheme. The false friends — a warehouse SKU, a per-sale auction seat,
 * a bare grade — are refused at entry: they name the shipment, the seat, or a quality class,
 * never the coffee. On the lot the set is append-only and struck-not-deleted (the sighting law):
 * a mistyped id is withdrawn, never erased, and matching reads only standing tokens. This is the
 * DETERMINISTIC rung, shippable alone; the fuzzy scorer, propose-and-confirm and merge/split are
 * designed in RESOLVER.md and built next. ---- */
const HARDID_SCHEMES=[
  {k:'kenya-outturn',label:'Kenya outturn',hint:'as sewn in the bag — e.g. 17KF0001, or 17KF0001 AA'},
  {k:'coe',label:'Cup of Excellence lot',hint:'country · year · rank — e.g. Ethiopia 2024 #7'},
  {k:'best-of-panama',label:'Best of Panama lot',hint:'estate · year · lot no.'},
  {k:'gesha-village',label:'Gesha Village lot',hint:'lot no. — e.g. 119'},
  {k:'ninety-plus',label:'Ninety Plus lot',hint:'e.g. Perci Lot 50'},
  {k:'esmeralda',label:'Hacienda Esmeralda lot',hint:'year · auction lot no.'},
  {k:'ico',label:'ICO mark',hint:'country/exporter/parcel — e.g. 001/0001/00001'},
];
const HARDID_KEYS=HARDID_SCHEMES.map(s=>s.k);
const hardIdLabel=k=>{const s=HARDID_SCHEMES.find(x=>x.k===k);return s?s.label:k};
// A grade names a quality class shared by thousands of lots — the screen, never the coffee.
const GRADE_ONLY=/^(aa\+?|ab|pb|c|e|tt|t|mh|ml|ub|hb|shb|shg|sc|ep|fw|gw|pea?berry|g\s?[1-5]|grade\s?[1-5])$/i;
const SKU_MARK=/(whse|warehouse|\bspot\b|\bsku\b|\bref\b)/i;   // an importer's private warehouse reference
// The false-friend firewall (RESOLVER §1): refuse a non-identity token at entry, with a plain reason.
// Fires only on a non-empty entry — an empty field is simply no hard-ID, never a refusal.
function hardIdRefusal(scheme,raw){
  const v=String(raw==null?'':raw).trim().replace(/\s+/g,' ');
  if(!v)return null;
  if(!HARDID_KEYS.includes(scheme))return 'Pick what kind of code this is first.';
  if(GRADE_ONLY.test(v))return 'A grade names a class of coffee, not the coffee itself — it can’t be an identity.';
  if(SKU_MARK.test(v))return 'That reads like a warehouse reference — it names the shipment, not the green.';
  if((scheme==='kenya-outturn'||scheme==='ico')&&/^(lot\s*)?#?\d{1,4}$/i.test(v))return 'A bare lot number is a sale position, not this scheme’s identity.';
  if(scheme==='ico'&&!/\d[/]\d/.test(v.replace(/\s/g,'')))return 'An ICO mark is country/exporter/parcel — all three, as printed.';
  return null;
}
// Normalise to the {scheme,value} normal form — fold presentation noise (case, spacing, separators),
// never structure. kenya-outturn is one token, keyed WITH its grade (OUTTURN/GRADE) since one outturn
// splits AA/AB/PB; ico keeps its slashed triple. Returns null on a firewall refusal or an empty entry.
function normHardId(scheme,raw){
  if(hardIdRefusal(scheme,raw))return null;
  let v=String(raw==null?'':raw).trim().replace(/\s+/g,' ');
  if(!v||!HARDID_KEYS.includes(scheme))return null;
  if(scheme==='kenya-outturn'){
    v=v.toUpperCase().replace(/[·,]/g,'/').replace(/\s*\/\s*/g,'/').replace(/\s+/g,'/'); // an appended grade folds onto OUTTURN/GRADE
    v=v.split('/').filter(Boolean).join('/');
  }else if(scheme==='ico'){
    v=v.replace(/\s*\/\s*/g,'/').replace(/\s+/g,'').toUpperCase();
  }else{
    v=v.replace(/\blot\s*#?\s*/i,'#').toUpperCase(); // a lot token canonicalises to #n
  }
  return {scheme,value:v};
}
// A record's hard-ID array → normalised, deduped, firewall-clean {scheme,value}[].
const normHardIds=list=>{const out=[],seen={};
  (list||[]).forEach(h=>{if(!h)return;const n=normHardId(h.scheme,h.value!=null?h.value:h.raw);
    if(n&&!seen[n.scheme+'␀'+n.value]){seen[n.scheme+'␀'+n.value]=1;out.push(n)}});
  return out;};
const recHardIds=r=>normHardIds(r&&r.hardIds);
// A record is worth a lot node when it carries any origin OR a hard-ID — a bag printed with only an
// outturn is still a green. The seed/stamp/repoint sites all gate on this one predicate.
const lotWorthy=r=>[r.originCountry,r.originRegion,r.producer,r.variety,r.process,r.lot].some(regSubstance)||regSubstance(r.origin)||!!recHardIds(r).length;
// The standing lot bound to any of these tokens — the deterministic rung. Matching is EXACT on
// {scheme,value}, and that alone routes the Kenya batch (RESOLVER §5): a batch parent carries the BARE
// outturn (17KF0001), each graded sibling carries OUTTURN/GRADE (17KF0001/AA) — so a graded token lands on
// its sibling and a bare token lands on the parent, no role test needed. Tombstones (merged-away lots) are
// skipped — their tokens were unioned onto the keep. Earliest provenance wins when >1 live lot matches (a
// hard-ID collision across nodes is a merge the keeper adjudicates, RESOLVER §5; here we bind stably).
function lotByHardId(hids){
  if(!hids||!hids.length)return null;
  const hit=CAT.lots.entries.filter(l=>l&&!lotTomb(l)&&(l.hardIds||[]).some(h=>!h.withdrawnAt&&hids.some(x=>x.scheme===h.scheme&&x.value===h.value)));
  return hit.sort((a,b)=>String(a.firstAt||a.createdAt||'').localeCompare(String(b.firstAt||b.createdAt||''))||String(a.id).localeCompare(String(b.id)))[0]||null;
}
// The lot collapse key — the full ladder (resolveLot, below): a standing judged bind, then a shared
// hard-ID, then the fingerprint auto-bind, then lotKeyOf's floor. The re-point paths (catRefsFor,
// catSeed) read it, so a green matched by fingerprint re-derives to the same lot every boot.
function lotBindKey(r,fallbackId){return resolveLot(r,fallbackId).key}
// Accumulate a record's hard-IDs onto its lot — append-only, union by {scheme,value}, signed and
// dated (a documented-rung attestation, PLATFORM), struck-not-deleted, never erased. mergeCatalog
// unions the set across devices like it unions sightings, so a bind is never lost in a sync.
function lotAddHardIds(lot,hids,who,at){
  if(!lot||lot.role||!hids||!hids.length)return;
  lot.hardIds=lot.hardIds||[];let changed=false;
  hids.forEach(h=>{if(!lot.hardIds.some(x=>x.scheme===h.scheme&&x.value===h.value&&!x.withdrawnAt)){
    lot.hardIds.push({id:uid(),scheme:h.scheme,value:h.value,by:who||'',at:at||null});changed=true}});
  if(changed){lot.updatedAt=new Date().toISOString();if(who)lot.by=who;CAT.lots.dirty=true;saveDoc('lots')}
}
/* ---- §2 normalisation (RESOLVER §2, LOT_IDENTITY). The fuzzy rungs degrade to noise without it, so it
 * runs BEFORE any score. Two jobs, all offline and single-file — no dictionary fetched, no key, no model:
 * fold the transliteration variants that make string equality fail on one place (Yirgacheffe/Yirgachefe,
 * Gesha/Geisha, Guji/Gujji…), and reconcile which naming tier a head-string sits at so the scorer
 * compares like with like. Both stay conservative by decision #4: a curated CLOSED table (no fuzzy string
 * distance — edit-distance would fold neighbouring stations, e.g. Kochere/Kochore, silently upstream of
 * any check, the exact over-merge this whole ladder refuses), and the tier is TAGGED, never rewritten —
 * the keeper's own words stand on the record. A missed fold fails to confirm; a wrong fold is a false
 * merge with no appeal, so the fold never guesses. ---- */
// generic fold: lowercase, strip diacritics, drop punctuation, collapse doubled letters + whitespace.
const genFold=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-z0-9\s]/g,' ').replace(/(.)\1+/g,'$1').replace(/\s+/g,' ').trim();
// The closed alias table — a few dozen origin words + varietals that actually collide, [canonical,[variants],tier].
// Tier tags let reconcileTier recognise a place head. Data in the file, curated; NOT a downloaded gazetteer.
const PLACE_ALIASES=[
  ['yirgacheffe',['yirgacheffe','yirgachefe','yergacheffe','yirga chefe','irgacheffe','yirgachef'],'region'],
  ['sidama',['sidama','sidamo'],'region'],
  ['guji',['guji','gujji','gujii'],'region'],
  ['harar',['harar','harrar','hararghe','harrarghe','harer'],'region'],
  ['jimma',['jimma','djimma','jima','jimmah'],'region'],
  ['limu',['limu','limmu'],'region'],
  ['gedeb',['gedeb','gedebe'],'region'],
  ['kochere',['kochere'],'region'],           // deliberately NOT folded with Kochore — different stations (decision #4)
  ['nekisse',['nekisse','nekise'],'region'],
  ['huila',['huila'],'region'],
  ['narino',['narino'],'region'],
  ['huehuetenango',['huehuetenango','huehue'],'region'],
  ['nyeri',['nyeri'],'region'],
  ['kirinyaga',['kirinyaga'],'region'],
  ['gesha',['gesha','geisha'],'variety'],
  ['bourbon',['bourbon','borbon','bourban'],'variety'],
  ['caturra',['caturra'],'variety'],
  ['catuai',['catuai'],'variety'],
  ['typica',['typica','typika'],'variety'],
  ['pacamara',['pacamara'],'variety'],
  ['maragogype',['maragogype','maragogipe'],'variety'],
  ['sudan rume',['sudan rume','sudanrume'],'variety'],
  ['wush wush',['wush wush','wushwush'],'variety'],
  ['mundo novo',['mundo novo'],'variety'],
  ['heirloom',['heirloom','landrace'],'variety'],
];
const _placeCanon={},_placeTier={};

const CHANGELOG=[
  {v:'6.1.0',date:'July 2026',title:'The terrace — the atlas gets its second projection.',items:[
    'A green’s page draws the height it grew at. The map is a plan and answers where a coffee came from; it cannot answer how high. So the atlas gained a section: contour rules, this green’s height placed against every other green the record holds one for, and the reading in words — how many grew lower, how many higher, how many overlap this band.',
    'A range is drawn as a band and a single figure as one line. A lot sold as 1,800–1,900 m never said 1,850, so the drawing never says it either. Height is a growing condition, never a grade — nothing anywhere sorts by it, and it is never part of a coffee’s identity.',
    'The height finally lands. The door has always read an altitude off a paste and shown it as a fact you could strike; it then spent it as a sentence in the notes, where nothing could read it back. It now goes onto the green itself, in a column of its own.',
    'Two heights that disagree are carried, not resolved. The first stands, the other is kept beside it with its author, and the page shows the seam rather than flattening it.',
    'The same section at four scopes — a green, a plate, a roaster, a grower. Where this hand buys, at what heights a facet grew. Greens that state no height are counted out loud, never quietly dropped.',
    'A thousands separator no longer breaks the read: “1,930 masl” was landing as 930 m, a number no page ever said. Heights outside the coffee belt are refused rather than stored.',
  ]},
  {v:'6.0.0',date:'July 2026',title:'The road, streamlined — three rooms, one door.',items:[
    'Three rooms, not four — Atlas · Record · Desk. Today is not a room any more; the coffee in your hands is the head of the Atlas, with its road and the two things anyone ever does with it: open the green, or brew it. More became the Desk: everything that is not a cup, nine rows and one open at a time.',
    'The door is on the masthead. ＋ A coffee sits beside the wordmark on every screen, and opens as a screen of its own rather than a sheet — paste, strike what is wrong, bind. It was the one way a coffee enters the record; now it is the one thing always within reach.',
    'The Atlas is a reading room again — the coffee in hand, the chart at its altitude, the atlas cut into plates, the greens. The lists of hands, the stream and the curator’s bench moved to the Desk, where administration belongs.',
    'The Record is your overlay and says so — your plates, the greens your own record argues for with their reasons, lately, and the bookkeeping the matching writes. The full list of readings is still there, one fold down.',
    'One grammar on every surface. The display line, the sentence under it, the section rule, the row-link, the aside — the prototype’s components, used everywhere. Buttons speak in sentence case instead of shouting; a selected chip is a firmer line, never a fill; the eyebrow gave up the ember, which is reserved for the current action and the score.',
    'The leaf — the app is one column framed like a page from a bound register, so a card reads as sunk into it rather than floating on nothing. The plot gained its ruled ground: a chart at a stated grain, before a single street tile lands.',
    'A green’s page states its resolution out loud, in the same readout the door shows before a bind, and reads in the prototype’s order: the road, the resolution, identity, the standing, the other hands, where it pours, your overlay.',
  ]},
  {v:'5.3.1',date:'July 2026',title:'The reading, at every scope — and the way back.',items:[
    'A roaster’s page, a grower’s, a bar’s now carry the same reading a green does: the road counted across every green in hand, and where those greens grew. One component, five scopes — the lot, the plate, the roaster, the grower, the bar.',
    'A plate draws its origins. Cut the atlas by country, process or variety and the greens are plotted where they grew, not only listed.',
    'Back means the page you came from. A green opened from a plate returns to that plate; a bar opened from a green returns to the green.',
    'Two origin marks that read the same fold into one — a region centroid drawn twice claimed a precision the grain never had. And an actor the plot already draws is no longer also listed for want of a coordinate.',
    'The road reads on a phone: a name runs to two lines and stops rather than breaking into three, and a station says its region rather than its whole address.',
    'The door takes the roast date — the one fact a paste can never carry. Without it the rest window stays unread, so it is asked for once, at the binding, and never invented.',
  ]},
  {v:'5.3.0',date:'July 2026',title:'Two frames, and a chart that corrects itself.',items:[
    'The map stopped pretending one projection could hold a front door and a country. The chart frame is the ground you can walk — roasters and bars, streets behind, the road drawn. Where the green came from keeps its own frame, coarse marks stated as coarse, joined in words rather than a line across the sea.',
    'Scenes and charts, derived — a scene is a cluster of roasters and bars close enough for one outing, read from the pins; a chart is one or more scenes under a name you give it. Fix a pin and the chart corrects itself; nothing is stored that could rot. A lens narrows the chart, never sorts it, and says out loud what it hid.',
    'Drawn to its grain — a region centroid renders hollow and dashed, a street point filled; marks the plot cannot separate fold into one mark carrying a count; a node with no coordinate lists by name instead of lying. The camera gains a floor, so the map never opens at world zoom.',
    'A wrong pin is no longer forever — correct it from the roaster’s or the grower’s page, the candidates offered rather than guessed between. The automatic fill now refuses an ambiguous name outright.',
    'Two edges close on the spine — a pour reaches its roast when the atlas knows exactly one, and a brew carries its green directly, so a lot’s corpus stands even after its bag is gone.',
  ]},
  {v:'5.2.0',date:'July 2026',title:'The door, the road, the plate — one way in, one reading out.',items:[
    'The door — every way of adding a coffee is now one paste field. Paste the roaster’s page, the back of the bag, an auction line; CARTA reads it on the device — no key, no account, no network — and shows what it found as facts you can strike. The reading says out loud how finely the green resolves and whether it holds enough to meet another keeper’s record: two facts of six, and it can. One last tap binds it — on my shelf, poured at a bar, brewed just now, or just noting it. The old forms stay one tap away, for typing it by hand.',
    'The road, drawn honestly — a green’s page now shows all six stations, grown to read, hollow where the record is silent, the connector dashed across a gap. The gap is the product: the record stating what it has not been told, never a blank to fill. The coffee in your hand carries its road on Today.',
    'The plate — cut the atlas by country, process or variety and read the whole facet as a page: the aggregate road counts how many of its greens reach each station, so you can see exactly where the road goes dark. Greens that leave the facet unread are counted, never quietly dropped.',
    'The farm and the station, kept apart — the door tells a finca from a washing station by vocabulary, tags the grower’s kind, and gives the processor its own node on the spine. An unmatched name stays unclassified rather than being guessed into a tier.',
    'Three prefilled fields in the curator sheets — a city and a country typed in before you said anything — are gone. A blank field is honest; a prefilled wrong one becomes a permanent wrong pin.',
  ]},
  {v:'5.1.0',date:'July 2026',title:'The founder’s pen — the shared record, kept by one hand for now.',items:[
    'While the atlas settles, the shared record — the atlas and the Register — is written by one pen: the founder’s. Everyone reads everything; everyone writes their own ledger, always. On a sync server the first account registered holds the pen and the server itself refuses any other; on a single device the pen is taken up once, under More → Administration.',
    'The founder’s desk — one door for entering the shared record cleanly: add a roaster, author a roast, enter a café’s canonical entry, propose a sighting, settle the review queue, walk Chart No. 1. Each row opens the form that already knows its law.',
    'Every page stays yours to read — the chart, the pages, the Register, the reach. What waits is only the writing of the shared page, and it returns with the moderation ceremony; nothing here is taken away for good.',
    'The surfaces the redesign did not carry — the matching’s cold-start and discover map, the circle stream, taste affinity, beans worth chasing — step behind a shutter rather than being torn out. The Record’s own bookkeeping stays visible, as it always must.',
  ]},
  {v:'5.0.0',date:'July 2026',title:'The redesign — the lot moved to the centre.',items:[
    'Four rooms, always on the bar — Today · Atlas · Record · More. Home and Café became channels, not rooms: the instrument rides off Today, the cup out rides off a place’s page. Find retired into the Atlas — search, the chart, the drawn plot.',
    'Every green and every roaster is a page now, not a sheet — the road from grower to bar, the identity columns, the standing, where it pours, every hand’s roast, your own brew corpus, and your overlay at the end of it. The spine stands without you; the wash is yours.',
    'The interlude — ask the atlas to read the season for you and it composes once, in front of you: the pins settle, a line draws through them, ranked only by your own taste and shown with its reasons. Never on its own; still under reduced motion.',
    'Act III, the signed page — a roaster or a bar can hold the pen on its own link: a three-step claim, a monochrome mark, first-party corrections that stay scoped and strikeable. The page was true before it was signed, and stays the reader’s after.',
    'Propose a sighting — a bag on a shelf, a roast on a bar. The chart looks for it before it binds: a shared printed code binds outright, a fingerprint asks, a same-name-different-process refuses to merge on the string.',
    'The home cup, end to end — the shelf, the dials, the reading: Coffee → Preparation → Cup, the same shape a cup out keeps, so a cup in and a cup out read as one preference.',
    'The record leaves with you — the ledger exports as one self-contained page on CARTA paper stock, with the machine-readable record inside it; a persistent save panel guarantees the file reaches you; and a ledger reads back in, whole, never merged.',
    'Every mark explains itself one tap away — the primers. A motion charter: three durations, one ease; used more, moves less; reduced motion first-class.',
  ]},
  {v:'4.27.0',date:'Jul 24, 2026',title:'The standing — a green’s rarity and caliber, sourced',items:[
    'A green’s page can now carry its standing — how rare it is, how it has cupped — read beside how far its identity traces. Three independent facts, never merged into one verdict: nothing here is your taste, which stays yours on your own cup.',
    'A cup score counts only once it names where it came from — a competition, an auction, a named cupper or lab, or your own signed cupping. Leave the source unnamed and a score still saves, but honestly, as a claim: “roaster-stated 92 — unverified,” never printed as the read. A roaster’s own number was never going to be the truth of the coffee, and now the record says so instead of pretending otherwise.',
    'Rarity reads as sourced facts too — a disclosed lot size, an auction price, a scarce varietal, how few hands carry it. Nothing is scored; nothing is guessed. An unrated, ordinary lot still reads as a complete record — the standing is there to find, never a rank forced onto every green.',
  ]},
  {v:'4.26.0',date:'Jul 24, 2026',title:'The atlas, drawn on the map',items:[
    'Chart No. 1 now draws as a map, folded into the same atlas surface you already walk: the season’s origins at a coarse-but-honest position, the roasters in their city, the bars on their streets, and a thin line tracing a green from origin to roaster to bar. A stranger opens it read-only and reads the whole scene at a glance; every mark taps into its page — a grower, a roaster, a venue — so the map and the pages are one walk. Map or List, whichever you like.',
    'Coordinates stay honest. A venue sits at its real point, a roaster at its city, a green at its region — coarse where the record is coarse, and never a farm-precise pin invented. A node with no coordinate lists rather than lies. The street layer is an enhancement: the drawn plot renders first from saved positions and stands alone offline, and the whole scene keeps working — pins, taps, lines — with no streets at all.',
    'Author a roast online and its city and origin place themselves on the map, from the same keyless lookup the café address uses — filling only what’s blank, never a coordinate the record doesn’t have.',
  ]},
  {v:'4.25.0',date:'Jul 24, 2026',title:'The encyclopedia — every node a page',items:[
    'A green’s page is no longer a dead end past its roasts. Its grower, each of its roasters, and every venue that pours it are now taps — walk from a green to the washing station behind it, to a roaster and every other green that hand has touched, to a café and what else it pours. Nothing is a dead end; the pleasure is the drilling-in.',
    'A grower opens onto the greens traced to it — a washing station gathers cherry from many hands, so its greens stand apart, each its own lot, never one blurred farm. A roaster opens onto every green it has touched, with the offering and level it gave each. A venue opens onto the greens poured at its counter.',
    'Chart No. 1 is walkable read-only now — a stranger reads it without the pen: its roasters, the season’s greens, and the page nothing else shows, one washing station in more than one hand. Each page still says how far its green resolves and how sure its identity is — a lens, never a rank, its marks monochrome.',
  ]},
  {v:'4.24.0',date:'Jul 23, 2026',title:'Charting a city, green by green',items:[
    'You can now author the atlas directly — a roaster, a green and a roast onto the record without logging a cup you had. Find it under your record: Chart No. 1, Los Angeles, its Ethiopian 2025 greens. Every green you author runs the same resolver a bag does, so the sure ones fold onto a green already charted and the look-alikes wait to be settled.',
    'When two greens read too close to call on their own, they land in a quiet review queue — never a nag, and empty when there’s nothing to settle. Work each with one deliberate tap: confirm the one that’s truly the same green, and the rest stay honestly apart, or keep them all apart, the safe call.',
    'The chart shows its own progress — the roasters and greens charted so far, and the page nothing else can render: one washing station, more than one roaster’s reading of it.',
  ]},
  {v:'4.23.0',date:'Jul 23, 2026',title:'A green, joined or set apart by hand',items:[
    'A green’s page can now be corrected. Two greens you’ve learned are one — join them, and every roast, pour and record on both follows onto the kept green, with nothing lost. A conflation you’ve learned is two — split it back apart, and both greens stand. A string that merely reads alike never joins on its own; a join needs a shared printed code or a matching origin, and every correction can be undone.',
    'Kenya’s outturn now reads as it works: one cherry, graded into sibling export lots. AA and AB of one outturn stand as siblings under a single processing batch; a bag that names only the outturn rests on the batch until its grade surfaces, then splits to its sibling — without re-entering the code.',
  ]},
  {v:'4.22.0',date:'Jul 23, 2026',title:'A green, recognised by its fingerprint',items:[
    'Two records with no shared code can now land on one green when their origins line up — the station, the variety, the process, the year. Spelling that drifts across hands (Yirgacheffe, Yirgachefe) is folded before the comparison, so the same place reads as the same place. A different country is never crossed; what a label leaves blank never counts against a match.',
    'When the read is sure, the records join on their own and the green says how it knew. When it’s close but not certain, the record asks you one plain question — the same green, or a different one? — with its reasons on the table. Not sure keeps them apart, the safe call, and every join can be undone from the green’s page later.',
  ]},
  {v:'4.21.0',date:'Jul 23, 2026',title:'A green, bound by its printed code',items:[
    'A bag or a café cup can now carry a printed lot code — a Kenya outturn, a competition-auction lot, an ICO mark — under the origin. When two records carry the same code, they land on one green outright, even where the words alone read a little differently: the surest way to say “the same green, in another hand.”',
    'A code that isn’t an identity — a bare grade, a warehouse reference, a per-sale lot number — is turned away with a word on why. What’s entered only ever adds to the green and is never erased; a green bound this way says so on its page.',
  ]},
  {v:'4.20.0',date:'Jul 23, 2026',title:'The same green, in more than one hand',items:[
    'A bag now opens onto its green — the lot behind it — and every roast of that same lot, each named by its roaster. The first time the record shows one coffee in more than one hand. Reach it from a bag on your shelf, or the by-lot fold under your record.',
  ]},
  {v:'4.19.0',date:'Jul 22, 2026',title:'The loose line, on the green too',items:[
    'A café cup\'s loose origin — the quick "Ethiopia / blend" you jot when there\'s no lot to spell out — now rests on the green behind the cup like its every other origin field, so the whole cup reads from one place. As everywhere else it re-spells nothing you wrote and falls back to exactly what you typed; a cup shared into your circle still shows precisely its keeper\'s own words.',
  ]},
  {v:'4.18.0',date:'Jul 22, 2026',title:'A copy that carries its atlas',items:[
    'Save a copy now writes the atlas into the file beside your ledger, so a copy opened on a device that never synced reads every roaster, origin and roast in full — not the blanks it would have shown once those had folded onto the green behind them. Bringing a copy in folds its atlas into the device\'s own, matching each record to the green it already knows.',
  ]},
  {v:'4.17.0',date:'Jul 22, 2026',title:'A café cup, keyed on the green',items:[
    'A café cup now reads its traceability — country, region, variety, producer, process, lot — through the green behind it too, so a cup and a bag of the same lot read as that one lot on the cup\'s page, however loosely either was typed. As on your shelf, it only re-spells an origin you already wrote and never adds a field the cup didn\'t log; a cup shared into your circle still shows exactly what its keeper wrote.',
  ]},
  {v:'4.16.0',date:'Jul 22, 2026',title:'One green, spelled once',items:[
    'A bag now reads its origin — country, region, producer, variety, process — through the green behind it, so bags of the one lot spelled a little differently read as that one lot across your shelf, its page, and the brew screen. It only ever re-spells an origin you already wrote; the atlas never adds a field the bag didn\'t log, and everything falls back to exactly what you typed.',
  ]},
  {v:'4.15.0',date:'Jul 22, 2026',title:'Café beans, one name too',items:[
    'A café cup now reads its beans-roaster the same way your shelf does — variants of a roaster you\'ve typed differently across cups read as the one roaster they are, on the cup\'s row and its page. As on the shelf, nothing you wrote is changed and it falls back to exactly what you typed. A cup shared into your circle still shows precisely what its keeper wrote.',
  ]},
  {v:'4.14.0',date:'Jul 22, 2026',title:'One roaster, one name',items:[
    'A bag now shows its roaster under one canonical name across your shelf — when you\'ve written a roaster a little differently on different bags, they read as the one roaster they are. Nothing you typed is changed; the bag just reads through to the roaster behind it, and falls back to exactly what you wrote wherever there\'s nothing to read through.',
  ]},
  {v:'4.13.0',date:'Jul 22, 2026',title:'Your journal, by lot',items:[
    'Your record now also folds by lot: when the same green shows up in more than one record — a bag you brewed and a cup you had out that trace back to one lot — it gathers into a single row, tied where the loose origin words alone could never connect them. Tap a lot to see every record on it.',
    'Only lots that appear in two or more records show — a green logged once just echoes its own record, so it stays out of the way. Like the rest, it reads from what you\'ve already written and adds nothing to fill in.',
  ]},
  {v:'4.12.0',date:'Jul 22, 2026',title:'Your journal, by roaster',items:[
    'Your record now folds by roaster: one row per roaster behind your bags and café cups, with variants of a name gathered together and a bag at home counted beside a cup you had out. Tap a roaster to see every record under it.',
    'It reads from what you\'ve already logged — no roaster, no row — and appears only once there\'s more than one record to gather, so it stays a reading over your journal, never another thing to fill in.',
  ]},
  {v:'4.11.0',date:'Jul 22, 2026',title:'More from this roaster',items:[
    'A bag or a café cup now also shows more from the same roaster elsewhere in your journal — a bag you brewed at home and a cup you had out under one roaster, tied even when the name was written a little differently each time.',
    'It sits under the same-lot line and never repeats a record already shown there; like that line, it reads from what you\'ve logged and appears only when there\'s truly something to connect.',
  ]},
  {v:'4.10.0',date:'Jul 22, 2026',title:'The same lot, wherever it landed',items:[
    'A bag or a café cup now shows the same green lot elsewhere in your journal — the coffee you brewed at home and the one you had out can be a single lot, a tie the origin words alone could state but never connect. Tap it to cross to the other record.',
    'It reads from what you already logged and appears only when a lot truly recurs; nothing new to fill in, nothing shown when there\'s no match yet.',
  ]},
  {v:'4.9.0',date:'Jul 19, 2026',title:'Streets under the pins',items:[
    'The map surfaces — Find\'s results, the discover map, a café\'s page — now draw real streets behind the pins: OpenStreetMap, repainted in CARTA\'s own paper and ink. No key, no account, nothing tracked.',
    'Offline nothing changes. The drawn plot stands, exact as ever, and streets slot in quietly only when the tiles can be fetched. The map is an enhancement, never a dependency.',
    'A café\'s page gains a small locator — its pin wearing the café\'s own accent, the streets around it staying neutral.',
    'The discover map pans now. Ranks are labels, not positions — #2 stays #2 wherever you wander — and the drawer follows the pin you tap.',
  ]},
  {v:'4.8.0',date:'Jul 19, 2026',title:'Appearance, auto',items:[
    'A third choice under Preferences → Appearance: Auto. It hands the call to your device\'s own light/dark setting and follows it live — dusk falls in when the system does, no separate switch to remember.',
  ]},
  {v:'4.7.0',date:'Jul 19, 2026',title:'Today, and the matching',items:[
    'A new first tab: Today. The day\'s greeting, the thread you left on the map — a session holds for a week, then steps back to a plain suggestion — three matched teasers, and the record\'s recent line.',
    'The matching. Every place on the register you haven\'t kept is read against your record: the traits of the places you keep, the distance when you say where you stand (held in memory, never stored), the circle\'s cups through affinity. Every number carries its reasons — no score without its signals — and until three café cups are kept it speaks in bands, not numbers.',
    'New to the record? Name three cafés you already love, on Today, and their traits become your signal. A place the register doesn\'t know yet enters on its name alone.',
    'The map, read for you — from Today or Find. Pins ranked by match, a card per pin, a list view that hides nothing. Save waits under Want to go; Skip steps a place back for two weeks and fades on its own — never a veto — and "fewer like it" tips its kind down on the same curve.',
    'The Record keeps the bookkeeping: Want to go ordered by match with a gentle ask when a save sits unvisited, standing skips, standing trait leans — every one visible, every one fading on its own.',
  ]},
  {v:'4.6.0',date:'Jul 18, 2026',title:'A banner, and the map',items:[
    'A café\'s own page now opens on a banner drawn from its own colours — the signature hue read from its website, or a neutral roast tone while that\'s still unread. The name rides on it; nothing else about the record changed.',
    'Find\'s search grew a map — real pins, scaled to fit, never a tile or a street. A filled dot is a place you keep; a dashed one is still waiting for a first cup. Tap either to open the page.',
  ]},
  {v:'4.5.0',date:'Jul 18, 2026',title:'Neighborhood and tags',items:[
    'A café can now name a neighborhood, not just a city. Looking it up on the map fills it in automatically when it knows one — blanks only, typed always wins — and it rides next to the city everywhere a café is shown.',
    'Tag a place your own way — patio, quiet, laptop-friendly, whatever you\'d tell a friend. Tags live on the café\'s page and join the pooled search in Find, so a tag turns up every place you\'ve marked with it.',
    'Both are Register facts like the pin and the palette: shared by every keeper of the device, and synced to the group the same way.',
  ]},
  {v:'4.4.0',date:'Jul 18, 2026',title:'The reach',items:[
    'Every café can now be read for depth — four marks, no ladder: ○ Counter, ◎ House, ◉ Roastery, ● Origin. How much of a coffee\'s road makes it across the counter — a description of the café, never a score. The 1–9 stays yours.',
    'You never pick a badge. Say what you saw — the bag named, the methods on the menu — and the reading follows from the record. A sighting rides the café cup form (optional, three taps at most) or the café\'s page; each is signed, dated, and shared through the Register.',
    'Per fact, the newest sighting carries; older lines keep their ink. Amend your own line or withdraw it — struck, signed, never erased. Where no one has read a café, it says unread — never a default to the shallow end.',
    'Depth is a lens in Find — filter Worth the walk to a mood, never a sort. Every badge is one tap from the primer, and the record of the reach opens from the café\'s page.',
  ]},
  {v:'4.3.0',date:'Jul 18, 2026',title:'The bag, read from its website',items:[
    'A coffee now reads itself off the web, the way a café already does. Give the bag its website and CARTA takes the roaster’s colours and the line it states — and the bag wears that palette on its page and its place on the shelf. Less to type; a shelf that finally has a face.',
    'Café cups can pull the beans’ brand the same way — the roaster’s site fills the beans and a line, and the cup carries the colours it read.',
    'Photographs are retired — bags, cups, all of it. A brand is its colours and its words, kept small, offline and portable; no picture is captured or stored. Old photos stay in the record, simply no longer shown.',
  ]},
  {v:'4.2.0',date:'Jul 18, 2026',title:'The café, read from its website',items:[
    'A café’s brand now comes from its website alone — give it the site and CARTA reads the colours straight from the source. The branding photograph is retired; the website read was always the stronger hand.',
    'One read fills more than colour. The site’s own description becomes the café’s line, the name it states is surfaced, and the map opens on its address — so you retype nothing the site already knows. It fills only what’s still blank.',
    'What CARTA keeps is the palette and the words, never the page — held on the device, the record yours and offline.',
  ]},
  {v:'4.1.0',date:'Jul 18, 2026',title:'A café’s colours, from its website',items:[
    'Give a café its website and CARTA reads its colours straight from the brand — the logo and the palette around it — then dresses the café’s page and every cup you log in it. The same surface as before, sourced from the site instead of a photograph.',
    'The photo still works, and still overrides. Offline, or a site that won’t answer, falls back to it without a fuss.',
    'What CARTA keeps is the palette, not the page — a handful of colours, held on the device, the record still yours and still offline.',
  ]},
  {v:'4.0.0',date:'Jul 18, 2026',title:'A room at a time',items:[
    'CARTA now opens a room at a time — Reading, Remembering, Making, Keeping. Start by reading other people\'s cups; step deeper whenever you\'re ready. Nothing is ever taken away.',
    'Friends is now Find. Same record, sharper question: where is the next good cup? Recommendations, taste affinity, the stream, the beans worth chasing — and a door to the next room at the bottom.',
    'Every café is a page now, not a sheet. Your cups, the circle\'s cups, the pin, the provenance — one place per place, reached from anywhere its name appears.',
    'The first brew asks only for your grinder and brewer, in plain words — the Setup writes itself. The full Setup editor still exists for the day you change a burr.',
    'The bag\'s end is part of the record: put it away from Home, and it waits under Put away with your best cup. Buy it again and the first brew starts from what you learned.',
    'The Ledger tab is now More — your record, the ladder of rooms, preferences, your circle, the manual. The welcome asks one honest question: how do you take your coffee?',
  ]},
  {v:'3.1.0',date:'Jul 17, 2026',title:'Log light, fill in later',items:[
    'Every cup is editable. Open one from the record and revise it — add the beans, the price, a photo, the order-again verdict, whenever you have the time. It keeps its place and hour.',
    'Café cups start minimal: a shop, a style, a tap on the scale. Everything else waits behind one line — add the rest now, or come back to it.',
    'Brews open the same way — the dials up front, instrumentation and notes folded away until you want them.',
    'A bag is a photo and a name. Origin, roast date and price fill in when they earn their place.',
    'Correct a brew after the fact — fix a dose or a time, and the cup it carries stays put.',
  ]},
  {v:'3.0.0',date:'Jul 17, 2026',title:'Find the next cup',items:[

const lastSeenVersion=()=>{try{return localStorage.getItem(SEEN_KEY)}catch(e){return null}};

/* ============ router ============ */
/* The rooms open a ladder at a time — Reading (Find), Remembering (Café),
 * Making (Home), Keeping (Record). depth() is how far this user has stepped in;
 * the tab bar shows only the open rooms, and each room's foot holds a door to
 * the next. Nothing is ever taken away — only added. */
const DEPTH_NAMES=['Reading','Remembering','Making','Keeping'];
function depth(){
  if(readOnly())return 4;                        // a record being read shows all its rooms
  const d=getPref('depth',null);
  if(d)return Math.min(4,Math.max(1,d));
  // ledgers from before the ladder — anyone with a record, or already welcomed — start fully open
  return (getPref('onboarded',false)||D.cups.length||D.bags.length||D.setups.length)?4:1;
}
/* STREAMLINED.html: three rooms, always on the bar — Atlas · Record · Desk.
 * The atlas is the shared road, the record is your wash over it, and the desk
 * holds everything that is not a cup. Today folded into the head of the Atlas
 * (the coffee in your hands, its road, and the two things you do with it);
 * Home and Café are channels, not rooms; Find retired into the Atlas. The
 * ladder survives as the record of how deep you've stepped — read on the Desk,
 * never a gate on the bar. Nothing is ever taken away. */
function tabsFor(d){
  return [{id:'atlas',label:'Atlas'},{id:'trace',label:'Record'},{id:'ledger',label:'Desk'}];
}
const defaultTab=d=>'atlas';
function unlockDepth(n,t,msg){setPref('depth',Math.max(depth(),n));placeView=null;go(t);toast(msg)}
const UNLOCK={2:['atlas','Remembering is open — a bar and one tap is a whole record.'],3:['atlas','Making is open — the instrument rides off the coffee in your hands.'],4:['trace','Keeping is open — the whole through-line.']};
function doorHTML(title,body,cta,call){

    <div class="muted small" style="margin:6px 0 12px;line-height:1.5">${body}</div>
    <button class="btn btn-quiet" onclick="${call}">${cta}</button>
  </div>`;
}
const seal=(name,em)=>`<div class="qm-seal">${esc(name)}<span class="em">${em}</span></div>`;
/* The shutter — temporary, deliberate. Rooms from before the redesign that the

 * the circle stream, taste affinity, beans worth chasing, the cross-context

 * true and every one of them answers again; nothing was deleted. The Record's
 * bookkeeping (wants, skips, leans) stays visible — nothing the matching
 * writes is hidden from the Record. */
const LEGACY_ON=false;
let tab='today';
let placeView=null;   // a café name — the page currently open over the tab, or null
let pageView=null;    // {kind:'lot'|'roaster',id} — an atlas page open over the tab, or null
let pageStack=[];     // the pages walked through to reach it — back returns to the last one, not the room
let doorOn=false;     // the door — a screen of its own, over any room (SURFACES.md §1)
function openPlace(shop){pagePush();placeView=shop;pageView=null;curateOn=false;doorOn=false;render()}
function closePlace(){if(pageStack.length)return pageBack();placeView=null;render();if(discOn)discScrollTo(discSel,true)}
// Rooms that became channels keep their old names answering — a saved flow
// that says go('cafes') or go('today') lands where that work now lives.
const TAB_ALIAS={field:'atlas',cafes:'atlas',circle:'atlas',today:'atlas'};
function go(t){t=TAB_ALIAS[t]||t;tab=t;placeView=null;pageView=null;pageStack=[];discOn=false;curateOn=false;doorOn=false;deskOpen=null;discMatch=null;clearTimeout(_mt);if(t!=='atlas'){reachLens=0;reachTail={}}render()}
// which room a sub-view lights on the bar
const TAB_FAMILY={bags:'atlas',shelf:'atlas',setups:'ledger'};
/* The header's second line names the screen, not the app — the prototype's SUBS.
 * It is the only place the app says where you are, so it says it plainly. */
const SUBS={atlas:'The atlas',trace:'The record',ledger:'The desk',bags:'The shelf',setups:'The tools',
  lot:'A green',roaster:'The roaster',plate:'A plate',place:'The bar',door:'A coffee',curate:'The chart',disc:'The map'};
let _lastScreenKey=null; // the settle plays on a screen change, never on a repaint
function screenSub(){
  if(readOnly())return `Viewing ${viewingUser().name}`;

function render(){

  document.getElementById('who').textContent=screenSub();

  m.innerHTML=settle?`<div class="ca-screen">${body}</div>`:body;
  m.scrollTop=0;window.scrollTo(0,0);
  smapMount();
  if(doorOn&&doorStep===0){const ta=document.getElementById('d_text');if(ta)ta.focus()}
}
function viewBanner(){return `<div class="viewbar"><span>Viewing <strong>${esc(viewingUser().name)}</strong>'s ledger — read only${remoteStale?` · cached ${fmtAgo(remoteStale===true?null:remoteStale)}`:''}</span><button onclick="exitView()">Back to mine</button></div>`}

/* ============ views ============ */
function cupRow(c,showKind){
  const b=bagById(c.bagId);
  const cafe=c.kind==='cafe';
  const what=cafe?`${esc(c.shop||'café')}${c.drink?` · ${esc(c.drink)}`:''}`:esc(bagName(b));

    ?`<span class="num">${brew.grind??'—'} grind · ${brew.doseG??'—'}g → ${brew.waterG??'—'}g · ${fmtTime(brew.timeSec)}</span>`
    :cafe
      ?`${c.city?esc(c.city)+(beans?' · ':''):''}${beans||(c.city?'':`<span class="chip">${c.instrumentation||'recalled'}</span>`)}`
      :`<span class="chip">${c.instrumentation||'recalled'}</span>`;
  const verdict=(c.again===true?' <span class="badge">again</span>':c.again===false?' <span class="badge ghost">pass</span>':'')
    +(showKind?` <span class="badge ghost">${cafe?'café':'home'}</span>`:'');
  const pal=cafe?palOf(c):null,vars=pal?cafeVars(pal):''; // a café cup wears the beans' brand, if one was read
  return `<div class="card tap"${vars?` style="${vars};border-left:3px solid var(--accent)"`:''} onclick="openCupDetail('${c.id}')">
    <div class="row"><span class="small"><strong>${what}</strong>${verdict}</span>
      <span class="num" style="font-size:20px;font-weight:700;color:var(--accent)">${c.hedonic??'—'}</span></div>
    <div class="muted small">${meta}${cafe&&c.price!=null?`<span class="num" style="float:right">${money(c.price)}</span>`:''}</div>
    ${c.descriptors&&c.descriptors.length?`<div class="muted small serif" style="font-style:italic">${c.descriptors.map(esc).join(', ')}</div>`:''}
    <div class="muted" style="font-size:11px">${new Date(c.createdAt).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>
  </div>`;
}
// The spine, read at last — the first surface to lean on a ref instead of the
// flat text beside it. A record's lotRef points at its node in the atlas; other
// records that resolved to the SAME node are the same green wherever it landed —
// a bag you brewed and a cup you had out can be one lot, a tie the flat origin
// words can state but never connect. Still grounded in those words (the label is
// built from them; a record with no lotRef simply shows nothing here), so reading
// through the ref earns only what the atlas alone can say and stays reversible.
// Records that resolved to the same node as `rec` on ref `k`, bag and café cup
// alike. Grounded in flat text throughout — the labels are the flat names, no
// ref no kin — so this only ever reads what a resolved id can say that loose
// words can't: the CONNECTION between two records the spine collapsed to one.
function refKin(rec,k,skip){
  const ref=rec&&rec[k]; if(!ref)return [];
  const seen=new Set(skip||[]),out=[];
  (D.bags||[]).forEach(b=>{if(b&&b.id!==rec.id&&b[k]===ref&&!seen.has(b.id))out.push({t:'bag',id:b.id,label:bagName(b)})});
  (D.cups||[]).forEach(c=>{if(c&&c.kind==='cafe'&&c.id!==rec.id&&c[k]===ref&&!seen.has(c.id))out.push({t:'cup',id:c.id,label:[c.shop,c.drink].filter(Boolean).join(' · ')||'a café cup'})});
  return out;
}
const lotKin=rec=>refKin(rec,'lotRef');
// The second surface to lean on a ref. Lot first — the deepest tie the atlas
// draws (one green, two records the origin words could never link). Roaster
// second, and only for records the lot line didn't already claim: the roaster
// node collapses spelling variants a keeper couldn't reliably match by eye, and
// ties a bag brewed home to a cup had out under one roaster. Both stay a reading
// OVER what's logged — absent with no ref, no match — so it's reversible still.
function kinLine(label,kin){
  const links=kin.map(k=>`<a class="link" onclick="${k.t==='bag'?'openBagDetail':'openCupDetail'}(${jsq(k.id)})">${esc(k.label)}</a>`).join(', ');
  return `<div class="muted small" style="margin:-4px 0 12px">${label} ${links}.</div>`;
}
function kinHTML(rec){
  const lot=lotKin(rec);
  const roaster=refKin(rec,'roasterRef',lot.map(k=>k.id));
  let out='';
  if(lot.length)out+=kinLine('Same lot, elsewhere in your journal:',lot);
  if(roaster.length){const n=rec.roasterRef&&catNode('roasters',rec.roasterRef),rn=(n&&n.name)||rec.roaster;out+=kinLine(`More from ${rn?esc(rn):'this roaster'}, elsewhere:`,roaster);}
  return out;
}
// The read-through, aggregated — the same refs the detail sheets lean on, now folded
// over the WHOLE journal on one ref. Every bag and café cup gathers under the node it
// resolved to, so variants the flat words couldn't reliably tie collapse into one row
// and a bag brewed home sits beside a cup had out. A reading over the refs, not a
// store: no ref, no row (grounded in what's logged, absent when nothing resolved), so
// like the detail lines it stays reversible. `key` is the ref field on the records;
// `name` labels a resolved node id for the surface. Roaster folds on one token, so
// every roaster shows; a lot forks unless two-plus origin tokens agree, so its rows
// are the rarer, deeper ties — the same green in more than one record.
function refIndex(key,name){
  const g=new Map();
  const add=(ref,rec,t)=>{if(!ref)return;let e=g.get(ref);if(!e){e={ref,name:name(ref),bags:0,cups:0,recs:[]};g.set(ref,e)}e[t==='bag'?'bags':'cups']++;e.recs.push({t,id:rec.id})};
  (D.bags||[]).forEach(b=>{if(b)add(b[key],b,'bag')});
  (D.cups||[]).forEach(c=>{if(c&&c.kind==='cafe')add(c[key],c,'cup')});
  return [...g.values()].sort((a,b)=>(b.bags+b.cups)-(a.bags+a.cups)||a.name.localeCompare(b.name));
}
const roasterName=ref=>{const n=catNode('roasters',ref);return (n&&n.name)||'a roaster'};
// A lot has no single name — build one from the origin words it collapsed: who (the
// producer, or the lot name), where (region, country), and the variety, terse.
const lotLabel=n=>{if(!n)return 'a lot';const place=[n.region,n.country].filter(Boolean).join(', ');const parts=[n.producer||n.lotName,place,n.variety].filter(Boolean);return parts.length?parts.join(' · '):'a lot'};
// How many roasters' hands a green has passed through — the shared-spine fold (CAT.roasts by lotRef), the
// "same green, in N hands" count the atlas exists to show. Read by the lot, producer, roaster and venue pages.
const lotHands=id=>new Set(CAT.roasts.entries.filter(r=>r&&r.lotRef===id&&r.roasterRef).map(r=>r.roasterRef)).size;
// The resolution grain, read honestly (RESOLVER §6, LOT_IDENTITY): the level identity actually reached.
// A green-lot is the finest; a station-season is a legitimate TERMINAL node, not a half-filled lot; a
// region-grade is the honest ECX floor, no finer identity printed. Monochrome — a lens, never a rank.
const GRAIN_READ={'green-lot':['green lot','the finest grain — a single green lot'],
  'station-season':['washing station · season','a terminal node — the finest this green resolves to, and a real one'],
  'region-grade':['region · grade','the ECX floor — no finer identity is printed'],
  'processing-batch':['processing batch','one cherry, graded into sibling export lots']};
const grainRead=g=>GRAIN_READ[g]||null;
const roasterIndex=()=>refIndex('roasterRef',roasterName);
const lotIndex=()=>refIndex('lotRef',ref=>lotLabel(catNode('lots',ref)));
const kinTally=r=>[r.bags&&`${r.bags} ${r.bags===1?'bag':'bags'}`,r.cups&&`${r.cups} ${r.cups===1?'cup out':'cups out'}`].filter(Boolean).join(' · ');
const kinRow=m=>{const rec=m.t==='bag'?bagById(m.id):cupById(m.id);if(!rec)return'';
  const label=m.t==='bag'?bagName(rec):([rec.shop,rec.drink].filter(Boolean).join(' · ')||'a café cup');
  return `<button class="wc-item" onclick="${m.t==='bag'?'openBagDetail':'openCupDetail'}(${jsq(m.id)})"><span class="tx"><span class="tt">${esc(label)}</span><span class="dd">${m.t==='bag'?'on your shelf':'a cup out'}</span></span><span class="go">→</span></button>`};
function openRoasterKin(ref){
  const r=roasterIndex().find(x=>x.ref===ref); if(!r)return;
  openSheet(`<h3 style="margin:0 0 4px">${esc(r.name)}</h3>
    <div class="muted small" style="margin:0 0 10px">${kinTally(r)}, folded from what you've logged.</div>
    ${r.recs.map(kinRow).join('')}`);
}
function openLotKin(ref){
  const r=lotIndex().find(x=>x.ref===ref); if(!r)return;
  openSheet(`<h3 style="margin:0 0 4px">${esc(r.name)}</h3>
    <div class="muted small" style="margin:0 0 10px">one green · ${kinTally(r)}, wherever it landed in your journal.</div>
    ${r.recs.map(kinRow).join('')}
    <button class="btn btn-quiet" style="margin-top:12px" onclick="closeSheet();openLotPage(${jsq(ref)})">The same green, in every hand →</button>`);
}
/* ---- The encyclopedia's node pages (VISION step 4, "the encyclopedia"): every node a page, every page
 * drilling into the next, so a green is never a dead end. These fold the SHARED spine (per-catalog) — NOT
 * one keeper's journal (openRoasterKin/openLotKin do that, per-ledger; don't conflate them). Pure catalog
 * reads: offline, keyless, no network, and walkable read-only (a stranger reads Chart No. 1 without the pen).
 * Each self-explains its grain where identity applies — a lens, never a sort; marks monochrome. ---- */
// The grower node — the producer/station behind a green, opening onto the greens traced to it. Honest about
// grain (LOT_IDENTITY): a washing station gathers cherry from many growers, so its greens are distinct lots,
// each a legitimate terminal node — never one blurred, half-filled farm. Reached from any lot page's grower link.
function openProducerPage(producerId){

// splitLot — cut a conflation into two standing greens, or restore a merge exactly. Mints a child
// (lineage.splitFrom=parent) — or REVIVES an absorbed tombstone (sel.reviveId, the exact undo of a merge:
// the tombstone's mergedFrom recorded the original boundary) — moves the named records' binds and hard-ID
// tokens to the child (a re-stamp, struck on the parent), and both greens stand with full provenance.
function splitLot(parentId,sel,who){
  if(guard())return {ok:false};
  const parent=catNode('lots',parentId);if(!parent||lotTomb(parent))return {ok:false,reason:'That green isn’t on the atlas.'};
  who=who||activeName();const at=new Date().toISOString();sel=sel||{};
  const recIds=(sel.recordIds||[]).slice();
  let child;
  if(sel.reviveId){child=catNode('lots',sel.reviveId);
    if(!child||lotTomb(child)!==parentId)return {ok:false,reason:'Nothing to restore there.'};
    delete child.lineage.mergedInto;child._key='lot:'+child.id;               // revived — a singleton key that never re-collapses
    parent.lineage.mergedFrom=(parent.lineage.mergedFrom||[]).filter(x=>x!==child.id);
    (parent.sightings||[]).forEach(s=>{if(s&&s.via==='merge'&&s.bind&&s.bind.ref===child.id&&sightStanding(s))s.supersededAt=at}); // strike the merge event
  }else{
    const seed=recIds.map(findRec).filter(Boolean)[0],o=seed?recOrigin(seed):{},p=seed?catStampProducer(o,who,at):null;
    child=catUpsert('lots','lot:'+uid(),seed?lotFields(o,p&&p.id):{},who,{at});
    child.lineage=child.lineage||{mergedFrom:[],splitFrom:null};child.lineage.splitFrom=parentId;
  }
  (sel.hardIds||[]).forEach(h=>{const n=normHardId(h.scheme,h.value)||{scheme:h.scheme,value:h.value};
    (parent.hardIds||[]).forEach(x=>{if(x.scheme===n.scheme&&x.value===n.value&&!x.withdrawnAt)x.withdrawnAt=at}); // withdrawn on the parent
    lotAddHardIds(child,[{scheme:n.scheme,value:n.value}],who,at)});                                              // carried on the child
  recIds.map(findRec).filter(Boolean).forEach(r=>{
    (parent.sightings||[]).forEach(s=>{if(s&&s.bind&&s.bind.ref===r.id&&sightStanding(s))s.supersededAt=at}); // strike its standing bind on the parent
    setRef(r,'lotRef',child);lotBind(child,r,'confirmed','split',{from:parentId},who,at);

// Undo a merge — the reverse-merge, restoring absorb from keep's tombstone exactly: the records keep merged

function lotMergeUndo(keepId,absorbId,who){

  const recIds=(keep.sightings||[]).filter(s=>s&&s.via==='merge'&&s.bind&&s.bind.kind!=='lot'&&sightStanding(s)&&s.evidence&&s.evidence.from===absorbId).map(s=>s.bind.ref);

/* ---- the processing-batch parent (RESOLVER §5, LOT_IDENTITY). Kenya's outturn splits by screen into
 * AA/AB/PB — same cherry, different physical export lots: siblings under one processing batch. The batch is
 * a synthetic lots node, role:'batch', grain:'processing-batch' (SCHEMA's lighter option, no ninth
 * document) — never browsable, carrying the BARE outturn once; each graded child carries OUTTURN/GRADE +
 * processingBatchRef → the batch. A bare-outturn record binds to the batch; when a grade surfaces it splits
 * to a graded child — without re-keying any token already entered, since lotByHardId matches exact tokens. ---- */
const outturnParts=v=>{const s=String(v||'').split('/');return {outturn:s[0]||'',grade:s.slice(1).join('/')||''}};

function ensureBatch(outturn,o,who,at){

  bat.hardIds=bat.hardIds||[]; // the bare outturn, carried ONCE on the parent (a role lot — set directly; lotAddHardIds refuses roles)
  if(!bat.hardIds.some(h=>h.scheme==='kenya-outturn'&&h.value===outturn&&!h.withdrawnAt)){
    bat.hardIds.push({id:uid(),scheme:'kenya-outturn',value:outturn,by:who||'',at:at||null});bat.updatedAt=new Date().toISOString();CAT.lots.dirty=true;saveDoc('lots')}

// The target green for a record carrying a Kenya outturn: the batch parent for a bare outturn (filling its
// blanks from the record), a graded sibling under the batch for OUTTURN/GRADE.
function resolveOutturn(rec,who,at){
  const ko=recHardIds(rec).find(h=>h.scheme==='kenya-outturn');if(!ko)return null;
  const {outturn,grade}=outturnParts(ko.value);if(!outturn)return null;
  const o=recOrigin(rec),bat=ensureBatch(outturn,o,who,at);
  if(!grade){const p=catStampProducer(o,who,at);catUpsert('lots',bat._key,lotFields(o,p&&p.id),who,{at:at||null});return bat} // bare → the batch, blanks filled

// token gains the grade (OUTTURN → OUTTURN/GRADE), it re-points from the batch to the sibling, its

 * in words rather than as a line across the sea. Two marks that read the same fold into one: a
 * region centroid drawn twice claims a precision the grain never had. ---- */
function originFrameHTML(g,opts){
  opts=opts||{};

  if(!origins.length&&!listedO.length)return '';

  const draw=oproj.length>=(opts.minMarks||1);

    ?`<div class="pin merged" style="left:${p.x}%;top:${p.y}%">${p.n}<span class="lbl">${p.members.every(m=>normPlace(m.name)===normPlace(p.name))?esc(p.name):p.n+' origins'}</span></div>`
    :`<div class="pin origin${grainCoarse(p.grain)?' coarse':''}" style="left:${p.x}%;top:${p.y}%" onclick="openProducerPage(${jsq(p.id)})"><span class="lbl">${esc(p.name)}</span></div>`).join('');

    const r=p===a?b:a;if(r.indexOf('roaster:')!==0)return;if(memberKeys.size&&!memberKeys.has(r))return;

    handLines.slice(0,3).map(h=>`${esc(h.name)} — ${h.n} hand${h.n===1?'':'s'}${chartName?` in ${esc(chartName)}`:''}.`).join(' ')}${
    handLines.length>3?` And ${handLines.length-3} more.`:''} The green travelled by sea — that road is not a line on a map.</div>`:'';
  const listedLine=listedO.length?`<div class="muted small serif" style="font-style:italic;margin:6px 2px 0">Listed, for want of a coordinate: ${listedO.slice(0,4).map(esc).join(' · ')}${listedO.length>4?` — and ${listedO.length-4} more`:''}.</div>`:'';
  if(!draw&&!handoff&&!listedLine)return '';

  <div class="muted small" style="display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin:6px 2px 0"><span><span class="atlas-key origin"></span>origin — a region or country centroid, dashed where coarse; never a farm pin invented</span></div>`:''}

function removeCup(id){
  if(guard())return;
  const c=cupById(id); if(!c)return;
  const b=bagById(c.bagId);
  const what=c.kind==='cafe'?`${c.shop||'café'} · ${c.drink||'cup'}`:bagName(b);
  if(!confirm(`Remove this cup from the ledger?\n\n${what}\n\nThis cannot be undone.`))return;
  const i=D.cups.findIndex(x=>x.id===id);
  if(i<0)return;
  D.cups.splice(i,1);
  (D.deleted=D.deleted||[]).push({id,at:new Date().toISOString()}); // tombstone: survives sync merges
  if(c.kind==='cafe'){const pid='pour:'+id,pi=(D.pours||[]).findIndex(x=>x.id===pid); // the café cup's Pour goes with it — tombstone so no device resurrects the availability edge
    if(pi>=0)D.pours.splice(pi,1);D.deleted.push({id:pid,at:new Date().toISOString()})}
  save();closeSheet();render();toast('Cup removed');
}
