function traceCard(b){
  const brews=brewsOf(b.id).slice().reverse(); // chronological
  const n=brews.length;
  const hed=brews.map(x=>{const c=D.cups.find(c=>c.brewId===x.id);return c?c.hedonic:null});
  const grinds=brews.map(x=>x.grind).filter(v=>v!=null);
  const gmin=Math.min(...grinds),gmax=Math.max(...grinds);
  const W=480,H=150,P=28;
  const X=i=>n===1?W/2:P+i*(W-2*P)/(n-1);
  const GY=v=>gmax===gmin?H/2:H-P-((v-gmin)/(gmax-gmin))*(H-2*P);
  const HY=v=>H-P-((v-1)/8)*(H-2*P);
  let path='',pts='',hpts='';
  brews.forEach((x,i)=>{ if(x.grind!=null){ path+=(path?'L':'M')+X(i).toFixed(1)+' '+GY(x.grind).toFixed(1)+' ';
    pts+=`<circle cx="${X(i).toFixed(1)}" cy="${GY(x.grind).toFixed(1)}" r="3.5" fill="var(--accent)"/>`;}
    if(hed[i]!=null) hpts+=`<circle cx="${X(i).toFixed(1)}" cy="${HY(hed[i]).toFixed(1)}" r="3" fill="none" stroke="var(--ink-2)" stroke-width="1.5"/>`;
  });
  return `<div class="card">
    <div class="row"><strong>${esc(bagName(b))}</strong><span class="n-note">n=${n}</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%">
      <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line)"/>
      ${grinds.length?`<text x="${P}" y="14" font-size="10" fill="var(--ink-3)">grind ${gmin}–${gmax}</text>`:''}
      <text x="${W-P}" y="14" font-size="10" fill="var(--ink-3)" text-anchor="end">○ hedonic 1–9</text>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>${pts}${hpts}
    </svg>
    <div class="n-note">solid — grind setting · hollow — hedonic. Comparable only within one Setup; every point carries its instrumentation.</div>
  </div>`;
}

let seasonState=null; // null → idle · 'reading' → composing · 'read' → composed

// The reading's reasons — always the keeper's own taste, named. Bands, not
// numbers, until the record can argue them (lowConf); never an invented lead.
function seasonReasons(){
  const cups=D.cups.filter(c=>c&&c.hedonic!=null);
  if(lowConf())return 'an early read — the chart ranks by the places you keep and the three you named; numbers arrive at your third cup out.';
  const agg={};
  cups.forEach(c=>{const o=lotRead(c)||{};
    [['country',o.country],['process',(o.process||'').toLowerCase()]].forEach(([kind,vRaw])=>{
      const v=(vRaw||'').trim();if(!v)return;const k=kind+':'+v.toLowerCase();
      agg[k]=agg[k]||{kind,v,n:0,s:0};agg[k].n++;agg[k].s+=c.hedonic});});
  const leads=Object.values(agg).filter(a=>a.n>=2).map(a=>({...a,avg:a.s/a.n})).sort((a,b)=>b.avg-a.avg).slice(0,2);
  const kept=(D.cups.filter(c=>c&&c.kind==='cafe'&&c.shop).length)?' and the pins fall where you already keep':'';
  if(!leads.length)return 'too few readings to name a lead — the chart ranks by what you keep, once you keep it'+kept+'.';
  return leads.map(l=>l.kind==='country'?`the ${l.v} cups you keep reaching for`:`the ${l.v} lots`).join(' and ')+' lead'+kept+'.';
}

/* ============ the pages — lot and roaster, full screens on the Atlas ============ */
/* Every café is a page (vPlace); the redesign gives the lot and the roaster the
 * same standing — a screen, not a sheet, reached from anywhere their name
 * appears. openLotPage/openRoasterPage keep their names so every existing door
 * still opens; they now set the page and render. */
/* The pages walk into each other — a plate opens a green, a green opens its roaster — so back
 * means the page you came from, not the top of the room. One shallow stack, cleared whenever a
 * room is chosen from the bar; a page never pushes itself twice. */
function pagePush(){
  const cur=curateOn?{kind:'curate',id:''}:placeView?{kind:'place',id:placeView}:pageView;
  if(!cur)return;
  const top=pageStack[pageStack.length-1];
  if(top&&top.kind===cur.kind&&top.id===cur.id)return;
  pageStack.push(cur);if(pageStack.length>8)pageStack.shift();
}
const PAGE_BACK={lot:'The green',roaster:'The roaster',plate:'The plate',curate:'The chart',place:'The bar'};
function pageBack(){
  const prev=pageStack.pop();
  if(!prev)return go('atlas');
  placeView=null;pageView=null;curateOn=false;
  if(prev.kind==='curate')curateOn=true;
  else if(prev.kind==='place')placeView=prev.id;
  else pageView=prev.fk?prev:{kind:prev.kind,id:prev.id};
  render();
}
function openLotPage(lotId){
  let lot=catNode('lots',lotId); if(!lot){toast('That green isn’t on the atlas yet');return}
  if(lotTomb(lot)){lotId=lotFwd(lotId);lot=catNode('lots',lotId)} // a link onto an absorbed green reads through
  if(lot&&lot.role==='batch')return openBatchPage(lotId); // the processing-batch parent keeps its own sheet
  pagePush();closeSheet();pageView={kind:'lot',id:lotId};placeView=null;curateOn=false;discOn=false;doorOn=false;render();
}
function openRoasterPage(roasterRef){
  const r=catNode('roasters',roasterRef); if(!r){toast('That roaster isn’t on the atlas yet');return}
  pagePush();closeSheet();pageView={kind:'roaster',id:roasterRef};placeView=null;curateOn=false;discOn=false;doorOn=false;render();
}
function closePage(){pageView=null;pageStack=[];render()}
/* every page opens the same way (STREAMLINED.html): a back that names where it

const pageHero=(eyebrow,title,origin)=>`

// own readings for one lot — home cups ride in through their bag, café cups carry the ref themselves
function lotOwnCups(lotId,roasterRef){
  const bagIds=new Set(D.bags.filter(b=>b&&b.lotRef&&lotFwd(b.lotRef)===lotId&&(!roasterRef||b.roasterRef===roasterRef)).map(b=>b.id));
  return D.cups.filter(c=>c&&((c.kind==='home'&&bagIds.has(c.bagId))
    ||(c.kind==='cafe'&&c.lotRef&&lotFwd(c.lotRef)===lotId&&(!roasterRef||c.roasterRef===roasterRef))));
}
/* ---- the road, as one component (SURFACES.md §2): six stations — grown → processed →
 * milled → roasted → poured → read — derived from the graph, never stored. A filled mark
 * is a station the record holds; a hollow one is the record stating what it has not been
 * told. The gap is the product. One component, every scope: the lot page, the plate's
 * aggregate, Today's coffee-in-hand. ---- */
function lotRoadStations(lotId){
  const lot=catNode('lots',lotId);if(!lot)return null;
  const fp=lot.fingerprint||{};
  const growers=(lot.producerRefs||[]).map(id=>catNode('producers',id)).filter(Boolean);
  const procs=(lot.processorRefs||[]).map(id=>catNode('processors',id)).filter(Boolean);
  const hands=[...new Set(CAT.roasts.entries.filter(r=>r&&r.lotRef===lotId&&r.roasterRef).map(r=>r.roasterRef))];
  const shops=[...new Set((D.pours||[]).filter(p=>p&&p.lotRef&&lotFwd(p.lotRef)===lotId&&regSubstance(p.shop)).map(p=>p.shop))];
  const bat=lot.processingBatchRef&&catNode('lots',lot.processingBatchRef);
  const ko=(lot.hardIds||[]).find(h=>h.scheme==='kenya-outturn'&&!h.withdrawnAt)||(bat&&(bat.hardIds||[]).find(h=>h.scheme==='kenya-outturn'&&!h.withdrawnAt));
  const cups=lotOwnCups(lotId).length;
  // the road is a glance, six cells wide on a phone — it says the finest thing it holds and no
  // more. The page states the rest in full a line below; a name broken over three lines says less.
  const originWhere=[fp.region,fp.country].filter(regSubstance)[0]||'';
  // a station is a processor, never a grower — a producer entry the door tagged as one (or that
  // matches a standing processor node) reads at Processed, and Grown falls back to the region
  const stnKeys=new Set(procs.map(p=>normPlace(p.name)));
  const trueGrowers=growers.filter(g=>g.producerKind!=='station'&&!stnKeys.has(normPlace(g.name)));
  const flatGrower=regSubstance(fp.producer)&&!stnKeys.has(normPlace(fp.producer))?fp.producer:'';
  return [
    {lb:'Grown',who:trueGrowers.length?(trueGrowers.length>1?trueGrowers.length+' growers':trueGrowers[0].name):(flatGrower||originWhere)},
    {lb:'Processed',who:procs.length?procs[0].name:(fp.process&&fp.process.family&&fp.process.family!=='unspecified'?sentence(fp.process.family):'')},
    {lb:'Milled',who:bat?('dry mill'+(ko?' · '+ko.value:'')):''},
    {lb:'Roasted',who:hands.length?(hands.length>1?hands.length+' hands':roasterName(hands[0])):''},
    {lb:'Poured',who:shops.length?(shops.length>1?shops.length+' bars':shops[0]):''},
    {lb:'Read',who:cups?(cups+(cups===1?' cup':' cups')):'',you:true}
  ];
}
function road6HTML(stations,draw){
  if(!stations)return'';
  let prev=true;
  const cells=stations.map(s=>{const held=regSubstance(s.who);
    const cls='stn'+(held?' held':'')+(s.you&&held?' you':'')+((!held||!prev)?' gap':'');
    prev=held;
    return `<div class="${cls}"><span class="bar"></span><span class="mk"></span><span class="lb">${esc(s.lb)}</span><span class="who"${held?` title="${esc(s.who)}"`:''}>${held?esc(s.who):'unread'}</span></div>`}).join('');
  return `<div class="road6${draw&&!reducedMotion()?' draw':''}">${cells}</div>`;
}
// the aggregate road — count(lots where the station edge exists) / count(lots), per station.
// The reading a single green can't give: where a whole facet's road goes dark.
function aggRoadHTML(lotIds){
  const alls=lotIds.map(lotRoadStations).filter(Boolean);
  const n=alls.length;if(!n)return'';
  return `<div class="agg">${alls[0].map((s0,i)=>{const c=alls.filter(s=>regSubstance(s[i].who)).length;
    return `<div class="aggrow${c/n<.5?' thin':''}"><span class="lb">${esc(s0.lb)}</span><span class="track"><span class="fill" style="width:${Math.round(c/n*100)}%"></span></span><span class="ct">${c}/${n}</span></div>`}).join('')}</div>`;
}
/* ---- the terrace (SURFACES §2's reading, second projection). The atlas has always drawn one
 * kind of picture: a plan. A plan answers WHERE, and it is the right drawing for a scene, a
 * region, a front door. It cannot answer how high, because height is not a position on the
 * ground — and height is the one origin fact continuous enough to put two greens on a single
 * scale without inventing anything to get them there.
 *
 * So: a section. Same laws as every other reading here. It PLACES, it never ranks — nothing
 * sorts by height, no facet cuts by it, and the comparison never travels without its denominator
 * or its unread count. And it is never a map: a height is not a coordinate, and no mark drawn
 * here has any business becoming a pin. ---- */
function terrScale(bands){
  let lo=Math.min(...bands.map(b=>b[0])),hi=Math.max(...bands.map(b=>b[1]));
  const step=(hi-lo)>1400?400:200;
  lo=Math.floor(lo/step)*step-step;hi=Math.ceil(hi/step)*step+step;
  if(hi-lo<600){const m=(hi+lo)/2;lo=Math.floor((m-300)/step)*step;hi=Math.ceil((m+300)/step)*step} // one green must not fill the frame and imply a range it never stated
  lo=Math.max(0,lo);hi=Math.min(ALT_HI,hi);
  return {lo,hi,step,pc:v=>(v-lo)/(hi-lo)*100};
}
// band: the subject, drawn as a zone. inner: each green inside an aggregate span. others: the
// comparison set, hairline. Every one of them keeps its own geometry — a point stays a point.
function terraceHTML(o){
  o=o||{};
  const band=altValid(o.band)?o.band:null;
  const inner=(o.inner||[]).filter(altValid),others=(o.others||[]).filter(altValid);
  if(!band)return '';
  const sc=terrScale([band,...inner,...others]);
  const at=b=>`bottom:${sc.pc(b[0]).toFixed(2)}%;height:${(sc.pc(b[1])-sc.pc(b[0])).toFixed(2)}%`;
  const pt=b=>b[0]===b[1]?' pt':'';
  let rules='';
  for(let v=Math.ceil(sc.lo/sc.step)*sc.step;v<=sc.hi;v+=sc.step)
    rules+=`<i class="ct" style="bottom:${sc.pc(v).toFixed(2)}%"><span>${altComma(v)}</span></i>`;
  // the subject's zone is an opaque surface, so the comparison marks are laid over it, never
  // under — a green whose height falls inside this band must still be visible in it
  return `<div class="terr${o.draw&&!reducedMotion()?' draw':''}"><div class="plot">${rules}
    <i class="m1${pt(band)}" style="${at(band)}">${o.label?`<b class="val">${esc(altLabel(band))}</b>`:''}</i>
    ${inner.map(b=>`<i class="m2${pt(b)}" style="${at(b)}"></i>`).join('')}
    ${others.map(b=>`<i class="m0${pt(b)}" style="${at(b)}"></i>`).join('')}
  </div></div>`;
}
// The only honest way to compare two RANGES: wholly below, wholly above, or overlapping. No
// midpoint stands in for a band, nothing is ordered, and the denominator travels with the reading.
function altReading(band,others){
  if(!others.length)return 'The only green on the atlas that states a height.';
  const lower=others.filter(b=>b[1]<band[0]).length,higher=others.filter(b=>b[0]>band[1]).length;
  const over=others.length-lower-higher,one=band[0]===band[1];
  const spans=n=>one?`${n} span${n===1?'s':''} it`:`${n} overlap${n===1?'s':''} this band`;
  if(others.length===1)return 'The one other green that states a height '+(lower?'grew lower.':higher?'grew higher.':one?'spans this height.':'overlaps this band.');
  const parts=[lower&&`${lower} grew lower`,higher&&`${higher} higher`,over&&spans(over)].filter(Boolean);
  return `Of the ${others.length} other greens that state one — ${parts.join(', ')}.`;
}
// the same reading at set scope: the facet's own span, with each green's band drawn inside it.
// Fewer than two states a height and there is no spread to read — the green's own page says it better.
function aggTerraceHTML(lotIds,heading,tail){
  const bands=lotIds.map(id=>altOf(catNode('lots',id))).filter(Boolean);
  if(bands.length<2)return '';
  const span=[Math.min(...bands.map(b=>b[0])),Math.max(...bands.map(b=>b[1]))];
  const unread=lotIds.length-bands.length;
  return `<div class="section-head" style="margin-top:16px"><h2>${esc(heading)}</h2><button class="text-action ex" onclick="openPrimer('altitude')">the height</button></div>
  ${terraceHTML({band:span,inner:bands,label:true})}
  <div class="muted small serif" style="font-style:italic;margin:10px 2px 0">${esc(altLabel(span))} across ${bands.length} greens that state a height${tail?', '+tail:''}.${unread?` ${unread===1?'One more says':unread+' more say'} nothing about it — counted, never dropped.`:''} Placed, never ranked.</div>`;
}

/* ============ the plate — one facet of the atlas, read as a page (SURFACES.md §2) ============ */
/* A facet is a QUERY over lots, never a stored collection — country, process family,
 * variety, over the fields the lot already carries and the resolver already normalised.
 * The page is the same three-part reading a single green gets, aggregated: the road
 * counted across every green in the facet, the greens, the hands. One law (CHARTS.md):
 * a facet must never silently hide unread — a green that doesn't state the field is
 * counted out loud, never quietly dropped. */
const FACET_LBL={country:'a country',process:'a process',variety:'a variety'};
function facetVal(lot,fk){const fp=lot.fingerprint||{};
  return fk==='country'?fp.country:fk==='process'?((fp.process&&fp.process.family&&fp.process.family!=='unspecified')?fp.process.family:''):lot.variety}

function plateFacets(){
  const lots=atlasLots();
  const tally=fk=>{const m=new Map();lots.forEach(x=>{const v=facetVal(x.lot,fk);if(!regSubstance(v))return;
    const k=normPlace(v);const e=m.get(k)||{fk,v,n:0,ids:[]};e.n++;e.ids.push(x.id);m.set(k,e)});

  return [...tally('country').slice(0,4),...tally('process').slice(0,3),...tally('variety').slice(0,3)]
    .map(f=>{const h=new Set();f.ids.forEach(id=>CAT.roasts.entries.forEach(r=>{if(r&&r.lotRef===id&&r.roasterRef)h.add(r.roasterRef)}));
      return {...f,hands:h.size}});
}

/* ============ Act III — the signed page: the claim ceremony + the pen ============ */
/* Signing buys three things and no more: the first-party rung, a monochrome
 * mark, and the right to correct your own facts. The claim is itself a signed

 * stays the reader's after. Storage rides the machinery that already syncs:
 * the Register entry for a bar, the roaster's catalog node for a roaster. */
function claimEnt(entity,key){return entity==='cafe'?regByName(key):catNode('roasters',key)}

  e.updatedAt=new Date().toISOString();

}
// the in-scope rows a signed page may correct — live facts first, corrections over them
function penRows(entity,key){

    const onBar=[...new Set((D.pours||[]).filter(p=>p&&normName(p.shop)===normName(key)).sort((a,b)=>String(b.at||'').localeCompare(String(a.at||''))).map(p=>{const l=catNode('lots',lotFwd(p.lotRef));return l?lotLabel(l):null}).filter(Boolean))].slice(0,2);
    rows=[{field:'pour',k:'On the bar',v:onBar.join(' · ')||'—'},
      {field:'hours',k:'Hours',v:e.hours||'—'},
      {field:'pin',k:'The pin',v:[e.neighborhood,e.city].filter(Boolean).join(' · ')||'—'}];
  }else{
    const r=catNode('roasters',key)||{};
    const latest=CAT.roasts.entries.filter(x=>x&&x.roasterRef===key&&x.roastDate).sort((a,b)=>(b.roastDate||'').localeCompare(a.roastDate||''))[0];
    rows=[latest&&{field:'roast',k:'Roast date · '+(latest.offeringName||'latest'),v:fmtMDY(latest.roastDate)},
      {field:'door',k:'Where to buy',v:r.site||r.city||'—'},
      {field:'city',k:'City',v:r.city||'—'}].filter(Boolean);
  }
  return rows.map(row=>{const c=facts[row.field];

let penEditing=null,penDraft='';

/* ============ propose a sighting — add to the atlas, ask before it binds ============ */
/* A bag on a shelf, a roast on a bar — entered as a sighting, run through the
 * same ladder a bag's origin runs: a shared printed code binds outright, a
 * fingerprint match asks, a same-name-different-process refuses to merge, and
 * nothing like it files as a new lot whose road begins. The record of the
 * sighting is an authored line (no cup, no bag), swept and merged like any. */
function openProposeSighting(){
  if(penGuard())return;
  openSheet(`
  <h3>What did you see?</h3>
  <div class="sub">A bag on a shelf, a roast on a bar. CARTA looks for it on the chart and asks before it binds.</div>
  <label class="f"><span class="l">The coffee, as the bag says it</span>
    <input type="text" id="ps_name" placeholder="name, as printed"></label>
  <label class="f"><span class="l">Origin, as printed</span>
    <input type="text" id="ps_origin" placeholder="region, country"></label>
  <label class="f"><span class="l">Process</span>
    <input type="text" id="ps_process" placeholder="washed · natural · honey…"></label>
  <label class="f"><span class="l">The bag’s own id, if it carries one <span class="opt">an outturn, an auction lot</span></span>
    <input type="text" id="ps_id" placeholder="e.g. outturn 25/0141"></label>
  <button class="btn btn-graphite" style="margin-top:6px" onclick="proposeLook()">Look for it on the chart</button>
  <div class="muted small serif" style="font-style:italic;margin-top:10px">Identity is <button class="text-action ex" style="padding:0;font-size:12px;vertical-align:baseline" onclick="openPrimer('fingerprint')">a fingerprint</button>, not a key — a cluster of facts, matched and confirmed. <button class="text-action ex" style="padding:0;font-size:12px;vertical-align:baseline" onclick="openPrimer('propose')">How proposing works</button>.</div>
  <button class="btn btn-quiet" style="margin-top:12px" onclick="closeSheet()">Not now</button>`);
}
const psNormTok=v=>(v||'').toString().toLowerCase().replace(/[^0-9a-z\/]/g,'');
function proposeLook(){
  if(guard())return;
  const name=val('ps_name'),originText=val('ps_origin'),process=val('ps_process'),idText=val('ps_id');
  if(!name&&!originText&&!idText){toast('Give it a name or an origin — something the chart can look for');return}
  const parts=originText.split(',').map(s=>s.trim()).filter(Boolean);
  const s={name,originText,originRegion:parts.length>1?parts[0]:'',originCountry:parts.length>1?parts[parts.length-1]:(parts[0]||''),process,id:idText};
  // rung one — a shared printed code binds outright
  const tok=psNormTok(idText);
  let m=null;
  if(tok){
    for(const L of CAT.lots.entries){
      if(!lotLive(L))continue;
      const hit=(L.hardIds||[]).some(h=>h&&!h.withdrawnAt&&tok.includes(psNormTok(h.value)));
      if(hit){m={kind:'hardid',lot:L,shared:[{k:'Shared id',v:idText}]};break}
    }
  }
  // the fingerprint — the scorer the resolver already trusts; a cluster of
  // matching facts outranks a bare name twin
  if(!m){
    // the printed name doubles as the producer/station column for the match —
    // that is what "as the bag says it" names; the scorer weighs the cluster
    const rec={id:'sighting',name,originCountry:s.originCountry,originRegion:s.originRegion,producer:name,variety:'',process,lot:''};
    let best=null,bs=0;
    CAT.lots.entries.forEach(L=>{if(!lotLive(L))return;
      const fam=(L.fingerprint||{}).process&&L.fingerprint.process.family;
      if(process&&fam&&fam!=='unspecified'&&fam.toLowerCase()!==process.toLowerCase())return; // a process conflict never fingerprints — the guard reads it
      const sc=scoreLot(rec,L);if(sc.score>bs){bs=sc.score;best={kind:'fingerprint',lot:L,score:sc.score,shared:(sc.fields||[]).map(f=>({k:f,v:''}))}}});
    if(best&&bs>=TAU_PROP)m=best;
  }
  // the name-cluster — the printed name reads like a lot already on the chart,
  // its process compatible and its geography agreeing. Still a question, never
  // a bind: propose-and-confirm asks. A name alone never qualifies.
  if(!m&&name&&name.trim().length>=3){
    const nn=name.trim().toLowerCase();
    const reg=(s.originRegion||'').toLowerCase(),ctry=(s.originCountry||'').toLowerCase();
    for(const L of CAT.lots.entries){
      if(!lotLive(L))continue;
      const fp=L.fingerprint||{};const fam=fp.process&&fp.process.family;
      if(process&&fam&&fam!=='unspecified'&&fam.toLowerCase()!==process.toLowerCase())continue;
      if(!lotLabel(L).toLowerCase().includes(nn))continue;
      const shared=[{k:'Name',v:''}];let geo=false;
      if(reg&&(fp.region||'').toLowerCase().includes(reg)){shared.push({k:'Region',v:fp.region});geo=true}
      if(ctry&&(fp.country||'').toLowerCase()===ctry){shared.push({k:'Country',v:fp.country});geo=true}
      if(process&&fam&&fam.toLowerCase()===(process||'').toLowerCase())shared.push({k:'Process',v:fam});
      if(!geo)continue;
      m={kind:'fingerprint',lot:L,shared};break;
    }
  }
  // the guard — a shared name with a different process never merges on the string
  if(!m&&name&&process){
    const nn=name.toLowerCase();
    for(const L of CAT.lots.entries){
      if(!lotLive(L))continue;
      const fp=L.fingerprint||{};const fam=fp.process&&fp.process.family;
      const prod=(fp.producer||'').toLowerCase();
      const nameHit=nn.length>=3&&(lotLabel(L).toLowerCase().includes(nn)||(prod.length>=3&&nn.includes(prod)));
      if(nameHit&&fam&&fam!=='unspecified'&&fam.toLowerCase()!==process.toLowerCase()){
        m={kind:'guard',lot:L,shared:[{k:'Name',v:lotLabel(L)}],diverge:{k:'Process',was:fam,now:process}};break}
    }
  }
  if(!m)m={kind:'none',shared:[]};
  openProposeConfirm(s,m);
}
function openProposeConfirm(s,m){
  const L=m.lot;
  const saw=`
  <div style="font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px">You saw</div>
  <div class="card" style="margin:0 0 10px">
    <div class="kv" style="border:none;padding:2px 0"><span class="k">Coffee</span><span class="v">${esc(s.name||'—')}</span></div>
    <div class="kv" style="border:none;padding:2px 0"><span class="k">Origin</span><span class="v">${esc(s.originText||'—')}</span></div>
    ${s.process?`<div class="kv" style="border:none;padding:2px 0"><span class="k">Process</span><span class="v">${esc(s.process)}</span></div>`:''}
    ${s.id?`<div class="kv" style="border:none;padding:2px 0"><span class="k">Bag id</span><span class="v">${esc(s.id)}</span></div>`:''}
  </div>`;
  const onChart=L?`
  <div style="font-family:var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:12px 0 6px">On the chart</div>
  <div class="card" style="margin:0 0 12px">
    <div class="row"><strong>${esc(lotLabel(L))}</strong>${grainRead(L.grain)?exBtn(grainPrimerKey(L.grain),grainRead(L.grain)[0].toLowerCase()):''}</div>
    <div class="muted" style="margin-top:3px">${esc([(L.fingerprint||{}).region,(L.fingerprint||{}).country].filter(regSubstance).join(', '))}</div>
    ${(m.shared||[]).filter(x=>x.k).length?`<div style="display:flex;gap:6px;margin-top:9px;flex-wrap:wrap">${m.shared.map(x=>`<span class="chip">${esc(x.v?x.k+' · '+x.v:x.k)}</span>`).join('')}</div>`:''}
  </div>`:'';
  const sArg=jsq(JSON.stringify(s));
  let over,claim,body,primary,primaryCall,secondary,secondaryCall,diverge='';
  if(m.kind==='hardid'){
    over='The same lot';claim='The same green, outright.';
    body='A printed code is sewn into the bag. This bag and the '+lotLabel(L)+' already on the chart carry one identifier — two records naming this code are the same green.';
    primary='Bind to '+lotLabel(L);primaryCall=`proposeBind(${sArg},${jsq(L.id)})`;
    secondary='Not the same — file as new';secondaryCall=`proposeFork(${sArg})`;
  }else if(m.kind==='fingerprint'){
    over='The same lot?';claim='This looks like '+lotLabel(L)+'. The same lot?';
    body='No shared id on the bag, so this is a match on facts, not a key'+((m.shared||[]).length?' — '+m.shared.map(x=>x.k).join(', ')+' line up':'')+'. Confirm and the sighting joins its road. Reject and it files as its own, coarser record.';
    primary='Confirm — the same lot';primaryCall=`proposeBind(${sArg},${jsq(L.id)})`;
    secondary='Not the same — file as new';secondaryCall=`proposeFork(${sArg})`;
  }else if(m.kind==='guard'){
    over='Not the same lot';claim='Same name is not the same lot.';
    body='This shares a name on the chart, but the process differs. A rebranded split, a rotating house name, a neighbouring parcel — same string, different coffee. CARTA won’t merge on a name alone.';
    diverge=`<div class="cafeback" style="margin:0 0 16px"><strong>The tell —</strong> process: ${esc(m.diverge.was)} on the chart, ${esc(m.diverge.now)} on this bag.</div>`;
    primary='File as a new lot';primaryCall=`proposeFork(${sArg})`;
    secondary='Actually the same — bind anyway';secondaryCall=`proposeBind(${sArg},${jsq(L.id)},true)`;
  }else{
    over='New to the chart';claim='Nothing like it on the chart yet.';
    body='No shared id, no fingerprint overlap. This files as a new lot and its road begins — a proposal that stands once a keeper approves it. Unread until it is read.';
    primary='File as a new lot';primaryCall=`proposeFork(${sArg})`;
    secondary='';secondaryCall='';
  }
  openSheet(`
  <div style="font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:${m.kind==='guard'?'var(--danger)':'var(--ink-3)'};font-weight:500;margin-bottom:7px">${esc(over)}</div>
  <h3>${esc(claim)}</h3>
  ${saw}${onChart}
  <p class="primer-b" style="max-width:39ch;margin-bottom:14px">${esc(body)}</p>
  ${diverge}
  <button class="btn btn-primary" onclick="${primaryCall}">${esc(primary)}</button>
  ${secondary?`<button class="btn btn-quiet" style="margin-top:8px" onclick="${secondaryCall}">${esc(secondary)}</button>`:''}
  <button class="text-action" style="display:block;margin:14px auto 2px" onclick="openProposeSighting()">Correct a fact</button>`);
}
// The authored line a sighting becomes — no bag, no cup; swept like any record.
function proposeRec(s){
  const rec={id:uid(),createdAt:new Date().toISOString(),sighting:true,curator:activeName(),
    roaster:'',name:s.name||'',originCountry:s.originCountry||'',originRegion:s.originRegion||'',
    producer:'',variety:'',process:s.process||'',lot:'',hardIds:[],origin:s.originText||''};
  const tok=(s.id||'').replace(/^\s*outturn\s*/i,'').trim();
  if(/^\d{2}\/\d{3,5}$/.test(tok))rec.hardIds=[{scheme:'kenya-outturn',value:tok}];
  D.authored=D.authored||[];D.authored.push(rec);
  return rec;
}
function proposeBind(sJson,lotId,onWord){
  if(guard())return;
  let s;try{s=JSON.parse(sJson)}catch(e){return}
  const cand=catNode('lots',lotId);if(!cand){closeSheet();toast('Gone.');return}
  const rec=proposeRec(s);
  bindRecordTo(rec,cand);
  save();closeSheet();
  toast(onWord?'Bound on your word. The correction is a signed line — a later one can supersede it.':'Bound to '+lotLabel(cand)+'. The sighting joins its road.');
  openLotPage(cand.id);
}
function proposeFork(sJson){
  if(guard())return;
  let s;try{s=JSON.parse(sJson)}catch(e){return}
  const rec=proposeRec(s);
  const o=recOrigin(rec),p=catStampProducer(o,activeName(),rec.createdAt);
  const n=catUpsert('lots','lot:'+rec.id,lotFields(o,p&&p.id),activeName(),{at:rec.createdAt});
  if(rec.hardIds.length&&typeof lotAddHardIds==='function')lotAddHardIds(n,rec.hardIds,activeName());
  setRef(rec,'lotRef',n);
  save();closeSheet();
  toast('Filed as a new lot. The road begins — unread until read.');
  openLotPage(n.id);
}

/* ============ sheet plumbing ============ */
function openSheet(html){const s=document.getElementById('sheet');

  s.classList.add('open');document.getElementById('sheetbg').classList.add('open');
  s.scrollTop=0;}
function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('sheetbg').classList.remove('open');stopTimer(false)}

/* ============ the primers — how to read the record ============ */
/* Every mark explains itself one tap away. One map, term → {t,b}; the primer
 * sheet is its own layer so it stacks above any open sheet and closes back to
 * it. Add a term here and every ex(...) tap of it is wired for free. */
const PR={
  resolution:{t:'Station-season',b:'How finely a coffee’s origin is proven. Station-season means the trail proves to the washing station and the harvest — many growers’ cherry, honestly indistinguishable past the wet mill. A finer claim would be invented. The grain is stated, never rounded up.'},
  greenlot:{t:'Green-lot',b:'Proven to the exact green lot — one harvest, one parcel, one identity the trade bought and sold it under. The finest grain the ladder reaches.'},
  region:{t:'Region',b:'The trail proves only to a region and a country — the coarsest honest grain. Not a gap in the record; the record refusing to invent what the bag never carried.'},
  caliber:{t:'Caliber',b:'A cup score never travels bare. A score enters the standing only through its source — a competition, an estate auction, a named cupper or lab. An unnamed number is on file as a claim, unverified, and it never prints as the score.'},
  standing:{t:'The standing',b:'What the coffee is in the world — caliber, rarity, traceability — compiled from sourced facts, never picked. It is not whether you’ll love it. That stays yours, on the overlay.'},
  altitude:{t:'The height it grew at',b:'Metres above sea level, as the record was told them. Height is a growing condition — slower cherry, denser bean — never a grade: the trade’s shorthand that higher is better is a shorthand, and this record does not repeat it. Nothing here sorts by it. A stated range draws as a band and a single figure as one line, because a lot sold as 1,800–1,900 m never said 1,850. It is the one origin fact continuous enough to read two greens on the same scale, which is why it earns a drawing — a section, beside the map’s plan. It is never part of a coffee’s identity, and never a pin: a height is not a place.'},
  rarity:{t:'Rarity',b:'How much of it exists — bags landed, an auction price, a scarce variety, how narrowly it is carried. Scarcity stated as a fact, never as a countdown.'},
  outturn:{t:'The outturn',b:'Kenya sews an identifier into the bag: one cherry delivery, milled and graded into sibling lots — AA, AB, PB — under one outturn. Two records naming this code are the same green, outright.'},
  hands:{t:'One green, many hands',b:'The same green lot, bought by more than one roaster — each a different reading of one coffee. The page nothing else can render.'},
  shape:{t:'The shape of a preference',b:'Averages of your own 1–9 readings, split by where the cup was made — home against out, origin against origin. Enough readings and a through-line appears. It describes what you keep reaching for; it never tells you what to order.'},
  overlay:{t:'Your overlay',b:'The atlas is everyone’s: one shared page per coffee, compiled from sourced facts. Your scores, brews, and one honest line sit on top as a private wash — visible only to you, never averaged into the page. The spine stands without you.'},
  unread:{t:'Unread',b:'No admissible score exists yet, so no number prints. Unread is a state, never a verdict — and never a default to the low end. The row is the door to reading it.'},
  hedonic:{t:'The 1–9 reading',b:'A hedonic scale — how much you liked the cup, in front of you, at this moment. Nine is not perfection and one is not failure; it is preference, not grading. It never travels as a coffee’s caliber, and it is never averaged into the shared page. It is the truest thing you can keep, because it is only yours.'},
  fingerprint:{t:'Fingerprint',b:'Most bags carry no shared id, so identity is matched on a cluster of facts — producer or station, country and region, harvest, variety, process — never one field alone. CARTA finds the overlap and asks; it never merges on a name by itself. The cluster is the identity; you confirm it.'},
  propose:{t:'Propose and confirm',b:'The spine is curated, so a new sighting enters as a proposal. CARTA compiles a candidate from sourced facts and asks before it binds — confirm joins the existing road, reject forks a new one. The machine proposes; the keeper decides, and every binding is a signed line a later one can supersede.'},
  unclaimed:{t:'Unclaimed',b:'No one has signed this page yet. It stands anyway — compiled from sightings, true without permission. Unclaimed is a door, not a doubt: the record describes you before you arrive, and waits with the pen.'},
  signed:{t:'The signed page',b:'A page claimed by the hand it describes — a roaster on its own roast, a bar on its own pour. Signing buys three things and no more: the first-party rung, a monochrome mark, and the right to correct your own facts. It never touches the reader’s overlay, and the page was true before it was signed.'},
  firstparty:{t:'First-party',b:'The rung a signed page writes inside its own link — the strongest word on the facts that are truly yours. Scoped, never sovereign: outside your link your word is only stated, exactly like anyone’s. It is what keeps a signature from becoming a megaphone.'},
  scoped:{t:'Scoped authority',b:'Authority ends where your link does. The roaster owns the roast, never the farm; the bar owns the pour, never the road. The road is compiled from many hands and owned by none — which is the only way it stays true.'},
  documented:{t:'Documented',b:'A line carrying a public instrument — an outturn certificate, a co-op registry, an export licence, checkable by any reader. It outranks every rung, including the page’s own signer: a first party can supply a document, never outvote one.'},
  openschema:{t:'Open schema',b:'The export is one self-contained file — it opens and reads in full on a device that never synced, and carries its record in a documented layout any reader can open or move. No lock-in: the record is yours to keep and to leave with. It writes out your overlay — your readings, your brews, your cups — never the shared page’s compiled numbers, and never a figure without the protocol that earned it.'},
  divergence:{t:'Carried, not resolved',b:'Two standing lines can disagree — a roaster’s altitude against the station’s documented record. CARTA prints the stronger rung and keeps the other one tap deep, attributed. Flattening the trade’s disagreements would be a quiet lie; the record would rather show its seams.'},
  readback:{t:'The record, returned',b:'A record leaves as one file and returns whole — read back on any device, offline, no account required. What returns is the reader’s own overlay: readings, shelf, cups. It is read to you, never merged — never averaged into the shared page, which stood without it and stands after. What can be written out can be read back: the proof the schema is open, and the record truly yours.'},
  interlude:{t:'Reading the season',b:'Ask, and the atlas composes the season in front of you — the pins settle and a line is drawn through them, once, over about a second. It is a reading being composed, not a screen loading, and never a score revealed; the ember stays reserved. What it ranks is only ever your own taste — the coffees you keep reaching for, the places you keep — and it shows its reasons. Ask again and it composes again; it never plays on its own.'},
  setup:{t:'The Setup',b:'Grinder, brewer, and the scale your grind is read on. A grind number means one thing on your grinder and nothing on another — so grind lives inside a Setup and never travels between them. Name the Setup once and the dial is read against it, and only against it. The bag names the coffee; your own zero names the grind.'},
  door:{t:'The door',b:'One paste field, where six forms stood. Paste the roaster’s page or the back of the bag and CARTA reads it here, on the device — no key, no account, no network — against the same vocabularies the resolver already uses. You strike anything wrong, then bind it with one tap. Nothing is written before the bind, and a struck fact keeps its ink.'},
  road:{t:'The road',b:'Six stations — grown, processed, milled, roasted, poured, read. A filled mark is a station the record holds; a hollow one is a station it has not been told about, and the connector across a gap is dashed. The gap is the product: it is the record stating what it does not know, never a blank to fill.'},

/* ============ sheet drag-to-dismiss ============ *
 * The grab handle (and the sheet body when scrolled to the top) can be pulled
 * down to dismiss. Follow the finger; on release, snap closed if dragged far
 * enough or flicked quickly, otherwise snap back. Tapping the backdrop still
 * works too — this just makes the handle behave like a real handle.          */
(function initSheetDrag(){
  const sheet=document.getElementById('sheet');
  const bg=document.getElementById('sheetbg');
  let startY=0,dy=0,active=false,dragging=false,startT=0;
  const yOf=e=>e.touches?e.touches[0].clientY:e.clientY;
  const onGrab=e=>!!(e.target.closest&&e.target.closest('.grab'));

  function down(e){
    if(!sheet.classList.contains('open'))return;
    // Only begin a dismiss-drag from the handle, or from the body when the
    // sheet is already scrolled to the top — otherwise let content scroll.
    if(!onGrab(e)&&sheet.scrollTop>0)return;
    active=true;dragging=false;dy=0;startY=yOf(e);startT=Date.now();
  }
  function move(e){
    if(!active)return;
    dy=yOf(e)-startY;
    if(dy<=0){ // pulling up: hand control back to native scroll
      if(dragging){sheet.classList.remove('dragging');sheet.style.transform='';bg.style.opacity='';}
      dragging=false;dy=0;return;
    }
    dragging=true;
    sheet.classList.add('dragging');
    if(e.cancelable)e.preventDefault(); // suppress native scroll while pulling down
    sheet.style.transform=`translateX(-50%) translateY(${dy}px)`;
    bg.style.opacity=String(Math.max(0,1-dy/(sheet.offsetHeight||600)));
  }
  function up(){
    if(!active)return;
    active=false;
    const h=sheet.offsetHeight||600;
    const velocity=dy/Math.max(1,Date.now()-startT); // px per ms
    sheet.classList.remove('dragging'); // restore the snap transition
    if(dragging&&(dy>h*0.28||velocity>0.55)){
      sheet.style.transform='translateX(-50%) translateY(100%)';
      bg.style.opacity='';
      setTimeout(()=>{closeSheet();sheet.style.transform='';bg.style.opacity='';},300);
    }else{
      sheet.style.transform='';
      bg.style.opacity='';
    }
    dragging=false;dy=0;
  }

  sheet.addEventListener('touchstart',down,{passive:true});
  sheet.addEventListener('touchmove',move,{passive:false});
  sheet.addEventListener('touchend',up);
  sheet.addEventListener('touchcancel',up);
  sheet.addEventListener('mousedown',down);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
})();

/* ============ dial component ============
 * A stepper you can drive three ways, so a wide range is never a wall of taps:
 *   · tap − / +           one step (fine)
 *   · press-and-hold      auto-repeats and accelerates — fly across 0–2000
 *   · tap the number      type an exact value (numeric keypad; m:ss for time)
 * opts: {kind:'time'} m:ss entry · {hint} scale caption top-right ·
 *       {corner} a control pinned top-right (the °C/°F toggle). */
const dialState={};
let editingDial=null,holdInt=null,holdTO=null;
function dial(id,label,unit,value,step,min,max,dp,opts){
  opts=opts||{};
  dialState[id]={v:value,step,min,max,dp:dp??(String(step).includes('.')?1:0),unit,kind:opts.kind||null};
  const corner=opts.corner?`<div class="dcorner">${opts.corner}</div>`:(opts.hint?`<div class="ticks">${opts.hint}</div>`:'');
  return `<div class="dial">${corner}<div class="l">${label}</div>
    <div class="v num tapedit" id="dv_${id}" onclick="editDial('${id}')">${fmtDial(id)}<span class="u">${unit}</span></div>
    <div class="ctl">
      <button type="button" onpointerdown="holdStart(event,'${id}',-1)">−</button>
      <button type="button" onpointerdown="holdStart(event,'${id}',1)">+</button>
    </div></div>`;
}
function fmtDial(id){const s=dialState[id];if(s.v==null)return '—';
  if(s.kind==='time')return fmtTime(s.v);
  return s.v.toFixed(s.dp).replace(/\.0+$/,'');}   // trim trailing zeros — whole numbers read clean
function unitSpan(id){return `<span class="u">${dialState[id].unit}</span>`}
function redrawDial(id){const el=document.getElementById('dv_'+id);if(el)el.innerHTML=fmtDial(id)+unitSpan(id)}
function setDial(id,v){const s=dialState[id];
  if(v==null||isNaN(v)){redrawDial(id);return}
  if(s.min!=null)v=Math.max(s.min,v); if(s.max!=null)v=Math.min(s.max,v);
  s.v=Number(v.toFixed(s.dp)); redrawDial(id);}
function nudge(id,dir,mult){const s=dialState[id];
  setDial(id,(s.v==null?(s.min??0):s.v)+dir*s.step*(mult||1));
  if(navigator.vibrate)navigator.vibrate(3);}
function holdStop(){if(holdTO){clearTimeout(holdTO);holdTO=null}if(holdInt){clearInterval(holdInt);holdInt=null}
  window.removeEventListener('pointerup',holdStop);window.removeEventListener('pointercancel',holdStop);}
function holdStart(e,id,dir){
  e.preventDefault();
  if(editingDial){const de=document.getElementById('de_'+editingDial);if(de)de.blur();}
  holdStop();
  nudge(id,dir);                                   // the tap itself is one step
  let n=0;
  holdTO=setTimeout(()=>{ holdInt=setInterval(()=>{ n++;
    const mult=n<10?1:n<20?4:n<35?10:25;           // ramp up the longer it's held
    nudge(id,dir,mult); },60); },320);             // brief pause first, so a tap stays a tap
  window.addEventListener('pointerup',holdStop);
  window.addEventListener('pointercancel',holdStop);
}
function editDial(id){
  if(editingDial===id)return;
  const s=dialState[id],el=document.getElementById('dv_'+id);
  editingDial=id;
  const cur=s.v==null?'':(s.kind==='time'?fmtTime(s.v):fmtDial(id));
  el.innerHTML=`<input class="dedit" id="de_${id}" inputmode="${s.kind==='time'?'text':'decimal'}" value="${cur}">`+unitSpan(id);
  const inp=document.getElementById('de_'+id); inp.focus(); inp.select();
  const commit=()=>{if(editingDial!==id)return; editingDial=null;
    const raw=inp.value;
    const v=s.kind==='time'?parseTime(raw):(raw.trim()===''?NaN:Number(raw));
    setDial(id,v);};
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ev.preventDefault();inp.blur();}
    else if(ev.key==='Escape'){editingDial=null;redrawDial(id);}});
}

/* ============ brand colour ============ */
// A brand's signature palette, read from a website (café, roaster or the beans a café poured). Held
// across the open sheet while a lookup fills it. No photograph is ever captured or stored — a brand is
// its colours and its words, kept small, offline and portable.
let brandAccent=null,brandPalette=null;
function rgb2hsl(r,g,b){
  r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  const l=(mx+mn)/2,sa=d?d/(1-Math.abs(2*l-1)):0;
  return [h,sa*100,l*100];
}
// A hex string ('#rgb' or '#rrggbb') to [r,g,b], or null. The website read speaks in hex.
const hex2rgb=h=>{h=String(h||'').trim().replace(/^#/,'');if(h.length===3)h=h.replace(/(.)/g,'$1$1');
  return /^[0-9a-fA-F]{6}$/.test(h)?[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]:null};
// Read a brand's signature colour from the colours its website declares (logo ink, background, the
// palette around them): most chromatic wins, a colour outvoting the greys, held inside a legible band
// so the surface always reads. That one colour seeds a whole themed surface (see cafeColors) — a mini
// design system from a website, worn by a café, a bag, or a café cup's beans.
function paletteFromColors(list){
  let best=null,bw=-1;
  (list||[]).forEach(c=>{const p=hex2rgb(c);if(!p)return;const w=Math.pow(Math.max(...p)-Math.min(...p),2);if(w>bw){bw=w;best=p}});
  if(!best)return null;
  const dark=(.299*best[0]+.587*best[1]+.114*best[2])<118;
  if(bw<300){const L=dark?60:38;return{h:28,s:8,l:L,brand:`hsl(28,8%,${L}%)`,dark,mono:true}} // no colour to read — an honest neutral
  const[h,sa,l]=rgb2hsl(best[0],best[1],best[2]),H=Math.round(h);
  const S=Math.round(Math.min(80,Math.max(42,sa))),L=Math.round(Math.min(58,Math.max(38,l)));
  return {h:H,s:S,l:L,brand:`hsl(${H},${S}%,${L}%)`,dark};
}

// synced from elsewhere, beyond the one this form edits). Returns the {scheme,value}[] — or false on

/* ============ the door — paste, confirm, bind (SURFACES.md §1) ============ */
/* You never hold a lot. You hold a roast of one — a bag, a line on a menu. So the
 * door authors a coffee and the lot resolves behind it: paste → confirm → bind.
 * The parse runs HERE, on the device — no key, no account, no network — against
 * vocabularies the build already carries (PLACE_ALIASES, procFamily, the resolver's
 * thresholds) plus a country list and two regular expressions. The confirm step says
 * lotIdentity's grain rule and lotKeyOf's two-of-six threshold out loud, at the only
 * moment a keeper can act on them. The bind is the only branch: shelf · bar · brew ·
 * noting. Nothing is written until the bind; a struck fact keeps its ink. */
const DOOR_COUNTRIES=['Colombia','Ethiopia','Kenya','Guatemala','Costa Rica','Panama','Brazil',
  'Peru','Bolivia','Ecuador','Honduras','El Salvador','Nicaragua','Mexico','Rwanda','Burundi',
  'Tanzania','Uganda','Malawi','Zambia','Zimbabwe','DR Congo','Yemen','India','Indonesia','Sumatra',
  'Sulawesi','Papua New Guinea','Timor-Leste','Thailand','Vietnam','Myanmar','China','Taiwan',
  'Philippines','Hawaii','Jamaica','Dominican Republic','Haiti','Cuba','Venezuela'];
const DOOR_REGIONS=[...new Set(['Huila','Nariño','Tolima','Cauca','Antioquia','Cundinamarca','Santander','Quindío',
  'Guji','Sidama','Sidamo','Gedeb','Bench Maji','Kaffa','Nyeri','Kirinyaga','Kiambu','Embu',
  'Huehuetenango','Acatenango','Antigua','Atitlán','Boquete','Chiriquí','Volcán','Tarrazú','West Valley','Central Valley',
  'Cajamarca','Amazonas','Minas Gerais','Cerrado','Sul de Minas','Mogiana','Kayanza','Ngozi','Kigoma','Mbeya',
  'Aceh','Kintamani','Chiapas','Veracruz','Oaxaca',
  ...PLACE_ALIASES.filter(a=>a[2]==='region').flatMap(a=>a[1]).map(s=>s.replace(/(^|\s)[a-z]/g,c=>c.toUpperCase()))])];
const DOOR_VARIETIES=[...new Set(['Pink Bourbon','Yellow Bourbon','Red Bourbon','Sudan Rume','Wush Wush','Mundo Novo',
  'Gesha','Geisha','Bourbon','Caturra','Catuai','Catuaí','Castillo','Typica','Pacamara','Maragogype',
  'SL28','SL34','SL 28','SL 34','Ruiru 11','Batian','Heirloom','Mixed heirloom','Sidra','Java','Laurina',
  'Tabi','Pache','Villa Sarchi','Chiroso','Papayo','74110','74158','Colombia','Kent','S795',
  ...PLACE_ALIASES.filter(a=>a[2]==='variety').flatMap(a=>a[1]).map(s=>s.replace(/(^|\s)[a-z]/g,c=>c.toUpperCase()))])];
const DOOR_PROC_WORDS=['double anaerobic','anaerobic natural','anaerobic washed','carbonic maceration',
  'thermal shock','extended fermentation','lactic','koji','anaerobic','fully washed','washed','wet process',
  'natural','dry process','yellow honey','red honey','black honey','white honey','honey','wet hulled',
  'giling basah','experimental'];
// the producer / processor split — the distinction SCHEMA insists on and one flat field collapses.
// Vocabulary-driven; an unmatched name stays unclassified rather than being guessed into a tier.
const DOOR_FARM_RE=/\b(finca|hacienda|granja|fazenda|sitio|estate|farm)\b/i;
const DOOR_STATION_RE=/\b(washing station|wet mill|dry mill|beneficio|station|cooperative|co-?op|union)\b/i;
// whole-token vocabulary scan; a hit fully contained in a longer one drops ("Bourbon" inside "Pink Bourbon")
function doorFindAll(text,list){
  const low=text.toLowerCase(),hits=[];
  list.forEach(term=>{const t=term.toLowerCase(),i=low.indexOf(t);if(i<0)return;
    const before=i===0?' ':low[i-1],after=low[i+t.length]||' ';
    if(/[a-zà-ÿ0-9]/.test(before)||/[a-zà-ÿ0-9]/.test(after))return;
    hits.push(term)});
  return hits.filter(h=>!hits.some(o=>o!==h&&o.toLowerCase().indexOf(h.toLowerCase())>=0));
}
function doorFindNamed(text,re){
  const out=[];
  text.split(/[\n,;•·—]|\.\s/).forEach(frag=>{
    let f=frag.trim();
    if(f.length<3||f.length>46||!re.test(f))return;
    f=f.replace(/^(grown at|produced (at|by)|processed (at|by)|from|at|by|the)\s+/i,'').replace(/[.,;:]$/,'').trim();
    if(f&&out.indexOf(f)<0)out.push(f)});

function doorParse(text){
  const f={};

  const r=doorFindAll(text,DOOR_REGIONS);     if(r.length)f.region=r[0];
  const v=doorFindAll(text,DOOR_VARIETIES).filter(x=>!f.country||normPlace(x)!==normPlace(f.country)); // a country is not a variety here
  if(v.length)f.varieties=v;

  if(p.length){const w=p.sort((a,b)=>b.length-a.length)[0];f.process=w.charAt(0).toUpperCase()+w.slice(1)}

  if(farm.length)f.producer=farm[0];
  if(stn.length&&(!farm.length||normPlace(stn[0])!==normPlace(farm[0])))f.processor=stn[0];

  if(alt){f.altitudeM=alt;f.altitude=altLabel(alt)}   // door and the record can never disagree

  if(rst)f.roastLevel=rst[1].charAt(0).toUpperCase()+rst[1].slice(1).toLowerCase();

// the unstruck facts, shaped as a record's origin. The record's one producer field carries

function doorFields(){

  const farm=(!s.producer&&f.producer)||'',stn=(!s.processor&&f.processor)||'';
  return {originCountry:(!s.country&&f.country)||'',originRegion:(!s.region&&f.region)||'',
    producer:farm||stn,producerKind:farm?'farm':stn?'station':'',station:stn,
    variety:(!s.variety&&(f.varieties||[])[0])||'',process:(!s.process&&f.process)||'',lot:'',
    altitude:(!s.altitude&&f.altitude)||'',altitudeM:(!s.altitude&&f.altitudeM)||null,harvest:(!s.harvest&&f.harvest)||'',
    roastLevel:(!s.roastLevel&&f.roastLevel)||''};
}
// lotIdentity's grain rule and lotKeyOf's ≥2-of-6 threshold, computed exactly as the save will
function doorResolve(){
  const o=doorFields();
  const n=[o.originCountry,o.originRegion,o.producer,o.variety,o.process,o.lot].filter(regSubstance).length;
  return {n,grain:lotIdentity(o).grain,shared:n>=2};
}
const DOOR_GRAIN={'green-lot':['Green lot','The finest grain the trade can prove — one parcel, one harvest.'],

/* The door is a SCREEN, not a sheet (STREAMLINED.html). It is the one way a

 * a back that walks the steps rather than dismissing them. The masthead's
 * ＋ A coffee opens it from any room. */

// The origin-actor split (SURFACES.md, "where the farm went"): the parser told farm from

// its kind, a processors node on the lot's processorRefs (that kind's first write path).

function doorStampActors(rec,o){
  if(!rec.lotRef)return;

    const p=catByKey('producers',catNorm(o.producer)+'|'+catNorm(o.originCountry));
    if(p&&!p.producerKind){p.producerKind=o.producerKind;CAT.producers.dirty=true;saveDoc('producers')}
  }
  if(regSubstance(o.station)){
    const pn=catUpsert('processors',catNorm(o.station)+'|'+catNorm(o.originCountry),{name:o.station,country:o.originCountry,region:o.originRegion},activeName());
    const lot=catNode('lots',rec.lotRef);
    if(pn&&lot&&!(lot.processorRefs||[]).length){lot.processorRefs=[pn.id];lot.updatedAt=new Date().toISOString();CAT.lots.dirty=true;saveDoc('lots')}

// ever read it back. This is the goal's first test — a fact entering the record at the point it was
// born, in the column that holds it. Blanks-only, and a disagreement is carried (lotSetAltitude).
function doorStampAltitude(rec,o){

  if(lotRes&&lotRes.action==='propose')openLotPropose(nb.id,lotRes.propose.lot.id,lotRes.propose.fields); // one uncertain candidate — ask inline while the context is warm (§4)
}

let tInt=null,tStart=null,tElapsed=0;
function timerHTML(){if(getPref('hideTimer',false))return '';   // Argos/scale users time elsewhere — just transcribe the number
  return `<div class="timer">
  <div class="t num" id="tclock">0:00.0</div>
  <div class="ctl">
    <button class="go" id="tbtn" onclick="toggleTimer()">Start</button>
    <button onclick="resetTimer()">Reset</button>
    <button onclick="useTimer()">Use time ↓</button>
  </div></div>`;}
function tickTimer(){const s=tElapsed+(tStart?(Date.now()-tStart)/1000:0);
  const el=document.getElementById('tclock');if(el)el.textContent=`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}.${Math.floor(s*10%10)}`;}
function toggleTimer(){
  if(tInt){tElapsed+=(Date.now()-tStart)/1000;tStart=null;clearInterval(tInt);tInt=null;document.getElementById('tbtn').textContent='Start';}
  else{tStart=Date.now();tInt=setInterval(tickTimer,100);document.getElementById('tbtn').textContent='Stop';}
}
function resetTimer(){stopTimer(true);tickTimer()}
function stopTimer(zero){if(tInt){clearInterval(tInt);tInt=null}if(zero){tElapsed=0;tStart=null}else if(tStart){tElapsed+=(Date.now()-tStart)/1000;tStart=null}}
function useTimer(){const s=tElapsed+(tStart?(Date.now()-tStart)/1000:0);
  if(dialState.time){dialState.time.v=Math.round(s);redrawDial('time');}
  toast('Time captured');}

function saveCup(kind,brewId,bagId,skip,editId){
  if(guard())return;
  if(!skip&&hedState==null&&kind==='home'){toast('A cup needs its reading — the 1–9 first. Or skip; that\'s honest too.');return}
  const ex=editId?cupById(editId):null; // edit path: keep the cup's id, place and hour; revise the rest
  const brew=brewId?D.brews.find(x=>x.id===brewId):(ex&&ex.brewId?D.brews.find(x=>x.id===ex.brewId):null);
  const fields={kind,brewId:brewId||(ex?ex.brewId:null)||null,bagId:bagId||(ex?ex.bagId:null)||null,
    shop:kind==='cafe'?val('c_shop'):null,drink:kind==='cafe'?val('c_drink'):null,
    hedonic:skip?null:hedState,descriptors:skip?[]:[...descState],notes:skip?'':val('c_notes'),
    instrumentation:kind==='cafe'?'recalled':(brew?brew.instrumentation:'measured'),blind:false,runId:null};
  if(kind==='cafe'){
    fields.city=val('c_city');fields.style=cafeStyleState;fields.roaster=val('c_roaster');
    fields.origin=val('c_origin');fields.price=numv('c_price');fields.again=againState;
    fields.site=(val('c_beansite')||'').trim();fields.palette=brandPalette; // the beans' brand, read from the roaster's site
    // structured traceability, aligned to the bag schema — the café's aspiration toward the exact coffee
    fields.originCountry=val('c_country');fields.originRegion=val('c_region');fields.producer=val('c_producer');
    fields.variety=val('c_variety');fields.lot=val('c_lot');fields.process=val('c_process');
    const hids=readHardIds('c_hid',ex&&ex.hardIds); if(hids===false)return; fields.hardIds=hids; // a false-friend hard-ID — the reason is toasted, fix or clear it
    if(fields.shop)regUpsert(fields.shop,{city:fields.city},activeName()); // a sighting — the café enters the Register
    if(fields.shop&&!ex&&(sightBag||sightSeen.length)&&isAdmin()){regSight(fields.shop,{bag:sightBag,seen:sightSeen},activeName())} // what the counter showed — one save, no second submit; the shared line rides only the founder's pen
    sightBag=null;sightSeen=[];
    if(fields.shop&&D.cafeWants){const i=D.cafeWants.findIndex(x=>normName(x)===normName(fields.shop));if(i>=0)D.cafeWants.splice(i,1)} // been now — off the want list
  }
  const firstOut=kind==='cafe'&&!ex&&!cafeCups().length;
  const firstHome=kind==='home'&&!ex&&!skip&&!D.cups.some(c=>c.kind==='home'&&c.hedonic!=null);
  let cup;
  if(ex){Object.assign(ex,fields,{updatedAt:new Date().toISOString()});cup=ex}
  else{cup={id:uid(),createdAt:new Date().toISOString(),...fields};D.cups.push(cup)}
  let lotRes=null;
  if(kind==='cafe'){catStampRoaster(cup);lotRes=catStampLot(cup); // author its roaster + lot nodes at save time, not next boot
    if(!ex){ // new cups only — retire the flat text once a node stands to carry it (edit path untouched, so the retirement proves out on fresh saves first)
      if(cup.roasterRef)cup.roaster=''; // own surfaces read cupRoaster (node-first), the circle reads circleRoaster (flat-first-node-floor) — a friend still sees it through the group catalog
      if(cup.lotRef){const ln=catNode('lots',cup.lotRef);
        ['originCountry','originRegion','producer','variety','process','lot'].forEach(k=>cup[k]=''); // the lot node carries the structured origin (lotRead/circleLot read through)
        if(ln&&regSubstance(ln.origin))cup.origin=''; // a loose free-text origin (no structured fields) was homed on this cup's own singleton lot → retire the flat copy too
      }
    }
    catStampPour(cup,activeName()); // the café cup is a Reading over a Pour — mint the venue availability edge
  }else{cup.prepKind='brew';cup.brewRef=cup.brewId||null} // a home cup is a Reading over its Brew
  editingCupId=null;
  save();closeSheet();
  if(kind==='cafe'){if(cup.shop){go('atlas');openPlace(cup.shop)}else{go('atlas')}toast(ex?'Cup updated':(firstOut?'Kept — your first cup out.':'Kept.'));}
  else{go('today');toast(ex?'Cup updated':(skip?'The brew is on the record.':firstHome?'Kept — your first cup at home. The next brew starts here.':'Kept — the next brew starts here.'));}
  if(!ex&&lotRes&&lotRes.action==='propose')openLotPropose(cup.id,lotRes.propose.lot.id,lotRes.propose.fields); // one uncertain candidate — ask inline (§4)
}

// Online beans read: the roaster's site gives the cup the coffee's brand — the same one-tap read a bag
// gets — pulling the roaster it states and the line it writes, and the palette the cup then carries.
// Fills blanks only. Progressive: offline or a silent site, and you fill it in by hand.
async function beansLookup(){
  const u=val('c_beansite'),box=document.getElementById('beansiteresults');
  if(!u.trim()){if(box)box.innerHTML='<div class="muted small" style="padding:6px 2px">Type the roaster’s website first — then read it.</div>';return}
  if(box)box.innerHTML='<div class="muted small" style="padding:6px 2px">Reading the beans…</div>';
  try{
    const b=await readBrand(u);if(!box)return;if(!b)throw 0;
    if(b.pal){brandPalette=b.pal;brandAccent=b.pal.brand;paintBrandPreview()}
    const rEl=document.getElementById('c_roaster'); // the name it states fills the beans, if blank
    if(b.name&&rEl&&!rEl.value.trim())rEl.value=b.name;
    const nEl=document.getElementById('c_notes');   // the description fills the line, if blank
    if(b.line&&nEl&&!nEl.value.trim())nEl.value=b.line;
    if(!b.pal&&!b.name&&!b.line){box.innerHTML='<div class="muted small" style="padding:6px 2px">Couldn’t read that site. Fill it in by hand — it still saves.</div>';return}
    const got=[b.pal?'its colours':null,b.line?'a line':null].filter(Boolean).join(', ');
    box.innerHTML=brandReadLine(b,got);
  }catch(e){if(box)box.innerHTML='<div class="muted small" style="padding:6px 2px">Offline, or the site wouldn’t answer. Fill it in by hand — it still saves.</div>'}
}

  if(guard())return;

function shopAgg(){
  const map={};
  cafeCups().filter(c=>c.shop).forEach(c=>{const k=c.shop.trim();(map[k]=map[k]||{shop:k,cups:[]}).cups.push(c)});
  return Object.values(map).map(s=>{
    const cups=s.cups;
    s.visits=cups.length;
    s.avg=avgHedonic(cups);
    s.usual=modeOf(cups.map(c=>c.drink).filter(Boolean));
    s.city=modeOf(cups.map(c=>c.city).filter(Boolean));
    s.spend=cups.reduce((a,c)=>a+(c.price||0),0);
    s.best=cups.reduce((m,c)=>Math.max(m,c.hedonic||0),0);
    s.last=cups.slice().sort(byNew)[0].createdAt;
    s.fav=isCafeFav(s.shop);
    s.profile=cafeProfile(s.shop);
    return s;
  }).sort((a,b)=>(b.fav-a.fav)||b.last.localeCompare(a.last));
}

/* --- the place page: one page per café, reached from anywhere its name appears.
 * Your cups, the circle's cups, the Register entry — identity, provenance,
 * actions — merged onto one surface, wearing the café's own palette. --- */
// The locator on a café's page. The base map stays neutral — land, water and
// streets never move; the one warm mark takes the café's own hue, shifted per
// theme so an arbitrary brand colour reads on either paper, and a near-neutral
// palette floors back to the global ember rather than a muddy wash.
function placeMapHTML(shop,p,pal){
  const dusk=document.documentElement.getAttribute('data-theme')==='dusk';
  const acc=(pal&&pal.h!=null&&pal.s>=12)?`hsl(${pal.h},${Math.min(pal.s,70)}%,${dusk?62:45}%)`:'';
  const st=acc?`background:${acc};box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px ${acc}`:'';
  const id=smapReg({camKey:'place|'+normName(shop),center:[p.lon,p.lat],zoom:14.4,marks:()=>{
    const el=smapPinEl('spot',{label:shop});
    if(st)el.style.cssText=st;
    return[{lat:p.lat,lon:p.lon,el}];
  }});
  return `<div class="cafe-map" id="${id}" data-smap="${id}"><div class="pin spot" style="left:42%;top:44%;${st}"><span class="lbl">${esc(shop)}</span></div></div>`;
}
// The greens poured at a venue — the availability edge (VISION branch 1), folded from the pours across every
// readable ledger and deduped by green (forwarded through any merge). A pure spine read: each green taps into
// its lot page. Empty where nothing traceable has poured here — a recipe or a green is never invented.
function poursHere(shop,e){
  const seen=new Set(),out=[];
  const scan=list=>(list||[]).forEach(p=>{if(!p||!p.lotRef)return;
    const match=(e&&p.venueRef&&p.venueRef===e.id)||(p.shop&&normName(p.shop)===normName(shop));
    if(!match)return;const id=lotFwd(p.lotRef),l=catNode('lots',id);
    if(!l||!lotLive(l)||seen.has(id))return;seen.add(id);out.push({id,lot:l})});
  scan(D.pours);
  circleSources().forEach(s=>{const d=circleLedger(s);if(d)scan(d.pours)});
  return out.sort((a,b)=>lotHands(b.id)-lotHands(a.id)||String(a.lot.firstAt||'').localeCompare(String(b.lot.firstAt||'')));
}

}

// Online geocode (OpenStreetMap Nominatim — no key). Progressive enhancement: type wins offline.
// The query prefers a typed address, else falls back to the café's own name + city — so a lookup
// needs no typing at all: the shop the record already knows becomes the search.
let geoPick={address:'',lat:null,lon:null};
// The neighbourhood a geocode names for a pin — Nominatim's own hierarchy, most specific first.
function nbhoodOf(addr){
  addr=addr||{};
  return addr.neighbourhood||addr.suburb||addr.quarter||addr.city_district||addr.hamlet||addr.borough||'';
}
// One keyless Nominatim read, shared by the café geocode and the atlas fill. Returns [] offline or on a
// silent endpoint; every caller degrades to typed text or a list, never a blank pretending to be a pin.
async function geoSearch(q){
  if(!q)return[];
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
  return await r.json()||[];
}
// One point, for a programmatic fill (the atlas locating a roaster's city or an origin's region).
// Never list[0] blindly (CHARTS.md): when the candidates disagree beyond a degree the name is
// ambiguous — a Portland problem — and the fill refuses. The node lists; a keeper can pin it by
// hand through the correction sheet, where the candidates are offered rather than guessed between.
async function geoOne(q,ctx){
  try{
    const list=await geoSearch(ctx&&regSubstance(ctx.country)?q+', '+ctx.country:q);
    if(!list||!list.length)return null;
    const top={lat:Number(list[0].lat),lon:Number(list[0].lon),neighborhood:nbhoodOf(list[0].address)};
    if(list.length>1&&(Math.abs(Number(list[1].lat)-top.lat)>1||Math.abs(Number(list[1].lon)-top.lon)>1))return null;
    return top;
  }catch(e){}
  return null;
}
// The atlas coordinate fill — the OPTIONAL, keyless lookup writing honest, coarse, provenance-carried lat/lon
// onto the spine (blanks-only via catUpsert), so a stranger's map draws the scene without any typing. Run at
// author time on the interactive path only (never on the boot sweep or the demo — those never touch the
// network): a roaster to its CITY point, an origin to its REGION/COUNTRY centroid — never the farm or station
// name, so no farm-precise pin is ever invented (LOT_IDENTITY). Offline (or a silent endpoint) it does
// nothing and the node lists; a located node is never re-looked-up or overwritten.
async function atlasGeoFill(rec){
  if(readOnly()||!rec||!navigator.onLine)return;
  let hit=false;
  const rk=regSubstance(rec.roaster)&&catNorm(rec.roaster),rn=rk&&catByKey('roasters',rk),city=(rec.roasterCity||'').trim();
  if(rn&&city&&rn.lat==null){const pt=await geoOne(city);if(pt){catUpsert('roasters',rk,{lat:pt.lat,lon:pt.lon,geoGrain:'city'},activeName());hit=true}}
  const o=recOrigin(rec);
  if(regSubstance(o.producer)&&(regSubstance(o.originRegion)||regSubstance(o.originCountry))){
    const pk=catNorm(o.producer)+'|'+catNorm(o.originCountry),pn=catByKey('producers',pk);
    if(pn&&pn.lat==null){const pt=await geoOne([o.originRegion,o.originCountry].filter(regSubstance).join(', ')); // region/country only — coarse, never the station name
      if(pt){catUpsert('producers',pk,{lat:pt.lat,lon:pt.lon,geoGrain:regSubstance(o.originRegion)?'region':'country'},activeName());hit=true}}
  }
  if(hit&&curateOn)render();
}
/* ---- the pin correction (CHARTS.md) — a wrong coordinate was permanent: the fill is blanks-only

async function geoFixLook(kind,id){

function geoFixSet(kind,id,lat,lon){

// The name a site states for itself, cleaned of the boilerplate page titles carry ('Home', a tagline,
// the domain). What survives the split is usually the café's own name — surfaced so you can see the
// site agrees with the shop you named.
function siteName(title){
  const parts=String(title||'').split(/\s+[|·—–]\s+|\s+-\s+/).map(s=>s.trim()).filter(Boolean);
  return parts.filter(s=>!/^(home|welcome|official(\s+site)?|coffee|caf[eé]|menu|about)$/i.test(s))[0]||parts[0]||'';
}
// One line to the ledger: a meta description, collapsed and clipped to a single legible line at a word
// boundary — never a fabricated sentence, only what the site already wrote about itself.
function siteLine(desc){
  const t=String(desc||'').replace(/\s+/g,' ').trim();
  return t.length>150?t.slice(0,147).replace(/[\s.,;:–—-]+\S*$/,'')+'…':t;
}
// One website read, shared by cafés, bags and café cups. Microlink (no key, CORS-open) reads the page;
// we take its colours (paletteFromColors, the chroma-wins signature), the name it states, and the line
// it wrote about itself — never the hotlinked image. A brand is its palette and its words: small,
// offline, portable, self-contained. Returns null offline or on a silent site; the caller falls back to
// hand entry. `host`/`logo` are for a live confirmation only, never saved.
function normSite(u){u=(u||'').trim();if(!u)return'';return /^https?:\/\//i.test(u)?u:'https://'+u}
async function readBrand(url){
  const u=normSite(url);if(!u)return null;
  let host=u;try{host=new URL(u).hostname.replace(/^www\./,'')}catch(e){}
  const r=await fetch('https://api.microlink.io/?palette&url='+encodeURIComponent(u));
  const j=await r.json();
  const d=(j&&j.data)||{},lg=d.logo||{},im=d.image||{};
  const cols=[lg.color,lg.background,...(lg.palette||[]),im.color,im.background,...(im.palette||[])].filter(Boolean);
  return {pal:paletteFromColors(cols),name:siteName(d.title),line:siteLine(d.description),logo:lg.url||'',host};

// Peek at another user's stored ledger without loading it into the app.
function peek(id){
  if(id===viewingUserId)return{bags:D.bags.length,brews:D.brews.length,cups:D.cups.length};
  try{const r=localStorage.getItem(dataKey(id));if(!r)return{bags:0,brews:0,cups:0};
    const d=JSON.parse(r);return{bags:(d.bags||[]).length,brews:(d.brews||[]).length,cups:(d.cups||[]).length};
  }catch(e){return{bags:0,brews:0,cups:0}}
}

  const p=peek(id);
  if(!confirm(`Delete ${u.name} and their entire ledger?\n\n${p.bags} bags, ${p.brews} brews, ${p.cups} cups.\n\nThis cannot be undone.`))return;
  try{localStorage.removeItem(dataKey(id))}catch(e){}
  USERS.users=USERS.users.filter(x=>x.id!==id);saveUsers();

/* ============ export / import ============ */
function exportJSON(){
  // Bundle the whole spine into the copy so it stands alone. A retired origin/roaster/roast
  // lives only on its catalog node now, so a copy opened on a device that never synced would
  // read blanks without it. The catalog is a shared group document (catSeed sweeps every
  // ledger into it), so exporting it whole is faithful to what it is; import folds it back.
  const catalog={};CAT_KINDS.forEach(k=>{catalog[k]={version:1,entries:CAT[k].entries,deleted:CAT[k].deleted}});
  const out={...D,catalog,exportedAt:new Date().toISOString(),user:viewingUser().name,schema:'carta-phase0-v1'};
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const slug=viewingUser().name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'ledger';
  a.download=`carta-ledger-${slug}-${today()}.json`;a.click();URL.revokeObjectURL(a.href);
  toast('Ledger exported');
}

/* ---- the ledger export — the reader-facing copy (carta.ledger/v1) ----
 * One self-contained HTML file on CARTA paper stock: the reader's own overlay
 * — readings, shelf, brews, cups out, saves, signed pages — never the shared
 * page's compiled numbers. Real token hexes are inlined (the one sanctioned
 * place tokens resolve to literals — the file must stand alone), and the
 * machine-readable record travels inside it as JSON. The download panel is
 * the guarantee: a real anchor the reader clicks, allowed even where
 * programmatic downloads are blocked. Its twin, read-back, proves the schema
 * is open — parsed, validated, read aloud, never merged. */
let exportedFile=null;
function ledgerData(){
  const cups=D.cups.slice().sort(byNew);
  const line=c=>c.notes||((c.descriptors||[]).length?c.descriptors.join(' · '):'');
  const when=t=>t?new Date(t).toLocaleDateString([],{month:'short',day:'numeric'}):'';
  const readings=cups.filter(c=>c.hedonic!=null).map(c=>{
    if(c.kind==='cafe')return {coffee:[c.drink||'a cup',c.shop].filter(Boolean).join(' at '),where:'out',
      road:['out',cupRoaster(c),(lotRead(c)||{}).country].filter(Boolean).join(' · '),hedonic:c.hedonic,when:when(c.createdAt),line:line(c)};
    const b=bagById(c.bagId),br=c.brewId&&D.brews.find(x=>x.id===c.brewId);
    return {coffee:b?bagName(b):'a coffee',where:'home',
      road:['home',br&&br.technique,br&&(setupById(br.setupId)||{}).brewer].filter(Boolean).join(' · '),hedonic:c.hedonic,when:when(c.createdAt),line:line(c)};
  });
  const grainOf=b=>{if(!b.lotRef)return 'unresolved';const l=catNode('lots',lotFwd(b.lotRef));const gr=l&&grainRead(l.grain);return gr?gr[0].toLowerCase():'unresolved'};
  const shelf=D.bags.filter(b=>!b.archived).sort(byNew).map(b=>{
    const scored=brewsOf(b.id).map(x=>({brew:x,cup:D.cups.find(c=>c.brewId===x.id)})).filter(x=>x.cup&&x.cup.hedonic!=null).sort((a,c)=>c.cup.hedonic-a.cup.hedonic)[0];
    return {coffee:bagName(b),resolution:grainOf(b),
      reading:scored?{hedonic:String(scored.cup.hedonic),recipe:brewRecipe(scored.brew),line:line(scored.cup)}:null};
  });
  const cupsOut=cafeCups().slice().sort(byNew).map(c=>({place:c.shop||'a café',city:c.city||'',
    cup:[when(c.createdAt),c.drink||c.style||'a cup'].filter(Boolean).join(' · '),
    reading:(c.hedonic!=null?c.hedonic+' / 9':'kept')+(c.again===true?' · again':'')}));
  const wa=getPref('wantAt',{})||{};
  const saved=(D.cafeWants||[]).map(w=>({place:w,city:(regByName(w)||{}).city||'',
    saved:wa[normName(w)]?when(wa[normName(w)]):'before the record kept dates',state:'unvisited — no cup of yours here yet'}));
  const me=activeName();
  const signedPages=[];
  REG.entries.forEach(e=>{if(e&&e.signed&&e.signed.at&&e.signed.by===me){
    const corr=Object.entries(e.penFacts||{}).map(([f,c])=>({field:f,value:c.v}));
    signedPages.push({page:e.name,kind:'cafe',corrections:corr})}});
  CAT.roasters.entries.forEach(r=>{if(r&&r.signed&&r.signed.at&&r.signed.by===me){
    const corr=Object.entries(r.penFacts||{}).map(([f,c])=>({field:f,value:c.v}));
    signedPages.push({page:r.name,kind:'roaster',corrections:corr})}});
  const firstAt=[...D.cups,...D.brews,...D.bags].map(x=>x&&x.createdAt).filter(Boolean).sort()[0];
  const home=cups.filter(c=>c.kind==='home'&&c.hedonic!=null),out=cups.filter(c=>c.kind==='cafe'&&c.hedonic!=null);
  const R={total:readings.length,coffees:shelf.length,
    since:firstAt?new Date(firstAt).toLocaleDateString('en-US',{month:'long',year:'numeric'}):'',
    avg:avgHedonic(cups.filter(c=>c.hedonic!=null))||'—',home:avgHedonic(home)||'—',out:avgHedonic(out)||'—'};
  const g=new Date(),iso=g.toISOString(),ym=iso.slice(0,7);
  const slug=(viewingUser().name||'ledger').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return {filename:`carta-ledger-${slug}-${ym}.html`,generatedISO:iso,
    generatedHuman:g.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}),
    record:R,readings,shelf,cupsOut,saved,signedPages};
}
