// A brand's signature palette, read from a website (café, roaster or the beans a café poured). Held
// across the open sheet while a lookup fills it. No photograph is ever captured or stored — a brand is
// its colours and its words, kept small, offline and portable.
let brandAccent=null,brandPalette=null;
function rgb2hsl(r,g,b){
  r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  const l=(mx+mn)/2,sa=d?d/(1-Math.abs(2*l-1)):0;
  return [h,sa*100,l*100];
}
// A hex string ('#rgb' or '#rrggbb') to [r,g,b], or null. The website read speaks in hex.
const hex2rgb=h=>{h=String(h||'').trim().replace(/^#/,'');if(h.length===3)h=h.replace(/(.)/g,'$1$1');
  return /^[0-9a-fA-F]{6}$/.test(h)?[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]:null};
// Read a brand's signature colour from the colours its website declares (logo ink, background, the
// palette around them): most chromatic wins, a colour outvoting the greys, held inside a legible band
// so the surface always reads. That one colour seeds a whole themed surface (see cafeColors) — a mini
// design system from a website, worn by a café, a bag, or a café cup's beans.
function paletteFromColors(list){
  let best=null,bw=-1;
  (list||[]).forEach(c=>{const p=hex2rgb(c);if(!p)return;const w=Math.pow(Math.max(...p)-Math.min(...p),2);if(w>bw){bw=w;best=p}});
  if(!best)return null;
  const dark=(.299*best[0]+.587*best[1]+.114*best[2])<118;
  if(bw<300){const L=dark?60:38;return{h:28,s:8,l:L,brand:`hsl(28,8%,${L}%)`,dark,mono:true}} // no colour to read — an honest neutral
  const[h,sa,l]=rgb2hsl(best[0],best[1],best[2]),H=Math.round(h);
  const S=Math.round(Math.min(80,Math.max(42,sa))),L=Math.round(Math.min(58,Math.max(38,l)));
  return {h:H,s:S,l:L,brand:`hsl(${H},${S}%,${L}%)`,dark};
}

// Read the form's hard-ID, firewall it, and fold it into the record's set (preserving any tokens

/* ============ the door — paste, confirm, bind (SURFACES.md §1) ============ */
/* You never hold a lot. You hold a roast of one — a bag, a line on a menu. So the
 * door authors a coffee and the lot resolves behind it: paste → confirm → bind.
 * The parse runs HERE, on the device — no key, no account, no network — against
 * vocabularies the build already carries (PLACE_ALIASES, procFamily, the resolver's
 * thresholds) plus a country list and two regular expressions. The confirm step says
 * lotIdentity's grain rule and lotKeyOf's two-of-six threshold out loud, at the only
 * moment a keeper can act on them. The bind is the only branch: shelf · bar · brew ·
 * noting. Nothing is written until the bind; a struck fact keeps its ink. */
const DOOR_COUNTRIES=['Colombia','Ethiopia','Kenya','Guatemala','Costa Rica','Panama','Brazil',
  'Peru','Bolivia','Ecuador','Honduras','El Salvador','Nicaragua','Mexico','Rwanda','Burundi',
  'Tanzania','Uganda','Malawi','Zambia','Zimbabwe','DR Congo','Yemen','India','Indonesia','Sumatra',
  'Sulawesi','Papua New Guinea','Timor-Leste','Thailand','Vietnam','Myanmar','China','Taiwan',
  'Philippines','Hawaii','Jamaica','Dominican Republic','Haiti','Cuba','Venezuela'];
const DOOR_REGIONS=[...new Set(['Huila','Nariño','Tolima','Cauca','Antioquia','Cundinamarca','Santander','Quindío',
  'Guji','Sidama','Sidamo','Gedeb','Bench Maji','Kaffa','Nyeri','Kirinyaga','Kiambu','Embu',
  'Huehuetenango','Acatenango','Antigua','Atitlán','Boquete','Chiriquí','Volcán','Tarrazú','West Valley','Central Valley',
  'Cajamarca','Amazonas','Minas Gerais','Cerrado','Sul de Minas','Mogiana','Kayanza','Ngozi','Kigoma','Mbeya',
  'Aceh','Kintamani','Chiapas','Veracruz','Oaxaca',
  ...PLACE_ALIASES.filter(a=>a[2]==='region').flatMap(a=>a[1]).map(s=>s.replace(/(^|\s)[a-z]/g,c=>c.toUpperCase()))])];
const DOOR_VARIETIES=[...new Set(['Pink Bourbon','Yellow Bourbon','Red Bourbon','Sudan Rume','Wush Wush','Mundo Novo',
  'Gesha','Geisha','Bourbon','Caturra','Catuai','Catuaí','Castillo','Typica','Pacamara','Maragogype',
  'SL28','SL34','SL 28','SL 34','Ruiru 11','Batian','Heirloom','Mixed heirloom','Sidra','Java','Laurina',
  'Tabi','Pache','Villa Sarchi','Chiroso','Papayo','74110','74158','Colombia','Kent','S795',
  ...PLACE_ALIASES.filter(a=>a[2]==='variety').flatMap(a=>a[1]).map(s=>s.replace(/(^|\s)[a-z]/g,c=>c.toUpperCase()))])];
const DOOR_PROC_WORDS=['double anaerobic','anaerobic natural','anaerobic washed','carbonic maceration',
  'thermal shock','extended fermentation','lactic','koji','anaerobic','fully washed','washed','wet process',
  'natural','dry process','yellow honey','red honey','black honey','white honey','honey','wet hulled',
  'giling basah','experimental'];
// the producer / processor split — the distinction SCHEMA insists on and one flat field collapses.
// Vocabulary-driven; an unmatched name stays unclassified rather than being guessed into a tier.
// the farm/station vocabulary moved up beside lotIdentity (FARM_RE / STATION_RE) — the grain reads it too
// whole-token vocabulary scan; a hit fully contained in a longer one drops ("Bourbon" inside "Pink Bourbon")
function doorFindAll(text,list){
  const low=text.toLowerCase(),hits=[];
  list.forEach(term=>{const t=term.toLowerCase(),i=low.indexOf(t);if(i<0)return;
    const before=i===0?' ':low[i-1],after=low[i+t.length]||' ';
    if(/[a-zà-ÿ0-9]/.test(before)||/[a-zà-ÿ0-9]/.test(after))return;
    hits.push(term)});
  return hits.filter(h=>!hits.some(o=>o!==h&&o.toLowerCase().indexOf(h.toLowerCase())>=0));
}
function doorFindNamed(text,re){
  const out=[];
  text.split(/[\n,;•·—]|\.\s/).forEach(frag=>{
    let f=frag.trim();
    if(f.length<3||f.length>46||!re.test(f))return;
    f=f.replace(/^(grown at|produced (at|by)|processed (at|by)|from|at|by|the)\s+/i,'').replace(/[.,;:]$/,'').trim();
    if(f&&out.indexOf(f)<0)out.push(f)});
  return out.slice(0,1);
}
function doorParse(text){
  const f={};
  const c=doorFindAll(text,DOOR_COUNTRIES);   if(c.length)f.country=c[0];
  const r=doorFindAll(text,DOOR_REGIONS);     if(r.length)f.region=r[0];
  const v=doorFindAll(text,DOOR_VARIETIES).filter(x=>!f.country||normPlace(x)!==normPlace(f.country)); // a country is not a variety here
  if(v.length)f.varieties=v;
  const p=doorFindAll(text,DOOR_PROC_WORDS);
  if(p.length){const w=p.sort((a,b)=>b.length-a.length)[0];f.process=w.charAt(0).toUpperCase()+w.slice(1)}
  const farm=doorFindNamed(text,FARM_RE),stn=doorFindNamed(text,STATION_RE);
  if(farm.length)f.producer=farm[0];
  if(stn.length&&(!farm.length||normPlace(stn[0])!==normPlace(farm[0])))f.processor=stn[0];
  const alt=altParse(text);   // numbers, not a string — the chip below is built FROM them, so the
  if(alt){f.altitudeM=alt;f.altitude=altLabel(alt)}   // door and the record can never disagree
  const yr=text.match(/\b(20[12]\d)\b/);      if(yr)f.harvest=yr[1];
  const rst=text.match(/\b(light-medium|medium-dark|light|medium|dark)\s+roast\b/i);
  if(rst)f.roastLevel=rst[1].charAt(0).toUpperCase()+rst[1].slice(1).toLowerCase();
  const rhit=doorFindAll(text,catAll('roasters').filter(x=>x&&regSubstance(x.name)).map(x=>x.name)); // a hand the atlas already knows
  if(rhit.length)f.roaster=rhit[0];
  const first=(text.split(/\n/).map(s=>s.trim()).filter(Boolean)[0]||'').replace(/\s*[–—-]\s*$/,'');
  if(first.length>=2&&first.length<=60)f.nameGuess=first; // a suggestion for the offering's name — yours to overwrite
  return f;
}
// the unstruck facts, shaped as a record's origin. The record's one producer field carries
// farm-or-station (the six-token floor stays honest); the catalog splits the actors below.
function doorFields(){
  const f=doorParsed||{},s=doorStruck;
  const farm=(!s.producer&&f.producer)||'',stn=(!s.processor&&f.processor)||'';
  return placeSplit({originCountry:(!s.country&&f.country)||'',originRegion:(!s.region&&f.region)||'',
    originLocality:(!s.locality&&f.locality)||'', // never parsed off a paste — carried only from a pre-bound green (doorFromLot)
    producer:farm||stn,producerKind:farm?'farm':stn?'station':'',station:stn,
    variety:(!s.variety&&(f.varieties||[])[0])||'',process:(!s.process&&f.process)||'',lot:'',
    altitude:(!s.altitude&&f.altitude)||'',altitudeM:(!s.altitude&&f.altitudeM)||null,harvest:(!s.harvest&&f.harvest)||'',
    roastLevel:(!s.roastLevel&&f.roastLevel)||''});   // the run a paste printed on one line, into its columns (GEOCODE.md)
}
// lotIdentity's grain rule and lotKeyOf's ≥2-of-6 threshold, computed exactly as the save will
function doorResolve(){
  const o=doorFields();
  const n=[o.originCountry,o.originRegion,o.producer,o.variety,o.process,o.lot].filter(regSubstance).length;
  return {n,grain:lotIdentity(o).grain,shared:n>=2};

  ${(doorFrom&&doorFrom.kind==='place'
    ?[['Poured here','a cup at '+doorFrom.id,'pour'],
      ['On my shelf','it waits on the shelf','bag'],
      ['Just noting it','on the atlas, nothing kept','note']]
    :[['On my shelf','it waits on the shelf','bag'],
      ['Poured at a bar','a cup out, at that bar','pour'],

      ['Just noting it','on the atlas, nothing kept','note']]).map(b=>
    `<button class="rowlink" onclick="doorBind(${jsq(b[2])})"><span class="t">${esc(b[0])}</span><span class="m">${esc(b[1])}</span></button>`).join('')}
  <p class="note">${pre
    ?'The green stands already. The tap adds exactly one edge to it — and says, in ink, that this is the same coffee.'
    :r2.shared

// The origin-actor split (SURFACES.md, "where the farm went"): the parser told farm from
// station by vocabulary, so the catalog keeps them apart — the producers node tagged with
// its kind, a processors node on the lot's processorRefs (that kind's first write path).
// Additive and blanks-only; an unmatched name stays unclassified, never guessed into a tier.
function doorStampActors(rec,o){
  if(!rec.lotRef)return;
  if(regSubstance(o.producer)&&o.producerKind){
    const p=catByKey('producers',catNorm(o.producer)+'|'+catNorm(o.originCountry));
    if(p&&!p.producerKind){const pw=catOwn('producers',p);pw.producerKind=o.producerKind;CAT.producers.dirty=true;saveDoc('producers')}
  }
  if(regSubstance(o.station)){
    const pn=catUpsert('processors',catNorm(o.station)+'|'+catNorm(o.originCountry),{name:o.station,country:o.originCountry,region:o.originRegion,locality:o.originLocality},activeName());
    const lot=catNode('lots',rec.lotRef);
    if(pn&&lot&&!(lot.processorRefs||[]).length){const w=lotOwn(lot);w.processorRefs=[pn.id];w.updatedAt=new Date().toISOString();CAT.lots.dirty=true;saveDoc('lots')}
  }
  // the grower — the second actor's node and its edge onto the green, appended beside the
  // head's ref, never over it. The same stamp whichever surface the record entered by.
  if(regSubstance(o.grower)){
    const g=catStampGrower(o,activeName());
    const lot=g&&catNode('lots',lotFwd(rec.lotRef));
    if(g&&lot)lotAddProducerRef(lot,g.id);
  }
}
// The height the paste stated, onto the green it describes. It was already read and already shown
// as a strikeable chip; until now the bind spent it as a sentence in the notes, where nothing could
// ever read it back. This is the goal's first test — a fact entering the record at the point it was
// born, in the column that holds it. Blanks-only, and a disagreement is carried (lotSetAltitude).
function doorStampAltitude(rec,o){
  if(!rec.lotRef||!altValid(o.altitudeM))return;
  lotSetAltitude(catNode('lots',lotFwd(rec.lotRef)),o.altitudeM,activeName(),'door');
}
// The confirmed place, onto the green — run beside the other two stamps, on every surface a
// record can enter by, so a chain confirmed on a café cup teaches the atlas exactly what one
// confirmed on a bag does. Nothing happens when nobody confirmed anything (GEOCODE.md §4).
function doorStampPlace(rec,o){
  if(!rec.lotRef||!o||!o.place)return;
  lotSetPlace(catNode('lots',lotFwd(rec.lotRef)),o.place,activeName());
}
function doorBind(kind){
  if(guard())return;
  const o=doorFields(),roaster=val('d_roaster'),name=val('d_name');
  doorRoasted=val('d_roasted')||''; // the rest window's one input — the paste can never carry it
  const preBound=doorLot&&lotLive(catNode('lots',doorLot))?doorLot:null;
  const hids=preBound?[]:readHardIds('d_hid'); if(hids===false)return; // the strongest rung on the ladder, which the door used to drop on the floor
  const worthy=[o.originCountry,o.originRegion,o.producer,o.variety,o.process].some(regSubstance);
  if(!preBound&&!roaster&&!name&&!worthy){toast('Nothing to bind — a name or one fact, at least');return}
  if(kind==='note'&&!preBound&&!roaster&&!worthy){toast('A note needs a hand or a fact — a roaster, or one origin token');return} // a bare name reaches no atlas
  if(kind==='pour'){ // one edge and a reading over it — everything about the COFFEE was settled here,
    // by the same vocabulary, the same readout and the same threshold that settle it for a bag.
    // The cup form takes it as a PREFILL now, not a banner: the facts land in the fields themselves,
    // where the keeper can correct them and where an amend can read them back.
    cafeBound={roaster,name,originCountry:o.originCountry,originRegion:o.originRegion,originLocality:o.originLocality,producer:o.producer,
      producerKind:o.producerKind,station:o.station,harvest:o.harvest,variety:o.variety,process:o.process,
      lot:'',altitudeM:o.altitudeM,hardIds:hids,lotId:preBound};
    doorOn=false;
    openCafe({_door:1,shop:doorFrom&&doorFrom.kind==='place'?doorFrom.id:'',roaster,hardIds:hids});
    return;
  }
  const lvl=ROAST_LEVELS.indexOf(o.roastLevel);
  // The prose aside is empty now, and stays gone. It held the two facts the paste could read and
  // the record could not keep: the harvest (its own column, the scorer's third-heaviest — one crop
  // is not the next) and the height (doorStampAltitude, below). Both are columns; neither is a
  // sentence. The actor's kind rides on the record too — it is what the grain reads.
  const base={roaster,name,originCountry:o.originCountry,originRegion:o.originRegion,originLocality:o.originLocality,producer:o.producer,
    producerKind:o.producerKind,station:o.station,harvest:o.harvest,
    variety:o.variety,process:o.process,lot:'',roastDate:doorRoasted,roastLevel:lvl<0?0:lvl,hardIds:hids,notes:''};
  // A green walked to, not derived: bind it outright. doorFields drops the lot name, so the key alone
  // could land the record on a NEIGHBOURING green — the confirmed sighting is what makes the walk exact.
  const preBind=rec=>{const l=preBound&&catNode('lots',preBound);if(!l)return null;
    bindRecordTo(rec,catWritable('lots',l.id)||l);return {action:'auto'}};
  if(kind==='note'){ // bag-shaped, no shelf, no cup — swept exactly as a bag (it carries a roast)
    const rec={id:uid(),createdAt:new Date().toISOString(),curator:activeName(),...base};
    D.authored=D.authored||[];D.authored.push(rec);
    catStampRoaster(rec);let res=catStampLot(rec);catStampRoast(rec);
    if(preBound)res=preBind(rec);
    doorStampActors(rec,o);doorStampAltitude(rec,o);doorStampPlace(rec,o);save();atlasGeoFill(rec);
    doorOn=false;
    if(res&&res.action==='propose'&&res.propose)openLotPropose(rec.id,res.propose.lot.id,res.propose.fields);
    else if(rec.lotRef){openLotPage(rec.lotRef);toast(res&&res.action==='auto'?'Noted — folded onto a green already charted':'Noted — the green is on your atlas')}
    else{go('atlas');toast('Noted — on the record')}
    return;
  }
  // a bag on the shelf — the same save the bag form makes, retirement and all
  const nb={id:uid(),createdAt:new Date().toISOString(),archived:false,boughtAt:'',price:null,site:'',palette:null,...base};
  D.bags.push(nb);curBagId=nb.id;
  catStampRoaster(nb);let lotRes=catStampLot(nb);catStampRoast(nb);
  if(preBound)lotRes=preBind(nb);
  doorStampActors(nb,o);doorStampAltitude(nb,o);doorStampPlace(nb,o);
  if(nb.roasterRef)nb.roaster=''; // flat fields retire under a standing node, exactly as saveBag
  if(nb.lotRef)['originCountry','originRegion','originLocality','producer','variety','process','lot'].forEach(k=>nb[k]='');
  if(nb.roastRef){nb.roastLevel=0;nb.roastDate=''}
  save();setAccent(lvl<0?0:lvl);atlasGeoFill(nb);doorOn=false;
  if(kind==='brew'){go('atlas');openBrew(nb.id)}
  else{go('bags');toast('On the shelf. The first brew starts whenever you do.')}
  if(lotRes&&lotRes.action==='propose')openLotPropose(nb.id,lotRes.propose.lot.id,lotRes.propose.fields); // one uncertain candidate — ask inline while the context is warm (§4)
}

/* ---- the prefill rail — never type a country twice (UNIFIED §6).
 * Every origin field carries what the record already holds, ranked by how often
 * it holds it, with counts, one tap to fill. The rail NARROWS to what has been
 * chosen on the same screen and says so — pick Colombia and the region rail
 * reads "on file in Colombia"; pick Ethiopia and the same rail re-ranks. Two
 * rules it must keep: a rail suggests, it never constrains (the field stays
 * free text — a green from a country you have never recorded must still be
 * enterable); and a rail that would come back empty widens rather than
 * disappearing — an empty rail teaches the keeper the feature is broken.
 * Rails are painted after the inputs exist (repaintSug), never while the
 * template is being built — a rail that read the DOM mid-build would always
 * miss the values on its own screen. ---- */
const NARROW={region:'country',locality:'region',producer:'region',variety:'country',process:'country'};
// every prefixed id the origin block can emit — one row per surface, so adding a surface is one line
// the prefix rides along rather than being sliced back off the id — 'na_' (the node amend) is
// three characters, and a rail that guessed two painted the bag form's context onto it
const SUG_FIELDS=['f_','c_','a_','na_'].flatMap(p=>[[p+'country','country',p],[p+'region','region',p],[p+'locality','locality',p],[p+'producer','producer',p],[p+'variety','variety',p],[p+'process','process',p],[p+'roaster','roaster',p]])
  .concat([['d_roaster','roaster','d_']]);
function known(field,ctx){
  ctx=ctx||{};
  const all=atlasLots().map(x=>x.lot);
  const fv=(l,f)=>{const fp=l.fingerprint||{};
    return f==='country'?fp.country:f==='region'?fp.region:f==='locality'?fp.locality
      :f==='producer'?(fp.producer||((l.producerRefs||[])[0]&&(catNode('producers',l.producerRefs[0])||{}).name)||'')
      :f==='variety'?l.variety
      :f==='process'?(fp.process&&fp.process.family&&fp.process.family!=='unspecified'?sentence(fp.process.family):''):''};
  const by=NARROW[field],key=by&&ctx[by];
  let ls=all;
  // narrowed through the PLACE fold — a green filed under "Huila, Colombia" belongs to the
  // keeper who has just typed Huila, and a chip counted twice teaches the atlas holds two
  if(regSubstance(key))ls=ls.filter(l=>placeEq(fv(l,by),key));
  if(!ls.length&&regSubstance(key))ls=all; // nothing recorded under it yet — offer the wider list rather than nothing
  const m=new Map();
  const isPlace=/^(country|region|locality)$/.test(field);
  if(field==='roaster')catAll('roasters').forEach(r=>{if(r&&regSubstance(r.name)){const n=scopeGreens('roaster',r.id).length;if(n)m.set(r.name,n)}});
  else if(isPlace){ // one chip per PLACE, printed in the form the record carried most
    const by2=new Map();
    ls.forEach(l=>{const v=fv(l,field);if(!regSubstance(v))return;const k=placeFold(v);
      const g=by2.get(k)||{n:0,vals:[]};g.n++;g.vals.push(v);by2.set(k,g)});
    by2.forEach(g=>m.set(canonPlace(g.vals),g.n));
  }
  else ls.forEach(l=>{const v=fv(l,field);if(regSubstance(v))m.set(v,(m.get(v)||0)+1)});
  const rows=[...m.entries()].sort((a,b)=>b[1]-a[1]||String(a[0]).localeCompare(String(b[0]))).slice(0,6);
  return {rows,narrowedBy:regSubstance(key)&&ls.length<all.length?key:''};
}
const sugCtx=prefix=>({country:val(prefix+'country'),region:val(prefix+'region'),locality:val(prefix+'locality')});
function sugHTML(inputId,field,ctx){
  const k=known(field,ctx);
  if(!k.rows.length)return'';
  return `<span class="sug"><span class="lb">${k.narrowedBy?'on file in '+esc(k.narrowedBy):'on file'}</span>
  ${k.rows.map(([v,n])=>`<button class="s" type="button" onclick="fillSug(${jsq(inputId)},${jsq(v)})">${esc(v)}<b class="num">${n}</b></button>`).join('')}</span>`;
}
function fillSug(id,v){const el=document.getElementById(id);if(el){el.value=v;repaintSug()}}
function repaintSug(){
  SUG_FIELDS.forEach(([id,f,p])=>{const box=document.getElementById('sugbox_'+id);
    if(box)box.innerHTML=sugHTML(id,f,sugCtx(p));
    // the map rail rides the same input, one rung below: what the record holds first, then
    // what the world holds. Only the three administrative columns ask a map anything.
    if(/^(country|region|locality)$/.test(f)&&document.getElementById('mapbox_'+id))placeRail(p,f)});
}

/* Retiring is the Setup's "put away": it leaves the picker, its brews keep every

 * make its numbers unreadable — grind is only comparable within one. */
function retireSetup(id){
  if(guard())return;

  s.archived=!s.archived;s.updatedAt=new Date().toISOString();

function saveCup(kind,brewId,bagId,skip,editId){
  if(guard())return;
  if(!skip&&hedState==null&&kind==='home'){toast('A cup needs its reading — the 1–9 first. Or skip; that\'s honest too.');return}
  const ex=editId?cupById(editId):null; // edit path: keep the cup's id, place and hour; revise the rest
  const brew=brewId?D.brews.find(x=>x.id===brewId):(ex&&ex.brewId?D.brews.find(x=>x.id===ex.brewId):null);
  const fields={kind,brewId:brewId||(ex?ex.brewId:null)||null,bagId:bagId||(ex?ex.bagId:null)||null,
    shop:kind==='cafe'?val('c_shop'):null,drink:kind==='cafe'?val('c_drink'):null,
    hedonic:skip?null:hedState,descriptors:skip?[]:[...descState],notes:skip?'':val('c_notes'),
    instrumentation:kind==='cafe'?'recalled':(brew?brew.instrumentation:'measured'),blind:false,runId:null};
  let cupOrigin=null;
  if(kind==='cafe'){
    fields.city=val('c_city');fields.style=cafeStyleState;fields.roaster=val('c_roaster');
    fields.origin=(ex?ex.origin:'')||''; // the loose line a pre-6.8 cup was written with — carried, never re-asked and never wiped
    fields.price=numv('c_price');fields.again=againState;
    fields.site=(val('c_beansite')||'').trim();fields.palette=brandPalette; // the beans' brand, read from the roaster's site
    // The same origin block a bag reads, from the same helper. It used to read cafeBound||ex — but
    // the retirement below blanks those flat fields the moment a green stands, and nothing prefilled
    // them back, so every amend rewrote them empty and the cup forked onto lot:<cupId>. The form
    // reads its green node-first now (openCafe), exactly as the bag form has always done.
    cupOrigin=readOriginFields('c_',ex&&ex.hardIds); if(cupOrigin===false)return; // a false-friend hard-ID — the reason is toasted, fix or clear it
    Object.assign(fields,{originCountry:cupOrigin.originCountry,originRegion:cupOrigin.originRegion,
      originLocality:cupOrigin.originLocality,producer:cupOrigin.producer,grower:cupOrigin.grower,variety:cupOrigin.variety,process:cupOrigin.process,lot:cupOrigin.lot,
      harvest:cupOrigin.harvest,producerKind:cupOrigin.producerKind,station:cupOrigin.station,hardIds:cupOrigin.hardIds});
    if(cafeBound&&regSubstance(cafeBound.roaster)&&!regSubstance(fields.roaster))fields.roaster=cafeBound.roaster;
    if(fields.shop)regUpsert(fields.shop,{city:fields.city},activeName()); // a sighting — the café enters the Register
    if(fields.shop&&D.cafeWants){const i=D.cafeWants.findIndex(x=>normName(x)===normName(fields.shop));if(i>=0)D.cafeWants.splice(i,1)} // been now — off the want list
  }
  const firstOut=kind==='cafe'&&!ex&&!cafeCups().length;
  const firstHome=kind==='home'&&!ex&&!skip&&!D.cups.some(c=>c.kind==='home'&&c.hedonic!=null);
  let cup;
  if(ex){Object.assign(ex,fields,{updatedAt:new Date().toISOString()});cup=ex}
  else{cup={id:uid(),createdAt:new Date().toISOString(),...fields};D.cups.push(cup)}
  let lotRes=null;
  if(kind==='cafe'){catStampRoaster(cup);lotRes=catStampLot(cup); // author its roaster + lot nodes at save time, not next boot
    if(pickedLot('c_'))lotRes=bindPicked(cup,'c_'); // the keeper named the green outright — a confirmed sighting, rung 1, so no later amend can re-key the cup off it
    // the door's other facts land too — the pour path keeps everything the shelf path keeps, and now
    // so does the typed form: cupOrigin carries the same actor kind and height a paste carries
    doorStampActors(cup,cupOrigin);doorStampAltitude(cup,cupOrigin);doorStampPlace(cup,cupOrigin);
    cafeBound=null;
    if(!ex){ // new cups only — retire the flat text once a node stands to carry it (edit path untouched, so the retirement proves out on fresh saves first)
      if(cup.roasterRef)cup.roaster=''; // own surfaces read cupRoaster (node-first), the circle reads circleRoaster (flat-first-node-floor) — a friend still sees it through the group catalog
      if(cup.lotRef){const ln=catNode('lots',cup.lotRef);
        ['originCountry','originRegion','originLocality','producer','variety','process','lot'].forEach(k=>cup[k]=''); // the lot node carries the structured origin (lotRead/circleLot read through)
        if(ln&&regSubstance(ln.origin))cup.origin=''; // a loose free-text origin (no structured fields) was homed on this cup's own singleton lot → retire the flat copy too
      }
    }
    catStampPour(cup,activeName()); // the café cup is a Reading over a Pour — mint the venue availability edge
  }else{cup.prepKind='brew';cup.brewRef=cup.brewId||null} // a home cup is a Reading over its Brew
  editingCupId=null;_picked['c_']=null;
  save();closeSheet();
  if(kind==='cafe'){if(cup.shop){go('atlas');openPlace(cup.shop)}else{go('atlas')}toast(ex?'Cup updated':(firstOut?'Kept — your first cup out.':'Kept.'));}
  else{go('today');toast(ex?'Cup updated':(skip?'The brew is on the record.':firstHome?'Kept — your first cup at home. The next brew starts here.':'Kept — the next brew starts here.'));}
  if(lotRes&&lotRes.action==='propose')openLotPropose(cup.id,lotRes.propose.lot.id,lotRes.propose.fields); // one uncertain candidate — ask inline (§4). An amend that GAINS facts is exactly when it is worth asking; bindApart records a rejection, so a pair is never re-proposed.
}

async function beansLookup(){
  const u=val('c_beansite'),box=document.getElementById('beansiteresults');
  if(!u.trim()){if(box)box.innerHTML='<div class="muted small" style="padding:6px 2px">Type the roaster’s website first — then read it.</div>';return}
  if(box)box.innerHTML='<div class="muted small" style="padding:6px 2px">Reading the beans…</div>';
  try{
    const b=await readBrand(u);if(!box)return;if(!b)throw 0;
    if(b.pal){brandPalette=b.pal;brandAccent=b.pal.brand;paintBrandPreview()}
    const rEl=document.getElementById('c_roaster'); // the name it states fills the beans, if blank
    if(b.name&&rEl&&!rEl.value.trim())rEl.value=b.name;
    const nEl=document.getElementById('c_notes');   // the description fills the line, if blank
    if(b.line&&nEl&&!nEl.value.trim())nEl.value=b.line;

}

function isWant(shop){return (D.cafeWants||[]).some(x=>normName(x)===normName(shop))}

  if(was){D.cafeWants.splice(i,1);delete wa[normName(shop)]}
  else{D.cafeWants.push(String(shop).trim());wa[normName(shop)]=new Date().toISOString()}

function shopAgg(){
  const map={};
  cafeCups().filter(c=>c.shop).forEach(c=>{const k=c.shop.trim();(map[k]=map[k]||{shop:k,cups:[]}).cups.push(c)});
  return Object.values(map).map(s=>{
    const cups=s.cups;
    s.visits=cups.length;
    s.avg=avgHedonic(cups);
    s.usual=modeOf(cups.map(c=>c.drink).filter(Boolean));
    s.city=modeOf(cups.map(c=>c.city).filter(Boolean));
    s.spend=cups.reduce((a,c)=>a+(c.price||0),0);
    s.best=cups.reduce((m,c)=>Math.max(m,c.hedonic||0),0);
    s.last=cups.slice().sort(byNew)[0].createdAt;
    s.fav=isCafeFav(s.shop);
    s.profile=cafeProfile(s.shop);
    return s;
  }).sort((a,b)=>(b.fav-a.fav)||b.last.localeCompare(a.last));

async function geoFixLook(kind,id){

function geoFixSet(kind,id,lat,lon){

// The name a site states for itself, cleaned of the boilerplate page titles carry ('Home', a tagline,
// the domain). What survives the split is usually the café's own name — surfaced so you can see the
// site agrees with the shop you named.
function siteName(title){
  const parts=String(title||'').split(/\s+[|·—–]\s+|\s+-\s+/).map(s=>s.trim()).filter(Boolean);
  return parts.filter(s=>!/^(home|welcome|official(\s+site)?|coffee|caf[eé]|menu|about)$/i.test(s))[0]||parts[0]||'';
}
// One line to the ledger: a meta description, collapsed and clipped to a single legible line at a word
// boundary — never a fabricated sentence, only what the site already wrote about itself.
function siteLine(desc){
  const t=String(desc||'').replace(/\s+/g,' ').trim();
  return t.length>150?t.slice(0,147).replace(/[\s.,;:–—-]+\S*$/,'')+'…':t;
}
// One website read, shared by cafés, bags and café cups. Microlink (no key, CORS-open) reads the page;
// we take its colours (paletteFromColors, the chroma-wins signature), the name it states, and the line
// it wrote about itself — never the hotlinked image. A brand is its palette and its words: small,
// offline, portable, self-contained. Returns null offline or on a silent site; the caller falls back to
// hand entry. `host`/`logo` are for a live confirmation only, never saved.
function normSite(u){u=(u||'').trim();if(!u)return'';return /^https?:\/\//i.test(u)?u:'https://'+u}
async function readBrand(url){
  const u=normSite(url);if(!u)return null;
  let host=u;try{host=new URL(u).hostname.replace(/^www\./,'')}catch(e){}
  const r=await fetch('https://api.microlink.io/?palette&url='+encodeURIComponent(u));
  const j=await r.json();
  const d=(j&&j.data)||{},lg=d.logo||{},im=d.image||{};
  const cols=[lg.color,lg.background,...(lg.palette||[]),im.color,im.background,...(im.palette||[])].filter(Boolean);
  return {pal:paletteFromColors(cols),name:siteName(d.title),line:siteLine(d.description),logo:lg.url||'',host};
}
// A one-line read confirmation, shared by every brand lookup. `got` names what came back.
function brandReadLine(b,got){
  return `${b.logo?`<img src="${esc(b.logo)}" alt="" style="height:30px;width:auto;max-width:120px;border-radius:6px;vertical-align:middle;margin-right:8px">`:''}<span class="muted small">Read ${esc(b.host)}${b.name?` — ${esc(b.name)}`:''}${got?` — ${got}`:''}. Save to keep it.</span>`;
}
// Online café read: pull as much of a café as its website will give in one tap — its colours, the name
// it states, the line it writes — then chain the map so the address surfaces too. Fills blanks only,
// never overwriting what you typed. Progressive: offline or a silent site, and you fill it in by hand.
async function siteLookup(shop){
  const u=val('p_site'),box=document.getElementById('siteresults');
  if(!u.trim()){if(box)box.innerHTML='<div class="muted small" style="padding:6px 2px">Type the café’s website first — then read it.</div>';return}
  if(box)box.innerHTML='<div class="muted small" style="padding:6px 2px">Reading the café…</div>';
  try{
    const b=await readBrand(u);if(!box)return;if(!b)throw 0;
    if(b.pal){brandPalette=b.pal;brandAccent=b.pal.brand;paintBrandPreview()}
    const noteEl=document.getElementById('p_notes'); // the description fills the line, if you left it blank
    if(b.line&&noteEl&&!noteEl.value.trim())noteEl.value=b.line;
    const ranGeo=!val('p_address'); if(ranGeo)geoLookup(shop); // the address, from the name, without a second tap
    if(!b.pal&&!b.name&&!b.line){box.innerHTML='<div class="muted small" style="padding:6px 2px">Couldn’t read that site. Fill it in by hand — it still saves.</div>';return}
    const got=[b.pal?'its colours':null,b.line?'a line':null,ranGeo?'the map below':null].filter(Boolean).join(', ');
    box.innerHTML=brandReadLine(b,got);
  }catch(e){if(box)box.innerHTML='<div class="muted small" style="padding:6px 2px">Offline, or the site wouldn’t answer. Fill it in by hand — it still saves.</div>'}
}

/* ============ corrections — one door for amending, one for setting down ============ */
/* The same sheet for a cup, a brew, a coffee, a Setup, an authored roast: what the
 * record is, what goes with it if it goes, and the two doors. No browser dialog —
 * confirm() spoke in the operating system's voice, not the keeper's, and the one
 * place it was used it told a lie ("this cannot be undone"). See docs/CORRECTIONS.md. */
const correctRow=(k,v)=>regSubstance(v)?`<div class="kv"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`:'';
/* `down` marks a record that is already struck: its derived counts would be read
 * off the live arrays it has left, and would print zeroes that are true of the
 * ledger but a lie about the record. The carried list states them instead. */
function correctCard(coll,rec,down){
  const when=t=>t?new Date(t).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}):'';
  let rows='';
  if(coll==='cups'){const cafe=rec.kind==='cafe',b=rec.bagId?bagById(rec.bagId):null;
    rows=correctRow('Kind',cafe?'a cup out':'a cup at home')
      +correctRow(cafe?'Where':'The coffee',esc(cafe?[rec.shop,rec.city].filter(Boolean).join(' · '):(b?bagName(b):strikeCupName(rec))))
      +correctRow('Reading',rec.hedonic!=null?`<span class="num">${rec.hedonic} / 9</span>`:'<span class="unread">no reading — the brew still counted</span>')
      +correctRow('Kept',when(rec.createdAt));}
  else if(coll==='brews'){const b=rec.bagId?bagById(rec.bagId):null,s=setupById(rec.setupId),c=down?null:D.cups.find(x=>x&&x.brewId===rec.id);
    rows=correctRow('The coffee',esc(b?bagName(b):'the bag is gone — the brew remains'))
      +correctRow('The Setup',esc(s?s.name:'—'))
      +correctRow('The brew',`<span class="num">${esc(brewRecipe(rec))}</span>`)
      +(down?'':correctRow('Its cup',c?(c.hedonic!=null?`<span class="num">${c.hedonic} / 9</span>`:'kept, unread'):'<span class="unread">none — the impression was skipped</span>'))
      +correctRow('Pulled',when(rec.createdAt));}
  else if(coll==='bags'){const o=lotRead(rec),rr=roastRead(rec);
    rows=correctRow('Origin',esc([o.country,o.region,o.producer].filter(Boolean).join(' · ')))
      +correctRow('Roast',esc([rr.level,rr.roastDate&&('roasted '+rr.roastDate)].filter(regSubstance).join(' · ')))
      +(down?correctRow('On the record','set down'):correctRow('Brews',`<span class="num">${brewsOf(rec.id).length}</span>`)
        +correctRow('On the shelf',rec.archived?'put away':'yes'));}
  else if(coll==='setups'){
    rows=correctRow('The assembly',esc([rec.grinder,rec.brewer,rec.basket].filter(Boolean).join(' · ')))
      +correctRow('Water',esc(rec.water))
      +(down?correctRow('On the record','set down'):correctRow('Brews on it',`<span class="num">${setupBrews(rec.id)}</span>`));}
  else if(coll==='authored'){const o=lotRead(rec);
    rows=correctRow('Roaster',esc(rec.roaster||roasterName(rec.roasterRef)))
      +correctRow('Origin',esc([o.country,o.region,o.producer,o.variety].filter(Boolean).join(' · ')))
      +correctRow('Authored',when(rec.createdAt));}
  return rows?`<div class="card">${rows}</div>`:'';
}
// A Setup is a tool, not an event: the brews you pulled on a grinder you sold are
// still true, so a Setup with brews reading through it retires rather than goes.
const setupBrews=id=>D.brews.filter(x=>x&&x.setupId===id).length;
function openCorrect(coll,id){
  if(guard())return;
  const k=STRIKE_KINDS[coll];const rec=(D[coll]||[]).find(r=>r&&r.id===id);
  if(!k||!rec)return;
  const follows=strikeFollows(coll,id);
  const held=coll==='setups'?setupBrews(id):0;
  // a café cup's Pour is derived, not a record anyone corrects — but it is what
  // put this green on that bar's page, so say plainly that it goes too
  const pour=coll==='cups'&&rec.kind==='cafe'&&(D.pours||[]).some(p=>p&&p.id==='pour:'+id)
    ?`<div class="muted small" style="margin:2px 2px 12px">This cup is also what says that bar poured that green. That reading goes with it — and comes back with it.</div>`:'';
  const followHTML=follows.length?`<h2>What goes with it</h2>
  <div class="muted small" style="margin:0 2px 8px">Set this ${k.one} down and these go too — and come back with it, exactly this set and no more.</div>
  ${follows.map(f=>`<div class="wc-item" style="cursor:default"><span class="tx"><span class="tt">${esc(strikeName(f.coll,f.rec))}</span><span class="dd">${esc(strikeSub(f.coll,f.rec))}</span></span></div>`).join('')}`:'';
  openSheet(`
  <h3>${esc(strikeName(coll,rec))}</h3>
  <div class="sub">The record as it stands. Amend it, or set it down.</div>
  ${correctCard(coll,rec)}
  ${followHTML}
  ${pour}
  ${k.form?`<button class="btn btn-primary" onclick="correctAmend(${jsq(coll)},${jsq(id)})">Amend the record</button>`
    :`<div class="muted small" style="margin:2px 2px 12px">An authored roast has no form of its own yet — correct it by setting it down and authoring it again.</div>`}
  ${coll==='setups'&&rec.archived?`<button class="btn btn-quiet" onclick="retireSetup(${jsq(id)})">Back in the rotation</button>`:''}
  ${coll==='setups'&&!rec.archived?`<button class="btn btn-quiet" onclick="retireSetup(${jsq(id)})">Retire it — the brews stay whole</button>`:''}
  ${held?`<div class="muted small serif" style="font-style:italic;margin:8px 2px 4px">${held} brew${held===1?'':'s'} read${held===1?'s':''} through this Setup, so it cannot be set down — those readings are still true. Retire it instead: it leaves the picker, the record keeps every one of them.</div>`
    :`<button class="btn btn-quiet" onclick="strikeNow(${jsq(coll)},${jsq(id)})">Set ${esc(k.the)} down</button>
  <p class="note">Set down, not erased. It leaves every reading, every count and every map, and waits under <strong>what you have set down</strong> on the desk — whole, and one tap from coming back.</p>`}
  <button class="btn btn-quiet" onclick="closeSheet()">Close</button>`);
}
function correctAmend(coll,id){
  const k=STRIKE_KINDS[coll],rec=(D[coll]||[]).find(r=>r&&r.id===id);
  if(!k||!k.form||!rec)return;
  closeSheet();k.form(rec);
}
function strikeNow(coll,id){
  if(guard())return;
  const k=STRIKE_KINDS[coll],rec=(D[coll]||[]).find(r=>r&&r.id===id);if(!k||!rec)return;
  const n=strikeFollows(coll,id).length;
  strike(coll,id,activeName());
  if(curBagId===id)curBagId=null; // the coffee in hand can't be one you just set down
  // the overlays key on lots, roasters and shop names, never on a ledger record —
  // so the screen you were reading stays open and simply reads one record lighter
  save();closeSheet();render();
  toast(n?`Set down — with ${n} record${n===1?'':'s'} it carried.`:'Set down — it waits on the desk.');
}
function strikeRestore(ref){
  if(guard())return;
  const e=struckBy(ref);if(!e)return;
  unstrike(ref);save();closeSheet();render();toast('Back on the record, whole.');
}
function openStruckItem(ref){
  const e=struckBy(ref);if(!e)return;
  const k=STRIKE_KINDS[e.coll]||{one:'record'},carried=strikeCarried(ref);
  openSheet(`
  <h3>${esc(strikeName(e.coll,e.rec))}</h3>
  <div class="sub">Set down ${esc(fmtAgo(e.at))}${e.by?` by ${esc(e.by)}`:''}. It has left every reading; nothing about it is lost.</div>
  ${correctCard(e.coll,e.rec,true)}
  ${carried.length?`<h2>Carried with it</h2>

/* A sighting is the shared record's own line, and it was the model the whole
 * strike grammar was built from — signed, dated, struck-not-deleted. What it
 * never had was the sheet. A withdrawal fired on a tap, said nothing about what
 * the reading would become, and could not be taken back: "sight it again" mints
 * a new line, it does not stand the old one up. So the sighting now answers the
 * same verbs every record does — amend, set down, put back — with the one
 * difference stated out loud: a sighting is never erased. Every other keeper
 * holds a copy, the merge is a union by id, and a line deleted here would simply
 * return on the next sync. Struck is the strongest honest answer. */

/* ============ export / import ============ */
function exportJSON(){
  // Bundle the whole spine into the copy so it stands alone. A retired origin/roaster/roast
  // lives only on its catalog node now, so a copy opened on a device that never synced would
  // read blanks without it. The catalog is a shared group document (catSeed sweeps every
  // ledger into it), so exporting it whole is faithful to what it is; import folds it back.
  const catalog={};CAT_KINDS.forEach(k=>{catalog[k]={version:1,entries:CAT[k].entries,deleted:CAT[k].deleted}});
  const out={...D,catalog,exportedAt:new Date().toISOString(),user:viewingUser().name,schema:'carta-phase0-v1'};
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const slug=viewingUser().name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'ledger';
  a.download=`carta-ledger-${slug}-${today()}.json`;a.click();URL.revokeObjectURL(a.href);
  toast('Ledger exported');
}

/* ---- the ledger export — the reader-facing copy (carta.ledger/v1) ----
 * One self-contained HTML file on CARTA paper stock: the reader's own overlay
 * — readings, shelf, brews, cups out, saves, signed pages — never the shared
 * page's compiled numbers. Real token hexes are inlined (the one sanctioned
 * place tokens resolve to literals — the file must stand alone), and the
 * machine-readable record travels inside it as JSON. The download panel is
 * the guarantee: a real anchor the reader clicks, allowed even where
 * programmatic downloads are blocked. Its twin, read-back, proves the schema
 * is open — parsed, validated, read aloud, never merged. */
let exportedFile=null;
function ledgerData(){
  const cups=D.cups.slice().sort(byNew);
  const line=c=>c.notes||((c.descriptors||[]).length?c.descriptors.join(' · '):'');
  const when=t=>t?new Date(t).toLocaleDateString([],{month:'short',day:'numeric'}):'';
  const readings=cups.filter(c=>c.hedonic!=null).map(c=>{
    if(c.kind==='cafe')return {coffee:[c.drink||'a cup',c.shop].filter(Boolean).join(' at '),where:'out',
      road:['out',cupRoaster(c),(lotRead(c)||{}).country].filter(Boolean).join(' · '),hedonic:c.hedonic,when:when(c.createdAt),line:line(c)};
    const b=bagById(c.bagId),br=c.brewId&&D.brews.find(x=>x.id===c.brewId);
    return {coffee:b?bagName(b):'a coffee',where:'home',
      road:['home',br&&br.technique,br&&(setupById(br.setupId)||{}).brewer].filter(Boolean).join(' · '),hedonic:c.hedonic,when:when(c.createdAt),line:line(c)};
  });
  const grainOf=b=>{if(!b.lotRef)return 'unresolved';const l=catNode('lots',lotFwd(b.lotRef));const gr=l&&grainRead(l.grain);return gr?gr[0].toLowerCase():'unresolved'};
  const shelf=D.bags.filter(b=>!b.archived).sort(byNew).map(b=>{
    const scored=brewsOf(b.id).map(x=>({brew:x,cup:D.cups.find(c=>c.brewId===x.id)})).filter(x=>x.cup&&x.cup.hedonic!=null).sort((a,c)=>c.cup.hedonic-a.cup.hedonic)[0];
    return {coffee:bagName(b),resolution:grainOf(b),
      reading:scored?{hedonic:String(scored.cup.hedonic),recipe:brewRecipe(scored.brew),line:line(scored.cup)}:null};
  });
  const cupsOut=cafeCups().slice().sort(byNew).map(c=>({place:c.shop||'a café',city:c.city||'',
    cup:[when(c.createdAt),c.drink||c.style||'a cup'].filter(Boolean).join(' · '),
    reading:(c.hedonic!=null?c.hedonic+' / 9':'kept')+(c.again===true?' · again':'')}));
  const wa=getPref('wantAt',{})||{};
  const saved=(D.cafeWants||[]).map(w=>({place:w,city:(regByName(w)||{}).city||'',
    saved:wa[normName(w)]?when(wa[normName(w)]):'before the record kept dates',state:'unvisited — no cup of yours here yet'}));
  const me=activeName();
  const signedPages=[];
  regEntries().forEach(e=>{if(e&&e.signed&&e.signed.at&&e.signed.by===me){
    const corr=Object.entries(e.penFacts||{}).map(([f,c])=>({field:f,value:c.v}));
    signedPages.push({page:e.name,kind:'cafe',corrections:corr})}});
  CAT.roasters.entries.forEach(r=>{if(r&&r.signed&&r.signed.at&&r.signed.by===me){   // pages YOU signed — your own document
    const corr=Object.entries(r.penFacts||{}).map(([f,c])=>({field:f,value:c.v}));
    signedPages.push({page:r.name,kind:'roaster',corrections:corr})}});
  const firstAt=[...D.cups,...D.brews,...D.bags].map(x=>x&&x.createdAt).filter(Boolean).sort()[0];
  const home=cups.filter(c=>c.kind==='home'&&c.hedonic!=null),out=cups.filter(c=>c.kind==='cafe'&&c.hedonic!=null);
  const R={total:readings.length,coffees:shelf.length,
    since:firstAt?new Date(firstAt).toLocaleDateString('en-US',{month:'long',year:'numeric'}):'',
    avg:avgHedonic(cups.filter(c=>c.hedonic!=null))||'—',home:avgHedonic(home)||'—',out:avgHedonic(out)||'—'};
  const g=new Date(),iso=g.toISOString(),ym=iso.slice(0,7);
  const slug=(viewingUser().name||'ledger').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return {filename:`carta-ledger-${slug}-${ym}.html`,generatedISO:iso,
    generatedHuman:g.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}),
    record:R,readings,shelf,cupsOut,saved,signedPages};
}

function readLedgerFile(ev){

// Fold an imported catalog into the device's spine, then heal the imported ledger's refs.
// A copy carries the whole atlas (exportJSON); bringing it in unions it into the local spine
// kind by kind — the same merge sync runs (by id, then collapse entries sharing a _key). That
// collapse can retire an imported node id in favour of a co-keyed local one; a retired record
// keys off its ref, not flat text, so before the merge can strand it we note each imported id's
// _key, then re-point any now-dangling ref to whichever id survived. Marks a kind dirty only
// when the fold actually changed it, so a synced device pushes the gain (the atlas is the
// group's) and a re-import is a clean no-op. No catalog in the file (an older export) → nothing
// to fold; the ledger's own flat text and refs stand, and catSeed/catRepoint re-derive at import.
function foldCatalog(catIn,led){
  if(!catIn||!led)return;
  const wasKey={};   // kind → (imported id → _key), captured before the merge collapses ids
  CAT_KINDS.forEach(kind=>{
    const inc=catIn[kind]; if(!inc||!Array.isArray(inc.entries))return;
    wasKey[kind]={};inc.entries.forEach(e=>{if(e&&e.id&&e._key)wasKey[kind][e.id]=e._key});
    const canon=mergeCatalog({entries:CAT[kind].entries,deleted:CAT[kind].deleted},{entries:[],deleted:[]}); // local, canonicalised, for an honest change test
    const merged=mergeCatalog({entries:CAT[kind].entries,deleted:CAT[kind].deleted},{entries:inc.entries,deleted:inc.deleted||[]});
    if(JSON.stringify(merged)!==JSON.stringify(canon))CAT[kind].dirty=true;
    CAT[kind].entries=merged.entries;CAT[kind].deleted=merged.deleted;saveDoc(kind);
  });
  const survivor={};CAT_KINDS.forEach(kind=>{survivor[kind]={};CAT[kind].entries.forEach(e=>{if(e._key)survivor[kind][e._key]=e.id})});
  const heal=(rec,k,kind)=>{const id=rec[k];if(!id||catNode(kind,id))return; // absent, or still resolves → leave it
    const key=wasKey[kind]&&wasKey[kind][id],to=key&&survivor[kind]&&survivor[kind][key];if(to)rec[k]=to};
  (led.bags||[]).forEach(b=>{if(b){heal(b,'roasterRef','roasters');heal(b,'lotRef','lots');heal(b,'roastRef','roasts')}});
  (led.cups||[]).forEach(c=>{if(c&&c.kind==='cafe'){heal(c,'roasterRef','roasters');heal(c,'lotRef','lots')}});
}

/* Optional server sync. Offline-first: localStorage stays the source of truth;

const remoteKey=id=>'carta.remote.'+id;

let syncBusy=false,pushTimer=null,syncState='idle',remoteStale=false;   // idle|syncing|offline|auth

/* merge: union by record id per collection; edited records carry updatedAt and
 * the newer one wins (ties → local). Tombstones in `deleted` subtract removed
 * cups so a removal survives merging. Output is canonical (sorted) so both
 * devices converge on an identical serialization. */
function mergeColl(loc,rem){
  const m=new Map();(rem||[]).forEach(r=>m.set(r.id,r));
  (loc||[]).forEach(l=>{const r=m.get(l.id);if(!r||((l.updatedAt||'')>=(r.updatedAt||'')))m.set(l.id,l)});
  return [...m.values()].sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||'')||String(a.id).localeCompare(String(b.id)));
}
function mergeLedgers(loc,rem){
  if(!rem)return loc;
  const out=clone(blank);
  const dead=new Map();[...(rem.deleted||[]),...(loc.deleted||[])].forEach(t=>dead.set(t.id,t));
  out.deleted=[...dead.values()].sort((a,b)=>String(a.id).localeCompare(String(b.id)));
  // the strikes merge first: a record set down on one device leaves the live
  // collections on every device, and its body rides the entry so any of them can
  // put it back (docs/CORRECTIONS.md)
  out.struck=mergeStruck(loc.struck,rem.struck).filter(s=>!dead.has(s.ref));
  // the holds merge the same way and subtract nothing here: a hold is a
  // subtraction from the SNAPSHOT, never from the record (READER.md L4)
  out.holds=mergeHolds(loc.holds,rem.holds).filter(h=>!dead.has(h.ref));
  // `down` is derived every merge, never persisted as a tombstone: a strike must
  // stay undoable, and a tombstone is the one thing that cannot be taken back. A
  // struck café cup's pour is held down the same way, by its own strike entry.
  const down=new Set();
  out.struck.filter(strikeStands).forEach(s=>{down.add(s.ref);if(s.pour)down.add(s.pour.id)});
  ['setups','bags','brews','cups','pours','cafes','authored'].forEach(k=>out[k]=mergeColl(loc[k],rem[k]).filter(r=>!dead.has(r.id)&&!down.has(r.id)));
  const f=new Map();[...(rem.cafeFavs||[]),...(loc.cafeFavs||[])].forEach(x=>f.set(String(x).toLowerCase(),x));
  out.cafeFavs=[...f.values()].sort((a,b)=>a.localeCompare(b));
  const w=new Map();[...(rem.cafeWants||[]),...(loc.cafeWants||[])].forEach(x=>w.set(String(x).toLowerCase(),x));
  out.cafeWants=[...w.values()].sort((a,b)=>a.localeCompare(b));
  // prefs merge shallow, local key wins — one keeper on two devices settles on
  // the last push, and a merge no longer wipes the signal, the skips, the leans
  out.prefs={...(rem.prefs||{}),...(loc.prefs||{})};
  out.version=loc.version||1;
  out.createdAt=[loc.createdAt,rem.createdAt].filter(Boolean).sort()[0]||out.createdAt;
  return out;
}

/* Register merge: union by id, newer updatedAt wins — then collapse entries
 * that name the same café from different devices (same name, different ids):
 * the newest-amended entry stands, blanks fill from the rest, the earliest
 * provenance is kept. Both sides run the same collapse, so they converge.
 * Sightings never race: they union by id across every copy, and every date on a
 * line (withdrawn, restored, superseded) only ever adds — deterministic, no
 * conflicts by construction. The reach then recompiles from the merged record. */
/* The strikes merge like the sightings, for the same reason: both dates only
 * ever add, so max(at) and max(restoredAt) are order-free and both devices land
 * on the same answer. The body travels with the newer strike, so whichever
 * device holds the record last is the one whose copy comes back. A strike entry
 * deliberately carries no updatedAt — nothing reads one, and an unmerged field
 * would leave the two sides byte-different for no gain. */
function mergeStruck(...lists){
  const m=new Map();
  lists.flat().filter(s=>s&&s.ref).forEach(s=>{
    const p=m.get(s.ref);
    if(!p){m.set(s.ref,{...s,id:s.id||'strike:'+s.ref});return}
    if(String(s.at||'')>String(p.at||''))Object.assign(p,{at:s.at,by:s.by,coll:s.coll,rec:s.rec,via:s.via,pour:s.pour});
    if(String(s.restoredAt||'')>String(p.restoredAt||''))p.restoredAt=s.restoredAt;
  });

/* Withdrawal and restore take the MAX of their own date, independently — the
 * construction mergeStruck uses, and for the same reason: liveness is
 * withdrawnAt > restoredAt, so an earliest-strike-wins rule would let a stale
 * withdrawal outrank the restore that undid it, and a re-strike could never
 * take. Both dates only ever add, so max/max is order-free and both devices land
 * on the same answer. supersededAt keeps the earliest — it has no undo, so once
 * a line is answered it stays answered, whichever copy saw it first. */
function mergeSightings(...lists){
  const m=new Map();
  lists.flat().filter(s=>s&&s.id).forEach(s=>{
    const p=m.get(s.id);
    if(!p){m.set(s.id,{...s});return}
    if(String(s.withdrawnAt||'')>String(p.withdrawnAt||''))p.withdrawnAt=s.withdrawnAt;
    if(String(s.restoredAt||'')>String(p.restoredAt||''))p.restoredAt=s.restoredAt;
    if(s.supersededAt&&(!p.supersededAt||s.supersededAt<p.supersededAt))p.supersededAt=s.supersededAt;
  });

}
// Union an append-only, id-keyed line list — the mergeHardIds move with no strike semantics,
// for lists whose lines only ever accumulate (the altitude divergences).
const mergeById=(...ls)=>{const m=new Map();
  ls.flat().filter(x=>x&&x.id).forEach(x=>{if(!m.has(x.id))m.set(x.id,{...x})});
  return [...m.values()].sort((a,b)=>String(a.at||'').localeCompare(String(b.at||''))||String(a.id).localeCompare(String(b.id)))};
// The lot's hard-ID set unions across devices exactly as sightings do — append-only, union by id,
// a strike (withdrawnAt) only ever adds. Two keepers each entering a token on the same green both
// stand; a bind is never lost in a merge. Deterministic, no conflicts by construction (RESOLVER §1).
function mergeHardIds(...lists){
  const m=new Map();
  lists.flat().filter(h=>h&&h.id).forEach(h=>{const p=m.get(h.id);
    if(!p){m.set(h.id,{...h});return}
    if(h.withdrawnAt&&(!p.withdrawnAt||h.withdrawnAt<p.withdrawnAt))p.withdrawnAt=h.withdrawnAt;
  });

}
function mergeRegister(loc,rem){
  // Same id on both sides: newer updatedAt wins; on a tie the copy carrying
  // more substance stands (a collapse fills fields without touching updatedAt,
  // so the filled copy must beat its thinner twin), then bytes break the tie —
  // deterministic either way, so both sides converge.
  const fuller=e=>Object.keys(e).filter(k=>regSubstance(e[k])).length;
  const beats=(l,r)=>{const lu=l.updatedAt||'',ru=r.updatedAt||'';if(lu!==ru)return lu>ru;
    const lf=fuller(l),rf=fuller(r);if(lf!==rf)return lf>rf;

  // which copy wins the field race — the same monotone rule mergeSightings uses
  const strikeDates=(w,...g)=>{['withdrawnAt','restoredAt'].forEach(k=>{
    const v=g.map(e=>String((e&&e[k])||'')).filter(Boolean).sort().pop();if(v)w[k]=v})};
  const m=new Map();((rem&&rem.entries)||[]).forEach(r=>m.set(r.id,r));

    if(l.sightings||r.sightings)w.sightings=mergeSightings(l.sightings||[],r.sightings||[]);
    strikeDates(w,l,r);
    m.set(l.id,w)});
  const groups={};
  [...m.values()].filter(e=>e&&e.name&&!dead.has(e.id)).forEach(e=>{const k=normName(e.name);(groups[k]=groups[k]||[]).push(e)});
  const entries=Object.keys(groups).sort().map(k=>{
    const g=groups[k].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')||String(a.id).localeCompare(String(b.id)));
    const w={...g[0]};
    g.slice(1).forEach(e=>{
      Object.keys(e).forEach(f=>{if(!regSubstance(w[f])&&regSubstance(e[f]))w[f]=e[f]});
      if(e.firstAt&&(!w.firstAt||e.firstAt<w.firstAt)){w.firstAt=e.firstAt;w.firstBy=e.firstBy||w.firstBy}

/* Catalog merge: the Register's law, keyed on _key instead of name. Union by id
 * (newer updatedAt wins; a tie breaks to substance, then bytes, so both sides
 * converge), sightings union and never race, then collapse entries that share a
 * _key but were born on different devices — the same node seeded twice — keeping
 * the earliest provenance. _key is the deterministic dedup the seed already used,
 * so the two copies of one node always land together; a ledger ref left dangling
 * by the collapse re-points next boot through the same _key. */
function mergeCatalog(loc,rem){
  // the set-down's two dates only ever add, so each takes the max independently of which
  // copy won the field race — mergeSightings' monotone rule, one kind up
  const downDates=(w,...g)=>{const d={};['at','restoredAt'].forEach(k=>{
      const v=g.map(e=>String((e&&e.setDown&&e.setDown[k])||'')).filter(Boolean).sort().pop();if(v)d[k]=v});
    if(d.at){const src=g.find(e=>e&&e.setDown&&e.setDown.at===d.at)||{};
      w.setDown={...(src.setDown||{}),...d}}};
  const fuller=e=>Object.keys(e).filter(k=>regSubstance(e[k])).length;
  const beats=(l,r)=>{const lu=l.updatedAt||'',ru=r.updatedAt||'';if(lu!==ru)return lu>ru;
    const lf=fuller(l),rf=fuller(r);if(lf!==rf)return lf>rf;

    if(l.sightings||r.sightings)w.sightings=mergeSightings(l.sightings||[],r.sightings||[]);
    if(l.hardIds||r.hardIds)w.hardIds=mergeHardIds(l.hardIds||[],r.hardIds||[]); // the identity set unions — a bind is never lost to the winner
    if(l.altitudeAlt||r.altitudeAlt)w.altitudeAlt=mergeById(l.altitudeAlt||[],r.altitudeAlt||[]); // a divergence recorded on one device is not lost to the other's copy — the seam is the point
    if(l.placeAlt||r.placeAlt)w.placeAlt=mergeById(l.placeAlt||[],r.placeAlt||[]);               // the same seam, one column over: two devices placing one green differently keep both readings
    // the actor edges union too — bare-id arrays a newer edit would otherwise silently drop:
    // a grower ref appended on one device must survive the other device's later save
    if(l.producerRefs||r.producerRefs)w.producerRefs=[...new Set([...(l.producerRefs||[]),...(r.producerRefs||[])])];
    if(l.processorRefs||r.processorRefs)w.processorRefs=[...new Set([...(l.processorRefs||[]),...(r.processorRefs||[])])];
    downDates(w,l,r);
    m.set(l.id,w)});
  const groups={};
  // grouped by the FOLDED key, so two devices that spelled one name differently — an accent,
  // a comma, a capital — collapse into one node here exactly as they do on the device (keyFold)
  [...m.values()].filter(e=>e&&e._key&&!dead.has(e.id)).forEach(e=>{const k=keyFold(e._key)||e._key;(groups[k]=groups[k]||[]).push(e)});
  const entries=Object.keys(groups).sort().map(k=>{
    const g=groups[k].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||'')||String(a.id).localeCompare(String(b.id)));
    const w={...g[0]};
    g.slice(1).forEach(e=>{
      Object.keys(e).forEach(f=>{if(!regSubstance(w[f])&&regSubstance(e[f]))w[f]=e[f]});
      if(e.firstAt&&(!w.firstAt||e.firstAt<w.firstAt)){w.firstAt=e.firstAt;w.firstBy=e.firstBy||w.firstBy}
    });
    const sg=mergeSightings(...g.map(e=>e.sightings||[]));
    if(sg.length)w.sightings=sg;
    const hg=mergeHardIds(...g.map(e=>e.hardIds||[])); // two devices seeding one node both carry their tokens
    if(hg.length)w.hardIds=hg;
    const ag=mergeById(...g.map(e=>e.altitudeAlt||[]));
    if(ag.length)w.altitudeAlt=ag;
    const plg=mergeById(...g.map(e=>e.placeAlt||[]));
    if(plg.length)w.placeAlt=plg;
    const pg=[...new Set(g.flatMap(e=>e.producerRefs||[]))]; // the collapse keeps every actor edge its members carried
    if(pg.length)w.producerRefs=pg;
    const xg=[...new Set(g.flatMap(e=>e.processorRefs||[]))];
    if(xg.length)w.processorRefs=xg;
    downDates(w,...g);
    return w;
  });

}
// The Register rides the same heartbeat as the ledger: poll meta, pull + merge
// when the server moved, push while dirty (409 → merge, retry). The push goes
// through the founder's pen — a non-founder pulls only (their local additions
// stay on their device), and a 403 pen-held teaches an older session which
// side of the pen it is on. Older servers without /api/cafes answer 404 and
// are skipped; the Register then stays device-local, still useful.
function penRefused(r){ // a 403 from a shared-doc PUT — learn it, stop pushing
  if(r.status!==403)return false;

}
async function syncRegister(){
  const meta=await api('/api/cafes?meta=1');
  if(meta.status!==200)return;
  if(meta.body.rev>REG.rev){
    const full=await api('/api/cafes');
    if(full.status===200&&full.body.register){
      const merged=mergeRegister({entries:REG.entries,deleted:REG.deleted},full.body.register);
      REG.rev=full.body.rev;REG.entries=merged.entries;REG.deleted=merged.deleted;
      REG.dirty=JSON.stringify(merged)!==JSON.stringify({entries:full.body.register.entries||[],deleted:full.body.register.deleted||[]});
      saveReg();

  if(SYNC&&SYNC.founder===false){if(REG.dirty){REG.dirty=false;saveReg()}return} // read-only side of the pen
  let tries=0;
  while(REG.dirty&&tries<3){
    tries++;
    const r=await api('/api/cafes','PUT',{baseRev:REG.rev,register:{version:1,entries:REG.entries,deleted:REG.deleted}});
    if(r.status===200){REG.rev=r.body.rev;REG.dirty=false;saveReg()}
    else if(r.status===409){
      const merged=mergeRegister({entries:REG.entries,deleted:REG.deleted},r.body.register||{});
      REG.rev=r.body.rev;REG.entries=merged.entries;REG.deleted=merged.deleted;saveReg();
    }
    else if(penRefused(r)){REG.dirty=false;saveReg();break}
    else break;
  }
}
// The catalog rides the same heartbeat as the Register, one document per kind:
// poll each kind's meta, pull + merge when the server moved, push while dirty
// (409 → merge, retry). Writes go through the founder's pen exactly as the
// Register's do — a non-founder pulls only. An older server 404s /api/catalog
// and the whole spine stays device-local, exactly as the Register degrades —
// the atlas is still useful offline.
async function syncCatalog(){
  for(const kind of CAT_KINDS){
    const doc=CAT[kind];
    const meta=await api('/api/catalog/'+kind+'?meta=1');
    if(meta.status!==200)return;   // old server (404) — the endpoint is absent, skip the spine
    if(meta.body.rev>doc.rev){
      const full=await api('/api/catalog/'+kind);
      if(full.status===200&&full.body.catalog){
        const merged=mergeCatalog({entries:doc.entries,deleted:doc.deleted},full.body.catalog);
        doc.rev=full.body.rev;doc.entries=merged.entries;doc.deleted=merged.deleted;
        doc.dirty=JSON.stringify(merged)!==JSON.stringify({entries:full.body.catalog.entries||[],deleted:full.body.catalog.deleted||[]});
        saveDoc(kind);
      }
    }
    if(SYNC&&SYNC.founder===false){if(doc.dirty){doc.dirty=false;saveDoc(kind)}continue} // read-only side of the pen
    let tries=0;
    while(doc.dirty&&tries<3){
      tries++;
      const r=await api('/api/catalog/'+kind,'PUT',{baseRev:doc.rev,catalog:{version:1,entries:doc.entries,deleted:doc.deleted}});
      if(r.status===200){doc.rev=r.body.rev;doc.dirty=false;saveDoc(kind)}
      else if(r.status===409){
        const merged=mergeCatalog({entries:doc.entries,deleted:doc.deleted},r.body.catalog||{});
        doc.rev=r.body.rev;doc.entries=merged.entries;doc.deleted=merged.deleted;saveDoc(kind);
      }
      else if(penRefused(r)){doc.dirty=false;saveDoc(kind);break}
      else break;
    }
  }
}

}

/* ============ the reader's copy — how it arrives, and how it stays honest ============ */
/* The same three moments as sync — boot, `online`, and `visibilitychange` to
 * visible — one UNAUTHENTICATED ?meta=1 read, and a full pull only when the rev
 * moved. A reader who never reconnects reads the copy they have, forever, and
 * the Desk says how old it is. Offline-first is unchanged: the stored copy
 * stands whole with the network off, the fetch is never blocking, and there is
 * never a spinner in front of the record. */
const pubBase=u=>String(u||'').replace(/\/+$/,'');
// No headers at all: a bodyless GET that sets Content-Type turns every read of
// a stranger's atlas into a CORS preflight round-trip, for nothing.
async function pubGet(url,path){
  const r=await fetch(pubBase(url)+path);
  return {status:r.status,body:await r.json().catch(()=>null)};
}
async function pubSync(manual,url){
  url=url||(PUB&&PUB.url)||PUBLIC_ATLAS;
  if(!url||pubBusy)return false;
  pubBusy=true;pubState='checking';if(manual)render();
  try{
    const meta=await pubGet(url,'/api/public?meta=1');
    if(meta.status===404){pubState='missing';if(manual)toast('Nothing is published from that address yet');return false}
    if(meta.status!==200){pubState='offline';if(manual)toast('That address did not answer with an atlas');return false}
    const same=PUB&&PUB.url===pubBase(url)&&PUB.rev===meta.body.rev&&PUB.atlas;
    if(same){PUB.fetchedAt=new Date().toISOString();PUB.counts=meta.body.counts||PUB.counts;savePub();pubState='idle';
      if(manual)toast('This is the newest copy');return true}
    const full=await pubGet(url,'/api/public');
    if(full.status!==200||!full.body||!full.body.atlas){pubState='offline';if(manual)toast('The copy could not be read');return false}
    PUB={url:pubBase(url),rev:full.body.rev,publishedAt:full.body.publishedAt,publishedBy:full.body.publishedBy,
      counts:meta.body.counts||null,fetchedAt:new Date().toISOString(),atlas:full.body.atlas};
    savePub();catBust();pubState='idle';
    if(manual)toast(`The atlas is here — revision ${PUB.rev}`);
    return true;
  }catch(e){pubState='offline';if(manual)toast('Offline — this copy stands');return false}
  finally{pubBusy=false;if(manual)render()}
}

function pubFromHash(){

  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));}
const fmtDist=km=>km==null?'':km<1?`${Math.round(km*1000)} m`:km<10?`${km.toFixed(1)} km`:`${Math.round(km)} km`;

function tasteAffinity(){
  const myAvg={};
  cafeCups().forEach(c=>{if(c.shop&&c.hedonic!=null){const k=normName(c.shop);(myAvg[k]=myAvg[k]||[]).push(c.hedonic)}});
  Object.keys(myAvg).forEach(k=>myAvg[k]=myAvg[k].reduce((a,b)=>a+b,0)/myAvg[k].length);
  const out=[];
  circleSources().forEach(s=>{const d=circleLedger(s);if(!d)return;
    const theirs={};(d.cups||[]).forEach(c=>{if(c.kind==='cafe'&&c.shop&&c.hedonic!=null){const k=normName(c.shop);(theirs[k]=theirs[k]||[]).push(c.hedonic)}});
    const shared=Object.keys(theirs).filter(k=>myAvg[k]!=null);
    if(shared.length<2)return;
    let sum=0;shared.forEach(k=>{const t=theirs[k].reduce((a,b)=>a+b,0)/theirs[k].length;sum+=Math.abs(t-myAvg[k])});
    const delta=sum/shared.length;
    out.push({src:s.id,name:s.name,shared:shared.length,delta,
      close:delta<=1?'close':delta<=2?'near':'differs',w:Math.max(0,1-delta/4)});
  });
  return out.sort((a,b)=>a.delta-b.delta);
}
function affinityOf(srcId){
  if(!_affCache)_affCache=Object.fromEntries(tasteAffinity().map(a=>[a.src,a.w]));
  return _affCache[srcId]!=null?_affCache[srcId]:0;
}
// beans worth chasing — roasters and origins the circle scored, best average first.
function circleBeans(){
  const m={};
  circleCups().forEach(c=>{const o=circleLot(c);const label=(circleRoaster(c)||o.origin||o.country||'').trim();
    if(!label||c.hedonic==null)return;const k=normName(label);
    (m[k]=m[k]||{label,cups:[],who:new Set()});m[k].cups.push(c);m[k].who.add(c._who)});
  return Object.values(m).map(b=>({label:b.label,n:b.cups.length,avg:avgHedonic(b.cups),people:[...b.who]}))
    .sort((a,b)=>(Number(b.avg)||0)-(Number(a.avg)||0)||b.n-a.n);
}
// worth the walk, for you — cafés you haven't kept, ranked by the circle's scores
// weighted toward the people whose taste is close to yours; near mode sorts by
// distance and register-only pins join the tail as pure discovery.
function recommendations(){
  const mine=new Set(cafeCups().map(c=>normName(c.shop)).filter(Boolean));
  const byShop={};
  circleCups().filter(c=>c.shop).forEach(c=>{const k=normName(c.shop);(byShop[k]=byShop[k]||{shop:c.shop.trim(),cups:[]}).cups.push(c)});
  const recs=[];
  Object.values(byShop).forEach(p=>{
    if(mine.has(normName(p.shop)))return;
    const prof=circleProfile(p.shop);
    const city=modeOf(p.cups.map(c=>c.city).filter(Boolean))||(prof&&prof.city)||'';
    if(!inLens(city))return;
    let ws=0,wsum=0;const raters={};
    p.cups.forEach(c=>{if(c.hedonic==null)return;const a=affinityOf(c._src),w=.5+.5*a;ws+=c.hedonic*w;wsum+=w;
      if(!raters[c._who]||c.hedonic>raters[c._who].h)raters[c._who]={h:c.hedonic,a}});
    if(!wsum)return;
    const best=Object.entries(raters).map(([who,v])=>({who,...v})).sort((x,y)=>y.h-x.h)[0];
    recs.push({shop:p.shop,city,profile:prof,n:p.cups.length,avg:avgHedonic(p.cups),score:ws/wsum,
      dist:distTo(prof),best,again:p.cups.filter(c=>c.again===true).length});
  });
  regEntries().forEach(e=>{const k=normName(e.name);if(mine.has(k)||byShop[k])return;if(!inLens(e.city||''))return;
    if(nearOn&&e.lat==null)return;
    recs.push({shop:e.name,city:e.city||'',profile:e,n:0,avg:null,score:0,dist:distTo(e),best:null,again:0,reg:true})});
  return recs.sort((a,b)=>{
    if(nearOn){const da=a.dist==null?1e9:a.dist,db=b.dist==null?1e9:b.dist;if(da!==db)return da-db}
    return (b.score-a.score)||(b.n-a.n);
  });
}
// free-text across the whole pooled record — places, beans, and single cups.
function circleSearch(q){
  const toks=normName(q).split(/\s+/).filter(Boolean);
  if(!toks.length)return null;
  const match=s=>toks.every(t=>s.includes(t));
  const hay=c=>{const o=circleLot(c);return normName([c.shop,c.city,c.drink,c.style,circleRoaster(c),o.origin,o.country,o.region,o.variety,o.producer,o.process,c._who,(c.descriptors||[]).join(' '),c.notes].filter(Boolean).join(' '))};
  const cups=circleCups().filter(c=>match(hay(c)));
  const places=circlePlaces(cups);
  const regHits=regEntries().filter(e=>match(normName([e.name,e.city,e.neighborhood,e.notes,...(e.tags||[])].filter(Boolean).join(' '))))
    .filter(e=>!places.some(p=>normName(p.shop)===normName(e.name)));
  const beans=circleBeans().filter(b=>match(normName(b.label)));
  return {cups,places,regHits,beans};
}

// The map for a set of search results — real pins, scaled to fit; filled for a
// place you keep, dashed for one you don't. Names only; the row carries the rest.
function searchMapPoints(places,regHits){
  const mineSet=new Set(cafeCups().map(c=>normName(c.shop)));
  const pts=[];
  places.forEach(p=>{const pr=p.profile;if(pr&&pr.lat!=null)pts.push({name:p.shop,lat:pr.lat,lon:pr.lon,read:mineSet.has(normName(p.shop))})});
  regHits.forEach(e=>{if(e.lat!=null)pts.push({name:e.name,lat:e.lat,lon:e.lon,read:mineSet.has(normName(e.name))})});
  return pts;
}
function circleResultsHTML(q){
  const r=circleSearch(q);if(!r)return'';
  const{places,regHits,cups,beans}=r;
  if(!places.length&&!regHits.length&&!cups.length&&!beans.length)
    return `<div class="empty">Nothing on the record for "${esc(q)}". Try a city, a roaster, or a place.</div>`;
  let h='';
  if(places.length||regHits.length){
    h+=`<div class="section-head"><h2>Places</h2><span class="n-note">n=${places.length+regHits.length}</span></div>`+places.slice(0,8).map(placeCard).join('')+regHits.slice(0,6).map(regCard).join('');

  return h;
}

// Keep the stream current: re-pull the directory and any ledger whose rev moved.
// Throttled, quiet, and offline-safe — the cached copies simply stand.
let circleBusy=false,circleFreshAt=0;
async function circleRefresh(){
  if(!SYNC||!SYNC.token||circleBusy||Date.now()-circleFreshAt<60e3)return;
  circleBusy=true;circleFreshAt=Date.now();
  let changed=false;
  try{
    const dir=await api('/api/users');
    if(dir.status===200){
      if(JSON.stringify(dir.body.users)!==JSON.stringify(remoteDir().users))changed=true;
      localStorage.setItem(DIR_KEY,JSON.stringify({fetchedAt:new Date().toISOString(),users:dir.body.users}));
    }
    for(const u of remoteDirUsers()){
      const c=readJSONLS(remoteKey(u.id));
      const meta=await api(`/api/ledgers/${u.id}?meta=1`);
      if(meta.status!==200||(c&&c.rev===meta.body.rev))continue;
      const full=await api(`/api/ledgers/${u.id}`);
      if(full.status===200&&full.body.ledger){
        cacheRemote(u.id,{rev:full.body.rev,updatedAt:full.body.updatedAt,fetchedAt:new Date().toISOString(),ledger:full.body.ledger});changed=true;
      }
    }
  }catch(e){/* offline or signed out — the cached stream stands */}
  finally{circleBusy=false}
  if(changed)regSeed(); // fresh ledgers may carry cafés the Register hasn't met
  if(changed&&tab==='circle'&&!document.getElementById('sheet').classList.contains('open')&&document.activeElement!==document.getElementById('circleSearch'))render();
}

/* ============ today + the matching ============ */
/* The Today surface and the matching behind it. Spec v1 — three weight
 * classes: trait 60 · proximity 20 · circle 20. The traits are argued by the
 * places you keep (and the three you name to start — the signal); proximity
 * only counts once you've said where you stand (in memory, never stored);
 * the circle's cups weigh in through affinity. Every number carries its
 * reasons — no score without its signals — and until three café cups are
 * kept the reading speaks in bands, not numbers. A save waits under Want to
 * go; a skip steps a place back for two weeks and fades on its own — never a
 * veto; "fewer like it" tips the place's kind down on the same curve. The
 * bookkeeping lives in per-user prefs, so it exports and syncs. */
const SKIP_DAYS=14,LEAN_DAYS=14,FADE_DAYS=21;
const daysSince=iso=>iso?(Date.now()-new Date(iso))/864e5:null;
const agoWord=iso=>{const d=Math.floor(daysSince(iso)??0);return d<=0?'today':d===1?'yesterday':d<7?d+' days ago':d<14?'a week ago':Math.round(d/7)+' weeks ago'};
const reducedMotion=()=>!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let _mCache=null;
const mCache=()=>_mCache||(_mCache={});
function signalPicks(){const s=getPref('signal',null);return(s&&s.picks)||[]}
const coldNow=()=>!readOnly()&&!signalPicks().length&&!shopAgg().length; // no cups out, nothing named — the matching has nothing to read
const lowConf=()=>cafeCups().length<3;                                   // the early read — bands, not numbers
// what a place argues for itself: its tags. (The reach is set down — a graph-derived
// read of the same signals, from pours and grain, can land here later.)
function candTraits(e){return e?[...(e.tags||[])]:[]}
// the signal — {tagNorm:{label,w,from}}; every trait remembers the place that argued it
function signalTraits(){
  const c=mCache();if(c.sig)return c.sig;
  const m={};
  const add=(t,w,from)=>{const k=normName(t);if(!k)return;const x=m[k]||(m[k]={label:t,w:0,from});x.w+=w};
  signalPicks().forEach(p=>candTraits(regByName(p.name)).forEach(t=>add(t,2,`like ${p.name} — a place you named`)));
  shopAgg().forEach(s=>{const good=(Number(s.avg)||0)>=6;
    candTraits(regByName(s.shop)).forEach(t=>add(t,good?2:1,`like ${s.shop} — ${good?`your ${s.avg}/9 room`:'a place you keep'}`))});
  return c.sig=m;
}
function circByShop(){
  const c=mCache();if(c.circ)return c.circ;
  const m={};
  circleCups().forEach(x=>{if(x.shop&&x.hedonic!=null){const k=normName(x.shop);(m[k]=m[k]||[]).push(x)}});
  return c.circ=m;
}
function activeLeans(){
  const L=getPref('traitLeans',{})||{};
  return Object.keys(L).map(k=>({tag:k,...L[k],age:daysSince(L[k].at)})).filter(l=>l.age<FADE_DAYS).sort((a,b)=>a.age-b.age);
}
function skipInfo(shop){
  const rec=(getPref('placeSkips',{})||{})[normName(shop)];if(!rec)return null;
  const age=daysSince(rec.at);if(age>=FADE_DAYS)return null; // fully faded — no trace on the surfaces (the Record showed it going)
  return{...rec,age,active:age<SKIP_DAYS,back:age>=SKIP_DAYS};
}
const matchBand=s=>s>=84?'a strong read':s>=70?'promising':'worth a look';
function matchOf(shop){
  const c=mCache();c.m=c.m||{};const key=normName(shop);
  if(c.m[key])return c.m[key];
  const e=regByName(shop),sig=signalTraits(),traits=candTraits(e);
  const hits=[],seen=new Set();
  traits.forEach(t=>{const k=normName(t),s=sig[k];
    if(s&&!seen.has(k)){seen.add(k);hits.push({label:t,w:Math.min(3,s.w),from:s.from})}});
  hits.sort((a,b)=>b.w-a.w);
  const t=Math.round(60*Math.min(1,hits.reduce((a,h)=>a+h.w,0)/6));
  const km=distTo(e);
  const p=km==null?0:Math.round(20*Math.max(0,1-km/3.2));
  const oc=circByShop()[key]||[];
  const circ=Math.min(20,8+oc.reduce((a,x)=>a+2+4*affinityOf(x._src),0));
  let adj=0;const leans=[];
  activeLeans().forEach(l=>{if(l.age<LEAN_DAYS&&traits.some(x=>normName(x)===l.tag)){adj-=Math.round(8*(1-l.age/LEAN_DAYS));leans.push(l.label)}});
  adj=Math.max(adj,-18); // three leans of a kind is the cap — further skips deepen nothing
  const score=Math.round(Math.max(20,Math.min(97,t+p+circ+adj)));
  const signals=hits.slice(0,4).map(h=>({label:h.label,from:h.from}));

function discCands(){

  const lc=lowConf();

  const avgOn=(field,v)=>{if(!v)return null;const hits=myCups.filter(c=>{const r=lotRead(c)||{};return (r[field]||'').toLowerCase()===v.toLowerCase()});
    return hits.length>=2?{avg:(hits.reduce((a,c)=>a+c.hedonic,0)/hits.length).toFixed(1),n:hits.length}:null};
  const keptShops=new Set(cafeCups().map(c=>normName(c.shop||'')).filter(Boolean));
  const why=x=>{const fp=x.lot.fingerprint||{};const reasons=[];let num=null;
    const co=avgOn('country',fp.country||''),pr=avgOn('process',(fp.process&&fp.process.family)||'');
    if(co){reasons.push(`you average ${co.avg} on ${fp.country} cups · n=${co.n}`);num=co.avg}
    else if(pr){reasons.push(`you average ${pr.avg} on ${fp.process.family} lots · n=${pr.n}`);num=pr.avg}
    const at=(D.pours||[]).find(p=>p&&p.lotRef===x.id&&p.shop&&keptShops.has(normName(p.shop)));
    if(at)reasons.push(`poured at ${at.shop}, a place you keep`);
    if(x.hands>=2)reasons.push(`${x.hands} roasters carry it`);
    return {reasons,num:lc?null:num}};
  const mine=new Set(D.bags.map(b=>b&&b.lotRef?lotFwd(b.lotRef):null).filter(Boolean));
  return atlasLots().map(x=>({...x,w:why(x)})).filter(x=>x.w.reasons.length)
    .sort((a,b)=>(b.w.num||0)-(a.w.num||0)||b.hands-a.hands||(mine.has(a.id)?1:0)-(mine.has(b.id)?1:0))
    .slice(0,n||2);
}

function recordKeepingHTML(){

    .sort((a,b)=>b.m.score-a.m.score);
  const wantsHTML=rows.length?`<div class="muted small serif" style="font-style:italic;margin:0 2px 10px">Ordered by match, not the calendar — the age shows anyway.</div>
    ${rows.map(w=>{const pal=palOf(w.e),vars=pal?cafeVars(pal):'';
      return`<div class="card tap shopcard"${vars?` style="${vars}"`:''} onclick="openPlace(${jsq(w.n)})">

        <div style="display:flex;gap:16px;margin-top:7px;align-items:baseline">
          <button class="text-action" onclick="event.stopPropagation();letGoWant(${jsq(w.n)})">Let it go</button>
          <button class="text-action" onclick="event.stopPropagation();keepWaiting(${jsq(w.n)})">${w.ask.n===0?'It stays — one last ask in four weeks':'It stays — no more asks'}</button>
        </div>`
        :readOnly()?'':`<div style="display:flex;gap:16px;margin-top:7px;align-items:baseline">
          <button class="text-action" onclick="event.stopPropagation();openPlace(${jsq(w.n)})">Why this →</button>
          <button class="text-action" style="margin-left:auto" onclick="event.stopPropagation();letGoWant(${jsq(w.n)})">Let it go</button>
        </div>`}
      </div>`}).join('')}
    <div class="muted small serif" style="font-style:italic;margin:0 2px 4px">Letting go is not a skip — no mark against the place; it simply stops waiting.</div>`
    :`<div class="empty">Nothing waiting. A save — from the map, the list, a café's page — lands here.</div>`;
  const S=getPref('placeSkips',{})||{};
  const skipRows=Object.values(S).map(rec=>{const info=skipInfo(rec.name);if(!info)return null;
    const dLeft=Math.max(1,Math.ceil(SKIP_DAYS-info.age));
    return info.active
      ?`<div class="gtab"><span class="nm num" style="width:58px">${dLeft}d left</span><span class="ds">${esc(rec.name)} — skipped ${agoWord(rec.at)}; fades in ${dLeft} day${dLeft===1?'':'s'}</span>${readOnly()?'':`<button class="text-action" style="flex:none" onclick="discUnskip(${jsq(rec.name)})">clear now</button>`}</div>`
      :`<div class="gtab"><span class="nm num" style="width:58px">faded</span><span class="ds">${esc(rec.name)} — the skip faded; it is back in the results, read again</span></div>`;
  }).filter(Boolean).join('');
  const skips=`<div class="section-head"><h2>Standing skips</h2></div>
    ${skipRows||`<div class="empty">No standing skips. A skip quiets a place for two weeks, waits here, and fades on its own.</div>`}
    <div class="muted small serif" style="font-style:italic;margin:6px 2px 0">A skip steps a place back — never its kind. When you want fewer of a kind, say so at the moment you skip.</div>`;
  const leansList=activeLeans();
  const leanRows=leansList.map(l=>{const active=l.age<LEAN_DAYS,dLeft=Math.max(1,Math.ceil(LEAN_DAYS-l.age));
    return active
      ?`<div class="gtab"><span class="nm num" style="width:58px">${dLeft}d left</span><span class="ds">${esc(l.label)} places weigh less — from skipping ${esc(l.from)}; fades in ${dLeft} day${dLeft===1?'':'s'}</span>${readOnly()?'':`<button class="text-action" style="flex:none" onclick="clearLean(${jsq(l.tag)})">clear now</button>`}</div>`
      :`<div class="gtab"><span class="nm num" style="width:58px">faded</span><span class="ds">${esc(l.label)} — the lean faded; full weight again</span></div>`}).join('');
  const cap=leansList.filter(l=>l.age<LEAN_DAYS).length>=3?`<div class="muted small serif" style="font-style:italic;margin:4px 2px 0">Three leans of a kind is the cap — further skips deepen nothing.</div>`:'';
  const leans=`<div class="section-head"><h2>Standing trait leans</h2></div>
    ${leanRows||`<div class="empty">No standing leans. "Fewer like it" tips a kind down for two weeks — it fades on the same curve as a skip.</div>`}${cap}`;
  return`<div class="section-head"><h2>Want to go</h2><span class="n-note num">${wants.length?'n='+wants.length:''}</span></div>`+wantsHTML+skips+leans;
}
